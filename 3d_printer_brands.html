// ===== Canvas =====
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
let landPolygons=[]; // array of [lng,lat][] polygons
let mapLoaded=false;

// Mercator
function geoToCanvas(lat,lng){
  const x=(lng+180)/360*W;
  const lr=lat*Math.PI/180;
  const mn=Math.log(Math.tan(Math.PI/4+lr/2));
  const y=H/2-(mn/Math.PI)*H/2;
  return[x,y];
}

// Load world map from Natural Earth 110m TopoJSON
async function loadMap(){
  try{
    const resp=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');
    const topo=await resp.json();
    // Decode TopoJSON arcs
    const {arcs,transform}=topo;
    const objects=topo.objects;
    // Find the land geometry
    const landObj=objects.land||Object.values(objects)[0];
    
    // Decode arcs to absolute coordinates
    function decodeArc(arc){
      const points=[];
      let x=0,y=0;
      for(const [dx,dy] of arc){
        x+=dx; y+=dy;
        points.push([x,y]);
      }
      return points;
    }
    
    function arcToGeo(arc){
      const decoded=decodeArc(arc);
      return decoded.map(([px,py])=>{
        if(transform){
          return[px*transform.scale[0]+transform.translate[0], py*transform.scale[1]+transform.translate[1]];
        }
        return[px/10,py/10]; // fallback
      });
    }
    
    // Convert TopoJSON geometry to polygons
    function toPolygons(geom){
      const polys=[];
      function stitchRing(arcIndices){
        const pts=[];
        arcIndices.forEach(idx=>{
          const arcPts=decodeArc(arcs[idx<0?~idx:idx]);
          if(idx<0) arcPts.reverse();
          // Deduplicate shared point with previous arc
          if(pts.length>0&&arcPts.length>0){
            const last=pts[pts.length-1],first=arcPts[0];
            if(Math.abs(last[0]-first[0])<0.01&&Math.abs(last[1]-first[1])<0.01) arcPts.shift();
          }
          pts.push(...arcPts);
        });
        return arcToGeo(pts);
      }
      if(geom.type==='Polygon'){
        geom.arcs.forEach(ring=>polys.push(stitchRing(ring)));
      }else if(geom.type==='MultiPolygon'){
        geom.arcs.forEach(polygon=>polygon.forEach(ring=>polys.push(stitchRing(ring))));
      }
      return polys;
    }
    
    landPolygons=toPolygons(landObj);
    mapLoaded=true;
    document.getElementById('loadingOverlay').style.display='none';
    draw();
  }catch(e){
    console.error('Failed to load map:',e);
    // Fallback: use simplified hand-drawn polygons
    useFallback();
  }
}

// ===== State =====
let activeFilters={region:'all',level:'all'};
let selectedBrand=null;
let hoveredBrand=null;
let markerPositions=[];

function getLevelColor(b){
  if(b.levels.includes('industrial'))return'#ef4444';
  if(b.levels.includes('pro'))return'#3b82f6';
  return'#22c55e';
}
function isVisible(b){
  if(activeFilters.region!=='all'&&b.region!==activeFilters.region)return false;
  if(activeFilters.level!=='all'&&!b.levels.includes(activeFilters.level))return false;
  return true;
}
function getClusterPositions(){
  const c={};
  brands.forEach(b=>{const k=`${b.lat.toFixed(1)},${b.lng.toFixed(1)}`;if(!c[k])c[k]={lat:b.lat,lng:b.lng,brands:[]};c[k].brands.push(b);});
  return Object.values(c);
}

// ===== Draw =====
function draw(){
  ctx.clearRect(0,0,W,H);

  // Ocean background gradient
  const oceanGrad=ctx.createLinearGradient(0,0,0,H);
  oceanGrad.addColorStop(0,'#0c4a6e');
  oceanGrad.addColorStop(0.5,'#075985');
  oceanGrad.addColorStop(1,'#0c4a6e');
  ctx.fillStyle=oceanGrad;ctx.fillRect(0,0,W,H);

  // Graticule
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=0.5;
  for(let lat=-60;lat<=80;lat+=20){ctx.beginPath();for(let lng=-180;lng<=180;lng+=2){const[x,y]=geoToCanvas(lat,lng);lng===-180?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();}
  for(let lng=-180;lng<=180;lng+=30){ctx.beginPath();for(let lat=-80;lat<=84;lat+=2){const[x,y]=geoToCanvas(lat,lng);lat===-80?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();}

  // Land fill
  landPolygons.forEach(poly=>{
    if(poly.length<3)return;
    ctx.beginPath();
    poly.forEach(([lng,lat],i)=>{const[x,y]=geoToCanvas(lat,lng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.closePath();
    ctx.fillStyle='#0f2847';ctx.fill();
  });
  // Subtle inner glow for depth
  landPolygons.forEach(poly=>{
    if(poly.length<3)return;
    ctx.beginPath();
    poly.forEach(([lng,lat],i)=>{const[x,y]=geoToCanvas(lat,lng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.closePath();
    ctx.strokeStyle='#1e3a5f';ctx.lineWidth=0.4;ctx.stroke();
  });
  // Coastline highlight
  landPolygons.forEach(poly=>{
    if(poly.length<3)return;
    ctx.beginPath();
    poly.forEach(([lng,lat],i)=>{const[x,y]=geoToCanvas(lat,lng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.closePath();
    ctx.strokeStyle='#4a7ab5';ctx.lineWidth=1.5;ctx.stroke();
  });

  // Brand markers
  markerPositions=[];
  const clusters=getClusterPositions();
  clusters.forEach(cl=>{
    const[cx,cy]=geoToCanvas(cl.lat,cl.lng);
    const vis=cl.brands.some(b=>isVisible(b));
    const isCN=cl.brands[0].region==='cn';
    if(cl.brands.length>1){
      cl.brands.forEach((b,i)=>{
        const angle=(i/cl.brands.length)*Math.PI*2-Math.PI/2;
        const bx=cx+Math.cos(angle)*20,by=cy+Math.sin(angle)*20;
        const bv=isVisible(b);
        ctx.globalAlpha=bv?1:0.12;
        const lc=isCN?'#f59e0b':getLevelColor(b);
        // Glow
        const g=ctx.createRadialGradient(bx,by,0,bx,by,14);g.addColorStop(0,lc+'50');g.addColorStop(1,lc+'00');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,14,0,Math.PI*2);ctx.fill();
        // Dot
        const isH=hoveredBrand&&hoveredBrand.id===b.id;
        ctx.fillStyle=lc;ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(bx,by,isH?6:4,0,Math.PI*2);ctx.fill();ctx.stroke();
        // Label on hover
        if(isH){ctx.fillStyle='#e2e8f0';ctx.font='600 11px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(b.name.split(' ')[0],bx,by-10);}
        markerPositions.push({brand:b,x:bx,y:by,r:10});
        ctx.globalAlpha=1;
      });
      // Badge
      ctx.globalAlpha=vis?1:0.12;
      const br=cl.brands.length>=6?18:15;
      ctx.fillStyle=isCN?'#f59e0b':'#1a73e8';ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,br,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.font=`bold ${br>=18?13:11}px -apple-system,sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(cl.brands.length.toString(),cx,cy);
      ctx.fillStyle='#64748b';ctx.font='500 10px -apple-system,sans-serif';ctx.fillText(cl.brands[0].city,cx,cy-br-8);
      markerPositions.push({brand:null,cluster:cl,x:cx,y:cy,r:br+4});
      ctx.globalAlpha=1;
    }else{
      const b=cl.brands[0],bv=isVisible(b),sel=selectedBrand&&selectedBrand.id===b.id,hov=hoveredBrand&&hoveredBrand.id===b.id;
      ctx.globalAlpha=bv?1:0.12;
      const dc=isCN?'#f59e0b':getLevelColor(b);
      const gr=sel?24:hov?20:14;
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,gr);g.addColorStop(0,dc+(sel?'80':'50'));g.addColorStop(1,dc+'00');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,gr,0,Math.PI*2);ctx.fill();
      const dr=sel?8:hov?7:5;
      ctx.fillStyle=dc;ctx.strokeStyle='#fff';ctx.lineWidth=sel?2.5:1.5;
      ctx.beginPath();ctx.arc(cx,cy,dr,0,Math.PI*2);ctx.fill();ctx.stroke();
      if(sel){ctx.strokeStyle=dc+'60';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.stroke();}
      if(sel||hov){ctx.fillStyle='#e2e8f0';ctx.font='600 12px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(b.name.split(' ')[0],cx,cy-12);}
      markerPositions.push({brand:b,x:cx,y:cy,r:dr+4});
      ctx.globalAlpha=1;
    }
  });
}

// ===== Mouse =====
function getMousePos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
function findHit(mx,my){for(let i=markerPositions.length-1;i>=0;i--){const m=markerPositions[i],dx=mx-m.x,dy=my-m.y;if(dx*dx+dy*dy<m.r*m.r)return m;}return null;}

canvas.addEventListener('mousemove',e=>{
  const p=getMousePos(e),hit=findHit(p.x,p.y),tip=document.getElementById('tooltip');
  if(hit){
    canvas.style.cursor='pointer';
    if(hit.cluster){const bs=hit.cluster.brands;
      tip.innerHTML=`<div class="tooltip-name">${hit.cluster.brands[0].city}</div><div class="tooltip-city">${bs.length} 个品牌</div><div class="tooltip-tags">${bs.map(b=>`<span class="tooltip-tag ${b.region}">${b.name.split(' ')[0]}</span>`).join('')}</div>`;
      hoveredBrand=null;
    }else if(hit.brand){const b=hit.brand;
      tip.innerHTML=`<div class="tooltip-name">${b.name.split(' ')[0]}</div><div class="tooltip-city">${b.city} · ${b.en}</div><div class="tooltip-tags"><span class="tooltip-tag ${b.region}">${b.region==='cn'?'中国':b.region==='us'?'北美':'欧洲'}</span>${b.levels.map(l=>`<span class="tooltip-tag ${l}">${l==='consumer'?'消费级':l==='pro'?'专业级':'工业级'}</span>`).join('')}</div>`;
      hoveredBrand=b;
    }
    const r=canvas.getBoundingClientRect(),sx=r.width/W,sy=r.height/H;
    let tx=hit.x*sx+15,ty=hit.y*sy-10;
    if(tx+260>r.width)tx=hit.x*sx-275;
    tip.style.left=tx+'px';tip.style.top=ty+'px';tip.classList.add('show');
  }else{canvas.style.cursor='default';hoveredBrand=null;tip.classList.remove('show');}
  draw();
});
canvas.addEventListener('mouseleave',()=>{hoveredBrand=null;document.getElementById('tooltip').classList.remove('show');draw();});
canvas.addEventListener('click',e=>{const p=getMousePos(e),hit=findHit(p.x,p.y);if(hit){if(hit.brand)showDetail(hit.brand);else if(hit.cluster&&hit.cluster.brands.length)showDetail(hit.cluster.brands[0]);}});

  selectedBrand=b;
  const isCN=b.region==='cn';
  document.getElementById('panelHeader').style.background=`linear-gradient(135deg,${b.color},${isCN?'#d97706':'#1d4ed8'})`;
  document.getElementById('panelName').textContent=b.name;
  document.getElementById('panelEn').textContent=b.en;
  document.getElementById('panelCity').innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ${b.city}`;
  const lt=b.levels.map(l=>`<span class="panel-tag ${l}">${l==='consumer'?'消费级':l==='pro'?'专业级':'工业级'}</span>`).join('');

  document.getElementById('panelOverlay').classList.add('show');
  draw();
}
function closePanel(){document.getElementById('detailPanel').classList.remove('show');document.getElementById('panelOverlay').classList.remove('show');selectedBrand=null;draw();}

function renderTable(){
  const cn=brands.filter(b=>b.region==='cn'&&isVisible(b)),intl=brands.filter(b=>b.region!=='cn'&&isVisible(b));
  function row(b){
    const lt=b.levels.map(l=>`<span class="level level-${l}">${l==='consumer'?'消费级':l==='pro'?'专业级':'工业级'}</span>`).join(' ');
    const tt=b.techs.map(t=>{const c=t.toLowerCase().replace(/\s/g,'');if(['fff','fdm','cff','bfp','lfm','ebm','3d扫描','uv'].includes(c))return`<span class="tag tag-fff">${t}</span>`;if(['sla','mjp'].includes(c))return`<span class="tag tag-sla">${t}</span>`;if(['slm'].includes(c))return`<span class="tag tag-slm">${t}</span>`;if(['sls','saf','bmd'].includes(c))return`<span class="tag tag-sls">${t}</span>`;if(['polyjet'].includes(c))return`<span class="tag tag-pj">${t}</span>`;if(['dlp'].includes(c))return`<span class="tag tag-dlp">${t}</span>`;return`<span class="tag tag-fdm">${t}</span>`;}).join('');

    return`<tr data-id="${b.id}"><td><div class="brand-cell"><div class="brand-icon" style="background:linear-gradient(135deg,${b.color},${b.color}dd)">&#9679;</div><div><div class="brand-name">${b.name}</div><div class="brand-en">${b.en}</div></div></div></td><td><div class="city">${b.city}</div></td><td>${lt}</td><td><div style="display:flex;flex-wrap:wrap;gap:6px">${tt}</div></td><td><div class="product-list">${pi}</div></td></tr>`;

  document.querySelectorAll('#tableContent tbody tr').forEach(tr=>{tr.addEventListener('click',()=>{const b=brands.find(x=>x.id===tr.dataset.id);if(b)showDetail(b);});});
}

document.querySelectorAll('.filter-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  const f=btn.dataset.filter,v=btn.dataset.value;activeFilters[f]=v;
  document.querySelectorAll(`.filter-btn[data-filter="${f}"]`).forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  draw();renderTable();
});});

// ===== View Toggle =====
document.querySelectorAll('.view-btn').forEach(btn=>{btn.addEventListener('click',()=>{
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const v=btn.dataset.view;document.getElementById('mapView').style.display=v==='map'?'block':'none';
  document.getElementById('tableView').classList.toggle('show',v==='table');
});});

document.getElementById('panelClose').addEventListener('click',closePanel);
document.getElementById('panelOverlay').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

// ===== Init =====
loadMap();
renderTable();
</script>
</body>
</html>
