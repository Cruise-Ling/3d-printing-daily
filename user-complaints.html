const EMOJI = { '非常负面': '🔴', '负面': '🟡', '中性': '⚪', '正面': '🟢', '非常正面': '⭐' };

let filtered = OVERSEAS_FEEDBACK_DATA.items;

function render() {
  // Stats
  const stats = OVERSEAS_FEEDBACK_DATA.stats.sentiment;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-card"><span class="stat-label">总记录</span><span class="stat-value">' + OVERSEAS_FEEDBACK_DATA.items.length + '</span></div>' +
    Object.keys(stats).map(function(k){
      return '<div class="stat-card"><span class="stat-label">' + EMOJI[k] + ' ' + k + '</span><span class="stat-value">' + stats[k] + '</span></div>';
    }).join('') +
    '<div class="stat-card"><span class="stat-label">模式</span><span class="stat-value">' + (OVERSEAS_FEEDBACK_DATA.mode === 'accumulate' ? '累积' : '滚动') + '</span></div>';

  // Filters
  var sents = Object.keys(stats);
  var sentHtml = '<button class="filter-btn active" onclick="setFilter(\'all\')">全部</button>';
  sents.forEach(function(s){
    sentHtml += '<button class="filter-btn" data-sentiment="' + s + '" onclick="setFilter(\'' + s + '\')">' + EMOJI[s] + ' ' + s + ' (' + stats[s] + ')</button>';
  });
  document.getElementById('filters').innerHTML = sentHtml;

  // Cards
  var grid = document.getElementById('cardGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-msg">没有符合筛选条件的用户点评</div>';
    return;
  }
  var html = '';
  filtered.forEach(function(item) {
    var emoji = EMOJI[item.sentiment] || '⚪';
    var tags = '';
    (item.problemPoints || []).slice(0,3).forEach(function(p){ tags += '<span class="tag' + (item.isP0 ? ' p0' : '') + '">' + p + '</span>'; });
    if (item.isP0) tags += '<span class="tag p0">⚠️高风险</span>';
    // Show summaryCn or translation
    var detail = item.summaryCn || item.translation || '';
    if (detail.length > 120) detail = detail.slice(0, 117) + '…';
    html += '<div class="review-card">' +
      '<div class="card-header">' +
        '<span class="sentiment-tag sentiment-' + item.sentiment + '">' + emoji + ' ' + item.sentiment + '</span>' +
        '<span class="brand-line">' + item.brand + '</span>' +
        '<span class="model">' + (item.modelName || '') + '</span>' +
      '</div>' +
      '<div class="platform">📌 ' + (item.platform || '') + (item.country ? ' · ' + item.country : '') + '</div>' +
      '<div class="summary">' + detail + '</div>' +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      '<div class="meta">' +

        '<span class="date">📅 ' + item.date + (item.publishedAt ? ' · ' + item.publishedAt : '') + '</span>' +
      '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
}

function setFilter(sentiment) {
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  if (sentiment === 'all') {
    document.querySelector('.filter-btn').classList.add('active');
    filtered = OVERSEAS_FEEDBACK_DATA.items;
  } else {
    document.querySelector('button[data-sentiment="' + sentiment + '"]').classList.add('active');
    filtered = OVERSEAS_FEEDBACK_DATA.items.filter(function(i){ return i.sentiment === sentiment; });
  }
  render();
}

render();
</script>
