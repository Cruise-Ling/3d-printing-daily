<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 打印软件用户使用专栏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2128;--bd:#21262d;--bd2:#30363d;
  --tx:#e6edf3;--tx2:#c9d1d9;--mu:#8b949e;--mu2:#6e7681;
  --blue:#58a6ff;--blue2:#1f6feb;--green:#3fb950;--red:#f85149;--yellow:#d29922;--purple:#bc8cff;
}
body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;padding:0 0 64px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* 预热期条 */
.prewarm{background:linear-gradient(90deg,#2d2410,#1a1607);border-bottom:1px solid #4d3b00;padding:9px 24px;font-size:12.5px;color:#e3b341;text-align:center}
.prewarm b{color:#ffd666}

header{padding:28px 0 16px;border-bottom:1px solid var(--bd)}
.htop{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
h1{font-size:25px;font-weight:700;letter-spacing:-.3px}
.badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.b-blue{background:rgba(88,166,255,.12);color:var(--blue);border:1px solid rgba(88,166,255,.3)}
.b-yel{background:rgba(210,153,34,.13);color:var(--yellow);border:1px solid rgba(210,153,34,.4)}
.b-red{background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.32)}
.b-grn{background:rgba(63,185,80,.12);color:var(--green);border:1px solid rgba(63,185,80,.32)}
.sub{color:var(--mu);font-size:13px;margin-top:8px;line-height:1.7}
.sub b{color:var(--tx2);font-weight:600}

.upd{display:flex;align-items:center;gap:9px;margin-top:15px;padding:9px 14px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-size:12.5px;color:var(--mu);flex-wrap:wrap}
.upd b{color:var(--tx2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(63,185,80,.15);flex:none}
.dot.y{background:var(--yellow);box-shadow:0 0 0 3px rgba(210,153,34,.15)}
.upd .hist{margin-left:auto;color:var(--mu2);cursor:pointer;border-bottom:1px dashed var(--bd2)}
.upd .hist:hover{color:var(--blue)}
#updHist{display:none;margin-top:8px;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--mu)}
#updHist.on{display:block}
#updHist div{padding:3px 0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 0}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:15px 16px}
.kpi .l{font-size:12px;color:var(--mu);margin-bottom:7px}
.kpi .v{font-size:27px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.kpi .v small{font-size:14px;color:var(--mu2);font-weight:600}
.kpi .d{font-size:11.5px;color:var(--mu2);margin-top:6px;line-height:1.5}
.kpi .v.rd{color:var(--red)}
.kpi .v.ye{color:var(--yellow)}

/* 区块 */
section{margin-top:28px}
.sh{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.sh h2{font-size:15.5px;font-weight:650}
.sh .tag{font-size:11px;color:var(--mu2);border:1px solid var(--bd2);border-radius:4px;padding:1px 6px}
.sh .note{font-size:12px;color:var(--mu2);margin-left:auto}

/* 版本矩阵 */
.mxwrap{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px 16px 12px;overflow-x:auto}
.mx{display:grid;gap:4px;min-width:720px}
.mx .hd{font-size:10.5px;color:var(--mu);text-align:center;padding:0 2px 7px;line-height:1.35;align-self:end}
.mx .hd.rh{text-align:right;padding-right:6px}
.mx .rl{font-size:11.5px;color:var(--tx2);text-align:right;padding-right:6px;display:flex;align-items:center;justify-content:flex-end;gap:5px;font-variant-numeric:tabular-nums}
.mx .rl .ver{font-weight:600;cursor:pointer}
.mx .rl .ver:hover{color:var(--blue)}
.mx .rl .cnt{color:var(--mu2);font-size:10.5px}
.cell{height:42px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;cursor:pointer;transition:.13s;position:relative;font-variant-numeric:tabular-nums}
.cell:hover{transform:scale(1.06);box-shadow:0 0 0 1.5px var(--blue);z-index:3}
.cell.on{box-shadow:0 0 0 2px var(--blue)}
.c0{background:rgba(255,255,255,.025);color:#30363d;cursor:default}
.c1{background:rgba(88,166,255,.13);color:#8fbcff}
.c2{background:rgba(88,166,255,.27);color:#b6d5ff}
.c3{background:rgba(210,153,34,.28);color:#f0c860}
.c4{background:rgba(248,81,73,.3);color:#ffa39a}
.c5{background:rgba(248,81,73,.52);color:#ffd6d2}
.cell.regress{box-shadow:0 0 0 2px var(--red)}
.cell .flag{position:absolute;top:-6px;right:-4px;font-size:9px;background:var(--red);color:#fff;border-radius:3px;padding:0 4px;font-weight:700}
.legend{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid var(--bd);font-size:11px;color:var(--mu2);flex-wrap:wrap}
.lg{width:19px;height:10px;border-radius:2px;display:inline-block}
.legend .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.legend .sp i{width:11px;height:11px;border-radius:3px;box-shadow:0 0 0 2px var(--red) inset;display:inline-block}

/* 双栏 + 条 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:15px 17px}
.panel .ph{font-size:13px;font-weight:650;color:var(--tx2);margin-bottom:13px;display:flex;align-items:center;gap:8px}
.panel .ph span{font-size:11px;color:var(--mu2);font-weight:400;margin-left:auto}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer}
.bar:last-child{margin-bottom:0}
.bar.on .nm{color:var(--blue);font-weight:600}
.bar .nm{width:126px;font-size:12px;color:var(--tx2);flex:none;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:19px;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:3px;transition:.2s;background:linear-gradient(90deg,#1f6feb,#58a6ff)}
.bar:hover .fl{filter:brightness(1.25)}
.bar .vv{width:40px;font-size:12px;font-weight:600;color:var(--tx2);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.bar .pc{width:38px;font-size:11px;color:var(--mu2);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.tip{font-size:11.5px;color:var(--mu2);margin-top:11px;padding-top:10px;border-top:1px dashed var(--bd);line-height:1.65}

/* 筛选 */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:22px 0 0;padding:13px 15px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.fg{display:flex;align-items:center;gap:6px}
.fg label{font-size:11.5px;color:var(--mu2)}
select,.fbtn{background:var(--card2);color:var(--tx2);border:1px solid var(--bd2);border-radius:6px;padding:5px 9px;font-size:12px;font-family:inherit;cursor:pointer;outline:none}
select:hover,.fbtn:hover{border-color:#484f58}
select:focus{border-color:var(--blue)}
.fbtn.on{background:rgba(88,166,255,.14);color:var(--blue);border-color:rgba(88,166,255,.45)}
.filters .sp{margin-left:auto;display:flex;gap:7px}
#searchBox{background:var(--card2);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);padding:5px 10px;font-size:12px;font-family:inherit;width:170px;outline:none}
#searchBox:focus{border-color:var(--blue)}

/* 摘要 */
#filterSummary{display:none;margin-top:12px;padding:11px 14px;background:rgba(88,166,255,.055);border:1px solid rgba(88,166,255,.22);border-radius:9px;font-size:12.5px;color:var(--tx2)}
#filterSummary.on{display:block}
#filterSummary .lbl{color:var(--mu2);font-size:11.5px;margin-right:4px}
.chipx{display:inline-flex;align-items:center;gap:6px;background:rgba(88,166,255,.13);border:1px solid rgba(88,166,255,.3);color:var(--blue);border-radius:20px;padding:2px 5px 2px 10px;font-size:11.5px;margin:3px 5px 3px 0}
.chipx b{color:var(--tx);font-weight:600}
.chipx i{cursor:pointer;font-style:normal;opacity:.7;padding:0 4px;border-radius:50%}
.chipx i:hover{opacity:1;background:rgba(248,81,73,.2);color:var(--red)}
#filterSummary .cnt{color:var(--mu2);font-size:11.5px;margin-left:6px}
#filterSummary .clr{margin-left:10px;color:var(--mu2);cursor:pointer;font-size:11.5px;border-bottom:1px dashed var(--bd2)}
#filterSummary .clr:hover{color:var(--red)}

/* 明细卡 */
.flow{display:flex;flex-direction:column;gap:9px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:13px 15px;transition:.13s}
.card:hover{border-color:var(--bd2);background:var(--card2)}
.card.flash{animation:fl .9s ease}
@keyframes fl{0%,100%{background:var(--card)}30%{background:rgba(88,166,255,.1);border-color:rgba(88,166,255,.4)}}
.card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:10.5px;font-weight:700;padding:1.5px 7px;border-radius:4px;letter-spacing:.2px}
.ch-ver{background:rgba(188,140,255,.14);color:var(--purple);border:1px solid rgba(188,140,255,.32)}
.ch-prod{background:rgba(88,166,255,.12);color:var(--blue);border:1px solid rgba(88,166,255,.3)}
.ch-pb{background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.3)}
.ch-ok{background:rgba(63,185,80,.1);color:var(--green);border:1px solid rgba(63,185,80,.28)}
.ch-mu{background:rgba(139,148,158,.1);color:var(--mu);border:1px solid var(--bd2)}
.ch-ye{background:rgba(210,153,34,.12);color:var(--yellow);border:1px solid rgba(210,153,34,.3)}
.card .tm{margin-left:auto;font-size:11px;color:var(--mu2);white-space:nowrap}
.card .ti{font-size:13.5px;font-weight:600;color:var(--tx);margin-bottom:6px;line-height:1.45}
.card .ti a{color:var(--tx)}
.card .ti a:hover{color:var(--blue)}
.card .bd{font-size:12.5px;color:var(--mu);line-height:1.68;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .bd .lang{color:var(--mu2);font-size:10.5px;border:1px solid var(--bd2);border-radius:3px;padding:0 4px;margin-right:5px}
.card .tr2{margin-top:7px;padding-left:9px;border-left:2px solid rgba(88,166,255,.28);font-size:12.5px;color:var(--tx2);line-height:1.68;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tr2 .ml{color:var(--mu2);font-size:10.5px;margin-right:5px}
.card .mt{display:flex;gap:13px;margin-top:8px;font-size:11px;color:var(--mu2);flex-wrap:wrap}
.card .mt b{color:var(--mu);font-weight:500}

/* 分页 */
.pager{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;font-size:12px;color:var(--mu)}
.pager button{background:var(--card);border:1px solid var(--bd2);color:var(--tx2);border-radius:6px;padding:4px 11px;cursor:pointer;font-size:12px;font-family:inherit}
.pager button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .pg{min-width:96px;text-align:center}

.empty{border:1px dashed var(--bd2);border-radius:10px;padding:34px 22px;text-align:center;color:var(--mu2);font-size:12.5px;line-height:1.8}
.empty b{color:var(--tx2);font-size:14px;display:block;margin-bottom:7px}
.foot{margin-top:34px;padding-top:15px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mu2);line-height:1.95}
.foot b{color:var(--mu)}

@media(max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .bar .nm{width:96px}
  .filters{gap:6px}
  #searchBox{width:100%}
}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="htop">
    <h1>3D 打印软件用户使用专栏</h1>
    <span class="badge b-blue">跨机型 · 跨版本</span><span class="badge b-red">版本回归监测</span><span class="badge b-grn">508 条</span><span class="badge b-blue">产品线 315 条 · 固件 73 · 云 69 · 三方 50</span>

  </div>
  <div class="flow" id="cards"></div>
  <div class="pager" id="pager"></div>
</section>

<div class="foot" id="foot"></div>
</div>

<script>
var COL = {"meta":{"columnType":"sw","fileStem":"software-columns","scope":"3D 打印软件相关用户反馈","updatedDate":"2026-10-13","batch":"工作日 03:30 批次","sources":"Creality 官方论坛 Software / bug-report / firmware / slicingsoftware / feature-need / crealityprint","updateLog":[{"date":"2026-10-13","text":"首版发布 · 508 条（官方论坛软件板块 + 5 个相关标签，含第三方切片兼容）"}],"foot":"<b>口径说明<\/b><br>① 数据源为 Creality 官方论坛的 Software 板块与 5 个软件相关标签，共 508 条；其中 284 条（55.9%）指向具体问题类型，另 224 条为使用提问 / 教程 / 公告，<b>只计入总量、不进问题榜<\/b>——不把提问硬归成缺陷，否则问题榜会失真。<br>② 「版本回归雷达」的行是软件版本，列是问题类型。回归标记的口径是：该版本某类问题 ≥ 上一主版本同类的 1.8 倍且 ≥ 3 条，才标「回归」；不是所有深色格子都叫回归，否则标记会失效。<br>③ 版本号从标题优先抽取，正文只作补充；抽取前会剔除型号与计量 token（Ender-3 V3、K1C、SPARK2 Plus、1.75mm、200°C、0.4 层高等），避免把规格当版本。<br>④ 「其他缺陷」是兜底类：明确是故障但六类拆不细的内容单列在这，不硬塞进「兼容性」或「界面」，避免这两类虚高。<br>⑤ 非中文内容保留原文；译文将在后续批次补齐，当前未做机器翻译，以免技术术语被误译。<br>⑥ 信源为厂商官方论坛，<b>厂商官方账号发布的公告/回复已标「官方」徽标<\/b>。"},"items":[{"uid":"63d8e35e4eed3431","topicId":54166,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-10-13","lastActive":"2026-10-13","title":"Latest firmware for K1C 2025r monochrome","originalText":"Customer support said that the latest version is the one you can found here: (2nd from bottom)\n\n \n \n \n\n Flagship Series Firmware Download \n \n\n \n \n\n Flagship Series Firmware Download \n\n Find all Creality firmware downloads for your Flagship Series 3D printers, including K1, K1 Max and K1C. Update your printer with the latest firmware for optimal performance.\n\n \n\n \n \n \n \n\n \n \n\n CR4SU200382C13_ota_K1C-2025_V1.0.0.26.20251024S.img\n\n But there is a lot of bigger version number under here:\n\n \n \n \n\n creality.com \n \n\n \n \n\n K1C Downloads Center: Firmware, Software & User Manuals \n\n Download the latest Creality K1C firmware, slicing software, and user manuals. Keep your 3D printer updated with official drivers and technical guides.\n\n \n\n \n \n \n \n\n \n \n\n which one should I use for single color printing?\n\n Thanks in advance","url":"https://forum.creality.com/t/latest-firmware-for-k1c-2025r-monochrome/54166","productLine":"firmware","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":53,"likeCount":0,"tags":["k1c","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"0c9549ee2aaf0801","topicId":54040,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-10-06","lastActive":"2026-10-06","title":"Arc Fitting (Ajuste de Arco)","originalText":"Dear Team,\n\n Why are the Orca and Creality Print profiles set with the “Arc Fitting” option enabled for K2 series printers, even though it is recommended to keep it disabled?\n\n After all, Klipper firmware converts arcs into line segments. Requesting the slicer to generate arcs (G2/G3) only causes the firmware to convert them back into line segments, which could be handled directly if this option were left unchecked in the default profile.\n\n image 574×637 36.7 KB \n\n image 565×597 36.9 KB","url":"https://forum.creality.com/t/arc-fitting-ajuste-de-arco/54040","productLine":"firmware","version":"","problemType":"feature","model":"K2","grade":"有效","replyCount":1,"views":26,"likeCount":0,"tags":["k2","firmware","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"31ec825ca4c17a93","topicId":53933,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-30","lastActive":"2026-09-30","title":"Creality Print > 7.1.1.4472 CY2586 Y-axis print coordinates out of range on K2 Plus","originalText":"Creality Print > 7.1.1.4472 causes a CY2586 error when slicing with multiple colors on a K2 Plus with CFS. The gcode contains moves to Y 378 during color switching which is beyond the Y 350 range of print plate. Earlier versions don’t generate such movements.\n\n CY2586 1536×2040 304 KB \n\n Y378 2040×1536 326 KB","url":"https://forum.creality.com/t/creality-print-7-1-1-4472-cy2586-y-axis-print-coordinates-out-of-range-on-k2-plus/53933","productLine":"print","version":"7.1.1","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":1,"views":46,"likeCount":0,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"d36d23459921b778","topicId":53815,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-24","lastActive":"2026-09-24","title":"Bug in Creality Print 7.2.2.5483 – CFS NANO assigns unused filament and causes TR0116","originalText":"Hello,\n\n I found what appears to be a bug in Creality Print 7.2.2.5483 when using the CFS NANO with the SPARKX i7.\n\n I have 3 filament rolls loaded in my CFS NANO , for example:\n\n \n \n CFS 1A → Black PLA\n\n \n \n CFS 1B → White PLA\n\n \n \n CFS 1D → Orange PLA\n\n \n \n I wanted to print a model that uses only two colors: black and orange .\n\n When I opened the project in Creality Print, the CFS section automatically had all three loaded filaments available in the project:\n\n \n \n Black\n\n \n \n White\n\n \n \n Orange\n\n \n \n Even though the model only required black and orange.\n\n I sent the print without removing the unused white filament from the Creality Print project. The printer then stopped with error:\n\n TR0116 – Filament run out \n\n The CFS and the printer were working correctly, and the filaments were physically available.\n\n Important test \n I then opened the same project and removed the unused white filament from the CFS filament list in Creality Print , leaving only:\n\n \n \n Black → CFS 1A\n\n \n \n Orange → CFS 1D\n\n \n \n I generated the G-code again and sent it to the printer.\n\n The exact same model then printed correctly, including the automatic color change. \n\n I also tested the printer using a 3-color model stored in the printer’s internal memory , and that model printed perfectly. This confirms that the CFS, filament loading and color-changing system are working correctly.\n\n I believe the problem is related to how Creality Print handles unused filament slots/presets when generating the G-code .\n\n The first G-code contained three filament definitions even though the model only used two colors, while the corrected G-code contained only the two required filaments.\n\n This can cause the printer to request the wrong filament index and trigger TR0116 , even though the required filament is physically loaded in the CFS.\n\n Expected behavior \n Creality Print should allow the user to keep multiple filaments loaded in the CFS while a print uses only a subset of them.\n\n For example:\n\n CFS: \n\n \n \n 1A Black\n\n \n \n 1B White\n\n \n \n 1D Orange\n\n \n \n Print uses: \n\n \n \n Black\n\n \n \n Orange\n\n \n \n The unused White filament should simply remain available in the CFS but should not be included as an active filament in the generated G-code .\n\n Could you please investigate this behavior in Creality Print 7.2.2.5483 and the SPARKX i7 CFS integration?\n\n Printer firmware: 1.1.4.2.1 \n\n Creality Print: 7.2.2.5483 \n\n Thank you.","url":"https://forum.creality.com/t/bug-in-creality-print-7-2-2-5483-cfs-nano-assigns-unused-filament-and-causes-tr0116/53815","productLine":"firmware","version":"","problemType":"other","model":"SPARKX i7","grade":"有效","replyCount":1,"views":43,"likeCount":2,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"599da5109a91f4d3","topicId":53762,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-22","lastActive":"2026-09-22","title":"Creality 7.2: interior corners at convex \"stepped\" shapes not solid","originalText":"I’ve been having an issue with Creality Print for a long time now. I’ve reported this on reddit like last year but it still persists.\n\n Basically, whenever I print something with “stepped” structures (a vertical wall meets a horizontal floor/ceiling at a perfect 90degree angle), the corner where the two sides meet always ends up being a point of failure, as it doesn’t properly place solid material there. The vertical wall ends, there’s a single layer in the horizontal structure that overlaps it, and the rest of the horizontal structure starts at the vertical wall’s outer surface.\n\n In basically every case I’ve dealt with thus far, this has resulted in the vertical structure having an incredibly weak connection to the horizontal one, being essentially held together by a few wall-widths of bottom surface layer, and sparse infill. Especially in the case of objects with “shafts” which are completely embedded within horizontal surfaces, this results in “shafts” which break off incredibly easily, due to a lack of solid structural connection/support, and we’ve had to waste a lot of effort designing around this problem.\n\n It’s difficult to explain, so I shall do so with pictures.\n\n Here is a project demonstrating the issue:\n\n SpindleExample.3mf (595.6 KB)\n\n in this spindle object, we see multiple ‘steps’ where walls meet floors/ceilings:\n\n image 1380×559 206 KB \n\n let’s observe where the shaft at the bottom meets the much wider shaft section above it. I have hidden both the support and the sparse infill so the issue is more visible.\n\n here is the cross-section of the shaft at the layer just below the brim:\n\n image 1023×432 53 KB \n\n and here is the cross-section of the fully-printed lower surface of the brim, with 4 bottom shell layers:\n\n image 1020×424 68.8 KB \n\n here’s with sparse infill visible, so you can see the full picture:\n\n image 1159×422 82.3 KB \n\n we can see the bottom surface partially overlaps the walls (it only overlaps the two outermost wall lines). then, the rest of the bottom surface layers have an ID equal to the OD of the shaft. this results in a structure where there’s basically no solid material on the interior of that corner. Which looks like this:\n\n image 709×355 7.23 KB \n\n …and then it doesn’t take much effort at all to break the shaft off cleanly at the bottom shell surface layer.\n\n The situation can sometimes be even worse with “up-facing” corners — we’ve had instances where such a corner would have a visible gap into the interior of the part, as it didn’t even bother with any overlap whatsoever.\n\n What am I to do about this issue? Is there some setting I’m missing which can properly solidify these internal corners? or is this just a bug?","url":"https://forum.creality.com/t/creality-7-2-interior-corners-at-convex-stepped-shapes-not-solid/53762","productLine":"print","version":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":18,"likeCount":0,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"3e1beae361c5afc7","topicId":53732,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-21","lastActive":"2026-09-21","title":"Creality Print version 7.2.2.5483 & spheres","originalText":"I am using Creality Print version 7.2.2.5483. When I slice a STL that contains a sphere, the sphere stays empty with no infill. I have restarted Creality Print and tried spheres from Tinkercad and from the primative items that can be added via Creality Print. All stay empty with no infill. If I slice the same stl with Orca Slicer version 2.4.2, it slices correctly and has infill. I have printed other items that were sphere adjacent with no issues but standard spheres, no luck. \n\n Can anyone else confirm this? \n\n TIA\n\n -Marco","url":"https://forum.creality.com/t/creality-print-version-7-2-2-5483-spheres/53732","productLine":"thirdparty","version":"7.2.2","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":26,"likeCount":0,"tags":["k1c","creality-print","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"a2fb13c72e8a69cb","topicId":53731,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-21","lastActive":"2026-09-21","title":"Multiple Processes?","originalText":"Hi all,\n\n I am wondering if one is able to save more than one process and use at will. At the moment I’m using the default and changing it every time. Which is fine. But I made one that I like for a specific print, and I am hoping that I could save that Process that I could call on when needed.\n\nIf this is something one can do, how does one do so?\n\n Running the Creality Print V7,2,1.546-x86_64 Appimage on Linux Mint.\n\n thanks!","url":"https://forum.creality.com/t/multiple-processes/53731","productLine":"print","version":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":13,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7931206f2aac5bb8","topicId":53725,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-20","lastActive":"2026-09-21","title":"Creality Hi shut down during printing and won't turn back on.","originalText":"Hello, I have a Creality Hi 3D printer. The other day, the firmware update was interrupted halfway through. I turned the printer off and on again, and it initially started normally. I then started a print, but before the print could begin, the printer suddenly shut itself down and has not turned on again since.\n\n I am also attaching a photo of the motherboard. What do you think could be causing the problem, and what would be the solution?\n\ni think the problem could be only the power unit of the machine, or your wall outlet might be in poor condition or have inadequate wiring, causing momentary power interruptions that lead to this issue. If the outlet was indeed faulty—perhaps due to thin or low-quality wiring—and the problem persists even after fixing it or plugging the printer into a different, properly functioning outlet, then the original outlet likely fried the printer’s power supply or another component.\n\n image 172×161 41.3 KB\n\nI performed the measurements; it is functional, and my motherboard is functional too","url":"https://forum.creality.com/t/creality-hi-shut-down-during-printing-and-wont-turn-back-on/53725","productLine":"firmware","version":"","problemType":"crash","model":"Creality Hi","grade":"有效","replyCount":3,"views":44,"likeCount":0,"tags":["general-discussions","trouble-shooting","creality-hi"],"relReason":"category","sourceType":"用户"},{"uid":"4fd34caebd29b1af","topicId":53605,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-13","lastActive":"2026-09-13","title":"Creality Print 5.1.1.9490 suddenly corrupts system filament and print configurations — presets move to User Configuration and get incorrect settings","originalText":"Hello,\n\n I am experiencing a serious configuration/preset problem with Creality Print 5.1.1.9490 on Windows with a Creality K1C.\n\n I have been using Creality Print 5.1.1.9490 for more than 1.5 years. During this entire period the software was working normally, including while connected to the internet. I have hundreds of models that were designed, sliced and printed successfully using this version.\n\n About 7–10 days ago everything was still normal. I did not change my local configuration.\n\n When I opened Creality Print recently, I found that many default system filament presets had suddenly appeared under “User Configuration”, even though I never created custom versions of these filaments.\n\n More importantly, their parameters have also been changed.\n\n All of the affected filament presets have been assigned the same incorrect parameters: 200°C nozzle / 45°C bed. This includes ABS profiles as well, which clearly should not have the same settings as PLA.\n\n This is not only a filament temperature problem. The print/process configuration also appears to have been changed. The same models that previously had normal slicing times can now produce dramatically different and much longer estimated print times. One model that normally takes around 3 hours in my established 5.1 workflow was suddenly calculated at approximately 18 hours. \n\n I tested this on multiple computers.\n\n 1. My normal computer:\n\n I completely uninstalled Creality Print, removed the remaining files, restarted Windows and installed 5.1.1.9490 again.\n\n First launch → everything was normal.\n\n Close and restart Creality Print → the incorrect User Configuration presets appeared again.\n\n 2. A completely different computer:\n\n Creality Print 5.1.1.9490 was already installed. The configuration was normal when the computer was offline. After reconnecting it to the internet, the same problem appeared.\n\n 3. A completely clean laptop:\n\n Creality Print had NEVER been installed on this computer before.\n\n I installed 5.1.1.9490 while the computer was connected to the internet.\n\n First launch → completely normal.\n\n Close and launch again → the same incorrect User Configuration presets appeared.\n\n This makes me strongly suspect a problem with configuration/preset synchronization or server-side configuration data affecting Creality Print 5.1.1.9490.\n\n I am not claiming this was intentional, but the problem appears to be reproducible and is not caused by an old local configuration.\n\n I have also already tested newer Creality Print versions. I prefer to keep using 5.1.1.9490 because hundreds of my models were developed and tested with this version. Newer versions have produced significantly different slicing results and print times for the same models, and I have also experienced stability/crashing issues with 6.x.\n\n Could Creality please investigate whether a recent server-side configuration/preset change has caused this problem with Creality Print 5.1.1.9490?\n\n I would particularly like to know:\n\n \n Why are system filament presets being moved/duplicated under “User Configuration”? \n \n - Why are unrelated filaments receiving identical incorrect parameters such as 200°C / 45°C?\n\n - Why are print/process settings also affected?\n\n - Why is this reproducible on a completely clean computer?\n\n - Is there a way to restore the original 5.1.1.9490 system configurations?\n\n I have attached screenshots showing the incorrect User Configuration and filament parameters.\n\n Printer: Creality K1C\n\n Creality Print: 5.1.1.9490\n\n OS: Windows 64-bit\n\n It was also a bad experience especially on the day that I was planning to buy a new K2 Pro Combo Printer.\n\n Thank you.\n\n image 432×847 48.3 KB \n\n image 385×802 38.3 KB","url":"https://forum.creality.com/t/creality-print-5-1-1-9490-suddenly-corrupts-system-filament-and-print-configurations-presets-move-to-user-configuration-and-get-incorrect-settings/53605","productLine":"print","version":"5.1.1","problemType":"ui","model":"K1C","grade":"有效","replyCount":1,"views":36,"likeCount":0,"tags":["k1c","crealityprint","trouble-shooting"],"relReason":"tag","sourceType":"用户"},{"uid":"00672c04cb55554d","topicId":53607,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-13","lastActive":"2026-09-13","title":"Did I find a new hidden firmware because of a misleading title?","originalText":"I came across something really strange: a firmware update with a misleading title—it looks like an old version, yet it has the most recent upload date of them all. Could it be a new update that was mislabeled? Also, I’ve noticed that since the machine’s last firmware update (the one for the CFS Nano and so on), the AI ​​isn’t working properly; it no longer detects the “spaghetti” effect or printing issues, and it behaves strangely during calibration and similar processes.\n\n fwsaefase 811×651 130 KB \n\n aefafdes 773×230 47.2 KB\n\nI also want to mention that “1.1.4.0.2” firmware doesn’t appear on the other sites; I’ll show you.\n\n image 280×636 18.8 KB \n\n image 1039×866 112 KB\n\nAnd in case you’re wondering, no, I don’t have the guts to install that firmware to see what it does…","url":"https://forum.creality.com/t/did-i-find-a-new-hidden-firmware-because-of-a-misleading-title/53607","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":98,"likeCount":1,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"c397590e07d6cd92","topicId":53569,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","date":"2026-09-11","lastActive":"2026-09-11","title":"a serious error has occured in some app. Please send this report","originalText":"Hi.\n\nSuddenly, a couple of days ago, the Creality print 7.1 program stopped opening. Updating to 7.2 did not help. What to do?\n\n Снимок экрана 2026-09-11 092813 754×408 17.9 KB","url":"https://forum.creality.com/t/a-serious-error-has-occured-in-some-app-please-send-this-report/53569","productLine":"print","version":"7.1","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":24,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"31b48285fbd11023","topicId":53539,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-09","lastActive":"2026-09-09","title":"Estimated completion time - shows in military time","originalText":"In CrealityPrint 7.2.2.5483\n\nDevice Tab during a print,\n\n Estimated completion time: \n\n is in military time. That is 1:21 PM is shown as 13:21\n\n Is there any way to change that?\n\n Thanks","url":"https://forum.creality.com/t/estimated-completion-time-shows-in-military-time/53539","productLine":"print","version":"7.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":20,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"49b4d28c1406fd7f","topicId":53529,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-09","lastActive":"2026-09-09","title":"CHANGE FILAMENT TYPES WHEN SLICING A PRINT.","originalText":"when slicing a new print that i sent over from tinkercad it doesn't give me a filament option it seems to be stuck on PLA and wont let me switch it to PA-CF, therefore not letting me start the print. Any help appreciated.","url":"https://forum.creality.com/t/change-filament-types-when-slicing-a-print/53529","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":34,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"19a93aac57953c8c","topicId":53499,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-07","lastActive":"2026-09-07","title":"Homing issues","originalText":"I was trying to print and my spark x i7 and it will not home. It starts and when it goes to clear the nozzle it bounces an will not go all the way left. I tryed to reset it and it does the same thing.","url":"https://forum.creality.com/t/homing-issues/53499","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":21,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"f052f0bf19f80dd6","topicId":53496,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-07","lastActive":"2026-09-07","title":"Secondary display issue in V7.2.2.5483","originalText":"To my laptop I have a secondary screen connected. After opening Creality Print I drag the application window to my secondary, then I try maximizing the Creality Print application window. ISSUE: As soon as I maximize the Creality Print application window the application goes black/blank. Only solution is to go into the activity manager and close the application. Then start it again. Sidenote: If i just drag the application to my secondary screen all is good. It is tha maximizing action that craches the application.","url":"https://forum.creality.com/t/secondary-display-issue-in-v7-2-2-5483/53496","productLine":"print","version":"7.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":19,"likeCount":0,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"e9b39a4e5cd73840","topicId":53473,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-06","lastActive":"2026-09-06","title":"Photoshop layers in Falcon Design space","originalText":"I am new to my Falcon A1 and Falcon design software. Is there a way to use layers created in Photoshop to create a line engraving layer and line cutting layer in Falcon design software.\n\n thanks Jon…","url":"https://forum.creality.com/t/photoshop-layers-in-falcon-design-space/53473","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":34,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"da851cf848277eac","topicId":53404,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-02","lastActive":"2026-09-06","title":"Creality k2 coombo","originalText":"Title: Creality K2 Pro Combo stuck during Auto Leveling in Self-Inspection \n\n Hello everyone,\n\n I have a Creality K2 Pro Combo and I’m experiencing an issue during the printer’s Self-Inspection / Self-Test .\n\n The test goes through all the previous steps normally, but when it reaches the final step, Auto Leveling , it gets stuck and does not proceed.\n\n There is:\n\n \n \n No error message.\n\n \n \n No failure notification.\n\n \n \n No success/completion message.\n\n \n \n The printer simply remains stuck on the Auto Leveling step indefinitely.\n\n \n \n I have tried waiting for the process to finish, but it never moves past this stage.\n\n Has anyone experienced the same issue with the K2 Pro Combo?\n\nWhat could be causing the Auto Leveling process to get stuck, and what steps can I take to fix it?\n\n Any help or suggestions would be greatly appreciated.\n\n Thank you!\n\nHi,\n\n I had got exact same problem with brand new K2, printer got stuck on Auto Leveling for hours.\n\n The only thing that helped was to insert USB stick with the newest firmware, upon start-up printer will detect it and let you proceed with the upgrade.","url":"https://forum.creality.com/t/creality-k2-coombo/53404","productLine":"firmware","version":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":49,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e843bcf356ee3585","topicId":53347,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-09-01","lastActive":"2026-09-01","title":"CR-M4 – Power Loss Recovery & Filament Runout Sensor not activated by default in Creality Print G-code","originalText":"Hi Creality community and support team,\n\n I wanted to share an issue I’ve been facing for a while with my CR-M4 printer and that I finally managed to understand and resolve on my own.\n\n I was experiencing persistent problems with print interruptions — both during planned filament changes and after unexpected power outages. The printer was simply not resuming or detecting the runout, which was extremely frustrating on long prints.\n\n After testing across multiple versions of Creality Print (including the most recent ones available for Mac Intel chip), I discovered that none of them include the necessary G-code commands to activate these features by default in the machine start profile for the CR-M4.\n\n Specifically, the following commands were completely absent from the Machine Start G-code:\n\n M413 S1 ; Enable Power Loss Recovery\nM412 S1 ; Enable Filament Runout Sensor\nM500 ; Save settings to EEPROM\n\n \n The CR-M4 firmware does support these features — the problem is purely that the slicer profile never activates them. As a workaround, I had to add these lines manually to the Machine Start G-code in Creality Print’s printer settings.\n\n I strongly suggest that the Creality development team includes these three commands in the default Machine Start G-code for the CR-M4 in future updates of Creality Print. It would save many users the confusion and wasted prints that come from assuming these safety features are active when they are not.\n\n Thank you for your attention to this matter.\n\n \n Pode copiar e colar directamente no fórum. Quer que ajuste o tom ou adicione algum detalhe?","url":"https://forum.creality.com/t/cr-m4-power-loss-recovery-filament-runout-sensor-not-activated-by-default-in-creality-print-g-code/53347","productLine":"firmware","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":20,"likeCount":1,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"0ebe6d44d2110832","topicId":53323,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-31","lastActive":"2026-08-31","title":"Not able to slice a file","originalText":"Creality print (Latest version) with a K2 plus printer.\n\n I have several files that when I try to slice them, I get a warning that NO layers can be found.\n\n The original maker says they slice in Orca, and they in fact do, but I don’t like that tool.\n\n What can I do to open and print with Creality Print?\n\nHello ! Can you share some pictures so we see what’s happening ?","url":"https://forum.creality.com/t/not-able-to-slice-a-file/53323","productLine":"print","version":"","problemType":"slice","model":"K2 Plus","grade":"有效","replyCount":2,"views":26,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"89e6596e689adc00","topicId":53293,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-08-30","lastActive":"2026-09-01","title":"Extruder light ON while changing filament","originalText":"Hi Team Creality\n\n I know my K2 plus has a small LED integrated in the extruder.\n\n Is it possible to turn on the light from the extruder while changing filament? Maybe in the next software revision…\n\n Thanks\n\nI think it’s possible if you change the “Change filament G-code” a little bit. i’m not sure about the exact code, but i found it’s something like that. I found this code with AI.\n\n [multi_pin LED_pin]\n\n pins: PB0,PA12\n\n [output_pin LED]\n\n pin:multi_pin:LED_pin\n\n pwm: True\n\n cycle_time: 0.010 value: 1\n\n I don’t think they gonna add an option setting for this.\n\n Képkivágás 1432×917 78.3 KB\n\nHi Balazsq\n\n Thanks a lot for the tip.\n\n I’ll try.\n\n Bye","url":"https://forum.creality.com/t/extruder-light-on-while-changing-filament/53293","productLine":"print","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":3,"views":33,"likeCount":0,"tags":["k2plus"],"relReason":"category","sourceType":"用户"},{"uid":"1d5de6cd7fa9ce90","topicId":53288,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-30","lastActive":"2026-08-30","title":"Wipe Tower Issue","originalText":"Hello,\n\n i use creality print 7.2.2.5483\n\n This is my Wipetower. I can’t find the issue. The issue is only when more than one part of the bed.\n\n image 1386×716 64.1 KB","url":"https://forum.creality.com/t/wipe-tower-issue/53288","productLine":"print","version":"7.2.2","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":29,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"67c62739c530a1df","topicId":53283,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-29","lastActive":"2026-09-02","title":"K2 Pro-update to V7.2.1.5476","originalText":"Hello,\n\n This is my first time to post on the forum. I’m trying to find out why my K2 Pro stopped working after the V7.2.1.5476 update. \n\n It was working find as I was printing. It alerted me to an update so, of course I did this. Now nothing will work. It won’t find my printer, it won’t load the Device Screen, It tells me my Microsoft Edge can’t read and write to it’s data directory, which doesn’t make sense, it’s on the C:\\\n\n I saw a few posts that stated, uninstall old software and then go back and reinstall the new version, which I did. This does nothing, same data directory error.\n\n I’m at a loss and appreciate any help I can get. The program works perfectly fine from my phone, camera view, everything. It’s everything on the desktop that has stopped.\n\n ~M\n\nI got the same problem but I rolled back to creality print 7.1.0.4414 and it works again. The only reason I did the upgrade is because the popup said it fixed the camera not working which is really strange as my camera in 7.1.0.4414 had been working and suddenly stopped despite me not upgrading creality print or the firmware on my K2 plus - so I must assume that the camera functionality somehow goes through software on creality’s side that got changed.\n\n So in summary I can say that the new 7.2.1 does fix the camera not working by making the entire printer not working!\n\nThank you for sharing. I’m glad I’m not the only one this is happening to. I though it was a computer error on my part. I rolled back to the most previous version as well, just to be able to print again. I don’t have the camera view on the desktop app, but I can still see it on the phone app.","url":"https://forum.creality.com/t/k2-pro-update-to-v7-2-1-5476/53283","productLine":"firmware","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":5,"views":99,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"327d689b2221cdd5","topicId":53265,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-28","lastActive":"2026-08-29","title":"3x stronger infill design","originalText":"How do I get this info to Creality:\n\nA team of researchers from University College London (UCL) have developed a new 3D-printable structure called a “triply-twinned” lattice that is up to 380% stiffer and 279% stronger than ordinary cubic designs. Best of all, it uses the same amount of material!\n\n \n \n \n\n MakeUseOf – 26 Aug 26 \n \n\n \n \n\n Engineers just discovered how to make 3D prints 3x stronger without extra... \n\n This new printing technique seems so simple, but could have major implications for the future of the technology.\n\nright, and they did that without enclosure, with the cheapest 3D printer, and with cheap filament?\n\n Well, if they didn’t, then its not 380% stiffer. First of all, after the printed model gets cold, and it has been made of PC for example, and wall thickness is like 5mm in total, i guarantee, that any infill you go with, will not affect the stiffness by much, as PC on it’s own is very rigid and kinda brittle too.\n\n Giving numbers where tests have been done under perfect conditions means literally nothing in real world.","url":"https://forum.creality.com/t/3x-stronger-infill-design/53265","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":42,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"ce5615ed4a72481c","topicId":53262,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","date":"2026-08-28","lastActive":"2026-08-28","title":"Problems with installing the Ender3 S1 firmware for the Nebula Smart Kit (display and camera)","originalText":"Hi everybody. I have an Ender-3 S1 with a C14 motherboard (it has an STM32F401RET6 microcontroller). I bought the Creality Nebula Smart Kit.\n\n When I tried to install and configure the Nebula Pad, problems arose. When I connected the Nebula display, I couldn’t load the pre‑installed S1 firmware, as the manufacturer had only installed it for C13. I tried to update the printer’s firmware using a firmware I found online; as required, I placed it in the STM32F4_UPDATE folder, but the firmware installation on the old display freezes.\n\n I read online that the C14 F401 board may be incompatible with the Nebula Pad, but there are firmware versions that solve this problem.\n\n Could you tell me if there is currently a working solution to this issue? Perhaps someone has a test firmware from Creality or another way to make this work? I don’t want to buy the C13 board yet.\n\n If possible, please send the required firmware if you have it.\n\n Thank you in advance!\n\n Привет всем. У меня Ender-3 S1 с материнской платой C14 (на ней стоит микроконтроллер STM32F401RET6). Я купил Creality Nebula Smart Kit.\n\n При попытке установки и настройки Nebula Pad возникли проблемы. При подключении дисплея Nebula не получилось загрузить предустановленную прошивку S1, так как изготовителем была установлена только для C13. Я пытался обновить прошивку принтера через найденную в интернете прошивку, как нужно было положил ее в папку STM32F4_UPDATE, но установка прошивки на старом дисплее зависает.\n\n Я прочитал в интернете, что плата C14 F401 может быть несовместима с Nebula Pad, но существуют прошивки, которые решают эту проблему.\n\n Подскажите, есть ли сейчас рабочее решение этой проблемы? Может быть, у кого-то есть тестовая прошивка от Creality или другой способ заставить это работать? Плату C13 покупать пока не хочется.\n\n По возможности, скиньте нужную прошивку, если она у вас есть.\n\n Заранее спасибо!","url":"https://forum.creality.com/t/problems-with-installing-the-ender3-s1-firmware-for-the-nebula-smart-kit-display-and-camera/53262","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":32,"likeCount":0,"tags":["ender-3-s1","trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"9bbe234e472dd72e","topicId":53239,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-27","lastActive":"2026-08-27","title":"HI COMBO","originalText":"Problem sending prints via Wi-Fi to Creality Hi Combo \n Hi everyone, I’m having a recurring issue when trying to print via Wi-Fi with my Creality Hi Combo using Creality Print .\n\n When I send a file to the printer, the process often gets stuck during the G-code transfer/upload window and doesn’t progress, so the print never starts. Sometimes it works normally, but other times I have to retry the transfer several times before it goes through.\n\n It doesn’t seem to be an Internet speed or Wi-Fi signal issue because:\n\n \n \n My Internet connection is approximately 100 Mbps .\n\n \n \n The printer is located right next to the router .\n\n \n \n The PC running Creality Print is connected to the router via Ethernet cable .\n\n \n \n The issue mainly occurs while transferring the G-code to the printer.\n\n \n \n Has anyone experienced the same problem with the Creality Hi/Hi Combo ?\n\n Is there any network, router, Creality Print, or printer setting I should check or change to make the G-code transfer more reliable and print over Wi-Fi without having to retry several times?\n\n Any solutions or settings that worked for you would be greatly appreciated. Thanks!","url":"https://forum.creality.com/t/hi-combo/53239","productLine":"print","version":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":1,"views":30,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"f545a8e0cff5a029","topicId":53238,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-08-27","lastActive":"2026-08-27","title":"creality printer problem after upgrade","originalText":"After I upgrade version of Creality Printer to version 7.2.1.5476, the CUBE that allow us to see the object in it Top, Botton, Front, Back, Left, Right, was also translated to Portuguese.\n\n Before this upgrade, WHEN i WAS IN THE PREVIOUS RELEASE, in spite of the fact that all the rest was in Portuguese, the Cube was in English.\n\n With the upgrade, the translation appeared totally wrong:\n\n Top appeared as: TOP (em inglês) when the right term is: Topo\n\n Front appeared as: Frante when the right term is: Frente\n\n Back appeared as: Voltar when the right term should be: Verso\n\n Botton appeared as: Baço when the right term should be: Base\n\n Right appeared as Direito when the right term should be: Direita\n\n Left is the only one that is correct, and is Esquerda\n\n BUT I SUGGEST TO KEEP THE CUBE IN ENGLISH, IN SPITE OF THE FACT THAT THE LANGUAGE IS IN PORTUGUESE, BECAUSE THE TERMS IN PORTUGUESE ARE TO TOO BIG AND EXTEND THE SIZE OF THE CUBE","url":"https://forum.creality.com/t/creality-printer-problem-after-upgrade/53238","productLine":"print","version":"7.2.1","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":49,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0c8a5bc58521929a","topicId":53242,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-27","lastActive":"2026-10-05","title":"K1C: How to run MY custom START_PRINT from the touchscreen in firmware 1.3.5.22?","originalText":"Hi everyone,\n\n I’m trying to use my own custom START_PRINT macro on my Creality K1C instead of the stock routine created by Creality.\n\n Here is the issue: I created my own script in gcode_macro.cfg and specified it in Orca Slicer. Everything works perfectly as long as I start the print via the Fluidd web interface.\n\n However, if I start a print directly from the printer’s touchscreen, it completely ignores my script. It also ignores the macro in /Helper-Script/KAMP/Start_Print.cfg and just executes some built-in internal routine.\n\n Does anyone know what and where needs to be modified so that starting a print from the touchscreen uses the START_PRINT macro defined in the .cfg files, rather than the hardcoded routine hidden inside the firmware?\n\n Any help or ideas would be appreciated!\n\nNow, do not take my word for it but I have seen some macro sections in the Creality Slicer (not Orca).\n\n Let me get some screenshots.\n\n Creality_Print_PPS 571×646 17.1 KB \n\n G-Code_Types 1263×902 34.7 KB \n\n That may help you in case you wanted to test some g-code out on the Creality Print. I know what you are asking and I know nothing about Orca for now. I am sorry.\n\nHi @For_Ward ,\n\n Thanks for the screenshots and reply!\n\n Just a quick side note: Creality Print (v5.0 and newer) is actually a direct fork of OrcaSlicer. So all those settings are virtually identical in Orca. In fact, that exact window from your screenshot is where I replaced the stock call with my own custom macro name.\n\n The main issue isn’t the slicer itself — it works perfectly when I start the print via the Fluidd web interface.\n\n The issue is strictly with the printer’s touchscreen . When you start a print directly from the screen, Creality’s internal software completely overrides/ignores whatever custom macro is set in the G-code and forces its own hardcoded pre-print routine instead.\n\n And yes, it’s super frustrating! That’s why I’m trying to find a way to bypass or override that hardcoded routine on firmware 1.3.5.22.","url":"https://forum.creality.com/t/k1c-how-to-run-my-custom-start-print-from-the-touchscreen-in-firmware-1-3-5-22/53242","productLine":"thirdparty","version":"","problemType":"other","model":"K1C","grade":"有效","replyCount":6,"views":130,"likeCount":1,"tags":["k1c","trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"4ca86fb2ee2a670c","topicId":53218,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-25","lastActive":"2026-08-25","title":"creality slicer not work on surface 11 pro","originalText":"Hello EVERYONE\n\n I bought a K2 Pro printer\n\n When I download creality slicer not work on surface 11 pro\n\n , I can’t run the program, and an error message appears.\n\n I download the last version but not working\n\n My device runs win 11\n\n SnapDragon X Elite Processor\n\n Is there a solution to this problem?!\n\nHello ! CrealitySlicer or CrealityPrint ?\n\n CrealitySlicer is a very old software so it would not be surprising at all \n\nNowadays, we’re using CrealityPrint instead. As your computer is in Windows 11…It should work though \n\n Or you may have to use the emulator of microsoft for that : How emulation works on Arm | Microsoft Learn\n\nThank you for your response but as you mentioned I bought it now and did not use the Thank you for your response but as you mentioned I bought it now and never used the printer before I consider a new user I hope you have explained! the image","url":"https://forum.creality.com/t/creality-slicer-not-work-on-surface-11-pro/53218","productLine":"print","version":"","problemType":"slice","model":"K2 Pro","grade":"有效","replyCount":4,"views":34,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"83491c3a560286db","topicId":53194,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-24","lastActive":"2026-08-24","title":"Issue connecting the printer to Creality Cloud","originalText":"My Printer is Hi-COMBO\n\n After updating the app to version 7.3.19, I can no longer access the printer remotely. I have already tried a factory reset, but that didn’t work either. I tried removing the printer, but when scanning the QR code, the app reads it and adds the printer (though it stays offline), while the printer’s display remains stuck on the QR code screen without showing the added account.","url":"https://forum.creality.com/t/issue-connecting-the-printer-to-creality-cloud/53194","productLine":"cloud","version":"7.3.19","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":35,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"a3a8b2673d146497","topicId":53121,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-20","lastActive":"2026-08-22","title":"Scammers","originalText":"Hello everyone I want to warn you about potential problems. Scammers are operating on the Creality Cloud platform and threatening you. Do not click the link and blacklist the scammers’ account. I contacted customer support. They confirmed it was a scam and promised to investigate and block the scammers’ account. Be vigilant!\n\n Screenshot_20260820_083249_Creality Cloud 1080×2340 201 KB \n\n Screenshot_20260820_083257_Creality Cloud 1080×2340 205 KB \n\n Screenshot_20260820_083304_Creality Cloud 1080×2340 144 KB\n\nThanks ! It seems that scammers are already using the new feature of CrealityCloud\n\nThese _________ are everywhere.","url":"https://forum.creality.com/t/scammers/53121","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":139,"likeCount":5,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"438584cb7c4d3ed8","topicId":53130,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-20","lastActive":"2026-08-21","title":"Creality after update","originalText":"So, I was forced to update creality print, and now I have several issues.\n\n First, my camera keeps loading.\n\n Second, i see no option to add a file.\n\nIt’s not my camera, because that is working on my phone app.\n\n image 1352×912 46.9 KB\n\nI went back to a previous version, problem solved. The latest version sux.","url":"https://forum.creality.com/t/creality-after-update/53130","productLine":"cloud","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":81,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c3d874be4a55bc05","topicId":53127,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-20","lastActive":"2026-08-20","title":"shutting down on old and new software","originalText":"Halot box is crashing on supports, and shuts down completely","url":"https://forum.creality.com/t/shutting-down-on-old-and-new-software/53127","productLine":"print","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":22,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"ff08912447a19b4b","topicId":53028,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-14","lastActive":"2026-08-22","title":"Comprehensive List of ALL printer settings","originalText":"I have searched and searched for a comprehensive list of descriptions for ALL of the settings available in the Printer Settings window. For instance, in the Extruder tab there is no explanation or description that I can find for extruder offset in the Position section. Does anyone know of a complete list for all the parameters included in all 6 tabs of this window?\n\n Screenshot 2026-08-14 085459 1279×632 29.6 KB\n\nWelcome to the community.\n\n You may be approaching this from a slightly different direction than necessary. It sounds like you are looking for a comprehensive cheat sheet or user manual covering every setting. I have not found a single document that does that. However, two available tools may be even more useful.\n\n Creality Print is based on OrcaSlicer, so a good place to start is the OrcaSlicer Wiki. It documents the printer settings, terminology, and features found throughout the software:\n\n \n \n \n\n orcaslicer.com \n \n\n \n \n\n OrcaSlicer Wiki \n\n Official Wiki for OrcaSlicer - A powerful open source slicer for FFF (FDM) 3D Printers\n\n \n\n \n \n \n \n\n \n \n\n Note : Creality Print implements only a subset of OrcaSlicer’s features, and Creality sometimes renames standard features. For example, Creality uses “Wind Speed” for what is ordinarily called “Fan Speed.” This appears to result from translation choices and can make finding the corresponding OrcaSlicer documentation more difficult. \n The second tool is the OrcaSlicer search feature built into Creality Print.\n\n Click the magnifying glass to open the search window. This search feature is included throughout the settings profiles. As you type, a list of matching keywords and settings will begin to populate.\n\n image 1025×591 38.7 KB \n\n image 1097×860 37.1 KB \n\n image 1844×909 58.8 KB \n\n Once you locate the field you are looking for, hover over it. A popup will provide a brief description, which you can then use to search the OrcaSlicer Wiki if you want a more detailed explanation.\n\n image 1768×1114 70.3 KB \n\n image 1665×712 60.9 KB\n\nSorry for the huge delay. This was VERY helpful. Thank you so much!","url":"https://forum.creality.com/t/comprehensive-list-of-all-printer-settings/53028","productLine":"thirdparty","version":"","problemType":"ui","model":"K1","grade":"有效","replyCount":3,"views":135,"likeCount":1,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"3c5cb846d9063405","topicId":53004,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-12","lastActive":"2026-08-16","title":"Creality print background after update","originalText":"After most recent update to Creality print and my K2 it has changed my background on print to white behind the build plate. This is horrible and ugly, how do i change this back to black?\n\nMine did that too. I re-installed and it got better. and yes, I agree, the white background was just plain unusable.\n\n@Gentoo As if the printer heard your question, my Print 7 just flipped to white background when I moved from the device to the prepare tab! The computer is under heavy load. I’m running Civ-7 in the background. It is a graphics pig. That may be a factor. All I had to do was close Print-7 and it reopened with the dark background. Seems like a stability issue.","url":"https://forum.creality.com/t/creality-print-background-after-update/53004","productLine":"print","version":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":5,"views":110,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"39eb55e1a3668be1","topicId":52962,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-11","lastActive":"2026-08-14","title":"Does anyone actually read these and try to help?","originalText":"upgraded to creality print 7.2 and now basic toolbar items dont work tried previous versions and they still dont work. im guessing since the community is no help and creality is no help ill be learning a new slicer.\n\n… strange, I use CP 7.2 without any problems… please be more specific which items don’t work so we can check!\n\nHaven’t had any issues. Are you using PC or Mac? I’m using v7.2.1.5476 Release on windows 11 and it’s been perfect. I would suggest uninstalling any versions you have and reinstalling from a fresh download. I did have an auto update mess up once and break things, but reinstalling fresh solved the issue.","url":"https://forum.creality.com/t/does-anyone-actually-read-these-and-try-to-help/52962","productLine":"print","version":"7.2","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":84,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"69f64e6db4d406c1","topicId":52954,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-10","lastActive":"2026-08-11","title":"slicing removes part of model","originalText":"all of model is seen in the prepare screen, when sliced part of the model is no longer there and will not print if printed\n\nshow pictures, i already can tell what is your problem, but plz show images of everything shown on the prepare screen and then in slice screen, posting pictures is easy, just take a screenshoot and paste in the comment, or paste the screenshoot in paint and save as u wish. but without pictures we cant help you\n\nthanks for responding!!!\n\n i have attached a before slicing screenshot and a few after slicing screenshots……i have tried repairing the stl, opening it in different slicers, making changes inside the slicer with no luck. The model is lifesize so continously attempting failed prints is getting costly. Lifesize Deadpool BTW\n\n Screenshot (8) 1920×1200 159 KB \n\n Screenshot (12) 1920×1200 220 KB \n\n Screenshot (11) 1920×1200 198 KB","url":"https://forum.creality.com/t/slicing-removes-part-of-model/52954","productLine":"print","version":"","problemType":"slice","model":"未标注","grade":"有效","replyCount":6,"views":69,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"809288ec8ce0b4c3","topicId":52924,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-09","lastActive":"2026-08-20","title":"Creality Print Reporting Low Consumables after update to V7.2.1.5476 MacOS Apple K2 Pro","originalText":"After updating Creality Print to V7.2.1.5476 MacOS Apple every time I send print I get the following message: \"Low Consumables Balance Reminder The consumables in slot of model K2Pro are insufficient, Please replenish them in time.”\n\n The printer is a K2 Pro with the latest firmware. No CFS. I am using non-Creality filaments. I’ve never received this message before the Creality Print update.\n\n Another issue is that I am expecting leveling problems I believe since the extruder tip is hitting the top surface of the objects. Not sure if it’s a Creality Print issue or caused by the updated firmware since both were updated recently.\n\n I hope this will help.\n\nI get the same message. Using CFS and run Creality Print on Windows. So I guess it is some issue in the new update. But as You said - both firmware end software was updated.\n\nHaving the same.\n\n Because the nozzle is somehow touching the plate—I have been unable to print since then.\n\nIs there anyone who can share ideas to solve this?","url":"https://forum.creality.com/t/creality-print-reporting-low-consumables-after-update-to-v7-2-1-5476-macos-apple-k2-pro/52924","productLine":"firmware","version":"","problemType":"compat","model":"K2 Pro","grade":"有效","replyCount":3,"views":430,"likeCount":2,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"80d96e6e07f5d845","topicId":52911,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-08","lastActive":"2026-08-08","title":"Cooling fans","originalText":"Hi,\n\n I have this setup but the fans keep going to 40%, why?\n\n i want them at 20% max\n\n cooler 699×205 15.1 KB","url":"https://forum.creality.com/t/cooling-fans/52911","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":44,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e861f420f47b1a8c","topicId":52904,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-07","lastActive":"2026-08-07","title":"Hey You/Way to Go/Thank You","originalText":"Hey…some people and this includes myself here were discussing updating/upgrading the firmware on the K1C. Rightly so, it came through and not a second too late. Thank you!\n\n I am testing it now. It was a small upgrade but nonetheless, an upgrade and better vision for the camera.\n\nI am testing now. The camera is spot on. Yes!","url":"https://forum.creality.com/t/hey-you-way-to-go-thank-you/52904","productLine":"firmware","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":109,"likeCount":3,"tags":["general-discussions","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"85e93538cc62c1a4","topicId":52881,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-06","lastActive":"2026-09-22","title":"Creality Print 7.0+ supoort X/Y distance ignored","originalText":"I hope I’m not the only one to realize that creality print 7.0 and above ignores the X/Y support distance making supports impossible to remove from objects. The z Distance is fine but the X/Y is ignored even if you increase the values\n\nGlad it’s not just me ! Whatever I increased it by, support still touching model !\n\nI’ve been having this issue as well. Not everywhere, but in random places, XY distance will be ignored and it will print support right against the outer surface, making it essentially another wall that is difficult or impossible to remove cleanly.","url":"https://forum.creality.com/t/creality-print-7-0-supoort-x-y-distance-ignored/52881","productLine":"print","version":"7.0","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":59,"likeCount":0,"tags":["general-discussions","crealityprint","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"6e7145a827abc80a","topicId":52870,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-05","lastActive":"2026-08-06","title":"Is there a way you can add more colours into your printer software? I don’t mean CFS.","originalText":"IMG_2544 1920×1440 158 KB \n\n \n In here colours are very limited what if you wanna Pacific colour that you wanna add to your printer but you can’t because you don’t have that colour in it and what if you wanna add your specific colour that you want to select without selecting a whole different colour that you well know that isn’t that color? because I had to do that a couple times and there are times that I completely forgot to change the filament out for a different color. Why can’t we have a screen? It looks similar to this one or a little bit simpler like this to add to the screen like we have above to select our colour and have virtually little to no error of forgetting to change the filament to make the right colour and yes, I know when you’re painting your 3-D model they have that screen on, but that’s completely different. That’s on your computer not the printer and I tried looking up something of a solution that I had but no results please creality. Can you make it happen?\n\n IMG_2545 449×326 31.2 KB\n\nHello @ \n\nWelcome to the Creality Forum…! \n\n I think I understand what you’re asking. The color selected on the printer screen does not control the color of the print—the printer will use whatever filament is actually loaded in the CFS.\n\n Right now, you generally have to choose the closest available color. It sounds like you would like @Creality to add a custom color picker so the color shown on the printer screen more closely matches the filament that is loaded. That could make it easier to identify each spool and avoid forgetting to change the filament.\n\n… “loaded in CFS”… dumb answer when title says “I don’t mean CFS”…\n\n Changing the color on the screen doesn’t change anything, object will be printed in the color of the material loaded in the printer… So I realy don’t understand the question or the use of changing the color!","url":"https://forum.creality.com/t/is-there-a-way-you-can-add-more-colours-into-your-printer-software-i-don-t-mean-cfs/52870","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":88,"likeCount":2,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"d9654d68581a53ef","topicId":52843,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-04","lastActive":"2026-08-09","title":"It is impossible to start print on K1C after FW update to 1.3.5.22","originalText":"I have recently updated firmware on my K1C to version 1.3.5.22. All my previous settings were obviously erased, which is a huge problem for me. I have managed to make 3 prints. After that I can’t upload any file to my printer in any way, that I know\n\n I’m using “Creality Print” software (yeah, I know, big mistake). I tried “Send G-code” option, “One-click print”, “Multi-machine”. None of it works. What is worse, even direct printing from USB didn’t bring any results, since printer can’t see G-code files on the drive. The camera-issue discussed in other threads is also present, but it is the least of my current issues.\n\n How can I restore functioning of my printer in the fastest way possible?\n\n P.S. I’m shocked with Creality’s QC-team work… if there is one at all\n\nDowngrade to previous firmware-version (if possible).\n\nAfter updating my K1, my print head now hits the build plate and the build plate won’t return to the normal position after calibration. I can’t do any prints at all. I also downgraded to the previous firmware and it does not work. I’m waiting on a remedy from customer service now, because the logs say I now have a strain gauge problem, that didn’t exist before this update. I hope you find relief and a way to get your machine back in working order. But after days of responses from customer service unrelated to the issues and information I provided, I’m not very optimistic. I could care less about the camera issues if I could just get the printer to print again.","url":"https://forum.creality.com/t/it-is-impossible-to-start-print-on-k1c-after-fw-update-to-1-3-5-22/52843","productLine":"firmware","version":"","problemType":"crash","model":"K1C","grade":"有效","replyCount":3,"views":134,"likeCount":0,"tags":["k1c","trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"7c2d8dde5825c7e9","topicId":52835,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-03","lastActive":"2026-08-04","title":"Elephant's Foot and Brim Don't Play Nice Together","originalText":"When adding a brim, I noticed that the elephant’s foot compensation caused the brim to disconnect from the first layer of the model.\n\n As a workaround I had to turn the brim-object-gap to 0 and slowly turn down the elephant’s foot compensation till it connected with the brim.\n\n Expected behavior is the brim inner distance starts from the elephant’s foot compensated perimeter instead of strictly the model’s.\n\nDepending on the part to print I add a chamfer of 0.5mm tot the bottom, then I don’t have to compensate for elephant foot… adding a chamfer isn’t always possible, but I also don’t need a brim all the time (99,9% of my prints are without!).","url":"https://forum.creality.com/t/elephants-foot-and-brim-dont-play-nice-together/52835","productLine":"print","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":2,"views":31,"likeCount":1,"tags":["bug-report","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"f7d73a6b7efabdef","topicId":52826,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-03","lastActive":"2026-08-03","title":"The ability to have multiple build plates from different printers visible at the same time","originalText":"I’ve been using Creality Print for a while now, and the one thing that bothers me the most is that I have multiple Creality printers, but they are different models. It’s annoying having to switch back and forth between settings for each build plate. I think it would be awesome to be able to open up multiple build plates from different machines all at the same time—like I could have my Ender-5 max build plate with its settings on the same screen as my K2 Plus, or my K1, or my K1 Max, without having to jump back and forth.\n\nI just open multiple copies of Creality Print, though it would be nice to perhaps be able to open it once and they have multiple tabs within it for each printer you want to use.","url":"https://forum.creality.com/t/the-ability-to-have-multiple-build-plates-from-different-printers-visible-at-the-same-time/52826","productLine":"print","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":2,"views":47,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"189ccb0c8ae8a164","topicId":52827,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-03","lastActive":"2026-08-03","title":"Creality Print and material index","originalText":"Please make it so that the Creality Print app detect the material in the .STL files and seperate it different part so that I can easily assign different filament color to each material I assigned in BLender,\n\n Thank you.","url":"https://forum.creality.com/t/creality-print-and-material-index/52827","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":22,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"709d3160f470261e","topicId":52790,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-02","lastActive":"2026-08-11","title":"Painted fuzzy skin not working 7.x","originalText":"I tried to make some fuzzy skin samples, but no fuzzy skin. I’m not sure where I went wrong. The .3MF is attached. The print had 3 objects with different types of fuzzy skin. Can you only have one type? There is one comment in the roll-over help I did not fine, it said:\n\n \n\n Arachne?!?! what is that? I’m sure it is a a setting somewhere, but I’ve never run across it.\n\n fuzzy skin tests.3mf (362.8 KB)\n\nIt does work. Arachne is the wall generator type - see the screenshot. Arachne works better for texture and curves than classic.\n\n image 431×444 15.8 KB\n\nThank You. I’ll give it a try with athe Arachine setting.","url":"https://forum.creality.com/t/painted-fuzzy-skin-not
