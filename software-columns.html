 has the same full functionality as the Windows version.\n\n Selection_005 1287×647 59.9 KB\n\nI appear to be having this issue also, I dont have a windows machine to try this on but I guess its because I am using Linux. Still looking for a fix!","url":"https://forum.creality.com/t/user-filament-settings-unable-to-be-edited-in-creality-print-7-1-1-4472-on-linux-mint/51818","productLine":"print","version":"7.1.1","problemType":"compat","model":"Creality Hi","grade":"有效","replyCount":2,"views":48,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b0c0302d060134ea","topicId":51822,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-08","lastActive":"2026-06-13","title":"Modifiers doesn`t work........?","originalText":"in Creality Print 7.1.1 Windows 11 the Modifiers doesn`t work.\n\n Anyone have the same Problem or i am the only?\n\nI have not seen that problem here.\n\n The issue is that “modifiers don’t work” is not enough information for anyone to troubleshoot. That could mean several different things.\n\n To get a useful answer, you need to provide some specifics:\n\n \n What modifier were you trying to use? \n What object type were you applying it to? \n What exact result did you expect? \n What actually happened? \n Can you post a screenshot of the model, the modifier settings, and the area of the interface you are using? \n \n People are usually willing to help, but they need something more concrete than “doesn’t work.”\n\nI have a frame with 8% Infill. The corners need more infil with a Modifier.\n\n Picture one you see the frame normal, Picture two you see the Area with Modifier, Picture three you see the infill is the same like picture one.\n\n Picture 1:\n\n slicer1 1341×863 242 KB \n\n Picture 2:\n\n slicer2 1315×776 70.1 KB \n\n Picture 3:\n\n slicer3 1250×763 303 KB","url":"https://forum.creality.com/t/modifiers-doesn-t-work/51822","productLine":"print","version":"7.1.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":4,"views":94,"likeCount":0,"tags":["creality-print"],"relReason":"category","sourceType":"用户"},{"uid":"8b95e2cf1a3eb0b3","topicId":51820,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-08","lastActive":"2026-06-08","title":"Why Is the Hourly Machine Cost Not Added to the Total Print Cost?","originalText":"Hourly Cost Setting Is Ignored in Print Cost Calculation \n\n Hello Creality Print Team and users,\n\n I would like to report what appears to be a bug or an unfinished feature in Creality Print.\n\n I currently own two Creality printers, a Creality Hi and a Creality K2 Plus , and I use Creality Print as my primary slicer for both machines.\n\n In the printer settings, there is an option to define an hourly machine cost . This feature is extremely useful for users who sell 3D prints because it helps calculate the true production cost of a part.\n\n However, after slicing a model, the total print cost only includes the filament cost . The hourly machine cost is completely ignored, regardless of the value entered in the printer settings.\n\n For example:\n\n \n \n Filament cost: calculated correctly.\n\n \n \n Print time: displayed correctly.\n\n \n \n Hourly machine cost: configured in printer settings.\n\n \n \n Total print cost: only reflects filament usage.\n\n \n \n As a result, the estimated print cost is inaccurate and cannot be used to properly calculate selling prices or evaluate the real cost of production.\n\n I have already contacted support regarding this issue, but I have not received a solution or clarification. Since the option exists in the software, I would expect it to have an effect on the final cost calculation.\n\n Could the development team please verify whether this is a bug or if the feature has not yet been implemented? Many users, especially those running small businesses or selling printed parts, would greatly benefit from having the hourly machine cost included in the final print cost estimate.\n\n I appreciate all the work being done on Creality Print and hope this issue can be reviewed in a future update.\n\n Thank you for your time and attention.\n\nThe straightforward answer is this: the hourly machine cost setting appears to exist in the interface, but Creality Print does not appear to apply it to the final cost calculation.\n\n That is either a bug, an unfinished feature, or a setting that was added to the UI without being properly connected to the cost model.\n\n That is on Creality to fix.\n\n This is not only a Creality problem in the broad sense. Cost and time estimates are imperfect across slicers. Creality Print is derived from OrcaSlicer, which is derived from Bambu Studio and the Prusa/Slic3r lineage. But once Creality ships it under its own name, with its own printer profiles and its own UI settings, Creality owns the validation.\n\n I use Bambu Studio, OrcaSlicer, and Creality Print. None of them should be treated as calibrated cost-accounting tools out of the box. But Creality Print is especially weak here. The estimates for 0.2, 0.6, and 0.8 mm nozzle profiles are often nowhere near reality. I have had models using the 0.8 mm profile estimate roughly five hours and then finish in under two. If it can’t get the estimated times correctly, then the cost estimates will also be off since the two are related.\n\n image 854×578 106 KB \n\n image 1601×176 31.9 KB \n\n \n\n That points to a larger issue: the profiles and calculation logic do not appear to be seriously validated against actual machine behavior. When changing speeds for specific functions, such as outer wall or inner wall speed, I have not seen a consistently logical relationship between those settings and the resulting time estimate.\n\n image 516×474 17.1 KB \n\n The machine-cost issue is even more basic. If the software provides an hourly machine cost field, then that value should be included in the final print cost. If it is ignored, the feature is effectively broken.\n\n This has been an ongoing problem for years. Unless it starts affecting printer sales, or someone in the open-source community fixes the underlying logic and Creality pulls that work back into its fork, I would not expect this to get much developer attention.","url":"https://forum.creality.com/t/why-is-the-hourly-machine-cost-not-added-to-the-total-print-cost/51820","productLine":"thirdparty","version":"","problemType":"ui","model":"K2 Plus","grade":"有效","replyCount":2,"views":94,"likeCount":2,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"10cb3e89dec70b79","topicId":51799,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-07","lastActive":"2026-06-07","title":"Creality Cloud -Creality cfs desiccant holder (for filament sepera... From SCULPTURED_REALITIES https://www.crealitycloud.com/model-detail/6a247fc3a953031a1f9476c0","originalText":"The Creality CFS Desiccant Holder is crafted to enhance filament storage by efficiently housing desiccant beads while fitting seamlessly into the filament separation slot of the CFS. Its sleek and efficient design is perfect for reducing humidity, thereby improving print quality.\n\n NB.\n\n (model looks solid until you slice it,\n\n YOU can adjust hole size by lessening or increasing sparse infill percantage)\n\n PRINT AT 50% SPEED FOR NEATER OVERHANGS.\n\n this model is less likely to be exposed to room moisture when you open your machine as it sits between the filament spools as apposed to the opened front and rear printed desiccant bead holder/trays thus prolonging your silica bead gels while giving maximum protection to your direct spools and filament\n\n IF YOU STRUGGLE WITH PRINT FAILURES DUE TO MOISTURE,DRY YOUR FILAMENTS FIRST WITH A DRYER,PRINT THESE WHILST DRYING,TOP THEM UP WITH SILICA AND INSTALL FILAMENT WITH CREALITY CFS DESICCANT HOLDER AT SAME TIME FOR OPTIMAL DRYING AND MOISTURE CONTROL OF CFS UNIT\n\n Model can be found on CrealityCloud (downloads free)\n\n Creality Cloud -Creality cfs desiccant holder (for filament sepera… From SCULPTURED_REALITIES 3D Printer Files | 3MF File | Creality cfs desiccant holder (for filament seperation slot) | Creality Cloud \n\n This model was a simple 15minute design using cubes and boolean on Blender, Its a quick under 2 hour print.\n\n It allows you to interact with it be increasing or decreasing sparse infill to get smaller or bigger holes in the desiccant holder.\n\n cmp crealitymaker","url":"https://forum.creality.com/t/creality-cloud-creality-cfs-desiccant-holder-for-filament-sepera-from-sculptured-realities-https-www-crealitycloud-com-model-detail-6a247fc3a953031a1f9476c0/51799","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":56,"likeCount":0,"tags":["creality-cloud","crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"ab32e2a1c2be183e","topicId":51780,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-06","lastActive":"2026-06-07","title":"Fix the right hand side pull out options on Creality Slicer - not rocket science","originalText":"I keep waiting for more people to complain about the fact that half the time you cannot pull out the right hand side option tab so you can see the whole thing. Even on a good day when it “works” you have slide up and down the perimeter line hunting for it. AI says this is a well know problem.\n\nThis has been brought up before, and at this point it is hard to avoid the obvious conclusion: Creality either does not understand the problem or does not care.\n\n The frustrating part is that they started with a good slicer. Orca already worked. Instead of building carefully on top of it, Creality modified working behavior, broke core functions, and shipped the result as if “different” somehow meant “better.”\n\n To be fair, they did add a few quality-of-life improvements. The problem is that those improvements are buried under the new problems they introduced. The issues you are describing are not isolated annoyances. They are symptoms of a slicer that is being changed without adequate regression testing.\n\n Simple example: import an STL or STEP file, modify it in CAD, then refresh the model. STL files refresh. STEP files do not. Why? This is basic workflow functionality. Bambu Studio handles it correctly. Orca handles it correctly. Creality Print somehow manages to break it.\n\n Then there is the navigation cube. Orca has it in the lower left. Creality moved it to the upper right. What problem did that solve? What value did that add? It looks like change for the sake of change.\n\n They also disabled tear-off menus. Again, why? That was useful functionality. Removing useful functionality is not product development. It is vandalism with a version number.\n\n Then there is the filament navigation bar at the top, which is buggy and frequently fails to render correctly. Add a new model to the build plate and Creality Print may place it outside the build area, then throw a false error claiming the plate is full.\n\n And of course there are the typos and bad terminology scattered through the slicer defaults. Calling fan speed “Wind Speed” is not a translation quirk. It is a quality-control failure.\n\n My takeaway from owning a K2: Creality does not appear to do serious regression testing before releasing software. They took a mature slicer(Orca Slicer), changed things that already worked, introduced new bugs, removed useful features, and then pushed it to customers.\n\n That is not innovation. That is careless software development.\n\nJoey you have hit it right on the head. Testing testing testing. If not at least look at the forum and then go back and make the fix!!!","url":"https://forum.creality.com/t/fix-the-right-hand-side-pull-out-options-on-creality-slicer-not-rocket-science/51780","productLine":"thirdparty","version":"","problemType":"ui","model":"K2","grade":"有效","replyCount":4,"views":74,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"29280c4ae6fd4506","topicId":51772,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-06","lastActive":"2026-06-06","title":"Having huge problem and customer support suck!","originalText":"I’ve almost had it we spend a lot of money on the K2 pro and last firmware up date made it useless. It’s starts a print and stops line 2 wtf ! We depended on it to make money! Now I’m looking around for something else ! Anyone have any ideas what’s up with the new update ?\n\nHi @Rainbow_fyer !\n\n Sorry that your having trouble with your K2 printer. Please tell us if the printer shows any error code while stopping the print? It is happening with the specific file or have you tried printing any other gcodes?\n\n Best regards,\n\n Krzysztof!","url":"https://forum.creality.com/t/having-huge-problem-and-customer-support-suck/51772","productLine":"firmware","version":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":43,"likeCount":0,"tags":["trouble-shooting","k2pro"],"relReason":"category","sourceType":"用户"},{"uid":"5416bf661d442a4f","topicId":51759,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-05","lastActive":"2026-06-05","title":"Recommendations for alternatives to Creality Print (documentation is my major gripe)","originalText":"After several months of using my K1C, I am ready to pull the plug on Creality software and switch to another slicer. My biggest problem is the scant documentation along with the complex menu system. I suspect there are other settings panels I still don’t know about ‘cos I haven’t randomly clicked on the pixel which opens them).\n\n Would like to know what users of other slicers have to say. I would be happy to switch to almost any slicer which has online, searchable written documentation. (I am definitely NOT interested in watching a dozen YouTube videos in search of the thirty second segment which might have the answer to my question)\n\n thanks in advance\n\n LJ\n\norcaslicer (which is what creality print is based on)","url":"https://forum.creality.com/t/recommendations-for-alternatives-to-creality-print-documentation-is-my-major-gripe/51759","productLine":"thirdparty","version":"","problemType":"ui","model":"K1C","grade":"有效","replyCount":2,"views":48,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"fb110445c63991a5","topicId":51712,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","date":"2026-06-04","lastActive":"2026-09-12","title":"Покупки на баллы в creality cloud","originalText":"Здравствуйте, спешу поделиться радостью! Сегодня получил посылку от Creality, в приложении Creality Cloud, заработал баллы ( ежедневно посещаю облако и отмечаюсь там, выполняю задания, выкладываю модели и за это получаю вознаграждение) и на них купил катушки пластика и первая сегодня пришла мне по почте, очень рад, что система поощрений реально работает, хочу выразить огромную благодарность производителю Creality и всем сотрудникам этой фирмы за ваш труд и прекрасную продукцию которая позволяет реализовать творческий потенциал и идеи в жизнь.\n\n 20260604_113615 1920×2560 300 KB \n\n 20260604_113653 1920×2560 313 KB \n\n 20260604_113648 1920×2560 397 KB \n\n 20260604_113625 1920×2560 424 KB \n\n Screenshot_20260604_205707_Creality Cloud 1080×2340 228 KB\n\nЗдравствуйте, сколько дней посылка шла? Тоже катушку заказал, с 23 июля никак не дойдёт.\n\nЗдравствуйте, заказывал 8 мая в июне приехала, но если долго не идет напишите в техподдержку, в отдел продаж в Creality cloud они напишут вам на электронную почту и сними вопрос по посылке решится очень быстро , а если филамент не отправили баллы вернут у меня был такой опыт.","url":"https://forum.creality.com/t/creality-cloud/51712","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":77,"likeCount":1,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"0a0a8d4be00c81cf","topicId":51720,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-04","lastActive":"2026-06-04","title":"App Crash on Filament Profile Access After Update – v7.1.1.4472 macOS M4","originalText":"Subject: Creality Print 7.1.1.4472 — Crash on Filament Profile Access / Cloud Sync Loop (macOS, M4) \n\n Device: Mac Mini M4 OS: macOS Sequoia App Version: Creality Print 7.1.1.4472 Printer: Creality Hi\n\n Issue: Since updating to version 7.1.1.4472, Creality Print crashes consistently when accessing filament profiles. The issue began on approximately May 27, 2026 and has persisted across every session since.\n\n Confirmed from logs: \n\n \n \n On startup, dozens of system config files throw errors for deprecated keys ( material_flow_dependent_temperature , material_flow_temp_graph ) that were removed in the new version but still exist in the installed system profiles.\n\n \n \n Every time the filament panel is opened, the app enters a runaway loop attempting to sync filament presets to Creality Cloud, receiving repeated status=429 and error code 1088 responses (“Please do not repeat the same operation many times”). This loop appears to cause the crash.\n\n \n \n In one session, loading a 3MF file caused the filename to be logged dozens of times in rapid succession, suggesting a second runaway loop triggered by file loading.\n\n \n \n Logs show isFilamentUserMaterialValid userMaterial= with a blank value, suggesting the update broke recognition of existing user filament profiles, which may be the root cause triggering the sync loop.\n\n \n \n Logs available upon request. I have 18 session logs documenting the issue consistently from May 27 through June 4, 2026.\n\n Please investigate the filament profile migration and cloud sync behavior introduced in this update.","url":"https://forum.creality.com/t/app-crash-on-filament-profile-access-after-update-v7-1-1-4472-macos-m4/51720","productLine":"cloud","version":"7.1","problemType":"crash","model":"Creality Hi","grade":"有效","replyCount":1,"views":40,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"335ee7c85c00bf26","topicId":51633,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-02","lastActive":"2026-06-03","title":"No thumbnail to printer kc1","originalText":"Can not get thumbnails to appear on printer(kc1)\n\n Not seeing fields under advanced Creality print ver 7\n\n 1 thumbnail size eg 96x96 etc\n\n 2 format eg png\n\nLastest Firmware? Latest version Creality Print?\n\nCreality version 7.1\n\n firmware version 1.3.2.31\n\n can get thumbnails to appear on k1 max\n\n can not get thumbnails to appear on K1C\n\n any ideas please","url":"https://forum.creality.com/t/no-thumbnail-to-printer-kc1/51633","productLine":"firmware","version":"","problemType":"ui","model":"K1","grade":"有效","replyCount":3,"views":47,"likeCount":0,"tags":["trouble-shooting","creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"ec90293618bc9347","topicId":51634,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-02","lastActive":"2026-06-02","title":"Creality Print 7 with Ender 3 S1 Pro","originalText":"I’ve been using my Ender 3 S1 Pro with a Sonic Pad and Creality Print 4 for some time.\n\n I’ve replaced my computer, and I’ve downloaded the latest version of Creality Print 7.\n\n I can see the Ender 3 S1 Pro as an option, but there isn’t an option for the Sonic Pad with an S1 Pro.\n\n What’s the best way to set it up? If I just just select the S1 Pro, does that mean it won’t take advantage of the faster Sonic Pad capability?","url":"https://forum.creality.com/t/creality-print-7-with-ender-3-s1-pro/51634","productLine":"print","version":"7","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":39,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4a9e163ef4bfebf7","topicId":51610,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-01","lastActive":"2026-06-01","title":"Mesh boolean time?","originalText":"Has anyone had a Mesh Boolean take hours to process??\n\n Thanks\n\n Steve\n\nIn Creality Print? No.","url":"https://forum.creality.com/t/mesh-boolean-time/51610","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":43,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b21a59486a27ab99","topicId":51593,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","date":"2026-05-31","lastActive":"2026-06-01","title":"Не работает служба поддержки после обновления v7.3.4","originalText":"Здравствуйте, после обновления приложения на v7.3.4 не работает онлайн поддержка, сброс настроек, очистка данных и кэш не помогает, до обновления все работало исправно.\n\n Screenshot_20260531-225733 1080×2436 179 KB \n\n Screenshot_20260531-230134 1080×2436 46 KB\n\nTry with posting in English… I’m too lazy to use Google Translate…\n\nHello, after updating the application to version 7.3.4, online support does not work. Resetting settings, clearing data and cache does not help. Everything worked properly before the update.","url":"https://forum.creality.com/t/v7-3-4/51593","productLine":"print","version":"7.3.4","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":47,"likeCount":0,"tags":["creality-cloud"],"relReason":"category","sourceType":"用户"},{"uid":"cc94fe6666ff532b","topicId":51559,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-30","lastActive":"2026-05-30","title":"Minimum tree base diameter","originalText":"Is there a way in creality print to force a minimum tree trunk starting diameter? Support branch diameter doesn’t seem to affect the starting diameter and first layer expansion just creates a brim.\n\n image 987×694 186 KB","url":"https://forum.creality.com/t/minimum-tree-base-diameter/51559","productLine":"print","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":28,"likeCount":0,"tags":["creality-print"],"relReason":"category","sourceType":"用户"},{"uid":"9b53dce3a564b2cd","topicId":51543,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-29","lastActive":"2026-05-29","title":"Default print settings for ender V3 outside the printers abilities!","originalText":"In creality print the default speed and jerk settings for 0.12 and 0.16 layer hieght are way above what the Ender 3 V3 can actually do. so much so that the software gives me a warning at least for the jerk settings. How can Ender get their own settings wrong and then warn about themselves getting the settings wrong?\n\n makes me wonder what else is wrong. I noticed the line width was bigger on the thinner layers, this doesn’t seem right to me but I am a newb to 3D prinitng.","url":"https://forum.creality.com/t/default-print-settings-for-ender-v3-outside-the-printers-abilities/51543","productLine":"print","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":65,"likeCount":0,"tags":["creality-print","ender-3-v3-ke","ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"57212b97a97f9d4c","topicId":51532,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-28","lastActive":"2026-09-11","title":"Creality print not opening","originalText":"I hope someone is able to help. My Creality Print app is not opening all of a sudden. I have removed it from my Mac laptop and reinstalled it. I have updated my computer and 3D printer. I have restarted my laptop. NOTHING is working. This is so frustrating. I don’t know why it stopped working all of a sudden. Please help\n\ncan’t really say what could be going wrong, as it’s very likely something very specific to your laptop. what i can say is that you can use orca slicer while you troubleshoot and see what might be the issue/conflict on your laptop\n\nDid you manage to solve the problem? I got the same error.","url":"https://forum.creality.com/t/creality-print-not-opening/51532","productLine":"thirdparty","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":3,"views":70,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1ef25c38c835eafa","topicId":51533,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-28","lastActive":"2026-06-04","title":"Can't send to OctoPrint server from Creality Print","originalText":"I have the Ender-3 S1 Pro, and I’ve set up an OctoPrint server for it. OctoPrint is working great, sending prints and returning data, and I can use it via web UI on my home LAN.\n\n Now I want to send prints to it from Creality Print (v7.1.1.4472). I don’t want to go through Creality Cloud, I’m expecting this should work locally on the LAN without any account logins. I did install the Creality Cloud plugin in OctoPrint, but I suspect that shouldn’t even be necessary.\n\n In the Device section of Creality Print, I manually added a new “other” printer of type “Octo/Klipper”. I gave it the IP address and API key, and the test connection is successful (screenshot #1 ). The new device appears in the sole device group ( #2 ). I can click “Details” on that device, and the OctoPrint web UI loads in Creality Print ( #3 ).\n\n The trouble is when I slice the plate, then choose “Send print” (screenshot #4 ). There are no devices available to choose from. I’ve deleted and re-added the printer a bunch of times, restarted Creality Print and my whole PC, but the printer never shows up here.\n\n So can anyone help me send a print to the printer? Thanks!\n\n Screenshot 2026-05-28 173713 1108×1358 71.4 KB \n\n Screenshot 2026-05-28 173742 1454×1252 55.4 KB \n\n Screenshot 2026-05-28 173759 1968×924 38.1 KB \n\n Screenshot 2026-05-28 173840 1752×1294 138 KB\n\nhey, did you find fix for this? I have exact problem as yours.\n\nSadly, no. I’m starting to wonder if it isn’t even possible, and it can only be done via cloud.\n\n For comparison I should try sending something from Cura/Prusa/some other slicer and see if that works, just to confirm my Octoprint server isn’t the source of the problem. I just haven’t had the free time to try that yet.","url":"https://forum.creality.com/t/cant-send-to-octoprint-server-from-creality-print/51533","productLine":"thirdparty","version":"7.1.1","problemType":"ui","model":"未标注","grade":"有效","replyCount":4,"views":292,"likeCount":0,"tags":["crealityprint","trouble-shooting"],"relReason":"tag","sourceType":"用户"},{"uid":"28da88bf397d15c7","topicId":51512,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-28","lastActive":"2026-05-28","title":"Creality Print Vers. 7.1.1.442 Not loading or deleting Local Files?????🤷‍♂️","originalText":"Hello, in the last few weeks, When I “Send Print” to my K2 Pro, it does not show up in the local files section. I have to open a new project/Creality Print and it shows up then, so I can not print it. \n\n Like wise when I delete a print from the local files section, it does not disappear, but when I open a new project/CR it has gone. \n\n Can anyone explain why? As it used to show/delete print files straight away, just like deleting/moving any files within Finder etc.\n\n TIA \n\nJonny","url":"https://forum.creality.com/t/creality-print-vers-7-1-1-442-not-loading-or-deleting-local-files/51512","productLine":"print","version":"7.1.1","problemType":"crash","model":"K2 Pro","grade":"有效","replyCount":1,"views":42,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"843bcbd7210819ef","topicId":51482,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-27","lastActive":"2026-05-27","title":"An Idea for the Creality Team to help fix single color layer lines.","originalText":"Most times when you print in multi-color layers on complex curves, you end up with staggered single layers which wastes time and material. Could we have a simple “Ignore Single Layers” button? It would simply default to the next color and skip the single print layers.\n\n If this exists and I missed it then could someone please point this out.","url":"https://forum.creality.com/t/an-idea-for-the-creality-team-to-help-fix-single-color-layer-lines/51482","productLine":"print","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":22,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"b4b5ce9de7c090d6","topicId":51448,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-26","lastActive":"2026-05-26","title":"Feature request = axis Jerk settings","originalText":"When printing tall skinny objects on a bed slinger printer I think the jerk and accleration of the bed becomes the main cause of failed prints. I understand some other slicer software allows you to set the jerk settings of the axis indipendently so you can reduce these failures. A more advanced option would be to set a top and bottom layer jerk/acceleratoin speed. IE the higher you print the slower it goes as the more prone to failure.\n\n and yes I know skinny objects should be printed with brims.","url":"https://forum.creality.com/t/feature-request-axis-jerk-settings/51448","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":24,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"a5681024fa9e6380","topicId":51381,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-22","lastActive":"2026-05-25","title":"Cannot print my uploaded models, only ones direct print from \"explore\"","originalText":"Hello!\n\n If I slice some of my uploaded models and send to print, it shows the “creality heart” as if loading or sending to the printer but then nothing happens. It’s as if it times out and won’t send at all. Some of these are models i’ve printed before but removed from my local files.\n\n But if I tap the “explore” button, and hit the “One-Click Printing” button, it sends to printer, no problem and prints just fine.\n\n I have my own designs I would like to print rather for my business…any ideas on how I can get this back up and running?\n\n Creality is so frustrating to work with \n\n TIA\n\nWhich printer is this exactly? As you posted it in the software category not in a printer sub forum. And where do you try to upload it from? Creality Print 7?","url":"https://forum.creality.com/t/cannot-print-my-uploaded-models-only-ones-direct-print-from-explore/51381","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":28,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"74a7299e850a9776","topicId":51374,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-21","lastActive":"2026-05-21","title":"Support transition layers","originalText":"What is support transition layers in CP7.1.1 and why it prints with speed from external bridge setting? It’s looks like just another few support interface layers but with different speed settings in some reason took from external bridge setting. I tried to find some settings of support transition throu search but nothing there.\n\n Can I somehow disable it? There is no any support transition layers in Orca.\n\n The more i use CP the more i want to move to Orca. The two reason I still didn’t are my laziness is to transfer the print profile(what is soon will be not actual because one man doing it now) and not working camera in fluidd even with root and K2 camera script installed.\n\n As long as you print CP models of cats from PLA on the default profiles, everything is fine, but once you start trying to improve the print quality or use something other than PLA or print more complex models, the headache begins. Either there are no necessary settings that are available in the Orca, or the slicer somehow strangely builds a path. I’m tired of this.\n\n The persistent desire of creality to cram more online integration into the slicer in the absence of the introduction of new features from Orca and other slicers and generally strange solutions such as the same extra layers of support kills the desire to remain in the creality ecosystem.\n\n Sorry. I’ve been struggling with some creality software for the last few days, and I’ve been boiling over.","url":"https://forum.creality.com/t/support-transition-layers/51374","productLine":"print","version":"","problemType":"ui","model":"K2","grade":"有效","replyCount":1,"views":32,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9207cd3d340d234b","topicId":51318,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-20","lastActive":"2026-09-05","title":"Finding firm ware for Ender 3","originalText":"I have an Ender 3, no BL Touch, just plain Ender 3. Just put in new 4.2.7 silent board, looking for firm ware v4.2.7 and v1.1.0.57, these are in my other Ender 3 and it works great. I have gone to the Creality Cloud but my Ender 3 is not listed, I guess they took it off since they don’t sell it any more. So I can’t seem to find the firm ware. Any help would be greatly appreciated, I need my other machine running. I have the same board in my other machine.\n\nBest place I know for older printer firmware is a facebook group - (1) Nic’s 3D Printer Support & Firmware | Facebook\n\nEnder Series Firmware Download | Creality 3D Printer Firmwares \n \n\n \n \n\n Ender Series Firmware Download | Creality 3D Printer Firmwares \n\n Find all Creality firmware downloads for your Ender Series 3D printers, including ender 3, ender 3 pro, and ender 3 s1, etc. Update your printer with the latest firmware for optimal performance.","url":"https://forum.creality.com/t/finding-firm-ware-for-ender-3/51318","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":127,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"71c3b50897217f47","topicId":51334,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-20","lastActive":"2026-05-24","title":"pausing for filament change","originalText":"Hi All,\n\n I’m new here and I very much doubt I’m not alone in requesting this feature but I’m really surprised that there is no tick box in the multifilament tab for pausing to change colours.\n\n I understand you can insert a pause by going thorugh the preview layers. But this is a cumbersome method if you have already set up multiple filaments in the prepare section.\n\n Apologies if someone has already requested this or I’m missing somehting. I had a search and couldn’t see anyone else requesting this.\n\nSe não tiver o CFS, por exemplo, a troca do filamento deverá ser manual mesmo\n\nWill be not «easy solution» because the pause is already implemented on the preview.\n\n the slicer can handle color change on CFS setups but on monofilament printers that is the only way.","url":"https://forum.creality.com/t/pausing-for-filament-change/51334","productLine":"print","version":"","problemType":"ui","model":"Ender-3 V3 SE","grade":"有效","replyCount":9,"views":265,"likeCount":9,"tags":["creality-print","ender-3-v3-se","feature-need"],"relReason":"category","sourceType":"用户"},{"uid":"3965f116cc919f1c","topicId":51342,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"DE","date":"2026-05-20","lastActive":"2026-05-20","title":"Vers. 7.1.1.442 aktuelles .stl Objekt löschen und neues anwählen","originalText":"Guten Tag, ich verwende Creality Print Vers. 7.1.1.442 und einen Sparkxi7. Habe damit schon einiges gedruckt und bin recht zufrieden.Ich verwende fast nur selbst entwickelte .stl Files (vorher mit OpenScad erstellt). Nun kann es sein, dass ich ein falsches .stl File in den Creality Print geladen habe oder aber ich will noch ein anderes File slicen und drucken. wie kann man ein geladenes File herauslöschen ? Danke für jede Info.\n\n Gruß aus Salzburg","url":"https://forum.creality.com/t/vers-7-1-1-442-aktuelles-stl-objekt-loschen-und-neues-anwahlen/51342","productLine":"print","version":"7.1.1","problemType":"","model":"SPARKX i7","grade":"泛讨论","replyCount":1,"views":27,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"57e7784e36949e5f","topicId":51253,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-17","lastActive":"2026-07-03","title":"Filament purging takes place next to the recovery cup.","originalText":"Hello word,\n\n Why my filament purging is on bed , not in cup ?\n\n Regards\n\n IMG_1848 1512×2016 179 KB\n\nHi!\n\n This is weird. Is it happening with every print? Have you tried to run full printer calibration?\n\n Best regards\n\nI have done calibration before. but many problem with this printer …….","url":"https://forum.creality.com/t/filament-purging-takes-place-next-to-the-recovery-cup/51253","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":41,"likeCount":0,"tags":["k2-se"],"relReason":"category","sourceType":"用户"},{"uid":"c0faf09a0b6e54a4","topicId":51180,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-14","lastActive":"2026-05-14","title":"Creality Pixel Plaque","originalText":"Designed a Creality pixel plaque with 3 different print methods.\n\n \n If you have 2 or more cfs just load your colors and print. \n .If you only have one CFS unit, follow this trick to avoid using a “Pause” command: \n \n Setup: Map your Base and Legs/Arms to the same filament slot in your slicer.\n\nFirst Phase: Load your Base Color (e.g., Blue) into that slot and start the print.\n\nThe Swap: After Layer 16 (approximately 2 hours in), once the base is finished, simply perform a “Hot Swap” by pulling the Base Color out of the CFS and loading your Leg/Arm Color (e.g., Gray) into the same slot.\n\nResult: No pause is required, and the printer will continue with the new color for the remaining detail!\n\n \n each part can be printed by them self and then glued to the base plate. The baseplate is recessed so you can easliy align the parts. each pixel is single so you it will take you some time to assemble, great rain day project. \n \n \n ChatGPT Image May 12, 2026, 02_23_38 PM 1448×1086 146 KB 3D Printer Files | 3MF File | Creality Pixel Plaque - High Detail Display Piece | Creality Cloud","url":"https://forum.creality.com/t/creality-pixel-plaque/51180","productLine":"cloud","version":"","problemType":"","model":"SPARKX i7","grade":"泛讨论","replyCount":1,"views":45,"likeCount":1,"tags":["creality-cloud","cmp","crealitymaker","sparkxi7","k2plus","contest","multicolor","crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"ada72ebbfeef09d4","topicId":51116,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-11","lastActive":"2026-05-12","title":"The green links are unreadable, please change their color.","originalText":"On Creality print Mac the links that show up in green are unreadable. Please change that color.\n\n Capture d’écran 2026-05-11 à 10.50.50 1080×856 151 KB\n\nIf you see the message you know there is a link to click on… green seems to be Creality favourite color \n\n You could try a dark background…\n\nIt’s very clear when the background is black or in dark mode","url":"https://forum.creality.com/t/the-green-links-are-unreadable-please-change-their-color/51116","productLine":"print","version":"10.50.50","problemType":"ui","model":"未标注","grade":"有效","replyCount":6,"views":48,"likeCount":1,"tags":["creality-print"],"relReason":"category","sourceType":"用户"},{"uid":"59d59581bada20d4","topicId":51125,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-05-11","lastActive":"2026-05-13","title":"Missing Network Tab","originalText":"I just got my first K1C setup, but it does not have a Network tab. From other topics it seems it is running a “service” firmware, whatever that is? I tried updating the firmware using the standard ways, but the printer’s OS doesnt recognize the new firmware.\n\nis a second hand printer?\n\n also you can contact directly creality support using any of this methods:\n\n \n \n \n \n \n Customer Service Updated News and Announcement \n \n \n \n WHATSAPP \n +86 19007569370 \n +86 19925217817 \n Working time: \n09:00-18:00 UTC+8 \nTOLL FREE \n:telephone:US: 1 833 513 5012 \n:telephone:Brazil: 0800 892 4077 \n:alarm_clock:Working time: \n09:00-21:00 UTC+8 (Weekdays) \n09:00-18:00 UTC+8 (Non-working days) \n:telephone_receiver:TELEPHONE \n +86 755 3396 5666 \nWorking time: \n:alarm_clock:09:00-21:00 UTC+8 (Weekdays) \n:alarm_clock:09:00-18:00 UTC+8 (Non-working days) \n:envelope:EMAIL \nAfter-…\n\nEnglish: Hey, I found the solution and I want to leave a record here because it’s tricky.\n\n The Problem: Many K1C units sold in Brazil come with Wi-Fi disabled by default. To enable it, you MUST update the firmware using the correct file for the new 2025 hardware.\n\n The Solution: \n\n \n \n Go to the Creality Cloud Download Page .\n\n \n \n CRITICAL: Check your mainboard model. For the 2025 version, the board is CR4SU200382C13 .\n\n \n \n Download ONLY the latest version. I used V1.0.0.26.20251024S .\n\n \n \n WARNING: I tried an older 2025 firmware (V1.0.0.23) and the display stopped working completely . I got extremely lucky and managed to blind-click the “update” button to install the newer version and fix the screen. If you use a firmware for a different board, the printer won’t even recognize it.\n\n \n Português: Pessoal, encontrei a solução e quero deixar registrado porque o processo é arriscado.\n\n O Problema: Muitas unidades da K1C vendidas no Brasil vêm com o Wi-Fi desabilitado de fábrica (sem o menu Network). Para resolver, é obrigatório atualizar o firmware para a versão correta da nova placa de 2025.\n\n A Solução: \n\n \n \n Acesse a Página de Downloads da Creality .\n\n \n \n CRUCIAL: Verifique o modelo da sua placa. A placa da K1C 2025 é a CR4SU200382C13 .\n\n \n \n Baixe APENAS a versão mais recente. A que funcionou para mim foi a V1.0.0.26.20251024S .\n\n \n \n AVISO DE PERIGO: Eu tentei uma versão mais antiga de 2025 (V1.0.0.23) e o display parou de funcionar . Ficou tudo preto. Dei muita sorte de conseguir clicar no “botão invisível” de atualizar para a versão nova e recuperar a tela. Se tentar instalar o firmware de outra placa (modelo antigo), a impressora nem reconhece o arquivo.","url":"https://forum.creality.com/t/missing-network-tab/51125","productLine":"firmware","version":"","problemType":"ui","model":"K1C","grade":"有效","replyCount":3,"views":132,"likeCount":2,"tags":["trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"8bfcff61ee74324f","topicId":51109,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-10","lastActive":"2026-05-13","title":"Filler and filament changing / setting?","originalText":"Good day, IDK if this is the right area to ask, but how and I get my slicer to not change CFS filaments over 300x. I am only changing colors 2x. But for some reason when I painted it, it left behind small lines of the other color as the filler. I have played with the settings to get it to one color where I want it, no luck. I have included a screenshot of what I am talking about. Anyone have any ideas?\n\n Screenshot 2026-05-10 161957 1913×992 151 KB\n\nHello @Dr.Goldfinger \n\nWelcome to the Creality Forum…! \n\n It might depend on which paint tool you are using that would cause that problem.\n\n Height-Range 305×372 16.8 KB \n\n I can’t tell from the picture what tool you used but if it’s a continuous line across maybe try the “Height range” tool. I use it if I’m making stripes or lines across a model.\n\nThis was the tool I was using and I could only paint a few mm at a time. It took a while (for some reason it was really putting a load on my PC, I could hear all my fans kick into gear) but I got it done. Then it took another century to slice it and that’s when I noticed the Filament Change number. So I investigated it and discovered the little lines within the body that I had already painted.\n\n Screenshot 2026-05-10 190617 334×401 17.2 KB","url":"https://forum.creality.com/t/filler-and-filament-changing-setting/51109","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":11,"views":125,"likeCount":5,"tags":["crealityprint","slicingsoftware","k2pro"],"relReason":"tag","sourceType":"用户"},{"uid":"370427631c8b7d2e","topicId":51102,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-10","lastActive":"2026-05-11","title":"Ender 3 v3 plus extrusion problems","originalText":"Hey so I bought a Ender 3 v3 plus over a year ago. I have had almost zero problems so far, until now. I noticed I had layers that were missing. Eventually it got worse and I tried printing a test benchy that came on it. It was terrible! It printed the first few layers then was a stringy mess! I tried just letting it extrude and noticed it would pause a second then continue. I took it apart then got a new nozzle. The extruder gears were slightly caked but not bad. I cleaned it, put it back together, and tried some brand new filament. The new filament was sunlu matte pla. I tried printing the benchy that came on it again, it to was terrible. I noticed that the gears were super caked again. I realized that it was printing at 600mms. The filament said the max speed was 300mms. I changed settings and printed a test print. It was great. I changed filament types in creality print to the filament I used for the test. It was good but had another mess up eventually. I noticed the gears were a little clogged again. The only thought I had was maybe creality print doesn’t change the speed when you change the filament type on a previous file. I’m not the best with all this stuff. Anyone have any suggestions?\n\nThe speed is set in 2 places in the slicer: On the speed tab and in the filament profile under max volumetric speed. Make sure you are not running 20+ for the later - I accidentally did that once Creality print does adjust speed but I think the filament profile is what takes precedence.","url":"https://forum.creality.com/t/ender-3-v3-plus-extrusion-problems/51102","productLine":"firmware","version":"","problemType":"feature","model":"Ender-3 V3 Plus","grade":"有效","replyCount":2,"views":84,"likeCount":2,"tags":["ender-3-v3-plus","creality-print","slicingsoftware","trouble-shooting","filament","firmware","parts-replacement"],"relReason":"tag","sourceType":"用户"},{"uid":"6e27d2adfb9491ac","topicId":51080,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-09","lastActive":"2026-05-09","title":"Whats the networking issue with Creality Print 7.1 .1.4472 - Camera is about 1 frame per minute?","originalText":"Hi\n\n I’ve just updated to the latest version (7.1.1.4472), and the video feed from my Creality Hi is now about one frame per second - it appears that I can upload a model without issue - I’m currently printing, but I need to keep going to visually inspect progress… Up til now, the video has been fine - other items on my network are working fine - I’ve checked on the printer, and its at latest firmware…\n\n Anyone having similar problems?\n\n Thanks in advance\n\n Carl.\n\nThink I’ve located the issue - I’d got another process running on the network, and it was maxing out the connection to the garage where my printer is… duh… :-/","url":"https://forum.creality.com/t/whats-the-networking-issue-with-creality-print-7-1-1-4472-camera-is-about-1-frame-per-minute/51080","productLine":"firmware","version":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":2,"views":62,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"14b2489800eca4af","topicId":51077,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-09","lastActive":"2026-05-09","title":"Recent Projects default folder","originalText":"Can anyone tell me where the recent projects files are kept in windows 11. I work across multiple pcs and would like the same recent projects synched across the devices.\n\n Thanks\n\nIf you are talking about the item «Recent Projects» on the File menu of Creality Print, THERE IS NO DEFAULT folder, as you can see is the full path of the last open projects, on the Creality Print you save a list of the full path of the last files you opened.\n\n image 766×253 19.2 KB \n\n If you want to preserver THE LIST no the files those are saved on the Creality Print config file, That file is stored on “%APPDATA%\\Creality\\Creality Print\\7.0\\Creality.conf” (FOR CREALITY 7.0)\n\n Be aware of that file can not be manually edited and contains ALL THE CREALITY PRINT SETTINGS.\n\n Also on that route there are the folders\n\n “%APPDATA%\\Creality\\Creality Print\\7.0\\system”\n\n “%APPDATA%\\Creality\\Creality Print\\7.0\\user”\n\n which contains the profiles you must backup user one.","url":"https://forum.creality.com/t/recent-projects-default-folder/51077","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":57,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"07f90d6603f842fb","topicId":51069,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-08","lastActive":"2026-05-10","title":"Ender3 S1","originalText":"On the Ender 3 S1 I have it all back together with a new Creality Sprite Extruder Pro installed. I want to be able\n\n download on the cloud but I cannot find the IP address. I have followed the instructions and I am at a loss. Also I cannot even download on to my SDH card. Helppp.\n\nThe Ender 3S1 or S1 pro does not have Wi-Fi of Ethernet on board. You would have to add a raspberry pi running Octoprint or a Sonic Pad to enable the printer to connect to Wi-Fi.\n\n Bill\n\nThank you. Guess I need to flash my SDHC card. I can’t remember how my son showed me. Any help would be greatly appreciated.","url":"https://forum.creality.com/t/ender3-s1/51069","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":4,"views":108,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1dc2bf8470f46e60","topicId":51064,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-08","lastActive":"2026-05-08","title":"Suche gratis Programm um STL Modellle in Teile zu zerlegen","originalText":"Hallo Leute, suche ein gratis Programm zum zerlegen von STL dateien\n\nSplitting a STL can be done via the slicer creality print for example :","url":"https://forum.creality.com/t/suche-gratis-programm-um-stl-modellle-in-teile-zu-zerlegen/51064","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":24,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0a8b79b30238fa4c","topicId":51016,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-05","lastActive":"2026-05-05","title":"Creality software not allowed by IT Dept. Other Options?","originalText":"Hello, I am brand new to 3d printing and when I asked for software to be installed on our existing 3d printers I was informed that due to 3rd party dependencies the software wasnt allowed. Are there other options out there that are compatible with my Ender 3 Pro?\n\nOrca Slicer is the best open source option of Prusa based Slicer.\n\nas creality print is a fork of orca, i don’t see that they’ll install that one either, but you can give it a try","url":"https://forum.creality.com/t/creality-software-not-allowed-by-it-dept-other-options/51016","productLine":"thirdparty","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":127,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"a37659636c01d38b","topicId":50991,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-04","lastActive":"2026-05-04","title":"miana dyszy na 0.2mm w Creality Print","originalText":"Hi, I’m having trouble setting up the Creality Print program for a 0.2 mm nozzle and a K1C printer. I created a new profile in the printer section for that nozzle. I saved it as a user profile and selected it, but in the filaments section, I still only see profiles for a 0.4 mm nozzle. How do I change these settings? I’m using the latest version 7 of the program.","url":"https://forum.creality.com/t/miana-dyszy-na-0-2mm-w-creality-print/50991","productLine":"print","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":23,"likeCount":0,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"9f8bd17716efa17b","topicId":50968,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-03","lastActive":"2026-05-03","title":"SOLVED: Why is this happening in Creality Print?","originalText":"Onlayer 4 a random blue circle appears and is ruining the white look. It only shows up on layer 4 and I have tried everything from changing the size, the infill, and still dont know whats creating it.- turns out moving the white down one layer completly removed the circle all together, no idea why but it worked.\n\n 20260502_184459 1920×3410 793 KB \n\n 20260502_184449 1920×3410 792 KB \n\n 20260502_184455 1920×3410 760 KB \n\n bogg.3mf (1.8 MB)\n\nCould be bottom shell layers or wall loops see if reducing it does anything.\n\nIt currently has 3 bottom shell layers, I have reduced it to 1 and the circle shows up on 2.\n\n It has 2 wall loops, even when I reduce or increase the wall loops it still shows up as well. I’m stumped and add the 3mf","url":"https://forum.creality.com/t/solved-why-is-this-happening-in-creality-print/50968","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":88,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7b6918abaeaee0ee","topicId":50976,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-05-03","lastActive":"2026-05-03","title":"La aplicación no ordena los archivos locales correctamente","originalText":"Cuando se muestran los archivos locales en el apartado Dispositivo, y se ordenan por tiempo de creación, estos archivos de muestran ordenados de manera incorrecta.\n\nEn mi caso hoy 3 de mayo de 2026, el archivo creado hoy, se muestra entre los archivos generados el 3 de mayo de 2025 y 15 de Abril de 2026, cuando debería ostrarse el primero en la lista\n\n¿En qué sistema operativo? ¿qué versión de Creality Print? y qué impresora. normalmente ese «sitio web» don de se gestiona el dispositivo hace parte del firmware de la impresora y no está en Creality Print.\n\nAcabo de mirar en mi Creality Print 7.1.1.412 en Windows 11 conectado a mi Creality Print con firmware CR4NU200360C20_ota_img_V1.1.0.65 y me dí cuenta de algo extraño, los botones de selección de ordenamiento tienen tres posiciones:\n\n Ascendente\n\n \n\n \n\n Descendente\n\n \n\n \n\n Y NINGUNO\n\n \n\n \n\n El problema es que es muy sutil la diferencia de colores entonces no es facil saber en cual está tanto en modo obscuro o claro la diferencia no es notable.","url":"https://forum.creality.com/t/la-aplicacion-no-ordena-los-archivos-locales-correctamente/50976","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":23,"likeCount":0,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"cbf2804810204851","topicId":50973,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-05-03","lastActive":"2026-05-03","title":"Cooling problem on Creality Print and K2 Plus","originalText":"Hello,\n\n i have problems with the cooling profiles on Creality Print with my K2 Plus. I’m tring to resolve a problem with bridges with ASA, so i downloaded a Bridge test. Then i tried to set the cooling profiles as show on the screenshot, but when the fan ishould to turn on it doesn’t.\n\n Thanks for the attention\n\n Screenshot 1 1223×835 110 KB \n\n Screenshot 2 1000×566 28.7 KB \n\n Screenshot 3 1567×638 145 KB","url":"https://forum.creality.com/t/cooling-problem-on-creality-print-and-k2-plus/50973","productLine":"print","version":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":1,"views":33,"likeCount":0,"tags":["k2-plus"],"relReason":"category","sourceType":"用户"},{"uid":"8ea0ce7961866506","topicId":50908,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-30","lastActive":"2026-04-30","title":"CrealityPrint under Linux Mint-Mate","originalText":"I have a computer running Linux Mint-Mate:\n\n NAME=“Linux Mint”\n\nVERSION=“22.3 (Zena)”\n\nID=linuxmint\n\nID_LIKE=“ubuntu debian”\n\nPRETTY_NAME=“Linux Mint 22.3”\n\nVERSION_ID=“22.3”\n\nHOME_URL=“ https://www.linuxmint.com/” \n\nSUPPORT_URL=“ https://forums.linuxmint.com/” \n\nBUG_REPORT_URL=“ http://linuxmint-troubleshooting-guide.readthedocs.io/en/latest/” \n\nPRIVACY_POLICY_URL=“ https://www.linuxmint.com/” \n\nVERSION_CODENAME=zena\n\nUBUNTU_CODENAME=noble\n\n I have downloaded the CrealityPrint ZIP archive from git but when I try to build it I get:\n\nDirectory does not exist.\n\nYour distribution does not appear to be currently supported by these build scripts\n\n How, if at all, can I get the build to complete?\n\n Any and all help would be much appreciated.\n\nYou want to compile it yourself? If not, just use the AppImage Releases · CrealityOfficial/CrealityPrint · GitHub \n\n I think you can maybe fix it like this if you want to compile it yourself:\n\n cd CrealityPrint\ncp linux.d/debian2 linux.d/linuxmint\nsudo ./BuildLinux.sh -u\n./BuildLinux.sh -dsir","url":"https://forum.creality.com/t/crealityprint-under-linux-mint-mate/50908","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":76,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"0d54658387c054c6","topicId":50910,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-30","lastActive":"2026-06-01","title":"K2 plus all prints fail after firmware, usb doesn't boot on start up to roll back firmware","originalText":"I recently updated firmware on my k2 plus and it’s failed every print since. Before update it was perfect. I tried to reinstall previous firmware. But it does not boot it up on start up. It’s in the right format and on a small 7gb usb stick. Just doesn’t seem to want to let me return to a usable printer.\n\n It will print a few layers then stops the print and says its not extruding. I went back to just using the reel on the side of the machine but it made no difference.\n\n I went from perfect prints to a completely terrible printer that is not usable at all and the only difference was the latest firmware update, that i can’t seem to roll back\n\nDid you follow this guide on firmware restore?\n\n \n \n \n\n Creality Wiki \n \n\n \n \n\n K2 Plus & CFS Firmware Upgrade Guide\n\nHi, the last firmwares does not permits to re-install or downgrade the firmware in any way.\n\nYou have to do this. Download the firmware you want to install and rename it with a number higher than the one installed. So, if you installed firmware is CR0CN240110C10_R_202605081127_ota_img_V1.1.5.5.img you have to rename it CR0CN240110C10_R_202605081127_ota_img_V1.1.5.6.img\n\n Put it in a USB drive and the printer will recognize and install it!\n\nDon’t mind about the wrong name of the firmware file, once installed, you will find the correct name in the printer’s info.\n\n Let me know if it works (but it does!)","url":"https://forum.creality.com/t/k2-plus-all-prints-fail-after-firmware-usb-doesnt-boot-on-start-up-to-roll-back-firmware/50910","productLine":"firmware","version":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":3,"views":199,"likeCount":0,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"e12057992d9ae53f","topicId":50844,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-27","lastActive":"2026-04-27","title":"Mini animal collection","originalText":"Wanted to see if my raptor pro could scan tiny objects. here are some of the scans. they are only 22mm. overall they came out pretty good.\n\n There is about 10 of them so I just made a folder. I will be adding more.\n\n 20260412_150341 1920×2560 76.2 KB \n\n 20260412_220105 1920×2560 75.4 KB \n\n 20260412_220219 1920×2560 101 KB \n\n 20260413_171618 - Copy 1920×2560 444 KB \n\n 20260413_171637 1920×2560 293 KB \n\n happy printing\n\n #CMP \n\n # ｜creality-cloud\n\n #crealitymaker \n\n \n \n \n\n Creality Cloud | Page \n \n\n \n \n\n Creality Cloud | Page \n\n Explore the world of 3D printing with Creality Cloud.","url":"https://forum.creality.com/t/mini-animal-collection/50844","productLine":"cloud","version":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":1,"views":29,"likeCount":1,"tags":["raptor","showcase","crealityprint","k2"],"relReason":"tag","sourceType":"用户"},{"uid":"a69bd50b79a55813","topicId":50829,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-26","lastActive":"2026-08-31","title":"Why is it so difficult to get presets into Creality Print","originalText":"I do not understand how the software can be so lacking in one of the most critical area, presets and filament profile exchange.\n\n The software developers continues to force people into using what they determine are optimum settings rather than using a common standard such as JSON files to allow the easy exchange of setting files for both printers and filaments. Some simple steps would make working with the printers so much more enjoyable:\n\n \n Have a configurable location for printer config files, and another for filament profiles. \n Allow users to add and remove files from the folder (either directly from their OS or via an import/export function).\n \n Even allow backups of the folders. \n Retain files in the folders between version upgrades. \n \n \n Read the configs and profiles from the folders. \n optional - Establish an open source exchange for the printer and filament profiles. Creality Print is based off of an open source platform, and yet it operates in a closed source manner when it comes to these configs and profiles. \n \n It would be even better yet if Creality had profile files then for each of their series of filaments.\n\n All of this could help save untold amount of time and waisted filament running calibrations. Especially when a new version of the software is deployed and you loose the prior calibration edits you have done to your profiles.\n\nso have u figure out how to add the filament profiles? I did it BY accident once and now idk what to do\n\nI have sort of given up on it. Thought the Creality solution shows some shimmers of capability, after a short amount of time I just find myself back on OrcaSlicer (it has its own issues but appears more stable).\n\n In more recent weeks I have been battling extruder issues (even a full replacement of the stock one with a DXC) and the end result was a complete blob mess that I have now handed off to a local repair shop. With all these issues I have decided to try a completely different environment and class of printer (hopefully not a huge expenditure for simple user incompetence only part). Will see if Bambo is actually better.","url":"https://forum.creality.com/t/why-is-it-so-difficult-to-get-presets-into-creality-print/50829","productLine":"thirdparty","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":145,"likeCount":1,"tags":["filament"],"relReason":"category","sourceType":"用户"},{"uid":"6f9ca8bb51383df0","topicId":50821,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-26","lastActive":"2026-04-27","title":"7.1 update","originalText":"Since the 7.1 update it will not let you print if you have an empty slot in your CFS. Even if your not going to be using that color. That needs to be fixed. If I’m not using that slot it shouldn’t matter if it’s empty. I had to find an old roll of filament to put in place just to print with a different color.\n\nHello @user3098917494 \n\nWelcome to the Creality Forum…! \n\n I am not having this problem using the latest Creality Print and the CFS with a K2 Pro. I have 3 colors loaded now and it will print just fine. Press the Auto Mapping icon in the top right to refresh what colors are in the CFS. Make sure the colors are correct and in the right place.\n\n Auto-Mapping 589×255 14.7 KB\n\nYou must to assign spool slot to every color of your print to be able to print, even if you print will not use it.\n\n By example, you slice a piece with 4 colors on your config, but your print have only one color, never less you must to assign a spool to the others colors.\n\n In this example I got a blue model and my slicer’s filament are blue green, pink and yellow. but my fcs have Black, withe, grey and brown filaments\n\n image 851×359 38.2 KB \n\n So when printing, you must to assign a color to each filament even if will be no used:\n\n image 890×681 22.7 KB \n\n in this case the model will be printed using brown.","url":"https://forum.creality.com/t/7-1-update/50821","productLine":"print","version":"7.1","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":3,"views":201,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"99e39737a884e73f","topicId":50803,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-26","lastActive":"2026-04-26","title":"error 87","originalText":"Hi everytime i go to use creality 7.1 i just get the following message LoadLibrary failed with error 87 : The parameter is incorrect. Ive tried other versions and just get the same message any ideas how i can get creality 7.1 to load. Many thanks","url":"https://forum.creality.com/t/error-87/50803","productLine":"print","version":"7.1","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"3ceb03b3d6df79d2","topicId":50800,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-25","lastActive":"2026-04-26","title":"Why is Creality Cloud for iOS so unstable","originalText":"Why is it that when I use Creality Cloud on an iPad, iPhone or a Mac it is totally hit or miss.\n\n Most often video feed will fail, CFS (x2) are not shown only the “learn CFS” screen, Time lapses are not available.\n\n If I “try again” about 8 times eventually it will show the video and CFS and show the time lapse videos but they always fail to download.\n\n My K2 Pro has a dedicated Ethernet connection so my WiFi is not the issue. All firmware is up to date.\n\n When I use Creality print on my PC everything seems to work fine so it looks to me like there is an issue with the iOS version..\n\nWhich versions of iOS? All the problems you describe sound like network issues. iOS historically and notoriously has been pretty buggy when it comes to networking. There have been a lot of “minor updates” recently, and most of them are for network and security bugs. Since iOS is a minority OS, Creality probably haven’t put the effort into all the work-arounds needed to connect an iOS device reliably. IMHO, stick with the PC (or linux) and be glad you have a mainstream alternate computer.","url":"https://forum.creality.com/t/why-is-creality-cloud-for-ios-so-unstable/50800","productLine":"firmware","version":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":57,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b990d9548d605407","topicId":50786,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-25","lastActive":"2026-04-25","title":"Issues with","originalText":"Hi\n\n I have some issues when I want to slice any models.\n\n I use a k2 plus and creality print 7.1\n\n It is like layer are bad connected or a lack of material. I have seen many videos and other stuff to solve the problem (flow ratio. Temperature, setting Z, cooling, wall,etc) but nothing works.\n\n Does anyone know what is going on? I really don’t understand.\n\n Thank you\n\n PXL_20260424_215549528 1920×2550 342 KB \n\n PXL_20260424_213129923 1920×2550 572 KB \n\n PXL_20260424_211552382 1920×2550 348 KB\n\nthat seems to be driven by the object geometry, to mitigate you can consider using a lower layer height, or try adaptive layer height sliding it towards the quality side","url":"https://forum.creality.com/t/issues-with/50786","productLine":"print","version":"7.1","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":38,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0eaf0053be72d61a","topicId":50782,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-24","lastActive":"2026-05-12","title":"Anyone else having this problem?","originalText":"I’ve been using Creality Print on my K1 Max for over a year with the Android app with no problems. A few months ago, with no updates (that I know of), the video doesn’t work. I have to hit re-try several times after timeouts. Sometimes, it doesn’t work at all. I’ve tried uninstalling and re-installing the app. Nothing helps.\n\nDoes it work via the browser (enter the IP, make sure that you use http:// in front of it not https:// and that you are in the same wifi as the printer) or Creality Print 7 on a computer?\n\nYes. However, for some reason the old interface came back up on my phone app. Interface is very different. For instance, the screen comes up grey while it’s loading the image, and stats playing automatically. Before it would came up black and I’d have to press the play button. Another difference is a different screen that gave me a time of completion, The original and current one does not give the time of completion. Just the runtime.","url":"https://forum.creality.com/t/anyone-else-having-this-problem/50782","productLine":"cloud","version":"7","problemType":"other","model":"K1 Max","grade":"有效","replyCount":3,"views":73,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"3b87bff4ad9b6bc8","topicId":50763,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-24","lastActive":"2026-04-26","title":"creality print not allowing 4 color print from CFS","originalText":"i am trying to import a file with 4 colours creality print will only let me import 2 and wont let me edit the number in the box, i have attached 2 screen shots to show model and problem any help would be great\n\n colour select problem 2211×1270 254 KB \n\n page01 2160×1213 199 KB\n\ncan you share the file you are trying to import?\n\nLIME VAN V2 SINGLE TOP TEST PRINT COLOUR.3mf (2.1 MB)","url":"https://forum.creality.com/t/creality-print-not-allowing-4-color-print-from-cfs/50763","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":4,"views":59,"likeCount":2,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"ee64d7d209cda7e5","topicId":50765,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-24","lastActive":"2026-04-24","title":"How can I import a colored SVG and respect colors? Any idea?","originalText":"Hello!\n\nI have a K2 Pro with CFS. And now I’m printing some objects with integrated logos in color. The base object lets say its a cube.\n\nSo, on the top of that cube i want to put the “Porsche” logo. I have a colored SVG, but when I import it as SVG the color information it’s lost.\n\n It happens the same if I have a colored 3d object in 3mf, and add it as a modifier.\n\n How can i do something like “serigraph” one face with a colored 3mf/svg?\n\n Thanks!\n\nno can do, no slicer support SVG color import.\n\n you must to import the SVG, create the object and then paint it on the slicer.","url":"https://forum.creality.com/t/how-can-i-import-a-colored-svg-and-respect-colors-any-idea/50765","productLine":"print","version":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":2,"views":95,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"d5ca7abd3dde1934","topicId":50729,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-23","lastActive":"2026-04-23","title":"Changing Nozzles In the Slicer","originalText":"I’m fairly new to printing so maybe this is a dumb question but, when I change the nozzle to 0.6 in the slicer, I lose the option to select PETG-CF and many other filaments. Even when I click setting in the Filament box on the right, I don’t have the option to even add it. Am I doing something wrong?\n\nHello there, Which printer and which slicer?\n\nIDK which printer you have but when you go into the slicer, click on the green creality logo next to file, go to online perams and find your printer. There is a good chance that it needs an update for the different nozzles. Hopefully that fixes it.","url":"https://forum.creality.com/t/changing-nozzles-in-the-slicer/50729","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":51,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"654139bc7961091c","topicId":50697,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-21","lastActive":"2026-04-22","title":"Multicolor printing in Assembly","originalText":"I have imported three stl files for a keychain tag. There is a base and two text elements. I positioned them like I want and created an Assembly. I want the base, text 1, and text 2 to print in three different colors. However, I am having difficulty assigning colors to the different elements. Any help would be greatly appreciated. I have tried assigning colors using the Printer tree on the left and the Object/Part settings. I am obviously missing something in the setup or follow-through. Thanks\n\n image 1873×956 105 KB\n\nYou need to add the other colors you want to use to the filament section in the top right - looks like the green is the only one you have set up so it’s the only one available to assign. Once they are available there, you will be able to assign them to individual objects on the left list.\n\nThis you tube video explains how to color paint you project.\n\n Creality Print 6/7 Tutorial: STL Painting, for Multicolor 3D Printing. Color on K2 Plus & Hi Combo \n\n Bill","url":"https://forum.creality.com/t/multicolor-printing-in-assembly/50697","productLine":"print","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":3,"views":101,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b05e606c8c6af2d7","topicId":50673,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-20","lastActive":"2026-04-20","title":"Subject: UI/UX improvements suggestions for Creality Slicer","originalText":"Subject: UI/UX improvements suggestions for Creality Slicer \n\n Hello Creality team,\n\n First of all, thank you for your work on the slicer — overall it is a very powerful and capable tool, and I really enjoy using it. I’d like to share a few suggestions that, in my opinion, could significantly improve usability and user experience:\n\n \n \n Incorrect display of Ukrainian filenames \n\nIn the object list, filenames containing Ukrainian characters are displayed as question marks instead of proper text. This makes file identification difficult.\n\n \n \n Missing close buttons on UI widgets \n\nSome interface elements (such as the Arrange widget and others) do not have a visible close button, which makes interaction less intuitive.\n\n \n \n Option to disable specific warning notifications \n\nIt would be very helpful to add an option in the context menu like: “Do not show this warning again” for certain types of warnings. This would reduce repetitive notifications during workflow.\n\n \n \n Accidental layer slider interaction when zooming \n\nWhen zooming with the mouse wheel, the cursor often lands on the layer progress bar, unintentionally moving the sliders. This disrupts navigation and could be improved (e.g., by requiring click focus or adding a small delay/lock).\n\n \n \n I believe these small adjustments could make an already strong product even more comfortable and efficient to use.\n\n Thank you for your time and consideration!\n\nIt is a nice proposal, you can create a issue on the github Issues · CrealityOfficial/CrealityPrint · GitHub","url":"https://forum.creality.com/t/subject-ui-ux-improvements-suggestions-for-creality-slicer/50673","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":34,"likeCount":1,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"d2163166a584ec89","topicId":50647,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-19","lastActive":"2026-04-23","title":"CrealityPrint V 7.1.0.4414 Brim type : Mouse Ear corner detection failure","originalText":"On parts with 90 degree corners , for example a simple cube it detects all four corners\n\n on part with slightly fillet corners it always detects only three corners\n\n try the attachments:\n\n Cube.stl (684 Bytes)\n\n CubeChampfered.stl (13,9 KB)\n\nCubeChapfered.stl should be named CubeFillet.stl \n\n Never had to uses mouse ears, make sure you have good bed adhesion…\n\nOK, Fillet instead of champfer , i beg your pardon but english is not my main language.\n\n <Never had to uses mouse ears, make sure you have good bed adhesion…>\n\n well if you know the one and only 3d printer that prints EVERYTHING, specially at high speed, without brim , mouse ear etc then let me know it.","url":"https://fo
