uld be great\n\nI am new to multi-color printing as well and I’m amazed at the amount of purged filament that is wasted. I’ve been digging into the settings but I have really found a way to reduce the amount that is purged in the “poop”.\n\n A couple of setting you can change in the “Flush Options” section. You can flush into supports and/or into the infill.\n\nNeither of those address the amount of poop that is generated, if there is a way to reduce that I would love to find that setting.\n\n@kckndrgn \n\n Ya I definitely should have done more research on the CFS and how it functions doing multicolor prints. I had in my mind that it would gauge how much I needs of one color and then switch on the fly. Needing 100+ color changes to do a Benchy creates a LOT of waste. I ended up printing a tower with my 2 color version that I had modified and it is such a waste. Use half as much filament to print a tower to save on poops but still end up with a waste. I have seen in a few videos where people with other brands are able to print a second object and have all the waste printed into it instead of towers or poops.\n\n Should probably have just not bought it or tried to save up for a multi-hotend printer instead.","url":"https://forum.creality.com/t/color-flushing-into-new-objects/46443","productLine":"print","version":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":5,"views":1020,"likeCount":6,"tags":["creality-hi"],"relReason":"category","sourceType":"用户"},{"uid":"06e9b6230b208223","topicId":46462,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-09","lastActive":"2025-11-13","title":"Creality Print's gone MAD - thinks Printer has CFS","originalText":"Issue\n\n I updated my pinter software (on printer). Now Creality Print thinks I have a CFS. The Filement selection only shows CFS. In “Multifilament” even with Prime Tower disabled still does not change filement CFS. Then, even going with that and slicing, then whn you export there is no option with Filement Device…and yes it says “Spool Hoder” but because the filement before sslicing was CFS it runs with “Printing will be done using Spool Holder Colors” meaning not “External Spool Holder” but CFS…\n\n Then when you try to go ahead it comes up with a Warning: “ The machine consumables do not match the print file. Please check and restart printing”.\n\n So now i have to use my USB, like a Peasant and walk like a human to my printer!\n\n Please help…what am I missing?\n\n slice 1880×1007 292 KB \n\n send print file 1135×631 174 KB \n\n warning 1146×631 94.5 KB \n\n \n\n image 554×523 20.3 KB \n\n image 401×184 7.29 KB \n\n image 737×420 86.1 KB\n\nHi. I had exactly the same issue when I accepted an update to my K1 Max profile in Creality Print. I fixed it by uninstalling the Creality Print app and reinstalling. Hope this helps.\n\nDoes anyone have a solution that does not require reinstalling the printer software? I am in a school environment and can be a week or more to get IT to my room.","url":"https://forum.creality.com/t/creality-prints-gone-mad-thinks-printer-has-cfs/46462","productLine":"print","version":"","problemType":"other","model":"K1 Max","grade":"有效","replyCount":3,"views":316,"likeCount":0,"tags":["cfs","crealityprint","creality-k1-max"],"relReason":"tag","sourceType":"用户"},{"uid":"c0b76db7c67e680f","topicId":46437,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-08","lastActive":"2025-11-08","title":"HALOT Box is lacking Linux support","originalText":"A Linux version is available for CrealityPrint (which is fine), but not for Halot Box. Even running with wine, the printer is not detected (even if we enter the IP address manually) and it is not possible to send the print file to the printer.\n\n So please, make a Linux release available for Halot Box, like you did for Creality Print (or at least a release working with Wine)\n\n Thanks !","url":"https://forum.creality.com/t/halot-box-is-lacking-linux-support/46437","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":117,"likeCount":3,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"551748558d39384c","topicId":46425,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-08","lastActive":"2025-11-08","title":"Zoom to mouse Position not working with multiplte plates","originalText":"Hi,\n\n in my creality print Version 6.3.0.3420, zoom to mouse position is checked. when only 1 plate is there the zoom goes to mouse pointer perfectly, but when multiple plate is there. it cannot zoom to mouse pointer. can someone giive solution to this issue. i am using Creality print for my K1 and K1 Max printer\n\n Thanks\n\n Sandeep","url":"https://forum.creality.com/t/zoom-to-mouse-position-not-working-with-multiplte-plates/46425","productLine":"print","version":"6.3","problemType":"other","model":"K1 Max","grade":"有效","replyCount":1,"views":34,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"3b2323d17e5a4683","topicId":46406,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-07","lastActive":"2026-04-16","title":"Bug Report - The new Update - The machine consummables do not match the printed file","originalText":"Well, we are suppsosed to embrace all the new Updates. But it seems like when we do, that is when the troubles starts.\n\n So I updated my Creality K1 Max with the new Update this last Tuesday 11/4/2025. And developers wonder why we hate updates? Well, that was the last time I have sent anything to my printer from my creality slicer. Ever since then, it states simply:\n\n “The machine consumables do not match the printed file. Please check and restart printing”\n\n I would love to know what that means, as I am set to print Flash Forge PLA, which I made sure to setup with the parameters that I feel would do best on the current print. I have reset the printer 5 times now, but it doesn’t seem to do much.\n\nI was getting this error too after the update. If you go to the Device section in Creality Print, in the lower right you can change the type of filament that it thinks the spool holder has loaded to match what you sliced your object to print with, and then you can send normally. I think there should be a way to disable this warning. It just seems silly to have to set the type of filament you are using in two different places.\n\n… The biggest problem is that they didn’t test before releasing firmware… I think it can be solved with a update of Creality Print… but like always… this will take a long, long, long time…\n\n At work 2 printers updated to the latest firmware, the one at home will stay at the previous version untill Creality has fixed this problem…","url":"https://forum.creality.com/t/bug-report-the-new-update-the-machine-consummables-do-not-match-the-printed-file/46406","productLine":"firmware","version":"","problemType":"other","model":"K1 Max","grade":"有效","replyCount":14,"views":2461,"likeCount":7,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9187121b839544e4","topicId":46403,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-07","lastActive":"2025-12-26","title":"Creality print 6.3 slow speed","originalText":"I have an issue with CP starting with ver 6.3. All prints are being printed twice slower than on 6.1 and 6.2 before (settings and filament update). Also wall generator set on classic as default, which is strange.\n\nAny solution with speed? I’ve checked everything 6.1 vs 6.3 and all parameters seems the same but speed still twice slower.\n\nFound problem somehow jerk settings are significantly decreased in Creality pint 6.3. Changing them to 6,2 version values brings speed back.","url":"https://forum.creality.com/t/creality-print-6-3-slow-speed/46403","productLine":"print","version":"6.3","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":99,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"85ec5043e6cba5d1","topicId":46391,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-07","lastActive":"2025-11-07","title":"Is it possible stop the little dabs of filament?","originalText":"Is there a way to stop the printer from adding little dabs of filament in all the super tiny holes that’s not covered by the wall or infill? I’m trying to print a carboard spool adapter that has a textured outer ring and it leaves a lot of these super tiny holes(in the slicer) that isn’t even actual holes when it prints. When it finishes the layer, it adds like 200(exaggeration) of these little blobs that’s not needed. It really hinders a large flat top layer with all the blobs everywhere. Is there a “minimum line distance” setting somewhere that I’m missing?\n\n Edit: I’ve tried turning “apply gap infill” to nowhere and it still does it.\n\nPerhaps you could provide an STL file or a 3MF file, which would enable a better understanding of your issue.","url":"https://forum.creality.com/t/is-it-possible-stop-the-little-dabs-of-filament/46391","productLine":"print","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":2,"views":60,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f8861d8fe683fb74","topicId":46346,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-04","lastActive":"2025-11-04","title":"1st layer walls not taking 1st layer flow set points","originalText":"I’m I loosing my mind or does creality print 6.3 ignore 1st layer flow set points on 1st layer walls? I’ve been trying to run a print with multiple walls on the first layer and the infill looks great or overfilled but I can see the bed between the walls on the 1st layer.","url":"https://forum.creality.com/t/1st-layer-walls-not-taking-1st-layer-flow-set-points/46346","productLine":"print","version":"6.3","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":34,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"f55e919e8591dc04","topicId":46340,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-04","lastActive":"2025-11-04","title":"My Crealityapp doesn,t see my filament at the backside","originalText":"Since I have loaded the newest version of the App my Creality K1max doesn’t see my filament at the back of the printer so I cant send for printing from my computer anymore why\n\n Anders in Sweden","url":"https://forum.creality.com/t/my-crealityapp-doesn-t-see-my-filament-at-the-backside/46340","productLine":"cloud","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":39,"likeCount":0,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"6d9c835e72e3a3a0","topicId":46311,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-03","lastActive":"2025-11-04","title":"creality print - fuzzy skin painting","originalText":"please add “fuzzy skin painting function” like in Bambu studio.\n\n It’s so simple and so cool function!\n\n In my projects, I’m using “fuzzy skin “ on little parts of my models with “post scripts” … its hard , and not comfortable.\n\n Please… add this function\n\nHello @Yakov_Pavlov \n\nWelcome to the Creality Forum…! \n\n Isn’t this the function you are talking about here in Creality Print 6…???\n\n That would be nice to add the “Painting” function to this…\n\n Fuzzy 492×648 26.7 KB\n\nYep , I’m talking about creality print 6 …\n\n How its work in Bambu studio\n\n IMG_20251104_044009 830×877 110 KB \n\n IMG_20251104_043942 1167×978 143 KB \n\n IMG_20251104_043918 1171×798 92.4 KB","url":"https://forum.creality.com/t/creality-print-fuzzy-skin-painting/46311","productLine":"thirdparty","version":"6","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":1010,"likeCount":5,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"03dfc129370af402","topicId":46312,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-03","lastActive":"2025-11-03","title":"Autolayout with un-printable objects is broken v6.3.0","originalText":"If have have four or five small objects on the plate and use “A” for auto-layout all is well. If I mark one or two as not printable and use auto layout it will push some off the plate, leave the unprintable object on the plate, etc. Why? Didn’t this use to work so that unprintable objects are ignored?\n\n Using Creality Print 6.3.0.3420","url":"https://forum.creality.com/t/autolayout-with-un-printable-objects-is-broken-v6-3-0/46312","productLine":"print","version":"6.3.0","problemType":"other","model":"K1","grade":"有效","replyCount":1,"views":35,"likeCount":0,"tags":["trouble-shooting","creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"e18a97ba172a16a1","topicId":46283,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-02","lastActive":"2025-11-02","title":"Falcon 2 pro s lbdev file needed","originalText":"Good Day\n\n Can someone help me with the lbdev file for the Falcon 2 Pro S please?\n\n The laser “ghost engrave” it doesn’t fire. I tried everything and the lbdev file is not on the TR I got with the machine.","url":"https://forum.creality.com/t/falcon-2-pro-s-lbdev-file-needed/46283","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":36,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"0b0205d0d2bb9250","topicId":46274,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-01","lastActive":"2025-11-01","title":"Halot Sky Wifi connectivity","originalText":"Hi,\n\n I’ve recent got myself a Halot Sky (NOT the 2022 model, the 4k one), and for the life of me I cannot get HalotBox to see the printer, even if I type in the IP address. The printer and the windows desktop are on the same 2.4GHz wifi network, the windows machine has the local firewall disabled, and I’ve tried restarting multiple times.\n\n Pinging the printer works, and SSH can even see it, so it’s available on the network for certain…\n\n The Wifi was one of the features that I was really looking forward to…how do I get this to work.\n\n Oh, latest versions of firmware and HalotBox (as of day of posting).\n\n Cheers\n\n Matthew","url":"https://forum.creality.com/t/halot-sky-wifi-connectivity/46274","productLine":"firmware","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":55,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b88a256a0930b86b","topicId":46253,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-31","lastActive":"2025-11-13","title":"Important subject - Creality 6xx","originalText":"When did Creality will work on this subject ?\n\nHello @Begood38 \n\nWelcome to the Creality Forum…! \n\n If you have issues or suggestions with the Creality Print V6.3.0.3420 software which was released Sept 27 2025 please document and post here.\n\nCan you advise on how to enter start/end g-code? I can’t seem to find any documentation on it.","url":"https://forum.creality.com/t/important-subject-creality-6xx/46253","productLine":"print","version":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":117,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"06f311e39900dd32","topicId":46189,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-28","lastActive":"2025-10-28","title":"Creality Print 6.3 background color in prepare and preview tabs on Linux","originalText":"Hello,\n\nI have latest Creality Print application installed on Linux Mint. For me prepare and preview tabs have white background color while theme is dark.\n\nIs there a option to change it to gray color like it looks in window version?","url":"https://forum.creality.com/t/creality-print-6-3-background-color-in-prepare-and-preview-tabs-on-linux/46189","productLine":"print","version":"6.3","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":50,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f37305e5b848a048","topicId":46179,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-27","lastActive":"2025-10-28","title":"White Spots in Preview","originalText":"Greetings,\n\n I am new to 3D printing and have been enjoying it very much! (K2 Plus!)\n\n I have been having this weird issue suddenly with Creality Slicer where I go to slice the model and I am seeing all sorts of white spots. I noted in the preview section that the Seams and Gap Infill are what the white spots represent. I have seen this on more than one model I am trying to print. Is this going to be a problem? Will my print be alright if I just ignore it and print anyway? Or is there a setting somewhere I am missing that will never show these spots again?\n\n Thank you for your time!\n\nYour prints are going to be fine.\n\n IMO, gap fill not a problem. It is always a good thing on my models.\n\n Seems, annoying, but what ‘chga going to do? The seam is needed, and will show up as little bumps on the print. There are several seem settings to move the seams around to different places on the print. Sometimes you can position a seam where it won’t be seen. Sometimes you can position seams where they are easy to smooth off. Sometimes you just don’t care about the little bumps on the surface. Seam settings are something you have to play with to get the right match for the model you are printing. That is where the preview is so handy. Try a different seem setting and see what it changes. When you slice the plate.","url":"https://forum.creality.com/t/white-spots-in-preview/46179","productLine":"print","version":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":302,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"be7b2c6d30a3a24b","topicId":46142,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-25","lastActive":"2025-10-26","title":"Bug Report - Ironing isn't visually shown by standard when slicing, need to do a gimmick for it to show","originalText":"As said in the title, from the version 6.3 ownards you can only see the ironing if you visualize the model from the first layer upwards. The top layer is now by default colored as the top, red, top surface class. In all previous versions, the ironing, colored light orange, showed up as the last layer giving a visual indication of where it is being used and the toolpath. Also, you can’t see the nozzle ironing path curves when visualizing the toolhead movements in the horizontal slider in the bottom.\n\n See the first attached picture, visualized from first to last layer. In all previous versions the infill was visible and colored light orange. Now, infill is missing regardless of being selected or not in the ticked boxes.\n\n image 1396×993 128 KB \n\n Then, if i draw the model from the SECOND layer (second from bottop to up), the infill appears, as seen below:\n\n image 1525×1045 146 KB \n\n The infill path from the toolhead also isn’t shown when visualizing the toolhead motion throughout the printing process. As seen below. I can drag it from start to finish and it doesn’t show the circular path that it should ( ironing in this model was selected as concentric. But if it is rectlinear it doesn’t matter since it doesn’t show up as well. )\n\n image 1392×937 320 KB \n\n Please, fix that. It is very confusing not knowing visually if the infill is present or not and where it is being drawn.\n\nHello !\n\n You can notify them via this form : https://gcmomk3i2c.feishu.cn/share/base/form/shrcn0UmnLucAOOd8pAM16lrZ1b","url":"https://forum.creality.com/t/bug-report-ironing-isnt-visually-shown-by-standard-when-slicing-need-to-do-a-gimmick-for-it-to-show/46142","productLine":"print","version":"6.3","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":91,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"d0bfaa57f6710fce","topicId":46145,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-25","lastActive":"2025-10-25","title":"Creality Print 6.3 Thumbnail Advanced Options are Gone","originalText":"Hey Everyone\n\n I didnt get any hits on reddit so trying here. Am I missing something or is the option that used to be present in the previous versions of Creality Print for the thumbnails is gone? If you went to printer settings>Basic Information>Advanced there were options to select the size and type. Now I cant seem to find it. I have recently moved back from Orca to Creality Print. I was having issues with with several of my models with Arachne and Classic wall generation that work flawlessly in Creality Print vs Orca. But the issue is with my rooted KE…Moonraker is not liking the thumbnails and none of the previous .py modifications are working like they did before. And for giggles…I used a K2 Pro profile…recently purchased…and sent that g code to my KE. Thumbnails show up fine. Which makes sense because the K2 Pro uses moonraker and fluidd so Creality Print is creating the correct gcode.","url":"https://forum.creality.com/t/creality-print-6-3-thumbnail-advanced-options-are-gone/46145","productLine":"firmware","version":"","problemType":"ui","model":"K2 Pro","grade":"有效","replyCount":1,"views":175,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d2368b0dfb3a74a9","topicId":46122,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-24","lastActive":"2025-10-30","title":"Small Gap","originalText":"Hey everyone,\n\nI’ve hit a wall trying to make Creality Print fill small triangular gaps between infill and perimeters in multicolored prints when slicing in the preview on my K2 Plus.\n\n I’ve already tried:\n\n \n \n Adjusting all line widths (walls, infill, gap infill, top/bottom)\n\n \n \n Increasing infill/perimeter overlap up to 35 %\n\n \n \n Playing with extrusion flow (which closes the gap but ruins dimensional accuracy)\n\n \n \n Searching for “Detect thin walls” and “Fill gaps” — they show up in the search box but aren’t editable anywhere in the UI\n\n \n \n Does anyone know:\n\n \n \n Whether Creality Print actually supports true gap fill or thin-wall extrusion like OrcaSlicer/PrusaSlicer do?\n\n \n \n Or if there’s a hidden JSON flag or profile parameter to enable it?\n\n \n \n I can’t seem to make the slicer generate that missing line without brute-forcing flow rate, which I’d rather avoid.\n\n Thanks in advance — any K1/K2 slicer gurus who’ve solved this, please chime in!\n\n image 816×703 70.4 KB \n\n Here before slicing:\n\n image 739×669 2.22 KB \n\n {\n\n \"accel_to_decel_factor\": \"50%\",\n\n\"base_id\": \"GP004\",\n\n\"bottom_solid_infill_flow_ratio\": \"1.05\",\n\n\"bottom_surface_pattern\": \"monotonicline\",\n\n\"brim_object_gap\": \"0.1\",\n\n\"brim_type\": \"no_brim\",\n\n\"default_jerk\": \"9\",\n\n\"elefant_foot_compensation\": \"0\",\n\n\"enable_arc_fitting\": \"0\",\n\n\"from\": \"User\",\n\n\"gap_fill_target\": \"nowhere\",\n\n\"gap_infill_speed\": \"100\",\n\n\"infill_jerk\": \"12\",\n\n\"infill_wall_overlap\": \"15%\",\n\n\"inherits\": \"0.20mm Standard @Creality K2 Plus 0.4 nozzle\",\n\n\"initial_layer_infill_speed\": \"100\",\n\n\"initial_layer_jerk\": \"9\",\n\n\"inner_wall_jerk\": \"7\",\n\n\"internal_solid_infill_pattern\": \"monotonicline\",\n\n\"internal_solid_infill_speed\": \"125\",\n\n\"ironing_angle\": \"-1\",\n\n\"is_custom_defined\": \"0\",\n\n\"name\": \"LightBoxes\",\n\n\"only_one_wall_first_layer\": \"1\",\n\n\"outer_wall_jerk\": \"7\",\n\n\"prime_volume\": \"50\",\n\n\"print_settings_id\": \"LightBoxes\",\n\n\"reduce_crossing_wall\": \"1\",\n\n\"reduce_infill_retraction\": \"0\",\n\n\"slowdown_for_curled_perimeters\": \"1\",\n\n\"small_area_infill_flow_compensation\": \"1\",\n\n\"small_perimeter_speed\": \"25%\",\n\n\"sparse_infill_pattern\": \"crosshatch\",\n\n\"sparse_infill_speed\": \"150\",\n\n\"support_base_pattern\": \"default\",\n\n\"support_line_width\": \"0.4\",\n\n\"top_bottom_infill_wall_overlap\": \"15%\",\n\n\"top_surface_jerk\": \"7\",\n\n\"top_surface_speed\": \"100\",\n\n\"travel_jerk\": \"10\",\n\n\"tree_support_wall_count\": \"1\",\n\n\"version\": \"3.0.0.0\",\n\n\"wall_generator\": \"arachne\",\n\n\"wall_transition_angle\": \"50\",\n\n\"wall_transition_filter_deviation\": \"30%\"\n \n }\n\n@zinK0 “Detect Thin Walls” in the UI\n\n image 748×319 17.7 KB \n\n I haven’t played with these settings (also in the walls menu) but they might help:\n\n”Sparse Infill Anchor Length” I use 200%\n\n”Apply Gap Fill = Everywhere”\n\n Under “Advanced”, “Detect narrow internal solid infill”\n\n Also, remember the screen render is simplified geometry. It is not what you get in the real world, which begs the question, “what do these gaps look like when printed?”.\n\ngozmon: \n \n what do these gaps look like when printed?”.\n\n \n \n @gozmon Thank you so much for looking into this and offering your advice! I had actually tried using that setting in my custom parameter file. When I searched for it, the parameter appeared in the results, but clicking on it didn’t highlight it as usual, and I couldn’t find it anywhere in the menu. I thought it might have been removed in the latest update, but I just realized that when I search for it while a default system preset is selected, it shows up correctly. Strange behavior — but I guess a picture is worth a thousand words!\n\n image 577×747 31.5 KB \n\n Here’s my preset file where that option is missing:\n\n image 571×721 29.6 KB \n\n I don’t know how that happened but anyway, I am going to recreate my parameter file cloning a standard preset and will share the result with you .\n\n By the way , this is a close-up photo — sorry about the quality; it was tricky to hold the print and take the picture at the same time. You can still clearly see the gap, though. This is how it appears on the printed object. For context, it’s part of a lightbox, so the gap lets light shine through — which is not what I want.\n\n image 438×355 22.9 KB","url":"https://forum.creality.com/t/small-gap/46122","productLine":"thirdparty","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":5,"views":1331,"likeCount":2,"tags":["k2plus","trouble-shooting","cfs"],"relReason":"category","sourceType":"用户"},{"uid":"05dd99cfbc693854","topicId":46044,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-23","lastActive":"2026-02-11","title":"K1 CFS Upgrade - Error CY2586","originalText":"Hi all,\n\n I putting this just in case anyone else is looking for a similar fix after upgrading their K1 to support the CFS and received error CY2586). I recently upgraded my K1 with the CFS upgrade kit and everything seemed to go okay until I tried a large print. I received Error CY2586 a couple times. I was trying to print a large print that used the K1’s entire bed width which is 220x220. It took me a little to realize where the issue was actually coming from. Ultimately, I think I have determined that the note for the upgrade kits indicates that the printing area has been decreased: “The molding size of multi-color printing will decrease by 5mm (Y-axis); K1/K1C/K1 SE is 220*215*250mm; K1 Max is 300*295*300mm”. I did know this when I moved forward, but I guess I didn’t put the dots together that the firmware/software wasn’t really addressing this in the slicer. Essentially the software doesn’t ‘know’ that the bed area has been reduced. I wish Creality built this into their software as an option. However, the fix I found was to modify the system presets in the Printer settings. I set the Excluded Bed Area to ‘0x215, 220x215, 220x220, 0x220’. This manually removes that back 5mm from being able to be printed to. Hope this helps someone else.\n\n Screenshot 2025-10-22 181639 1185×654 33.4 KB\n\nThank you so much for this!","url":"https://forum.creality.com/t/k1-cfs-upgrade-error-cy2586/46044","productLine":"firmware","version":"","problemType":"other","model":"K1","grade":"有效","replyCount":2,"views":436,"likeCount":3,"tags":["cfs-upgrated-kit","slicingsoftware","cfs","creality-k1"],"relReason":"tag","sourceType":"用户"},{"uid":"57979de8886d3629","topicId":46050,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-23","lastActive":"2025-10-23","title":"Problems getting Creality to send Verify code to register Falcon A1 softwrae","originalText":"Trying to register on the creality site and get a verify code. It just does not send a code!! Looked in spam and inbox…. Nothing..\n\n John","url":"https://forum.creality.com/t/problems-getting-creality-to-send-verify-code-to-register-falcon-a1-softwrae/46050","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":124,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"025727f21bc16ce2","topicId":45995,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-20","lastActive":"2025-10-20","title":"Hulp nodig, mijn model wordt niet massief","originalText":"Hi all, please see attached STL created with Sketchup (solid).. I would like to print itas 60% massive, but it doesn’t apply my infill settingsafter slicing. Please help…\n\n TC Steun.3mf (190,6 KB)\n\nHello @Jack_Rietbergen \n\nWelcome to the Creality Forum…! \n\n \n \n \n Jack_Rietbergen: \n \n print itas 60% massive, but it doesn’t apply my infill settingsafter slicing\n\n \n \n I was able to slice the file with Creality Print. Reduced size to 60%. Changed infill to different settings and it worked.\n\nWhy did you reduce the size?\n\n Should the slicer show the fill in pattern e.g. in the bottom and in the pilars between bottom and bridge?","url":"https://forum.creality.com/t/hulp-nodig-mijn-model-wordt-niet-massief/45995","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":4,"views":60,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c96c787c6ecb3a78","topicId":45901,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-15","lastActive":"2025-10-24","title":"Day 1 Newbie and I have a firmware problem on the Falcon A1","originalText":"So basically, set it up and plugged in. Ran the test cut and the design space asked me to update the firmware. I select ok and the machine beeps a few times then theres a slow flashing start button on the machine. Thats it nothing happens and the Update screen doesnt go past 0%.\n\n Ive left it on here trying for over 30 mins now and nothing has changed. I thought maybe I could try the manual update with a USB but when I go here Firmware there is no Firmware for my A1 model.\n\n What am I doing wrong? what can I do? I just seem to be going around in circles\n\nHere’s the official link for all Creality laser engraver firmwares:\n \n \n \n\n Creality Laser Engraving Machine Firmware Download | Creality Firmwares \n \n\n \n \n\n Creality Laser Engraving Machine Firmware Download | Creality Firmwares \n\n The Creality laser engraving machine is designed for personal use, offering engraving and cutting capabilities on a variety of materials, making it ideal for engineers, designers, and DIY enthusiasts.\n\n \n\n \n \n \n \n\n \n \n\n The other link you’ll find useful for updating the firmware on the Falcon A1 is this page from the wiki:\n \n \n \n\n Creality Wiki \n \n\n \n \n\n Falcon A1 Mainboard Firmware Update Guide \n\n \n\n \n \n \n \n\n \n \n\n The guide offers two different ways to attempt the firmware update - first is using a USB stick, and the second is through the Falcon Design Space software.\n\n Good luck with the firmware update, hope it resolves the issue you’ve encountered!\n\nThank you for your reply , I actually got a response from Creality support and it seems that the firmware being pushed was incorrect and has since been resolved.","url":"https://forum.creality.com/t/day-1-newbie-and-i-have-a-firmware-problem-on-the-falcon-a1/45901","productLine":"firmware","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":7,"views":615,"likeCount":1,"tags":["trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"3494c3ebbe0cdf1f","topicId":45864,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-14","lastActive":"2025-12-17","title":"Creality Sonic Pad","originalText":"I haven’t used this in a while but worked last time. Has an x-number of printers connected directly via wifi and 2 sonic pads with printers connected. These 2 sonic pads do not appear in either the app or under the workbench on creality’s page. In the app when I start them it shows that I have more printers but nothing more.\n\n thx in advance\n\n Anders\n\n IMG_9950 1284×2778 399 KB\n\nAny one have a ide ?","url":"https://forum.creality.com/t/creality-sonic-pad/45864","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":61,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"ec8b5e65b8f95ebc","topicId":45887,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-14","lastActive":"2025-10-16","title":"centering build plate in Creality print","originalText":"I’m new at this and when I open a model to paint or print the build plate seems to locate at random on the screen. How can I center it so I can enlarge the image for painting? Thanks.\n\nHello ! Have you tried to right click on it and then “Organize” ? It should center the model","url":"https://forum.creality.com/t/centering-build-plate-in-creality-print/45887","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":471,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1e42df3e5e0e6d67","topicId":45858,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-13","lastActive":"2025-10-14","title":"Trouble using non-Creality (non-RFID) filament","originalText":"I can’t seem to print apparently because I’m trying to use a non-Creality filament, Matterhackers NylonG.\n\n First, can someone help me set up this filament in my CFS correctly. There does not appear to be a way to create a new filament name and setting. At present, I have just selected PETG-CR as it’s nozzle and bed temps are closest to what I need. Matterhackers recommends 255/65 for this NylonG filament.\n\n Second, when i try to print, the CFS display tells me that “Filaments marked with “…” require manual selection of a CFS slot.” But it will not let me select the #2 slot where the filament is located. I suspect this is because the first issue above needs to be addressed first.\n\n HELP!!! Thanks in advance!\n\n John\n\nI find this to be a quite helpful and responsive forum. We are scattered all over the world. Your 6pm may be my 6am, and I I don’t look a the forum EVERY day it might take more than as day to get a response. everyone is in that situation, adjust your expectations accordingly.\n\n I see several things you are doing wrong and have more questions to try and help, but I’m not helping after your second comment…, sad… for you not me!","url":"https://forum.creality.com/t/trouble-using-non-creality-non-rfid-filament/45858","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":157,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"5d7030d44fc0a2d2","topicId":45840,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-12","lastActive":"2025-10-12","title":"creality print profile ender 3 v3 ke","originalText":"I have a problem: my printer started performing poorly and now takes about 30 minutes for a Benchy. I also lost all my settings. Can anyone find a profile file for me or create one with the best settings for my printer? I use Creality Slicer for fast printing and good quality. I would like something I can add to the slicer as a file that changes the settings it also does not stikking to the print board and the 1 layer is really bad","url":"https://forum.creality.com/t/creality-print-profile-ender-3-v3-ke/45840","productLine":"print","version":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":1,"views":131,"likeCount":0,"tags":["ender-3-v3-ke","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"a5e67186c713312b","topicId":45831,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-11","lastActive":"2025-10-11","title":"Problem when slicing","originalText":"Screenshot 2025-10-11 154447 566×484 181 KB \n\n Screenshot 2025-10-11 154456 735×485 141 KB \n\nSo when i slice my bulldog, it turns out different with some holes! pls help!\n\nHello !\n\n Can you try to right click on the object and then click on “repair” ?","url":"https://forum.creality.com/t/problem-when-slicing/45831","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":53,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7d263d0c99bf9115","topicId":45786,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-09","lastActive":"2025-10-09","title":"STL will not slice unless Wall Generator property is changed","originalText":"I created a button with text on it using FreeCAD and the STL shows fine in WIndows 3D viewer and I even uploaded to STL to a few sites to check for issues and they all said the STL is OK.\n\n When I place the STL in CP version 6.3.0.3420, it looks OK:\n\n 001 806×526 28.7 KB \n\n I then render the object and it comes out looking like this:\n\n 002 607×434 41.4 KB \n\n I loaded the STL into CP version 5.1.7.10514 and when rendered it looks OK. So there is a difference between how 6.x slices a model and how 5.x does it, and it seems to be not as good.\n\n I found that in CP version 6.3.0.3420, if I change the Wall Generator property from Classic to Arachne, the model renders correctly.\n\n Just thought I’d let everyone know what I found in case someone has the exact same issue.\n\n STL attached.\n\n Body_Text_Insert (Meshed)001.stl (304.3 KB)","url":"https://forum.creality.com/t/stl-will-not-slice-unless-wall-generator-property-is-changed/45786","productLine":"print","version":"6.3","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":56,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0376a8239599a27b","topicId":45780,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-09","lastActive":"2025-10-09","title":"Settings for Hyper PETG in K1C/Software","originalText":"Where do I change the print settings for this material? I am fairly new and not finding the right area to change the parameters. Is there a “profile” that some call it that can be installed?\n\n Do hot end and other temp settings controlled by the printer or by the software?\n\n Thank you\n\nHello !\n\nClick on Generic Pla then Generic PETG => Everything will be changed accordingly (temp, speed, cooling..etc)\n\nIf you don’t see it, click on the small gear and check everything ! \n\n image 417×497 20.6 KB","url":"https://forum.creality.com/t/settings-for-hyper-petg-in-k1c-software/45780","productLine":"print","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":158,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"3be4433355ce0d4b","topicId":45766,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-08","lastActive":"2025-10-10","title":"Placing a statue on a base","originalText":"Is there a way to “float” an stl file off the plate? I have an stl of a statue, and I want to place it on a base which is another stl file. I have created the base separately and I want the statue to start printing on the top of the base. So, if the base is 10mm thick, I want to move the statue off the plate by 10 mm so the feet are on the base, not buried 10mm deep?\n\nAssemble both parts (right click then assemble) and then move up the statue by 10mm\n\nHow do I isolate the statue and only move it up. I Assembled the 2 parts, and they became 1. When I move it up, both go up, then snap back.","url":"https://forum.creality.com/t/placing-a-statue-on-a-base/45766","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":286,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b6ab750bd43d2cd9","topicId":45759,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-08","lastActive":"2025-10-08","title":"Surface attribute modifier","originalText":"I’m trying to modify one face of my model to increase the wall count from 2 to 4. The model is basically a 15 mm thick arc. The ends are square so there are 4 sides, a top, and bottom. I only want the 4 walls on the front face surface.\n\n I tried using the modifier with a cube. It modifies the line count to four, but also puts a wall through the model where the back of the modifier cuts through the model. If I make the modifier deeper, off the back of the model, I get the same as a 4 wall global setting. I then tried using a torus shaped modifier with the same result. Its not modifying just the model, it is adding additional structure inside the model.\n\n Is there any way to select a surface to modify?\n\n Thanks","url":"https://forum.creality.com/t/surface-attribute-modifier/45759","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":53,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"bde079b9450f8d6c","topicId":45754,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-07","lastActive":"2025-10-07","title":"Creality 3D Scan Administration Pop Up for each login","originalText":"How do I get past this pop-up in order to use the scanner?","url":"https://forum.creality.com/t/creality-3d-scan-administration-pop-up-for-each-login/45754","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":29,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"4a0897725b2761fa","topicId":45731,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-06","lastActive":"2025-10-06","title":"New 3d printer older mac OS - Monterey 12.7.6","originalText":"Hello,\n\n I have an Ender 3 V3 SE. I also have an older MAC that is running Monterey 12.7.6. This is the highest version OS I can get with this older laptop. Can you direct me to the correct version of Creality Prints that will work with Monterey 12.7.6?","url":"https://forum.creality.com/t/new-3d-printer-older-mac-os-monterey-12-7-6/45731","productLine":"print","version":"12.7.6","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":1,"views":170,"likeCount":0,"tags":["trouble-shooting","ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"8e5e532a84e85379","topicId":45726,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-06","lastActive":"2025-10-06","title":"Creality Cloud Down","originalText":"This has been happening since about 9:30 AM (GMT +8).\n\n The status of the box quickly jumps between ‘Disconnected’ and ‘Online’. In the past hour or so, it has flipped at least 10 times.\n\n Most times, the status of the Creality Box shows ‘Offline’ even though my WiFi is working perfect.\n\n Printer: Ender 3 S1 Plus\n\nBox: Creality Box 2.0","url":"https://forum.creality.com/t/creality-cloud-down/45726","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":72,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"2e0d8e33571b9160","topicId":45632,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-03","lastActive":"2025-10-03","title":"Creality Print 6.3.0.3420 - Filament Section","originalText":"Bit of an odd one. I’m currently running an Ender 3 v3 KE and Creality Print 6.3 (as per title). Now, I also have an Anycubic Kobra 3 combo and for some reason, when I sync the Anycubic slicer with the ACE PRO, it also changes the filament settings on Creality Print. Sometimes it does it every time, other times its random but it ALWAYS does it when I upgrade the Creality Print software to the latest version. It only changes the colors as I’ve not set up the Anycubic filament in Creality Print. I’ve previously set up all the colors and filament types I use in this printer, only for it to revert to whatever I’m using in the Anycubic ACE PRO. Has anyone else seen this?\n\n image 714×206 30.3 KB \n\n image 608×216 27.3 KB","url":"https://forum.creality.com/t/creality-print-6-3-0-3420-filament-section/45632","productLine":"print","version":"6.3","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":156,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"2f9513bc14356a85","topicId":45600,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-10-01","lastActive":"2025-10-01","title":"temp by nozzle flow?","originalText":"I upgraded to 6.3.3240 and I noticed on the preview screen, print temperatures appear to correspond only with the scaler setting for temperature. Each layer is not getting the temperature set by the calculated flow in the preview. The Check box is selected and I have “[[0.0,250],[10.0,259],[40.0,275]]” inserted for the graph.\n\nWhat am I missing?\n\nNeeded to make a new profile. Something about importing to the new version didn’t work. After setting up a new profile, auto temp by layer works.\n\n; filament start gcode\n\n{if (position[2] > first_layer_height) }\n\nM104 S[material_flow_temp_graph]\n\n{else}\n\nM104 S[first_layer_temperature]\n\n{endif}","url":"https://forum.creality.com/t/temp-by-nozzle-flow/45600","productLine":"print","version":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":135,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"3e0823ec6a85e1ee","topicId":45540,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-28","lastActive":"2025-09-30","title":"Creality falcon pro 10w weird lines while cutting problem !","originalText":"175907320050292316527366790136 1920×3413 947 KB \n\n hello everyone\n\n I have a creality falcon pro 10 w but while cutting its makes weird lines like zigzags shown below. I have everything installed correctly but the problem still exist. I tried a lot of solutions but no hope . Can someone heeelp me please.\n\nI solve the problem. The solution is try to lower to an old version of lightburn.","url":"https://forum.creality.com/t/creality-falcon-pro-10w-weird-lines-while-cutting-problem/45540","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":46,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"611351ba17401dd0","topicId":45544,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-28","lastActive":"2025-09-29","title":"🔧 ISSUE: CrealityPrint 6.3.0.3417 - Missing discharge column on Mac M1","originalText":"Hi community, after updating to the latest version of CrealityPrint (6.3.0.3417), I can no longer see the “Discharge” column that used to appear in the G-code preview.\n\n Has anyone else experienced this issue, especially on Mac?\n\n Details: \n\n \n Version: CrealityPrint 6.3.0.3417 (latest version) \n OS: macOS with M1 chip \n The column was useful for material calculations and analysis \n \n Is this a known bug or is there a setting to restore it?\n\n Thanks!\n\nHello ! Heard of the same issue on Discord :\n\n image 1460×756 117 KB \n\nIt says that in the release notes for CP 6.2… “We’re working with the firmware team on print time & purge amount estimation accuracy. A new K2 Plus firmware (mid-October) will address this”\n\n So maybe it is expected to not show anything until the new firmware is available and installed.\n\nScreenshot_2025-09-29-13-07-58-62_40deb401b9ffe8e1df2f1cc5ba480b12 2374×1080 296 KB","url":"https://forum.creality.com/t/issue-crealityprint-6-3-0-3417-missing-discharge-column-on-mac-m1/45544","productLine":"firmware","version":"","problemType":"compat","model":"K2 Plus","grade":"有效","replyCount":3,"views":76,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"394ea95842da4ee9","topicId":45534,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-28","lastActive":"2025-09-29","title":"Crealit print V6.2.2 y K1C","originalText":"Hello, I’m sorry, I don’t speak English and I’m using an automatic translator, so please excuse any mistakes.\n\nI have that software and that printer, but the problem is that when I draw a circle on a wall, the printer doesn’t print a circle, but an oval. Can this be fixed?\n\nIf it’s a square or rectangle, it prints correctly, and the height of the print is also correct. The filament is PLA esun.\n\nSolved, I removed CrealityPrint and installed OrcaSlicer, problem solved.","url":"https://forum.creality.com/t/crealit-print-v6-2-2-y-k1c/45534","productLine":"thirdparty","version":"6.2.2","problemType":"other","model":"K1","grade":"有效","replyCount":2,"views":52,"likeCount":1,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"a6308ce31773514d","topicId":45517,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-27","lastActive":"2025-09-27","title":"Can’t find Advanced mode in Creality Print 6","originalText":"I had issues with the first layer adhesion and I ran a bunch of z offset tests from the K1 MAX’s touch screen. It seems -0.105 is the sweet spot.\n\nI tried to go to Creality Print to save this new z offset but I can’t find the Advanced mode tab/menu anywhere!\n\n Am I blind or just otherwise losing it???\n\n Somebody please tell me where I can find it…\n\nHello ! You have to put it in the printer profile\n\n image 1190×629 38.7 KB\n\nWell that was well hidden… thank you very much!\n\n Does this preset apply when using Creality Cloud or when printing from the printer’s local files or does it apply only when using Creality Print?\n\n Edit: it doesn’t seem to work when using Creality Cloud.","url":"https://forum.creality.com/t/can-t-find-advanced-mode-in-creality-print-6/45517","productLine":"cloud","version":"6","problemType":"quality","model":"K1 Max","grade":"有效","replyCount":4,"views":481,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"95d5d97e55c00c9b","topicId":45500,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-26","lastActive":"2025-09-27","title":"Applying text to surfaces","originalText":"I’m on Creality Print 6.2.2 on a Windows machine. I can always apply text to a surface the first time, but when go to a second or third face, it places on the build plate.\n\n creality_1 801×747 75.6 KB \n\n creality_2 753×464 53.8 KB\n\nMe too! There needs to be a way to move text to a chosen surface. I know in theory it has that feature, but in practice it very rarely works.","url":"https://forum.creality.com/t/applying-text-to-surfaces/45500","productLine":"print","version":"6.2.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":131,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"251955baec052770","topicId":45460,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-24","lastActive":"2025-09-27","title":"Text on a curved surface","originalText":"I have 2 questions running Creality Print 6.2.2 on Windows..\n\n \n \n I have a cylinder I want to place text on. I thought I did it with an earlier version. Is this possible?\n\n \n \n I have a box I can select the first side (flat) and put some text on it, but if I rotate and try to place text on the opposite side of the box, it places the text on the inside wall of the first side.\n\nHello !\n\nConcerning the first question, you have to activate “Per Glyph”\n\n image 1197×935 105 KB \n\n concerning the second question, I don’t really know as I can hardly visualize it. sorry\n\nConcerning the second question. This figure you can see the embossed “Wipes, which worked.\n\n creality_1 926×677 48.6 KB \n\n The second image I selected the other side and entered “Wipes.” As you can see it places it on the first side’s back side.\n\n creality_2 1339×887 68.4 KB \n\n Type 1 box.3mf (153.3 KB)","url":"https://forum.creality.com/t/text-on-a-curved-surface/45460","productLine":"print","version":"6.2.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":3,"views":891,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"8c9ebd565bfda6f8","topicId":45455,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-24","lastActive":"2025-09-24","title":"een gewone bestand naar g code zetten","originalText":"hoe kan ik een gewone bestand naar g code maken\n\n ik heb de 3d printer net een week het gaat om een creality ender-3 v3 se printer wie kan me helpen","url":"https://forum.creality.com/t/een-gewone-bestand-naar-g-code-zetten/45455","productLine":"print","version":"","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":1,"views":23,"likeCount":0,"tags":["ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"853d72ffdf805494","topicId":45454,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-24","lastActive":"2025-09-24","title":"HI No longer listed as a selectable printer","originalText":"I recently purchased an HI Combo. Using Creality Cloud initially I could select the HI.\n\n After working flawlessly for a week, I have lost the ability to print unless I select a printer, However; there is no longer a printer listed for the HI as initially when installed Creality Print just isn’t worthy unless this is repaired. There Are numerous slicers out there.","url":"https://forum.creality.com/t/hi-no-longer-listed-as-a-selectable-printer/45454","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":85,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"065f0255288028d5","topicId":45450,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-24","lastActive":"2025-09-24","title":"Rotating a disc with motor","originalText":"image 820×457 43 KB \n\n i want to rotate a ciruclar disc with motor diagram givven , but i want my creality printer make the circuaor disc very acccuare , like in the motor there is a keyshaft , how shoud i do settings in pinter to make sure make a good and perfect design since the hole is only 3mmand keyshaft size is 0.5 m i have k2 plus","url":"https://forum.creality.com/t/rotating-a-disc-with-motor/45450","productLine":"print","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":38,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"510bb4c5f67a4b5c","topicId":45375,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-22","lastActive":"2025-09-22","title":"Creality Print 6.2.2.2 Login/register button and Device List dialog box empty","originalText":"I’ve just upgraded an Intel Mac to Creality Print v 6.2.2 from v 6.2.1. Unfortunately, the Creality button (top left) and Settings dialog boxes no longer work - they just pop up empty! Version 6.2.1 works ok on other Macs we have in the office. Just this latest version does not work. Creality Cloud on our iphone’s is also working ok. So our network and the Creality printers are all ok. Is there some weird network setting for 6.2.2 that needs to be sorted out?\n\n Thanks in advance!","url":"https://forum.creality.com/t/creality-print-6-2-2-2-login-register-button-and-device-list-dialog-box-empty/45375","productLine":"cloud","version":"6.2.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":39,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"f0f53634e218ac7d","topicId":45359,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-21","lastActive":"2025-09-21","title":"I need help Making the creality logo into an R","originalText":"I decided to name my Creality k1c “Reality” i want to 3d print the creality logo and emblem and put it on my k1c. The difference is im going to drop the c and make a capitol R in the same shape and lime green color as the creality emblem. If there is anyone out there who can help me please do im new to this and a lil help would go a long way in helping me achieve this silly goal. Even if you have some advice please let me know thanks -Spencer\n\n grok_image_6wze1k 1080×1324 105 KB\n\nI’m sorry but I don’t understand exactly your issue. You want to print this R but you have the photo but not the 3D file ?","url":"https://forum.creality.com/t/i-need-help-making-the-creality-logo-into-an-r/45359","productLine":"print","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":47,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"a05cbe03b11cb7a1","topicId":45266,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-18","lastActive":"2026-04-03","title":"No option in Halot Box for Printer Halot Play","originalText":"Just unboxed my Play and installed installed Halot Box. It doesn’t have an option to select a Halot Play printer in the field. What parameters should I use?\n\nsame problem over here , cant find my modehalot play\n\nEventually Creality help desk got back to me. Apparently the current versions of Halot Box doesn’t support Halot play. They suggested I install an older version of Box. By the time they had responded. I had already downloaded Chitubox and was able to find Halot Play there. I’ve been using it ever since. Works great for me! I never did get around to trying to downloading an older version of Box, so I don’t know if it will work.\n\nEarl","url":"https://forum.creality.com/t/no-option-in-halot-box-for-printer-halot-play/45266","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":91,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d25e2b7fc252fa49","topicId":45276,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-18","lastActive":"2025-09-18","title":"How to use Creality's jitter calibration? What is the axes have different print quality?","originalText":"Hi all, hoping someone has some insight:\n\n Under speed calibrations there is a “jitter speed” option. After printing it, I’m seeing a clear difference between the X and Y axis.\n\n As it’s not listed in their tutorial section, does anyone have any general information on this test? What is it meant to test? How do I interpret the results? What settings should I change?\n\n It appears that the test is to calibrate jerk speed, however I have no idea why the two axes have differing print quality.\n\n Any advice?\n\n Pictures below:\n\n \n Labeled X, actually on the Y axis. Weird print defects, why is this happening? \n \n PXL_20250918_045727972 1920×2550 166 KB \n\n \n Front side of the one labeled X. The ridges are fused at the corners and are generally too close together. \n \n PXL_20250918_045736645 1920×2550 139 KB \n\n \n Front side of the one labeled Y (but is on the x axis). Ridges are well (perfectly) spaced. \n \n PXL_20250918_045741320 1920×2550 130 KB \n\n \n Back side of the one labeled Y. No print defects. \n \n PXL_20250918_045746970 1920×2550 115 KB \n\n Creality Print 6.2.1\n\n K2 Plus Combo\n\n Thank you in advance!\n\nFynnAA: \n \n jitter speed\n\n \n \n @FynnAA Here’s a link to the description of what it does, but nothing about the calibration. They discuss Jitter speed near the bottom of the page. Parameter Description: Speed | Creality Wiki \n\n FYI, I found this guide easier to follow than the Creality wiki. Still doesn’t cover Jitter Speed settings, but I found it useful in other areas.\n\n \n \n \n\n how to calibrate your filament | Creality Cloud \n \n\n \n \n\n how to calibrate your filament | Creality Cloud \n\n Before we start let´s talk about why we need custom filament profiles!\nFirst there are different printers on the market, different filaments and lo...","url":"https://forum.creality.com/t/how-to-use-crealitys-jitter-calibration-what-is-the-axes-have-different-print-quality/45276","productLine":"cloud","version":"","problemType":"quality","model":"K2 Plus","grade":"有效","replyCount":2,"views":149,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"661f6ef73f71a788","topicId":45219,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-16","lastActive":"2026-03-05","title":"Creality Print Flush into Object Still not working?","originalText":"Has anyone else had issues with flushing volumes not changing and total material weight going up when you add an object and set it to be flushed into? Not sure what im doing wrong if anything. It seems to work just fine on my Bambu. I’m about to redownload PRUSA and see if it’s any different there.\n\nStill not working. Creality told me to:\n\n do try the following;\n\n Ensure you’re on the newest Creality Print (v6.3+ as of late 2025) and K2 Plus firmware bugs persist but updates sometimes help. Load models, paint colors, enable prime tower, right-click your flush object > Flush Options, tick all relevant color transitions and “flush into infill,” and set its layer volume higher than needed purge. Slice, then preview layers to confirm flushing hits the object before main prints (it often prints mains first, wasting filament).\n\n https://www.reddit.com/r/Creality_k2/comments/1pjt0cq/k2_plus_purge_reduction/ \n\n Switch to Orca Slicer (import K2 Plus profile) it reliably redirects flush (e.g., 77g to 49g waste) unlike Creality Print.\n\n Optimize color order (dark to light) and add 1-2 dedicated flush objects per transition.\n\n If CFS-enabled, check printer’s “Calculation of Flush Amounts” in settings and disable any fixed firmware flush stages\n\n Download Creality’s official K2 Plus Orca config .3mf from their wiki (drag into Orca to install), calibrate flow/pressure via Orca tools, and map filaments to CFS slots matching your print colors. If “send to printer” fails, slice/export to USB as fallback this way over Creality Print for purge reduction.\n\n https://www.reddit.com/r/Creality_k2/comments/1hlkthg/orca_slicer_with_k2_plus_and_cfs/ \n\n Which doesn’t work either","url":"https://forum.creality.com/t/creality-print-flush-into-object-still-not-working/45219","productLine":"thirdparty","version":"6.3","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":323,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"48208872a3d106ff","topicId":45224,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-16","lastActive":"2025-09-17","title":"Creality Print 6.2 not working on CRM4","originalText":"I cannot get any successful prints using Creality Print 6.2 on my CRM4 printer. Is anyone else having problems printing using the Creality Print 6.2 slicing software.\n\nCan you give more information about this issue ?\n\nNickGarai: \n \n I cannot get any successful prints using Creality Print 6.2 on my CRM4 printer. Is anyone else having problems printing using the Creality Print 6.2 slicing software.\n\n \n \n I’ve had similar issues with 6.2 prints that didn’t come out right. Rolling back to the previous version worked better for me.","url":"https://forum.creality.com/t/creality-print-6-2-not-working-on-crm4/45224","productLine":"print","version":"6.2","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":55,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"765d30232ef8aee9","topicId":45212,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-15","lastActive":"2025-09-15","title":"Increase build volume","originalText":"Is there any way to increase Z axis volume for ender 5 max? Can I do it in the root access? I did a hardware modified so now need to firmware move to 500mm.","url":"https://forum.creality.com/t/increase-build-volume/45212","productLine":"firmware","version":"","problemType":"","model":"Ender-5 Max","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"d22fe3a03e3d45cf","topicId":45100,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-12","lastActive":"2025-09-25","title":"Ender 3 S1 Pro - No preview image","originalText":"I have just moved to creality print as I dont print every day and want to use the preconfigured profile.\n\n Creality Print V6.2.2.3203 Release\n\n The preview image is in the gcode but does not show on the printer touch screen!\n\n Machine Details \n\n Ender 3 S1 Pro\n\n F/W VER 2.0.8.28F4\n\n Screen VER 1.0.5\n\n I had this working in Cura but I dont want to use that anymore!\n\n I did edit the printer setting to JPG instead of PNG and that still did not work\n\nI created a post processor for thumbnails\n\n On GitHub","url":"https://forum.creality.com/t/ender-3-s1-pro-no-preview-image/45100","productLine":"thirdparty","version":"6.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":114,"likeCount":0,"tags":["trouble-shooting","crealityprint-v6","ender-3-s1-pro"],"relReason":"tag","sourceType":"用户"},{"uid":"65c57b0e941608bc","topicId":45094,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-12","lastActive":"2025-09-12","title":"Bug in CrealityScan 4 (v1.2.8) interface (Portuguese - Brazil language setting)","originalText":"Hello Creality Team,\n\n I am using CrealityScan 4 (version 1.2.8) on Windows11, with the language set to Portuguese (Brazil) .\n\nI noticed a UI bug: on the home screen, in the “Scanner disconnected” warning, the text <\/cor> is displayed, which seems to be an rendering issue.\n\n Please find attached a screenshot for reference.\n\n Thank you for your attention and support!\n\n Best regards image 1913×1019 98.6 KB \n\n image 384×134 9.85 KB","url":"https://forum.creality.com/t/bug-in-crealityscan-4-v1-2-8-interface-portuguese-brazil-language-setting/45094","productLine":"print","version":"9.85","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":36,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"60d493a729dd535d","topicId":45058,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-10","lastActive":"2025-09-11","title":"Small wall print","originalText":"Hello,\n\n I would like to print this 6mm thick wall (K2 plus).\n\nI would ideally like to place it vertically and\n\nattach supports. Unfortunately, I don’t know how to do that.\n\nPlease show me an “optimal” solution.\n\nThe file is attached.\n\n Regards,\n\nAchim Hagge\n\n Komponente1__li-unten.3mf (1,5 MB)\n\nThat looks a straightforward print… stand upright / vertical, brim with 0 gap for stability, use classic wall option, not arcane… increase wall count to 4 or higher, disable side fan in your profile (or manually turn off after print starts if not sure how)\n\n 6mm is actually quite thick, I print less than 1mm vertical walls without issues. So because it’s a thick wall you can also use inner/outer/inner print option (you only need 3 walls for that option) as there doesn’t look to need any bridging… that will give a smoother exterior.\n\n How you make tall skinny prints work is by increasing the wall count, that way its doesn’t need to use sparse infill/patterns, which “can” knock over tall skinny prints…\n\n With above settings you can print 300mm high 1mm walls..\n\n Not near a computer to show settings, but search for those options.. & you should be able to print that easily on a k2+\n\nHello,\n\n Thanks for the feedback…\n\nI printed the wall last night at 65% of its original size.\n\nWith the “brim” and without any additional support, it worked really\n\nsmoothly. Photo is attached.\n\nI can hardly imagine that it’s possible to print a 1mm\n\nthick wall…?\n\nThese are still test prints for my project “Fuselage for BO105 Model Helicopter\n\nin 1:4 scale.”\n\nI haven’t had the Creality printer for very long; I started with a BamBu Lab.\n\nBut it’s too small for my project.\n\n Greetings from Hamburg\n\nAchim\n\n Wand mir brim 1920×1080 224 KB","url":"https://forum.creality.com/t/small-wall-print/45058","productLine":"print","version":"","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":5,"views":149,"likeCount":1,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"f1ad129cc9779cfc","topicId":45034,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-09","lastActive":"2025-09-09","title":"Não consigo logar na conta Cloud no meu CP","originalText":"Veja que quando clico no logo da seta a tela fica branca e não consigo logar na minha conta.\n\n image 1919×1079 89.1 KB \n\n Somente por VPN conecto a minha casa para poder executar a distância.\n\n image 1919×964 45.2 KB","url":"https://forum.creality.com/t/nao-consigo-logar-na-conta-cloud-no-meu-cp/45034","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"503fb90e5530b7d9","topicId":45037,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-09","lastActive":"2025-09-09","title":"Ender 5 Max firmware","originalText":"Is there any way to edit Ender 5 Max oficial firmware ? I think it can be possible to extend Z volume around 410 to 450 without problems.\n\nAnd I want to remove nozzle cleaning scrypt, I prefer to do manually.\n\nFinally want to add bl touch, the homing touch point is visible in heatbed.\n\n IMG_20250908_224513424 1920×1440 117 KB \n\n IMG_20250908_223810839 1920×1440 172 KB","url":"https://forum.creality.com/t/ender-5-max-firmware/45037","productLine":"firmware","version":"","problemType":"","model":"Ender-5 Max","grade":"泛讨论","replyCount":1,"views":56,"likeCount":0,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"ce4df2675cf77b1b","topicId":45001,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-08","lastActive":"2025-10-06","title":"Creality Print- top/bottom thickness slicing at only 1 layer, no thicker","originalText":"Hi, I’m using 6.2.2.3203. Any model I try to print is only slicing with a single layer for both the top and bottom. Changing either the bottom layers or bottom shell thickness makes no change…it slices with only a single layer. What is going on? Any solutions? I’m using a stock profile for the Ender 3 V3 Plus and a stock system preset for 0.25mm.\n\n thanks, Brad\n\nHello ! Is it possible to get an image of the preview ?\n\n And in the preview do you see the infill ? If not, it could mean you have the lite mode activated\n\nDo you set the layers as below\n\n Layers1 1920×1080 181 KB \n\n Bill","url":"https://forum.creality.com/t/creality-print-top-bottom-thickness-slicing-at-only-1-layer-no-thicker/45001","productLine":"print","version":"6.2.2","problemType":"","model":"Ender-3 V3 Plus","grade":"泛讨论","replyCount":6,"views":400,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"f08bb4a7bc07e71b","topicId":45002,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-08","lastActive":"2025-10-01","title":"Ender-3 Pro support in v6.2?","originalText":"I cannot find a printer option for an Ender-3 Pro. If I use the Creality Ender-3 profile I get an error that my “Ender-3 Pro ABL” on a Sonic Pad is not supported by that profile. I’ve tried printing and it seems to print ok but that error is worrying. How should Creality Print be configured for my printer to be error free at print? Thx\n\nI have also tried the “Creality Sonic_Ender-3” profile but that errors the same. Updating to 6.3 did not help either. I really want to get Creality Print working, not any other solutions as most everything else has issues that make them unworkable for what I want to be able to do. Any ideas??","url":"https://forum.creality.com/t/ender-3-pro-support-in-v6-2/45002","productLine":"print","version":"6.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":71,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"ec5dba6391d9e7a1","topicId":44954,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-06","lastActive":"2025-09-08","title":"Remove top and bottom layers issue","originalText":"Hello, I’m trying to print by removing the top and bottom layers just to reach this final print presentation:\n\n image 521×430 66.8 KB \n\n I just modified the settings of my profile as I usually did with Cura or other slicers but I only reach this result:\n\nYou can also see the settings I changed. Can anyone help me on which options I have to change?\n\n image 1328×670 144 KB \n\n Thank you in advance!\n\nHello !\n\nDo you have the lite mode activated ? \n\nYou can see that in the “Preview” section where you can select “Layer type” or “Speed” or …Etc\n\nOMG thank you so much Alex! I didn’t know it and now I can see it Let’s go print!!","url":"https://forum.creality.com/t/remove-top-and-bottom-layers-issue/44954","productLine":"thirdparty","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":362,"likeCount":1,"tags":["crealityprint-v5"],"relReason":"tag","sourceType":"用户"},{"uid":"10af27825c4bac4f","topicId":44960,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-06","lastActive":"2025-09-06","title":"Creality Print v6 not opening on my MacBook Pro","originalText":"Some system details:\n\nMacBook Pro - Chip: Apple M2 Pro - Running OS:15.6.1 (24G90)\n\n I have installed the latest version of the Creality Print software for MacOS with Mac chip. But it won’t open a window. It says the app is open, but there is no way I can see any screen. Here is a screenshot when I select the thumbnail and command ‘Show all windows’.\n\n Screenshot 2025-09-05 at 10.19.38 1920×1239 307 KB \n\n Everything works fine on my windows machine, but I cannot use Creality Print on my macbook which is really annoying. Please assist (and uninstall, reboot, install, sometimes works for one session, but I cannot do this everytime I want to slice and print something).","url":"https://forum.creality.com/t/creality-print-v6-not-opening-on-my-macbook-pro/44960","productLine":"cloud","version":"6","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":303,"likeCount":0,"tags":["mac"],"relReason":"category","sourceType":"用户"},{"uid":"3da87687bc74c4c5","topicId":44952,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-06","lastActive":"2025-09-06","title":"CP 6.21.3044","originalText":"Creality print doesn’t “activate chamber temp control” transfer into GCode.\n\n Even if ticked Creality print sets M141 at the start but NOT M191 as wanted. So printing starts before chamber is heated up properly.\n\n Does anybody know how to solve this?\n\n Thanks and regards.","url":"https://forum.creality.com/t/cp-6-21-3044/44952","productLine":"print","version":"6.21","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":42,"likeCount":0,"tags":["k2plus","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"9c462f8c7e5fbba4","topicId":44950,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-06","lastActive":"2025-09-06","title":"Problemas com CFS upgrade K1C","originalText":"I’m having a little trouble, my Creality Print can’t recognize the CFS installed on my K1C or don’t appear the option to enable the CFS.\n\n I don’t know how to solve this, the CFS is working but I need to send the 3mf on the app/cloud, this is the only way which I can made it work.\n\n Captura de tela 2025-09-05 211431 2034×1352 274 KB","url":"https://forum.creality.com/t/problemas-com-cfs-upgrade-k1c/44950","productLine":"cloud","version":"","problemType":"feature","model":"K1C","grade":"有效","replyCount":1,"views":37,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8bf4a69e3843cb42","topicId":44907,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-04","lastActive":"2025-10-13","title":"Settings changing with V6.2.2.3203 update","originalText":"Hi! i updated the slicer to V6.2.2.3203 and noted that the printing time for my .3mf files changed even though they are the same. For some reason, the time is now less, showing that it is speeding up which causes problems with the prints.\n\n I confirmed the problem by downgrading again the slicer and getting the usual time and velocity back.\n\n Did someone experienced the same problem?\n\nI even have Device tab empty!! So you have better situation.\n\n I also fin dout that all line width setti
