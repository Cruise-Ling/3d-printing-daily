at/46840","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":510,"likeCount":6,"sourceType":"论坛"},{"uid":"b6adee8d856976df","date":"2025-11-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"I should be able to print by object if only the last object is higher","titleCn":"如果只有最后一个物体更高，我应该可以按物体逐个打印","originalText":"I should be able to slice a bed with print sequence by object if only the last object is too tall.\nThe height limit only makes sense when the object being printed is not the last one","textCn":"如果只有最后一个物体过高，我应该可以对按物体顺序打印的热床进行切片。\n只有当正在打印的物体不是最后一个时，高度限制才有意义","truncated":false,"url":"https://forum.creality.com/t/i-should-be-able-to-print-by-object-if-only-the-last-object-is-higher/46865","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":27,"likeCount":0,"sourceType":"论坛"},{"uid":"afa24ebf4e324261","date":"2025-11-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality cr studio v2. 5","titleCn":"Creality CR Studio v2.5","originalText":"Guys, can anyone help me. I’ve just got my lizard 3d scanner and installed the software. But when I want to manually align items I have no mark point window the white background photo is from my software and the black background photo is from a video I was working from as you can see I don’t have the option to mark points. Any idea what I’m doing wrong. Tia\nMessenger_creation_7561FA6C-6EED-4BBA-ABA6-AE69D08E5E98\nMessenger_creation_E37DDD6E-A276-4C7A-9A67-4CB5665D0FE8","textCn":"各位，有人能帮我吗。我刚拿到我的 Lizard 3D 扫描仪并装好了软件。但当我想手动对齐物品时，我没有标记点窗口，白色背景的照片是我的软件，黑色背景的照片是我参照的视频，如你所见我并没有标记点的选项。知道我哪里做错了吗。先谢了。","truncated":false,"url":"https://forum.creality.com/t/creality-cr-studio-v2-5/46841","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"6da1437c920be761","date":"2025-11-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Tree supports on build plate only should be able detect objects around","titleCn":"仅打印在热床上的树状支撑应当能识别周围的对象","originalText":"I’m trying to put tree and normal supports on the same object. I cut it and put one object above the other, using add part to keep distance from the bed. However, when I slice the plate, the tree supports are going through the bottom object. If I slice the object without all this prep, the tree supports are created perfectly, around the object. So, when Creality Print 6.3 adds the tree support, it’s only considering the target object, but it should consider all object on the plate.\nOn the left image, it’s the prep plate with the supports going through the bottom object. On the right image it’s the same object but without the prep, with the tree supports going around the whole object.\n@dalmirnogueira I have had this happen as well.","textCn":"我想在同一个对象上同时使用树状支撑和普通支撑。我把它切开，把一个对象放在另一个上方，用添加零件的方式与热床保持距离。然而当我切片这块热床时，树状支撑穿过了下面的对象。如果我不做这些预处理直接切片这个对象，树状支撑会围绕对象完美生成。所以，当 Creality Print 6.3 添加树状支撑时，它只考虑了目标对象，但它应该考虑热床上的所有对象。左边图片是做了预处理的平台上支撑穿过底部对象的情况。右边图片是同一个对象但没做预处理，树状支撑绕着整个对象生成。@dalmirnogueira 我也遇到过这种情况。","truncated":false,"url":"https://forum.creality.com/t/tree-supports-on-build-plate-only-should-be-able-detect-objects-around/46867","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":57,"likeCount":1,"sourceType":"论坛"},{"uid":"27ccc936e300df35","date":"2025-11-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Scale in creality print","titleCn":"在 Creality Print 中缩放","originalText":"Hello,\nIs it possible to reduce the scale of the model in creality print\nThank you\nHello !\nYes you can !\nWhich version of CrealityPrint are you using ?\nYou generally have to use the scale function (S keypad shortcut)\nok i don’t know what is the version i use but i think it s the last\nthank you for your answer and i will test\nhave a nice day","textCn":"你好，可以在 Creality Print 中缩小模型的缩放比例吗？谢谢。你好！可以的！你使用的是哪个版本的 CrealityPrint？通常你需要使用缩放功能（S 键快捷键）。好的，我不知道我用的是哪个版本，但我想是最新的。谢谢你的回答，我会测试一下。祝你有美好的一天","truncated":false,"url":"https://forum.creality.com/t/scale-in-creality-print/46848","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":271,"likeCount":3,"sourceType":"论坛"},{"uid":"0d6e8b3583a43d8f","date":"2025-11-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print crashing when selectiing object to paint support","titleCn":"Creality Print 在选择要涂绘支撑的对象时崩溃","originalText":"If I have 2 or more objects on the bed of Creality Print 6.3, I can only select one object at a time to paint supports. If I select multiple objects, the painting supports button becomes faded and I can’t even use the L shortcut.\nHowever, the problem is that if I select only 1 object to paint, and only then use ctrl to select another object, the software crashes.\nI know this is kinda of an user error, but the software shouldn’t crash when doing it. It should appear a pop-up saying that I can only paint supports one object at a time or even does nothing at all. But it shouldn’t crash!","textCn":"如果 Creality Print 6.3 的热床上有 2 个或更多对象，我一次只能选中一个对象来涂绘支撑。如果选中多个对象，涂绘支撑按钮就会变灰，我甚至用不了 L 快捷键。但问题是，如果我只选中 1 个对象来涂绘，然后才用 ctrl 去选另一个对象，软件就会崩溃。我知道这算是用户操作失误，但软件不应该在做这件事时崩溃。它应该弹窗提示我一次只能给一个对象涂绘支撑，甚至什么都不做也行。但它不该崩溃！","truncated":false,"url":"https://forum.creality.com/t/creality-print-crashing-when-selectiing-object-to-paint-support/46864","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":35,"likeCount":0,"sourceType":"论坛"},{"uid":"82c856d48b153f17","date":"2025-11-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Modfiers not correctly applying to a model","titleCn":"修改器未能正确应用到模型","originalText":"I’m applying a modifier to a model to remove the top and bottom surfaces so the honeycomb sparse infill is exposed. This works on PrusaSlicer, OrcaSlicer, and according to Mango Jelly on you tube, it works on most slicers.\nHowever, when attempting this on Creality Print, it deletes the area of the modifier. Other slicers behave as expected.\nResult using OrcaSlicer:\nResult using Creality Print:\nThis is the same model and modifier Settings for both slicers.\nHow do I get this to work on Creality Slicer.\nModifier does not work.3mf ( )\nModifierWorksinOrca..3mf ( )\nI have no idea why this is happening but I’d sure like to know how to make it work in CrPrint.\nHello !\nJust to make sure, can you share your full screen of the preview ? I fear the lite mode may be activated (it doesn’t show any infill)\nLite mode is not enabled.\nthis","textCn":"我在给一个模型应用修改器，以移除顶面和底面，让蜂窝状稀疏填充露出来。这在 PrusaSlicer、OrcaSlicer 上有效，而且根据 you tube 上 Mango Jelly 的说法，它在大多数切片软件上都有效。然而，在 Creality Print 上尝试时，它会把修改器所在的区域删掉。其他切片软件的表现符合预期。使用 OrcaSlicer 的结果：使用 Creality Print 的结果：两个切片软件用的是同一个模型和同样的修改器设置。我怎样才能让它在 Creality 切片软件上生效。Modifier does not work.3mf ( )。ModifierWorksinOrca..3mf ( )。我不知道为什么会这样，但我确实很想知道怎样才能让它在 CrPrint 上生效。你好！为了确认一下，你能分享一下预览的全屏截图吗？我担心精简模式可能被激活了（它不显示任何填充）。精简模式没有启用。这个","truncated":false,"url":"https://forum.creality.com/t/modfiers-not-correctly-applying-to-a-model/46837","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":95,"likeCount":0,"sourceType":"论坛"},{"uid":"325846f7111e1865","date":"2025-11-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"HALOT BOX is crashing","titleCn":"HALOT BOX 崩溃","originalText":"Hello everyone. HALOT BOX has been crashing on me when I click RESIN to continue the slicing process. The first time it happened, I made sure all drivers, software, etc. was up to date and that didn’t work. I then uninstalled/reinstalled HALOT BOX with the version available on Creality’s website. That didn’t work. I ended up resetting my laptop to factory and started with clean installs and minimalist software and drivers. Reinstall HALOT BOX and that seemed to work … until today. It is crashing once more in the same fashion as the first time. Has anyone run into this recently or further in the past?","textCn":"大家好。HALOT BOX 在我点击 RESIN 继续切片流程时一直崩溃。第一次发生时，我确认了所有驱动、软件等都是最新的，但没有用。然后我用 Creality 官网上的版本卸载/重装了 HALOT BOX。还是没用。最后我把笔记本电脑恢复出厂设置，从干净安装和最小化的软件与驱动开始。重装 HALOT BOX 后似乎能用了……直到今天。它又以和第一次相同的方式崩溃了。最近或更早以前有人遇到过吗？","truncated":false,"url":"https://forum.creality.com/t/halot-box-is-crashing/46836","productLine":"print","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":144,"likeCount":0,"sourceType":"论坛"},{"uid":"d826e8ce06f3ec31","date":"2025-11-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CrealityPrint 6.3.0.3420: The currently selected printer (Sermoon D3 Pro) is not compatible with the print preset (Creality Sermoon D3 Pro 0.4 nozzle)","titleCn":"CrealityPrint 6.3.0.3420：当前选择的打印机（Sermoon D3 Pro）与打印预设（Creality Sermoon D3 Pro 0.4 喷嘴）不兼容","originalText":"This release version claims that the problem is solved, but it is not.\nWhen sending a model to the printer, I get the following error:\nThe currently selected printer (Sermoon D3 Pro) is not compatible with the print preset (Creality Sermoon D3 Pro 0.4 nozzle).\nI’ve tried to delete the software and all the data, factory reset printer - nothing helped.","textCn":"这个发行版本声称问题已解决，但并没有。当我向打印机发送模型时，出现以下错误：当前选择的打印机（Sermoon D3 Pro）与打印预设（Creality Sermoon D3 Pro 0.4 喷嘴）不兼容。我试过删除软件和所有数据、把打印机恢复出厂设置——都没有帮助。","truncated":false,"url":"https://forum.creality.com/t/crealityprint-6-3-0-3420-the-currently-selected-printer-sermoon-d3-pro-is-not-compatible-with-the-print-preset-creality-sermoon-d3-pro-0-4-nozzle/46815","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":40,"likeCount":0,"sourceType":"论坛"},{"uid":"ce31783fed1404ec","date":"2025-11-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"creality print has no profile for the ender 3 v2 neo?","titleCn":"creality print 没有 ender 3 v2 neo 的配置？","originalText":"am i missing something here, or did creality just forget they made this printer?","textCn":"是我漏了什么，还是 Creality 忘了他们造过这台打印机？","truncated":false,"url":"https://forum.creality.com/t/creality-print-has-no-profile-for-the-ender-3-v2-neo/46792","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":25,"likeCount":0,"sourceType":"论坛"},{"uid":"c615e73182be197d","date":"2025-11-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CrealityCloud big problem","titleCn":"CrealityCloud 大问题","originalText":"Hi… Today 6am (+1 utc) i turned on Creality Cloud and it was mega laggy… I said like ok maybe some problems and now when i opened it it showed faild to load data… (picture)… Do you have the same problems? Please help","textCn":"嗨……今天早上 6 点（UTC+1）我打开 Creality Cloud，它卡得一塌糊涂……我当时想好吧，也许有些问题，而现在我打开它时显示无法加载数据……（图片）……你们有同样的问题吗？请帮忙","truncated":false,"url":"https://forum.creality.com/t/crealitycloud-big-problem/46706","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":73,"likeCount":0,"sourceType":"论坛"},{"uid":"779bac0b9d3bdeba","date":"2025-11-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Could you help us choose a name for Creality Cloud’s new section?","titleCn":"能帮我们为 Creality Cloud 的新板块选个名字吗？","originalText":"bigstock-Poll-word-in-red-d-letters-on-106461233\nCould you help us choose a name for Creality Cloud’s new section?\nThe coming new chapter of Creality Cloud is created to give every Creality user an effortless, reliable, and truly enjoyable FFF printing experience.\nWe invite you to vote for your favorite name or submit your own suggestions below:\nFDMuse: The muse of FDM, a source of inspiration for FDM creators\nFDMagic: Magic of FDM, turning ideas into reality like a magical transformation\nFlowPrint: “Flow” refers to the smooth melt-flow process of FFF printing, and “Print” is self-explanatory.\nPrinF: A compressed blend of “Print” + “F” (for FFF)\nBluePrint: A real English word referring to a plan, design draft, or master plan for the community\nCPF (Creality Print Faster)\nCCU (Creality Cloud Ultra)\nOthers\nFDMuse\nFDMagic\nFlowPrint\nPrinF\nBluePrint\nCPF\nCCU\nOthers\n0\nvoters\nWhat is fff printing?\nI didn’t know what it was either until I looked it up..\nFFF-Printing","textCn":"能帮我们为 Creality Cloud 的新板块选个名字吗？Creality Cloud 即将到来的新篇章，旨在为每一位 Creality 用户带来轻松、可靠且真正愉快的 FFF 打印体验。我们邀请你为最喜欢的名字投票，或在下方提交你自己的建议：FDMuse：FDM 的缪斯，FDM 创作者的灵感之源。FDMagic：FDM 的魔法，像神奇的变形一样把想法变成现实。FlowPrint：“Flow”指 FFF 打印顺畅的熔融流动过程，“Print”不言自明。PrinF：“Print”+“F”（代表 FFF）的压缩组合。BluePrint：一个真实存在的英文词，指社区的方案、设计稿或总体规划。CPF（Creality Print Faster）。CCU（Creality Cloud Ultra）。其他。FDMuse、FDMagic、FlowPrint、PrinF、BluePrint、CPF、CCU、其他。0 位投票者。什么是 FFF 打印？我之前也不知道那是什么，直到我查了一下……FFF 打印。","truncated":false,"url":"https://forum.creality.com/t/could-you-help-us-choose-a-name-for-creality-cloud-s-new-section/46699","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":95,"likeCount":1,"sourceType":"论坛"},{"uid":"727600142150db77","date":"2025-11-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 6 issues and not available in CrealityPrint?","titleCn":"Ender 6 的问题以及在 Creality Print 中不可用？","originalText":"Hi Creality and printing friends!\nI recently got an Ender 6 printer but have trouble getting it to print properly. I wanted to try Crealitys own slicing and printing software as that should be optimal for the printer and how it works. But I can not even see the Ender 6 as a printer to choose from? Why is that?\nAnyone else that has an Ender 6 and can recommend settings and software for it to work?\nIs there any firmware for it that work better? I have v 1.0.4.9 right now.\nOne thing is that it gets thermal runaway and thermal errors. As default it always activates the fan and if you do not turn that off when starting a print, it will stop due to thermal issue. Not reaching temp in time etc. Any solution for this?","textCn":"你好，Creality 和打印界的朋友们！ 我最近得到一台 Ender 6 打印机，但很难让它正常打印。我想试试 Creality 自己的切片和打印软件，因为那对这台打印机及其工作方式来说应该是最优的。但我甚至看不到 Ender 6 可以作为打印机选择？这是为什么？ 还有别人有 Ender 6 并能推荐让它正常工作的设置和软件吗？ 有没有对它来说更好用的固件？我现在用的是 v 1.0.4.9。 一个问题是它会热失控和报温度错误。默认情况下它总是启动风扇，如果你在开始打印时不关掉，它就会因为温度问题而停止。无法及时达到温度等等。这个问题有什么解决办法吗？","truncated":false,"url":"https://forum.creality.com/t/ender-6-issues-and-not-available-in-crealityprint/46701","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":173,"likeCount":0,"sourceType":"论坛"},{"uid":"106909b1227c1a1d","date":"2025-11-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Probleme avec mapping automatique","titleCn":"自动映射的问题","originalText":"Probleme avec mapping automatique","textCn":"自动映射的问题","truncated":false,"url":"https://forum.creality.com/t/probleme-avec-mapping-automatique/46656","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"sourceType":"论坛"},{"uid":"fb68a83313bc6101","date":"2025-11-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Only one bottom layer when infill set at 0%","titleCn":"填充设为 0% 时只有一层底层","originalText":"Only one bottom layer when infill set at 0%","textCn":"填充设为 0% 时只有一层底层","truncated":false,"url":"https://forum.creality.com/t/only-one-bottom-layer-when-infill-set-at-0/46632","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":21,"likeCount":0,"sourceType":"论坛"},{"uid":"d43bb3cf60137295","date":"2025-11-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Wrong first overhanging layer direction","titleCn":"首个悬垂层的方向错误","originalText":"Hello, my friends! I found a small mistake in slicing algoritm: often first overhanging layer have the same direction, as the support layer.\nAs result - very low quality on overhanging surface: 50% of lines have 100% overlaping with supports and 50% lines printing on the air.\nScreenshot_1","textCn":"朋友们好！我发现切片算法中有一个小错误：首个悬垂层经常与支撑层方向相同。结果是——悬垂表面质量非常差：50% 的线条与支撑 100% 重叠，50% 的线条悬空打印。Screenshot_1","truncated":false,"url":"https://forum.creality.com/t/wrong-first-overhanging-layer-direction/46635","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"d0becbed973b7b13","date":"2025-11-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Where can I find documentation of all the menu items in Creality v6?","titleCn":"我在哪里能找到 Creality v6 里所有菜单项的文档？","originalText":"The title says it all…\nI’m not sure if this covers every setting, but it covered every setting I’ve looked for. Creality Print 6.x Contents | Creality Wiki\nThat helps some. I sure wish there was searchable text rather than videos though. Thanks!","textCn":"标题已经说明了…… 我不确定它是否覆盖了每一项设置，但它覆盖了我查过的每一项设置。Creality Print 6.x 目录 | Creality Wiki 这有点帮助。不过我真希望有可搜索的文字而不是视频。谢谢！","truncated":false,"url":"https://forum.creality.com/t/where-can-i-find-documentation-of-all-the-menu-items-in-creality-v6/46639","productLine":"print","version":"6","versionRaw":"6","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":54,"likeCount":0,"sourceType":"论坛"},{"uid":"071c033122d888bd","date":"2025-11-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How can I remove the intersection of two objects in Creality v6?","titleCn":"如何在 Creality v6 中移除两个对象的相交部分？","originalText":"Up till now I have used an online slicer called “Self Cad” but they seem to have removed this tool. Can Creality let me place one object intersecting another and then remove all “material” from the space they have in common?\nI have the same question. I couldn’t find anything, but my model worked with the overlapping pieces. It flags an error, bu t printed fine. Wasted a bit of filament on parts that were inside the other half of the model.\nSelfCAD is working again. Much easier than messing around with Creality, just place the objects where you want and click on “delete the intersection”.\nThanks nonetheless….","textCn":"到目前为止我一直使用一个叫“Self Cad”的在线切片软件，但他们似乎移除了这个工具。Creality 能不能让我把一个对象与另一个对象相交放置，然后从它们共有的空间中移除所有“材料”？我也有同样的问题。我什么也没找到，但我的模型用重叠的部件也能工作。它报了一个错误，但打印正常。在模型另一半内部的部件上浪费了一点耗材。SelfCAD 又能用了。比在 Creality 里折腾容易多了，只需把对象放在你想要的位置，然后点击“delete the intersection”。不过还是谢谢……","truncated":false,"url":"https://forum.creality.com/t/how-can-i-remove-the-intersection-of-two-objects-in-creality-v6/46640","productLine":"print","version":"","versionRaw":"","problemType":"slice","model":"未标注","grade":"有效","replyCount":3,"views":137,"likeCount":2,"sourceType":"论坛"},{"uid":"c8c4957f069f2a93","date":"2025-11-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"DE","title":"wie kann ich neue fonts in creality print einfügen das ich sie mit der text funktion nutzen kann ?","titleCn":"我怎样才能在 creality print 里添加新字体，好让我在文本功能里使用它们？","originalText":"wie kann ich neue fonts in creality print einfügen das ich sie mit der text funktion nutzen kann ?","textCn":"我怎样才能在 creality print 里添加新字体，好让我在文本功能里使用它们？","truncated":false,"url":"https://forum.creality.com/t/wie-kann-ich-neue-fonts-in-creality-print-einfugen-das-ich-sie-mit-der-text-funktion-nutzen-kann/46616","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":38,"likeCount":0,"sourceType":"论坛"},{"uid":"241b4dd0b1b66f4b","date":"2025-11-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How do I cut out a piece of model in CrealityPrint?","titleCn":"我如何在 CrealityPrint 中切出模型的一块？","originalText":"Apologies for my ignorance, but I can’t find any tutorial on YouTube for my problem or a matching topic in the forum.\nI have a Swan STL that I intend to make remote control for my wife. I have scaled it up, hollowed it out, and sliced off the pieces I need to fit in my print area, but now I want to cut out a piece of the top to access the inside. (I have attached a photo for reference.)\nI created a “negative part” cube for the section I wish to cut/print separately, but now I’m stumped as to how to make this a separate piece. Even if I check the preview with the negative part, it only cuts off the outside edges of the cube and not everything inside of the cube’s volume. (If you’re used to designing in Fusion 360 at all like me, I’m trying to essentially create a new body via the “intersect” method.) Unfortunately this STL isn’t my design, so I can’t edit it except in the slicer.\nThanks for any help you can provide!\nScreenshot 2025-11-15 153209\nYou might be able to print the swan with ‘pause’ at layer and stop the print. Not sure about the head but you could turn it upside down and stop at layer. Trouble is it would need supports and I don’t think you can generate for just the head.","textCn":"抱歉我的无知，但我在 YouTube 上找不到针对我问题的教程，论坛里也没有匹配的话题。我有一个天鹅 STL，打算做成给我妻子的遥控模型。我把它放大了，把它掏空了，并切掉了我需要放进打印区域的部分，但现在我想在顶部切出一块以便进入内部。（我附了一张照片作参考。） 我为我想切出/单独打印的部分创建了一个“负零件”立方体，但现在我不知道如何把它变成一个单独的零件。即使我用这个负零件检查预览，它也只会切掉立方体的外侧边缘，而不是立方体体积内的所有东西。（如果你像我一样习惯在 Fusion 360 里设计，我本质上是想通过“相交”方法创建一个新实体。）不幸的是这个 STL 不是我的设计，所以除了在切片软件里我无法编辑它。 感谢你能提供的任何帮助！ Screenshot 2025-11-15 153209 你也许可以在打印天鹅时用“在层暂停”并停止打印。头部不确定，但你可以把它倒过来并在层处停止。问题是这样就需要支撑，而我认为你无法只为头部生成支撑。","truncated":false,"url":"https://forum.creality.com/t/how-do-i-cut-out-a-piece-of-model-in-crealityprint/46608","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":1058,"likeCount":1,"sourceType":"论坛"},{"uid":"76f0df9a3978e46c","date":"2025-11-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Slicer moves ground color into top layers","titleCn":"切片软件把底色移到了顶层","originalText":"Bottom color bleeds into upper layers of these letters. Using Hi with 0.2 nozzle and 0.1 layer, Hyper PLA, all else standard. Tried different fonts, font size and bold. Always some artifacts in lower layer copied up to top. Also, and not a serious issue, I could not get the height range (0.1) synchronized with the letter extrusion of .5. There is a thin white layer under the start of the letter. Any suggestions please, and yes they are visible in the print?\nThink I could work around the problem by using one color and a pause with manual filament change!!!\nSort of got it working by using a simple bold font and ironing. Looks good enough but is not a satisfactory solution!","textCn":"这些字母的底色渗到了上层。使用的是 Hi，配 0.2 喷嘴和 0.1 层高，Hyper PLA，其余都是标准设置。试过不同字体、字号和加粗。总是有下层的一些瑕疵被复制到顶层。另外（这不是严重问题），我无法让高度范围（0.1）与字母挤出量 0.5 同步。字母起始处下面有一层薄薄的白色层。请给点建议，而且是的，它们在打印件上看得见？ 我想我可以通过只用一种颜色并暂停手动换料来绕过这个问题！！！ 用简单的加粗字体加上熨烫，算是勉强能用了。看起来足够好，但不是令人满意的解决方案！","truncated":false,"url":"https://forum.creality.com/t/slicer-moves-ground-color-into-top-layers/46604","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":52,"likeCount":0,"sourceType":"论坛"},{"uid":"35bf06b0d09f64a9","date":"2025-11-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Print latest update has rendered my slicer un operable","titleCn":"最新更新让我的切片软件无法使用","originalText":"Open GL2 not supported program closing update graphics driver is message i get and yet it worked fine with previous version. I have Uninstalled all creality print apps and tried reinstalling older version to get the same message","textCn":"我收到的消息是 Open GL2 not supported program closing update graphics driver，可是之前的版本运行正常。我卸载了所有 Creality Print 应用，并尝试重新安装旧版本，仍然得到同样的消息。","truncated":false,"url":"https://forum.creality.com/t/print-latest-update-has-rendered-my-slicer-un-operable/46589","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"sourceType":"论坛"},{"uid":"346f9bfb0c6f376e","date":"2025-11-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print no longer allows me to fill in voids","titleCn":"Creality Print 不再允许我填充空隙","originalText":"Hi forum,\nI have been successfully printing on my K1 Max for nearly a year now. But recently, Creality Print stopped allowing me to fill open voids. I can see the Sparce Infill Density, but when I increase it from 15% to anything above, like 75% it doesn’t change. The void is still hollow. Changing the patterns doesn’t help either.\nScreenshot 2025-11-12 155600\nAny idea what I’m missing here? It used to work great, then all of a sudden, one day it stopped. Thanks!\nNo one has any idea’s?\nI just tried to uninstall the most recent version and roll back to an older one and that fixed it. Seems to be something wonky in the new version with my setup.","textCn":"论坛的大家好，我在 K1 Max 上成功打印了将近一年。但最近，Creality Print 不再允许我填充开放的空隙。我能看到稀疏填充密度，但当我把它从 15% 提高到任何更高的值，比如 75%，它没有任何变化。空隙仍然是空的。更换填充模式也没有帮助。Screenshot 2025-11-12 155600 有人知道我是漏了什么吗？以前效果很好，然后突然有一天就不行了。谢谢！没人有想法吗？我刚试着卸载最新版本并回滚到旧版本，这样就解决了。看起来新版本在我的配置下有些问题。","truncated":false,"url":"https://forum.creality.com/t/creality-print-no-longer-allows-me-to-fill-in-voids/46533","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":4,"views":263,"likeCount":0,"sourceType":"论坛"},{"uid":"599c31ad46a911b1","date":"2025-11-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Using custom filament settings with CFS","titleCn":"在 CFS 上使用自定义耗材设置","originalText":"Hi!\nI am new to the Forum - maybe any of those more experienced guys can help me:\nI have a newly bought Creality K2 Pro with a CFS. I would like to use non-creality filaments for a print and managed to create a user preset for the respective filament (some kind of ABS).\nHowever, I do not manage to allocate this user preset to the respective slot of the CFS - I just find Generic and Creality presets in the CFS configuration page. And even if: How can I allocate the respective slot to my model during slicing?\nMany thanks\nSven\nDoes anyone have an idea?","textCn":"你好！我是论坛新手——也许有经验的人能帮我：我新买了一台 Creality K2 Pro，带 CFS。我想用非 Creality 的耗材打印，并成功为相应耗材（某类 ABS）创建了用户预设。但是，我无法把这个用户预设分配到 CFS 的相应槽位——我在 CFS 配置页面只找到 Generic 和 Creality 预设。而且即使能，我在切片时怎么把相应槽位分配给我的模型？ 非常感谢 Sven 有人有想法吗？","truncated":false,"url":"https://forum.creality.com/t/using-custom-filament-settings-with-cfs/46489","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"K2 Pro","grade":"有效","replyCount":2,"views":117,"likeCount":0,"sourceType":"论坛"},{"uid":"d81360ab00401613","date":"2025-11-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"LINUX for creality scan.","titleCn":"用于 Creality 扫描仪的 LINUX 系统","originalText":"STILL waiting, but my patience is wearing very thin","textCn":"还在等，但我的耐心已经快磨没了","truncated":false,"url":"https://forum.creality.com/t/linux-for-creality-scan/46473","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":239,"likeCount":1,"sourceType":"论坛"},{"uid":"526226a6727dfce7","date":"2025-11-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Slicer doesnot copy all.","titleCn":"切片软件没有复制全部内容。","originalText":"I am printing a rc plane in LW-PLA on a K1 max and now the slicer forgets the ribs so I only have the outer wing and no ribs inside. The example is good but after slicing they are gone. Any idea.\nGreating from the Netherlands, Adrian","textCn":"我在 K1 max 上用 LW-PLA 打印一架遥控飞机，现在切片软件把翼肋弄丢了，所以我只有外侧机翼，内部没有翼肋。模型本身是好的，但切片之后它们就消失了。有人知道原因吗。 来自荷兰的问候，Adrian","truncated":false,"url":"https://forum.creality.com/t/slicer-doesnot-copy-all/46479","productLine":"print","version":"","versionRaw":"","problemType":"slice","model":"K1 Max","grade":"有效","replyCount":1,"views":26,"likeCount":0,"sourceType":"论坛"},{"uid":"4318b8c5d1d389fb","date":"2025-11-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Print time estimates for Ender V3 SE in creality print","titleCn":"creality print 中 Ender V3 SE 的打印时间预估","originalText":"Since the last update, the print time estimates for the ender V3 SE seem to be off by a couple of hours, Is anyone else having this problem?","textCn":"自从上次更新后，ender V3 SE 的打印时间预估似乎差了好几个小时，还有别人有这个问题吗？","truncated":false,"url":"https://forum.creality.com/t/print-time-estimates-for-ender-v3-se-in-creality-print/46468","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Ender-3 V3 SE","grade":"有效","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"1840cf431a4d7444","date":"2025-11-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Color flushing into new objects","titleCn":"颜色冲洗到新物体中","originalText":"Hello. I am completely new to 3D Printing. I am attempting to do a 2 color Benchy. My issue is that it says I am using about 11g of filament for the item and 130g of filament for flushing. That’s ridiculous. I wouldnt really have an issue with that if it would let me do something usefull with the waste. Like instead of printing a tower… why can I print another object? Is that a possibility and I am just stupid and completely missing that option. Any help would be great\nI am new to multi-color printing as well and I’m amazed at the amount of purged filament that is wasted. I’ve been digging into the settings but I have really found a way to reduce the amount that is purged in the “poop”.\nA couple of setting you can change in the “Flush Options” section. You can flush into supports and/or into the infill.\nNeither of those address the amount of poop that is generated, if there is a way to reduce that I would love to find that setting.\n@kckndrgn\nYa I definitely should have done more research on the CFS and how it functions doing multicolor prints. I had in my mind that it would gauge how much I needs of one color and then switch on the fly. …","textCn":"你好。我完全是 3D 打印新手。我在尝试做一个双色 Benchy。我的问题是，它说这个物品我要用大约 11g 耗材，而冲洗要用 130g 耗材。这太离谱了。如果它能让我对这些废料做点有用的事，我倒也不会有太大意见。比如不是打印一个塔……为什么我不能打印另一个物体？这是不是一种可能，而我只是太笨，完全没看到那个选项。任何帮助都很好。我也是多色打印新手，我对被浪费掉的冲洗耗材量感到震惊。我一直在研究设置，但我真的找到了减少“便便”里被冲洗掉量的方法。你可以在“Flush Options”（冲洗选项）部分更改几个设置。你可以冲洗到支撑和/或冲洗到填充中。这两者都没有解决产生的便便量的问题，如果有办法减少，我很想找到那个设置。@kckndrgn。是啊，我绝对应该在 CFS 以及它如何进行多色打印方面做更多研究。我脑子里以为它会估算我某种颜色需要多少，然后动态切换。……","truncated":true,"url":"https://forum.creality.com/t/color-flushing-into-new-objects/46443","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":5,"views":1020,"likeCount":6,"sourceType":"论坛"},{"uid":"06e9b6230b208223","date":"2025-11-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print's gone MAD - thinks Printer has CFS","titleCn":"Creality Print 疯了——以为打印机有 CFS","originalText":"Issue\nI updated my pinter software (on printer). Now Creality Print thinks I have a CFS. The Filement selection only shows CFS. In “Multifilament” even with Prime Tower disabled still does not change filement CFS. Then, even going with that and slicing, then whn you export there is no option with Filement Device…and yes it says “Spool Hoder” but because the filement before sslicing was CFS it runs with “Printing will be done using Spool Holder Colors” meaning not “External Spool Holder” but CFS…\nThen when you try to go ahead it comes up with a Warning: “ The machine consumables do not match the print file. Please check and restart printing”.\nSo now i have to use my USB, like a Peasant and walk like a human to my printer!\nPlease help…what am I missing?\nslice\nsend print file\nwarning\nHi. I had exactly the same issue when I accepted an update to my K1 Max profile in Creality Print. I fixed it by uninstalling the Creality Print app and reinstalling. Hope this helps.\nDoes anyone have a solution that does not require reinstalling the printer software? I am in a school environment and can be a week or more to get IT to my room.","textCn":"问题 我更新了打印机软件（打印机上的）。现在 Creality Print 认为我有 CFS。耗材选择只显示 CFS。在「多耗材」里，即使禁用了擦料塔，仍然不会改变耗材 CFS。然后，即使这样切片，导出时也没有耗材设备的选项……是的，它写着「Spool Hoder」（料盘架），但因为切片前的耗材是 CFS，所以它按「将使用料盘架颜色进行打印」运行，意思不是「外部料盘架」而是 CFS……然后当你尝试继续时，会弹出警告：「机器耗材与打印文件不匹配。请检查并重新开始打印。」所以现在我得像平民一样用 U 盘，像普通人一样走到打印机前！请帮忙……我漏了什么？slice send print file warning 你好。我在 Creality Print 中接受 K1 Max 配置更新时遇到了完全相同的问题。我通过卸载 Creality Print 应用并重新安装解决了。希望这有帮助。有没有人有不重装打印机软件的解决办法？我在学校环境里，让 IT 到我的房间来可能要一周甚至更久。","truncated":false,"url":"https://forum.creality.com/t/creality-prints-gone-mad-thinks-printer-has-cfs/46462","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K1 Max","grade":"有效","replyCount":3,"views":316,"likeCount":0,"sourceType":"论坛"},{"uid":"c0b76db7c67e680f","date":"2025-11-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"HALOT Box is lacking Linux support","titleCn":"HALOT Box 缺少 Linux 支持","originalText":"A Linux version is available for CrealityPrint (which is fine), but not for Halot Box. Even running with wine, the printer is not detected (even if we enter the IP address manually) and it is not possible to send the print file to the printer.\nSo please, make a Linux release available for Halot Box, like you did for Creality Print (or at least a release working with Wine)\nThanks !","textCn":"CrealityPrint 有 Linux 版本（这很好），但 Halot Box 没有。即使通过 Wine 运行，也检测不到打印机（即使手动输入 IP 地址），也无法把打印文件发送到打印机。 所以请为 Halot Box 提供 Linux 版本，就像你们为 Creality Print 做的那样（或者至少提供一个能在 Wine 下运行的版本）。 谢谢！","truncated":false,"url":"https://forum.creality.com/t/halot-box-is-lacking-linux-support/46437","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":117,"likeCount":3,"sourceType":"论坛"},{"uid":"551748558d39384c","date":"2025-11-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Zoom to mouse Position not working with multiplte plates","titleCn":"多盘时缩放到鼠标位置不工作","originalText":"Hi,\nin my creality print Version 6.3.0.3420, zoom to mouse position is checked. when only 1 plate is there the zoom goes to mouse pointer perfectly, but when multiple plate is there. it cannot zoom to mouse pointer. can someone giive solution to this issue. i am using Creality print for my K1 and K1 Max printer\nThanks\nSandeep","textCn":"你好，在我的 Creality Print 6.3.0.3420 版本中，已勾选缩放到鼠标位置。当只有一个盘时，缩放会完美地跟随鼠标指针，但当有多个盘时，就无法缩放到鼠标指针。有人能给出这个问题的解决办法吗。我在用 Creality Print 配我的 K1 和 K1 Max 打印机。谢谢 Sandeep","truncated":false,"url":"https://forum.creality.com/t/zoom-to-mouse-position-not-working-with-multiplte-plates/46425","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"other","model":"K1 Max","grade":"有效","replyCount":1,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"9187121b839544e4","date":"2025-11-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print 6.3 slow speed","titleCn":"Creality Print 6.3 速度慢","originalText":"Creality print 6.3 slow speed","textCn":"Creality Print 6.3 速度慢","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-3-slow-speed/46403","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":99,"likeCount":0,"sourceType":"论坛"},{"uid":"85ec5043e6cba5d1","date":"2025-11-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Is it possible stop the little dabs of filament?","titleCn":"能不能停止那些小料点？","originalText":"Is there a way to stop the printer from adding little dabs of filament in all the super tiny holes that’s not covered by the wall or infill? I’m trying to print a carboard spool adapter that has a textured outer ring and it leaves a lot of these super tiny holes(in the slicer) that isn’t even actual holes when it prints. When it finishes the layer, it adds like 200(exaggeration) of these little blobs that’s not needed. It really hinders a large flat top layer with all the blobs everywhere. Is there a “minimum line distance” setting somewhere that I’m missing?\nEdit: I’ve tried turning “apply gap infill” to nowhere and it still does it.\nPerhaps you could provide an STL file or a 3MF file, which would enable a better understanding of your issue.","textCn":"有没有办法阻止打印机在所有没被墙或填充覆盖的极小孔洞里加上小料点？我正在打印一个硬纸板料盘适配器，它有一个带纹理的外圈，在切片软件里会留下很多这种极小的孔，打印出来根本不是真正的孔。当它完成该层时，会加上大约 200 个（夸张说法）不需要的小料点。这真的破坏了一整块大的平坦顶层，到处都是这些小料点。有没有我遗漏的“最小线段距离”设置？编辑：我试过把“应用间隙填充”设为无处，它还是会这样。也许你可以提供一个 STL 文件或 3MF 文件，这样可以更好地理解你的问题。","truncated":false,"url":"https://forum.creality.com/t/is-it-possible-stop-the-little-dabs-of-filament/46391","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":2,"views":60,"likeCount":1,"sourceType":"论坛"},{"uid":"3b2323d17e5a4683","date":"2025-11-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bug Report - The new Update - The machine consummables do not match the printed file","titleCn":"缺陷报告——新更新——机器耗材与打印文件不匹配","originalText":"Well, we are suppsosed to embrace all the new Updates. But it seems like when we do, that is when the troubles starts.\nSo I updated my Creality K1 Max with the new Update this last Tuesday 11/4/2025. And developers wonder why we hate updates? Well, that was the last time I have sent anything to my printer from my creality slicer. Ever since then, it states simply:\n“The machine consumables do not match the printed file. Please check and restart printing”\nI would love to know what that means, as I am set to print Flash Forge PLA, which I made sure to setup with the parameters that I feel would do best on the current print. I have reset the printer 5 times now, but it doesn’t seem to do much.\nI was getting this error too after the update. If you go to the Device section in Creality Print, in the lower right you can change the type of filament that it thinks the spool holder has loaded to match what you sliced your object to print with, and then you can send normally. I think there should be a way to disable this warning. It just seems silly to have to set the type of filament you are using in two different places. …","textCn":"好吧，我们本该拥抱所有新更新。但似乎当我们这样做时，麻烦就开始了。所以我在上周二 11/4/2025 用新更新升级了我的 Creality K1 Max。开发者还纳闷我们为什么讨厌更新？嗯，那是我最后一次从 Creality 切片软件向打印机发送任何东西。从那以后，它只是显示：“机器耗材与打印文件不匹配。请检查并重新开始打印”。我很想知道那是什么意思，因为我准备打印 Flash Forge PLA，我确保用了我认为最适合当前打印的参数来设置。我已经重置打印机 5 次了，但似乎没什么用。更新后我也遇到了这个错误。如果你进入 Creality Print 的设备部分，在右下角可以更改它认为料盘架已装载的耗材类型，使其与你切片对象时使用的耗材匹配，然后就可以正常发送了。我认为应该有一种方法可以禁用这个警告。必须在两个不同的地方设置你正在使用的耗材类型，这看起来很傻。……","truncated":true,"url":"https://forum.creality.com/t/bug-report-the-new-update-the-machine-consummables-do-not-match-the-printed-file/46406","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K1 Max","grade":"有效","replyCount":14,"views":2461,"likeCount":7,"sourceType":"论坛"},{"uid":"f8861d8fe683fb74","date":"2025-11-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"1st layer walls not taking 1st layer flow set points","titleCn":"首层墙线没有采用首层流量设定值","originalText":"I’m I loosing my mind or does creality print 6.3 ignore 1st layer flow set points on 1st layer walls? I’ve been trying to run a print with multiple walls on the first layer and the infill looks great or overfilled but I can see the bed between the walls on the 1st layer.","textCn":"是我疯了，还是 Creality Print 6.3 在首层墙线上忽略了首层流量设定值？我一直在尝试打印首层有多条墙线的模型，填充看起来很好、甚至有点过挤，但我在首层能看到墙线之间的热床。","truncated":false,"url":"https://forum.creality.com/t/1st-layer-walls-not-taking-1st-layer-flow-set-points/46346","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"f55e919e8591dc04","date":"2025-11-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"My Crealityapp doesn,t see my filament at the backside","titleCn":"我的 Creality app 看不到背面的耗材","originalText":"Since I have loaded the newest version of the App my Creality K1max doesn’t see my filament at the back of the printer so I cant send for printing from my computer anymore why\nAnders in Sweden","textCn":"自从我装了最新版 App，我的 Creality K1max 就看不到打印机背面的耗材了，所以我再也没法从电脑发送打印，为什么 Anders 来自瑞典","truncated":false,"url":"https://forum.creality.com/t/my-crealityapp-doesn-t-see-my-filament-at-the-backside/46340","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":39,"likeCount":0,"sourceType":"论坛"},{"uid":"6d9c835e72e3a3a0","date":"2025-11-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"creality print - fuzzy skin painting","titleCn":"creality print - 毛面皮肤绘制","originalText":"please add “fuzzy skin painting function” like in Bambu studio.\nIt’s so simple and so cool function!\nIn my projects, I’m using “fuzzy skin “ on little parts of my models with “post scripts” … its hard , and not comfortable.\nPlease… add this function\nHello @Yakov_Pavlov\nWelcome to the Creality Forum…!\nIsn’t this the function you are talking about here in Creality Print 6…???\nThat would be nice to add the “Painting” function to this…\nFuzzy\nYep , I’m talking about creality print 6 …\nHow its work in Bambu studio\nIMG_20251104_044009\nIMG_20251104_043942\nIMG_20251104_043918","textCn":"请添加像 Bambu studio 那样的“毛面皮肤绘制功能”。它既简单又酷！在我的项目中，我用“后处理脚本”在模型的小部分区域使用“毛面皮肤”……这很难，也不方便。请……添加这个功能。你好 @Yakov_Pavlov 欢迎来到 Creality 论坛……！这不就是你在 Creality Print 6 里说的那个功能吗……？？？如果能在这个功能上添加“绘制”功能就好了……Fuzzy 对，我说的就是 Creality Print 6……它在 Bambu studio 里是怎么工作的 IMG_20251104_044009 IMG_20251104_043942 IMG_20251104_043918","truncated":false,"url":"https://forum.creality.com/t/creality-print-fuzzy-skin-painting/46311","productLine":"thirdparty","version":"6","versionRaw":"6","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":1012,"likeCount":5,"sourceType":"论坛"},{"uid":"03dfc129370af402","date":"2025-11-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Autolayout with un-printable objects is broken v6.3.0","titleCn":"v6.3.0 中带不可打印对象的自动布局有问题","originalText":"If have have four or five small objects on the plate and use “A” for auto-layout all is well. If I mark one or two as not printable and use auto layout it will push some off the plate, leave the unprintable object on the plate, etc. Why? Didn’t this use to work so that unprintable objects are ignored?\nUsing Creality Print 6.3.0.3420","textCn":"如果平台上有四五个小对象，按“A”进行自动布局，一切正常。如果我把其中一两个标记为不可打印，然后使用自动布局，它会把一些对象推出平台、把不可打印的对象留在平台上等等。为什么？以前不是可以让不可打印对象被忽略吗？使用 Creality Print 6.3.0.3420","truncated":false,"url":"https://forum.creality.com/t/autolayout-with-un-printable-objects-is-broken-v6-3-0/46312","productLine":"print","version":"6.3","versionRaw":"6.3.0","problemType":"other","model":"K1","grade":"有效","replyCount":1,"views":35,"likeCount":0,"sourceType":"论坛"},{"uid":"e18a97ba172a16a1","date":"2025-11-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Falcon 2 pro s lbdev file needed","titleCn":"需要 Falcon 2 Pro S 的 lbdev 文件","originalText":"Good Day\nCan someone help me with the lbdev file for the Falcon 2 Pro S please?\nThe laser “ghost engrave” it doesn’t fire. I tried everything and the lbdev file is not on the TR I got with the machine.","textCn":"你好。有人能帮我提供 Falcon 2 Pro S 的 lbdev 文件吗？激光器“幽灵雕刻”，它不出光。我什么都试过了，随机附带的 TR 里没有 lbdev 文件。","truncated":false,"url":"https://forum.creality.com/t/falcon-2-pro-s-lbdev-file-needed/46283","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":36,"likeCount":0,"sourceType":"论坛"},{"uid":"0b0205d0d2bb9250","date":"2025-11-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Halot Sky Wifi connectivity","titleCn":"Halot Sky WiFi 连接","originalText":"Hi,\nI’ve recent got myself a Halot Sky (NOT the 2022 model, the 4k one), and for the life of me I cannot get HalotBox to see the printer, even if I type in the IP address. The printer and the windows desktop are on the same 2.4GHz wifi network, the windows machine has the local firewall disabled, and I’ve tried restarting multiple times.\nPinging the printer works, and SSH can even see it, so it’s available on the network for certain…\nThe Wifi was one of the features that I was really looking forward to…how do I get this to work.\nOh, latest versions of firmware and HalotBox (as of day of posting).\nCheers\nMatthew","textCn":"你好，我最近弄到了一台 Halot Sky（不是 2022 款，是 4K 那款），可我怎么也没法让 HalotBox 看到打印机，即使手动输入 IP 地址也不行。打印机和 Windows 台式机在同一个 2.4GHz WiFi 网络上，Windows 机器也关闭了本地防火墙，我还试过多次重启。ping 打印机是通的，SSH 甚至也能看到它，所以它肯定在网络上是可用的……WiFi 是我非常期待的功能之一……我该怎么让它工作起来。哦，固件和 HalotBox 都是最新版本（发帖当天）。此致 Matthew","truncated":false,"url":"https://forum.creality.com/t/halot-sky-wifi-connectivity/46274","productLine":"firmware","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":55,"likeCount":0,"sourceType":"论坛"},{"uid":"b88a256a0930b86b","date":"2025-10-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Important subject - Creality 6xx","titleCn":"重要话题 - Creality 6xx","originalText":"When did Creality will work on this subject ?\nHello @Begood38\nWelcome to the Creality Forum…!\nIf you have issues or suggestions with the Creality Print V6.3.0.3420 software which was released Sept 27 2025 please document and post here.\nCan you advise on how to enter start/end g-code? I can’t seem to find any documentation on it.","textCn":"Creality 什么时候才会处理这个问题？\n你好 @Begood38\n欢迎来到 Creality 论坛…！\n如果你对 2025 年 9 月 27 日发布的 Creality Print V6.3.0.3420 软件有问题或建议，请记录下来并在此发布。\n你能说明一下如何输入起始/结束 G-code 吗？我似乎找不到任何相关文档。","truncated":false,"url":"https://forum.creality.com/t/important-subject-creality-6xx/46253","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":117,"likeCount":1,"sourceType":"论坛"},{"uid":"06f311e39900dd32","date":"2025-10-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.3 background color in prepare and preview tabs on Linux","titleCn":"Creality Print 6.3 在 Linux 下准备和预览标签页的背景颜色","originalText":"Hello,\nI have latest Creality Print application installed on Linux Mint. For me prepare and preview tabs have white background color while theme is dark.\nIs there a option to change it to gray color like it looks in window version?","textCn":"你好，我在 Linux Mint 上安装了最新的 Creality Print 应用。对我来说，在深色主题下准备和预览标签页的背景却是白色的。有没有选项可以把它改成灰色，像 Windows 版本里那样？","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-3-background-color-in-prepare-and-preview-tabs-on-linux/46189","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":50,"likeCount":0,"sourceType":"论坛"},{"uid":"f37305e5b848a048","date":"2025-10-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"White Spots in Preview","titleCn":"预览中的白点","originalText":"Greetings,\nI am new to 3D printing and have been enjoying it very much! (K2 Plus!)\nI have been having this weird issue suddenly with Creality Slicer where I go to slice the model and I am seeing all sorts of white spots. I noted in the preview section that the Seams and Gap Infill are what the white spots represent. I have seen this on more than one model I am trying to print. Is this going to be a problem? Will my print be alright if I just ignore it and print anyway? Or is there a setting somewhere I am missing that will never show these spots again?\nThank you for your time!\nYour prints are going to be fine.\nIMO, gap fill not a problem. It is always a good thing on my models.\nSeems, annoying, but what ‘chga going to do? The seam is needed, and will show up as little bumps on the print. There are several seem settings to move the seams around to different places on the print. Sometimes you can position a seam where it won’t be seen. Sometimes you can position seams where they are easy to smooth off. Sometimes you just don’t care about the little bumps on the surface. Seam settings are something you have to play with to get the right match for the model you are printing. …","textCn":"问候，我是 3D 打印新手，一直非常享受！（K2 Plus！） 我在 Creality Slicer 里突然遇到这个奇怪的问题：我去切片模型时看到各种白点。我在预览区注意到，接缝和间隙填充就是这些白点所代表的。我在不止一个我想打印的模型上看到了这个。这会是个问题吗？如果我直接忽略并打印，我的打印件会没事吗？还是说有我漏掉的某个设置能让这些点再也不显示？ 感谢你的时间！ 你的打印件会没事的。 依我看，间隙填充不是问题。在我的模型上它总是好事。 看起来烦人，但你能怎么办呢？接缝是必要的，并且会在打印件上表现为小凸起。有几个接缝设置可以把接缝移到打印件上的不同位置。有时你可以把接缝放在看不见的地方。有时你可以把接缝放在容易打磨平滑的地方。有时你就是不在乎表面的小凸起。接缝设置是你必须反复试验，才能为你正在打印的模型找到合适匹配的东西。……","truncated":true,"url":"https://forum.creality.com/t/white-spots-in-preview/46179","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":302,"likeCount":0,"sourceType":"论坛"},{"uid":"d0bfaa57f6710fce","date":"2025-10-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.3 Thumbnail Advanced Options are Gone","titleCn":"Creality Print 6.3 缩略图高级选项不见了","originalText":"Hey Everyone\nI didnt get any hits on reddit so trying here. Am I missing something or is the option that used to be present in the previous versions of Creality Print for the thumbnails is gone? If you went to printer settings>Basic Information>Advanced there were options to select the size and type. Now I cant seem to find it. I have recently moved back from Orca to Creality Print. I was having issues with with several of my models with Arachne and Classic wall generation that work flawlessly in Creality Print vs Orca. But the issue is with my rooted KE…Moonraker is not liking the thumbnails and none of the previous .py modifications are working like they did before. And for giggles…I used a K2 Pro profile…recently purchased…and sent that g code to my KE. Thumbnails show up fine. Which makes sense because the K2 Pro uses moonraker and fluidd so Creality Print is creating the correct gcode.","textCn":"大家好 我在 reddit 上没人回复，所以来这里试试。是我漏掉了什么，还是以前 Creality Print 旧版本里有的缩略图选项没了？如果你进入打印机设置>基本信息>高级，那里有选择尺寸和类型的选项。现在我却找不到它了。我最近从 Orca 换回了 Creality Print。我用 Arachne 和 Classic 墙线生成时有几个模型出问题，而这些在 Creality Print 里运行完美，在 Orca 里则不然。但问题出在我已 root 的 KE 上……Moonraker 不喜欢这些缩略图，之前那些 .py 修改也都不像以前那样有效了。说来好笑……我用了一个 K2 Pro 的配置(参数配置)……最近刚买的……把那个 G-code 发到我的 KE 上。缩略图显示正常。这也说得通，因为 K2 Pro 用的是 moonraker 和 fluidd，所以 Creality Print 生成的是正确的 G-code。","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-3-thumbnail-advanced-options-are-gone/46145","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"K2 Pro","grade":"有效","replyCount":1,"views":175,"likeCount":0,"sourceType":"论坛"},{"uid":"be7b2c6d30a3a24b","date":"2025-10-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bug Report - Ironing isn't visually shown by standard when slicing, need to do a gimmick for it to show","titleCn":"缺陷报告——切片时默认不显示熨烫，需要特殊操作才能显示","originalText":"As said in the title, from the version 6.3 ownards you can only see the ironing if you visualize the model from the first layer upwards. The top layer is now by default colored as the top, red, top surface class. In all previous versions, the ironing, colored light orange, showed up as the last layer giving a visual indication of where it is being used and the toolpath. Also, you can’t see the nozzle ironing path curves when visualizing the toolhead movements in the horizontal slider in the bottom.\nSee the first attached picture, visualized from first to last layer. In all previous versions the infill was visible and colored light orange. Now, infill is missing regardless of being selected or not in the ticked boxes.\nThen, if i draw the model from the SECOND layer (second from bottop to up), the infill appears, as seen below:\nThe infill path from the toolhead also isn’t shown when visualizing the toolhead motion throughout the printing process. As seen below. I can drag it from start to finish and it doesn’t show the circular path that it should ( ironing in this model was selected as concentric. But if it is rectlinear it doesn’t matter since it doesn’t show up as well. …","textCn":"如标题所说，从 6.3 版本开始，只有从首层往上可视化模型时才能看到熨烫。顶层现在默认着色为顶部、红色、顶面类别。在所有之前的版本中，熨烫（浅橙色）会作为最后一层显示，直观地指示使用位置和刀路。此外，在底部水平滑块中可视化工具头运动时，你也看不到喷嘴熨烫路径曲线。见所附第一张图，从首层到最后一层可视化。在所有之前的版本中，填充是可见的，并着色为浅橙色。现在，无论是否在勾选框中选中，填充都缺失。然后，如果我从第二层（从底部往上第二层）绘制模型，填充就会出现，如下所示：在可视化整个打印过程中的工具头运动时，工具头的填充路径也不显示。如下所示。我可以从头拖到尾，它不显示应有的圆形路径（此模型中的熨烫被选为同心。但如果是直线式也无所谓，因为它同样不显示。……","truncated":true,"url":"https://forum.creality.com/t/bug-report-ironing-isnt-visually-shown-by-standard-when-slicing-need-to-do-a-gimmick-for-it-to-show/46142","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":91,"likeCount":0,"sourceType":"论坛"},{"uid":"d2368b0dfb3a74a9","date":"2025-10-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Small Gap","titleCn":"小缝隙","originalText":"Hey everyone,\nI’ve hit a wall trying to make Creality Print fill small triangular gaps between infill and perimeters in multicolored prints when slicing in the preview on my K2 Plus.\nI’ve already tried:\nAdjusting all line widths (walls, infill, gap infill, top/bottom)\nIncreasing infill/perimeter overlap up to 35 %\nPlaying with extrusion flow (which closes the gap but ruins dimensional accuracy)\nSearching for “Detect thin walls” and “Fill gaps” — they show up in the search box but aren’t editable anywhere in the UI\nDoes anyone know:\nWhether Creality Print actually supports true gap fill or thin-wall extrusion like OrcaSlicer/PrusaSlicer do?\nOr if there’s a hidden JSON flag or profile parameter to enable it?\nI can’t seem to make the slicer generate that missing line without brute-forcing flow rate, which I’d rather avoid.\nThanks in advance — any K1/K2 slicer gurus who’ve solved this, please chime in!\nHere before slicing:\n{\n\"accel_to_decel_factor\": \"50%\",\n\"base_id\": \"GP004\",\n\"bottom_solid_infill_flow_ratio\": \"1.05\",\n\"bottom_surface_pattern\": \"monotonicline\",\n\"brim_object_gap\": \"0.1\",\n\"brim_type\": \"no_brim\",\n\"default_jerk\": \"9\",\n\"elefant_foot_compensation\": \"0\",\n\"enable_arc_fitting\": \" …","textCn":"大家好，我在 K2 Plus 上于预览中切片多色打印时，想让 Creality Print 填充填充与轮廓之间的小三角缝隙，结果卡住了。 我已经试过： 调整所有线宽（墙线、填充、缝隙填充、顶/底层） 把填充/轮廓重叠提高到 35% 摆弄挤出流量（能闭合缝隙但破坏尺寸精度） 搜索“检测薄壁”和“填充缝隙”——它们出现在搜索框里，但在界面的任何地方都不可编辑 有人知道吗： Creality Print 是否真的像 OrcaSlicer/PrusaSlicer 那样支持真正的缝隙填充或薄壁挤出？ 或者是否有隐藏的 JSON 标记或配置(参数配置)参数可以启用它？ 我似乎无法让切片软件生成那条缺失的线，除非强行提高流量，而这是我宁愿避免的。 先谢了——任何解决过这个问题的 K1/K2 切片高手，请来说说！ 切片前是这样： {\"accel_to_decel_factor\": \"50%\", \"base_id\": \"GP004\", \"bottom_solid_infill_flow_ratio\": \"1.05\", \"bottom_surface_pattern\": \"monotonicline\", \"brim_object_gap\": \"0.1\", \"brim_type\": \"no_brim\", \"default_jerk\": \"9\", \"elefant_foot_compensation\": \"0\", \"enable_arc_fitting\": \" …","truncated":true,"url":"https://forum.creality.com/t/small-gap/46122","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":5,"views":1332,"likeCount":2,"sourceType":"论坛"},{"uid":"57979de8886d3629","date":"2025-10-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problems getting Creality to send Verify code to register Falcon A1 softwrae","titleCn":"注册 Falcon A1 软件时 Creality 无法发送验证码的问题","originalText":"Trying to register on the creality site and get a verify code. It just does not send a code!! Looked in spam and inbox…. Nothing..\nJohn","textCn":"我试着在 Creality 网站注册并获取验证码。它就是不发验证码！！我看了垃圾邮件和收件箱……什么都没有.. John","truncated":false,"url":"https://forum.creality.com/t/problems-getting-creality-to-send-verify-code-to-register-falcon-a1-softwrae/46050","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":125,"likeCount":0,"sourceType":"论坛"},{"uid":"05dd99cfbc693854","date":"2025-10-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K1 CFS Upgrade - Error CY2586","titleCn":"K1 CFS 升级 - 错误 CY2586","originalText":"Hi all,\nI putting this just in case anyone else is looking for a similar fix after upgrading their K1 to support the CFS and received error CY2586). I recently upgraded my K1 with the CFS upgrade kit and everything seemed to go okay until I tried a large print. I received Error CY2586 a couple times. I was trying to print a large print that used the K1’s entire bed width which is 220x220. It took me a little to realize where the issue was actually coming from. Ultimately, I think I have determined that the note for the upgrade kits indicates that the printing area has been decreased: “The molding size of multi-color printing will decrease by 5mm (Y-axis); K1/K1C/K1 SE is 220*215*250mm; K1 Max is 300*295*300mm”. I did know this when I moved forward, but I guess I didn’t put the dots together that the firmware/software wasn’t really addressing this in the slicer. Essentially the software doesn’t ‘know’ that the bed area has been reduced. I wish Creality built this into their software as an option. However, the fix I found was to modify the system presets in the Printer settings. I set the Excluded Bed Area to ‘0x215, 220x215, 220x220, 0x220’. …","textCn":"大家好，我写这个只是以防其他人在把 K1 升级以支持 CFS 后遇到错误 CY2586 时也在寻找类似的解决办法。我最近用 CFS 升级套件升级了我的 K1，一切似乎都还好，直到我尝试一个大打印。我收到了几次错误 CY2586。我试图打印一个使用 K1 整个热床宽度（220x220）的大打印。我花了一点时间才意识到问题究竟出在哪里。最终，我认为我确定了升级套件的说明指出打印区域已经减小：“多色打印的成型尺寸将减少 5mm（Y 轴）；K1/K1C/K1 SE 为 220*215*250mm；K1 Max 为 300*295*300mm”。我推进这件事时确实知道这一点，但我想我没有把点连起来，固件/软件在切片软件里并没有真正处理这一点。基本上，软件并不“知道”热床区域已经缩小了。我希望 Creality 能把这作为选项内置到他们的软件中。不过，我找到的解决办法是修改打印机设置中的系统预设。我把排除热床区域设为 ‘0x215, 220x215, 220x220, 0x220’。……","truncated":true,"url":"https://forum.creality.com/t/k1-cfs-upgrade-error-cy2586/46044","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K1","grade":"有效","replyCount":2,"views":436,"likeCount":3,"sourceType":"论坛"},{"uid":"025727f21bc16ce2","date":"2025-10-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Hulp nodig, mijn model wordt niet massief","titleCn":"求助，我的模型不是实心的","originalText":"Hi all, please see attached STL created with Sketchup (solid).. I would like to print itas 60% massive, but it doesn’t apply my infill settingsafter slicing. Please help…\nTC Steun.3mf (190, )\nHello @Jack_Rietbergen\nWelcome to the Creality Forum…!\nJack_Rietbergen:\nprint itas 60% massive, but it doesn’t apply my infill settingsafter slicing\nI was able to slice the file with Creality Print. Reduced size to 60%. Changed infill to different settings and it worked.\nWhy did you reduce the size?\nShould the slicer show the fill in pattern e.g. in the bottom and in the pilars between bottom and bridge?","textCn":"大家好，请看附件中用 Sketchup 创建的 STL（实体）…我想以 60% 的实心度打印它，但切片后它没有应用我的填充设置。请帮忙… TC Steun.3mf（190，） 你好 @Jack_Rietbergen 欢迎来到 Creality 论坛…！ Jack_Rietbergen： 以 60% 的实心度打印它，但切片后它没有应用我的填充设置 我用 Creality Print 成功切片了这个文件。把尺寸缩小到 60%。把填充改成不同设置后它就生效了。 你为什么把尺寸缩小？ 切片软件不应该在底部以及底部和桥接之间的立柱中显示填充图案吗？","truncated":false,"url":"https://forum.creality.com/t/hulp-nodig-mijn-model-wordt-niet-massief/45995","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":4,"views":60,"likeCount":0,"sourceType":"论坛"},{"uid":"c96c787c6ecb3a78","date":"2025-10-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Day 1 Newbie and I have a firmware problem on the Falcon A1","titleCn":"第一天新手，我的 Falcon A1 有固件问题","originalText":"So basically, set it up and plugged in. Ran the test cut and the design space asked me to update the firmware. I select ok and the machine beeps a few times then theres a slow flashing start button on the machine. Thats it nothing happens and the Update screen doesnt go past 0%.\nIve left it on here trying for over 30 mins now and nothing has changed. I thought maybe I could try the manual update with a USB but when I go here Firmware there is no Firmware for my A1 model.\nWhat am I doing wrong? what can I do? I just seem to be going around in circles\nHere’s the official link for all Creality laser engraver firmwares:\nCreality Laser Engraving Machine Firmware Download | Creality Firmwares\nThe Creality laser engraving machine is designed for personal use, offering engraving and cutting capabilities on a variety of materials, making it ideal for engineers, designers, and DIY enthusiasts.\nThe other link you’ll find useful for updating the firmware on the Falcon A1 is this page from the wiki:\nCreality Wiki\nFalcon A1 Mainboard Firmware Update Guide\nThe guide offers two different ways to attempt the firmware update - first is using a USB stick, and the second is through the Falcon Design S …","textCn":"基本上，装好并插上电。运行了测试切割，设计空间提示我更新固件。我选择确定，机器响了几声，然后机器上的启动按钮开始缓慢闪烁。就这样，什么也没发生，更新屏幕不超过 0%。我把它放在这里试了 30 多分钟，什么也没变。我想也许可以试试用 USB 手动更新，但当我到这里 固件 时，没有我 A1 型号的固件。我做错了什么？我能做什么？我似乎只是在原地打转。这是所有 Creality 激光雕刻机固件的官方链接：Creality Laser Engraving Machine Firmware Download | Creality Firmwares。Creality 激光雕刻机是为个人使用而设计的，可在各种材料上提供雕刻和切割能力，非常适合工程师、设计师和 DIY 爱好者。另一个对更新 Falcon A1 固件有用的链接是 wiki 上的这个页面：Creality Wiki Falcon A1 主板固件更新指南。该指南提供了两种尝试固件更新的不同方式——第一种是使用 U 盘，第二种是通过 Falcon Design S……","truncated":true,"url":"https://forum.creality.com/t/day-1-newbie-and-i-have-a-firmware-problem-on-the-falcon-a1/45901","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":7,"views":615,"likeCount":1,"sourceType":"论坛"},{"uid":"ec8b5e65b8f95ebc","date":"2025-10-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"centering build plate in Creality print","titleCn":"在 Creality Print 中把热床居中","originalText":"I’m new at this and when I open a model to paint or print the build plate seems to locate at random on the screen. How can I center it so I can enlarge the image for painting? Thanks.\nHello ! Have you tried to right click on it and then “Organize” ? It should center the model","textCn":"我是新手，当我打开一个模型要上色或打印时，热床在屏幕上似乎是随机定位的。我要怎么把它居中，好让我放大图像来上色？谢谢。 你好！你有没有试过右键点击它，然后选“整理”（Organize）？它应该会把模型居中","truncated":false,"url":"https://forum.creality.com/t/centering-build-plate-in-creality-print/45887","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":471,"likeCount":0,"sourceType":"论坛"},{"uid":"3494c3ebbe0cdf1f","date":"2025-10-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Sonic Pad","titleCn":"Creality Sonic Pad","originalText":"I haven’t used this in a while but worked last time. Has an x-number of printers connected directly via wifi and 2 sonic pads with printers connected. These 2 sonic pads do not appear in either the app or under the workbench on creality’s page. In the app when I start them it shows that I have more printers but nothing more.\nthx in advance\nAnders\nIMG_9950\nAny one have a ide ?","textCn":"我有一阵子没用这个了，但上次是好用的。有若干个打印机通过 wifi 直接连接，还有 2 个 Sonic Pad 连接着打印机。这 2 个 Sonic Pad 在应用里和 creality 页面的 workbench 下都不显示。在应用里当我启动它们时，它显示我有更多打印机，但也就仅此而已。先谢谢了。Anders IMG_9950 有人有想法吗？","truncated":false,"url":"https://forum.creality.com/t/creality-sonic-pad/45864","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":61,"likeCount":0,"sourceType":"论坛"},{"uid":"1e42df3e5e0e6d67","date":"2025-10-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Trouble using non-Creality (non-RFID) filament","titleCn":"使用非 Creality（无 RFID）耗材的麻烦","originalText":"I can’t seem to print apparently because I’m trying to use a non-Creality filament, Matterhackers NylonG.\nFirst, can someone help me set up this filament in my CFS correctly. There does not appear to be a way to create a new filament name and setting. At present, I have just selected PETG-CR as it’s nozzle and bed temps are closest to what I need. Matterhackers recommends 255/65 for this NylonG filament.\nSecond, when i try to print, the CFS display tells me that “Filaments marked with “…” require manual selection of a CFS slot.” But it will not let me select the #2 slot where the filament is located. I suspect this is because the first issue above needs to be addressed first.\nHELP!!! Thanks in advance!\nJohn\nI find this to be a quite helpful and responsive forum. We are scattered all over the world. Your 6pm may be my 6am, and I I don’t look a the forum EVERY day it might take more than as day to get a response. everyone is in that situation, adjust your expectations accordingly.\nI see several things you are doing wrong and have more questions to try and help, but I’m not helping after your second comment…, sad… for you not me!","textCn":"我似乎打印不了，因为我在尝试使用非 Creality 的耗材，Matterhackers NylonG。首先，有人能帮我在我的 CFS 里正确设置这种耗材吗。似乎没有办法新建耗材名称和设置。目前我只是选了 PETG-CR，因为它的喷嘴和热床温度最接近我需要的。Matterhackers 建议这种 NylonG 耗材用 255/65。其次，当我尝试打印时，CFS 显示屏告诉我“标有“…”的耗材需要手动选择 CFS 槽位。”但它不让我选择耗材所在的 #2 槽位。我怀疑是因为上面的第一个问题需要先解决。求助！！！提前感谢！John。我觉得这是个很有帮助、响应很快的论坛。我们分散在世界各地。你的下午 6 点可能是我的早上 6 点，如果我不是每天都看论坛，可能要超过一天才能得到回复。每个人都处于这种情况，相应调整你的期望吧。我看出你有几处做错了，也还有更多问题想问来帮忙，但在你第二条评论之后我就不帮了……可悲……对你来说，不是我！","truncated":false,"url":"https://forum.creality.com/t/trouble-using-non-creality-non-rfid-filament/45858","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":157,"likeCount":0,"sourceType":"论坛"},{"uid":"5d7030d44fc0a2d2","date":"2025-10-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"creality print profile ender 3 v3 ke","titleCn":"creality print 的 ender 3 v3 ke 配置","originalText":"I have a problem: my printer started performing poorly and now takes about 30 minutes for a Benchy. I also lost all my settings. Can anyone find a profile file for me or create one with the best settings for my printer? I use Creality Slicer for fast printing and good quality. I would like something I can add to the slicer as a file that changes the settings it also does not stikking to the print board and the 1 layer is really bad","textCn":"我有个问题：我的打印机开始表现很差，现在打一个 Benchy 要大约 30 分钟。我还丢失了所有设置。有人能帮我找一个配置文件，或者为我的打印机做一份最佳设置吗？我用 Creality Slicer 来快速打印并获得好质量。我想要一个能作为文件添加到切片软件里、修改设置的东西。它还不粘热床，首层非常糟","truncated":false,"url":"https://forum.creality.com/t/creality-print-profile-ender-3-v3-ke/45840","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":1,"views":131,"likeCount":0,"sourceType":"论坛"},{"uid":"a5e67186c713312b","date":"2025-10-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problem when slicing","titleCn":"切片时的问题","originalText":"Screenshot 2025-10-11 154447\nScreenshot 2025-10-11 154456\nSo when i slice my bulldog, it turns out different with some holes! pls help!\nHello !\nCan you try to right click on the object and then click on “repair” ?","textCn":"Screenshot 2025-10-11 154447 Screenshot 2025-10-11 154456 所以当我切片我的斗牛犬时，结果不一样，出现了一些孔洞！请帮忙！你好！你能试着右键点击对象，然后点击“修复”吗？","truncated":false,"url":"https://forum.creality.com/t/problem-when-slicing/45831","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":53,"likeCount":0,"sourceType":"论坛"},{"uid":"7d263d0c99bf9115","date":"2025-10-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"STL will not slice unless Wall Generator property is changed","titleCn":"除非更改墙生成器属性，否则 STL 无法切片","originalText":"I created a button with text on it using FreeCAD and the STL shows fine in WIndows 3D viewer and I even uploaded to STL to a few sites to check for issues and they all said the STL is OK.\nWhen I place the STL in CP version 6.3.0.3420, it looks OK:\n001\nI then render the object and it comes out looking like this:\n002\nI loaded the STL into CP version 5.1.7.10514 and when rendered it looks OK. So there is a difference between how 6.x slices a model and how 5.x does it, and it seems to be not as good.\nI found that in CP version 6.3.0.3420, if I change the Wall Generator property from Classic to Arachne, the model renders correctly.\nJust thought I’d let everyone know what I found in case someone has the exact same issue.\nSTL attached.\nBody_Text_Insert (Meshed)001.stl ( )","textCn":"我用 FreeCAD 创建了一个带文字的按钮，STL 在 Windows 3D 查看器中显示正常，我甚至把 STL 上传到几个网站检查问题，他们都说 STL 没问题。当我把 STL 放进 CP 6.3.0.3420 版本时，看起来正常：001。然后我渲染对象，结果看起来是这样的：002。我把 STL 加载到 CP 5.1.7.10514 版本，渲染时看起来正常。所以 6.x 切片模型的方式和 5.x 有差异，而且似乎不如以前好。我发现，在 CP 6.3.0.3420 版本中，如果我把墙生成器属性从 Classic 改为 Arachne，模型就能正确渲染。只是想让大家知道我的发现，以防有人遇到完全相同的问题。附上 STL。Body_Text_Insert (Meshed)001.stl ( )","truncated":false,"url":"https://forum.creality.com/t/stl-will-not-slice-unless-wall-generator-property-is-changed/45786","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":56,"likeCount":1,"sourceType":"论坛"},{"uid":"0376a8239599a27b","date":"2025-10-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Settings for Hyper PETG in K1C/Software","titleCn":"K1C/软件中 Hyper PETG 的设置","originalText":"Where do I change the print settings for this material? I am fairly new and not finding the right area to change the parameters. Is there a “profile” that some call it that can be installed?\nDo hot end and other temp settings controlled by the printer or by the software?\nThank you\nHello !\nClick on Generic Pla then Generic PETG => Everything will be changed accordingly (temp, speed, cooling..etc)\nIf you don’t see it, click on the small gear and check everything !","textCn":"我在哪里修改这种材料的打印设置？我比较新手，找不到修改参数的正确位置。有没有可以安装的所谓“配置”？热端和其他温度设置是由打印机控制还是由软件控制？谢谢。你好！点击 Generic Pla，然后点击 Generic PETG => 所有内容都会相应改变（温度、速度、冷却等）。如果你看不到它，点击小齿轮并检查所有内容！","truncated":false,"url":"https://forum.creality.com/t/settings-for-hyper-petg-in-k1c-software/45780","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":158,"likeCount":0,"sourceType":"论坛"},{"uid":"b6ab750bd43d2cd9","date":"2025-10-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Surface attribute modifier","titleCn":"表面属性修改器","originalText":"I’m trying to modify one face of my model to increase the wall count from 2 to 4. The model is basically a 15 mm thick arc. The ends are square so there are 4 sides, a top, and bottom. I only want the 4 walls on the front face surface.\nI tried using the modifier with a cube. It modifies the line count to four, but also puts a wall through the model where the back of the modifier cuts through the model. If I make the modifier deeper, off the back of the model, I get the same as a 4 wall global setting. I then tried using a torus shaped modifier with the same result. Its not modifying just the model, it is adding additional structure inside the model.\nIs there any way to select a surface to modify?\nThanks","textCn":"我想修改模型的一个面，把墙层数从 2 增加到 4。这个模型基本上是一个 15 mm 厚的弧形。两端是方的，所以有 4 个侧面、一个顶面和一个底面。我只想在前表面上有 4 层墙。我试过用一个立方体作为修改器。它把线数改成四，但在修改器背面穿过模型的地方，也在模型内部加了一道墙。如果我把修改器做得更深、超出模型背面，结果就和全局设置 4 层墙一样。然后我试了环形修改器，结果相同。它不只是修改模型，而是在模型内部增加了额外结构。有什么办法可以选择一个表面进行修改吗？谢谢","truncated":false,"url":"https://forum.creality.com/t/surface-attribute-modifier/45759","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":53,"likeCount":0,"sourceType":"论坛"},{"uid":"3be4433355ce0d4b","date":"2025-10-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Placing a statue on a base","titleCn":"把雕像放在底座上","originalText":"Is there a way to “float” an stl file off the plate? I have an stl of a statue, and I want to place it on a base which is another stl file. I have created the base separately and I want the statue to start printing on the top of the base. So, if the base is 10mm thick, I want to move the statue off the plate by 10 mm so the feet are on the base, not buried 10mm deep?\nAssemble both parts (right click then assemble) and then move up the statue by 10mm\nHow do I isolate the statue and only move it up. I Assembled the 2 parts, and they became 1. When I move it up, both go up, then snap back.","textCn":"有没有办法让 STL 文件“悬浮”离开平台？我有一个雕像的 STL，我想把它放在另一个 STL 文件做的底座上。我单独建好了底座，我希望雕像从底座顶部开始打印。所以，如果底座厚 10mm，我就想把雕像从平台向上移动 10 mm，让脚落在底座上，而不是埋进去 10mm 深？\n把两个部件装配起来（右键然后装配），然后把雕像向上移动 10mm\n我怎么才能单独选中雕像并只把它向上移动。我把 2 个部件装配了，它们变成了 1 个。我一移动，两个就一起上去，然后又弹回来。","truncated":false,"url":"https://forum.creality.com/t/placing-a-statue-on-a-base/45766","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":289,"likeCount":0,"sourceType":"论坛"},{"uid":"bde079b9450f8d6c","date":"2025-10-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality 3D Scan Administration Pop Up for each login","titleCn":"Creality 3D Scan 每次登录都会弹出管理提示","originalText":"How do I get past this pop-up in order to use the scanner?","textCn":"我要怎样才能跳过这个弹窗，以便使用扫描仪？","truncated":false,"url":"https://forum.creality.com/t/creality-3d-scan-administration-pop-up-for-each-login/45754","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":29,"likeCount":0,"sourceType":"论坛"},{"uid":"8e5e532a84e85379","date":"2025-10-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Cloud Down","titleCn":"Creality Cloud 宕机","originalText":"This has been happening since about 9:30 AM (GMT +8).\nThe status of the box quickly jumps between ‘Disconnected’ and ‘Online’. In the past hour or so, it has flipped at least 10 times.\nMost times, the status of the Creality Box shows ‘Offline’ even though my WiFi is working perfect.\nPrinter: Ender 3 S1 Plus\nBox: Creality Box 2.0","textCn":"这种情况从大约上午 9:30（GMT +8）开始出现。 盒子的状态在“已断开”和“在线”之间快速跳变。在过去一个小时左右，它至少翻转了 10 次。 大多数时候，Creality Box 的状态显示为“离线”，尽管我的 WiFi 工作完全正常。 打印机：Ender 3 S1 Plus 盒子：Creality Box 2.0","truncated":false,"url":"https://forum.creality.com/t/creality-cloud-down/45726","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":72,"likeCount":0,"sourceType":"论坛"},{"uid":"4a0897725b2761fa","date":"2025-10-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"New 3d printer older mac OS - Monterey 12.7.6","titleCn":"新 3D 打印机搭配较旧的 mac OS——Monterey 12.7.6","originalText":"Hello,\nI have an Ender 3 V3 SE. I also have an older MAC that is running Monterey 12.7.6. This is the highest version OS I can get with this older laptop. Can you direct me to the correct version of Creality Prints that will work with Monterey 12.7.6?","textCn":"你好，我有一台 Ender 3 V3 SE。我还有一台较旧的 MAC，运行 Monterey 12.7.6。这是这台旧笔记本能获得的最高系统版本。你能告诉我在 Monterey 12.7.6 上能正常工作的正确 Creality Print 版本吗？","truncated":false,"url":"https://forum.creality.com/t/new-3d-printer-older-mac-os-monterey-12-7-6/45731","productLine":"print","version":"12.7","versionRaw":"12.7.6","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":1,"views":170,"likeCount":0,"sourceType":"论坛"},{"uid":"2e0d8e33571b9160","date":"2025-10-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.3.0.3420 - Filament Section","titleCn":"Creality Print 6.3.0.3420 - 耗材部分","originalText":"Bit of an odd one. I’m currently running an Ender 3 v3 KE and Creality Print 6.3 (as per title). Now, I also have an Anycubic Kobra 3 combo and for some reason, when I sync the Anycubic slicer with the ACE PRO, it also changes the filament settings on Creality Print. Sometimes it does it every time, other times its random but it ALWAYS does it when I upgrade the Creality Print software to the latest version. It only changes the colors as I’ve not set up the Anycubic filament in Creality Print. I’ve previously set up all the colors and filament types I use in this printer, only for it to revert to whatever I’m using in the Anycubic ACE PRO. Has anyone else seen this?","textCn":"有点奇怪。我目前运行的是 Ender 3 v3 KE 和 Creality Print 6.3（如标题所示）。现在，我还有一台 Anycubic Kobra 3 combo，不知为何，当我将 Anycubic 切片软件与 ACE PRO 同步时，它也会更改 Creality Print 上的耗材设置。有时每次都会这样，有时是随机的，但当我将 Creality Print 软件升级到最新版本时，它总是会这样。它只更改颜色，因为我没有在 Creality Print 中设置 Anycubic 耗材。我之前已经在这台打印机上设置了我使用的所有颜色和耗材类型，结果它却恢复成我在 Anycubic ACE PRO 中使用的内容。还有其他人见过这种情况吗？","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-3-0-3420-filament-section/45632","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":156,"likeCount":0,"sourceType":"论坛"},{"uid":"2f9513bc14356a85","date":"2025-10-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"temp by nozzle flow?","titleCn":"温度随喷嘴流量变化？","originalText":"I upgraded to 6.3.3240 and I noticed on the preview screen, print temperatures appear to correspond only with the scaler setting for temperature. Each layer is not getting the temperature set by the calculated flow in the preview. The Check box is selected and I have “[[0.0,250],[10.0,259],[40.0,275]]” inserted for the graph.\nWhat am I missing?\nNeeded to make a new profile. Something about importing to the new version didn’t work. After setting up a new profile, auto temp by layer works.\n; f
