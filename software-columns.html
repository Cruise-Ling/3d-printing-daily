:"2026-05-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Cannot print my uploaded models, only ones direct print from \"explore\"","titleCn":"无法打印我上传的模型，只能直接打印来自“探索”的模型","originalText":"Hello!\nIf I slice some of my uploaded models and send to print, it shows the “creality heart” as if loading or sending to the printer but then nothing happens. It’s as if it times out and won’t send at all. Some of these are models i’ve printed before but removed from my local files.\nBut if I tap the “explore” button, and hit the “One-Click Printing” button, it sends to printer, no problem and prints just fine.\nI have my own designs I would like to print rather for my business…any ideas on how I can get this back up and running?\nCreality is so frustrating to work with\nTIA\nWhich printer is this exactly? As you posted it in the software category not in a printer sub forum. And where do you try to upload it from? Creality Print 7?","textCn":"你好！如果我切片我上传的一些模型并发送打印，它会显示“Creality 心形”好像在加载或发送到打印机，但之后什么也没发生。就好像它超时了，根本不会发送。其中一些模型我以前打印过，但已从我的本地文件中删除。但如果我点击“探索”按钮，然后点击“一键打印”按钮，它就会发送到打印机，没有问题，并且打印得很好。我有自己的设计想为我的生意打印…有什么办法能让我恢复这个功能吗？与 Creality 打交道真是太令人沮丧了 提前感谢 这具体是哪台打印机？因为你把它发在软件类别而不是打印机子论坛。还有你尝试从哪里上传？Creality Print 7？","truncated":false,"url":"https://forum.creality.com/t/cannot-print-my-uploaded-models-only-ones-direct-print-from-explore/51381","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"74a7299e850a9776","date":"2026-05-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Support transition layers","titleCn":"支撑过渡层","originalText":"What is support transition layers in CP7.1.1 and why it prints with speed from external bridge setting? It’s looks like just another few support interface layers but with different speed settings in some reason took from external bridge setting. I tried to find some settings of support transition throu search but nothing there.\nCan I somehow disable it? There is no any support transition layers in Orca.\nThe more i use CP the more i want to move to Orca. The two reason I still didn’t are my laziness is to transfer the print profile(what is soon will be not actual because one man doing it now) and not working camera in fluidd even with root and K2 camera script installed.\nAs long as you print CP models of cats from PLA on the default profiles, everything is fine, but once you start trying to improve the print quality or use something other than PLA or print more complex models, the headache begins. Either there are no necessary settings that are available in the Orca, or the slicer somehow strangely builds a path. I’m tired of this. …","textCn":"CP7.1.1 里的支撑过渡层是什么，为什么它打印时用的是外部桥接设置里的速度？它看起来只是另外几层支撑接触面，但出于某种原因采用了来自外部桥接设置的不同速度参数。我试着通过搜索找支撑过渡的一些设置，但那里什么都没有。我能以某种方式禁用它吗？Orca 里没有任何支撑过渡层。我用 CP 越多就越想转到 Orca。我还没转的两个原因，一是我懒得转移打印配置(参数配置)（而这很快就不实际了，因为现在有一个人在做了），二是 fluidd 里的摄像头不能用，即使已 root 并安装了 K2 摄像头脚本。只要你用默认配置打印 CP 的 PLA 猫模型，一切都没问题，但一旦你开始想改善打印质量，或者用 PLA 以外的东西，或者打印更复杂的模型，头疼就开始了。要么是 Orca 里有的必要设置它没有，要么是切片软件不知怎么奇怪地生成路径。我受够了。……","truncated":true,"url":"https://forum.creality.com/t/support-transition-layers/51374","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"K2","grade":"有效","replyCount":1,"views":32,"likeCount":0,"sourceType":"论坛"},{"uid":"9207cd3d340d234b","date":"2026-05-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Finding firm ware for Ender 3","titleCn":"寻找 Ender 3 的固件","originalText":"I have an Ender 3, no BL Touch, just plain Ender 3. Just put in new 4.2.7 silent board, looking for firm ware v4.2.7 and v1.1.0.57, these are in my other Ender 3 and it works great. I have gone to the Creality Cloud but my Ender 3 is not listed, I guess they took it off since they don’t sell it any more. So I can’t seem to find the firm ware. Any help would be greatly appreciated, I need my other machine running. I have the same board in my other machine.\nBest place I know for older printer firmware is a facebook group - (1) Nic’s 3D Printer Support & Firmware | Facebook\nEnder Series Firmware Download | Creality 3D Printer Firmwares\nFind all Creality firmware downloads for your Ender Series 3D printers, including ender 3, ender 3 pro, and ender 3 s1, etc. Update your printer with the latest firmware for optimal performance.","textCn":"我有一台 Ender 3，没有 BL Touch，就是普通的 Ender 3。刚换上新的 4.2.7 静音主板，在找 v4.2.7 和 v1.1.0.57 的固件，这些在我另一台 Ender 3 上，运行得很好。我去过 Creality Cloud，但我的 Ender 3 没有列出来，我猜因为他们不再卖它了，所以把它撤下来了。所以我似乎找不到固件。任何帮助都非常感谢，我需要让另一台机器跑起来。我另一台机器上也是同样的主板。 我知道找老打印机固件最好的地方是一个 Facebook 群组 - (1) Nic's 3D Printer Support & Firmware | Facebook Ender 系列固件下载 | Creality 3D 打印机固件 找到适用于你的 Ender 系列 3D 打印机的所有 Creality 固件下载，包括 ender 3、ender 3 pro 和 ender 3 s1 等。用最新固件更新你的打印机以获得最佳性能。","truncated":false,"url":"https://forum.creality.com/t/finding-firm-ware-for-ender-3/51318","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":127,"likeCount":0,"sourceType":"论坛"},{"uid":"71c3b50897217f47","date":"2026-05-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"pausing for filament change","titleCn":"暂停以更换耗材","originalText":"Hi All,\nI’m new here and I very much doubt I’m not alone in requesting this feature but I’m really surprised that there is no tick box in the multifilament tab for pausing to change colours.\nI understand you can insert a pause by going thorugh the preview layers. But this is a cumbersome method if you have already set up multiple filaments in the prepare section.\nApologies if someone has already requested this or I’m missing somehting. I had a search and couldn’t see anyone else requesting this.\nSe não tiver o CFS, por exemplo, a troca do filamento deverá ser manual mesmo\nWill be not «easy solution» because the pause is already implemented on the preview.\nthe slicer can handle color change on CFS setups but on monofilament printers that is the only way.","textCn":"大家好，我是新来的，我很怀疑我不是唯一一个要求这个功能的人，但我真的很惊讶，多耗材选项卡里居然没有用于暂停换色的复选框。我知道可以通过浏览预览层来插入暂停。但如果你已经在准备区域设置好了多个耗材，这种方法就很笨拙。如果已经有人提过这个请求，或者是我漏掉了什么，我很抱歉。我搜过，没看到别人提过这个请求。Se não tiver o CFS, por exemplo, a troca do filamento deverá ser manual mesmo。这不会是一个“简单的解决方案”，因为暂停已经在预览里实现了。切片软件可以在 CFS 配置下处理换色，但在单耗材打印机上，那是唯一的方法。","truncated":false,"url":"https://forum.creality.com/t/pausing-for-filament-change/51334","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"Ender-3 V3 SE","grade":"有效","replyCount":9,"views":267,"likeCount":9,"sourceType":"论坛"},{"uid":"3965f116cc919f1c","date":"2026-05-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"DE","title":"Vers. 7.1.1.442 aktuelles .stl Objekt löschen und neues anwählen","titleCn":"版本 7.1.1.442 删除当前的 .stl 对象并选择新的","originalText":"Guten Tag, ich verwende Creality Print Vers. 7.1.1.442 und einen Sparkxi7. Habe damit schon einiges gedruckt und bin recht zufrieden.Ich verwende fast nur selbst entwickelte .stl Files (vorher mit OpenScad erstellt). Nun kann es sein, dass ich ein falsches .stl File in den Creality Print geladen habe oder aber ich will noch ein anderes File slicen und drucken. wie kann man ein geladenes File herauslöschen ? Danke für jede Info.\nGruß aus Salzburg","textCn":"您好，我使用的是 Creality Print 7.1.1.442 版本和一台 Sparkxi7。用它已经打印了不少东西，相当满意。我几乎只用自己开发的 .stl 文件（之前用 OpenScad 创建）。现在可能是我把一个错误的 .stl 文件加载进了 Creality Print，或者我还想切片并打印另一个文件。怎样才能删除一个已加载的文件？感谢任何信息。 来自萨尔茨堡的问候","truncated":false,"url":"https://forum.creality.com/t/vers-7-1-1-442-aktuelles-stl-objekt-loschen-und-neues-anwahlen/51342","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"","model":"SPARKX i7","grade":"泛讨论","replyCount":1,"views":27,"likeCount":0,"sourceType":"论坛"},{"uid":"57e7784e36949e5f","date":"2026-05-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Filament purging takes place next to the recovery cup.","titleCn":"耗材排废发生在回收杯旁边。","originalText":"Hello word,\nWhy my filament purging is on bed , not in cup ?\nRegards\nIMG_1848\nHi!\nThis is weird. Is it happening with every print? Have you tried to run full printer calibration?\nBest regards\nI have done calibration before. but many problem with this printer …….","textCn":"你好， 为什么我的耗材排废是在热床上，而不是在杯子里？ 此致 IMG_1848 你好！ 这很奇怪。每次打印都会这样吗？你试过运行完整的打印机校准吗？ 此致 我之前做过校准。但这台打印机问题很多……","truncated":false,"url":"https://forum.creality.com/t/filament-purging-takes-place-next-to-the-recovery-cup/51253","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":41,"likeCount":0,"sourceType":"论坛"},{"uid":"c0faf09a0b6e54a4","date":"2026-05-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Pixel Plaque","titleCn":"Creality 像素牌匾","originalText":"Designed a Creality pixel plaque with 3 different print methods.\nIf you have 2 or more cfs just load your colors and print.\n.If you only have one CFS unit, follow this trick to avoid using a “Pause” command:\nSetup: Map your Base and Legs/Arms to the same filament slot in your slicer.\nFirst Phase: Load your Base Color (e.g., Blue) into that slot and start the print.\nThe Swap: After Layer 16 (approximately 2 hours in), once the base is finished, simply perform a “Hot Swap” by pulling the Base Color out of the CFS and loading your Leg/Arm Color (e.g., Gray) into the same slot.\nResult: No pause is required, and the printer will continue with the new color for the remaining detail!\neach part can be printed by them self and then glued to the base plate. The baseplate is recessed so you can easliy align the parts. each pixel is single so you it will take you some time to assemble, great rain day project.\nChatGPT Image May 12, 2026, 02_23_38 PM 3D Printer Files | 3MF File | Creality Pixel Plaque - High Detail Display Piece | Creality Cloud","textCn":"设计了一个 Creality 像素牌匾，有三种不同的打印方式。如果你有两个或更多 CFS，只需装入你的颜色然后打印。如果你只有一个 CFS 单元，请按这个技巧避免使用“暂停”指令： 设置：在切片软件中把底座和腿/臂映射到同一个耗材槽位。 第一阶段：把底座颜色（例如蓝色）装入该槽位并开始打印。 换料：在第 16 层之后（大约打印 2 小时），底座完成后，只需执行一次“热换料”，把底座颜色从 CFS 中抽出，把腿/臂颜色（例如灰色）装入同一个槽位。 结果：不需要暂停，打印机会用新颜色继续打印剩余的细节！ 每个部件都可以单独打印，然后粘到底板上。底板是凹陷的，所以你可以轻松对齐部件。每个像素都是单独的，所以组装会花你一些时间，是很好的雨天项目。 ChatGPT Image May 12, 2026, 02_23_38 PM 3D 打印机文件 | 3MF 文件 | Creality Pixel Plaque - High Detail Display Piece | Creality Cloud","truncated":false,"url":"https://forum.creality.com/t/creality-pixel-plaque/51180","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"SPARKX i7","grade":"泛讨论","replyCount":1,"views":45,"likeCount":1,"sourceType":"论坛"},{"uid":"ada72ebbfeef09d4","date":"2026-05-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"The green links are unreadable, please change their color.","titleCn":"绿色链接无法阅读，请更改它们的颜色。","originalText":"On Creality print Mac the links that show up in green are unreadable. Please change that color.\nCapture d’écran 2026-05-11 à 10.50.50\nIf you see the message you know there is a link to click on… green seems to be Creality favourite color\nYou could try a dark background…\nIt’s very clear when the background is black or in dark mode","textCn":"在 Creality Print Mac 版上，以绿色显示的链接无法阅读。请改一下那个颜色。如果你看到这条消息，你就知道有一个可以点击的链接……绿色似乎是 Creality 最喜欢的颜色。你可以试试深色背景……当背景是黑色或处于深色模式时，就非常清楚了。","truncated":false,"url":"https://forum.creality.com/t/the-green-links-are-unreadable-please-change-their-color/51116","productLine":"print","version":"10.50","versionRaw":"10.50.50","problemType":"ui","model":"未标注","grade":"有效","replyCount":6,"views":48,"likeCount":1,"sourceType":"论坛"},{"uid":"59d59581bada20d4","date":"2026-05-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"Missing Network Tab","titleCn":"缺少网络选项卡","originalText":"I just got my first K1C setup, but it does not have a Network tab. From other topics it seems it is running a “service” firmware, whatever that is? I tried updating the firmware using the standard ways, but the printer’s OS doesnt recognize the new firmware.\nis a second hand printer?\nalso you can contact directly creality support using any of this methods:\nCustomer Service Updated News and Announcement\nWHATSAPP\n+86 19007569370\n+86 19925217817\nWorking time:\n09:00-18:00 UTC+8\nTOLL FREE\n:telephone:US: 1 833 513 5012\n:telephone:Brazil: 0800 892 4077\n:alarm_clock:Working time:\n09:00-21:00 UTC+8 (Weekdays)\n09:00-18:00 UTC+8 (Non-working days)\n:telephone_receiver:TELEPHONE\n+86 755 3396 5666\nWorking time:\n:alarm_clock:09:00-21:00 UTC+8 (Weekdays)\n:alarm_clock:09:00-18:00 UTC+8 (Non-working days)\n:envelope:EMAIL\nAfter-…\nEnglish: Hey, I found the solution and I want to leave a record here because it’s tricky.\nThe Problem: Many K1C units sold in Brazil come with Wi-Fi disabled by default. To enable it, you MUST update the firmware using the correct file for the new 2025 hardware.\nThe Solution:\nGo to the Creality Cloud Download Page .\nCRITICAL: Check your mainboard model. …","textCn":"我刚装好我的第一台 K1C，但它没有网络选项卡。从其他主题来看，它似乎运行的是“服务”固件，不管那是什么？我试过用标准方法更新固件，但打印机的操作系统识别不了新固件。是二手机吗？你也可以通过以下任一方式直接联系 creality 支持：客户服务 更新后的新闻和公告 WHATSAPP +86 19007569370 +86 19925217817 工作时间：09:00-18:00 UTC+8 免费电话：US：1 833 513 5012 Brazil：0800 892 4077 工作时间：09:00-21:00 UTC+8（工作日）09:00-18:00 UTC+8（非工作日）电话 +86 755 3396 5666 工作时间：09:00-21:00 UTC+8（工作日）09:00-18:00 UTC+8（非工作日）电子邮件 After-… 英文：嘿，我找到了解决办法，我想在这里留个记录，因为这很棘手。问题：在巴西销售的许多 K1C 机器默认禁用 Wi-Fi。要启用它，你必须使用适用于 2025 年新硬件的正确文件来更新固件。解决办法：前往 Creality Cloud 下载页面。关键：检查你的主板型号。……","truncated":true,"url":"https://forum.creality.com/t/missing-network-tab/51125","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"K1C","grade":"有效","replyCount":3,"views":132,"likeCount":2,"sourceType":"论坛"},{"uid":"8bfcff61ee74324f","date":"2026-05-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Filler and filament changing / setting?","titleCn":"填充料和耗材更换／设置？","originalText":"Filler and filament changing / setting?","textCn":"填充料和耗材更换／设置？","truncated":false,"url":"https://forum.creality.com/t/filler-and-filament-changing-setting/51109","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":11,"views":125,"likeCount":5,"sourceType":"论坛"},{"uid":"370427631c8b7d2e","date":"2026-05-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 3 v3 plus extrusion problems","titleCn":"Ender 3 v3 plus 挤出问题","originalText":"Hey so I bought a Ender 3 v3 plus over a year ago. I have had almost zero problems so far, until now. I noticed I had layers that were missing. Eventually it got worse and I tried printing a test benchy that came on it. It was terrible! It printed the first few layers then was a stringy mess! I tried just letting it extrude and noticed it would pause a second then continue. I took it apart then got a new nozzle. The extruder gears were slightly caked but not bad. I cleaned it, put it back together, and tried some brand new filament. The new filament was sunlu matte pla. I tried printing the benchy that came on it again, it to was terrible. I noticed that the gears were super caked again. I realized that it was printing at 600mms. The filament said the max speed was 300mms. I changed settings and printed a test print. It was great. I changed filament types in creality print to the filament I used for the test. It was good but had another mess up eventually. I noticed the gears were a little clogged again. The only thought I had was maybe creality print doesn’t change the speed when you change the filament type on a previous file. I’m not the best with all this stuff. …","textCn":"嘿，我一年多前买了一台 Ender 3 v3 plus。到目前为止我几乎没遇到过问题，直到现在。我注意到有些层缺失了。后来情况越来越糟，我试着打印它自带的一个测试 benchy。太糟糕了！它打印了前几层，然后就变成一团拉丝。我试着让它单纯挤出，发现它会停顿一秒然后继续。我把它拆开，换了个新喷嘴。挤出机齿轮有点结垢，但不算严重。我清理了它，装回去，又试了一些全新的耗材。新耗材是 sunlu matte pla。我又试着打印它自带的 benchy，同样很糟糕。我注意到齿轮又严重结垢了。我意识到它是以 600mm/s 打印的。耗材标注的最高速度是 300mm/s。我改了设置，打印了一个测试件。效果很好。我在 creality print 里把耗材类型改成我测试时用的那种。结果不错，但最后还是又出了一次问题。我注意到齿轮又有点堵了。我唯一的想法是，也许 creality print 在你更改之前文件上的耗材类型时不会改变速度。我对这些东西不太在行。……","truncated":true,"url":"https://forum.creality.com/t/ender-3-v3-plus-extrusion-problems/51102","productLine":"firmware","version":"","versionRaw":"","problemType":"feature","model":"Ender-3 V3 Plus","grade":"有效","replyCount":2,"views":84,"likeCount":2,"sourceType":"论坛"},{"uid":"6e27d2adfb9491ac","date":"2026-05-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Whats the networking issue with Creality Print 7.1 .1.4472 - Camera is about 1 frame per minute?","titleCn":"Creality Print 7.1.1.4472 的网络问题是什么——摄像头大约每分钟 1 帧？","originalText":"Hi\nI’ve just updated to the latest version (7.1.1.4472), and the video feed from my Creality Hi is now about one frame per second - it appears that I can upload a model without issue - I’m currently printing, but I need to keep going to visually inspect progress… Up til now, the video has been fine - other items on my network are working fine - I’ve checked on the printer, and its at latest firmware…\nAnyone having similar problems?\nThanks in advance\nCarl.\nThink I’ve located the issue - I’d got another process running on the network, and it was maxing out the connection to the garage where my printer is… duh… :-/","textCn":"你好 我刚更新到最新版本（7.1.1.4472），来自我的 Creality Hi 的视频流现在大约每秒一帧——看起来我可以正常上传模型——我目前正在打印，但我需要不断去目视检查进度… 到目前为止，视频一直很好——我网络上的其他设备工作正常——我检查了打印机，它是最新固件… 有人遇到类似问题吗？提前感谢 Carl。我想我已经找到问题了——我网络上有另一个进程在运行，它把通往我打印机所在车库的连接占满了… 唉… :-/","truncated":false,"url":"https://forum.creality.com/t/whats-the-networking-issue-with-creality-print-7-1-1-4472-camera-is-about-1-frame-per-minute/51080","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":2,"views":62,"likeCount":1,"sourceType":"论坛"},{"uid":"14b2489800eca4af","date":"2026-05-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Recent Projects default folder","titleCn":"最近项目默认文件夹","originalText":"Can anyone tell me where the recent projects files are kept in windows 11. I work across multiple pcs and would like the same recent projects synched across the devices.\nThanks\nIf you are talking about the item «Recent Projects» on the File menu of Creality Print, THERE IS NO DEFAULT folder, as you can see is the full path of the last open projects, on the Creality Print you save a list of the full path of the last files you opened.\nIf you want to preserver THE LIST no the files those are saved on the Creality Print config file, That file is stored on “%APPDATA%\\Creality\\Creality Print\\7.0\\Creality.conf” (FOR CREALITY 7.0)\nBe aware of that file can not be manually edited and contains ALL THE CREALITY PRINT SETTINGS.\nAlso on that route there are the folders\n“%APPDATA%\\Creality\\Creality Print\\7.0\\system”\n“%APPDATA%\\Creality\\Creality Print\\7.0\\user”\nwhich contains the profiles you must backup user one.","textCn":"有人能告诉我 Windows 11 中最近项目文件保存在哪里吗？我在多台 PC 上工作，希望同样的最近项目能在各设备间同步。谢谢。如果你说的是 Creality Print 文件菜单中的“最近项目”项，那没有默认文件夹，如你所见，最后打开项目的完整路径，Creality Print 保存的是你最后打开文件的完整路径列表。如果你想保留这个列表而不是文件，它们保存在 Creality Print 配置文件中，该文件存储在“%APPDATA%\\Creality\\Creality Print\\7.0\\Creality.conf”（适用于 CREALITY 7.0）。请注意该文件不能手动编辑，并且包含所有 CREALITY PRINT 设置。此外，该路径下还有文件夹“%APPDATA%\\Creality\\Creality Print\\7.0\\system”“%APPDATA%\\Creality\\Creality Print\\7.0\\user”，其中包含配置，你必须备份 user 那个。","truncated":false,"url":"https://forum.creality.com/t/recent-projects-default-folder/51077","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":58,"likeCount":0,"sourceType":"论坛"},{"uid":"1dc2bf8470f46e60","date":"2026-05-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Suche gratis Programm um STL Modellle in Teile zu zerlegen","titleCn":"寻找可将 STL 模型拆分成零件的免费软件","originalText":"Hallo Leute, suche ein gratis Programm zum zerlegen von STL dateien\nSplitting a STL can be done via the slicer creality print for example :","textCn":"大家好，我在找一款能把 STL 文件拆开的免费软件\n例如，可以通过 Creality Print 切片软件来拆分 STL：","truncated":false,"url":"https://forum.creality.com/t/suche-gratis-programm-um-stl-modellle-in-teile-zu-zerlegen/51064","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":24,"likeCount":0,"sourceType":"论坛"},{"uid":"07f90d6603f842fb","date":"2026-05-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender3 S1","titleCn":"Ender3 S1","originalText":"On the Ender 3 S1 I have it all back together with a new Creality Sprite Extruder Pro installed. I want to be able\ndownload on the cloud but I cannot find the IP address. I have followed the instructions and I am at a loss. Also I cannot even download on to my SDH card. Helppp.\nThe Ender 3S1 or S1 pro does not have Wi-Fi of Ethernet on board. You would have to add a raspberry pi running Octoprint or a Sonic Pad to enable the printer to connect to Wi-Fi.\nBill\nThank you. Guess I need to flash my SDHC card. I can’t remember how my son showed me. Any help would be greatly appreciated.","textCn":"在 Ender 3 S1 上，我把它全部装回去了，还安装了新的 Creality Sprite Extruder Pro。我想从云端下载，但找不到 IP 地址。我按照说明做了，现在一筹莫展。而且我甚至无法下载到我的 SDH 卡上。救命。Ender 3S1 或 S1 pro 板上没有 Wi-Fi 或以太网。你需要加一个运行 Octoprint 的树莓派或一个 Sonic Pad，才能让打印机连接 Wi-Fi。Bill。谢谢。看来我需要刷我的 SDHC 卡了。我记不清我儿子是怎么教我的了。任何帮助都将不胜感激。","truncated":false,"url":"https://forum.creality.com/t/ender3-s1/51069","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":4,"views":108,"likeCount":0,"sourceType":"论坛"},{"uid":"0a8b79b30238fa4c","date":"2026-05-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality software not allowed by IT Dept. Other Options?","titleCn":"IT 部门不允许使用 Creality 软件。有其他选择吗？","originalText":"Hello, I am brand new to 3d printing and when I asked for software to be installed on our existing 3d printers I was informed that due to 3rd party dependencies the software wasnt allowed. Are there other options out there that are compatible with my Ender 3 Pro?\nOrca Slicer is the best open source option of Prusa based Slicer.\nas creality print is a fork of orca, i don’t see that they’ll install that one either, but you can give it a try","textCn":"你好，我完全是 3D 打印新手，当我请求在我们现有的 3D 打印机上安装软件时，我被告知由于第三方依赖，该软件不被允许。有没有其他与我 Ender 3 Pro 兼容的选择？Orca Slicer 是基于 Prusa 的切片软件中最好的开源选择。由于 Creality Print 是 Orca 的分支，我看他们也不会安装那个，但你可以试一试","truncated":false,"url":"https://forum.creality.com/t/creality-software-not-allowed-by-it-dept-other-options/51016","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":127,"likeCount":2,"sourceType":"论坛"},{"uid":"a37659636c01d38b","date":"2026-05-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"miana dyszy na 0.2mm w Creality Print","titleCn":"在 Creality Print 中更换为 0.2mm 喷嘴","originalText":"Hi, I’m having trouble setting up the Creality Print program for a 0.2 mm nozzle and a K1C printer. I created a new profile in the printer section for that nozzle. I saved it as a user profile and selected it, but in the filaments section, I still only see profiles for a 0.4 mm nozzle. How do I change these settings? I’m using the latest version 7 of the program.","textCn":"你好，我在为 0.2 mm 喷嘴和 K1C 打印机设置 Creality Print 程序时遇到了麻烦。我在打印机部分为那个喷嘴新建了一个配置。我把它保存为用户配置并选中了它，但在耗材部分，我仍然只看到 0.4 mm 喷嘴的配置。我要如何更改这些设置？我用的是该程序的最新版本 7。","truncated":false,"url":"https://forum.creality.com/t/miana-dyszy-na-0-2mm-w-creality-print/50991","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":23,"likeCount":0,"sourceType":"论坛"},{"uid":"cbf2804810204851","date":"2026-05-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Cooling problem on Creality Print and K2 Plus","titleCn":"Creality Print 和 K2 Plus 上的冷却问题","originalText":"Cooling problem on Creality Print and K2 Plus","textCn":"Creality Print 和 K2 Plus 上的冷却问题","truncated":false,"url":"https://forum.creality.com/t/cooling-problem-on-creality-print-and-k2-plus/50973","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":1,"views":33,"likeCount":0,"sourceType":"论坛"},{"uid":"9f8bd17716efa17b","date":"2026-05-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"SOLVED: Why is this happening in Creality Print?","titleCn":"已解决：为什么在 Creality Print 中会出现这种情况？","originalText":"SOLVED: Why is this happening in Creality Print?","textCn":"已解决：为什么在 Creality Print 中会出现这种情况？","truncated":false,"url":"https://forum.creality.com/t/solved-why-is-this-happening-in-creality-print/50968","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":88,"likeCount":1,"sourceType":"论坛"},{"uid":"7b6918abaeaee0ee","date":"2026-05-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"La aplicación no ordena los archivos locales correctamente","titleCn":"应用无法正确排序本地文件","originalText":"La aplicación no ordena los archivos locales correctamente","textCn":"应用无法正确排序本地文件","truncated":false,"url":"https://forum.creality.com/t/la-aplicacion-no-ordena-los-archivos-locales-correctamente/50976","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":23,"likeCount":0,"sourceType":"论坛"},{"uid":"8ea0ce7961866506","date":"2026-04-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CrealityPrint under Linux Mint-Mate","titleCn":"在 Linux Mint-Mate 下使用 CrealityPrint","originalText":"CrealityPrint under Linux Mint-Mate","textCn":"在 Linux Mint-Mate 下使用 CrealityPrint","truncated":false,"url":"https://forum.creality.com/t/crealityprint-under-linux-mint-mate/50908","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":76,"likeCount":0,"sourceType":"论坛"},{"uid":"0d54658387c054c6","date":"2026-04-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K2 plus all prints fail after firmware, usb doesn't boot on start up to roll back firmware","titleCn":"K2 plus 更新固件后所有打印都失败，U 盘在启动时无法引导以回滚固件","originalText":"I recently updated firmware on my k2 plus and it’s failed every print since. Before update it was perfect. I tried to reinstall previous firmware. But it does not boot it up on start up. It’s in the right format and on a small 7gb usb stick. Just doesn’t seem to want to let me return to a usable printer.\nIt will print a few layers then stops the print and says its not extruding. I went back to just using the reel on the side of the machine but it made no difference.\nI went from perfect prints to a completely terrible printer that is not usable at all and the only difference was the latest firmware update, that i can’t seem to roll back\nDid you follow this guide on firmware restore?\nCreality Wiki\nK2 Plus & CFS Firmware Upgrade Guide\nHi, the last firmwares does not permits to re-install or downgrade the firmware in any way.\nYou have to do this. Download the firmware you want to install and rename it with a number higher than the one installed. So, if you installed firmware is CR0CN240110C10_R_202605081127_ota_img_V1.1.5.5.img you have to rename it CR0CN240110C10_R_202605081127_ota_img_V1.1.5.6.img\nPut it in a USB drive and the printer will recognize and install it! …","textCn":"我最近更新了我的 k2 plus 的固件，从那以后每次打印都失败。更新前它很完美。我尝试重装之前的固件。但它在启动时不会引导。格式是对的，放在一个小 7gb 的 U 盘里。它就是不肯让我回到一台可用的打印机。 它会打印几层然后停止打印，并说它没有在挤出。我退回到只用机器侧面的料盘，但没有任何区别。 我从完美的打印变成了一台完全糟糕、根本不能用的打印机，唯一的区别就是最新的固件更新，而我似乎无法回滚 你按照这份固件恢复指南操作了吗？ Creality Wiki K2 Plus 与 CFS 固件升级指南 你好，最新的固件不允许以任何方式重新安装或降级固件。 你必须这样做。下载你想安装的固件，并用一个比已安装版本更高的数字重命名它。所以，如果你安装的固件是 CR0CN240110C10_R_202605081127_ota_img_V1.1.5.5.img，你必须把它重命名为 CR0CN240110C10_R_202605081127_ota_img_V1.1.5.6.img 把它放进 U 盘，打印机就会识别并安装它！…","truncated":true,"url":"https://forum.creality.com/t/k2-plus-all-prints-fail-after-firmware-usb-doesnt-boot-on-start-up-to-roll-back-firmware/50910","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":3,"views":200,"likeCount":0,"sourceType":"论坛"},{"uid":"e12057992d9ae53f","date":"2026-04-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Mini animal collection","titleCn":"迷你动物合集","originalText":"Wanted to see if my raptor pro could scan tiny objects. here are some of the scans. they are only 22mm. overall they came out pretty good.\nThere is about 10 of them so I just made a folder. I will be adding more.\n20260412_150341\n20260412_220105\n20260412_220219\n20260413_171618 - Copy\n20260413_171637\nhappy printing\n#CMP\n# ｜creality-cloud\n#crealitymaker\nCreality Cloud | Page\nExplore the world of 3D printing with Creality Cloud.","textCn":"想看看我的 raptor pro 能不能扫描微小的物体。这里是一些扫描结果。它们只有 22mm。总体来说效果相当不错。\n大约有 10 个，所以我干脆建了一个文件夹。我还会继续添加。\n20260412_150341\n20260412_220105\n20260412_220219\n20260413_171618 - Copy\n20260413_171637\n打印愉快\n#CMP\n# ｜creality-cloud\n#crealitymaker","truncated":false,"url":"https://forum.creality.com/t/mini-animal-collection/50844","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":1,"views":29,"likeCount":1,"sourceType":"论坛"},{"uid":"a69bd50b79a55813","date":"2026-04-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Why is it so difficult to get presets into Creality Print","titleCn":"为什么把预设导入 Creality Print 这么难","originalText":"I do not understand how the software can be so lacking in one of the most critical area, presets and filament profile exchange.\nThe software developers continues to force people into using what they determine are optimum settings rather than using a common standard such as JSON files to allow the easy exchange of setting files for both printers and filaments. Some simple steps would make working with the printers so much more enjoyable:\nHave a configurable location for printer config files, and another for filament profiles.\nAllow users to add and remove files from the folder (either directly from their OS or via an import/export function).\nEven allow backups of the folders.\nRetain files in the folders between version upgrades.\nRead the configs and profiles from the folders.\noptional - Establish an open source exchange for the printer and filament profiles. Creality Print is based off of an open source platform, and yet it operates in a closed source manner when it comes to these configs and profiles.\nIt would be even better yet if Creality had profile files then for each of their series of filaments. …","textCn":"我不理解，软件为什么能在最关键的领域之一——预设和耗材配置(参数配置)的交换——如此匮乏。软件开发人员继续强迫人们使用他们认定的最佳设置，而不是使用像 JSON 文件这样的通用标准，来方便地交换打印机和耗材的设置文件。一些简单的步骤就能让使用打印机愉快得多： 为打印机配置文件设置一个可配置的位置，为耗材配置设置另一个位置。 允许用户从文件夹中添加和删除文件（直接从操作系统或通过导入/导出功能）。 甚至允许备份这些文件夹。 在版本升级之间保留文件夹中的文件。 从文件夹读取配置和配置(参数配置)。 可选——为打印机和耗材配置建立一个开源的交换平台。Creality Print 基于一个开源平台，但在这些配置和配置文件方面，它的运作方式却是闭源的。 如果 Creality 能为他们的每个耗材系列提供配置文件，那就更好了。……","truncated":true,"url":"https://forum.creality.com/t/why-is-it-so-difficult-to-get-presets-into-creality-print/50829","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":145,"likeCount":1,"sourceType":"论坛"},{"uid":"99e39737a884e73f","date":"2026-04-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"error 87","titleCn":"错误 87","originalText":"Hi everytime i go to use creality 7.1 i just get the following message LoadLibrary failed with error 87 : The parameter is incorrect. Ive tried other versions and just get the same message any ideas how i can get creality 7.1 to load. Many thanks","textCn":"大家好，每次我想使用 Creality 7.1 时，都会收到以下消息：LoadLibrary failed with error 87 : The parameter is incorrect。我试过其他版本，得到的也是同样的消息。有人知道怎样才能让 Creality 7.1 加载起来吗？非常感谢","truncated":false,"url":"https://forum.creality.com/t/error-87/50803","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"sourceType":"论坛"},{"uid":"6f9ca8bb51383df0","date":"2026-04-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"7.1 update","titleCn":"7.1 更新","originalText":"Since the 7.1 update it will not let you print if you have an empty slot in your CFS. Even if your not going to be using that color. That needs to be fixed. If I’m not using that slot it shouldn’t matter if it’s empty. I had to find an old roll of filament to put in place just to print with a different color.\nHello @user3098917494\nWelcome to the Creality Forum…!\nI am not having this problem using the latest Creality Print and the CFS with a K2 Pro. I have 3 colors loaded now and it will print just fine. Press the Auto Mapping icon in the top right to refresh what colors are in the CFS. Make sure the colors are correct and in the right place.\nAuto-Mapping\nYou must to assign spool slot to every color of your print to be able to print, even if you print will not use it.\nBy example, you slice a piece with 4 colors on your config, but your print have only one color, never less you must to assign a spool to the others colors.\nIn this example I got a blue model and my slicer’s filament are blue green, pink and yellow. …","textCn":"自从 7.1 更新后，如果你的 CFS 中有空槽位，它就不让你打印。即使你不打算使用那个颜色。这需要修复。如果我不使用那个槽位，它是空的应该没关系。我不得不找一卷旧耗材放进去，只是为了用另一种颜色打印。你好 @user3098917494 欢迎来到 Creality 论坛…！我在使用最新的 Creality Print 和 K2 Pro 上的 CFS 时没有遇到这个问题。我现在装了 3 种颜色，打印正常。按右上角的自动映射图标刷新 CFS 中的颜色。确保颜色正确且位置正确。自动映射 你必须为打印的每种颜色分配料盘槽位才能打印，即使你的打印不会使用它。例如，你在配置中切片一个有 4 种颜色的零件，但你的打印只有一种颜色，你仍然必须为其他颜色分配料盘。在这个例子中，我有一个蓝色模型，而我切片软件的耗材是蓝色、绿色、粉色和黄色。…","truncated":true,"url":"https://forum.creality.com/t/7-1-update/50821","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":3,"views":202,"likeCount":4,"sourceType":"论坛"},{"uid":"b990d9548d605407","date":"2026-04-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Issues with","titleCn":"遇到的问题","originalText":"Hi\nI have some issues when I want to slice any models.\nI use a k2 plus and creality print 7.1\nIt is like layer are bad connected or a lack of material. I have seen many videos and other stuff to solve the problem (flow ratio. Temperature, setting Z, cooling, wall,etc) but nothing works.\nDoes anyone know what is going on? I really don’t understand.\nThank you\nPXL_20260424_215549528\nPXL_20260424_213129923\nPXL_20260424_211552382\nthat seems to be driven by the object geometry, to mitigate you can consider using a lower layer height, or try adaptive layer height sliding it towards the quality side","textCn":"你好，我在切片任何模型时都会遇到一些问题。我用的是 K2 Plus 和 Creality Print 7.1。看起来像是层与层连接不良，或者材料不足。我看过很多视频和其他资料来解决这个问题（流量比例、温度、设置 Z、冷却、墙等），但都没有用。有人知道是怎么回事吗？我真的不明白。谢谢。这似乎是由对象几何形状导致的，为缓解可以尝试使用更低的层高，或者试试自适应层高并向质量一侧滑动。","truncated":false,"url":"https://forum.creality.com/t/issues-with/50786","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":39,"likeCount":0,"sourceType":"论坛"},{"uid":"3ceb03b3d6df79d2","date":"2026-04-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Why is Creality Cloud for iOS so unstable","titleCn":"为什么 iOS 上的 Creality Cloud 这么不稳定","originalText":"Why is it that when I use Creality Cloud on an iPad, iPhone or a Mac it is totally hit or miss.\nMost often video feed will fail, CFS (x2) are not shown only the “learn CFS” screen, Time lapses are not available.\nIf I “try again” about 8 times eventually it will show the video and CFS and show the time lapse videos but they always fail to download.\nMy K2 Pro has a dedicated Ethernet connection so my WiFi is not the issue. All firmware is up to date.\nWhen I use Creality print on my PC everything seems to work fine so it looks to me like there is an issue with the iOS version..\nWhich versions of iOS? All the problems you describe sound like network issues. iOS historically and notoriously has been pretty buggy when it comes to networking. There have been a lot of “minor updates” recently, and most of them are for network and security bugs. Since iOS is a minority OS, Creality probably haven’t put the effort into all the work-arounds needed to connect an iOS device reliably. IMHO, stick with the PC (or linux) and be glad you have a mainstream alternate computer.","textCn":"为什么我在 iPad、iPhone 或 Mac 上使用 Creality Cloud 时，结果完全靠运气。最常见的是视频画面会失败，CFS（x2）不显示，只显示“学习 CFS”的界面，延时摄影不可用。 如果我“重试”大约 8 次，最终它会显示视频和 CFS，并显示延时摄影视频，但它们总是下载失败。 我的 K2 Pro 有专用以太网连接，所以我的 WiFi 不是问题。所有固件都是最新的。 当我在 PC 上用 Creality print 时一切似乎都正常，所以在我看来 iOS 版本有问题。 是哪些 iOS 版本？你描述的所有问题听起来都像网络问题。iOS 在历史上和众所周知在网络方面相当多 bug。最近有很多“小更新”，其中大多数是针对网络和安全 bug 的。由于 iOS 是少数派操作系统，Creality 可能没有投入精力去做所有必要的变通，以可靠连接 iOS 设备。依我看，就用 PC（或 linux），并庆幸你有一台主流的替代电脑。","truncated":false,"url":"https://forum.creality.com/t/why-is-creality-cloud-for-ios-so-unstable/50800","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":57,"likeCount":1,"sourceType":"论坛"},{"uid":"ee64d7d209cda7e5","date":"2026-04-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How can I import a colored SVG and respect colors? Any idea?","titleCn":"如何导入彩色 SVG 并保留颜色？有什么想法吗？","originalText":"Hello!\nI have a K2 Pro with CFS. And now I’m printing some objects with integrated logos in color. The base object lets say its a cube.\nSo, on the top of that cube i want to put the “Porsche” logo. I have a colored SVG, but when I import it as SVG the color information it’s lost.\nIt happens the same if I have a colored 3d object in 3mf, and add it as a modifier.\nHow can i do something like “serigraph” one face with a colored 3mf/svg?\nThanks!\nno can do, no slicer support SVG color import.\nyou must to import the SVG, create the object and then paint it on the slicer.","textCn":"你好！\n我有一台带 CFS 的 K2 Pro。现在我在打印一些带有彩色一体化标志的物体。基础物体比如说是一个立方体。\n所以，在这个立方体的顶部我想放上“Porsche”标志。我有一个彩色的 SVG，但当我以 SVG 导入时，颜色信息丢失了。\n如果我在 3mf 里有一个彩色的 3D 物体，并把它作为修改器添加，情况也是一样。\n我怎样才能像“丝网印刷”那样，用彩色的 3mf/svg 做一个面？\n谢谢！\n不行，没有切片软件支持导入 SVG 颜色。\n你必须导入 SVG，创建物体，然后在切片软件里给它上色。","truncated":false,"url":"https://forum.creality.com/t/how-can-i-import-a-colored-svg-and-respect-colors-any-idea/50765","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":2,"views":95,"likeCount":0,"sourceType":"论坛"},{"uid":"3b87bff4ad9b6bc8","date":"2026-04-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"creality print not allowing 4 color print from CFS","titleCn":"Creality Print 不允许从 CFS 进行 4 色打印","originalText":"i am trying to import a file with 4 colours creality print will only let me import 2 and wont let me edit the number in the box, i have attached 2 screen shots to show model and problem any help would be great\ncolour select problem\npage01\ncan you share the file you are trying to import?\nLIME VAN V2 SINGLE TOP TEST PRINT COLOUR.3mf (2.1 MB)","textCn":"我想导入一个 4 色的文件，但 Creality Print 只让我导入 2 色，也不让我编辑框里的数字，我附上了 2 张截图来展示模型和问题，任何帮助都非常感谢。 颜色选择问题 page01 你能分享一下你要导入的文件吗？ LIME VAN V2 SINGLE TOP TEST PRINT COLOUR.3mf（2.1 MB）","truncated":false,"url":"https://forum.creality.com/t/creality-print-not-allowing-4-color-print-from-cfs/50763","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":4,"views":59,"likeCount":2,"sourceType":"论坛"},{"uid":"0eaf0053be72d61a","date":"2026-04-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Anyone else having this problem?","titleCn":"还有其他人遇到这个问题吗？","originalText":"Anyone else having this problem?","textCn":"还有其他人遇到这个问题吗？","truncated":false,"url":"https://forum.creality.com/t/anyone-else-having-this-problem/50782","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":73,"likeCount":0,"sourceType":"论坛"},{"uid":"d5ca7abd3dde1934","date":"2026-04-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Changing Nozzles In the Slicer","titleCn":"在切片软件中更换喷嘴","originalText":"I’m fairly new to printing so maybe this is a dumb question but, when I change the nozzle to 0.6 in the slicer, I lose the option to select PETG-CF and many other filaments. Even when I click setting in the Filament box on the right, I don’t have the option to even add it. Am I doing something wrong?\nHello there, Which printer and which slicer?\nIDK which printer you have but when you go into the slicer, click on the green creality logo next to file, go to online perams and find your printer. There is a good chance that it needs an update for the different nozzles. Hopefully that fixes it.","textCn":"我对打印还比较陌生，所以这也许是个蠢问题，但当我在切片软件里把喷嘴改成 0.6 时，我就失去了选择 PETG-CF 和许多其他耗材的选项。即使我点击右侧耗材框里的设置，我也没有添加它的选项。是我哪里做错了吗？ 你好，是哪个打印机、哪个切片软件？ 我不知道你用的是哪台打印机，但当你进入切片软件后，点击文件旁边绿色的 Creality 标志，进入在线参数，找到你的打印机。很可能它需要针对不同喷嘴做更新。希望这能解决问题。","truncated":false,"url":"https://forum.creality.com/t/changing-nozzles-in-the-slicer/50729","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":51,"likeCount":0,"sourceType":"论坛"},{"uid":"654139bc7961091c","date":"2026-04-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Multicolor printing in Assembly","titleCn":"装配体中的多色打印","originalText":"I have imported three stl files for a keychain tag. There is a base and two text elements. I positioned them like I want and created an Assembly. I want the base, text 1, and text 2 to print in three different colors. However, I am having difficulty assigning colors to the different elements. Any help would be greatly appreciated. I have tried assigning colors using the Printer tree on the left and the Object/Part settings. I am obviously missing something in the setup or follow-through. Thanks\nYou need to add the other colors you want to use to the filament section in the top right - looks like the green is the only one you have set up so it’s the only one available to assign. Once they are available there, you will be able to assign them to individual objects on the left list.\nThis you tube video explains how to color paint you project.\nCreality Print 6/7 Tutorial: STL Painting, for Multicolor 3D Printing. Color on K2 Plus & Hi Combo\nBill","textCn":"我导入了一个钥匙扣标签的三个 stl 文件。有一个底座和两个文字元素。我按想要的位置摆放好并创建了一个装配体。我想让底座、文字 1 和文字 2 用三种不同颜色打印。但是，我在给不同元素分配颜色上有困难。任何帮助都非常感谢。我试过用左侧的打印机树和对象/零件设置来分配颜色。我在设置或后续步骤中显然漏了什么。谢谢 你需要把你想要使用的其他颜色添加到右上角的耗材区域——看起来绿色是你唯一配置好的，所以它是唯一可分配的。一旦它们在那里可用，你就能把它们分配给左侧列表中的各个对象。 这个 you tube 视频解释了如何给你的项目上色。 Creality Print 6/7 教程：STL 涂色，用于多色 3D 打印。K2 Plus 和 Hi Combo 上的颜色 Bill","truncated":false,"url":"https://forum.creality.com/t/multicolor-printing-in-assembly/50697","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":3,"views":101,"likeCount":0,"sourceType":"论坛"},{"uid":"b05e606c8c6af2d7","date":"2026-04-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Subject: UI/UX improvements suggestions for Creality Slicer","titleCn":"主题：Creality 切片软件的 UI/UX 改进建议","originalText":"Subject: UI/UX improvements suggestions for Creality Slicer\nHello Creality team,\nFirst of all, thank you for your work on the slicer — overall it is a very powerful and capable tool, and I really enjoy using it. I’d like to share a few suggestions that, in my opinion, could significantly improve usability and user experience:\nIncorrect display of Ukrainian filenames\nIn the object list, filenames containing Ukrainian characters are displayed as question marks instead of proper text. This makes file identification difficult.\nMissing close buttons on UI widgets\nSome interface elements (such as the Arrange widget and others) do not have a visible close button, which makes interaction less intuitive.\nOption to disable specific warning notifications\nIt would be very helpful to add an option in the context menu like: “Do not show this warning again” for certain types of warnings. This would reduce repetitive notifications during workflow.\nAccidental layer slider interaction when zooming\nWhen zooming with the mouse wheel, the cursor often lands on the layer progress bar, unintentionally moving the sliders. …","textCn":"主题：Creality 切片软件的 UI/UX 改进建议\n你好，Creality 团队，\n首先，感谢你们在切片软件上的工作——总体而言它是一个非常强大、功能完备的工具，我真的很喜欢用。我想分享几点建议，在我看来它们能显著改善易用性和用户体验：\n乌克兰语文件名显示不正确\n在物体列表中，包含乌克兰语字符的文件名显示为问号而不是正确的文字。这让识别文件变得困难。\nUI 小组件缺少关闭按钮\n一些界面元素（例如排列小组件等）没有可见的关闭按钮，这让交互不够直观。\n可选择禁用特定的警告通知\n如果能在上下文菜单中添加类似“不再显示此警告”的选项，对某些类型的警告会非常有帮助。这会减少工作流程中的重复通知。\n缩放时误触图层滑块\n用鼠标滚轮缩放时，光标常常落在图层进度条上，无意中移动了滑块。…","truncated":true,"url":"https://forum.creality.com/t/subject-ui-ux-improvements-suggestions-for-creality-slicer/50673","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":34,"likeCount":1,"sourceType":"论坛"},{"uid":"d2163166a584ec89","date":"2026-04-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CrealityPrint V 7.1.0.4414 Brim type : Mouse Ear corner detection failure","titleCn":"CrealityPrint V 7.1.0.4414 边缘类型：鼠耳角检测失败","originalText":"On parts with 90 degree corners , for example a simple cube it detects all four corners\non part with slightly fillet corners it always detects only three corners\ntry the attachments:\nCube.stl (684 Bytes)\nCubeChampfered.stl (13, )\nCubeChapfered.stl should be named CubeFillet.stl\nNever had to uses mouse ears, make sure you have good bed adhesion…\nOK, Fillet instead of champfer , i beg your pardon but english is not my main language.\nwell if you know the one and only 3d printer that prints EVERYTHING, specially at high speed, without brim , mouse ear etc then let me know it.","textCn":"对于带 90 度角的零件，例如一个简单的立方体，它能检测到全部四个角。对于角略带圆角的零件，它总是只检测到三个角。试试附件：Cube.stl（684 字节）CubeChampfered.stl（13, ）CubeChapfered.stl 应该命名为 CubeFillet.stl 从不需要用鼠耳，先确保你有良好的热床附着… 好，是圆角（Fillet）而不是倒角（chamfer），请原谅，英语不是我的母语。好吧，如果你知道那台唯一能打印所有东西的 3D 打印机，尤其是高速打印，不用边缘、鼠耳等，那就告诉我。","truncated":false,"url":"https://forum.creality.com/t/crealityprint-v-7-1-0-4414-brim-type-mouse-ear-corner-detection-failure/50647","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":70,"likeCount":0,"sourceType":"论坛"},{"uid":"9c7e6ced827d7310","date":"2026-04-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to import print profiles from Orca Slicer to Creality Print?","titleCn":"如何将打印配置从 Orca Slicer 导入到 Creality Print？","originalText":"Does anyone know an effective and easy way to export Orca Slicer print profiles and import them to Creality Print?\ncan not done, the internal names of variables are incompatible between creality print and all the others prusa based slicers., you must to manually create them.\nIf you think the printer profiles of Orca slicer are better then CP, simply use Orca Slicer to create the Gcode for your printer… have done that for years and years when I was printing with my Ender 3 Pro…","textCn":"有人知道把 Orca Slicer 打印配置导出并导入到 Creality Print 的有效又简单的方法吗？做不到，Creality Print 与所有其他基于 Prusa 的切片软件之间的变量内部名称不兼容，你必须手动创建它们。如果你认为 Orca Slicer 的打印机配置比 CP 更好，干脆用 Orca Slicer 为你的打印机生成 G-code……我用 Ender 3 Pro 打印的那些年里一直都是这么做的……","truncated":false,"url":"https://forum.creality.com/t/how-to-import-print-profiles-from-orca-slicer-to-creality-print/50652","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":189,"likeCount":2,"sourceType":"论坛"},{"uid":"2bb73083de235011","date":"2026-04-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print improvement suggestions","titleCn":"Creality Print 改进建议","originalText":"New to this 3D printing world of Creality but I have been using it for 5 months now. I am not a fan of the support base layer choices. I suggest, if I may, have one that is like a brim and it incorporates both the brim and support base all in one go. No start/stop nonsense like the rectillinear.","textCn":"我刚接触 Creality 的 3D 打印世界，但现在已经用了 5 个月。我不喜欢支撑底层的那些选项。如果可以的话，我建议增加一种类似边缘的选项，把边缘和支撑底层一次性结合起来。不要像直线填充那样没完没了地启停。","truncated":false,"url":"https://forum.creality.com/t/creality-print-improvement-suggestions/50645","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":46,"likeCount":0,"sourceType":"论坛"},{"uid":"6a85dbf28e5b76e0","date":"2026-04-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3DConnexion 3D Mouse support","titleCn":"3DConnexion 3D 鼠标支持","originalText":"Creality Print is listed as supporting the 3DConnection 3D mouse, but it doesn’t work with the application. I’ve contacted 3DConnexion suppoirt and their response indivcates that it’s up to Creality to make it work if they so desire.\nI am running version 7.1.0.4414 om a Mac, Tahoe 26.2 version OS.\nDoes anyone have this working?\nnope it doesn’t work, it does work with orca though, so it’s something on the implementation that didn’t get transferred in the fork\nThe product does work but I have found that the 3D Connexion Software is buggy as hell.\nI found their tech support to be very responsive but totally clueless. If I were to guess, they hire part time high school students to man the tech support desk.\nI found that I often have to do two things:\nRestart the connexion software while the app is already launched and that it says CrealityPrint when you open the app. It often gets confused as to what app is on top.\nThe Creality support for the mouse is pointless, one has to go in and check all the boxes to be active manually.\nHere’s proof that it does work. You can’t do this kind of rotation with a plane mouse, it is one of the reasons I use the 3D Connexion mouse.","textCn":"Creality Print 被列为支持 3DConnection 3D 鼠标，但它在这个应用里不工作。我联系了 3DConnexion 支持，他们的回复表明，如果要让它工作，得由 Creality 愿意去做才行。 我在 Mac 上运行 7.1.0.4414 版，操作系统 Tahoe 26.2。 有人让它工作了吗？ 不行，它不工作，但它在 orca 里能用，所以是 fork 时实现上的东西没被带过来。 产品确实能用，但我发现 3D Connexion 软件 bug 多得很。 我发现他们的技术支持响应很快但完全不懂。如果要我猜，他们雇的是兼职高中生来看技术支持台。 我发现我经常得做两件事： 在应用已经启动、并且打开应用时它显示 CrealityPrint 的情况下重启 connexion 软件。它经常搞不清哪个应用在最上层。 Creality 对这款鼠标的支持毫无意义，必须进去手动勾选所有复选框才能让它处于活动状态。 这是它能工作的证据。你用平面鼠标做不出这种旋转，这也是我用 3D Connexion 鼠标的原因之一。","truncated":false,"url":"https://forum.creality.com/t/3dconnexion-3d-mouse-support/50625","productLine":"cloud","version":"7.1","versionRaw":"7.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":89,"likeCount":0,"sourceType":"论坛"},{"uid":"7dc06e6a5ebf7af3","date":"2026-04-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ccloud app problems starting print","titleCn":"Ccloud App 启动打印时的问题","originalText":"in CC app (iphone) I select the model and then have 2 issues. app v 7.3.0\nfails to find the CFS approx 50% of the time. so i have to restart the print job until it finally loads the CFS profile correctly.\nafter select filament click print and it either hangs forever on the loading icon, or it moves to the workbench page but doesnt actually load the job to the K2. I then have to close the app and restart the job from scratch. after approx 5-10 attempts it will finally send the job to printer.\nIMG_2157\nIMG_2156.PNG\nSame here. Sometimes it works just fine and others it doesn’t.\nSame problem here but now I can’t even get it to load print preview neither will it print acts like I never hit print and just shows my last project that I successfully printed is this just a K2 SE problem?","textCn":"在 CC App（iPhone）里，我选择模型后遇到 2 个问题。App 版本 7.3.0 大约 50% 的情况下找不到 CFS。所以我不得不重启打印任务，直到它最终正确加载 CFS 配置。 选好耗材后点击打印，它要么永远卡在加载图标上，要么跳到工作台页面但并没有真正把任务加载到 K2。然后我不得不关闭 App 从头重启任务。大约尝试 5-10 次后，它才会最终把任务发送到打印机。 IMG_2157 IMG_2156.PNG 我也一样。有时候运行得很好，有时候就不行。 我也有同样的问题，但现在我甚至无法让它加载打印预览，也无法打印，就像我从没点过打印一样，只显示我上次成功打印的项目，这只是 K2 SE 的问题吗？","truncated":false,"url":"https://forum.creality.com/t/ccloud-app-problems-starting-print/50540","productLine":"cloud","version":"7.3","versionRaw":"7.3.0","problemType":"other","model":"K2","grade":"有效","replyCount":4,"views":219,"likeCount":0,"sourceType":"论坛"},{"uid":"c60ce696e7859be3","date":"2026-04-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Doom on Creality K1","titleCn":"在 Creality K1 上玩 Doom","originalText":"Hi everyone! I’ve got a bit of a crazy experiment in mind. We all know the ‘Can it run Doom?’ challenge, and I think the Creality K1 is a perfect candidate!\nI have a USB hub with a mouse and keyboard ready to go. I also have a bootable Xubuntu drive. My main question is: does the K1’s bootloader (U-Boot) allow selecting an external boot device, or should I look into running it through a Klipper/framebuffer port instead?\nWould love to hear if anyone has tried this or has tips on accessing the display’s framebuffer!\nNice. hope you get it.","textCn":"大家好！我有个有点疯狂的实验想法。我们都知道“它能跑 Doom 吗？”这个挑战，我觉得 Creality K1 是完美的候选！ 我已经准备好一个带鼠标和键盘的 USB 集线器，也有一个可启动的 Xubuntu 盘。我的主要问题是：K1 的引导程序（U-Boot）是否允许选择外部启动设备，还是我该考虑通过 Klipper/framebuffer 端口来运行？ 很想听听有没有人试过，或者有关访问显示屏 framebuffer 的技巧！ 不错，希望你能成功。","truncated":false,"url":"https://forum.creality.com/t/doom-on-creality-k1/50461","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":2,"views":61,"likeCount":2,"sourceType":"论坛"},{"uid":"7280767e30a8fe15","date":"2026-04-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"cant login into falcon desktop app","titleCn":"无法登录 falcon 桌面应用","originalText":"i have the falcon design downloaded onto my pc, i keep getting an error message that states invalid parameter. all im trying to do is login into the app using creality web or whatever. ive followed the instructions that says to allow pop ups from id.creality.com but that didnt work. ive tried doing the QR code but that didnt work either.\nanyone have any suggestions on this?","textCn":"我把 falcon design 下载到了电脑上，一直收到一条错误信息，说参数无效。我只是想用 creality 网页之类的登录这个应用。我按照说明允许了来自 id.creality.com 的弹出窗口，但没用。我也试过二维码，也没用。有人对此有什么建议吗？","truncated":false,"url":"https://forum.creality.com/t/cant-login-into-falcon-desktop-app/50345","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":40,"likeCount":2,"sourceType":"论坛"},{"uid":"12cb9d9870246e4a","date":"2026-04-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality 7.1   The properties box will not slide out all the way on the right","titleCn":"Creality 7.1 属性框无法在右侧完全滑出","originalText":"In the latest update 7.1 the slideout box on the right will not slide out all the way. It is extremely awkward to use. Does anyone know how to make slide out past the partial view?\nHello @slushbender1\nWelcome to the Creality Forum…!\nYou can drag the edge of the window and adjust the size and pull it out to see more.\nAre you running multiple monitors? I noticed when I drag my Creality Print window from the laptop screen to the 27in monitor, I will get some VERY weird results. One of them was the slideout covering the entire screen.\nThis time I was able to grab the edge of that green box and drag it smaller to the right. But I have had times where that did not work. I’m trying to find a way to replicate that, but I haven’t been able to .\nYOU ARE NOT ALONE….\nbut try the green box edge, see if that works.","textCn":"在最新的 7.1 更新中，右侧的滑出框无法完全滑出。使用起来极其别扭。有人知道怎么让它滑出超过部分视图吗？ 你好 @slushbender1 欢迎来到 Creality 论坛…！ 你可以拖动窗口边缘调整大小并把它拉出来，从而看到更多内容。 你是不是用了多个显示器？我注意到当我把 Creality Print 窗口从笔记本屏幕拖到 27 英寸显示器时，会出现一些非常奇怪的结果。其中之一是滑出框遮住了整个屏幕。 这次我能抓住那个绿色框的边缘，把它往右拖小一点。但也有过拖动不起作用的时候。我正试图找到复现的方法，但一直没能做到。 你不是一个人… 不过试试绿色框的边缘，看看有没有用。","truncated":false,"url":"https://forum.creality.com/t/creality-7-1-the-properties-box-will-not-slide-out-all-the-way-on-the-right/50323","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"ui","model":"未标注","grade":"有效","replyCount":5,"views":84,"likeCount":1,"sourceType":"论坛"},{"uid":"2a0525bc2933c7f2","date":"2026-04-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3D Printer Files | 3MF File | Bluey Buddy Flex 🐾💙 | Creality Cloud","titleCn":"3D 打印机文件 | 3MF 文件 | Bluey Buddy Flex 🐾💙 | Creality Cloud","originalText":"3D Printer Files | 3MF File | Bluey Buddy Flex 🐾💙 | Creality Cloud\nBring home the playful spirit of Bluey with this adorable articulated figure! 🐶✨ Designed with movable joints, this little Blue Heeler is full of personality and ready for fun poses, fidgeting, or display. The vibrant colors and chunky, toy-like...\n*Nose and eye detail painted on.\nIMG_20260407_043816\nIMG_20260407_043911\nThis model is very cute! Looks funny\nQuite long printing time, I wouldn’t wait this much time, but I am sure it is worth it\nBest regards!\nHaha, that is correct. It was a bit long; I did print two, which makes it a little worth it. I don’t often use the CFS though.","textCn":"3D 打印机文件 | 3MF 文件 | Bluey Buddy Flex 🐾💙 | Creality Cloud 用这个可爱的可动关节人偶把 Bluey 的顽皮精神带回家吧！🐶✨ 它带可动关节，这只小蓝赫勒犬个性十足，随时可以摆出有趣的姿势、随手把玩或用于展示。鲜艳的色彩和厚实的玩具感……*鼻子和眼睛的细节是画上去的。这个模型非常可爱！看起来很好玩。打印时间挺长的，我不会愿意等这么久，但我相信这是值得的。此致！哈哈，没错。确实有点长；我打了两个，这样多少算值得。不过我并不常用 CFS。","truncated":false,"url":"https://forum.creality.com/t/3d-printer-files-3mf-file-bluey-buddy-flex-creality-cloud/50283","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":67,"likeCount":3,"sourceType":"论坛"},{"uid":"0e560b09241f5695","date":"2026-04-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"3D Printer Files | 3MF File | Rock-a-Plant 🌿🪑 | Creality Cloud","titleCn":"3D 打印文件 | 3MF 文件 | Rock-a-Plant 🌿🪑 | Creality Cloud","originalText":"3D Printer Files | 3MF File | Rock-a-Plant 🌿🪑 | Creality Cloud\nAdd a touch of charm to your space with this adorable rocking chair planter! 🌱 Designed to mimic a cozy mini rocker, this 3D printed piece gently blends rustic vibes with modern creativity. The smooth white pot contrasts beautifully with the rich...\nIMG_20260407_052617\n*Small rubber feet are recommended for the chair.\nScreenshot 2026-04-07 085256\n{\"src\":\"","textCn":"3D 打印文件 | 3MF 文件 | Rock-a-Plant 🌿🪑 | Creality Cloud 用这个可爱的摇椅花盆为你的空间增添一丝魅力！🌱 它的设计模仿舒适的迷你摇椅，这件 3D 打印作品将质朴气息与现代创意温和地融合在一起。光滑的白色花盆与浓郁的……形成美丽的对比 IMG_20260407_052617 *建议给椅子装上小的橡胶脚垫。 截图 2026-04-07 085256","truncated":false,"url":"https://forum.creality.com/t/3d-printer-files-3mf-file-rock-a-plant-creality-cloud/50282","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":41,"likeCount":1,"sourceType":"论坛"},{"uid":"fa049fa872c9cd62","date":"2026-04-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"YOUTUBE video","titleCn":"YouTube 视频","originalText":"Here is the video my son and I made for the easter project we designed and printed together\nthe egg-celerator in print build launch","textCn":"这是我和儿子为复活节项目制作的视频，这个项目是我们一起设计和打印的，Egg-Celerator 在打印构建发射中","truncated":false,"url":"https://forum.creality.com/t/youtube-video/50259","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"90e2f3a206e15669","date":"2026-04-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Print setting Egg-celerator","titleCn":"Egg-celerator 的打印设置","originalText":"My son and my easter contest entry. and the story behind it.\nMy son had said “wouldn’t it be cool if we could shoot easter eggs”. Thats all it took to get my wheels going, a couple of prototypes (PT) later and we have the Egg-Celerator. The 1st pt had 6 parts, not easy to assemble, only 1 small spring, and the egg did not leave the barrel. Thats when my son threw in the towel. Kids today, lol. I too was going to throw in the towel but i thought what am I teaching him. So back to the drawing board (computer). PT 2 still had 6 parts some intergration was done, this time the egg popped out around a foot at the most. But seeing that my son was ready to get back into the game. So we sat down and redesigned amlost everything. He was the one who said “dad why can’t we print the 2 springs together” then as I moving the parts around in CAD, he said \" and the push rod too\". so we gave it a try and I was amazed how the part came out. So PT 3, 4 parts quickly assemble/disassemble, no additional harware. The Egg-Celerator lauches the egg 10 ft. feel free to check it out. This is why I bought a Creality Print. …","textCn":"我和儿子的复活节参赛作品，以及它背后的故事。我儿子说过：“如果我们能发射复活节彩蛋，那该多酷啊。”就这一句话就让我的脑筋转了起来，经过几个原型（PT）之后，我们有了 Egg-Celerator。第 1 个原型有 6 个零件，不容易组装，只有 1 个小弹簧，而且彩蛋没有离开炮管。那时我儿子就放弃了。现在的孩子，哈哈。我也差点放弃，但我想我在教他什么。所以回到绘图板（电脑）前。PT 2 仍然有 6 个零件，做了一些整合，这次彩蛋最多弹出一英尺左右。但看到我儿子准备重新加入，我们就坐下来几乎重新设计了所有东西。是他说的：“爸爸，为什么我们不能把两个弹簧一起打印？”然后当我在 CAD 里移动零件时，他说“还有推杆也一起”。所以我们试了试，我对零件的成型效果感到惊讶。所以 PT 3，4 个零件可快速组装/拆卸，没有额外硬件。Egg-Celerator 能把彩蛋发射 10 英尺。欢迎去看看。这就是我买 Creality Print 的原因。……","truncated":true,"url":"https://forum.creality.com/t/print-setting-egg-celerator/50260","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"sourceType":"论坛"},{"uid":"7c5c3fd519fa3fbf","date":"2026-04-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"The egg-celerator","titleCn":"鸡蛋加速器","originalText":"My son had said “wouldn’t it be cool if we could shoot easter eggs”. Thats all it took to get my wheels going, a couple of prototypes (PT) later and we have the Egg-Celerator. The 1st pt had 6 parts, not easy to assemble, only 1 small spring, and the egg did not leave the barrel. Thats when my son threw in the towel. Kids today, lol. I too was going to throw in the towel but i thought what am I teaching him. So back to the drawing board (computer). PT 2 still had 6 parts some intergration was done, this time the egg popped out around a foot at the most. But seeing that my son was ready to get back into the game. So we sat down and redesigned amlost everything. He was the one who said “dad why can’t we print the 2 springs together” then as I moving the parts around in CAD, he said \" and the push rod too\". so we gave it a try and I was amazed how the part came out. So PT 3, 4 parts quickly assemble/disassemble, no additional harware. The Egg-Celerator lauches the egg 10 ft. feel free to check it out. This is why I bought a Creality Print. It took 4 months to happen but enjoyed every minute of it and hopefully my son got some life lessons too. …","textCn":"我儿子说过“要是我们能发射复活节彩蛋，那该多酷”。就这一句话就让我的脑子转了起来，几个原型（PT）之后就诞生了 Egg-Celerator（鸡蛋加速器）。第一个原型有 6 个零件，不易组装，只有 1 个小弹簧，而且鸡蛋没能离开枪管。那时我儿子就认输了。现在的孩子，哈哈。我也打算认输，但我想到我在教他什么。所以回到绘图板（电脑）前。PT 2 仍然有 6 个零件，做了一些整合，这次鸡蛋最多弹出一英尺左右。但看到我儿子准备重新加入游戏。所以我们坐下来几乎重新设计了所有东西。是他说的“爸爸，我们为什么不能把 2 个弹簧一起打印”，然后当我在 CAD 中移动零件时，他说“还有推杆”。所以我们试了一下，我对零件的成型效果感到惊讶。于是 PT 3，4 个零件，快速组装/拆卸，不需要额外的硬件。Egg-Celerator 能把鸡蛋发射 10 英尺。欢迎去看看。这就是我买 Creality Print 的原因。花了 4 个月才实现，但我享受了每一分钟，希望我儿子也学到了一些人生课程。……","truncated":true,"url":"https://forum.creality.com/t/the-egg-celerator/50261","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":35,"likeCount":0,"sourceType":"论坛"},{"uid":"51a63dcd0a3bc09b","date":"2026-04-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Modifiers and how to use them","titleCn":"修改器以及如何使用它们","originalText":"The modifier tool is a really helpful tool in Creality Print that allows you to change settings in specific areas of your model rather than the entire print. Let’s call them “targeted tweaks.”\nSimply right-click on your model, then select Add Modifier.\nStep 1\nBy using a modifier you can change infill density to either go higher or lower; you can increase infill where strength is needed (like joints or thin parts) or reduce infill in non-critical areas to save time & filament\nBut modifiers are more than just changing infill. When working on prints that ask for more than just “one size fits all” in the settings, modifiers are great, as they add flexibility to your needs. You can fine-tune precisely where it matters, giving you stronger pieces, cleaner finishes, and better outcomes without wasting time or filament, rather than compromising over the entire model.\nModifiers are essential for functional printing like mounts, hinges, and clips. These parts often have unique stress spots that ask for more strength. …","textCn":"修改器工具是 Creality Print 里一个非常有用的工具，它让你可以针对模型的特定区域而不是整个打印件来更改设置。我们不妨称之为“定点微调”。 只需右键点击你的模型，然后选择添加修改器。 第 1 步 通过使用修改器，你可以把填充密度调高或调低；你可以在需要强度的地方（比如连接处或薄壁零件）增加填充，或者在不关键的区域减少填充以节省时间和耗材 但修改器不只是改填充。当打印件要求设置不能“一刀切”时，修改器就很好用，因为它们为你的需求增加了灵活性。你可以精确地在你关心的位置进行微调，做出更坚固的零件、更干净的表面和更好的结果，而不浪费时间或耗材，也不必为整个模型妥协。 修改器对于功能件的打印是必不可少的，比如支架、铰链和卡扣。这些零件往往有独特的受力点，需要更高的强度。……","truncated":true,"url":"https://forum.creality.com/t/modifiers-and-how-to-use-them/50241","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":859,"likeCount":7,"sourceType":"论坛"},{"uid":"23f95ede08ac71e7","date":"2026-04-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3D Printer Files | 3MF File | Emberwing Glow 🔥🦅 | Creality Cloud","titleCn":"3D 打印机文件 | 3MF 文件 | Emberwing Glow 🔥🦅 | Creality Cloud","originalText":"3D Printer Files | 3MF File | Emberwing Glow 🔥🦅 | Creality Cloud\nLet your space take flight with the Emberwing Glow ✨ A bold fusion of light and design, this 3D printed LED lamp features a striking winged silhouette and a warm glow that spills through the detailed cut-outs, casting dramatic shadows that transform...\nReally love how this came out.\nCan be printed on the K2 Plus but also on the KE. These LED lights are very affordable and easy to incorporate into designs.\n{\"src\":\"","textCn":"3D 打印机文件 | 3MF 文件 | Emberwing Glow 🔥🦅 | Creality Cloud。让 Emberwing Glow 为你的空间带来飞翔之感 ✨ 这款 3D 打印 LED 灯是光与设计的大胆融合，拥有醒目的带翼轮廓，温暖的光芒透过精细的镂空溢出，投下戏剧性的阴影，改变……真的很喜欢它的成品效果。可以在 K2 Plus 上打印，也可以在 KE 上打印。这些 LED 灯非常实惠，也很容易融入设计中。","truncated":false,"url":"https://forum.creality.com/t/3d-printer-files-3mf-file-emberwing-glow-creality-cloud/50214","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"bfe2f6984060e16c","date":"2026-04-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"software issues, beyond v 6.2","titleCn":"软件问题，v 6.2 之后","originalText":"software issues, beyond v 6.2","textCn":"软件问题，v 6.2 之后","truncated":false,"url":"https://forum.creality.com/t/software-issues-beyond-v-6-2/50194","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":110,"likeCount":2,"sourceType":"论坛"},{"uid":"6986441de90d0613","date":"2026-04-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3D Printer Files | 3MF File | Subaru Drift Tag ✨🔑","titleCn":"3D 打印机文件 | 3MF 文件 | Subaru Drift Tag ✨🔑","originalText":"3D Printer Files | 3MF File | Subaru Drift Tag ✨🔑\nCarry a piece of the legend wherever you go with this bold Subaru keyring. Featuring the iconic star cluster design in crisp blue and white, this tag is all about clean style and unmistakable identity. 🌌Lightweight yet durable, it’s perfect for keys,...\n{\"src\":\"\nLightweight yet durable, it’s perfect for keys, bags, or even as a statement piece for true fans of the boxer spirit.\nBecause every journey starts with a spark… and this one? It’s in the stars.","textCn":"3D 打印机文件 | 3MF 文件 | Subaru Drift Tag ✨🔑 带上这款醒目的 Subaru 钥匙扣，把传奇的一部分随身携带。它以标志性的星团图案呈现清晰的蓝白配色，这款挂牌讲究的是干净的风格和不会认错的身份。🌌 轻巧而耐用，非常适合挂钥匙…… 轻巧而耐用，非常适合挂钥匙、挂包，甚至可以作为水平对置发动机精神真正粉丝的宣言单品。因为每一段旅程都始于一点火花……而这一次的火花呢？就在星辰之中。","truncated":false,"url":"https://forum.creality.com/t/3d-printer-files-3mf-file-subaru-drift-tag/50136","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":27,"likeCount":1,"sourceType":"论坛"},{"uid":"0ea34dac7d23140b","date":"2026-04-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Auto Shut Off Please","titleCn":"请增加自动关机功能","originalText":"Started a print and went to bed. Woke up to a finished print and a hot printer. Turns out the printer was heating the bed and chamber all night.\nPlease add a shut off when print finishes feature.\nMy old QIDI X-Plus has this option.\nSure this isn’t a USER ERROR? All my printers stop heating hotend/bed/chamber after print is finished!\nDid you change the END-Gcode of CP?\nThanks for the insult but, according to AI Creality does not have such a feature.\nQIDI has it as a machine function on the UI.\nCreality printers like the Ender 3 series do not have a built-in automatic shut-off feature after a print completes, requiring users to implement third-party solutions for this functionality.\nThere was an Error that the print did not finish due to out of range Y Axis. But it did finish the print.\nYes, Possibly the End gcode is changed. I changed it in Orcaslicer and it worked fine. But I used Creality Print Slicer for this print. I assume the gcode is the CP End gcode.\nI would not have even asked and would have investigated further but when AI said there is not auto shut off I had to ask.","textCn":"开始打印后就去睡了。醒来时打印已完成，但打印机还是热的。原来打印机整夜都在加热热床和腔体。请添加打印完成后自动关机的功能。我旧的 QIDI X-Plus 有这个选项。确定这不是用户错误吗？我所有打印机在打印完成后都会停止加热热端/热床/腔体！你改了 CP 的 END-G-code 吗？谢谢你的侮辱，但根据 AI 的说法，Creality 没有这样的功能。QIDI 把它作为界面上的机器功能。Ender 3 系列等 Creality 打印机在打印完成后没有内置自动关机功能，需要用户自行采用第三方解决方案来实现。有一个错误说由于 Y 轴超范围打印没有完成。但它确实完成了打印。是的，可能 End G-code 被改了。我在 Orcaslicer 里改过，工作正常。但这次打印我用的是 Creality Print 切片软件。我猜 G-code 是 CP 的 End G-code。我本来不会问，而会进一步调查，但 AI 说没有自动关机，我只好问一下。","truncated":false,"url":"https://forum.creality.com/t/auto-shut-off-please/50105","productLine":"thirdparty","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":12,"views":370,"likeCount":11,"sourceType":"论坛"},{"uid":"35677375e48e1d64","date":"2026-03-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 3 S1 (STM32F401RCT6 / V24S1_301) bricked after multiple SWD flash attempts – stuck on Creality logo, no serial response","titleCn":"Ender 3 S1（STM32F401RCT6 / V24S1_301）在多次 SWD 刷写尝试后变砖——卡在 Creality logo，无串口响应","originalText":"Hardware:\nPrinter: Creality Ender-3 S1\nMainboard: V24S1_301\nSoC: STM32F401RCT6 ( Flash)\nDisplay: TJC (small flash variant)\nProbe: CR Touch (X-31.80, Y-40.50)\nHost: OctoPrint on Raspberry Pi Zero 2W\nOriginal Problem:\nCreality firmware V3.2.1 has a hardcoded bug: M420 S1 is called internally during G28, causing “Invalid mesh / Failed to enable Bed Leveling” errors when no valid mesh exists in EEPROM. SD card flashing was not possible – the bootloader silently rejected all binaries regardless of filename or folder placement.\nGoal:\nFlash mriscoc community firmware (Ender3S1-F4-20260106.bin) via SWD using ST-Link V2 Mini to permanently fix the bug.\nWhat we tried (all via STM32CubeProgrammer + ST-Link V2 over SWD):\nFlashed Creality V3.2.1 at 0x08000000 via Automatic Mode → boots once after ST-Link flash, but frozen Creality logo after cold boot\nFlashed Bootloader (STM32f401RCTx_BootLoader_v1.bin) at 0x08000000 + firmware at 0x08010000 → works once after ST-Link flash, frozen after cold boot\nPatched bootloader (byte 0x348E: 0x02 → 0x06) + firmware at 0x08010000 → same result, works once, frozen after cold boot\nmriscoc at 0x08000000 without bootloader → no serial response at any baudrate ( …","textCn":"硬件： 打印机：Creality Ender-3 S1 主板：V24S1_301 SoC：STM32F401RCT6（Flash） 显示屏：TJC（小 flash 版本） 探针：CR Touch（X-31.80, Y-40.50） 主机：Raspberry Pi Zero 2W 上的 OctoPrint 原始问题： Creality 固件 V3.2.1 有一个硬编码 bug：G28 期间内部调用了 M420 S1，当 EEPROM 中没有有效网格时导致“Invalid mesh / Failed to enable Bed Leveling”错误。SD 卡刷写不可行——无论文件名或文件夹位置如何，bootloader 都静默拒绝所有二进制文件。 目标： 通过 ST-Link V2 Mini 用 SWD 刷写 mriscoc 社区固件（Ender3S1-F4-20260106.bin），以永久修复该 bug。 我们尝试过的（全部通过 STM32CubeProgrammer + ST-Link V2 走 SWD）： 通过自动模式在 0x08000000 刷写 Creality V3.2.1 → ST-Link 刷写后能启动一次，但冷启动后 logo 冻结 在 0x08000000 刷写 Bootloader（STM32f401RCTx_BootLoader_v1.bin）+ 在 0x08010000 刷写固件 → ST-Link 刷写后能工作一次，冷启动后冻结 修补 bootloader（字节 0x348E：0x02 → 0x06）+ 在 0x08010000 刷写固件 → 结果相同，工作一次，冷启动后冻结 在 0x08000000 刷 mriscoc 不带 bootloader → 任何波特率都没有串口响应（……","truncated":true,"url":"https://forum.creality.com/t/ender-3-s1-stm32f401rct6-v24s1-301-bricked-after-multiple-swd-flash-attempts-stuck-on-creality-logo-no-serial-response/49957","productLine":"firmware","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":120,"likeCount":0,"sourceType":"论坛"},{"uid":"295f7683be3847fc","date":"2026-03-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Time lapse videos no longer available in creality print K2Pro","titleCn":"Creality Print K2Pro 中不再提供延时视频","originalText":"Does anybody else have the issue so you can no longer download the time lapse videos from Creality Print I used to work but now for some reason it doesn’t\nOn iphone, I go to print reocrd last icon under account. Change to time lapse and choose the one you want and click on the three dots … and choose save to album. No you just have to get it from you phone to computer if needed.\nI haven’t tried that but it worked fine on my pc, so I don’t understand what changed, it seems to have been removed ?","textCn":"还有别人遇到这个问题吗，就是再也无法从 Creality Print 下载延时视频了？以前是可以的，但现在不知为何不行了。在 iPhone 上，我进入打印记录，账号下的最后一个图标。切换到延时，选择你想要的，点击三个点……然后选择保存到相册。不，你只需要在需要时把它从手机传到电脑。我还没试过那个，但它在我的 PC 上运行正常，所以我不明白是什么变了，看起来像是被移除了？","truncated":false,"url":"https://forum.creality.com/t/time-lapse-videos-no-longer-available-in-creality-print-k2pro/49928","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":3,"views":116,"likeCount":1,"sourceType":"论坛"},{"uid":"020e1aa401d333bf","date":"2026-03-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"Creality Cloud","titleCn":"Creality Cloud","originalText":"Bonjour, cela fait maintenant deux semaines qu’il m’est impossible d’imprimer depuis Creality Cloud , le fichier envoie le téléchargement, mais reste à 0 %.\nJ’ai une imprimante K2\nEst-ce que d’autres personnes ont ce problème?\nuser1053815290:\nYes, I have. To test the app is the problem download Creality Print to your computer.\nAlso, flowprint seems to be more problematic than the classic version.","textCn":"你好，现在已经有两周了，我无法从 Creality Cloud 打印，文件会发送下载，但一直停在 0%。 我有一台 K2 打印机 还有其他人有这个问题吗？ user1053815290：是的，我有。要测试是不是 App 的问题，把 Creality Print 下载到你的电脑上。 另外，flowprint 似乎比经典版本问题更多。","truncated":false,"url":"https://forum.creality.com/t/creality-cloud/49943","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":2,"views":59,"likeCount":0,"sourceType":"论坛"},{"uid":"311e7b7d207ca985","date":"2026-03-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"D3P riser attachmenst Buffer mount and LED switch holder","titleCn":"D3P 增高架附件 缓冲器支架和 LED 开关座","originalText":"if your using a D3P riser and want to clean up your cabling and wiring. here are some ideas. Buffer mounts and LED switch holder. The LED is for the one D3P recommends with his prints. Its an quick print, snaps into any of the holes on the back side.\nUntitled (1)\n20260325_190627\n20260325_190541","textCn":"如果你用的是 D3P 增高架，想让线缆和布线更整洁，这里有些想法。缓冲器支架和 LED 开关座。LED 是为 D3P 推荐搭配他那些打印件使用的那款。打印很快，能卡进背面的任意孔位。 Untitled (1) 20260325_190627 20260325_190541","truncated":false,"url":"https://forum.creality.com/t/d3p-riser-attachmenst-buffer-mount-and-led-switch-holder/49879","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":33,"likeCount":0,"sourceType":"论坛"},{"uid":"71952d4d2bdfc208","date":"2026-03-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Printer is out of app. No connection futher possible","titleCn":"打印机已脱离 app，无法再建立连接","originalText":"Printer is out of app. No connection futher possible","textCn":"打印机已脱离 app，无法再建立连接","truncated":false,"url":"https://forum.creality.com/t/printer-is-out-of-app-no-connection-futher-possible/49838","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":39,"likeCount":0,"sourceType":"论坛"},{"uid":"41ca7748ea448dc7","date":"2026-03-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Maximize your print and filament, NO supports no waste","titleCn":"最大化利用打印空间和耗材，无需支撑，零浪费","originalText":"DESIGN CONCEPT\nThis is my favorite print to date! My goal was to push the Creality K2 to its absolute limits by creating a massive, tall model that utilizes nearly a full 1kg roll of filament—all on a single build plate with zero supports .\nBy nestling the three parts inside one another, I was able to maximize the K2’s build volume (260x260x254 mm) . The final assembled bunny stands at an impressive 2.17ft (660.4mm) tall . It uses 917g of filament, ensuring almost zero waste while delivering a huge physical presence.\nPurpose\nThe Large Bunny Stackable balances aesthetic charm with functional design. Its playful, interactive structure can be customized or rearranged, making it perfect as:\nA Modular Toy: Engaging and fun for kids to stack and play with.\nWhimsical Storage: A creative way to organize small items or toys.\nBold Decor: A statement piece for a nursery, living area, or creative workspace\nGet
