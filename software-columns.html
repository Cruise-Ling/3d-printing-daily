ngs in Quality section all are ZERO! Not sure whats going on.\n\n I did this struggles (not worked!):\n\n 1- I changed to old versions like: 6.0.3.1591 or 6.2.0.2827. Not works.\n\n 2- changed app language! (read somewhere)\n\n 3- Uninstalled last installed software to prevent kind of interrupts.\n\n 4- Try to add new printer in Prepare tab and Printer window.\n\n 5- Restart Rooter, Printer and changing Rooter pass!\n\nI’ve been experiencing problems with print speed after upgrading to version 6.3.0.3420. My print times increased significantly without any changes to settings or material profiles. Multiple G-code files print time increased 2 times and more.\n\n I had to roll back to the previous version. My printer is an Ender-3 V3 SE. I uninstalled the latest (6.3.0.3420), performed a clean install of 6.2.2.3204 and everything is back to normal.\n\n I would suggest always writing down the current version number before updating.","url":"https://forum.creality.com/t/settings-changing-with-v6-2-2-3203-update/44907","productLine":"print","version":"6.2.2","problemType":"other","model":"Ender-3 V3","grade":"有效","replyCount":3,"views":155,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f85ed91e31b396e3","topicId":44912,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-04","lastActive":"2025-09-04","title":"Collision in \"Print by Object\" Mode During Filament Runout","originalText":"Hi, I’ve noticed a bug in the software.\n\nWhen printing in Print by Object mode, a filament runout triggers an incorrect recovery routine.\n\n Currently, the sequence is as follows:\n\n \n \n The extruder moves to the chute.\n\n \n \n The printer waits for filament replacement.\n\n \n \n Problem: The bed is moved to Z=0.\n\n \n \n The extruder purges twice into the chute.\n\n \n \n The head returns directly to the point where the runout occurred.\n\n \n \n This direct travel path causes collisions with already printed objects.\n\n A different approach is needed to handle this scenario to prevent such collisions.","url":"https://forum.creality.com/t/collision-in-print-by-object-mode-during-filament-runout/44912","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":51,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1ede1771ec9461c0","topicId":44898,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-03","lastActive":"2025-09-03","title":"Creality Print V6.2.2.3203 Pause not working","originalText":"Trying to pause the print but does nothing when I try to Stop. I get the over the stop button.\n\n Anyone else getting this ?","url":"https://forum.creality.com/t/creality-print-v6-2-2-3203-pause-not-working/44898","productLine":"print","version":"6.2.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":41,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"c6a47258d49c36d8","topicId":44887,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-03","lastActive":"2025-09-03","title":"Settings for CRM4 on Creality Print 6.1","originalText":"What settings need to be entered for CRM4 on Creality Print 6.1 so I can use it with my printer. I installed the Creality Print but it does not work with my printer","url":"https://forum.creality.com/t/settings-for-crm4-on-creality-print-6-1/44887","productLine":"print","version":"6.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"505cc5e7904da7ef","topicId":44849,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-09-01","lastActive":"2025-09-01","title":"Creality Print 6.2 force exit","originalText":"Mac Studio M1 Ultra Sequoia 15.x what ever latest is.\n\n Creality will not exit, quit, shutdown. Must continually force it to exit, shutdown. Just did a clean reinstall from download of most recent from Creality’s site. Same thing. Creality Print icon shows active in tool bar when it should be shut down. Opposite clicking brings menu with Force quit option. That does work.","url":"https://forum.creality.com/t/creality-print-6-2-force-exit/44849","productLine":"print","version":"6.2","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7d171a50285271cd","topicId":44830,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-31","lastActive":"2025-08-31","title":"K2 Plus speed adjustment","originalText":"I am curious if their is way to adjust speed between 50^ Stable and 100% standard\n\n Also I would like think it would be nice to set the speed slower for first set of layers and continue on with other layers after that. That is what I am doing manually right now.","url":"https://forum.creality.com/t/k2-plus-speed-adjustment/44830","productLine":"print","version":"","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":1,"views":112,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"38f7100c9ed358aa","topicId":44825,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-31","lastActive":"2025-08-31","title":"K1MAX filement profiles for .08mm nozzle","originalText":"I have had a K1 Max for 9 months and I have yet to figure this out. When I print with the .04mm nozzle a print will take 4 hours, if I switch to .08, not only do I not have any filament options other then HyperPLA, the print takes an hour more. How do I get the missing filament profiles as well as my decreased printing time for the .08mm nozzle?\n\n Thanks Danny","url":"https://forum.creality.com/t/k1max-filement-profiles-for-08mm-nozzle/44825","productLine":"print","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":25,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9ee733dc98e38408","topicId":44791,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-31","lastActive":"2025-08-31","title":"Error for Ender-3 V3 KE","originalText":"Screenshot 2025-08-31 122518 1142×639 40.9 KB \n\n I keep getting this error message when I go to send a print to my ender. Originally the print would fail due to the nozzle not reaching temperature when I had the calibration on.\n\n \n \n I have since uninstalled Creality print and reinstalled.\n\n \n \n I have reset the printer.\n\n \n \n I have tried to use a USB to transfer the files, but the printer does not see the file. It does see old files on the same USB.","url":"https://forum.creality.com/t/error-for-ender-3-v3-ke/44791","productLine":"print","version":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":1,"views":30,"likeCount":0,"tags":["ender-3-v3-ke","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"a434be59ea76827d","topicId":44764,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-30","lastActive":"2025-11-20","title":"Nozzle scratch plate after update to V1.1.0.50","originalText":"Hello.\n\n Printer - Creality Hi.\n\n I had firmware V1.1.0.48, it was working perfectly. August 29 I have updated to V1.1.0.50, then I launched Autoleveling (after firmware update). And now it feels like the hotend is clinging to the plate. The first layer is smeared, even the logo on the plate is scratched. I ran the calibration again, the result is the same. Compared the printer.cfg file before and after - All values in levels became on average 0.218 smaller.\n\n Downgrade to V1.1.0.48 did not bring results.\n\n How can I fix this situation?\n\n Was:\n\n IMG_7604 847×210 44.3 KB \n\n Now:\n\n IMG_7605 868×215 44.9 KB \n\n Updated 31.08.2025:\n\n I look on my “flat plane” in fluidd (4408), and it looks like almost all points below the surface (I don’t have a perfectly flat table), but before update I had only a small hole.\n\n For the experiment, I’ll raise the z-offset, and maybe play with the foil (recommendations from Z offset not saving - #9 by Teddy_G_Limanto ). But, in reality, a new good firmware is needed. Today I rolled back to “Factory settings” - did not help. Downgraded to the 44th firmware - did not help.\n\n Maybe reason in “5. Update step-servo motor system firmware and parameters.“ (from description of 50th firmware). Because sounds of motors had changed after update. And interesting, that they don’t returned back after downgrade of firmware.\n\nI am sorry I don’t have a solution for you. I cant remember what firmware I update to (maybe v47, not sure) and then I got scratching on my build plate as well, It managed to damage two brand new build plates even after a factory reset and calibration.\n\n I pulled it all apart, and retighten everything, factory reset and calibration before each print and that seemed to fix it, but then a new software update came out and I updated…. I still not sure what caused it or what really fixed it, but I have been doing calibration before each p;rint and it has not happened again since then.\n\n I did update to V1.1.0.50 and am I getting lots of bed adhesion issues, I am now drying my PETG to make sure that is not the issue, however, I have washed my print plate before each print and still having lots of issues. (Once again, likely moisture in the petg) but only reporting it just in case it is happening to someone else.\n\nHave to say it. Had a lot of Creality Printers..The Hi is my most unreliable one \n\nWith the .48 update, I had issues with the X-limit… I checked everything, and suddenly it was fixed with the .49 \n\nI don’t think I will try the .50 then \n\n (My CR10’s, ender and K1C were perfect though)","url":"https://forum.creality.com/t/nozzle-scratch-plate-after-update-to-v1-1-0-50/44764","productLine":"firmware","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":9,"views":677,"likeCount":1,"tags":["trouble-shooting","firmware","creality-hi"],"relReason":"tag","sourceType":"用户"},{"uid":"b28100868532c329","topicId":44739,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-29","lastActive":"2025-09-07","title":"Creality Print Calibration - Retraction Tests","originalText":"Creality Please can you advise your Software Team to modify the Retraction Tests STL that is called up from the Calibration Menu drop down list.\n\nFor along time now the STL looks like someone has modified it and inadvertantly saved it.\n\n Retraction Test SS - Marked 622×451 56.2 KB \n\n The file used to only contain the 2 pilars as shown in the above image.\n\n You have a potentially good piece of software that is hampered continually by what appears to be a lack of quality Control.\n\nWhy do you think it was accidental? They changed a few other calibration tests like flow rate to new formula for interpreting results. So weird to assume it was a mistake unless you know something the rest of us don’t?\n\n I’m annoyed they have absolutely no documentation on retraction test, period.","url":"https://forum.creality.com/t/creality-print-calibration-retraction-tests/44739","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":243,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"82b6b4b58aa3812b","topicId":44723,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-28","lastActive":"2026-05-25","title":"Applying Saved Process Settings to individual objects?","originalText":"I’m in the middle of a big MultiBoard (“MB”) project. I have a bunch of MB tiles spread across a bunch of plates in a single project in Creality Print V6.2.0.2827. Having all my parts in a single project keeps me organized. Some plates are prints of single MB Tiles. Others are MB tile “stack” prints. These require different ironing settings. I have created a separate Process for stack printing vs. not stack printing. Here’s my question…. Is there anyway to apply a Process to individual objects? Or to certain plates? Or can saved Processes only be applied globally? (And your only option is to manually change object settings?). If Creality Print won’t do this, is there a way to do it in Orca?\n\n I just screwed up a 28 hour 6x stack print because I neglected to turn on ironing for a 6x stack print object. Grrrr. There has to be a better way!\n\n Side note: I’m using Creality Print on a stock K1C for all my MB plate prints. I have a second heavily modified K1C that I’m using to print other parts of this project via Orca Slicer. I like having the two separate slicers open for tracking different aspects of the project (and my settings are quite different in each project–so I’m somewhat reducing the chance of errors in settings—although apparently it’s not idiot proof).\n\n I realize I could just start a new project in Creality Print for prints that require ironing and prints that don’t, but doesn’t that defeat the purpose of calling each file a “Project”? There has to be a way to apply saved Processes to individual plates/objects?! vs. having to manually edit settings for individual Objects?\n\nI just came across this question while researching this exact issue…. @Joe_K if you are still around and about, did you ever come across a solution?","url":"https://forum.creality.com/t/applying-saved-process-settings-to-individual-objects/44723","productLine":"thirdparty","version":"6.2","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":220,"likeCount":1,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"643bd94a11361755","topicId":44717,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-28","lastActive":"2025-08-28","title":"Does latest build(s) have issue with Z Axix","originalText":"I am curious if the latest builds of Creality Print 6.2x have issues with Z axis message. I been noticing that their is a lot of issues where my K2 Plus stops with a message about Z axis and a lot of time, if I turn of the Printer and turn it back on. I also notice that recalibration resolves the issues.\n\n It just seems to get worst and worst. Today I change out the nozzle for first time because I was started getting stringing.\n\n Possiblely some issue with firsmware on the K2 Plus.","url":"https://forum.creality.com/t/does-latest-build-s-have-issue-with-z-axix/44717","productLine":"print","version":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":1,"views":26,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"210680532359dd67","topicId":44708,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-28","lastActive":"2025-08-28","title":"Filament roll replacement in middle of print","originalText":"Hello Im looking for some help on my Enders 5 plus. While printing, I have no issues. When I run out of filament in the middle of a large print. I’m able to install a new roll without moving anything. But when I continue the print. I’m about 1/16 to 1/8th off the original print, and have to scrap the piece. Any help would be appreciated.\n\n Thanks Mike","url":"https://forum.creality.com/t/filament-roll-replacement-in-middle-of-print/44708","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":50,"likeCount":0,"tags":["general-discussions","trouble-shooting","crealityprint-v5"],"relReason":"tag","sourceType":"用户"},{"uid":"3b92bee003a8a4e2","topicId":44707,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-28","lastActive":"2025-08-28","title":"Problems printing on CRM4 using Creality Print 6.1","originalText":"I saved a file under Creality Print 6.1 and when I attempt to print on my CRM4 the arm makes a grinding sound and prints in mid air half way up. I stop the print right away.\n\n How do I get Creality Print 6.2 settings set up so I can print on my CRM4? Here are some photos.\n\n If I could get some detailed help that would be great.\n\n IMG_8194 1920×2560 188 KB \n\n IMG_8192 1920×2560 662 KB \n\n IMG_8190 1920×2560 717 KB","url":"https://forum.creality.com/t/problems-printing-on-crm4-using-creality-print-6-1/44707","productLine":"print","version":"6.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4517cee97f31bb3b","topicId":44682,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-27","lastActive":"2025-09-12","title":"Cannot add Ender-5 Pro in Creality Print","originalText":"I’ve had my Ender-5 Pro for a few years, and I’ve been slicing with Creality Slicer the whole time. I was liking the ability to upload slices directly to Creality Cloud and manage my prints from the app once I got the little Creality network box (Creality Box 2.0, I think it’s called) to connect the printer to my cloud account. I’ve been missing the ability to directly upload slices to my cloud account since the function hasn’t worked for a long time, and also since Slicer hasn’t had an update in about 2 years, so I thought I’d try Creality Print. I installed the current release version, 6.2.1.3044. Well, it doesn’t see the printer on the network. The app shows me the IP address, CP doesn’t seem to see it there when I try the IP address option. When trying to manually select a printer type, the Ender-5 Pro is not listed as a selectable printer.\n\n I haven’t been able to find any information on this, and I’m not certain why the Ender-5 Pro wouldn’t be a choice for a printer in Creality’s own software. Slicer 4.8.2 has been working for me, aside from Cloud complaining about partially sliced files with the gcode it’s been creating for a while, even though there are no problems with the printing occurring, so I can just keep using it, but I’d like to see if CP works better for me overall. Is there something I’m overlooking with CP that’s preventing it from 1) finding my printer on the network, and 2) allowing me to manually select my particular printer model?\n\nSame issue here. I think we’d have to add the Sonic Pad. I did see some refurbished ones on eBay for around $50 and I may go that route.\n\nI think I figured out the issue. If what I have found is correct, it looks like it has to do with the Ender-5 Pro running on legacy Marlin gcode. I’m guessing that newer slicing software is not being designed to work with the old Marlin gcode, so they’re no longer including profiles for printers that use it. I checked a few other slicer programs, and if they provide profiles for the Ender-5 series, the Pro is not among them. This includes the current version of Cura, although they allow for adding a custom profile using legacy Marlin. So, I guess as long as I use my Ender-5 Pro, I’m stuck with using older slicing software, which is not great because I had to redesign a model that was not getting sliced correctly in the desired layout in order for it to be correctly printed. It wasn’t even a weird design, it was basically just a footing for something I’m building, rather simple in design. Oh well.","url":"https://forum.creality.com/t/cannot-add-ender-5-pro-in-creality-print/44682","productLine":"thirdparty","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":1295,"likeCount":1,"tags":["ender-5-pro"],"relReason":"category","sourceType":"用户"},{"uid":"b451993a430b33e9","topicId":44653,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-26","lastActive":"2025-12-10","title":"Bigger support tree brim in Print 6.2?","originalText":"Is there a tree brim setting in Print 6.2? Sometimes a tall support loses adhesion and I would like to add a wider brim to those supports, or have the algorithm make the base bigger on taller supports.\n\n@linky_wolfka found it in a different post: Change the size of the support brim - #9 by linky_wolfka","url":"https://forum.creality.com/t/bigger-support-tree-brim-in-print-6-2/44653","productLine":"print","version":"6.2","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":79,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"308b3a6163533702","topicId":44655,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-26","lastActive":"2025-08-26","title":"Creality Print V6.2.1.3044","originalText":"Is there a way to revert to previous versions of Creality Print?\n\n I have just installed CP Ver 6.2.1.3044 on my K1C and now for some reason the software keeps deleting all of my user presets when I close the program. \n\n I have spent hours calibrating for different filiaments and configurations only to find that all my work has been discarded. \n\n Come on Creality, sort your sh%t out, it seems like every time you add an update to CP, you mess up other areas of your software.\n\n You have some great products that are currently let down by very poor quality control of your software.","url":"https://forum.creality.com/t/creality-print-v6-2-1-3044/44655","productLine":"print","version":"6.2.1","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":71,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"59e2618bf753e06d","topicId":44650,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-25","lastActive":"2025-08-25","title":"Flatpak issues","originalText":"Minor issue I’m having currently. I run linux as my main OS, and as such am using the flatpak provided by creality. For the most part it works just fine, and functions better than the appimage I was using previously. However I’ve run into a bug thats fairly annoying. After I slice my model and move onto the preview page the info pane on the left is compressed. It blocks me from fully seeing the details such as weight and cost, and makes the check boxes for the preview unusable. Like I said, more of an annoyance than a major issue, but if anyone has run into the issue and knows how to fix it I’d be appreciative.\n\n I will note, there is no way to drag to adjust on the edge like with the print settings on the right, and there is nothing in the app settings for adjusting the ui.\n\n Screenshot_20250825_175513 467×641 51.3 KB","url":"https://forum.creality.com/t/flatpak-issues/44650","productLine":"cloud","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":295,"likeCount":0,"tags":["crealityprint","trouble-shooting","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"fea0aa4dd47ce4b5","topicId":44353,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-19","lastActive":"2025-08-29","title":"Creality edit v6.2 bug dark screen in prepare menu","originalText":"Screenshot 2025-08-19 191937 1919×1079 141 KB \n\ndark screen and cant solve even by deleting app by revo uninstaller\n\nWell, that’s new. Do any of the controls react? i.e. can you select preview or device and get any reaction from the UI? How about the filament controls? Can you change a number in that area?\n\nNO, I tried many times to install the app but it is obviously a bug, i noticed when drag right side menu and suddenly the screen appears, welcoming menu got back and this black screen appears\n\n ENDER 3 V3 KE 1920×1080 180 KB","url":"https://forum.creality.com/t/creality-edit-v6-2-bug-dark-screen-in-prepare-menu/44353","productLine":"cloud","version":"6.2","problemType":"ui","model":"Ender-3 V3 KE","grade":"有效","replyCount":5,"views":77,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"64eed47a02a93e49","topicId":44164,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-16","lastActive":"2026-05-29","title":"Change the size of the support brim","originalText":"I cannot find an option to alter the size of the brim for my supports. When I change the brim size, only the part brim size changes. I have a problem with my support falling over, so I just wanted to increase its area.\n\nAlso, I am using Creality Print 6.2.1, and I cannot find the option for Bed Adhesion, which appears in YouTube videos using Creality Print 5. Can you confirm that the bed adhesion options have been integrated into the “Others” option?\n\nI had a hard time finding Brim size too. you can find it under “other” in the slicer settings:\n\n image 877×687 53.9 KB \n\nNote there are several options. I’m guessing Auto (default) isn’t cutting it for you. You can add some width if you need it to reach your supports. I do that for tall skinny things with tree supports, to hold the tree’s up.\n\nThanks for your reply, the brim width that you’re pointing out only changes the brim width of the part. I specifically wanted to alter the brim width of the support. I can’t seem to find that.","url":"https://forum.creality.com/t/change-the-size-of-the-support-brim/44164","productLine":"print","version":"6.2.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":13,"views":1225,"likeCount":11,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8535c5fbf8f6d8fc","topicId":44183,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-16","lastActive":"2025-08-17","title":"Change the size and shape of the support brim","originalText":"Also, I am using Creality Print 6.2.1, and I cannot find the option for Bed Adhesion, which appears in YouTube videos using Creality Print 5. Can you confirm that the bed adhesion options have been integrated into the “Others” option?\n\nYes, but you need to have ‘Advanced Parameters’ turned on","url":"https://forum.creality.com/t/change-the-size-and-shape-of-the-support-brim/44183","productLine":"print","version":"6.2.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":64,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"a59ad46dff4019fb","topicId":44149,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-15","lastActive":"2025-08-15","title":"long retraction when cut","originalText":"I’m just a CFS user and would like to know when this version with long retraction when cutting will be implemented. This will help reduce filament waste when changing.","url":"https://forum.creality.com/t/long-retraction-when-cut/44149","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":54,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"325491aed35ce66a","topicId":44135,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-15","lastActive":"2025-08-15","title":"Error in saved STL file after cutting a block in creality print 6.2","originalText":"The scenario is as follows:\n\nI created a cube locally within Creality print 6.2 and expanded it to a 40x40mm cube using the scale operation.\n\nUsing the cut function, I include two connectors, one a snap in the centre, and one a frustrum plug towards a corner. Connectors are confirmed.\n\nI then confirm the cut and move the resulting top and bottom pieces around, and reorient the top (female) part so that I can see the holes.\n\nI save a single 3MF file, and also save a set of STL files.\n\nI can then restart the software and load the files.\n\n The 3MF file is fine. Two half blocks are loaded in the same location on the plate.\n\nHOWEVER, of the two STL files, the male is fine, but the female has lost her holes, and has become solid.\n\n I’ve also opened the STL files in fusion 360 and they are the same, male okay, but female is solid.\n\n (the stl file for the female is also very small (2KB) compared to the male (84KB))\n\n Hummmmm","url":"https://forum.creality.com/t/error-in-saved-stl-file-after-cutting-a-block-in-creality-print-6-2/44135","productLine":"print","version":"6.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":46,"likeCount":1,"tags":["crealityprint-v6"],"relReason":"tag","sourceType":"用户"},{"uid":"a016840d9f27b771","topicId":44115,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-15","lastActive":"2025-08-15","title":"Colour painting","originalText":"Why cant I use colours on any model using the colour pallet?\n\nI have version V6,2.1.3044\n\n But using version V5.1.7.10514 it works fine\n\n what is wrong with the new version V6.2.1.3044","url":"https://forum.creality.com/t/colour-painting/44115","productLine":"print","version":"5.1.7","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":32,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d72f343174071ea5","topicId":44051,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-14","lastActive":"2025-09-15","title":"G-code modification","originalText":"Hi everyone! I updated both the printer and the software and now printing is different so I print from a g-code. The problem is the g-code has only one object. How can I make it like 6? Can anyone here modify my gcode or tell me how to do it so it can print 6 of my object?\n\n Thanks in advance!\n\nHold CTRL and Click to select the objects on the bed that you want to duplicate \n Ctrl+C (Copy) \n CTRL+V (Paste) \n CTRL+A (Select All) \n Use the move tool to center on the bed \n Slice the bed \n Export the Gcode \n \n Would be nice to have a duplicate button on the top tool bar!\n\nI can’t duplicate on the PREVIEW screen. It is a G-code, so it only shows the PREVIEW, I can’t go back PREPARE.","url":"https://forum.creality.com/t/g-code-modification/44051","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":14,"views":275,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b4fe89c0c913ce18","topicId":44041,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-14","lastActive":"2025-08-15","title":"100% infill prints on only part of my model","originalText":"Hello,\n\n I would like to have part of my model print at 100% infill but I cannot find a tutorial or any literatrue on how to do it with Creality Print. I can only see some tutes and questions from people using Cura. I used to use Cura, but I have only just started with Creality Print since I purchased my K1C.\n\nimage 1909×1005 165 KB \n\n image 1913×1001 160 KB","url":"https://forum.creality.com/t/100-infill-prints-on-only-part-of-my-model/44041","productLine":"thirdparty","version":"","problemType":"compat","model":"K1C","grade":"有效","replyCount":2,"views":99,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"627beaaa2affd3ff","topicId":43917,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-12","lastActive":"2025-08-13","title":"Software fills in the hole in the center of item","originalText":"I’m using Creality Print 6.2.1. When I download the part in image 1, it gives me an error. When I fix it, it fills in the hole.\n\n creality_1 1221×769 98.3 KB \n\n creality_2 903×685 79.4 KB \n\nDon’t know how to fix it.\n\n BMW_Cup_Holder_Insert2-FlangeTop.3mf (3.2 MB)\n\n\" Objects isnt manifold \" means it has something like a gap , hole or overlapping triangles in the mesh etc, youll need to go into another program like blender to fix it, or maybe you can fix the filled in hole by drilling it out again in creality print once creality print has filled it in https://www.google.com/url?sa=t&source=web&rct=j&opi=89978449&url=https://www.youtube.com/watch%3Fv%3Db9dIDkIwlg4%26t%3D58&ved=2ahUKEwjp2KWjnIePAxUTxzgGHdYYImMQma4LegQICxAC&usg=AOvVaw2JeFndwXc_NAYzmHxVpmt4 havent tried it myself","url":"https://forum.creality.com/t/software-fills-in-the-hole-in-the-center-of-item/43917","productLine":"print","version":"6.2.1","problemType":"other","model":"K1 Max","grade":"有效","replyCount":2,"views":124,"likeCount":1,"tags":["trouble-shooting","creality-k1-max","creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"a046d79744acd272","topicId":43911,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-11","lastActive":"2025-08-11","title":"Turning off Auto-leveling.","originalText":"Recently, the auto-leveling is turned on for every print. Is there a setting to shut it off by default? I can shut it off on the print screen each time, but if I forget, i add a lot of time to my print. It would be nice to have a setting in the Creality Print 6.2 to turn it off by default. I’m printing on a K1-Max","url":"https://forum.creality.com/t/turning-off-auto-leveling/43911","productLine":"print","version":"6.2","problemType":"feature","model":"K1","grade":"有效","replyCount":1,"views":231,"likeCount":1,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"c4f7177f6dd26e13","topicId":43844,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-10","lastActive":"2025-08-12","title":"Firmware 3v2 sprite and cr touch","originalText":"So I have upgraded my 3v2 with sprite extruder and cr-touch auto leveling and need the right firmware as mine is not centering correctly. Board is 4.2.2 and gig chip. Any help I’d appreciate\n\nSeems the big issue is the cr touch mount that fits sits to far forward\n\nHi Ben. I upgraded my Ender3 v2 some years ago. This included adding the Sprite Pro extruder, BLTouch and other mods. I do not think there is any commercial firmware available for you mdification, I had to learn Marlin and compile my own firmware for the additions .\n\n The settings you will require for the crtouch offset are found in configuration.h files\n\n \n Some examples: \n #define NOZZLE_TO_PROBE_OFFSET { 10, 10, -1 } // Example “1” \n #define NOZZLE_TO_PROBE_OFFSET {-10, 5, -1 } // Example “2” \n #define NOZZLE_TO_PROBE_OFFSET { 5, -5, -1 } // Example “3” \n #define NOZZLE_TO_PROBE_OFFSET {-15,-10, -1 } // Example “4” \n \n \n +-- BACK ---+\n \n \n \n | [+] |\n \n \n L | 1 | R ← Example “1” (right+, back+) \n E | 2 | I ← Example “2” ( left-, back+) \n F |[-] N [+]| G ← Nozzle \n T | 3 | H ← Example “3” (right+, front-) \n \n | 4 | T <-- Example \"4\" ( left-, front-)\n \n \n \n | [-] |\n \n \n \n O-- FRONT --+\n \n \n \n */\n\n #define NOZZLE_TO_PROBE_OFFSET { -40, -35, -4.85 }\n\n Also you will have to change the feed rate of the extruder to suit the sprite.\n\n #define DEFAULT_AXIS_STEPS_PER_UNIT { 80, 80, 400, 445}\n\n The Z offset will be determined during manual calibration.\n\n This may result in the bed hitting the front of the track, Changes in configuration_adv,h may be required.\n\n \n This will allow all positions to match at compilation, however \n should the probe position be modified with M851XY then the \n probe points will follow. This prevents any change from causing \n the probe to be unable to reach any points.\n\n*/\n\n #if PROBE_SELECTED && !IS_KINEMATIC\n\n #define PROBING_MARGIN_LEFT 30\n\n #define PROBING_MARGIN_RIGHT 45\n\n #define PROBING_MARGIN_FRONT 30\n\n #define PROBING_MARGIN_BACK 45\n\n #endif \n \n My Ender 3v2 has a BTT ender 3 v3 control board therefore I am unable to give you the correct firmware file for you printer. You may have to learn marlin and compile you own firmware.\n\n Bill","url":"https://forum.creality.com/t/firmware-3v2-sprite-and-cr-touch/43844","productLine":"firmware","version":"","problemType":"other","model":"Ender-3 V3","grade":"有效","replyCount":3,"views":890,"likeCount":0,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"2048f3a360ce67e5","topicId":43492,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-04","lastActive":"2025-08-30","title":"I have to replace the nozzle every time I change filament","originalText":"I can’t figure out what I’m doing wrong. Every time I change filament I backed the old and add the new filament. Problem is the tip is automatically clogged I guess. I have to replace the nozzle before I can proceed. I’m not quite sure why it keeps showing his clogged. I’m doing something wrong but I don’t know what.\n\n I am using creality print six and only creality filament on a creality hi printeri. The filament is brand new.\n\n Has anyone a clue of what I need to look at?\n\nI am assuming you are using the unload and load commands on the printer. If not you need to or you are breaking the filament inside the hot end rather than removing the filament,\n\nIts good workflow to change nozzle if changing materials though, otherwise you need to purge new materials at previous or higher of those to nozzle to ensure everything is purge out.","url":"https://forum.creality.com/t/i-have-to-replace-the-nozzle-every-time-i-change-filament/43492","productLine":"print","version":"","problemType":"ui","model":"Creality Hi","grade":"有效","replyCount":6,"views":172,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0cd36ef56bf902f0","topicId":43452,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-04","lastActive":"2025-08-05","title":"Enabling Support, but not everywhere","originalText":"We recently experimented w/embossing our logo on the bottom of the print.\n\nBut if we enable support, the “Creality Print” slicing software fills in the lines and letters.\n\nWe do need supports on some other parts of the print.\n\n Question: Is there anyway to choose where and when the slicing software adds supports ?\n\nLike, only have supports above 3mm ?\n\n Thanks in advance.\n\nu can manually draw support in the area you need.\n\nIs this done in the slicing software ?\n\nDo you have an example on how to do that ? (Video, document …)\n\nIf I can draw, can I delete support drawn by the Slicing software ?\n\n Thanks","url":"https://forum.creality.com/t/enabling-support-but-not-everywhere/43452","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":196,"likeCount":2,"tags":["crealityprint-v6"],"relReason":"tag","sourceType":"用户"},{"uid":"6a945113d0cabd6e","topicId":43387,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-03","lastActive":"2025-08-19","title":"Creality Print latest release 6.2.1.3044 installer warning","originalText":"After running the installer I get this warning message “Creality Printer” and the buttons yes no cancel no other info. So whats about it?.\n\nWhat kind of computer do you have？windows desktop?windows laptop? iMac?macbook?linux?\n\nWindows 10","url":"https://forum.creality.com/t/creality-print-latest-release-6-2-1-3044-installer-warning/43387","productLine":"print","version":"6.2.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":3,"views":177,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d9418620a2e4ee11","topicId":43443,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-03","lastActive":"2025-08-03","title":"Creatily box 2 camera in creality print","originalText":"I have a ender v3 we and a creality box 2. The problem is that I can see the camera on the creality cloud app. And through a web page on the ceeality site but the creality cloud app on the pc won’t show the printer.\n\nAnybody know why?","url":"https://forum.creality.com/t/creatily-box-2-camera-in-creality-print/43443","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":39,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c7cc1c0409b2e809","topicId":43342,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-02","lastActive":"2025-10-06","title":"Camera on Sonic Pad in Creality Cloud?","originalText":"I have successful connected an Ender 5 S1 with a Sonic Pad and everything prints well (C Print 6.2). I have now installed a camera which shows in C Print but not in C Cloud. It says no camera is detected. Somewhat annoying since using the camera in the C Cloud App is usually how I monitor prints and its not been an issue with my K1 Max (inbuilt camera in that case). It’s a Logitech C930e camera BTW…\n\n Second odd issue is I can see the Sonic Pad connected printer in C Print, Web and the C Cloud App\n\n \n but NOT in C Cloud online ??? \n \n I did read somewhere that you needed to enable IoT in the Sonic Pad settings but that seems to have been removed in the most recent firmware. I did prematurely tell someone that the Sonic Pad was the first thing from Creality that worked out of the box (3 prior printers & a Space Pi) but getting it online - with or without camera - has killed that…\n\nMine used to work with an Ender 3 Pro and Ender 3 V3 SE but I reflashed the firmware to both and now it doesn’t see the camera anymore.","url":"https://forum.creality.com/t/camera-on-sonic-pad-in-creality-cloud/43342","productLine":"firmware","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":2,"views":111,"likeCount":1,"tags":["sonic-pad"],"relReason":"category","sourceType":"用户"},{"uid":"03c00674642fc77e","topicId":43379,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-02","lastActive":"2025-08-02","title":"Ended 3 pro w/ sprite pro extruder","originalText":"After installing the sprite pro on my ender 3 pro the screen is just black. I checked all the wires and tried to install the sprite firmware and the original firmware. I know I’m doing something wrong can someone just tell me what it is.","url":"https://forum.creality.com/t/ended-3-pro-w-sprite-pro-extruder/43379","productLine":"firmware","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":23,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"c4b836769406e33a","topicId":43368,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-02","lastActive":"2025-08-02","title":"CR10 Smart Pro Usb Camera not working with Ceality Print 6.2","originalText":"The original USB cam of my CR10 Smart Pro is not working with Creality Print 6.2.x. The camera works fine on Cloud Print on my iPhone and iPad. I tried to connect the printer with ethernet and WiFi. Any help is appreciated.","url":"https://forum.creality.com/t/cr10-smart-pro-usb-camera-not-working-with-ceality-print-6-2/43368","productLine":"print","version":"6.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":78,"likeCount":0,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"3701082eb6173f8e","topicId":43288,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-08-01","lastActive":"2026-08-21","title":"Lost the ability to import gcode files with todays update","originalText":"I have just updated Creality Print to the latest version 6.2.1.3044 and the option to import gcodes has gone when i click on File - Import at the top left of the screen.\n\nAnyone else had this happen ?\n\nI also lost the ability to open gcode files.\n\nA work around, I was able to double click on the gcode file (Showing that Creality was the default opening app) and then print my file.\n\nSame here, I went back to an old version. This sux.","url":"https://forum.creality.com/t/lost-the-ability-to-import-gcode-files-with-todays-update/43288","productLine":"print","version":"6.2.1","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":837,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c1c83501bf399241","topicId":43196,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-31","lastActive":"2025-12-10","title":"Halot Box 4.6.1.4101 stuck on \"Exporter\"","originalText":"The new Halot Box software, after slicing, keep freeze on “Exporter” e does not save the file.\n\nNo problems with the older versions.\n\nAny suggestion?\n\nApp is so unstable. Almost always unable to export + persistent problems with crashes if to go to “Supports“ tab and back to “Settings“.","url":"https://forum.creality.com/t/halot-box-4-6-1-4101-stuck-on-exporter/43196","productLine":"print","version":"4.6.1","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":156,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"72a42db5f2d8bfd0","topicId":43230,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-31","lastActive":"2025-07-31","title":"Firmware for filament runout sensor + spider hot end","originalText":"I have an Ender 3 pro with a Spider Hot end. I am trying to install a filament runout sensor, but I can’t find the firmware with both the high temp and the filament runout sensor.","url":"https://forum.creality.com/t/firmware-for-filament-runout-sensor-spider-hot-end/43230","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":69,"likeCount":0,"tags":["firmware","ender-3-pro"],"relReason":"tag","sourceType":"用户"},{"uid":"a5eaa56be9ed082f","topicId":43103,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-29","lastActive":"2026-04-12","title":"CFS reverse engineering","originalText":"github.com \n \n\n \n \n \n\n GitHub - fake-name/cfs-reverse-engineering: Reverse engineering the Creality CFS for use as a... \n\n Reverse engineering the Creality CFS for use as a general AMU/MMU system \n\n \n\n \n\n \n \n \n \n\n \n \n\n This could be interesting to see!\n\nIf there were a list of console commands in a fluid environment for printer-CFS communication, that would be useful for many users. e.g. getting humidity from CFS","url":"https://forum.creality.com/t/cfs-reverse-engineering/43103","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":564,"likeCount":4,"tags":["cfs","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"0d59c369280f0b4c","topicId":43072,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-28","lastActive":"2025-08-02","title":"Allow Price change to system preset filaments","originalText":"I’d like to see the system preset price allowed to be changed without creating a custom filament. The price used when figuring cost is off.\n\nIt really needs a much simpler system that should allow us to add the price of a drum of PLA, that would be much better.","url":"https://forum.creality.com/t/allow-price-change-to-system-preset-filaments/43072","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":142,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"876e6ef983c21234","topicId":42873,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-25","lastActive":"2025-08-09","title":"Turn \"Print Calibration\" option off by default","originalText":"Everytime i need to turn off this option\n\n Captura de tela 2025-07-25 021725 303×322 2.67 KB \n\n There is any way to make it turned off by default?\n\nI got here trying to figure out how to do this, so I guess we can only hope for the Creality team to do something about it.\n\nIt’s incredibly annoying, very unnecessary and a huge waste of time.\n\nThe last Creality Print update fix it!","url":"https://forum.creality.com/t/turn-print-calibration-option-off-by-default/42873","productLine":"print","version":"","problemType":"feature","model":"K1C","grade":"有效","replyCount":4,"views":444,"likeCount":2,"tags":["k1c"],"relReason":"category","sourceType":"用户"},{"uid":"09cf93423d6b595d","topicId":42773,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-23","lastActive":"2025-07-25","title":"Hi guys, I just just bought a K2 PLUS but can't get CURA to find the printer.","originalText":"So I used to use Cura on my CR10-S a few years ago, and came to create some keyrings etc, but the Creality slicer is very basic, I can’t even round edges on a square.\n\nWhen I try to find my printer in Cura it just says no printer exists.\n\nHas anyone managed to fix this?\n\nThanks everyone\n\nI do not use Cura, but this sounds like a more generic network problem. I might be able to help.\n\n Before we look at the network, let me offer a workaround to get you going. Export a STL or 3MF file from Cura to a USB stick. Then move the USB stick to the K2 and print from there. It is not an elegant solution, but it will get you going.\n\n Do you have a VPN running? I have to turn my VPN off to reach the K2 (even though the VPN is exempt to local traffic). If you have a VPN, try turning it off temporarily.\n\n I assume the computer running Cura and the K2 are on the same network.\n\nLocate the IP address of the K2 and verify that you can “ping” it from the computer running Cura. if you can then the connection is good.\n\n If there is a place to manually enter the IP address for a new printer in Cura, try that. Even on Creality’s Print software, I still had to enter my K2 IP address manually.\n\n That’s a start. If you have any questions or if that doesn’t work, just reply for more help.\n\nI believe cura does not have this printer profile. At least it does not have one for mine Ender 3v3plus. there. there are instructions online how to add these printers, but why bother CReality print is based on Orca I do not see real benefit to switch.","url":"https://forum.creality.com/t/hi-guys-i-just-just-bought-a-k2-plus-but-cant-get-cura-to-find-the-printer/42773","productLine":"thirdparty","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":7,"views":2794,"likeCount":4,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"4f834ef0fbd2a653","topicId":42760,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-23","lastActive":"2025-08-01","title":"CFS USES WRONG MAX VOLUMETRIC SPEED FOR PURGE SEQUENCE!","originalText":"I have a 0.2mm nozzle and im trying to print in black and white with it. However, i am unable to do so because the CFS ignores the max volumetric speed set in the slicer and instead chooses it own unchangeable value that is too high and causes the nozzle to jam!\n\n Here is a video that shows the problem.\n \n \n \n https://www.dropbox.com/scl/fi/fkzruhtlerks1pjeqknht/20250721_213127.mp4?rlkey=t0614d5iyq4m0za0pd2ziiq2y&st=gjfintlw&dl=0 \n \n \n\n Hopefully creality can at least add an option to change these values hardcoded into the CFS🙏\n\nhave you looked at the filament ramming advanced settings ?\n\n image 631×555 27.1 KB \n\n image 799×238 9.44 KB \n\n image 977×571 27.7 KB \n\n I’ve not played with that, but I understand its what you are looking for.\n\nIm gonna try this out","url":"https://forum.creality.com/t/cfs-uses-wrong-max-volumetric-speed-for-purge-sequence/42760","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":15,"views":470,"likeCount":2,"tags":["k2plus","trouble-shooting","bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"04c76fd1f5536ea9","topicId":42590,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-20","lastActive":"2025-07-20","title":"[Creality 6.2] The current account does not match the device account again","originalText":"Well, found this discussion from a few version ago\n \n \n \n \n [Creality Print V6] The current printer does not match the preset settings of the selected printer Creality Print V5 and Beyond \n \n \n Hello \nWith Creality Print V6, after slicing, when sending the print to my Ender V3, I sometimes get the following orange warning message: \n*The current printer does not match the preset settings of the selected printer \n[image] \nI have already tried searching the forums and googling but have found zero results. \nWhat does this message mean? Is this a problem? Can I do something about it? Why does it only happen sometimes? I do not understand what the “preset settings” of the selected printer ar…\n \n \n\n Has anyone found another solution to this?\n\n Removed the app data from local and tried reinstalling CP 6.2 but still get the same error. What’s even weirder is today was the first time I was able to see one of my filament presets on the printer itself when I went to change the spool in the CFS.\n\n I can’t tell if this is a bug with 6.2 or a flaw in CP’s design. I’ve noticed whenever I uninstall/reinstall it will show a prompt that an older version “is already installed” but doesn’t show up anywhere in my app list. My guess is the uninstaller and app do not adequately clear old program files.\n\n The slicer functionality is great, albeit mostly copied/universal at this point. But managing the bugs in device/user communication and management is getting aggravating. Last version kept hiding my user presets for filaments.","url":"https://forum.creality.com/t/creality-6-2-the-current-account-does-not-match-the-device-account-again/42590","productLine":"cloud","version":"6.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":84,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1f5a66ab731dd8da","topicId":42009,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-10","lastActive":"2025-09-25","title":"Black blocks instead of text in v6.2.0.2828","originalText":"I just bought a K1C and installed the latest Creality Print for the first time, yet a good portion of the text is just black blocks. This happens regardless of day/night mode. How can I fix this?\n\nRunning Windows 11 on a Ryzen 7 3800X with a 7900XT.\n\n Screenshot 2025-07-09 231955 1920×1004 77.3 KB\n\nLet me know if you figure it out having the same problem\n\nI am having this issue as well. There has been no help from creality and its a bummer when you invest north of 2k in creality and then you cant even use their software.","url":"https://forum.creality.com/t/black-blocks-instead-of-text-in-v6-2-0-2828/42009","productLine":"print","version":"6.2","problemType":"compat","model":"K1C","grade":"有效","replyCount":4,"views":207,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"44f025acaa78a729","topicId":41987,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-10","lastActive":"2025-08-08","title":"CREALITY CLOUD DOWN?","originalText":"IOT ERROR CANT CONNECT TO SERVER?\n\n298 / 5.000\n\nI got the same error message, but I think my router is the bottleneck. I’ve already tried opening various ports (80,443,123,3128,5252 etc.), but I don’t seem to have narrowed down the problem yet.\n\nI can’t even pinpoint why the firewall is restricting access to the cloud.","url":"https://forum.creality.com/t/creality-cloud-down/41987","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":84,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"5e0b3c1f9464640e","topicId":41942,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-09","lastActive":"2025-07-11","title":"Cant remove klipper or flash","originalText":"I upgraded from octoprint and stock firmware to use Klipper.\n\n Built and flashed. Printer error “cannot connect to MCU”. Did something wrong and tried to revert back to stock firmware.\n\n Using the SD card to flash no longer works. Just ignores the file. Have tried different file names, a marlin community build etc.\n\n Ok.\n\n Read the guide here about resetting a v3. My mainboard does not have tbe boot and reset buttons, or pads. Found the reset, not the boot.\n\n Ok.\n\n Got a STMcube programmer. Soldered on the header pins to the board.\n\n Great. Stm recognises the board and lets me flash. Flashed the stock firmware. Reboot. Nothng.\n\n If I minicom to the named pipe, the printer response is its stil running Klipper.\n\n Ok.\n\n Flash again using stmcube. All.logs say success.\n\n Minicom to the device still says Klipper.\n\n What is going on?\n\n Can anyone pleae help guide me to get my printer back to stock fw?\n\nI worked it out and leave this post here in case it save some other poor soul in the future…\n\n \n Full chip erase with stm3cube \n Built the creality source from scratch adding this section. The env name came from the default_envs section \n \n [env:stm32f103ret6_creality]\n\nupload_protocol = stlink\n\n \n Found the offset of my compiled firmware by running \n \n arm-none-eabi-objdump -h firmware.bin\n\n This was 0x08007000\n\n 5 flashed to this offset. The default is 0x08000000 and doesnt work\n\n And boom, printer up and runnning\n\n I found after this, stm3cube couldnt see the SWD port, unless i pulled thr reset line to ground while pressing “connect” and disconnecting within half a sec\n\n Apparently this is normal.process when its in app mode and the cheap clone stm programmer reset line doesnt work.\n\n So yeah. Got it working and have the dongle hanging out of the case and can now flash it, even if it gets bricked.\n\n If anyone ever gets stuck, send me a message and Ill try to help.\n\n The most painful part of the process was soldering the contacts on the motherboard, as it was thick and the pin hole was full of solder. I’d suggest using the clip of debug header rather than soldering on a pin header like I did, althouh I didnt have one to hand, and did have an iron, solder sucker and pin header handy.\n\n If you reading this and are in the same position as I was, good luck. You could also buy a replacement board online cheap if this process isnt sounding like fun. As it was not","url":"https://forum.creality.com/t/cant-remove-klipper-or-flash/41942","productLine":"firmware","version":"","problemType":"ui","model":"Ender-3 V3 SE","grade":"有效","replyCount":2,"views":288,"likeCount":0,"tags":["trouble-shooting","ender-3-v3-se","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"dcfbabe98295ac36","topicId":41838,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-08","lastActive":"2025-11-17","title":"Print Calibration checkbox in 6.2","originalText":"In version 6.1 the checkbox in the popup for ‘Print Calibration’ was default Off. Now in 6.2 is default ‘On’ That is very annoying. Please make is so that the last setting is remembered.\n\nI too have the same request.\n\nyes, very annoying. !!! *****@#$#@#$, this should not be this way.","url":"https://forum.creality.com/t/print-calibration-checkbox-in-6-2/41838","productLine":"print","version":"6.2","problemType":"feature","model":"未标注","grade":"有效","replyCount":9,"views":295,"likeCount":7,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"59d0bd6b228cd62d","topicId":41836,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-08","lastActive":"2025-09-22","title":"Can't print using CFS from Creality Print","originalText":"Was working fine but not anymore.\n\nIf I upload to the cloud I can print with the CFS using the android App\n\nSoftware version: 6.2.0\n\n Plz assist.\n\n tnx\n\n 2025-07-08_12-57-53 1920×1055 190 KB\n\nSame problem for me. I’ve reinstalled latest 6.1 version and it work.\n\nI’ve installed latest version 6.2.2.3204 on PC and now it works.","url":"https://forum.creality.com/t/cant-print-using-cfs-from-creality-print/41836","productLine":"print","version":"6.2.0","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":98,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"83251b52589c61b1","topicId":41628,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-04","lastActive":"2025-08-22","title":"AI Makenow error","originalText":"When you upload the image then go to the step to generate model the error is \" ai task call out limit\". It will not perform the model generation. earlier today I created a model without any issues. Is there any known limits either for time or number of models you can create?\n\nozhawk: \n \n e image th\n\n \n \n \n \n \n ozhawk: \n \n It will not perform the model generation. earlier today I created a model w\n\n \n \n There is a time limit. After you have used up the number of times, the count will reset after 24 hours and you can continue to use it. You are welcome to continue experiencing MakeNow’s tools~\n\nHello I want to use the MAkeNOW system But the System is not resetting my counter for the last 2 weeks. how do I get you to reset the counter for me.","url":"https://forum.creality.com/t/ai-makenow-error/41628","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":182,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"8d96ceb3e975645f","topicId":41540,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-02","lastActive":"2025-10-14","title":"Color painting grayed out for Creality Print 6.2?","originalText":"Creality Print recently updated to 6.2.0.2827 and for whatever reason the color painting option is grayed out. I used the tool a number of times before the update just fine. I’d click on an imported object and click color painting and then I could paint the object and match to different filament loaded in my CFS. The CFS and different filaments display in Creality Print just fine still and I can assignment a specific filament from the CFS to the entire print but can no longer seem to multi color print. Did something change and I’m doing something wrong now?\n\n \n\n Thank you!\n\nDisregard… I figured it out. Now it seems you need to hit the tiny “auto mapping” button at the right of the Filament header at the top right. Oof. Lol.\n\ni have tryed to find this color mapping button option with no success. can you send me a screen shot showing where it is please?","url":"https://forum.creality.com/t/color-painting-grayed-out-for-creality-print-6-2/41540","productLine":"print","version":"6.2","problemType":"feature","model":"未标注","grade":"有效","replyCount":6,"views":2026,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"de69173621e3420b","topicId":41466,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-07-01","lastActive":"2025-07-24","title":"How do I make CP (6.2) remember my imported filaments?","originalText":"As per the title…why does Creality Print (6.2, but 6.1 did it too) forget the filament profiles I import? I can import them just fine, and it’ll be able to use them for as long as the session is alive, every time Creality Print (re)starts I need to reimport my filaments (they’re in %Appdata%\\Creality\\Creality Print\\6.0\\user\\default\\filament just fine but for some reason are not loaded automagically).\n\n Also note that CP is on 6.2 now but the profile directory is still 6.0 (and also the installation is in %ProgramFiles%\\Creality\\Creality Print 6.1). All in all very inconsistent, but I guess building installers is not Creality’s area of expertise. Or any software, for that matter.\n\nI believe the issue is that it is tied to your Creality cloud account. Try logging out and back in. I also notice this issue when I can’t find the CFS, I will usually do this and it fixes it.\n\nhello，polarwolf！Has your problem been solved so far? Only text description, we can not clearly know your specific phenomenon, can you send me a specific video to show, my Email:zhanglu@creality.com , also I need your preset data!","url":"https://forum.creality.com/t/how-do-i-make-cp-6-2-remember-my-imported-filaments/41466","productLine":"cloud","version":"6.2","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":373,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"63abfc7950e1cc75","topicId":41243,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-06-27","lastActive":"2025-11-14","title":"Creality Print Linux Appimage v6.1.2 won't launch","originalText":"I downloaded CrealityPrint-V6.1.2.2458-x86_64-Release.AppImage and when I try to launch it, I get the following error:\n\n /tmp/.mount_CrealiVfWYPS/bin/CrealityPrint: error while loading shared libraries: libwebkit2gtk-4.0.so.37: cannot open shared object file: No such file or directory\n \n Great. I did some searching and stumbled upon, judging from the filename, a specific Ubuntu 24.02 version of the Creality Print Appimage called “CrealityPrint_Ubuntu2404-V6.1.2.2458-x86_64-Release.AppImage.” You know, it would have been nice to have been pointed to this version from the main website instead of requiring me to just happen upon it on Creality’s Github page, but anyway, I decided to give it a try and I get this error:\n\n /tmp/.mount_CrealiWk9qru/bin/CrealityPrint: error while loading shared libraries: libusrsctp\n.so.2: cannot open shared object file: No such file or directory\n \n Yes, I ensured both versions are set to be executable. Does any QA go into the Linux releases or does whoever makes this just compile and upload it?\n\nRan into same problem with both. Decided to use Ubuntu24.04 App image. Just used apt to install missing library.\n\n Use “apt search libusrsctp”. It’ll show you the package and if it’s installed. In my case it was “sudo apt install libusrsctp2” that fixed it.\n\nThanks, BeachGeek, but this isn’t working either. See, I thought the whole point of the Appimage was so that the program has all its dependencies and libraries packed in together so you didn’t have to install anything. I’ve upgraded to 6.2.0, still the same problems.\n\n CrealityPrint-V6.2.0.2827-x86_64-Release.AppImage:\n\n ./CrealityPrint-V6.2.0.2827-x86_64-Release.AppImage \n/tmp/.mount_CrealiAzmOHz/bin/CrealityPrint: error while loading shared libraries: libwebkit2gtk-4.0.so.37: cannot open shared object file: No such file or directory\n \n CrealityPrint_Ubuntu2404-V6.2.0.2827-x86_64-Release.AppImage\n\n ./CrealityPrint_Ubuntu2404-V6.2.0.2827-x86_64-Release.AppImage \n/tmp/.mount_CrealiFoGvdU/bin/CrealityPrint: error while loading shared libraries: libOSMesa.so.8: cannot open shared object file: No such file or directory\n \n Those missing shared object files are installed and on the latest versions, but I thought the whole point of the Appimage was to have everything the app needs packaged in one file to allow it to pretty much run on any version of Linux.","url":"https://forum.creality.com/t/creality-print-linux-appimage-v6-1-2-wont-launch/41243","productLine":"cloud","version":"6.1.2","problemType":"crash","model":"未标注","grade":"有效","replyCount":7,"views":2227,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"69dcd6da3391bc0e","topicId":40702,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2025-06-18","lastActive":"2025-06-19","title":"Ender 5 Max latest firmware 1.2.0.20 bugs","originalText":"Greetings\n\n I recently updated my firmware to version 1.2.0.20 and when using orca slicer, the web interface now shows 404 not found.\n\n Additionally I noticed there was a typo in the requests to download the thumbnail images for the models displayed under file in creality print when the printer is selected (missing a t in the url).\n\nCreality se nechová k ender5Max vůbec hezky.\n\nNejsou kryty, nefunguje url přístup, nepoznám vadnou serii postele, chybí profily ve sliceru-ano jsou tam dva.\n\nA spousta dalších problémů, které se neřeší.","url":"https://forum.creality.com/t/ender-5-max-latest-firmware-1-2-0-20-bugs/40702","productLine":"thirdparty","version":"","problemType":"other","model":"Ender-5 Max","grade":"有效","replyCount":2,"views":387,"likeCount":0,"tags":["trouble-shooting","bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"089bbce41635cde3","topicId":40626,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-06-17","lastActive":"2025-06-17","title":"Using a K1 Nozzle wipe build plate on Ender 3 V3 KE","originalText":"Hi, I own a Ender-3 V3 KE which uses 235mm build plate. So if I use buy a K1 build plate like this one with a nozzle wipe brush. can I use it. Is there a way to tell Creality print to add the gcode to wipe nozzle before each print in my Ender-3 V3 KE ?\n\nThank you","url":"https://forum.creality.com/t/using-a-k1-nozzle-wipe-build-plate-on-ender-3-v3-ke/40626","productLine":"print","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":99,"likeCount":0,"tags":["ender-3-v3-ke","slicingsoftware","creality-k1"],"relReason":"tag","sourceType":"用户"},{"uid":"11891db068114353","topicId":40565,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-06-16","lastActive":"2025-06-16","title":"Slicing software won't allow me to pick K2","originalText":"When I am using the phone app to slice items directly from the website. It asked me to pick a printer. The K2 is not an option. the app recognizes my K2 I can see video and send past prints. I just can no longer slice items. It gives me every other printer to choose from but the K2.","url":"https://forum.creality.com/t/slicing-software-wont-allow-me-to-pick-k2/40565","productLine":"cloud","version":"","problemType":"feature","model":"K2","grade":"有效","replyCount":1,"views":66,"likeCount":0,"tags":["k2plus","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"ec8ff97f63a15a90","topicId":39956,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-06-05","lastActive":"2025-06-13","title":"Creality Print 6 won't launch anymore (newest version as of 05/jun/2025)","originalText":"The application suddenly stopped working mid a slice, then it won’t open anymore.\n\n Already uninstalled normally, uninstalled using Revo ( completely wiping all registry and windows folders related to it ), reinstalled system drivers and redistributables related to the software, already tested the latest 5 versions, all are giving the same problem.\n\n All other slicers are opening fine and slicing fine (Orca, Prusa, Cura, even Halot)\n\n After the splash screen, the software shows only the top tabs, one time it managed to show more, then it just freezes. Already let it stay alone for 3 minutes, then nothing (I’m on m.2 NVME, every app opens in less than 3 seconds)\n\n image 1240×717 60.3 KB \n\n image 1246×712 31.9 KB\n\nIs having the same issues. Tried to install and reload multiple time. That was no help. About to just start using orca. Seems more consistent. Really thought about not deleting the old version first and now I really wish I hadn’t.\n\nI’ve tested in my wife’s notebook and my work’s PC, creality is broken in the two as well.\n\n Proabably is stuck trying to connect to a broken server or something like that.","url":"https://forum.creality.com/t/creality-print-6-wont-launch-anymore-newest-version-as-of-05-jun-2025/39956","productLine":"thirdparty","version":"6","problemType":"crash","model":"未标注","grade":"有效","replyCount":17,"views":1768,"likeCount":6,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"13a1cdfb20a0e572","topicId":39534,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-29","lastActive":"2025-07-21","title":"Ender 5 Max firmware","originalText":"Hello, I am writing here for the first time since there are not so many informations about the Ender 5 Max available online. I was wondering if there is any way to use the sonic pad instead of the nebula pad, so i can get a liite bit more acces to the printer, or if there is anything related to this in the creality roadmap for this printer.\n\nYou have prerooted firmware, so you can install helper and via helper install fluid and etc.","url":"https://forum.creality.com/t/ender-5-max-firmware/39534","productLine":"firmware","version":"","problemType":"","model":"Ender-5 Max","grade":"泛讨论","replyCount":2,"views":404,"likeCount":0,"tags":["sonic-pad","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"f53abfe0e2daffd7","topicId":39243,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-25","lastActive":"2025-12-22","title":"Where to see change logs for \"Online Params\"","originalText":"As mentioned in Title, where can I see the changes in the System Preset Parameters ? They update from time to time, but I would like to see what’s changed…\n\nHave the same question and found a similar post. We’ll see who @CREALITY answers first.\n\n \n \n \n \n Creality machine presets update Software \n \n \n Today I noticed a lot of machine preset updates in the Creality software. I updated the ones I needed for my K2 plus, but I can’t find a changelog. Is there a way to see see what has changed?\n\nFound this after some searching:\n\n \n \n \n\n github.com \n \n\n \n CrealityPrint/resources/profiles/Creality at... \n\n Contribute to CrealityOfficial/CrealityPrint development by creating an account on GitHub.","url":"https://forum.creality.com/t/where-to-see-change-logs-for-online-params/39243","productLine":"print","version":"","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":3,"views":80,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"37ce604cef52da59","topicId":38965,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-21","lastActive":"2025-07-21","title":"CP 6.1.1.2274 Refill bug","originalText":"@Lu_Zhang \n\nI just had a print stop early on printing where the printer advised the filament had run out (external reel). It had NOT.\n\n I also noticed that the blue extruder indicator was not illuminated. I ensured that the filament was pushed thru to the extruder and that the blue light illuminated. Then I extruded some filament.\n\n Then I resumed printing from the screen.\n\n Two things happened thereafter:-\n\n 1 The message that appeared on the device page of the CP 6 advising the filament had run out, even though it was printing again continued to be displayed until I closed the CP6. When I reloaded CP6 it had gone.\n\n2, The printer was printing initially from the slice at 230 degrees but after the refill it stated the temperature at nozzle was 220 degrees. Bed temperature was as expected.\n\n Lastly if the extruder motor stops (evidenced by no filament crushing / jamming / no extrusion) why does the print continue. Is it about time this was rectified. ???\n\n@ Mrburns Could you provide your device model and the firmware version? the issues 1 and 2 you mentioned should be closely related to the firmware\n\nThank you for taking this up; appreciated\n\n Device is K2 Plus Combo\n\nK2 Firmware 1.1.2.10\n\nCFS Firmware 1.1.3\n\nCP6.1.1.2274\n\nConnected via LAN","url":"https://forum.creality.com/t/cp-6-1-1-2274-refill-bug/38965","productLine":"firmware","version":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":4,"views":106,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6b0fdfbe541500f9","topicId":38871,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"DE","date":"2025-05-20","lastActive":"2026-06-10","title":"Sonic pad connection with cloud","originalText":"I’m having trouble connecting my Sonic pad to the creality cloud.\n\nAnyone who knows how to ?\n\n Worked before I did a reset when it got wrong on the printouts.\n\nKannst du mir dabei auch helfen?\n\n Ich komme soweit bis es heißt E-Mail und Passwort und dann soll ich auf Code schicken drücken und jedes Mal heißt es das es illegal sei und nicht klappt oder nicht funktioniert und selbst wenn ich dies mit meiner Handy Nummer mache bekomme ich keinen Code zu gesendet! Ich habe es heute schon 30 mal versucht! Ich bin verzweifelt und suche Hilfe besten gruß Manuel","url":"https://forum.creality.com/t/sonic-pad-connection-with-cloud/38871","productLine":"cloud","version":"","problemType":"ui","model":"Ender-3 V3 SE","grade":"有效","replyCount":2,"views":102,"likeCount":0,"tags":["sonic-pad","trouble-shooting","ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"4bec0b9938da1a76","topicId":38901,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-20","lastActive":"2025-08-29","title":"Printerkeuze in Print onvoledig","originalText":"In de Printversie zie ik nergens de Ender 6 staan, beetje vreemd want het is toch een Creality printer.\n\nIn Print 6.0 are a lot of Creality Printers visible, the Ender 6 is not there strange enough, i thought it was a creality Printer so it should be there.\n\nAnd nobody knows this incompleted version. The Creality Ender 6 doesn’t get the place in the Creality collection, even the Creality employers doesn’t give any reaction. This is not the way to make yourself popular in the 3D Printing scene.","url":"https://forum.creality.com/t/printerkeuze-in-print-onvoledig/38901","productLine":"print","version":"6.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":31,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8f76dd18b87ddcc2","topicId":38837,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-19","lastActive":"2026-10-05","title":"Creality Print Flush Into Object doesn't seem to work correctly","originalText":"I was comparing Orca and Creality Print regarding Flush Into Object Setting… and I’m have my doubts that Creality Prints handles this correctly.\n\n Orca Without a flush object… 77g flushed (multiplier 1.0)\n\n Captura de tela 2025-05-19 181657 1298×636 209 KB \n\n Also Orca, but with a flush object with Flush Into Object and Flush Into Infill Set.\n\n Down to 49g, and the object if mostly white (and that makes sense, since is the color that we need to flush more).\n\n Captura de tela 2025-05-19 181734 1282×594 248 KB \n\n Now creality Print 6.1.1.2277 without a flush object 118g flushed (default multiplier 1.3 - Creality Hi btw)\n\n Captura de tela 2025-05-19 181856 1101×921 227 KB \n\n And now with a
