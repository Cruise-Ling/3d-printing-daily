flush object… nothing has changed in the amount flushed, and the object is mostly red, brown and black.. with white only on the last layers.\n\n Captura de tela 2025-05-19 181942 1308×913 116 KB \n\n If we inspect layer by layer (layer 15 in this example), It starts printing with brown on the flush object. prints with brown my main objects… switches to white and directly print white on the main object… no white flush on my flush object.\n\n Captura de tela 2025-05-19 182457 957×798 239 KB \n\n But orca does the opposite (same layer, layer 15).. it start with brown on the main object… switches to white, and correctly flushes the white on the flush object.\n\n Captura de tela 2025-05-19 182534 1126×712 308 KB \n\n So I really think this feature is bugged on Creality Print 6.1.1.2277\n\n Am I missing something???\n\nSame issue here, regardless of using right click > Flush options> Fill into objects infill or from Flush into objects infill options under the multifilament menu, though its worth noting that selecting it by right clicking or the multifilament menu does not toggle the other also,\n\n \n Screenshot 2025-06-04 095405 1583×1003 229 KB \n\n Screenshot 2025-06-04 101445 1904×1012 217 KB \n\n Screenshot 2025-06-04 095421 1601×998 221 KB\n\nSame error here as well. Did you reach out to support?\n\n image 1920×1094 109 KB","url":"https://forum.creality.com/t/creality-print-flush-into-object-doesnt-seem-to-work-correctly/38837","productLine":"print","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":14,"views":1889,"likeCount":2,"tags":["crealityprint","trouble-shooting","bug-report","creality-hi"],"relReason":"tag","sourceType":"用户"},{"uid":"17f6fa9a1705e61b","topicId":38277,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-11","lastActive":"2026-02-05","title":"K1C Layer Number double in Creality Print Device page","originalText":"When printing the current layer displayed on the Creality Print Device page is double the number it actually is, it adds two after each level is completed. I had not noticed this until after installing the latest Creality Print update ver: 6.1.1.2274 I also recently installed the CFS accessory upgrade.\n\nDoes this problem still exist in the latest version（CP 6.1.1.2274)?\n\nYes it does.","url":"https://forum.creality.com/t/k1c-layer-number-double-in-creality-print-device-page/38277","productLine":"print","version":"6.1.1","problemType":"","model":"K1","grade":"泛讨论","replyCount":7,"views":313,"likeCount":1,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"fd678a7238891bc9","topicId":37869,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-04","lastActive":"2026-05-27","title":"Creality print Imported STL files snap back to the bed","originalText":"Creality Print 6 Imported STL files snap back to the bed level when moved up on the z axis. How can I stop this from happening?\n\nWell parts cannot be printed in the air, so at least some piece must be touching the bed. If you’re trying to stack multiple parts on top of each other you would need to merge them after importing them so they are in an assembly. You can then move them up and down as needed.\n\nI’m having the same issue. This is super annoying as some models are not merged and are supposed to be separate parts. But when one drops to the plate instead of staying where it is, it kind of ruins the print.\n\n Also, yes twistednexus, you can print in mid air. It’s called supports. I do it all the time in other slicers.","url":"https://forum.creality.com/t/creality-print-imported-stl-files-snap-back-to-the-bed/37869","productLine":"print","version":"6","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":8,"views":3651,"likeCount":1,"tags":["crealityprint","ender-3-v3-se"],"relReason":"tag","sourceType":"用户"},{"uid":"f6d85ba29f011a48","topicId":37770,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-05-03","lastActive":"2025-05-03","title":"which 4.2.7 BLTouch software do I need for ender 5 pro?","originalText":"I recently was gifted an Ender 5 Pro and it had the original 8bit motherboard and being tech savy as I am i decided I will upgrade to the 4.2.7 and also decided to install the auto level censor.\n\nI went with the CR touch and I know BLtouch firmware is still the one to use, but idk about which 3 of these I am to use. I have looked all over the internet, but nothing narrows it down for me and I dont know what adapter it is even talking about or if its something else i can look into adding. thank you\n\n Marlin2.0.1 BLtouch V1.1.1 Non-adapter board firmwareTMC2225\n\nMarlin2.0.1 BLtouch V1.3.1 with-adapter board firmwareTMC2225（temporary）","url":"https://forum.creality.com/t/which-4-2-7-bltouch-software-do-i-need-for-ender-5-pro/37770","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":211,"likeCount":0,"tags":["trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"220ae324c08aa1e2","topicId":37507,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-29","lastActive":"2026-01-09","title":"Problem selecting filament from CFS","originalText":"I have a CFS with PLA in 1-3. In the 4th slot I have PETG. No matter how I try, after slicing, the send to printer has the media set to PLA. Filament device is set to CFS. Under that it states “Please select the CFS slot corresponding to the filaments”.\n\nA black box says “PLA” and under that is the selector.\n\nThe selector show the 3 PLA and the one PETG. But the PETG is hash marked out and not selectable.\n\n How do I get this to select the filament I want to print in?\n\nIt seems to only look at Slot 1 of the 8 to pick up what filament is there.\n\nI moved the PETG to #1 and I can now select PETG.\n\nI have the same problem. Seems one should select the filament type before slicing. The print screen then only shows the slots with the same filament type to select the colour. Question is, why does the slicer only use slot 1?\n\n With 400 views why has this not received a response???","url":"https://forum.creality.com/t/problem-selecting-filament-from-cfs/37507","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":1366,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"57bd5e9ee69bbb77","topicId":37101,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-23","lastActive":"2025-04-23","title":"Ender 3 Sprite with CR Touch","originalText":"The firmware for the Ender 3 Sprite with CR Touch on a 4.2.2 board doesn’t appear to be working right. Firmware was found here.\n \n \n \n\n creality \n \n\n \n \n\n creality \n\n creality\n\n \n\n \n \n \n \n\n \n \n\n First problem right off the bat is that the EEPROM doesn’t always remember it’s settings and goes right back to default settings, which means I’m changing it from chinese back to english, then change all the rest of the settings involved with it. Doesn’t matter if I tell EEPROM to save, it will sooner rather than later forget it’s settings.\n\n The next problem is that the small wire coming from the Sprite to the CR Touch doesn’t work right. When I try to level the bed or tell the hot end to go back home, the probe doesn’t extend. I can test the probe, and it will extend and retract, but when it comes to actually extending to detect the z-axis, it would rather just grind the hot end into the plate. To avoid this I have to bypass the sprite all together and use a really long wire from the board to the CR Touch. Appears to be a software issue that has been discussed on other forms for marlin.","url":"https://forum.creality.com/t/ender-3-sprite-with-cr-touch/37101","productLine":"firmware","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":89,"likeCount":0,"tags":["trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"50c2a0ee37e9e7df","topicId":36930,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-20","lastActive":"2025-05-01","title":"New Ender 3 V3 firmware extrudes before retracting","originalText":"I updated the firmware on my Ender 3 V3 (regular) yesterday after receiving it earlier this week. I’m fairly new to this printer although I had an Ender 2 for a year and others before that. I could have sworn that when I used the retract option before upgrading the firmware it would just retract. Now it seems to extrude before retracting, has anyone else noticed this? Feels like a bug to me.\n\n I upgraded from 1.2.0.46 (shipped version) to 1.2.3.28 (latest at the time of upgrade).\n\nYes mine did the same thing after an update done months ago. I complained to Creality about the wasted filament and sent them a video of how the retract was working. Several more emails went back and forth until they finally came to the conclusion that everything was working as it should. I would have hoped the issue would be fixed by now. I resolved it by rolling the printer back to an update that worked as it should. The problem is I cannot get any new updates as I refuse to live with that issue.\n\nThat’s interesting. Doesn’t feel right to me either. TBH though, after stumbling across another thread recently about swapping filament I’ve stopped using the retract in case of gumming up the extruder cogs with soft filament. I’ve started removing the ptfe tube from the hotend, cutting the filament and extruding the last bit out rather than retracting, as suggested here, How do I Retract Filament on my Ender 3 V3? - #12 by Bonfireman","url":"https://forum.creality.com/t/new-ender-3-v3-firmware-extrudes-before-retracting/36930","productLine":"firmware","version":"","problemType":"","model":"Ender-3 V3","grade":"泛讨论","replyCount":3,"views":314,"likeCount":4,"tags":["trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"88d32742778edf32","topicId":36792,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-18","lastActive":"2025-11-20","title":"Creality Hi not showing as available printer","originalText":"Having issues with my new Creality Hi printer. When selecting a project, i go to select my Hi printer and doesnt show in list. I go into manage printer and it shows there. I removed it and re-add it only for it to show removed. If i close the app and open again, it doesnt show up again.\n\n Screenshot_20250418_132107_Creality Cloud 1080×2400 308 KB \n\n Screenshot_20250418_132148_Creality Cloud 1080×2400 266 KB\n\nDid you install the creality print 6.1 on your pc ?\n\nCould be that this has something to do with it.\n\nI did not have any problems installing and finding my High Combo on the pc and android.\n\nBut i do have creality print installed.\n\nI was having the issue with my android phone. I thought the same thing so installed newest software onto the laptop. Same issue. I can see it through the pc but still not showing on android phone and the Creality cloud app.","url":"https://forum.creality.com/t/creality-hi-not-showing-as-available-printer/36792","productLine":"cloud","version":"6.1","problemType":"ui","model":"Creality Hi","grade":"有效","replyCount":4,"views":716,"likeCount":1,"tags":["trouble-shooting","creality-hi"],"relReason":"category","sourceType":"用户"},{"uid":"77efe63b7b55d924","topicId":36622,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-16","lastActive":"2025-04-16","title":"The light off delay on Halot R6 is either bugged, or if it is working in the intented way, it is useless.","originalText":"On the Halot R6, the light-off delay happens before the build plate lifts, while the cured layer is still pressed against the FEP. This is the opposite of how most resin printers work, where the delay happens after lifting, letting the resin settle and suction release more smoothly. Because of this, increasing light-off delay on the R6 just makes the print sit stuck to the FEP longer, which actually increases adhesion and makes peeling harder. This is especially a problem with viscous or tough resins. It’s likely a firmware issue, but it makes dialing in settings way more difficult than it should be. The problem could be resolved by setting the lifting height heigher, but the device limits it at 5 mm, which is not enough.","url":"https://forum.creality.com/t/the-light-off-delay-on-halot-r6-is-either-bugged-or-if-it-is-working-in-the-intented-way-it-is-useless/36622","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":133,"likeCount":0,"tags":["trouble-shooting","bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"a13bddc2cef023ab","topicId":36345,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-13","lastActive":"2025-04-13","title":"Creality print 6.1 supports","originalText":"So I did an 11 hour print today. And it came out flawless. But unfortunately after it printed the supports were so badly stuck to the print it broke off a lot of the model. And one thing I noticed is in creality 6.1 for the k2 the tree support branch density is missing. So how do I now make the supports weaker so they aren’t as Glued to the model? I already made the z distance pretty far away and they still were Glued to it.\n\nI’m using tree(manual), organic, from build plate only, remove small overhangs.\n\nWith bridges somewhere works nice.\n\n Tree_supports 1920×1194 204 KB","url":"https://forum.creality.com/t/creality-print-6-1-supports/36345","productLine":"print","version":"6.1","problemType":"","model":"K2","grade":"泛讨论","replyCount":2,"views":213,"likeCount":0,"tags":["general-discussions","k2plus","trouble-shooting","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"e252bf6168496808","topicId":35959,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-04-08","lastActive":"2026-09-11","title":"Creality Scan with Linux?","originalText":"Hey Creality!\n\n I was gonna pull the trigger on the RaptorX 3D Scanner today, but then i realized Creality Scan does not support Linux.\n\nIs there any plans to support it in the future?\n\nYes please I would love this as well. I have a ferret scanner and it is extremely annoying having to go from my regular computer to one that has windows.\n\nLooking forward for Linux tooo. Becouse of that i didn’t buy yet the Scanner. I saw the new one(Sermoon S1) very cool.","url":"https://forum.creality.com/t/creality-scan-with-linux/35959","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":24,"views":4650,"likeCount":80,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6419b6f5b1f62534","topicId":35120,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-30","lastActive":"2026-03-26","title":"Very long startup before print","originalText":"Ok, so this is my first Creality, but what’s with the 5 minutes of printer self-checking before a print starts. I’ve got calibration turned off (CFS turned on), but it still goes through 5 minutes (timed) of moving the gantry and head around the place before it settles down to a) check filament then b) start printing.\n\n If I turn calibration back on then it’s another few minutes while it does a multi-point check of bel height - at least that bit I understand (coming from a Prusa MK3S+)\n\nThis is both pre-sliced (poop-deflector) and newly-sliced in CP6.0.5.1840\n\nI agree. I have the Hi Combo… Even on a single color print AND Calibration turned OFF… it takes 9 MINUTES for the print to even start. It seems to purge a couple of times even tho it is on a single color. It raises to the top 2 times.\n\nThis is ridiculous.\n\nOnce the print starts… it is FAST. But dang… waiting for it to start is beyond frustrating.\n\nYup, mine heats, reheats, is at 0% then goes for another loop… 4 minutes later it starts printing.\n\n I see that the first post was in March, yours was in Aug. Is anybody out there?\n\n Surely this is an easy firmware fix?","url":"https://forum.creality.com/t/very-long-startup-before-print/35120","productLine":"firmware","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":9,"views":1406,"likeCount":3,"tags":["creality-hi"],"relReason":"category","sourceType":"用户"},{"uid":"9c608cdd2dc32c17","topicId":34692,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-25","lastActive":"2026-01-31","title":"Creality Print 6.0.4, gcode viewing","originalText":"Hi,\n\n \n I have a new ver. of creality Print 6.0.4. slicing of model with ABS profile with 80% infil and other settings are working perfectlu fine and around 10 printes are success. while opening the .gcode file of same model the slicer crashes with error. can some one conform if the same error is getting with others as well? \n how to enable mouse zoom feature so that it zoom to the area where pointer is placed instead of in center?\n\n[quote=“Sandeep_Mathur, post:1, topic:34692”]\n\n \n I have a new ver. of creality Print 6.0.4. slicing of model with ABS profile with 80% infil and other settings are working perfectlu fine and around 10 printes are success. while opening the .gcode file of same model the slicer crashes with error. can some one conform if the same error is getting with others as well? \n how to enable mouse zoom feature so that it zoom to the area where pointer is placed instead of in center?\n\n[/quote]Can you send your model source file to my email? It’s best to go with the operation video, and we’ll help you solve the problem. my Email: zhanglu@creality.com\n\nSandeep_Mathur: \n \n how to enable mouse zoom feature so that it zoom to the area where pointer is placed instead of in center?\n\n \n \n question 2:\n\n image 1220×771 78.3 KB","url":"https://forum.creality.com/t/creality-print-6-0-4-gcode-viewing/34692","productLine":"print","version":"6","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":161,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b9e85b2340fa5001","topicId":34217,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-19","lastActive":"2026-01-31","title":"Include Ender 3 V2 in Creality Print","originalText":"Why they not include the Ender 3 V2 and Neo on the Creality Print but the include the stock Ender 3\n\nI have the same question…I’m running klipper fine but can’t see the printer in 7.0.0.X","url":"https://forum.creality.com/t/include-ender-3-v2-in-creality-print/34217","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":88,"likeCount":0,"tags":["crealityprint-v6","ender-3-v2"],"relReason":"tag","sourceType":"用户"},{"uid":"d2f940fae538907e","topicId":34061,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-18","lastActive":"2025-10-07","title":"CFS integration with Orca Slicer","originalText":"Hi all, in common with many in the community, I’m finally going with the flow and switching to Orca Slicer (fed up with printer vendors locking us into their inferior ports of Orca - what a waste of resources!!). HOWEVER, it doesn’t seem to be able to integrate with the CFS (it talks to the printer fine, thanks to Creality using a reasonably standard Klipper firmware port). Has anyone found or written a plugin or extension to Orca to integrate with the Creality CFS?\n\nUpdate to the above: actually, integration with CFS is better than I thought! It seems one can add material “slots” to Orca, and specify the loaded filament manually, in the same way as one does with Creality Print (I can now see how little they’ve changed CP from the upstream Orca). So, it looks like Orca does just about everything I need it to do - the one thing I haven’t tested is whether it will switch to an alternate filament reel when the current one runs out - that’s a feature of the CFS I really want to use, so I’m hoping it’s a facet of the printer firmware, not the slicer.\n\nHi, note if you haven’t seen this yet, Orca has “beta” and other newer versions than their last official release. May want to consider one of these newest versions as there are surely some updates for this printer in particular.\n\n \n \n \n\n GitHub \n \n\n \n \n\n Releases · SoftFever/OrcaSlicer \n\n G-code generator for 3D printers (Bambu, Prusa, Voron, VzBot, RatRig, Creality, etc.) - SoftFever/OrcaSlicer","url":"https://forum.creality.com/t/cfs-integration-with-orca-slicer/34061","productLine":"thirdparty","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":10126,"likeCount":4,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"48bdba0428f517f3","topicId":33697,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-13","lastActive":"2026-04-01","title":"How do I set 3 Wall perimeter?","originalText":"How do I set 3 Wall perimeter? Could not find this setting\n\nIn the Processes area, the Strength tab, Wall Loops is the same thing as Wall Perimeter. Just put the number of walls you want in there. In your case 3. If you want 4 wall perimeters, enter 4 for the Wall Loops value.\n\nStrength>walls>wall loops\n\n image 1920×1152 218 KB","url":"https://forum.creality.com/t/how-do-i-set-3-wall-perimeter/33697","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":4,"views":439,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"aacc2d37af9d9345","topicId":33472,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-11","lastActive":"2026-01-27","title":"How do I set bed temperature in Creality Print?","originalText":"Hi, I cant see this question on here, so sorry if i missed an answer to this already.\n\n Im trying to figure out how to set the bed temperature when using Creality Print.\n\nOne of my prints keeps pumping up the bed temperature to 70 degrees when all the others print fine at 50 degrees.\n\nIve tried looking for some ability to set the bed temp, but im not seeing anything,\n\nCan anyone point me at the relevant setting please?\n\n Im very new to 3d printing, so please explain it in a way even a total novice would understand.\n\n Thanks for any help!\n\nSetBedTemp 1920×1080 200 KB \n\n Bill\n\nAh, interesting. Thanks, Bill.","url":"https://forum.creality.com/t/how-do-i-set-bed-temperature-in-creality-print/33472","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":9893,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d61efdf4fe23bac9","topicId":33429,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-10","lastActive":"2026-01-27","title":"How do I set up Creality Print for Hyper PETG filament","originalText":"The label on the filament reel says Speed 30-600; Temperature 220-260; Bed 60-80; Fan 50%.\n\nCreality Print has values for Softening Temperature, Recommended Nozzle temperature, etc. Print & Bed Temperature take values for first layer and other layers, how do I specify these values based upon the data on the label?\n\nThanks in advance,\n\nSteve\n\nMake sure your logged into Creality account on home page\n\n Is it Creality Hyper Petg - yes then\n\nIf using via CFS then the rfid will set it within CP6 and printer when you synchronise\n\nIf no then on the prepare tab select one of the filament names and hit the pencil icon. you will then be able to select Creality/Generic etc followed by Petg etc.\n\n If it does not exist choose generic Petg then change parameters and save as - Ensure you save as to USER with a decent description.\n\nThanks, I don’t have CFS.\n\nWhat I need to know is what to change the parameters to, based on the values on the reel","url":"https://forum.creality.com/t/how-do-i-set-up-creality-print-for-hyper-petg-filament/33429","productLine":"print","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":6,"views":4941,"likeCount":0,"tags":["ender-3-v3-ke"],"relReason":"category","sourceType":"用户"},{"uid":"6332070a74714588","topicId":33427,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-10","lastActive":"2025-03-10","title":"CP v6.0.4.1793 - Logging in Via home page in CO6 - Crazy","originalText":"@Lu_Zhang \n\n When I click login on the home page it opens up a web page where I can login or scan QR via app; however it then loads another instance of the program. Crazy.\n\n In addition there is no mechanism to ensure “stay logged in”, hence I never know if I am logged in or not without then defaulting to the home page and then signing again as above; again crazy.\n\n has to be a better way - like logging in within CP6","url":"https://forum.creality.com/t/cp-v6-0-4-1793-logging-in-via-home-page-in-co6-crazy/33427","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":64,"likeCount":1,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"ecca07ddcefec053","topicId":33256,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-03-08","lastActive":"2025-03-08","title":"User Filament synchronization from CP6 to K2 Plus","originalText":"@Lu_Zhang \n\nHi there,\n\nIs it possible to synchronize user filaments from the CP6 to the K2 plus printer filament settings dashboard screen dropdown? Currently it shows Creality/Generic/Esun\n\nIf not can this be looked as a feature request ?\n\nThanks","url":"https://forum.creality.com/t/user-filament-synchronization-from-cp6-to-k2-plus/33256","productLine":"print","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":51,"likeCount":0,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"cdddad2908c76bd1","topicId":32466,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-02-27","lastActive":"2026-02-26","title":"Creality Print error","originalText":"*Creality Print camera function does not currently support devices that are only bound to Creality Cloud\n\n Anyone have an idea on how to fix this, ot even what this is?\n\nSame issue since the last update of the creality print on my P(6.1.0.2041). It worked in the past… By the way, it works using my smartphone… so strange, no ?\n\nAnybody have an idea ?\n\nHello have you got this fixed","url":"https://forum.creality.com/t/creality-print-error/32466","productLine":"cloud","version":"6.1","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":576,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"dfc5f4c5e6a6c6f2","topicId":32338,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-02-26","lastActive":"2025-02-26","title":"Nozzle crash into edge of bed on retry - Bent nozzle and damaged bed!","originalText":"Last night I had a nasty, but brief nozzle crash into the edge of the build plate!\n\n I had a filament jamming warning (Between CFS and K2), I pressed retry (as I have many times before without issue) and for some reason the hot end waited to cool, then it re heated to 260. It then launched into the edge of the bed. I then got a “2016 Unknown Exception” error, though the printer just carried on printing at the correct height (about 25mm above the bed). Sadly though, the Y axis was now offset by about 1 - 2mm. as the crash had bent the nozzle.\n\n A few layers later, after resuming it then crashed out and stopped with “XS2353 System Error, try restarting”\n\n The printer offered to resume on restart, but the print was messed up already, so I aborted.\n\n My guess is there is a firmware “issue” on pressing retry. Though this usually works. I’ve report it to Creality and am waiting for a response via the App and via WhatsApp. Nothing so far from support! Obs it is still under warranty.\n\n Only minor damage to build plate, but nozzle is destroyed, hopefully hot end assembly is okay. Next prints with new nozzle seem fine so far.\n\n Anyone shed any light, or have this experience?\n\n 2016Exception 1819×1024 91.1 KB \n\n BedDamage 1024×1819 226 KB \n\n BentNozzle 1819×1024 84.3 KB \n\n SysError 1819×1024 82.4 KB","url":"https://forum.creality.com/t/nozzle-crash-into-edge-of-bed-on-retry-bent-nozzle-and-damaged-bed/32338","productLine":"firmware","version":"","problemType":"crash","model":"K2","grade":"有效","replyCount":1,"views":197,"likeCount":0,"tags":["k2plus","trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"9392d675d1be3778","topicId":30573,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-02-08","lastActive":"2026-09-16","title":"Filament Spool Mounting Alternative","originalText":"Like most people who own any of the Ender series printers, the side spool mount doesn’t really work well. It would constantly get jammed/tangled, preventing the filament from feeding. I was tempted to print the mount for the top but the top of my desk prevents that from being an option, so I went a different route.\n\n If you have a spare lazy susan or record player/turntable laying around that’s not being used, place the spool on top of it (horizontally) and let it go.\n\n Now if this has already been said/recommended before, I apologize, I just felt the need to share.\n\nThis is such a frustration on this printer. Of the two major flaws with this printer, this one bothers me the most.","url":"https://forum.creality.com/t/filament-spool-mounting-alternative/30573","productLine":"print","version":"","problemType":"","model":"Ender-3 V3","grade":"泛讨论","replyCount":2,"views":126,"likeCount":0,"tags":["ender-3-v3","trouble-shooting","filament","general-discussions","crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"cffeb683426d3631","topicId":30453,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-02-07","lastActive":"2026-08-30","title":"Creality Print V5 and Beyond","originalText":"Dedicated section for Creality’s software, focusing on Creality Print V5 and Beyond . Everyone can discussion all topics related to these models.\n\nHello,\n\n Well, for starters …\n\n Creality Print version 6 “Problems” \n Other than that, have a good look through YOUR forum. There are plenty of complaints !!!\n\n Cheers.\n\nPlease add a support blocker, when making helmets its supports and making the printer time more and using a lot of filament for support,\n\n If put a support blocker like cura has, it will cut on time and filament usage when you have a support blocker\n\n Thank you very much\n\n Tomas Garcia","url":"https://forum.creality.com/t/creality-print-v5-and-beyond/30453","productLine":"thirdparty","version":"5","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":480,"likeCount":0,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"2ce089f6ddee0f2d","topicId":29724,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-31","lastActive":"2026-04-10","title":"Creality Print 6, don't loading filament start gcode","originalText":"It seems that the commands entered in the filament profile in “start gcode” session, are not loaded correctly into gcode.\n\n I was only able to find them as comments at the end of the gcode file.\n\nI confirm the same problem with version 1574\n\nI’m using creality print V7.1.0.4414 and can confirm that the problem still excists. The filament start gcode is not picked up the first time. So, when printing in 1 color, no start gcode is found in the print gcode. When printing with multiple colors, the start gcode from the first color is missing. This is a bug that exists more than a year, so can this been looked at?","url":"https://forum.creality.com/t/creality-print-6-dont-loading-filament-start-gcode/29724","productLine":"print","version":"6","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":98,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b80bc18ae77696fa","topicId":29756,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-31","lastActive":"2025-12-15","title":"Creality Print V6.0.2.1574 Custom Filament issues and printing with K2 PLUS and CFS. HELP PLEASE","originalText":"I am new to Creality, but not new to coding and printing. the K2 plus is great, however the slicer does not seem to be friendly. It may be user error. When I try to make a custom filament with color, bed temp with the CFS auto mapped, I have issues when selecting a custom filament.\n\n I can set it up, create it as a user preset, but when I select the correct filament such as custom PLA +, with any update or change in filaments on a custom preset, I get the following message:\n\n <del>**\"Please select the CFS slot corresponding to the consumables*There are consumables without mapping, only support sending\"**<\/del>\n \n Creality software example no print 806×296 66.9 KB \n\n Screenshot 2025-01-31 054431 354×1080 12.8 KB \n\n I then cannot select the CFS slot to send for printing with those parameter.\n\nI notice there is a space between PLA and + in the “Sunlu PLA +” name. Could this be the reason?\n\nNo just changed it that’s not it","url":"https://forum.creality.com/t/creality-print-v6-0-2-1574-custom-filament-issues-and-printing-with-k2-plus-and-cfs-help-please/29756","productLine":"print","version":"6","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":16,"views":3762,"likeCount":1,"tags":["trouble-shooting","filament"],"relReason":"category","sourceType":"用户"},{"uid":"373a30558de8651b","topicId":29115,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-25","lastActive":"2026-05-15","title":"Creality Print V 6.0.2.1574 - Filament Start G-Code not inserted into G-Code file!","originalText":"I am using (on Orca) for some filaments which require a higher z-offset the filament-Start & End-G-Codes to define this speciality.\n\n Example of change I do:\n\n 2025-01-25_153121 1424×784 147 KB \n\n In Orca slicer I had never a problem with that but in CP6 I find in G-Code only the FIlament End G-Code, but never the Start-G-Code!\n\n p.s.: The feedback link which is in CP6’s help menu linkls to an outdated page and CP http://as.cxswyjy.com/slice/#/OnlineSupport?serverEnv=1&language=en&software=CrealityPrint&version=1.9.350&deviceId=A0A399E66AB1830CD6AF875258ED15CF \n\n I hope that Creality people watch this forum as well because their other ways of providing customer support are really bad!\n\ni’m experiencing the same bug.\n\nThe start-gcode is only included like comments on gcode.\n\nSame Problem here for Spoolman\n\nSET_ACTIVE_SPOOL ID=4\n\nCLEAR_ACTIVE_SPOOL\n\nboth dont work","url":"https://forum.creality.com/t/creality-print-v-6-0-2-1574-filament-start-g-code-not-inserted-into-g-code-file/29115","productLine":"thirdparty","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":6,"views":452,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1a8663ea5465c64f","topicId":29124,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-25","lastActive":"2026-04-14","title":"Use of subdirectories on printer with creality print","originalText":"Hello,\n\n I’m missing a key feature in creality print, the use of subdirectories to keep track of where to find your prints without having to scroll through and endless list of files…\n\n I know that If I root my K1-Max and use Fluidd, I will be able to create subdirectories and put my file there. Easy to find when I want to print them again.\n\n Why is Creality Print not able to create subdirectories and put my files there? Now I have to “export” them and upload them while using Fluidd… I know the printer is able to recognize subdirectories and print the files that are in these subdirectories.\n\nNo comments in over a year…","url":"https://forum.creality.com/t/use-of-subdirectories-on-printer-with-creality-print/29124","productLine":"print","version":"","problemType":"feature","model":"K1","grade":"有效","replyCount":2,"views":45,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9b2483f2592b2771","topicId":28899,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-23","lastActive":"2025-11-08","title":"[Creality Print V6] The current printer does not match the preset settings of the selected printer","originalText":"Hello\n\n With Creality Print V6, after slicing, when sending the print to my Ender V3, I sometimes get the following orange warning message:\n\n *The current printer does not match the preset settings of the selected printer\n\n \n\n I have already tried searching the forums and googling but have found zero results.\n\n What does this message mean? Is this a problem? Can I do something about it? Why does it only happen sometimes? I do not understand what the “preset settings” of the selected printer are versus how the current printer could match them. Are they uploaded and stored on the printer? Are they automatically overridden by the preset settings? Then why even inform me with such a message?\n\n This message is extremely confusing and colored like an issue or error that needs solving. Please explain in detail what it means and what to do when it appears.\n\n Thank you kindly,\n\nRain\n\nensure your filament selection and settings match the machines filament settings when you load filament in the machine\n\nI’m having the same issue. Could you please explain exactly what you mean by matching filament settings?","url":"https://forum.creality.com/t/creality-print-v6-the-current-printer-does-not-match-the-preset-settings-of-the-selected-printer/28899","productLine":"print","version":"6","problemType":"compat","model":"未标注","grade":"有效","replyCount":23,"views":7364,"likeCount":9,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"9e59ebb629db79cd","topicId":28928,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-23","lastActive":"2025-05-12","title":"Creality Scan: Feature Request RGB Color Output","originalText":"As a user of the Creality Raptor, I want the ability to export the raw RGB camera feed as a video/image set from a scan so that I can manually retexture areas with artifacts and explore new texturing methods (e.g., Gaussian Splatting , Gaussian Sugar ).\n\n \n Context / Rationale \n\n \n The built-in texturing system is convenient and often works well, but sometimes artifacts appear, or the texture quality is lower than the mesh quality. \n Exporting the raw RGB video would let users retexture problem areas directly. \n Developers could also leverage this data to create advanced texturing methods. \n Currently, retexturing requires a separate camera, but direct access to the scanner’s RGB feed would speed up the process significantly. \n \n \n Proposed Enhancements \n\n \n \n Video Export of Raw RGB Feed \n\n \n Provide an option to export the camera’s raw RGB feed as a video during or after scanning. \n \n \n \n COLMAP-Type File Generation \n\n \n Generate a COLMAP or similar format file that contains frame positions, using the scanner’s known camera positions. This would simplify retexturing and 3D reconstruction in external tools. \n \n \n \n Support for Gaussian Splatting \n\n \n With access to the point cloud and multiple sampling steps from the RGB camera, theoretically enable or facilitate Gaussian Splatting directly in the scanning workflow. \n \n \n \n \n Benefits \n\n \n Improved Textures : Allows users to fix artifact-prone areas or enhance textures with sophisticated methods. \n Streamlined Workflow : Eliminates the need for separate cameras or complex setups. \n Innovation : Opens the door for software developers to build and integrate advanced texturing solutions. \n \n \n Additional Notes \n\n \n The quality of the 3D point clouds is already excellent, and these features would further improve the overall user experience. \n I appreciate the hard work from the team!\n\nI can suggest using various smart filtering methods or AI to process redundant data from different angles, to reduce noise and automatically validate texture data. The texturing quality could be taken to the next level","url":"https://forum.creality.com/t/creality-scan-feature-request-rgb-color-output/28928","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":166,"likeCount":1,"tags":["raptor","3d-scanner","feature-need"],"relReason":"weak+context","sourceType":"用户"},{"uid":"17ebce2dd10ee629","topicId":28797,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-22","lastActive":"2026-01-01","title":"Creality Print version 6 \"Problems\"","originalText":"Hello all,\n\n I have created this thread with the hope ALL mentions of problems found when using CP version 6 can be written here.\n\n At present, there are so many new posts scattered around the place over many days, often by people that think they are the only ones having a problem with it.\n\n I am sure this thread will keep it self toward the top by it self and be seen …\n\n Cheers\n\nAfter slicing an STL file and sending it to the printer, the printer starts printing another previous print.\n\nVersion 6.02.1574\n\nBefore, I had a few printouts that worked. The problem occurred all of a sudden and continued even after restarting the program and also the computer\n\nWell Creality Print is currently at version 6.0.2.1574 … … up from version 6.0.0\n\n I guess that when it gets to version 6.6.6 it will be a devil of a program","url":"https://forum.creality.com/t/creality-print-version-6-problems/28797","productLine":"print","version":"6","problemType":"","model":"未标注","grade":"泛讨论","replyCount":71,"views":6060,"likeCount":24,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d8519c1b3fb4238c","topicId":27389,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-11","lastActive":"2025-10-25","title":"In creality print 6.0 and web interface, \"Z-\" is making ender 3 v3 ke hotend go UP not Down, in creality 5 and in nebula pad all is normal","originalText":"as said in title, in creality print 6.0.1 and web interface by the ender address, the behavior of the buttons of the z axis is reversed. As you cann see in the attached video, Z- / Z↓ is making the head go UP instead of down, and Z+ is making it go down.\n\nI got this problem by surprise TODAY, since i’ve been controlling my printer from creality 6 and web interface just fine for weeks, and it made my printer hit the hotend against the bed pretty badly.\n\n In creality print 5, it is behaving normally, in the nebula pad as well. Z+/Z↑ makes it go up, z-/z↓ down.\n\n Firmware is the latest, i did not do any modification whatsoever to the firmware, printer is unrooted.\n\n \n \n \n Please check this, that can have pretty serious consequences for other users if not fixed\n\nIssue was resolved after some updates from version 6.2 onwards","url":"https://forum.creality.com/t/in-creality-print-6-0-and-web-interface-z-is-making-ender-3-v3-ke-hotend-go-up-not-down-in-creality-5-and-in-nebula-pad-all-is-normal/27389","productLine":"firmware","version":"","problemType":"ui","model":"Ender-3 V3 KE","grade":"有效","replyCount":2,"views":138,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"7314e783da9c6d79","topicId":27254,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-10","lastActive":"2025-08-08","title":"Are servers down? Can't bind to cloud","originalText":"I’m currently getting a n error when trying to bind to the creality cloud. “IOT initialization failed, check server settings”. Are the cloud servers down right now or something?\n\nLooks like that. There are no warnings or messages about it in my personal account\n\nI had a heck of a time tonight. I’ve only had my printer for a week, and this is my first ever printer, so I figured I was doing something wrong. I’ve had zero issues until tonight. Turned it on and it wouldn’t connect. Powered off and on several times. Logged in and out of my phone app. It just finally worked. I was able to get something started printing, but it still keeps disconnecting from my app.","url":"https://forum.creality.com/t/are-servers-down-cant-bind-to-cloud/27254","productLine":"cloud","version":"","problemType":"other","model":"K1","grade":"有效","replyCount":12,"views":2150,"likeCount":1,"tags":["trouble-shooting","creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"a67a6ec5298e4120","topicId":26745,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-01-05","lastActive":"2025-05-01","title":"CP V 6 - an improvement to the control of Active chamber temperature","originalText":"At present you can:-\n\n1 Manually set chamber temperature before print (from K2 screen)\n\n2 Setting Print off (from CP V6 or other)\n\n3 Set chamber temperature after print (from K2 screen)\n\n4 Manually switch off chamber temperature. (from K2 screen)\n\n The marketing suggested users had control of chamber temperature in order to improve print quality but at present with active chamber temperature it takes ages to reach desired temperature therefore making this feature less than advertised. The only remedy is to action the above manually at present.\n\n I recognise the chamber heater is not that powerful and therefore automating the above would allow better control day or night.\n\n I suggest the ability to automate this within the active chamber control on the filament page.\n\nfor example:-\n\nPartially related the Qidi Plus 4 printer had a problem with the Solid State Relay (SSR) where it would burn out in 115V countries, was fine in 230V (half the current). To fix it there was a new firmware written to lower the current draw as a temporary fix. Since then a new uprated SSR has been used to return to the correct output. Wondering if an upgraded SSR for the K2 would allow the higher temperature.\n\nBonfireman: \n \n Wondering if an upgraded SSR for the K2 would allow the higher temperature.\n\n \n \n That makes sense, maybe @CREALITY could give it a look at ?","url":"https://forum.creality.com/t/cp-v-6-an-improvement-to-the-control-of-active-chamber-temperature/26745","productLine":"firmware","version":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":14,"views":1175,"likeCount":1,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"6c5a0550a94e8316","topicId":25830,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-12-30","lastActive":"2026-07-30","title":"Saving your file as a g-code","originalText":"This is my first time 3d printing I am using version 5.1 . I am unable to save the file as a G-code. Can anyone help me?\n\nslice the object with button “slice plate”\n\nexport object with button “export plate”\n\nchange .3mf to .gcode\n\nsave the file\n\n done\n\nThanks for taking the time to assist. My problem is that the export option only gives me the 2 options “export as a preset config” or export as a “model file”. Using the later states there is “no model selected to save”","url":"https://forum.creality.com/t/saving-your-file-as-a-g-code/25830","productLine":"print","version":"5.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":2563,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9b719e3077cb6e7b","topicId":30336,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-12-30","lastActive":"2026-04-01","title":"Creality Print 6.0 is Here!","originalText":"Creality Print 6-0 1200×1200 126 KB \n\n Creality Print 6.0 is Here!\n\n Upgrade now www.creality.com/pages/download-software \n\n This release transforms your 3D printing experience, prioritizing usability for a smoother and more efficient workflow with Creality Print.\n\n What’s New in 6.0?\n\n Professional-level slicing made easy.\n\n Enjoy better print quality with updated Z-seam assembly modes, advanced overhangs, co\n\nSo, have you actually fixed it yet ???\n\n Creality Print version 6 “Problems”\n\nDialogue with the Creality Print V5 and above R&D Team Creality Print V5 and Beyond \n \n \n \n [pic2] \nWe are very pleased to welcome @Simmons-Creality from the Creality Print V5 and above R&D Team to our forum. You can share your usage experience, report bugs, and even express your future needs by filling out the feedback form below. \n Creality Print V5 and above Feedback Form \nIf the R&D Team finds your input particularly valuable, you may be invited to engage in in-depth discussions directly with the development team!\n \n \n\n Everyone can submit their issues in this form above. The R&D team will review the feedback regularly, thanks.","url":"https://forum.creality.com/t/creality-print-6-0-is-here/30336","productLine":"print","version":"6.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":84,"views":7930,"likeCount":21,"tags":["featured","crealityprint","crealityprint-v6"],"relReason":"tag","sourceType":"用户"},{"uid":"99044e95eaa0b26a","topicId":24930,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-12-22","lastActive":"2025-11-03","title":"Printer head crashes into center object when printing sequence is by object","originalText":"If I put multiple objects to print by object on the same plate and the center one is taller than the last object printed, when finished the head goes all the way to the side without lowering the bed, crashing into the center object.\n\nThe bed should lower to at least 45mm (maximum height allowed when printing by object) before the head moving all the way to the side.\n\n print by object 1392×840 128 KB \n\nI don’t know if it’s a problem in Creality Print (currently 5.1.7.10514) or K1 firmware (1.3.3.29)\n\nIts a problem with the slicer, we are waiting for either an update or a workaround. I think the slicer bases it on a 24mm maximum height.\n\nI realized that also and what I saw was that the printer crashed into a part when cutting off filament!\n\nIf he cuts filament he moves from back to center and then to center left at the last height of the last part printed with old filament.\n\n If there is any other part in this range which is higher it crashes into it!\n\nThe slicer would need to move the bed up to highest part level before issuing a filament change!","url":"https://forum.creality.com/t/printer-head-crashes-into-center-object-when-printing-sequence-is-by-object/24930","productLine":"firmware","version":"","problemType":"crash","model":"K1","grade":"有效","replyCount":6,"views":237,"likeCount":1,"tags":["bug-report","creality-k1","crealityprint-v5"],"relReason":"tag","sourceType":"用户"},{"uid":"c2f49dd36be9de41","topicId":23249,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-12-01","lastActive":"2026-03-04","title":"Trouble Slicing","originalText":"I am new to 3D printing and am having trouble slicing my designs from Tinker cad. After I make me design and save it then open it in the Creality app and chose to slice all it shows that it’s sliced so I download it to a flash drive, plug it in the printer it shows the flash drive as empty.\n\nHello Hopes2,\n\n Does the name of file you put on the flash drive end with .gcode ??\n\nIf not reload the .stl file you created through Tinker Cad, onto the Creality app, slice it and then save the gcode it created to your flash drive.\n\n Hope this helps.\n\nMy .stl files refuse to show up and if I try to copy and paste or drag it from files the software won’t recognize it. If I could guess what is wrong with it, it would take me an entire day to figure it out.","url":"https://forum.creality.com/t/trouble-slicing/23249","productLine":"cloud","version":"","problemType":"slice","model":"K1","grade":"有效","replyCount":5,"views":290,"likeCount":1,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"f781c43e9580bd14","topicId":22982,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-28","lastActive":"2025-10-21","title":"My halot R6 won't have it's qr code scanned","originalText":"Hi guys, I just got a Halot R6. Part of the installation asks you to scan a QR code displayed on the screen to pair the device with your account but it just won’t work. Every time I try a message pops up telling me to scan the QR code. Feels like I’ve tried everything to get it to work\n\nHi there. I’m having the same problem. Did you manage to sort yours?","url":"https://forum.creality.com/t/my-halot-r6-wont-have-its-qr-code-scanned/22982","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":119,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6e4518aba913b171","topicId":22463,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2026-01-17","title":"No USB Printing with Creality Print 5.1?","originalText":"I selected that I have an Ender 3 S1 Pro in the setup, but it wants the IP address. I print via USB, however don’t see a way to select USB Printing…just says LAN. Am I missing something?\n\nInstead of print plate choose export plate, click the up arrow beside print plate. This will allow you to write the gcode to disk/USB.\n\nnext to LAN choose ^ save/export file.\n\n that is the way in the old 5.1 version","url":"https://forum.creality.com/t/no-usb-printing-with-creality-print-5-1/22463","productLine":"print","version":"5.1","problemType":"feature","model":"未标注","grade":"有效","replyCount":22,"views":7700,"likeCount":4,"tags":["ender-3-s1-pro","crealityprint-v5"],"relReason":"tag","sourceType":"用户"},{"uid":"8b8e009445cc65fd","topicId":22431,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2026-03-22","title":"How to Use .3MF Files in Creality Print?","originalText":"How to Use .3MF Files in Creality Print? \n Using Creality Print version 5.1 and above , you can adjust printing parameters for .3MF files. This article provides a detailed guide on how to utilize your .3MF files within Creality Print, as well as instructions on importing models in formats such as STL into Creality Print and converting them into .3MF print configuration files.\n\n I. How to Use Your .3MF Files in Creality Print \n First, you can refer to this article on What is .3MF Files and How to Obtain Them? . Once you have acquired a .3MF file, all the printing parameters, model data, and color information are already included. Therefore, there is no need for tedious model coloring or complex parameter adjustments. You only need to make minor tweaks, and in some cases, you can start printing without any adjustments at all.\n\n The following sections will detail the process of printing after obtaining your .3MF file.\n\n .3MF 1340×241 4.96 KB \n\n Step 1: Open Creality Print 5.1 or a later version. After downloading the .3MF file to your local device, navigate to the file menu and select “Open Project.” Then, choose the corresponding .3MF file to open it.\n\n open project 1117×666 28.2 KB \n\n Step 2: After opening the .3MF model, you can adjust the printing parameters. The downloaded .3MF file contains settings for the printer, materials, and processes, but these parameters may not be suitable for your current printer or materials. You can make targeted adjustments as needed.\n\n For example, if the downloaded .3MF file is configured for the Ender 3 V3, but you are using a K2 Plus, you can switch the settings accordingly to match your specific printer. This ensures optimal printing results tailored to your equipment.\n\n \n\n Step 3: In the options panel on the right side, you can adjust the parameters of your model. Choose either “Global” or “Object” to modify the settings for different parts of the model. You can adjust the following five parameters: Quality,Strength, Speed, Support, Other.\n\n Make these adjustments to optimize your printing process according to your specific needs and preferences.\n\n \n\n Step 4: Once you have completed the adjustments to the printing parameters, click on “Slice” to process the model.\n\n Creality Print 1906×1007 70.1 KB \n\n Step 5: At this point, your .3MF model has been sliced. You can check the support generation by selecting the “Preview” option at the top. After reviewing the sliced model and ensuring everything is correct, send the file to your printer to begin the printing process.\n\n Creality Print 1917×1016 86.7 KB \n\n If you need to retain the file for future use, you can select “Save Project” or “Save As Project” from the menu in the upper left corner to save the .3MF file to your local device. This ensures that you have a copy of your project for later access.\n\n 11 826×682 34.3 KB \n\n II. How to Use Creality Print to Generate .3MF Files \n In addition to importing .3MF format model files to create print configuration files, you can also import models in formats such as STL, OBJ, and STEP into Creality Print to generate .3MF print configuration files. Below is an example of importing an STL file and applying color.\n\n Step 1: First, open Creality Print and click on “Import Model.” Select an STL file to open and complete the import process.\n\n import model 1912×1022 75 KB \n\n Step 2: Click on the “Coloring Tool” and select the color material option. Then, choose your desired tool to apply color to the model. This allows you to customize the appearance of your model before saving it as a .3MF file.\n\n cloring 1914×1019 58.8 KB \n\n Step 3: After coloring the model, select the desired printer configuration from the left side. Then, in the “Process” section on the right, set appropriate parameters such as layer height and support options. Once you have completed these configurations, your .3MF file will be ready for use.\n\n process 1914×1021 86.6 KB \n\n Step 4: Finally, you can complete the export and upload of your .3MF file by clicking on the upload project icon in the upper right corner. Before doing this, ensure you are logged into your Creality Cloud account within Creality Print. Once you click “Export and Upload,” you will be able to find the generated .3MF file in your local directory.\n\n Export and Upload 1896×1021 53.2 KB \n\n You can also upload the .3MF file to Creality Cloud. After clicking “Export and Upload” to save the file locally, you will be redirected to the upload interface on the Creality Cloud website. For more information on uploading .3MF files, you can refer to this article: How to Upload .3MF Files to Creality Cloud? \n\n upload 1907×932 20.6 KB\n\nSo I get that if I am using a 3mf file that was made on a creality printer, I can go up and select a new profile. Can I do that if it was created on a Bambu printer?","url":"https://forum.creality.com/t/how-to-use-3mf-files-in-creality-print/22431","productLine":"cloud","version":"5.1","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":2,"views":2704,"likeCount":1,"tags":["blog","3mf","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"650c8a25e5840bd0","topicId":22433,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2024-11-21","title":"Guide to Creating Quality Print Settings","originalText":"Creality Print 1896×1022 89 KB \n\n Guide to Creating Quality Print Settings \n Want your print setting to be recognized in the community?\n\n Follow these guidelines to make your print setting more popular and downloaded by more people.\n\n *If you are wondering how to upload .3MF files to Creality Cloud, you can refer to this article: How to Upload .3MF Files to Creality Cloud? \n\n I. Make Your Print Setting More Popular \n 1. Carefully optimized slicing parameter print setting \n \n Creality Cloud recommends that creators provide at least one physical photo of the print configuration to demonstrate printability, as photos of real model prints can increase user confidence in printing and the popularity of the print setting. \n Carefully optimized slicing parameter print setting \n \n Machine Setting: Generally no need to adjust.\n\n Process Setting: First select a template like 0.2standrad@K2 Plus, then fine-tune parameters on the template, such as support/skirt.\n\n Material Parameters: First select a template like hyper pla, then fine-tune parameters like temperature and cooling.\n\n Layer Height: Choose a layer height suitable for model details and print speed, usually 0.1-0.2mm layer height can provide higher accuracy.\n\nInfill Density: Appropriate infill density can ensure model strength and reduce weight. Common infill patterns include grid, line or honeycomb.\n\n Print Speed: Balance print speed and print quality. Too fast may lead to model quality degradation, too slow affects efficiency.\n\n Support Type: Choose appropriate support type based on different parts of the model, such as contact support or bridge support.\n\n Support Density: Support density should be sufficient to keep the model stable, but not too much to affect model urface quality.\n\n Bed Temperature: Appropriate bed temperature can prevent model warping and improve print success rate.\n\n Material Selection: Choose suitable 3D printing materials based on model purpose, such as PLA, ABS, PETG, nylon or high-performance engineering plastics.\n\n \n Significant optimization over existing print settings in terms of print reliability, part orientation, support optimization and model integrity. \n Model Integrity Assurance: By improving the printing strategy, effectively solving the problems of warping, layer cracking, etc. during the printing process, thereby ensuring the overall integrity of the model. \n \n Creality Print 1896×1022 89 KB \n\n 2. Place Different Variants on Separate Trays (Optional) \n If your model consists of multiple components, please place each component in a separate tray and name them accordingly. This allows users to easily identify and select the desired model components. Additionally, you can group parts of different colors onto the same tray for convenient color-based printing.\n\n Creality Print 1901×1028 66.7 KB \n\n 3. It Is Recommended to Export/Upload Files with .3MF Print Settings After Slicing \n By doing this, the .3MF file will embed the G-code printing instructions, allowing the system to directly extract printing-related information upon upload. This effectively reduces the computational resource consumption of the cloud slicing service.\n\n 4. Upload the First Print Setting for Your Model \n If a model does not have any print settings yet, uploading the first print setting will attract greater attention.\n\n model 1906×926 52.7 KB \n\n II. Prohibited Practices \n \n Do Not Upload Print Settings with Obvious Quality Issues \n\nAvoid uploading print settings that have significant defects, such as missing necessary supports, visible printing quality problems in the photos, or missing critical components that lead to print failures or assembly issues. \n Mismatched Print Settings and Source Models \n\nRefrain from uploading print settings to the wrong model or submitting .3MF files that do not correspond to the model. \n Duplicate Uploads of Print Settings \n\nDo not re-upload your own or others’ print settings. If you have only made minor adjustments to an existing print setting without substantial improvements, such duplicate content will be removed. \n Unnecessary Increase in Model Copies \n\nCreality Print already has a duplication feature, so there is no need to create a copy of the model and upload it as a new print setting. \n Uploading Monochrome Versions of Multicolor Models \n\nIf a multicolor print setting already exists, there is no need to upload a monochrome version. \n Do Not Split Models into Multiple Print Settings \n\nIf a model consists of several components, it is best to place them in a single print setting while organizing them on different trays. This way, users will not miss any parts during printing, and it will make the model page appear cleaner and more organized. However, there is one exception: if a component of your model has multiple versions, you may upload this variant as a separate print setting. We recommend creating a separate folder for the variant within the existing print setting and naming the folder clearly.","url":"https://forum.creality.com/t/guide-to-creating-quality-print-settings/22433","productLine":"cloud","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":3829,"likeCount":0,"tags":["blog","3mf","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"28c68f8df4c8d800","topicId":22432,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2024-11-21","title":"How to Make the Most of Multi-Color .3MF Models on Creality Cloud?","originalText":"Creality Cloud 1906×885 150 KB \n\n How to Make the Most of Multi-Color .3MF Models on Creality Cloud? \n The .3MF format print configuration files showcase immense potential and value in 3D printing due to their high versatility. This article will guide you on how to fully leverage the unique advantages of .3MF files on the Creality Cloud platform, from selecting files and editing models to configuring print parameters and sharing experiences with others, allowing you to explore multi-color models in Creality Cloud.\n\n I. Log in to Creality Cloud to Select and Print Your .3MF Multi-Color Model \n Visit the Creality Cloud website, click on “Models,” then select “Multi-Color Models.” Under the model file section, choose the .3MF option to filter and find your desired .3MF model files.\n\n Creality Cloud 1906×885 150 KB \n\n On this page, you can refine your selection based on personal preferences using the filtering tool in the upper right corner. This allows you to sift through numerous .3MF models to find the ones that best meet your expectations. Additionally, you can sort the options flexibly, making the search for your ideal model more efficient and personalized.\n\n \n\n To more precisely locate your desired .3MF model, you can enter relevant keywords in the search box. Then, check the options for “Multi-Color Models” and “3MF File Format” to quickly filter out high-quality .3MF models that meet your needs. This approach makes the search process more efficient and targeted.\n\n search 1909×889 116 KB \n\n After selecting your .3MF multi-color model, you can perform slicing and printing operations on the model’s detail page. You can open the model in Creality Print for slicing; for specific details, refer to the article: How to Use .3MF Files with Creality Print? . Alternatively, you can use the cloud slicing and printing feature on Creality Cloud, which is more convenient and efficient.\n\n Using Cloud Slicing for Printing: \n\n Step 1: On the model detail page, click “Open or Download,” then select “Cloud Slice.”\n\n slice 1054×584 41.7 KB \n\n In the pop-up window, make sure to select the .3MF format model for the chosen design, and then click “Slice Now.”\n\n .3MF 1906×957 55.7 KB \n\n Step 2: Navigate to the Creality Cloud slicing page. In the drop-down menu under “Model,” add your printer type and click “Confirm.” Then, based on your specific printing needs, adjust the printing parameters located in the bottom right corner.\n\n \n\n If you want to print multiple identical models, follow these steps:\n\n a. In the options list on the left side, click on “ Clone .”\n\n b. Enter the desired number of clones.\n\n c. Finally, click on “ Auto Layout .”\n\n This will complete the slicing task for a tray containing multiple identical models, allowing for efficient printing.\n\n clone 1905×954 47.1 KB \n\n Step 3: After completing the previous steps, click the \"Slice \" button in the bottom right corner. This will redirect you to your personal homepage where you can view the generated print files. In the completed slicing tasks, click “ Print ” to send the print job to your device, allowing you to finish printing the .3MF multi-color model.\n\n print 997×411 23.8 KB \n\n II. How to effectively utilize your multi-color printing configurations \n The unique advantage of .3MF files lies in their embedded attributes, offering endless possibilities for print configurations. While browsing the detail page of your selected model, you’ll discover a variety of rich and thoughtfully designed printing settings.\n\n We encourage you to share your personalized print configurations within the community. This not only enhances the uniqueness of your creations but also allows you to gain widespread recognition and appreciation. Through this process, the joy of DIY will be greatly amplified, making your printing experience full of surprises and fun.\n\n Model page 1022×556 38.2 KB \n\n If you’re struggling with how to create and upload personalized print configurations, please refer to the article titled “ Printing Configuration File Upload Guide .” This guide is comprehensive and easy to understand, and by studying it in detail, you will quickly master the skills needed to get started and enjoy the limitless fun of DIY printing!","url":"https://forum.creality.com/t/how-to-make-the-most-of-multi-color-3mf-models-on-creality-cloud/22432","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":760,"likeCount":0,"tags":["blog","3mf","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"32cd1fe17df4a510","topicId":22430,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2024-11-21","title":"How to Upload .3MF Files to Creality Cloud?","originalText":"Upload models 1899×936 47.2 KB \n\n How to Upload .3MF Files to Creality Cloud? \n In the previous article , we provided a detailed overview of the .3MF file format and its advantages, as well as how to obtain such files. Next, we will guide you on how to upload .3MF files to the Creality Cloud platform (via Creality Cloud and Creality Print). For better understanding, we recommend familiarizing yourself with the differences between .3MF model files and .3MF print setting files within the Creality Cloud platform.\n\n I. Uploading .3MF Files via the Creality Cloud Website/App \n Method 1: Upload the .3MF file as a print setting \n Uploading in the form of a print setting is currently only supported through the Creality Cloud website. On the model details page, find the upload entry for the .3MF print setting file, click “Add Print setting File”, and import the .3MF file exported by Creality Print 5.1 or a later version.\n\n Upload models 1899×936 47.2 KB \n\n up load models 1906×896 27.1 KB \n\n After clicking “Confirm,” you will be able to see the .3MF print setting you uploaded in the print setting section of the model.\n\n upload models 1909×935 46.9 KB \n\n Method 2: Uploading .3MF Files as Model Files \n To upload .3MF model files via the Creality Cloud website, refer to the screenshot below. \n\n creality cloud 1905×875 149 KB \n\n upload models 1901×931 42.4 KB \n\n Select the .3MF setting file exported by Creality Print, or choose another type of .3MF file. Next, add and upload your .3MF file. Finally, complete the public release by filling in any additional required information step by step according to the specified options.\n\n Upload the .3MF model file via the Creality Cloud app, as shown in the screenshot below: \n\n upload models 3271×1679 193 KB \n\n Note: You need to ensure that you have uploaded a .3MF model file. If you upload a .3MF setting file, an abnormal format error will be prompted. \n\n II. Generate and Upload a .3MF File Using Creality Print \n Here, we will use the example of importing an STL file and exporting it as a .3MF format file for upload:\n\n Upload 3mf files 1460×258 9.66 KB \n\n Once you have completed your .3MF model project, click the “Upload Project” icon in the upper right corner of Creality Print, then select the “Export and Upload” option to be redirected to the Creality Cloud official website for uploading your .3MF model file.\n\n Note: If you prefer not to upload as a model file but rather as a .3MF print setting file to an existing model detail page on Creality Cloud, you can directly click “Save Project” from the left-side menu, export it to your desktop, and then upload it using the previously mentioned method of “Uploading .3MF as a Print setting.” \n\n \n\n III. How to Edit an Uploaded .3MF File? \n You can replace your published setting file by accessing your personal center:\n\n Print Settings 1914×911 50.1 KB \n\n Click on the personal center in the upper right corner, then select “Print Settings.” In the corresponding setting options under “Print setting,” click “Replace” to proceed.\n\n Print Settings 1912×931 36 KB \n\n IV. Knowledge Expansion: How to Distinguish Between Creality Cloud .3MF Model Files and .3MF Print Setting Files \n Both .3MF model files and .3MF print setting files are in the .3MF format, but they serve different roles in the 3D printing domain and have distinct differences. They correspond to different sections on the Creality Cloud model detail page.\n\n .3mf format 1907×929 45.1 KB \n\n \n .3MF Model File: This file type contains only the 3MF data that represents the 3D model and its attributes, including all necessary information about the model, materials, and properties. \n .3MF Print Setting File: This is a setting file specific to the 3D printing process. While it is based on the .3MF format, it focuses on printing parameters and settings. Different users on the platform can create .3MF setting files for processing and uploading the same model with varying print settings.","url":"https://forum.creality.com/t/how-to-upload-3mf-files-to-creality-cloud/22430","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":785,"likeCount":0,"tags":["blog","3mf","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"6946ada1995110f9","topicId":22429,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2024-11-21","title":"What is .3MF Files and How to Obtain Them?","originalText":".3mf files 874×447 20.7 KB \n\n What is .3MF Files and How to Obtain Them? \n I. What is a .3MF File? \n The .3MF (3D Manufacturing Format) is an open standard file format specifically designed for 3D printing. Its purpose is to provide a unified and efficient way to represent various aspects of 3D models, including geometry, color, texture, and material properties. This facilitates seamless transfer and printing across different 3D design software, slicing software, and 3D printers. Compared to other formats, the .3MF format offers enhanced compatibility and a richer set of features.II.\n\n II. Advantages of the 3MF File Format \n \n Richness: While the STL format is widely used, it lacks information regarding color and material properties. In contrast, the .3MF format includes comprehensive data on geometry, color, materials, and copyright information. This ensures data integrity and accuracy, reduces the risk of data loss, and enhances manufacturing efficiency and precision. \n Efficiency: The STL format can result in large file sizes due to the decomposition of complex contours into numerous small triangles, which negatively impacts speed and storage. The .3MF format is designed to be more compact; it allows for faster transmission and lower storage requirements compared to STL files, making .3MF a superior choic \n \n .3mf files 874×447 20.7 KB \n\n stl files 870×459 20.6 KB \n\n \n Compatibility: The .3MF format is widely compatible, enabling seamless integration between CAD software, slicing tools, and 3D printers, thus simplifying data transfer. \n Standardization: The .3MF file format natively stores author information and copyright licensing types. When exporting, you can define the title, designer, copyright information, and licensing terms to ensure the proper use of the .3MF file, any derivative files, and the physical output of any components created using 3D printing. This feature helps protect your intellectual property. \n \n III. How to Obtain .3MF Files \n 3.1 Acquiring .3MF Files from Online Model Libraries \n Obtaining .3MF files from online model libraries is the quickest method available. You can freely download or purchase .3MF format files from these libraries. For example, you can search for the models you need on the Creality Cloud platform and directly download the .3MF format files. Click here to access the Creality Cloud multi-color model library. \n\n Creality Cloud 1904×888 149 KB \n\n 3.2 Generating .3MF Files Using Slicing Software (Creality Print) \n You can generate your .3MF model by importing STL or other format model files into slicing software. For more details, please refer to this article: How to Upload .3MF Files to Creality Cloud.\n\n 3.3 Exporting .3MF Files Using Modeling Software \n You can also use other modeling software, such as 3DS MAX or ZBrush, to export your model projects as .3MF files.","url":"https://forum.creality.com/t/what-is-3mf-files-and-how-to-obtain-them/22429","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":1206,"likeCount":0,"tags":["blog","3mf","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"a29a3f08295b21c8","topicId":22420,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-21","lastActive":"2024-11-21","title":"Creality Cloud WEB Built-in Slicer Engine Upgrade","originalText":"W e’re excited to announce an upgrade to the cloud slicing engine on the Creality Cloud Web. This update currently supports the following devices: Creality K1、K1 MAX、K1C、CR-10 SE、Ender-3 V3 KE、Ender-3 V3 Plus、Ender-3 V3、Ender-3 V3 SE (The resin printer will not be upgrading the engine this time). Along with a more stable and responsive cloud slicing experience, we’ve also added a setup wizard to the web slicing interface to help you get started quickly!\n\n Here’s how to use the new slicing feature:\n\n \n Go to the Creality Cloud Web model detail
