s quite concerning and I’ve uninstalled this version for now.\n\n Anyone else getting this detection? Thoughts or comments from Creality?\n\n Thanks.\n\nSJMarty: \n \n Creality Print v7.0.0.4127\n\n \n \n Yes. Same here. I quarantined it and so far it has not had an affect on Print-7. It is deeply disturbing that Creality security would allow malware into their download repository. Until Creality lays out what they have done to mitigate the problem. Trojan:Win32/Tnega!MSR\", also known as “Win32/RA-based.NJV”\" is serious. Here is a good summery on the NordVPN sitye: https://nordvpn.com/cybersecurity/threat-center/tnega/ \n\n I can not trust Creality. It may be deliberate. I can no longer run my regular security on this forum. I have to use an incognito window that allows targeting cookies in order to use this forum. Since incognito windows delete cookies on exit, I think that is reasonably safe as long as I do not leave a connection to Creality open for any longer than needed.\n\nI have alerted Creality Tech support on Facebook and e-mail. My experience from doing corporate tech security for decades is this: If the virus is removed in 24 hours or less with a posted apology/warning it was a sloppy but honest mistake. I can forgive. If it it takes more than 24 hours to fix, then management approval was required and it was most definitely a deliberate attempt to spy on users.","url":"https://forum.creality.com/t/creality-print-v7-0-0-4127-adware-win32-tnega-detected-in-remove-edge-exe-by-windows-defender/47597","productLine":"print","version":"7","problemType":"compat","model":"未标注","grade":"有效","replyCount":62,"views":4610,"likeCount":35,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"a10a58e4ebaf7dc3","topicId":47582,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-30","lastActive":"2026-01-04","title":"Crealit print V 7.0.0.4127 on Mac","originalText":"i’ve installed Creality print v 7.0.0.4127 on a mac with os 26.2, and i ve a trouble with language selection in settings, Every time I change the language of the program, when I restart it everything goes back to the way it was when I first installed it, preferences and original language.\n\n Has this happened to anyone else?\n\nI have the exact same problem. I haven’t found a solution yet.\n\nThey’re getting pretty sloppy over at Creality software. The windows version comes with a virus. See: Creality Print v7.0.0.4127 - Adware:Win32/Tnega Detected in “Remove-Edge.exe” by Windows Defender","url":"https://forum.creality.com/t/crealit-print-v-7-0-0-4127-on-mac/47582","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":181,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"be6aa4b4c60f3641","topicId":47587,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-30","lastActive":"2026-05-23","title":"Bricked Ender-3 S1 Pro After Firmware Updates","originalText":"Hi, all. I have an Ender 3 S1 Pro. I bought it in Nov of 2024. It has the STM32F401 chip.\n\n THE STORY: It was working fine but I felt like updating the firmware just to try it out and now nothing works. I went to this website: https://www.creality.com/download/creality-ender-3-s1-3d-printer . I downloaded the latest version, V3.1.9, and followed all instructions for both main board and screen updates. Now The screen powers on but only shows black; I’m also pretty sure the board firmware didn’t take either but with a blank screen I can’t really tell.\n\n THE DETAILS: I have 8gb micro SDs that are formatted in the correct MS-DOS + 4096 allocation size setup. I followed all of the instructions as outlined in the readme.txt files, reached out to support ( via phone, which did nothing, and email, which has not responded yet) and even googled my brains out for solutions but still no dice. I’ve even tried going back through all older firmware versions as a sort of “factory reset” but am still getting nowhere.\n\n HELP: So now I’m hitting the forums for deeper help. Am I using the wrong link for these updates? Am I supposed to use the files in this link instead (even though I’ve already tried and failed here too) Ender Series Firmware Download | Creality 3D Printer Firmwares ? The readme.txt files, instructions on the download site, and forum / YouTube instructions are all over the place on sequence and which files need to be added, e.g: Udpdate the screen first then the main board or vice versa? Am I wrong putting whole private & TJC_SET folders onto card for the screen update or should it be individual files; same for the firmware?\n\n Any help is appreciated. I’d like this printer back ASAP. Thanks in advance!\n\nThe ender 3 S1 pro can have either a F4 of F1 processor micro controller chip. Make show that the firmware is for the correct controller. Also format the SD card for 4096 allocations for both the screen and the main controller. Delete the file for the screen before updating the controller. also use a different name for the controller board .bin file. Creality ,bin file will not load if the name is the same as the previous update.\n\n Bill.\n\ndid you manage to fix your issue?","url":"https://forum.creality.com/t/bricked-ender-3-s1-pro-after-firmware-updates/47587","productLine":"firmware","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":3,"views":351,"likeCount":0,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"32ed1d0a52f9c474","topicId":47572,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-29","lastActive":"2026-01-04","title":"Crealty Print Software - Suggestions for Improvement","originalText":"I’m using the latest Creality Print V7 software, but this problem is not new to that version. As long as I’ve been using Creality Print, under the “Device” details, when starting a print if I click on speed “Stable 50%” anytime before purging filament to start the print then it will automatically change it back to “Standard 100%” speed without warning. I have had numerous failed prints that could have been prevented if the speed stayed at “Stable 50%” during actual printing. I would like to request that your technical team change the Creality Print software so that when selecting a print speed change before filament purging the selection will remain for the actual printing process. This is for a K1C with Creality CFS.\n\nI agree, it is annoying. But if it is any consolation, this bug has been in place since Bambu Studio which Orca Slicer was forked from and which Creality Print is forked once again. I did a little Googling and it looks like the first mention if this feature is the introduction of the G-code M220 command which overrides speed.\n\n Here’s the first reference in RepRap’s Wiki page which appears to go back to 2012. Now having said that, it’s certainly a slicer bug but whoever introduced it first, remains a mystery.\n\n \n \n \n\n reprap.org \n \n\n \n \n\n G-code - RepRap \n\n \n\n \n \n \n \n\n \n \n\n I haven’t experimented in a while but I did have marginal success with modifying the machine G-code and inserting the m220 override there and save the machine profile as your default. I changed it to M220 S50 which is 50% speed. But truth be told, upon upgrading my Orca, it seems to work randomly but in fairness, I did not do a lot of testing.\n\n Note: G-code edits can mess up your machine if you’re not comfortable with G-code editing but this is a simple experiment. You may also have to place it again in the “Printing by object” section if the firmware is ignoring the command. \n image 1927×1287 156 KB \n\n The only “semi-reliable” remedy I found - on the K2 Plus - was that I’ve been forced to change it directly from the front panel. I’ve found that this is a far more reliable method to ensure that the command “registered” but even then, if I don’t get that visual confirmation on the display panel, it may revert back to 100%. Annoying? Absolutely!!! But if BL, Orca and Creality sales aren’t being affected by this annoyance, it becomes more of a “quality of life” issue rather than a functional bug.\n\n \n You may find that you will get a more sympathetic ear by directly cross-posting this on the Orca Github forum. The folks at Softfever(Noisyfox) do listen because they are 3D Printer enthusiasts like us that are in it for the craft, not the money.\n\n https://github.com/OrcaSlicer/OrcaSlicer/issues\n \n \n \n \n\n GitHub \n \n\n \n \n\n OrcaSlicer/OrcaSlicer \n\n G-code generator for 3D printers (Bambu, Prusa, Voron, VzBot, RatRig, Creality, etc.) - OrcaSlicer/OrcaSlicer\n\nThanks so much for this reply. My K1C started having regular layer shifts after I installed the CFS mod package and hooked up my CFS. I don’t necessarily think that means this caused it to start happening. But the ONLY thing that reliably stops it now is using that Stable 50% button, so I think this is definitely a speed related causation for the layer shifts.\n\n I think I’m going to try your G-Code modifications just to see what happens. I don’t want to got with the Stable 50% as a default, but I hate having to waste time setting and waiting for the printer to go through necessary prep steps prior to starting a print before I can select the setting. I assume I can set the Speed to any % amount using the G-Code command, so it might be worthwhile to see if I can get stability at a little higher than 50% speed. Just wanted to thank you for giving me another way to work on getting rid of layer shifts.","url":"https://forum.creality.com/t/crealty-print-software-suggestions-for-improvement/47572","productLine":"thirdparty","version":"7","problemType":"other","model":"K1C","grade":"有效","replyCount":4,"views":194,"likeCount":2,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"c4aa68570d0a6037","topicId":47559,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-29","lastActive":"2025-12-29","title":"Crealityprint 7 request for change to Bridge Density","originalText":"Bridge Density controls the thickness of the bridge layer printed over infill, with 100% typically being solid and ideal for strength , recent updates in Orca slicer allow increasing it (e.g., to 120%) for smoother, gap-free bridges, working alongside Bridge Flow Ratio . A number of creality users and myself have had some success with improving bridging. BF 1.4 and BD 105 work well for me in PLA.\n\n \n\n The results on bridging are very good but do need a bit of calibration. There are a number of articles on printables and Youtube that explain this and indicate optimum setting.\n\n Can we implement this in Crealityprint please.\n\n Thanks\n\nUse the link given by the developers to report your idea \n\n Creality Print 7.0 beta UAT Survey","url":"https://forum.creality.com/t/crealityprint-7-request-for-change-to-bridge-density/47559","productLine":"thirdparty","version":"7","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":172,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"59ab6e02e8df0507","topicId":47565,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-29","lastActive":"2025-12-30","title":"Bug report on Creality Print 7.0.0.4127","originalText":"Hi,\n\n Since V7.0.0.4127, I can no longer drag and drop an STL file from 7Zip directly into Creative Print. It tells me there is no geometric data in the file. There’s no problem if I drag and drop from File Explorer.\n\nAre you unzipping the 7Zip file before you drag it into Creality Print.? It won’t work unless you unzip the file and then move the .stl into Creality Print.\n\nWhen you drag’n drop your file from 7zip to creality, it unzip the file directly in Creality.\n\nIt was fine on v6\n\n {2D1D8F3C-4E7D-4C34-9F5D-E2AAAAC65472} 1078×716 60.1 KB","url":"https://forum.creality.com/t/bug-report-on-creality-print-7-0-0-4127/47565","productLine":"print","version":"7","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":376,"likeCount":0,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"ebb2efc9f26806c1","topicId":47525,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-27","lastActive":"2025-12-30","title":"Crerality Cloud Annual Designer Awards 2025","originalText":"Crerality Cloud Annual Designer Awards 2025 1080×1350 73.6 KB \n\n Since 2022, Creality Cloud has recognized the creative talent and dedicated efforts of its Top 100 Designers by awarding honorary badges. This cherished tradition has now entered its fourth year, remaining committed to acknowledging designers’ outstanding contributions to the platform and garnering widespread acclaim from the global design community.\n\n In 2025, we are proud to announce this year’s Top 100 Designers list and specially invite them to participate in the independent design of exclusive badges and models. Additionally, community users can vote to select 15 Designer of the Year and 10 Emerging Designer of the Year. Winners will receive generous prizes, such as the K2 Pro Combo 3D Printer, K2 Plus Combo 3D Printer, or 3D Scanner. Users who actively participate in voting also stand a chance to win a K2 Pro Combo 3D Printer!\n\n Furthermore, each designer has created an exclusive fan model for voting users—simply cast a vote to unlock it!\n\nthanks Creality! very honoured to have been nominated!\n\n for anyone that would like to support me, here’s a direct link • Creality Cloud Annual Designer Awards\n\nHuge thanks to the amazing Creality & Creality Cloud community \n\nBeing selected for the Creality Cloud Annual Designer Awards 2025 is an honor made possible by all your support.\n\n If you’d like to vote for me \n\n Creality Cloud Annual Designer Awards 2025 - Frikarte3D","url":"https://forum.creality.com/t/crerality-cloud-annual-designer-awards-2025/47525","productLine":"cloud","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":3,"views":63,"likeCount":1,"tags":["creality-cloud"],"relReason":"category","sourceType":"用户"},{"uid":"2b91bcc101c11081","topicId":47534,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-27","lastActive":"2025-12-28","title":"Tinkercad importing","originalText":"It sure would be nice if the Creality slicer people could work on getting importing magnet holes in a tinkercad stl file to work. Sure I understand that 3d printing a hole in the middle of an object can be troublesome and cause stringing while spitting out filament into a void, however, that space will be filled with a magnet so it’s not a problem. I have tried adding a magnet hole in the slicer but I can’t figure out has to get the hole to be .3mm above the plate. Sometimes the import will work if I join the group as a “Union Group” but when I group the object as a “Bundle Group” to make painting easier it does not work. Or maybe better yet making stl files colored so I don’t have to paint. I’m sure I’m doing something wrong. Any help would be greatly appreciated. thx\n\nIt sounds like three separate issues are being mixed here: stringing, using a slicer as a CAD tool, and relying on a non-parametric tool like TinkerCAD for CAD design.\n\n \n \n Stringing – Solved by tuning filament profile settings in your slicer. There are many YouTube tutorials for this; start with this search: https://www.youtube.com/results?search_query=creality+stringing+fix+solution+retraction+settings \n\n \n \n Using the slicer as CAD – Slicers operate on meshes. Making geometric edits like adding a magnet cavity is clumsy, because each model or modifier is a separate entity with no parametric links. If you misplace something, your only real option is undo—no persistent constraints or references.\n\n \n \n TinkerCAD limitations – TinkerCAD is a basic CAD tool, not a professional parametric system. Edits are destructive and not reversible after grouping or combining. There’s no history tree or way to batch-edit multiple features. Compare this to parametric CAD tools like Fusion 360, Onshape, or FreeCAD, where all features are linked and editable via a feature history.\n\n \n \n What parametric CAD tools do that TinkerCAD, SketchUp, and Blender can’t:\n\n \n Maintain a full edit history so every operation is revisable, rearrangeable, or copied. \n Assign parameters (length, width, diameter, etc.) to any feature. \n Use variables and constraints to link dimensions, so changing one value updates all related geometry. Example: if a magnet slot is constrained to the edge of a box, resizing the box moves the slot accordingly without further manual edits. \n \n Example: A simple box with a magnet hole anchored to the bottom-right corner. Define parameters and variables up front, so later edits (like changing box or magnet size) update everything automatically—no manual corrections needed.\n\n image 3823×1574 535 KB \n\n \n\n For solid tutorials, see Teaching Tech on YouTube: https://www.youtube.com/@TeachingTech/search?query=onshape \n\n This overview covers his recommendations on why OnShape is best suited and covers most of major CAD choices: https://www.youtube.com/watch?v=XHzOzxCQ7MU","url":"https://forum.creality.com/t/tinkercad-importing/47534","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":212,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c3d3517a7aab8fd4","topicId":47501,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-26","lastActive":"2025-12-26","title":"K2 Printer not in printer lidt","originalText":"Screenshot_20251226_071621_Creality Cloud 1080×2340 278 KB \n\n Trying to cloud slice from the app. When I click on slice from the app it brings me to this selection page and there’s no K2 printers listed.\n\nWhat software is this? It does not look anything like the phone app, or computer app, I am using. Could It simply be an old version that does not yet contain the K2 series>","url":"https://forum.creality.com/t/k2-printer-not-in-printer-lidt/47501","productLine":"cloud","version":"","problemType":"compat","model":"K2","grade":"有效","replyCount":2,"views":42,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f8e66520f99865f1","topicId":47480,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-25","lastActive":"2025-12-30","title":"Creality Print UI - why the hell the box is semitransparent?","originalText":"Does anybody have any idea, why they made decision to make this box semitransparent?\n\n image 501×998 106 KB \n\n It you don’t know which box it is (because you can’t read it), it is this one:\n\n image 501×998 48 KB \n\n It is latest version of Creality Print for Mac and this bug is extremely annonying as after every slicing plate is zoomed to full screen and I can’t read info how long print takes, how much filament etc. So I zoom out, read the numbers, change slicing parameters, slice again, don’t see anything again, zoom out and … repeat.\n\nI haven’t seen that on the Windows version and I’m on the latest. Have you tried changing the view if that is an option? I’ve never had to go look for a setting like that.\n\nRun your Mac in Dark mode. It works well and doesn’t have that distracting white background.\n\n Screenshot 2025-12-25 at 05.29.01 1084×1942 163 KB","url":"https://forum.creality.com/t/creality-print-ui-why-the-hell-the-box-is-semitransparent/47480","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":6,"views":95,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9c3e26e4e24c06ff","topicId":47474,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-25","lastActive":"2025-12-25","title":"Which version is the best one currently available?","originalText":"Which version is the best right now?\n\n screenshot_1766628722 282×104 9.79 KB \n\n 10 years ago I used the CR10S5… 96 machines.\n\n Then, in 2024, we upgraded to 40 K1 Max machines and used a new slicer.\n\n But each version has its advantages and disadvantages.\n\n Version 6 seems to have added more convenient machine arrangement and layout capabilities - but it still creates too many difficulties.\n\n The most stable version is still version 5.\n\n Edit: Non working or suspicious Link Removed.\n\nscreenshot_1766628722 282×104 9.79 KB . tôi vẫn thích nhất 5.1","url":"https://forum.creality.com/t/which-version-is-the-best-one-currently-available/47474","productLine":"print","version":"9.79","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":2,"views":55,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4b922a3da20bb224","topicId":47471,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-24","lastActive":"2026-01-01","title":"What the hell is going on with version 6?","originalText":"There’s no way around version 6, I’m really disappointed. I remember when it was released and I opened it, the first thing that struck me was the interface. I literally thought, “They’ve screwed it up”… everything in version 6 is much more complicated than in version 5. Anyway, aside from that…\n\n Even though it’s been out for quite some time, it still behaves like a beta program, even in the simplest tasks. Not even the “move” function works properly. Here’s the problem:\n\n I open the newly installed software (clean install, latest version), add a cube from “test model,” select the cube, click the “move” button, and I find a 10mm offset on the Z-axis relative to the printer bed… (as seen in the image).\n\n How is this possible? I’ve had to stick with version 5, which hasn’t been updated in ages.\n\n Screenshot_12 1919×1022 196 KB \n\n Screenshot_2 1919×1020 196 KB\n\ni can put up with the interface, but what did they do to stop the STEP models from opening normally? at 5, the model opens in 2 seconds, and at 6 it opens in 5 minutes?","url":"https://forum.creality.com/t/what-the-hell-is-going-on-with-version-6/47471","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":169,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f1127cba9e314e3a","topicId":47441,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-23","lastActive":"2025-12-25","title":"Dynamic changing of Temperature and Flow Rate","originalText":"I’m new to the forum and to Creality. My old work horse Prusa broke down on Black Friday and low and behold the K1C was on sale and I pulled a hair trigger. I had a little learning curve on using Creality-Print, but now I’m liking it better than my Cura habit. I’ve really been impressed with the K1C both in speed, and especially in the fire-and-forget print reliability. I’ve tried PLA, ABS, Nylon, and Carbon/Polycarbonate without incident. I also purchased my first roll of LW-PLA to build RC airplanes and have been experimenting with different temperature/Flow rates to see the differences in weight versus strength. Currently I’m printing a 40” wingspan power glider that should come in less than 100 grams (print weight) while all the powered guts will exceed 120 grams. Which brings me to the question…\n\n Is it possible to change the Nozzle temperature and material flow rate during the print? \n\n Why you say? There are portions of a print say like a control horn on a plane’s empennage. During the layers printing the horn, I’d like the temperature at 220C and flowrate at 75%. Once in the main layers for the entire surface, I’d like it to switch to 270C and 40% flowrate.\n\nI’m pretty new to the hobby and have only printed with PLA so far but I’ve changed both flow and temps while printing. Mostly to eliminate stringing and I’ve found that a few degree difference reduces or eliminates it during printing.\n\nI did the changes mid-print. My guess is you want to be more precise in where you want the temps/flow to change? I would think you could do that in the g-code. I’m too much of a noob to help with that.","url":"https://forum.creality.com/t/dynamic-changing-of-temperature-and-flow-rate/47441","productLine":"thirdparty","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":107,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"682a11ed64256f3a","topicId":47461,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","date":"2025-12-23","lastActive":"2025-12-23","title":"Приложение Creality print не видит многоцветовую печать на принтере с функцией CFS","originalText":"Я приобрел принтер creality k1 max v5 CFS .Скачал приложение creality print последней версии и повязал устройства k1 max cfs.Сам принтер видит устройство cfs,приложение видит,что на принтере есть cfs.Так же стоит профиль k1max cfs.И когда я загружаю модели с разными цветами,то справа сверху доступен только 1 пруток(филамент).А если нажать на кнопку,где добавляются цвета(вроде называется автоматическое картирование),то пишет,что устройства с нужными данными типо нету.Помогите пожалуйста с этой проблемой многоцветовой печати. https://drive.google.com/file/d/1bnJNj4jH1CVZ2z_J7ocJ0aIaaWvUPm05/view?usp=drivesdk","url":"https://forum.creality.com/t/creality-print-cfs/47461","productLine":"print","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":95,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9d713d1458d33bf8","topicId":47460,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-23","lastActive":"2025-12-23","title":"Unable to \"Add Pause\" when print sequence is \"By object\"","originalText":"When I select print sequence by object, I can’t add a pause. It happens even if there is only 1 object on the plate. And I can’t think of a reason why this shouldn’t be allowed.","url":"https://forum.creality.com/t/unable-to-add-pause-when-print-sequence-is-by-object/47460","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":45,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"44a9cc55cb45979d","topicId":47449,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-23","lastActive":"2025-12-23","title":"Creality Cloud App","originalText":"I am very happy with the creality cloud app but I can’t get notifications with sound in the app. I only get a notification but no sound. I have tried to see what the problem could be but can’t find anything wrong. I have an iPhone with iOS 26.2\n\n thx in advance Anders","url":"https://forum.creality.com/t/creality-cloud-app/47449","productLine":"cloud","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":60,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f9570f1efd206a6c","topicId":47337,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-17","lastActive":"2025-12-17","title":"Hello to everybody new in the forum wondering if someone can help whit my mage pro just not printing my model its just printing a flat bed","originalText":"20251217_122526 1848×4000 315 KB","url":"https://forum.creality.com/t/hello-to-everybody-new-in-the-forum-wondering-if-someone-can-help-whit-my-mage-pro-just-not-printing-my-model-its-just-printing-a-flat-bed/47337","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":20,"likeCount":0,"tags":["halot-mage-pro"],"relReason":"category","sourceType":"用户"},{"uid":"a100bf1029c93197","topicId":47330,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-17","lastActive":"2025-12-17","title":"Feature Request: Please Add \"Area Fill\" to Seam Painting","originalText":"There actually is an applicaiton for this. I mostly print with PETG and I’ve yet to find settings that don’t result in an unsightly scar left by the seam. In some cases I can get away with using Random for the Seam Position . But, not always. And for those cases, I came up with a workaround: Designate an area for the random seam. That way, it plays like an intentional isolated pattern (aka the random scatter, confined to a smaller area, reads like a textured pattern–kind of a sparse furry skin ). But, seam-painting that area is tedious using the Brush Shape , especially along the edges. And, what makes it extra irritating is that any change in the model, and all of that tedious painting vanishes (aka, has to be redone )! For instance, if you forget to Repair non-modals, or you load a new, updated STL in it’s place, all seam painting is wiped away.\n\n Thus, please add Area Fill (like in Support Painting ) to the Seam Painting tool. Because, with an Area Fill selection, painting (and repainting) random seam areas would be far less of a chore.","url":"https://forum.creality.com/t/feature-request-please-add-area-fill-to-seam-painting/47330","productLine":"print","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":36,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e9c9848f530f67c6","topicId":47235,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-13","lastActive":"2026-03-13","title":"Creality Print 6.3.1 No temperature graph window?","originalText":"Ok, so am I missing something here? Just installed 6.3.1.3548 and when looking at ‘Device’ window, I can no longer see the temperature graph window. Removed in this version or switched off somewhere/how?\n\n I know it’s not crucial, but it is information I liked to see.\n\nThe numbers are still there, but I agree, I miss the graph. My printer is in the garage and the graph gives good insight to the stability of the print environment.\n\nThey apparently took a number of things out of the UI in this last release. You can still see it all in the Fluidd page via a browser but on in the desktop client it has been removed. I agree, it was a nice feature but I can understand that it created clutter that made screen real estate cramped.\n\n image 3753×1997 381 KB","url":"https://forum.creality.com/t/creality-print-6-3-1-no-temperature-graph-window/47235","productLine":"print","version":"6.3.1","problemType":"feature","model":"未标注","grade":"有效","replyCount":8,"views":161,"likeCount":10,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"a0e0fe1989a36055","topicId":47249,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-13","lastActive":"2026-02-10","title":"Creality Start print button","originalText":"I noticed in Creality Print 6.3 that the “Start Print” button is hanging outside the window on the bottom.\n\n Everytime I have to scroll the window to make button visible.\n\n Is there a setting to change that?\n\n (resizing the window is temporary: if you leave the window, size setting is lost)\n\n Peter\n\nHi there,\n\n YES, BUMP … Why does it do That ? and the layout seems to have changed ? Is there a way to put the camera back on the right side of the screen ?\n\n Anyone have any Idea?\n\n GL\n\nI find the new layout horrible. Huge wide spaced buttons and text, only little bit of useful info on one whole screen…\n\n XYZ params on one line instead using quarter of the screen now was much easier and more efficient…\n\n (we don’t need an “interface for dummies”… )","url":"https://forum.creality.com/t/creality-start-print-button/47249","productLine":"print","version":"6.3","problemType":"crash","model":"未标注","grade":"有效","replyCount":6,"views":121,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1caf2fcdf774e88d","topicId":47181,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-11","lastActive":"2025-12-11","title":"Layerheight issue with multicolor in Creality Print 6.3.1.3548","originalText":"Trying to print a multi-color model with Creality Print 6.3.1.3548 on my Creality Hi, using the standard 0.20 layer height profile…\n\n Initial layer is set to 0.20 mm, and layer height to 0.20mm - but when slicing, the initial layer height is 0.20, and the following are 0.16mm ? If using the same settings on a plate only utilizing a single color, things works OK.\n\n Setting layer height to 0.21 mm (for both) does not seem to change anything but the initial layer height…\n\n image 666×290 17.5 KB\n\nFound out, that someone did a layer height 0.16 on the object ….","url":"https://forum.creality.com/t/layerheight-issue-with-multicolor-in-creality-print-6-3-1-3548/47181","productLine":"print","version":"6.3.1","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":2,"views":72,"likeCount":1,"tags":["crealityprint-v6","bug-report"],"relReason":"tag","sourceType":"用户"},{"uid":"32f63c0e4ef76f20","topicId":47158,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-09","lastActive":"2026-01-15","title":"AI Auto PA and Flow Rate calibration questions","originalText":"I assume the AI Auto Calibrations on the printer, override the settings for the selected filament. Is there a place to view what the Auto Calibration selected? Does the Auto Calibration setting “stick” anywhere, or does it have to be re-done on a print by print bassis? Is the AI any good at picking these settings or should I just ignore them?\n\n 20251209_115815 2251×1592 293 KB\n\nFrom my understanding, the PA and flow rate calibration is only done before the print (when it does the zig-zag to check the pressure advance and the flat rectangle for the flow.\n\nIt then writes a value in the console on Fluidd so yes, it kind of overrides the settings for the selected filament.\n\nStill from my understanding, it doesn’t stick anywhere, you have to copy them and make a new filament settings in the slicer\n\n As long as filaments are from the same type (settings given for HyperPLA are not working well with Solyein PLA for example), I am pleased with what it is giving me.\n\n@Alex2Lab Thanks. That makes sense. I usually don’t use all the “extra” calibrations for every print. they are time consuming and seemed redundant. I’m having trouble with one specific filament. I’ll try using the auto calibration for that filament and pick off the values. Sad truth, I think the auto calibrate mode is better than I am for those two settings.","url":"https://forum.creality.com/t/ai-auto-pa-and-flow-rate-calibration-questions/47158","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":10,"views":577,"likeCount":4,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"31c8e9eed3731177","topicId":47092,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-07","lastActive":"2026-06-13","title":"User created Printer presets disappeared from Creality Print","originalText":"I created several user presets for different nozzles and use them in several projects. Today when I opened Creality Print none of the presets show in the Printer selection area, just one System Preset is there. Has anyone seen this behavior or know how to get the presets back?\n\n I found them stored in Windows folder under user\\ C:\\Users\\AppData\\Roaming\\Creality\\Creality\\Print\\6.0\\user\\125489617\\machine folder. But they do not show in Creality Print any more under the pulldown selection for Printers.\n\n1000% frustration with this, and the lack of being able to simply exchange presets openly, and without them disappearing with every new version. This is pushing me back to Orca Slicer yet again. Total frustration.\n\n I would not have so much of an issue if the developers would simply provide all the presets that you need. For my K1C, the only nozzle options that they appear to recognize is a 0.4mm or higher, but my unit came with a 0.2mm nozzle.\n\n An idea solution would be to have a folder that you specify where you put your presets, and then let anyone add, remove, modify, and exchange to their hearts content. Heck, the whole industry needs to get behind an exchange of presets where when you buy a filament there is a library of presets for it that help users get the most out of the filament and their printers.\n\nlook it up on google, the presets are there, you need to copy them to a specific folder in order to see them again…","url":"https://forum.creality.com/t/user-created-printer-presets-disappeared-from-creality-print/47092","productLine":"thirdparty","version":"6.0","problemType":"","model":"K1C","grade":"泛讨论","replyCount":7,"views":588,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"655f6259ddacefec","topicId":47094,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-07","lastActive":"2025-12-07","title":"Can't add a second model (6.3.1.3548)","originalText":"I get this warning when I add a second model.\n\n “Current tray is full; Unarranged models are place above tray 1”\n\n These models are under 6.5cm wide. So the plate is not full.","url":"https://forum.creality.com/t/cant-add-a-second-model-6-3-1-3548/47094","productLine":"print","version":"6.3.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":41,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f587f0f243961d05","topicId":47093,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-07","lastActive":"2025-12-07","title":"Creality Print V6.3.1.3546","originalText":"where is the Object Deletion ,Why was it removed it’s a handy feature’\n\nCheck this discussion from yesterday:\n\n Excluding Objects","url":"https://forum.creality.com/t/creality-print-v6-3-1-3546/47093","productLine":"print","version":"6.3.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":98,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"a5bcc597b177e528","topicId":47090,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-06","lastActive":"2025-12-08","title":"This model isn't supported?","originalText":"On my iPad, I opened the Creality app, and went to my workbench.\n\n My printer is shown at the top, left hand corner, and when I turn it on. It goes from offline to online, so the app knows it’s there.\n\n However, the message on the screen says:\n\n This printer model is not supported.\n\n FloPrint does not support this device yet.\n\n It worked fine before the cloud update 4 days ago.\n\nRoll back the update\n\nHow am I supposed to do that?","url":"https://forum.creality.com/t/this-model-isnt-supported/47090","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":137,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8b835d1bdc6203f3","topicId":47072,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-06","lastActive":"2025-12-08","title":"Can’t Import STL Files into Creality Print After Latest Update","originalText":"Hello everyone,\n\n I recently updated Creality Print to the latest version and since then I’ve had the following problem: I can’t import any .stl files anymore. I open the corresponding folders, but no files are shown there. When I try to drag the files from Explorer into Creality Print, that doesn’t work anymore either (I’m pretty sure this used to work without any issues).\n\n If I open the files with a double-click, Creality Print launches and the STL model is loaded without any problems, but only a single one. If I open multiple files at once, a separate instance of Creality Print opens for each STL file.\n\n It’s slowly driving me insane because I have absolutely no idea what could be causing this! Help!\n\n@Metheldas You could go back to the last version 3420 for windows.\n\n Download Link Here Creality Print 3420\n\nI have the same problem. Creative Cloud is unlogical and extremely difficult to use. Would it be possible to use some third-party software where the interface would be a USB stick to the printer itself?","url":"https://forum.creality.com/t/can-t-import-stl-files-into-creality-print-after-latest-update/47072","productLine":"thirdparty","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":8,"views":821,"likeCount":2,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"30700d3dd7c9706a","topicId":47064,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-05","lastActive":"2025-12-05","title":"Sliced line widths greater than line width settings (per preview information and G code)","originalText":"Hello,\n\n I’m using Creality Print 6.1.0 and have found an annoying problem. I am trying to dial in a TPU filament that I have using one of the objects from the flow calibration as my print sample. I was trying to nail down the flow rate, but the filament kept jamming in the print head. When I do a nozzle purge, there is no problem whatsoever, so I know the issue is with the flow rate calculated by the slicer.\n\n Anyway, I have disabled retraction and have been adjusting Max Volumetric Speed. I was able to finally get a complete print, but with problems. When I go to the preview, I can see where the flow is staying below my set point, but I noticed that speeds were wonky (ie one layer at 66mm/s with an 11.63 flow and another layer at 46mm/s with an 11.61 flow rate). This led me to look at line widths where I noticed that there were some that were well above my set line widths. This is where my problem comes in.\n\n I decided to set all line widths to the size of my nozzle (0.6mm), but when I slice, it still gives me line widths up to 0.85mm (see image below)\n\n line width problem 1495×1019 157 KB \n\n This is a top surface layer, and no matter what I try (short of lowering my Max Volumetric Speed) I can’t change this line width. I thought maybe there might be a min/max line width number somewhere or something to do with top surface widths elsewhere, but I cannot find anything. Does anyone have a suggestion as to where I can look to fix the setting that is causing this? (Please note: I am aware there are other slicers better than this one out there, but I have a K1 Max and I need the ability to be able to send my prints straight from the slicer to the printer - I am also aware of this ( Any slicer like Creality Print with printer connection capability? ), but I don’t care for that option). I actually want to understand what is going on with the slicer software to cause it to create the G Code in this manner so that I can get better at dialing in filament and printing better models.\n\n Thanks in advance for any help, Dave.","url":"https://forum.creality.com/t/sliced-line-widths-greater-than-line-width-settings-per-preview-information-and-g-code/47064","productLine":"print","version":"6.1.0","problemType":"other","model":"K1 Max","grade":"有效","replyCount":1,"views":144,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"decf29638be5d1ab","topicId":47040,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-04","lastActive":"2026-02-12","title":"Help, New Creality Print version missing Exclude object","originalText":"Creality print said there was a new version this morning so I downloaded it, under the device tab where the camera is located and what not the option to remove one of the objects being printed is gone. I’ve looked all over to see if there was some option to turn it back on. I tend to print multiple objects and when fails I just remove it so the printer skips over it, but the option is missing so now I’m wasting so much filament!\n\nHello @Hpcat \n\nWelcome to the Creality Forum…! \n\n exclude-icon 394×236 2.73 KB \n\n Pressing this icon brings up the exclude screen.\n\n It should also be on the printer screen. It replaced the “X” that was used to exclude prints.\n\nMake sure in your slicer that the option for exclude objects is \n\n Exclue-Objects 506×461 15.9 KB\n\nOOOOH that’s why I couldn’t find it! I was scared pressing that icon was going to mess up the print because I hovered over it it said skip, thank you so much!","url":"https://forum.creality.com/t/help-new-creality-print-version-missing-exclude-object/47040","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":6,"views":1249,"likeCount":7,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"636de86eff65c3a6","topicId":46983,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-02","lastActive":"2025-12-02","title":"K1 + CFS and Creality Print","originalText":"I upgraded the K1 to CFS, but now I have the problem that when loading colored 3MF files, only a monochrome model is displayed. There is supposed to be a print called K1 + CFS, but I can’t find it.","url":"https://forum.creality.com/t/k1-cfs-and-creality-print/46983","productLine":"print","version":"","problemType":"other","model":"K1","grade":"有效","replyCount":1,"views":55,"likeCount":0,"tags":["creality-k1"],"relReason":"category","sourceType":"用户"},{"uid":"7764eccb90a172d9","topicId":46981,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-02","lastActive":"2025-12-02","title":"Can't find device in creality cloud","originalText":"New to 3d printing I have a new K2 plus combo that is set up and has printed the test pieces that come with the printer. The cloud app and web site show the printer as online yet when I try to print it says no device found connect device. I have checked the IP address and it matches the IP address on my router and shows it connected. On the printer touch screen under account it shows my Creality Cloud ID number and user Number. and the network tab shows it connected to my home network. I can use all the help I can get.","url":"https://forum.creality.com/t/cant-find-device-in-creality-cloud/46981","productLine":"cloud","version":"","problemType":"compat","model":"K2 Plus","grade":"有效","replyCount":1,"views":155,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"cd75809c367ec15d","topicId":46917,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-29","lastActive":"2025-12-01","title":"Creality Cloud g login problem","originalText":"Anyone knows how to fix logi?\n\n In have added printer and successfully ran single print another day\n\n And now I’m not able to login again. Login works from web. But not from Android App. I have tried joining beta program - app updated, but it didn’t help. Have tried cleaning up cache - didn’t help. I can login eith email, but not with google authentication.\n\n Screenshot_20251129-160529 1008×2244 140 KB\n\nDid you solve this problem? Mine did an update and logged out. When trying to log in again, I’m having the same error. Tried to uninstall / install to no avail.\n\nI’ve got the same issue with no solution","url":"https://forum.creality.com/t/creality-cloud-g-login-problem/46917","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":6,"views":426,"likeCount":1,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"6b21ee60361a797f","topicId":46900,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-28","lastActive":"2026-08-31","title":"Disable \"models on platform\" warning toggle missing in Creality Print v6","originalText":"Has anyone found the setting to disable this warning in Creality Print for the K2 Plus? Documentation for v5 shows a checkbox to turn it off, but I can’t find any equivalent option in the current version. If there’s a new location for that toggle, or if the feature was removed, I’d appreciate any clarification from someone who has already dug into it.\n\n image 2106×869 97.8 KB\n\nTo be honest, I never saw it before \n\nI’m using Creality Print 6.3. which one are you using ?\n\nI’m using 6.3.\n\n image 1167×509 28.5 KB","url":"https://forum.creality.com/t/disable-models-on-platform-warning-toggle-missing-in-creality-print-v6/46900","productLine":"print","version":"6","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":5,"views":115,"likeCount":1,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"f68375152352d0d7","topicId":46904,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-28","lastActive":"2025-12-10","title":"Problems with point cloud and merging","originalText":"I scan an object, crop it, remove the parts I don’t want, and leave only what I need. When I press fusion, it creates new elements, and many things I had removed appear in the point cloud. I don’t know what I’m doing wrong.\n\n mesh ready\n\n nube puntos 896×741 107 KB \n\n processing\n\n proceso 587×482 41 KB \n\n Complete fusion, with parts that had been removed\n\n fusio 881×731 104 KB\n\nHi, I have the same problem. Were you able to find a solution?","url":"https://forum.creality.com/t/problems-with-point-cloud-and-merging/46904","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":36,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f12e35853887b0fa","topicId":46840,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-27","lastActive":"2025-12-03","title":"Beta v7 so far is GREAT!!!","originalText":"Hi to all!!\n\nNeed to spam about it… but so far is awesome!\n\nWe recover the preview cam over internet on the Device tab.\n\nThe slicing time is greatly reduced! More than 3 times faster than v6.3.\n\nNavigating through layers, WAY faster and snappier!\n\nSo far, a very good version…\n\nTranslation, have issues… but i live with that….\n\nCreality Print 7 Goods 01 1920×1032 103 KB\n\nThat’s nice. When will Creality be moving their changes back into mainstream Orca, and providing support for Linux users?","url":"https://forum.creality.com/t/beta-v7-so-far-is-great/46840","productLine":"print","version":"6.3","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":510,"likeCount":6,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6da1437c920be761","topicId":46867,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-27","lastActive":"2025-11-28","title":"Tree supports on build plate only should be able detect objects around","originalText":"I’m trying to put tree and normal supports on the same object. I cut it and put one object above the other, using add part to keep distance from the bed. However, when I slice the plate, the tree supports are going through the bottom object. If I slice the object without all this prep, the tree supports are created perfectly, around the object. So, when Creality Print 6.3 adds the tree support, it’s only considering the target object, but it should consider all object on the plate.\n\n On the left image, it’s the prep plate with the supports going through the bottom object. On the right image it’s the same object but without the prep, with the tree supports going around the whole object.\n\n image 1919×719 181 KB\n\n@dalmirnogueira I have had this happen as well.","url":"https://forum.creality.com/t/tree-supports-on-build-plate-only-should-be-able-detect-objects-around/46867","productLine":"print","version":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":57,"likeCount":1,"tags":["feature-need"],"relReason":"category","sourceType":"用户"},{"uid":"b6adee8d856976df","topicId":46865,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-27","lastActive":"2025-11-27","title":"I should be able to print by object if only the last object is higher","originalText":"I should be able to slice a bed with print sequence by object if only the last object is too tall.\n\n The height limit only makes sense when the object being printed is not the last one","url":"https://forum.creality.com/t/i-should-be-able-to-print-by-object-if-only-the-last-object-is-higher/46865","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":27,"likeCount":0,"tags":["feature-need"],"relReason":"category","sourceType":"用户"},{"uid":"0d6e8b3583a43d8f","topicId":46864,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-27","lastActive":"2025-11-27","title":"Creality Print crashing when selectiing object to paint support","originalText":"If I have 2 or more objects on the bed of Creality Print 6.3, I can only select one object at a time to paint supports. If I select multiple objects, the painting supports button becomes faded and I can’t even use the L shortcut.\n\n However, the problem is that if I select only 1 object to paint, and only then use ctrl to select another object, the software crashes.\n\n I know this is kinda of an user error, but the software shouldn’t crash when doing it. It should appear a pop-up saying that I can only paint supports one object at a time or even does nothing at all. But it shouldn’t crash!","url":"https://forum.creality.com/t/creality-print-crashing-when-selectiing-object-to-paint-support/46864","productLine":"print","version":"6.3","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":35,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"27ccc936e300df35","topicId":46848,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-27","lastActive":"2025-11-27","title":"Scale in creality print","originalText":"Hello,\n\n Is it possible to reduce the scale of the model in creality print\n\n Thank you\n\nHello !\n\nYes you can !\n\n Which version of CrealityPrint are you using ?\n\nYou generally have to use the scale function (S keypad shortcut)\n\nok i don’t know what is the version i use but i think it s the last\n\n thank you for your answer and i will test\n\n have a nice day","url":"https://forum.creality.com/t/scale-in-creality-print/46848","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":270,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"afa24ebf4e324261","topicId":46841,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-27","lastActive":"2025-11-27","title":"Creality cr studio v2. 5","originalText":"Guys, can anyone help me. I’ve just got my lizard 3d scanner and installed the software. But when I want to manually align items I have no mark point window the white background photo is from my software and the black background photo is from a video I was working from as you can see I don’t have the option to mark points. Any idea what I’m doing wrong. Tia\n\n Messenger_creation_7561FA6C-6EED-4BBA-ABA6-AE69D08E5E98 574×478 21.2 KB \n\n Messenger_creation_E37DDD6E-A276-4C7A-9A67-4CB5665D0FE8 1532×1068 71.5 KB","url":"https://forum.creality.com/t/creality-cr-studio-v2-5/46841","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":34,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"82c856d48b153f17","topicId":46837,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-26","lastActive":"2025-11-28","title":"Modfiers not correctly applying to a model","originalText":"I’m applying a modifier to a model to remove the top and bottom surfaces so the honeycomb sparse infill is exposed. This works on PrusaSlicer, OrcaSlicer, and according to Mango Jelly on you tube, it works on most slicers.\n\n However, when attempting this on Creality Print, it deletes the area of the modifier. Other slicers behave as expected.\n\n Result using OrcaSlicer:\n\n image 568×554 140 KB \n\n Result using Creality Print:\n\n image 166×160 14.2 KB \n\n This is the same model and modifier Settings for both slicers.\n\n How do I get this to work on Creality Slicer.\n\n image 767×257 9.43 KB \n\n Modifier does not work.3mf (112.8 KB)\n\n ModifierWorksinOrca..3mf (141.1 KB)\n\n I have no idea why this is happening but I’d sure like to know how to make it work in CrPrint.\n\nHello !\n\n Just to make sure, can you share your full screen of the preview ? I fear the lite mode may be activated (it doesn’t show any infill)\n\nLite mode is not enabled.\n\n image 352×825 53.7 KB \n\n this","url":"https://forum.creality.com/t/modfiers-not-correctly-applying-to-a-model/46837","productLine":"thirdparty","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":95,"likeCount":0,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"325846f7111e1865","topicId":46836,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-26","lastActive":"2025-11-26","title":"HALOT BOX is crashing","originalText":"Hello everyone. HALOT BOX has been crashing on me when I click RESIN to continue the slicing process. The first time it happened, I made sure all drivers, software, etc. was up to date and that didn’t work. I then uninstalled/reinstalled HALOT BOX with the version available on Creality’s website. That didn’t work. I ended up resetting my laptop to factory and started with clean installs and minimalist software and drivers. Reinstall HALOT BOX and that seemed to work … until today. It is crashing once more in the same fashion as the first time. Has anyone run into this recently or further in the past?","url":"https://forum.creality.com/t/halot-box-is-crashing/46836","productLine":"print","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":143,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"d826e8ce06f3ec31","topicId":46815,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-25","lastActive":"2025-11-25","title":"CrealityPrint 6.3.0.3420: The currently selected printer (Sermoon D3 Pro) is not compatible with the print preset (Creality Sermoon D3 Pro 0.4 nozzle)","originalText":"This release version claims that the problem is solved, but it is not.\n\nWhen sending a model to the printer, I get the following error:\n\n The currently selected printer (Sermoon D3 Pro) is not compatible with the print preset (Creality Sermoon D3 Pro 0.4 nozzle).\n\n I’ve tried to delete the software and all the data, factory reset printer - nothing helped.","url":"https://forum.creality.com/t/crealityprint-6-3-0-3420-the-currently-selected-printer-sermoon-d3-pro-is-not-compatible-with-the-print-preset-creality-sermoon-d3-pro-0-4-nozzle/46815","productLine":"print","version":"6.3","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":40,"likeCount":0,"tags":["sermoon-d3"],"relReason":"category","sourceType":"用户"},{"uid":"ce31783fed1404ec","topicId":46792,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-25","lastActive":"2025-11-25","title":"creality print has no profile for the ender 3 v2 neo?","originalText":"am i missing something here, or did creality just forget they made this printer?","url":"https://forum.creality.com/t/creality-print-has-no-profile-for-the-ender-3-v2-neo/46792","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":25,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"779bac0b9d3bdeba","topicId":46699,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-20","lastActive":"2025-11-24","title":"Could you help us choose a name for Creality Cloud’s new section?","originalText":"bigstock-Poll-word-in-red-d-letters-on-106461233 900×900 212 KB \n\n Could you help us choose a name for Creality Cloud’s new section?\n\n The coming new chapter of Creality Cloud is created to give every Creality user an effortless, reliable, and truly enjoyable FFF printing experience.\n\n We invite you to vote for your favorite name or submit your own suggestions below: \n\n \n \n FDMuse: The muse of FDM, a source of inspiration for FDM creators\n\n \n \n FDMagic: Magic of FDM, turning ideas into reality like a magical transformation\n\n \n \n FlowPrint: “Flow” refers to the smooth melt-flow process of FFF printing, and “Print” is self-explanatory.\n\n \n \n PrinF: A compressed blend of “Print” + “F” (for FFF)\n\n \n \n BluePrint: A real English word referring to a plan, design draft, or master plan for the community\n\n \n \n CPF (Creality Print Faster)\n\n \n \n CCU (Creality Cloud Ultra)\n\n \n \n Others\n\n \n \n \n \n \n FDMuse \n FDMagic \n FlowPrint \n PrinF \n BluePrint \n CPF \n CCU \n Others \n \n \n \n \n \n 0 \n voters\n\nWhat is fff printing?\n\nI didn’t know what it was either until I looked it up..\n\n FFF-Printing 1029×534 60.6 KB","url":"https://forum.creality.com/t/could-you-help-us-choose-a-name-for-creality-cloud-s-new-section/46699","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":95,"likeCount":1,"tags":["creality-cloud"],"relReason":"category","sourceType":"用户"},{"uid":"c615e73182be197d","topicId":46706,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-20","lastActive":"2025-11-20","title":"CrealityCloud big problem","originalText":"Hi… Today 6am (+1 utc) i turned on Creality Cloud and it was mega laggy… I said like ok maybe some problems and now when i opened it it showed faild to load data… (picture)… Do you have the same problems? Please help","url":"https://forum.creality.com/t/crealitycloud-big-problem/46706","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":73,"likeCount":0,"tags":["creality-cloud"],"relReason":"category","sourceType":"用户"},{"uid":"727600142150db77","topicId":46701,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-20","lastActive":"2025-11-20","title":"Ender 6 issues and not available in CrealityPrint?","originalText":"Hi Creality and printing friends!\n\n I recently got an Ender 6 printer but have trouble getting it to print properly. I wanted to try Crealitys own slicing and printing software as that should be optimal for the printer and how it works. But I can not even see the Ender 6 as a printer to choose from? Why is that?\n\n \n Anyone else that has an Ender 6 and can recommend settings and software for it to work? \n Is there any firmware for it that work better? I have v 1.0.4.9 right now. \n One thing is that it gets thermal runaway and thermal errors. As default it always activates the fan and if you do not turn that off when starting a print, it will stop due to thermal issue. Not reaching temp in time etc. Any solution for this?","url":"https://forum.creality.com/t/ender-6-issues-and-not-available-in-crealityprint/46701","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":172,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"388d0b1faa0cc0a7","topicId":46664,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-18","lastActive":"2025-11-19","title":"Fuzzy Skin","originalText":"Trying to use the fuzzy skin. The YouTube video is useless to me. His screen looks way different than mine. PLEASE someone give a step-by-step procedure for finding this feature, if it exists.\n\n Also, the slicer BADLY needs a search function.\n\nI just tried fuzzy skin myself. It is under advanced, special mode, at the bottom\n\n image 816×1479 67.9 KB \n\n Once a type of skin is chosen, it opens up these options:\n\n image 698×209 8.69 KB \n\n I just used the defaults on my first try. It is an interesting texture. Looked good on the cat model I was printing. Note, fuzzy skin is hard to paint.","url":"https://forum.creality.com/t/fuzzy-skin/46664","productLine":"print","version":"8.69","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":2275,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"106909b1227c1a1d","topicId":46656,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2025-11-18","lastActive":"2025-11-18","title":"Probleme avec mapping automatique","originalText":"bonjour,\n\n j’ai la dernière version du logiciel 6.3.0.3420,\n\n j’ai 3 CFS sur une creality HI l’imprimante reconnait les filaments RFID\n\n mais le logiciel ne reconnait pas les filaments en faisant un mapping automatique\n\n pouvez vous m’aider\n\n cordialement","url":"https://forum.creality.com/t/probleme-avec-mapping-automatique/46656","productLine":"print","version":"6.3","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"071c033122d888bd","topicId":46640,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-17","lastActive":"2025-11-24","title":"How can I remove the intersection of two objects in Creality v6?","originalText":"Up till now I have used an online slicer called “Self Cad” but they seem to have removed this tool. Can Creality let me place one object intersecting another and then remove all “material” from the space they have in common?\n\nI have the same question. I couldn’t find anything, but my model worked with the overlapping pieces. It flags an error, bu t printed fine. Wasted a bit of filament on parts that were inside the other half of the model.\n\nSelfCAD is working again. Much easier than messing around with Creality, just place the objects where you want and click on “delete the intersection”.\n\n Thanks nonetheless….","url":"https://forum.creality.com/t/how-can-i-remove-the-intersection-of-two-objects-in-creality-v6/46640","productLine":"print","version":"","problemType":"slice","model":"未标注","grade":"有效","replyCount":3,"views":137,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d0becbed973b7b13","topicId":46639,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-17","lastActive":"2025-11-24","title":"Where can I find documentation of all the menu items in Creality v6?","originalText":"The title says it all…\n\nI’m not sure if this covers every setting, but it covered every setting I’ve looked for. Creality Print 6.x Contents | Creality Wiki\n\nThat helps some. I sure wish there was searchable text rather than videos though. Thanks!","url":"https://forum.creality.com/t/where-can-i-find-documentation-of-all-the-menu-items-in-creality-v6/46639","productLine":"print","version":"6","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":54,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"fb68a83313bc6101","topicId":46632,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-17","lastActive":"2025-11-17","title":"Only one bottom layer when infill set at 0%","originalText":"hello there,\n\nFirst of all, sorry for my bad english \n\n On creality 6 (v6.3.0), running using flatpack (linux). When i et infill to 0% there only one bottom layer generated, But in parameter there should be 3.\n\n Does i miss an option ?\n\n My printer is a Creality Hi\n\n Here an screenshot to explain the problem :\n\n image 1746×1395 199 KB","url":"https://forum.creality.com/t/only-one-bottom-layer-when-infill-set-at-0/46632","productLine":"print","version":"6.3.0","problemType":"compat","model":"Creality Hi","grade":"有效","replyCount":1,"views":21,"likeCount":0,"tags":["crealityprint-v6"],"relReason":"tag","sourceType":"用户"},{"uid":"d43bb3cf60137295","topicId":46635,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-17","lastActive":"2025-11-17","title":"Wrong first overhanging layer direction","originalText":"Hello, my friends! I found a small mistake in slicing algoritm: often first overhanging layer have the same direction, as the support layer.\n\nAs result - very low quality on overhanging surface: 50% of lines have 100% overlaping with supports and 50% lines printing on the air.\n\n Screenshot_1 764×598 112 KB","url":"https://forum.creality.com/t/wrong-first-overhanging-layer-direction/46635","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":28,"likeCount":0,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"c8c4957f069f2a93","topicId":46616,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"DE","date":"2025-11-16","lastActive":"2025-11-16","title":"wie kann ich neue fonts in creality print einfügen das ich sie mit der text funktion nutzen kann ?","originalText":"wie kann ich neue fonts in creality print einfügen das ich sie mit der text funktion nutzen kann ?","url":"https://forum.creality.com/t/wie-kann-ich-neue-fonts-in-creality-print-einfugen-das-ich-sie-mit-der-text-funktion-nutzen-kann/46616","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":38,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"241b4dd0b1b66f4b","topicId":46608,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-16","lastActive":"2025-11-16","title":"How do I cut out a piece of model in CrealityPrint?","originalText":"Apologies for my ignorance, but I can’t find any tutorial on YouTube for my problem or a matching topic in the forum.\n\n I have a Swan STL that I intend to make remote control for my wife. I have scaled it up, hollowed it out, and sliced off the pieces I need to fit in my print area, but now I want to cut out a piece of the top to access the inside. (I have attached a photo for reference.)\n\n I created a “negative part” cube for the section I wish to cut/print separately, but now I’m stumped as to how to make this a separate piece. Even if I check the preview with the negative part, it only cuts off the outside edges of the cube and not everything inside of the cube’s volume. (If you’re used to designing in Fusion 360 at all like me, I’m trying to essentially create a new body via the “intersect” method.) Unfortunately this STL isn’t my design, so I can’t edit it except in the slicer.\n\n Thanks for any help you can provide!\n\n Screenshot 2025-11-15 153209 1704×974 157 KB\n\nYou might be able to print the swan with ‘pause’ at layer and stop the print. Not sure about the head but you could turn it upside down and stop at layer. Trouble is it would need supports and I don’t think you can generate for just the head.","url":"https://forum.creality.com/t/how-do-i-cut-out-a-piece-of-model-in-crealityprint/46608","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":1054,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"76f0df9a3978e46c","topicId":46604,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-15","lastActive":"2025-11-16","title":"Slicer moves ground color into top layers","originalText":"Bottom color bleeds into upper layers of these letters. Using Hi with 0.2 nozzle and 0.1 layer, Hyper PLA, all else standard. Tried different fonts, font size and bold. Always some artifacts in lower layer copied up to top. Also, and not a serious issue, I could not get the height range (0.1) synchronized with the letter extrusion of .5. There is a thin white layer under the start of the letter. Any suggestions please, and yes they are visible in the print?\n\n image 698×380 40.5 KB\n\nThink I could work around the problem by using one color and a pause with manual filament change!!!\n\nSort of got it working by using a simple bold font and ironing. Looks good enough but is not a satisfactory solution!","url":"https://forum.creality.com/t/slicer-moves-ground-color-into-top-layers/46604","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":52,"likeCount":0,"tags":["trouble-shooting","multicolor"],"relReason":"category","sourceType":"用户"},{"uid":"35bf06b0d09f64a9","topicId":46589,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-15","lastActive":"2025-11-15","title":"Print latest update has rendered my slicer un operable","originalText":"Open GL2 not supported program closing update graphics driver is message i get and yet it worked fine with previous version. I have Uninstalled all creality print apps and tried reinstalling older version to get the same message","url":"https://forum.creality.com/t/print-latest-update-has-rendered-my-slicer-un-operable/46589","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"tags":["trouble-shooting","crealityprint-v6"],"relReason":"tag","sourceType":"用户"},{"uid":"346f9bfb0c6f376e","topicId":46533,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-13","lastActive":"2025-12-05","title":"Creality Print no longer allows me to fill in voids","originalText":"Hi forum,\n\n I have been successfully printing on my K1 Max for nearly a year now. But recently, Creality Print stopped allowing me to fill open voids. I can see the Sparce Infill Density, but when I increase it from 15% to anything above, like 75% it doesn’t change. The void is still hollow. Changing the patterns doesn’t help either.\n\n Screenshot 2025-11-12 155600 310×724 84.6 KB \n\n Any idea what I’m missing here? It used to work great, then all of a sudden, one day it stopped. Thanks!\n\nNo one has any idea’s?\n\nI just tried to uninstall the most recent version and roll back to an older one and that fixed it. Seems to be something wonky in the new version with my setup.","url":"https://forum.creality.com/t/creality-print-no-longer-allows-me-to-fill-in-voids/46533","productLine":"print","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":4,"views":263,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"599c31ad46a911b1","topicId":46489,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-11","lastActive":"2025-11-16","title":"Using custom filament settings with CFS","originalText":"Hi!\n\nI am new to the Forum - maybe any of those more experienced guys can help me:\n\n I have a newly bought Creality K2 Pro with a CFS. I would like to use non-creality filaments for a print and managed to create a user preset for the respective filament (some kind of ABS).\n\n However, I do not manage to allocate this user preset to the respective slot of the CFS - I just find Generic and Creality presets in the CFS configuration page. And even if: How can I allocate the respective slot to my model during slicing?\n\n Many thanks\n\n Sven\n\nDoes anyone have an idea?","url":"https://forum.creality.com/t/using-custom-filament-settings-with-cfs/46489","productLine":"print","version":"","problemType":"feature","model":"K2 Pro","grade":"有效","replyCount":2,"views":117,"likeCount":0,"tags":["filament","cfs"],"relReason":"category","sourceType":"用户"},{"uid":"526226a6727dfce7","topicId":46479,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-10","lastActive":"2025-11-10","title":"Slicer doesnot copy all.","originalText":"I am printing a rc plane in LW-PLA on a K1 max and now the slicer forgets the ribs so I only have the outer wing and no ribs inside. The example is good but after slicing they are gone. Any idea.\n\n Greating from the Netherlands, Adrian","url":"https://forum.creality.com/t/slicer-doesnot-copy-all/46479","productLine":"print","version":"","problemType":"slice","model":"K1 Max","grade":"有效","replyCount":1,"views":26,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"d81360ab00401613","topicId":46473,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-10","lastActive":"2025-11-10","title":"LINUX for creality scan.","originalText":"STILL waiting, but my patience is wearing very thin","url":"https://forum.creality.com/t/linux-for-creality-scan/46473","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":239,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4318b8c5d1d389fb","topicId":46468,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-10","lastActive":"2025-11-10","title":"Print time estimates for Ender V3 SE in creality print","originalText":"Since the last update, the print time estimates for the ender V3 SE seem to be off by a couple of hours, Is anyone else having this problem?","url":"https://forum.creality.com/t/print-time-estimates-for-ender-v3-se-in-creality-print/46468","productLine":"print","version":"","problemType":"other","model":"Ender-3 V3 SE","grade":"有效","replyCount":1,"views":28,"likeCount":0,"tags":["ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"1840cf431a4d7444","topicId":46443,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-11-09","lastActive":"2025-12-20","title":"Color flushing into new objects","originalText":"Hello. I am completely new to 3D Printing. I am attempting to do a 2 color Benchy. My issue is that it says I am using about 11g of filament for the item and 130g of filament for flushing. That’s ridiculous. I wouldnt really have an issue with that if it would let me do something usefull with the waste. Like instead of printing a tower… why can I print another object? Is that a possibility and I am just stupid and completely missing that option. Any help wo
