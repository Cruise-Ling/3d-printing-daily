ilament start gcode\n{if (position[2] > first_layer_height) }\nM104 S[material_flow_temp_graph]\n{else}\nM104 S[first_layer_temperature]\n{endif}","textCn":"我升级到了 6.3.3240，我注意到在预览界面上，打印温度似乎只对应于温度的那个标尺设置。每一层并没有得到预览中计算流量所设定的温度。复选框已勾选，我在图表里填入了“[[0.0,250],[10.0,259],[40.0,275]]”。我遗漏了什么？需要新建一个配置。导入到新版本时出了点问题。设置新配置后，按层自动温度就正常了。; filament start gcode {if (position[2] > first_layer_height) } M104 S[material_flow_temp_graph] {else} M104 S[first_layer_temperature] {endif}","truncated":false,"url":"https://forum.creality.com/t/temp-by-nozzle-flow/45600","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":135,"likeCount":0,"sourceType":"论坛"},{"uid":"611351ba17401dd0","date":"2025-09-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"🔧 ISSUE: CrealityPrint 6.3.0.3417 - Missing discharge column on Mac M1","titleCn":"🔧 问题：CrealityPrint 6.3.0.3417 - Mac M1 上缺失排放列","originalText":"Hi community, after updating to the latest version of CrealityPrint (6.3.0.3417), I can no longer see the “Discharge” column that used to appear in the G-code preview.\nHas anyone else experienced this issue, especially on Mac?\nDetails:\nVersion: CrealityPrint 6.3.0.3417 (latest version)\nOS: macOS with M1 chip\nThe column was useful for material calculations and analysis\nIs this a known bug or is there a setting to restore it?\nThanks!\nHello ! Heard of the same issue on Discord :\nIt says that in the release notes for CP 6.2… “We’re working with the firmware team on print time & purge amount estimation accuracy. A new K2 Plus firmware (mid-October) will address this”\nSo maybe it is expected to not show anything until the new firmware is available and installed.\nScreenshot_2025-09-29-13-07-58-62_40deb401b9ffe8e1df2f1cc5ba480b12","textCn":"社区的朋友们，更新到 CrealityPrint 最新版本（6.3.0.3417）后，我在 G-code 预览里再也看不到以前出现过的“Discharge”列了。还有别人遇到这个问题吗，尤其是在 Mac 上？详情：版本：CrealityPrint 6.3.0.3417（最新版本）；操作系统：搭载 M1 芯片的 macOS；这一列对材料计算和分析很有用。这是已知的 bug，还是有设置可以恢复它？谢谢！你好！我在 Discord 上听说过同样的问题：据说 CP 6.2 的发行说明里写着“我们正与固件团队合作，提高打印时间和冲刷量的估算精度。新的 K2 Plus 固件（10 月中旬）将解决这个问题”。所以也许在新固件可用并安装之前，它不显示任何内容是可以预期的。Screenshot_2025-09-29-13-07-58-62_40deb401b9ffe8e1df2f1cc5ba480b12","truncated":false,"url":"https://forum.creality.com/t/issue-crealityprint-6-3-0-3417-missing-discharge-column-on-mac-m1/45544","productLine":"firmware","version":"","versionRaw":"","problemType":"compat","model":"K2 Plus","grade":"有效","replyCount":3,"views":76,"likeCount":0,"sourceType":"论坛"},{"uid":"3e0823ec6a85e1ee","date":"2025-09-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality falcon pro 10w weird lines while cutting problem !","titleCn":"Creality Falcon Pro 10W 切割时出现奇怪线条的问题！","originalText":"175907320050292316527366790136\nhello everyone\nI have a creality falcon pro 10 w but while cutting its makes weird lines like zigzags shown below. I have everything installed correctly but the problem still exist. I tried a lot of solutions but no hope . Can someone heeelp me please.\nI solve the problem. The solution is try to lower to an old version of lightburn.","textCn":"175907320050292316527366790136 大家好 我有一台 Creality Falcon Pro 10W，但切割时它会切出像下面所示的锯齿状奇怪线条。我所有东西都安装正确，但问题仍然存在。我尝试了很多解决方案，但都没有希望。有人能帮帮我吗。我解决了这个问题。解决方案是尝试降到旧版本的 LightBurn。","truncated":false,"url":"https://forum.creality.com/t/creality-falcon-pro-10w-weird-lines-while-cutting-problem/45540","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":46,"likeCount":0,"sourceType":"论坛"},{"uid":"394ea95842da4ee9","date":"2025-09-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Crealit print V6.2.2 y K1C","titleCn":"Creality Print V6.2.2 与 K1C","originalText":"Hello, I’m sorry, I don’t speak English and I’m using an automatic translator, so please excuse any mistakes.\nI have that software and that printer, but the problem is that when I draw a circle on a wall, the printer doesn’t print a circle, but an oval. Can this be fixed?\nIf it’s a square or rectangle, it prints correctly, and the height of the print is also correct. The filament is PLA esun.\nSolved, I removed CrealityPrint and installed OrcaSlicer, problem solved.","textCn":"你好，抱歉，我不会说英语，我正在使用自动翻译器，所以请原谅任何错误。我有那个软件和那台打印机，但问题是当我在壁上画一个圆时，打印机打印出来的不是圆，而是椭圆。这能修复吗？如果是正方形或矩形，它打印正确，打印高度也正确。耗材是 PLA esun。已解决，我卸载了 CrealityPrint 并安装了 OrcaSlicer，问题解决了。","truncated":false,"url":"https://forum.creality.com/t/crealit-print-v6-2-2-y-k1c/45534","productLine":"thirdparty","version":"6.2","versionRaw":"6.2.2","problemType":"other","model":"K1","grade":"有效","replyCount":2,"views":52,"likeCount":1,"sourceType":"论坛"},{"uid":"a6308ce31773514d","date":"2025-09-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can’t find Advanced mode in Creality Print 6","titleCn":"在 Creality Print 6 中找不到高级模式","originalText":"I had issues with the first layer adhesion and I ran a bunch of z offset tests from the K1 MAX’s touch screen. It seems -0.105 is the sweet spot.\nI tried to go to Creality Print to save this new z offset but I can’t find the Advanced mode tab/menu anywhere!\nAm I blind or just otherwise losing it???\nSomebody please tell me where I can find it…\nHello ! You have to put it in the printer profile\nWell that was well hidden… thank you very much!\nDoes this preset apply when using Creality Cloud or when printing from the printer’s local files or does it apply only when using Creality Print?\nEdit: it doesn’t seem to work when using Creality Cloud.","textCn":"我遇到了首层热床附着的问题，我在 K1 MAX 的触摸屏上跑了一堆 Z 轴补偿测试。看起来 -0.105 是最佳值。我试着到 Creality Print 里保存这个新的 Z 轴补偿，但我到处都找不到高级模式标签/菜单！我是瞎了还是彻底糊涂了？？？ 谁能告诉我它在哪里…… 你好！你得把它写进打印机配置(参数配置)里 那藏得可真好……非常感谢！ 这个预设在使用 Creality Cloud 时适用，还是从打印机本地文件打印时适用，还是只在使用 Creality Print 时适用？ 编辑：使用 Creality Cloud 时似乎不起作用。","truncated":false,"url":"https://forum.creality.com/t/can-t-find-advanced-mode-in-creality-print-6/45517","productLine":"cloud","version":"6","versionRaw":"6","problemType":"quality","model":"K1 Max","grade":"有效","replyCount":4,"views":481,"likeCount":2,"sourceType":"论坛"},{"uid":"95d5d97e55c00c9b","date":"2025-09-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Applying text to surfaces","titleCn":"把文字应用到表面","originalText":"I’m on Creality Print 6.2.2 on a Windows machine. I can always apply text to a surface the first time, but when go to a second or third face, it places on the build plate.\ncreality_1\ncreality_2\nMe too! There needs to be a way to move text to a chosen surface. I know in theory it has that feature, but in practice it very rarely works.","textCn":"我在 Windows 机器上使用 Creality Print 6.2.2。第一次把文字应用到某个表面总是可以，但当我要应用到第二个或第三个面时，它就放到热床上了。 creality_1 creality_2 我也是！必须有办法把文字移动到你选定的表面。我知道理论上它有这个功能，但实际上很少能用。","truncated":false,"url":"https://forum.creality.com/t/applying-text-to-surfaces/45500","productLine":"print","version":"6.2","versionRaw":"6.2.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":131,"likeCount":1,"sourceType":"论坛"},{"uid":"8c9ebd565bfda6f8","date":"2025-09-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"een gewone bestand naar g code zetten","titleCn":"把普通文件转成 G-code","originalText":"hoe kan ik een gewone bestand naar g code maken\nik heb de 3d printer net een week het gaat om een creality ender-3 v3 se printer wie kan me helpen","textCn":"我怎样才能把普通文件做成 G-code？我拿到这台 3D 打印机才一周，是 Creality Ender-3 V3 SE 打印机，谁能帮帮我？","truncated":false,"url":"https://forum.creality.com/t/een-gewone-bestand-naar-g-code-zetten/45455","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":1,"views":23,"likeCount":0,"sourceType":"论坛"},{"uid":"853d72ffdf805494","date":"2025-09-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"HI No longer listed as a selectable printer","titleCn":"HI 不再被列为可选打印机","originalText":"I recently purchased an HI Combo. Using Creality Cloud initially I could select the HI.\nAfter working flawlessly for a week, I have lost the ability to print unless I select a printer, However; there is no longer a printer listed for the HI as initially when installed Creality Print just isn’t worthy unless this is repaired. There Are numerous slicers out there.","textCn":"我最近买了一台 HI Combo。最初使用 Creality Cloud 时我能选择 HI。在完美运行一周后，我失去了打印能力，除非我选择一台打印机；但是，HI 已经不再列在打印机里，就像最初安装时那样。Creality Print 除非把这一点修好，否则就是不值得用。市面上有众多切片软件。","truncated":false,"url":"https://forum.creality.com/t/hi-no-longer-listed-as-a-selectable-printer/45454","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":85,"likeCount":0,"sourceType":"论坛"},{"uid":"251955baec052770","date":"2025-09-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Text on a curved surface","titleCn":"曲面上的文字","originalText":"I have 2 questions running Creality Print 6.2.2 on Windows..\nI have a cylinder I want to place text on. I thought I did it with an earlier version. Is this possible?\nI have a box I can select the first side (flat) and put some text on it, but if I rotate and try to place text on the opposite side of the box, it places the text on the inside wall of the first side.\nHello !\nConcerning the first question, you have to activate “Per Glyph”\nconcerning the second question, I don’t really know as I can hardly visualize it. sorry\nConcerning the second question. This figure you can see the embossed “Wipes, which worked.\ncreality_1\nThe second image I selected the other side and entered “Wipes.” As you can see it places it on the first side’s back side.\ncreality_2\nType 1 box.3mf ( )","textCn":"我在 Windows 上运行 Creality Print 6.2.2，有 2 个问题。我有一个圆柱体，想在上面放置文字。我以为我在较早的版本中做到过。这有可能吗？我有一个盒子，我可以选择第一个面（平面）并在上面放一些文字，但如果我旋转并尝试把文字放在盒子的对面，它会把文字放在第一个面的内侧壁上。你好！关于第一个问题，你必须启用“逐字形”。关于第二个问题，我并不太清楚，因为我几乎无法想象它。抱歉 关于第二个问题。这个图中你可以看到浮雕的“Wipes”，这成功了。creality_1 第二张图我选择了另一面并输入了“Wipes”。如你所见，它把它放在了第一个面的背面。creality_2 Type 1 box.3mf（ ）","truncated":false,"url":"https://forum.creality.com/t/text-on-a-curved-surface/45460","productLine":"print","version":"6.2","versionRaw":"6.2.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":3,"views":892,"likeCount":0,"sourceType":"论坛"},{"uid":"065f0255288028d5","date":"2025-09-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Rotating a disc with motor","titleCn":"用电机旋转圆盘","originalText":"i want to rotate a ciruclar disc with motor diagram givven , but i want my creality printer make the circuaor disc very acccuare , like in the motor there is a keyshaft , how shoud i do settings in pinter to make sure make a good and perfect design since the hole is only 3mmand keyshaft size is 0.5 m i have k2 plus","textCn":"我想按给定的电机图纸旋转一个圆盘，但我希望我的 Creality 打印机把圆盘做得非常精确。比如电机上有一根键轴，我该怎么在打印机里设置，才能确保做出良好完美的设计，因为孔只有 3mm，而键轴尺寸是 0.5 mm，我用的是 K2 Plus。","truncated":false,"url":"https://forum.creality.com/t/rotating-a-disc-with-motor/45450","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":38,"likeCount":0,"sourceType":"论坛"},{"uid":"510bb4c5f67a4b5c","date":"2025-09-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.2.2.2 Login/register button and Device List dialog box empty","titleCn":"Creality Print 6.2.2.2 登录/注册按钮和设备列表对话框为空","originalText":"I’ve just upgraded an Intel Mac to Creality Print v 6.2.2 from v 6.2.1. Unfortunately, the Creality button (top left) and Settings dialog boxes no longer work - they just pop up empty! Version 6.2.1 works ok on other Macs we have in the office. Just this latest version does not work. Creality Cloud on our iphone’s is also working ok. So our network and the Creality printers are all ok. Is there some weird network setting for 6.2.2 that needs to be sorted out?\nThanks in advance!","textCn":"我刚把一台 Intel Mac 从 Creality Print v 6.2.1 升级到 v 6.2.2。很不幸，Creality 按钮（左上角）和设置对话框都不能用了——弹出来全是空的！6.2.1 版本在我们办公室的其他 Mac 上工作正常。只有这个最新版本不能用。我们 iPhone 上的 Creality Cloud 也工作正常。所以我们的网络和 Creality 打印机都没问题。6.2.2 是不是有什么奇怪的网络设置需要处理？提前感谢！","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-2-2-2-login-register-button-and-device-list-dialog-box-empty/45375","productLine":"cloud","version":"6.2","versionRaw":"6.2.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":39,"likeCount":0,"sourceType":"论坛"},{"uid":"f0f53634e218ac7d","date":"2025-09-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"I need help Making the creality logo into an R","titleCn":"我需要帮助把 creality 标志改成 R","originalText":"I decided to name my Creality k1c “Reality” i want to 3d print the creality logo and emblem and put it on my k1c. The difference is im going to drop the c and make a capitol R in the same shape and lime green color as the creality emblem. If there is anyone out there who can help me please do im new to this and a lil help would go a long way in helping me achieve this silly goal. Even if you have some advice please let me know thanks -Spencer\ngrok_image_6wze1k\nI’m sorry but I don’t understand exactly your issue. You want to print this R but you have the photo but not the 3D file ?","textCn":"我决定把我的 Creality k1c 命名为“Reality”，我想 3D 打印 creality 的标志和徽章，然后装到我的 k1c 上。不同之处在于我要去掉 c，做一个同样形状、同样是柠檬绿色的 R，和 creality 徽章一样。如果有人能帮我，请帮帮我，我是新手，一点点帮助对实现这个傻乎乎的目标会很有用。哪怕你有一些建议，也请告诉我，谢谢 -Spencer grok_image_6wze1k。抱歉，我不太明白你的具体问题。你想打印这个 R，但你有照片却没有 3D 文件？","truncated":false,"url":"https://forum.creality.com/t/i-need-help-making-the-creality-logo-into-an-r/45359","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"d25e2b7fc252fa49","date":"2025-09-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to use Creality's jitter calibration? What is the axes have different print quality?","titleCn":"如何使用 Creality 的抖动校准？为什么各轴打印质量不同？","originalText":"Hi all, hoping someone has some insight:\nUnder speed calibrations there is a “jitter speed” option. After printing it, I’m seeing a clear difference between the X and Y axis.\nAs it’s not listed in their tutorial section, does anyone have any general information on this test? What is it meant to test? How do I interpret the results? What settings should I change?\nIt appears that the test is to calibrate jerk speed, however I have no idea why the two axes have differing print quality.\nAny advice?\nPictures below:\nLabeled X, actually on the Y axis. Weird print defects, why is this happening?\nPXL_20250918_045727972\nFront side of the one labeled X. The ridges are fused at the corners and are generally too close together.\nPXL_20250918_045736645\nFront side of the one labeled Y (but is on the x axis). Ridges are well (perfectly) spaced.\nPXL_20250918_045741320\nBack side of the one labeled Y. No print defects.\nPXL_20250918_045746970\nCreality Print 6.2.1\nK2 Plus Combo\nThank you in advance!\nFynnAA:\njitter speed\n@FynnAA Here’s a link to the description of what it does, but nothing about the calibration. They discuss Jitter speed near the bottom of the page. …","textCn":"大家好，希望有人能给我一些见解：在速度校准下面有一个“抖动速度”选项。打印它之后，我看到 X 轴和 Y 轴之间有明显的差异。由于他们的教程部分没有列出这个，有人有这个测试的一般信息吗？它是要测试什么？我该如何解读结果？我应该更改哪些设置？看起来这个测试是校准 jerk 速度，但我不知道为什么两个轴的打印质量会不同。有什么建议吗？图片如下：标为 X 的，实际上在 Y 轴上。奇怪的打印瑕疵，为什么会这样？PXL_20250918_045727972。标为 X 的那个的正面。凸纹在角落处融合了，而且总体上太靠近。PXL_20250918_045736645。标为 Y 的那个的正面（但它是在 X 轴上）。凸纹间距良好（完美）。PXL_20250918_045741320。标为 Y 的那个的背面。没有打印瑕疵。PXL_20250918_045746970。Creality Print 6.2.1。K2 Plus Combo。提前感谢！FynnAA：抖动速度。@FynnAA 这是它做什么的说明链接，但没有关于校准的内容。他们在页面底部附近讨论了 Jitter speed。……","truncated":true,"url":"https://forum.creality.com/t/how-to-use-crealitys-jitter-calibration-what-is-the-axes-have-different-print-quality/45276","productLine":"cloud","version":"","versionRaw":"","problemType":"quality","model":"K2 Plus","grade":"有效","replyCount":2,"views":149,"likeCount":0,"sourceType":"论坛"},{"uid":"a05cbe03b11cb7a1","date":"2025-09-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"No option in Halot Box for Printer Halot Play","titleCn":"Halot Box 中没有 Halot Play 打印机的选项","originalText":"Just unboxed my Play and installed installed Halot Box. It doesn’t have an option to select a Halot Play printer in the field. What parameters should I use?\nsame problem over here , cant find my modehalot play\nEventually Creality help desk got back to me. Apparently the current versions of Halot Box doesn’t support Halot play. They suggested I install an older version of Box. By the time they had responded. I had already downloaded Chitubox and was able to find Halot Play there. I’ve been using it ever since. Works great for me! I never did get around to trying to downloading an older version of Box, so I don’t know if it will work.\nEarl","textCn":"我刚拆箱我的 Play 并安装了 Halot Box。它的选择项里没有可以选择 Halot Play 打印机的选项。我应该用什么参数？ 我这里也有同样的问题，找不到我的型号 halot play 最后 Creality 客服回复了我。显然当前版本的 Halot Box 不支持 Halot Play。他们建议我安装旧版本的 Box。等他们回复的时候，我已经下载了 Chitubox，并在那里找到了 Halot Play。从那以后我就一直用它。对我来说效果很好！我一直没抽出时间去尝试下载旧版本的 Box，所以我不知道它能不能用。 Earl","truncated":false,"url":"https://forum.creality.com/t/no-option-in-halot-box-for-printer-halot-play/45266","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":92,"likeCount":0,"sourceType":"论坛"},{"uid":"661f6ef73f71a788","date":"2025-09-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Flush into Object Still not working?","titleCn":"Creality Print 冲刷到对象仍然不起作用？","originalText":"Has anyone else had issues with flushing volumes not changing and total material weight going up when you add an object and set it to be flushed into? Not sure what im doing wrong if anything. It seems to work just fine on my Bambu. I’m about to redownload PRUSA and see if it’s any different there.\nStill not working. Creality told me to:\ndo try the following;\nEnsure you’re on the newest Creality Print (v6.3+ as of late 2025) and K2 Plus firmware bugs persist but updates sometimes help. Load models, paint colors, enable prime tower, right-click your flush object > Flush Options, tick all relevant color transitions and “flush into infill,” and set its layer volume higher than needed purge. Slice, then preview layers to confirm flushing hits the object before main prints (it often prints mains first, wasting filament).\nSwitch to Orca Slicer (import K2 Plus profile) it reliably redirects flush (e.g., 77g to 49g waste) unlike Creality Print.\nOptimize color order (dark to light) and add 1-2 dedicated flush objects per transition. …","textCn":"还有别人遇到过这样的问题吗：当你添加一个对象并设置为冲刷到它时，冲刷量不变，总材料重量却上升？不确定我是否做错了什么。它在我的 Bambu 上运行得很好。我正准备重新下载 PRUSA 看看那里是否不同。还是不起作用。Creality 让我：试试以下操作；确保你用的是最新的 Creality Print（截至 2025 年末为 v6.3+）以及 K2 Plus，固件 bug 仍然存在，但更新有时会有帮助。加载模型，给颜色上色，启用擦料塔，右键点击你的冲刷对象 > 冲刷选项，勾选所有相关的颜色转换和“冲刷到填充”，并将其层体积设置得高于所需的清洗量。切片，然后预览各层以确认冲刷在主体打印之前命中对象（它常常先打印主体，浪费耗材）。换到 Orca Slicer（导入 K2 Plus 配置），它能可靠地重定向冲刷（例如从 77g 降到 49g 浪费），不像 Creality Print。优化颜色顺序（从深到浅），并为每次转换添加 1-2 个专用的冲刷对象。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-flush-into-object-still-not-working/45219","productLine":"thirdparty","version":"6.3","versionRaw":"6.3","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":323,"likeCount":0,"sourceType":"论坛"},{"uid":"48208872a3d106ff","date":"2025-09-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.2 not working on CRM4","titleCn":"Creality Print 6.2 在 CRM4 上无法使用","originalText":"I cannot get any successful prints using Creality Print 6.2 on my CRM4 printer. Is anyone else having problems printing using the Creality Print 6.2 slicing software.\nCan you give more information about this issue ?\nNickGarai:\nI’ve had similar issues with 6.2 prints that didn’t come out right. Rolling back to the previous version worked better for me.","textCn":"我在我的 CRM4 打印机上使用 Creality Print 6.2 无法成功打印任何东西。还有其他人使用 Creality Print 6.2 切片软件打印时遇到问题吗。 你能提供更多关于这个问题的信息吗？ NickGarai：我在 6.2 上也遇到过类似问题，打印出来的东西不对。回退到上一个版本对我来说效果更好。","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-2-not-working-on-crm4/45224","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":55,"likeCount":0,"sourceType":"论坛"},{"uid":"765d30232ef8aee9","date":"2025-09-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Increase build volume","titleCn":"增加构建体积","originalText":"Is there any way to increase Z axis volume for ender 5 max? Can I do it in the root access? I did a hardware modified so now need to firmware move to 500mm.","textCn":"有没有办法增加 Ender 5 Max 的 Z 轴体积？能在 root 权限下做吗？我做了硬件改装，所以现在需要通过固件把它改到 500mm。","truncated":false,"url":"https://forum.creality.com/t/increase-build-volume/45212","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Ender-5 Max","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"d22fe3a03e3d45cf","date":"2025-09-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 3 S1 Pro - No preview image","titleCn":"Ender 3 S1 Pro - 没有预览图","originalText":"I have just moved to creality print as I dont print every day and want to use the preconfigured profile.\nCreality Print V6.2.2.3203 Release\nThe preview image is in the gcode but does not show on the printer touch screen!\nMachine Details\nEnder 3 S1 Pro\nF/W VER 2.0.8.28F4\nScreen VER 1.0.5\nI had this working in Cura but I dont want to use that anymore!\nI did edit the printer setting to JPG instead of PNG and that still did not work\nI created a post processor for thumbnails\nOn GitHub","textCn":"我刚转到 creality print，因为我不是每天都打印，想用预配置的配置。Creality Print V6.2.2.3203 Release 预览图在 gcode 里有，但打印机触摸屏上不显示！机器详情 Ender 3 S1 Pro F/W VER 2.0.8.28F4 Screen VER 1.0.5 我在 Cura 里是能用的，但我不想再用它了！我确实把打印机设置里的预览图改成了 JPG 而不是 PNG，还是不行。我为缩略图做了一个后处理脚本。在 GitHub 上","truncated":false,"url":"https://forum.creality.com/t/ender-3-s1-pro-no-preview-image/45100","productLine":"thirdparty","version":"6.2","versionRaw":"6.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":114,"likeCount":0,"sourceType":"论坛"},{"uid":"65c57b0e941608bc","date":"2025-09-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bug in CrealityScan 4 (v1.2.8) interface (Portuguese - Brazil language setting)","titleCn":"CrealityScan 4（v1.2.8）界面中的缺陷（葡萄牙语-巴西语言设置）","originalText":"Hello Creality Team,\nI am using CrealityScan 4 (version 1.2.8) on Windows11, with the language set to Portuguese (Brazil) .\nI noticed a UI bug: on the home screen, in the “Scanner disconnected” warning, the text </cor> is displayed, which seems to be an rendering issue.\nPlease find attached a screenshot for reference.\nThank you for your attention and support!\nBest regards","textCn":"你好，Creality 团队，我在 Windows 11 上使用 CrealityScan 4（版本 1.2.8），语言设置为葡萄牙语（巴西）。我发现一个界面缺陷：在主界面的“扫描仪已断开连接”警告中，显示了文本 </cor>，这看起来是渲染问题。请见附件截图以供参考。感谢你的关注与支持！此致","truncated":false,"url":"https://forum.creality.com/t/bug-in-crealityscan-4-v1-2-8-interface-portuguese-brazil-language-setting/45094","productLine":"print","version":"9.85","versionRaw":"9.85","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":36,"likeCount":0,"sourceType":"论坛"},{"uid":"60d493a729dd535d","date":"2025-09-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Small wall print","titleCn":"小墙体打印","originalText":"Hello,\nI would like to print this 6mm thick wall (K2 plus).\nI would ideally like to place it vertically and\nattach supports. Unfortunately, I don’t know how to do that.\nPlease show me an “optimal” solution.\nThe file is attached.\nRegards,\nAchim Hagge\nKomponente1__li-unten.3mf (1,5 MB)\nThat looks a straightforward print… stand upright / vertical, brim with 0 gap for stability, use classic wall option, not arcane… increase wall count to 4 or higher, disable side fan in your profile (or manually turn off after print starts if not sure how)\n6mm is actually quite thick, I print less than 1mm vertical walls without issues. So because it’s a thick wall you can also use inner/outer/inner print option (you only need 3 walls for that option) as there doesn’t look to need any bridging… that will give a smoother exterior.\nHow you make tall skinny prints work is by increasing the wall count, that way its doesn’t need to use sparse infill/patterns, which “can” knock over tall skinny prints…\nWith above settings you can print 300mm high 1mm walls..\nNot near a computer to show settings, but search for those options.. …","textCn":"你好，\n我想打印这面 6mm 厚的墙（K2 plus）。\n我理想中想把它竖直放置，并\n添加支撑。可惜我不知道该怎么做。\n请给我一个“最优”的解决方案。\n文件已附上。\n此致，\nAchim Hagge\nKomponente1__li-unten.3mf (1,5 MB)\n那看起来是个很直接的打印…竖立/竖直放置，边缘用 0 间隙以保证稳定，使用 classic 墙选项，而不是 arcane…把墙层数增加到 4 或更多，在你的配置里关闭侧面风扇（如果不确定，可以在打印开始后手动关掉）\n6mm 其实相当厚，我打印不到 1mm 的竖直墙都没问题。所以因为它是厚墙，你也可以使用内/外/内打印选项（该选项你只需要 3 层墙），因为那里看起来不需要任何桥接…这样外表面会更光滑。\n让高而细的打印件成功的方法就是增加墙层数，这样它就不需要使用稀疏填充/图案，而稀疏填充“可能”会把高而细的打印件撞倒…\n用上面的设置你可以打印 300mm 高、1mm 厚的墙..\n不在电脑旁无法展示设置，但可以搜索这些选项.. …","truncated":true,"url":"https://forum.creality.com/t/small-wall-print/45058","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":5,"views":149,"likeCount":1,"sourceType":"论坛"},{"uid":"f1ad129cc9779cfc","date":"2025-09-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Não consigo logar na conta Cloud no meu CP","titleCn":"我无法在我的 CP 上登录 Cloud 账号","originalText":"Veja que quando clico no logo da seta a tela fica branca e não consigo logar na minha conta.\nSomente por VPN conecto a minha casa para poder executar a distância.","textCn":"请注意，当我点击箭头图标时，屏幕会变白，我无法登录我的账号。 只有通过 VPN 连接到我家，我才能远程执行。","truncated":false,"url":"https://forum.creality.com/t/nao-consigo-logar-na-conta-cloud-no-meu-cp/45034","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"sourceType":"论坛"},{"uid":"503fb90e5530b7d9","date":"2025-09-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 5 Max firmware","titleCn":"Ender 5 Max 固件","originalText":"Is there any way to edit Ender 5 Max oficial firmware ? I think it can be possible to extend Z volume around 410 to 450 without problems.\nAnd I want to remove nozzle cleaning scrypt, I prefer to do manually.\nFinally want to add bl touch, the homing touch point is visible in heatbed.\nIMG_20250908_224513424\nIMG_20250908_223810839","textCn":"有没有办法编辑 Ender 5 Max 的官方固件？我认为把 Z 轴体积扩展到 410 到 450 左右应该没问题。另外我想去掉擦喷嘴脚本，我更喜欢手动操作。最后还想加装 BL Touch，热床上能看到调平触点。IMG_20250908_224513424 IMG_20250908_223810839","truncated":false,"url":"https://forum.creality.com/t/ender-5-max-firmware/45037","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Ender-5 Max","grade":"泛讨论","replyCount":1,"views":56,"likeCount":0,"sourceType":"论坛"},{"uid":"f08bb4a7bc07e71b","date":"2025-09-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender-3 Pro support in v6.2?","titleCn":"v6.2 支持 Ender-3 Pro 吗？","originalText":"I cannot find a printer option for an Ender-3 Pro. If I use the Creality Ender-3 profile I get an error that my “Ender-3 Pro ABL” on a Sonic Pad is not supported by that profile. I’ve tried printing and it seems to print ok but that error is worrying. How should Creality Print be configured for my printer to be error free at print? Thx\nI have also tried the “Creality Sonic_Ender-3” profile but that errors the same. Updating to 6.3 did not help either. I really want to get Creality Print working, not any other solutions as most everything else has issues that make them unworkable for what I want to be able to do. Any ideas??","textCn":"我找不到 Ender-3 Pro 的打印机选项。如果我使用 Creality Ender-3 配置，会报错说我在 Sonic Pad 上的“Ender-3 Pro ABL”不被该配置支持。我试过打印，看起来打印没问题，但那个错误让我担心。我的打印机要如何配置 Creality Print 才能在打印时没有错误？谢谢 我也试过“Creality Sonic_Ender-3”配置，但报同样的错。更新到 6.3 也没用。我真的很想让 Creality Print 用起来，而不是用其他方案，因为其他大多数方案都有问题，让它们无法满足我想做的事。有什么想法吗？？","truncated":false,"url":"https://forum.creality.com/t/ender-3-pro-support-in-v6-2/45002","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":71,"likeCount":0,"sourceType":"论坛"},{"uid":"ce4df2675cf77b1b","date":"2025-09-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print- top/bottom thickness slicing at only 1 layer, no thicker","titleCn":"Creality Print- 顶/底厚度只切出一层，无法更厚","originalText":"Hi, I’m using 6.2.2.3203. Any model I try to print is only slicing with a single layer for both the top and bottom. Changing either the bottom layers or bottom shell thickness makes no change…it slices with only a single layer. What is going on? Any solutions? I’m using a stock profile for the Ender 3 V3 Plus and a stock system preset for 0.25mm.\nthanks, Brad\nHello ! Is it possible to get an image of the preview ?\nAnd in the preview do you see the infill ? If not, it could mean you have the lite mode activated\nDo you set the layers as below\nLayers1\nBill","textCn":"你好，我用的是 6.2.2.3203。我尝试打印的任何模型，顶部和底部都只切出一层。更改底层数或底部外壳厚度都没有变化……它只切出一层。这是怎么回事？有解决办法吗？我用的是 Ender 3 V3 Plus 的默认配置和 0.25mm 的默认系统预设。 谢谢，Brad 你好！能发一张预览的图片吗？ 在预览里你能看到填充吗？如果看不到，可能意味着你开启了精简模式 你是这样设置层数的吗 Layers1 Bill","truncated":false,"url":"https://forum.creality.com/t/creality-print-top-bottom-thickness-slicing-at-only-1-layer-no-thicker/45001","productLine":"print","version":"6.2","versionRaw":"6.2.2","problemType":"","model":"Ender-3 V3 Plus","grade":"泛讨论","replyCount":6,"views":400,"likeCount":0,"sourceType":"论坛"},{"uid":"ec5dba6391d9e7a1","date":"2025-09-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Remove top and bottom layers issue","titleCn":"移除顶面和底面层的问题","originalText":"Hello, I’m trying to print by removing the top and bottom layers just to reach this final print presentation:\nI just modified the settings of my profile as I usually did with Cura or other slicers but I only reach this result:\nYou can also see the settings I changed. Can anyone help me on which options I have to change?\nThank you in advance!\nHello !\nDo you have the lite mode activated ?\nYou can see that in the “Preview” section where you can select “Layer type” or “Speed” or …Etc\nOMG thank you so much Alex! I didn’t know it and now I can see it Let’s go print!!","textCn":"你好，我想通过移除顶面和底面层来打印，只为达到这个最终的打印呈现效果：我只是像以前用 Cura 或其他切片软件那样修改了我的配置参数，但只得到这个结果：你也能看到我改动的设置。有人能帮我知道我该改哪些选项吗？提前感谢！你好！你是不是开启了精简模式？你可以在“预览”部分看到，在那里你可以选择“层类型”或“速度”等等。天啊，太感谢你了 Alex！我之前不知道，现在我能看到了。开始打印吧！！","truncated":false,"url":"https://forum.creality.com/t/remove-top-and-bottom-layers-issue/44954","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":362,"likeCount":1,"sourceType":"论坛"},{"uid":"9c462f8c7e5fbba4","date":"2025-09-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problemas com CFS upgrade K1C","titleCn":"K1C 的 CFS 升级问题","originalText":"I’m having a little trouble, my Creality Print can’t recognize the CFS installed on my K1C or don’t appear the option to enable the CFS.\nI don’t know how to solve this, the CFS is working but I need to send the 3mf on the app/cloud, this is the only way which I can made it work.\nCaptura de tela 2025-09-05 211431","textCn":"我遇到了一点麻烦，我的 Creality Print 无法识别安装在 K1C 上的 CFS，或者没有出现启用 CFS 的选项。我不知道怎么解决，CFS 是正常工作的，但我需要通过应用/云端发送 3mf，这是唯一能让它工作的方式。Captura de tela 2025-09-05 211431","truncated":false,"url":"https://forum.creality.com/t/problemas-com-cfs-upgrade-k1c/44950","productLine":"cloud","version":"","versionRaw":"","problemType":"feature","model":"K1C","grade":"有效","replyCount":1,"views":37,"likeCount":0,"sourceType":"论坛"},{"uid":"3da87687bc74c4c5","date":"2025-09-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CP 6.21.3044","titleCn":"CP 6.21.3044","originalText":"Creality print doesn’t “activate chamber temp control” transfer into GCode.\nEven if ticked Creality print sets M141 at the start but NOT M191 as wanted. So printing starts before chamber is heated up properly.\nDoes anybody know how to solve this?\nThanks and regards.","textCn":"Creality Print 不会把“激活腔体温度控制”传递到 G-code 中。即使勾选了，Creality Print 也会在开始时设置 M141，而不会按要求设置 M191。所以腔体还没充分加热，打印就开始了。有人知道怎么解决吗？谢谢，此致敬意。","truncated":false,"url":"https://forum.creality.com/t/cp-6-21-3044/44952","productLine":"print","version":"6.21","versionRaw":"6.21","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":42,"likeCount":0,"sourceType":"论坛"},{"uid":"10af27825c4bac4f","date":"2025-09-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print v6 not opening on my MacBook Pro","titleCn":"Creality Print v6 在我的 MacBook Pro 上无法打开","originalText":"Some system details:\nMacBook Pro - Chip: Apple M2 Pro - Running OS:15.6.1 (24G90)\nI have installed the latest version of the Creality Print software for MacOS with Mac chip. But it won’t open a window. It says the app is open, but there is no way I can see any screen. Here is a screenshot when I select the thumbnail and command ‘Show all windows’.\nScreenshot 2025-09-05 at 10.19.38\nEverything works fine on my windows machine, but I cannot use Creality Print on my macbook which is really annoying. Please assist (and uninstall, reboot, install, sometimes works for one session, but I cannot do this everytime I want to slice and print something).","textCn":"一些系统信息：MacBook Pro - 芯片：Apple M2 Pro - 运行系统：15.6.1 (24G90)。我已安装了适用于带 Mac 芯片的 MacOS 的最新版本 Creality Print 软件。但它不会打开窗口。它说应用已打开，但我无法看到任何界面。这是我选择缩略图并执行“显示所有窗口”命令时的截图。截图 2025-09-05 at 10.19.38。在我的 Windows 机器上一切正常，但我无法在 MacBook 上使用 Creality Print，这真的很烦人。请协助（卸载、重启、安装，有时能正常工作一个会话，但我不能每次想切片和打印东西时都这么做）。","truncated":false,"url":"https://forum.creality.com/t/creality-print-v6-not-opening-on-my-macbook-pro/44960","productLine":"cloud","version":"6","versionRaw":"6","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":304,"likeCount":0,"sourceType":"论坛"},{"uid":"f85ed91e31b396e3","date":"2025-09-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Collision in \"Print by Object\" Mode During Filament Runout","titleCn":"耗材断料时“逐对象打印”模式中的碰撞","originalText":"Hi, I’ve noticed a bug in the software.\nWhen printing in Print by Object mode, a filament runout triggers an incorrect recovery routine.\nCurrently, the sequence is as follows:\nThe extruder moves to the chute.\nThe printer waits for filament replacement.\nProblem: The bed is moved to Z=0.\nThe extruder purges twice into the chute.\nThe head returns directly to the point where the runout occurred.\nThis direct travel path causes collisions with already printed objects.\nA different approach is needed to handle this scenario to prevent such collisions.","textCn":"你好，我注意到软件里有一个 bug。 当以逐对象打印模式打印时，耗材断料会触发错误的恢复流程。 目前，序列如下： 挤出机移动到滑槽。 打印机等待更换耗材。 问题：热床移动到 Z=0。 挤出机向滑槽内排料两次。 打印头直接返回断料发生的位置。 这条直接移动路径会导致与已打印对象的碰撞。 需要一种不同的方法来处理这种场景，以防止此类碰撞。","truncated":false,"url":"https://forum.creality.com/t/collision-in-print-by-object-mode-during-filament-runout/44912","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":51,"likeCount":0,"sourceType":"论坛"},{"uid":"8bf4a69e3843cb42","date":"2025-09-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Settings changing with V6.2.2.3203 update","titleCn":"V6.2.2.3203 更新后设置发生变化","originalText":"Hi! i updated the slicer to V6.2.2.3203 and noted that the printing time for my .3mf files changed even though they are the same. For some reason, the time is now less, showing that it is speeding up which causes problems with the prints.\nI confirmed the problem by downgrading again the slicer and getting the usual time and velocity back.\nDid someone experienced the same problem?\nI even have Device tab empty!! So you have better situation.\nI also fin dout that all line width settings in Quality section all are ZERO! Not sure whats going on.\nI did this struggles (not worked!):\n1- I changed to old versions like: 6.0.3.1591 or 6.2.0.2827. Not works.\n2- changed app language! (read somewhere)\n3- Uninstalled last installed software to prevent kind of interrupts.\n4- Try to add new printer in Prepare tab and Printer window.\n5- Restart Rooter, Printer and changing Rooter pass!\nI’ve been experiencing problems with print speed after upgrading to version 6.3.0.3420. My print times increased significantly without any changes to settings or material profiles. Multiple G-code files print time increased 2 times and more.\nI had to roll back to the previous version. My printer is an Ender-3 V3 SE. …","textCn":"嗨！我把切片软件更新到 V6.2.2.3203，注意到我的 .3mf 文件打印时间变了，尽管文件是同样的。不知为何，时间现在变短了，显示它在加速，这给打印带来了问题。 我通过再次降级切片软件、恢复了往常的时间和速度，确认了这个问题。 有人遇到过同样的问题吗？ 我甚至连设备标签页都是空的！！所以你的情况还好一些。 我还发现质量部分里所有线宽设置都是零！不知道怎么回事。 我做了这些折腾（没成功！）： 1- 我换到旧版本，比如：6.0.3.1591 或 6.2.0.2827。没用。 2- 改了应用语言！（在某处看到的） 3- 卸载了最后安装的软件，以防某种中断。 4- 尝试在准备标签页和打印机窗口里添加新打印机。 5- 重启路由器、打印机并更改路由器密码！ 升级到 6.3.0.3420 版本后，我一直遇到打印速度的问题。在设置或材料配置没有任何改变的情况下，我的打印时间显著增加。多个 G-code 文件的打印时间增加了一倍甚至更多。 我不得不回滚到之前的版本。我的打印机是 Ender-3 V3 SE。……","truncated":true,"url":"https://forum.creality.com/t/settings-changing-with-v6-2-2-3203-update/44907","productLine":"print","version":"6.2","versionRaw":"6.2.2","problemType":"other","model":"Ender-3 V3","grade":"有效","replyCount":3,"views":155,"likeCount":0,"sourceType":"论坛"},{"uid":"c6a47258d49c36d8","date":"2025-09-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Settings for CRM4 on Creality Print 6.1","titleCn":"Creality Print 6.1 上 CRM4 的设置","originalText":"What settings need to be entered for CRM4 on Creality Print 6.1 so I can use it with my printer. I installed the Creality Print but it does not work with my printer","textCn":"在 Creality Print 6.1 上 CRM4 需要填写哪些设置，我才能把它和我的打印机配合使用。我安装了 Creality Print，但它无法与我的打印机配合工作","truncated":false,"url":"https://forum.creality.com/t/settings-for-crm4-on-creality-print-6-1/44887","productLine":"print","version":"6.1","versionRaw":"6.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"1ede1771ec9461c0","date":"2025-09-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print V6.2.2.3203 Pause not working","titleCn":"Creality Print V6.2.2.3203 暂停不工作","originalText":"Trying to pause the print but does nothing when I try to Stop. I get the over the stop button.\nAnyone else getting this ?","textCn":"尝试暂停打印，但当我尝试停止时什么也没发生。我把鼠标悬停在停止按钮上。还有其他人遇到这种情况吗？","truncated":false,"url":"https://forum.creality.com/t/creality-print-v6-2-2-3203-pause-not-working/44898","productLine":"print","version":"6.2","versionRaw":"6.2.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":41,"likeCount":0,"sourceType":"论坛"},{"uid":"505cc5e7904da7ef","date":"2025-09-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.2 force exit","titleCn":"Creality Print 6.2 强制退出","originalText":"Mac Studio M1 Ultra Sequoia 15.x what ever latest is.\nCreality will not exit, quit, shutdown. Must continually force it to exit, shutdown. Just did a clean reinstall from download of most recent from Creality’s site. Same thing. Creality Print icon shows active in tool bar when it should be shut down. Opposite clicking brings menu with Force quit option. That does work.","textCn":"Mac Studio M1 Ultra，Sequoia 15.x，就是最新的那个版本。Creality 无法退出、关闭、关机。必须不断强制它退出、关闭。刚从 Creality 网站下载最新版本做了干净重装。还是一样。Creality Print 图标本该关闭了却在工具栏里显示为活动状态。反向点击会弹出带“强制退出”选项的菜单。那个确实有效。","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-2-force-exit/44849","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"sourceType":"论坛"},{"uid":"9ee733dc98e38408","date":"2025-08-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Error for Ender-3 V3 KE","titleCn":"Ender-3 V3 KE 的报错","originalText":"Screenshot 2025-08-31 122518\nI keep getting this error message when I go to send a print to my ender. Originally the print would fail due to the nozzle not reaching temperature when I had the calibration on.\nI have since uninstalled Creality print and reinstalled.\nI have reset the printer.\nI have tried to use a USB to transfer the files, but the printer does not see the file. It does see old files on the same USB.","textCn":"Screenshot 2025-08-31 122518 每次我向我的 ender 发送打印任务时，都会收到这条错误信息。最初，当我开启校准后，打印会因为喷嘴达不到温度而失败。 之后我卸载并重新安装了 Creality Print。 我重置了打印机。 我试过用 USB 传输文件，但打印机看不到该文件。它能看见同一个 USB 上的旧文件。","truncated":false,"url":"https://forum.creality.com/t/error-for-ender-3-v3-ke/44791","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":1,"views":30,"likeCount":0,"sourceType":"论坛"},{"uid":"7d171a50285271cd","date":"2025-08-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K2 Plus speed adjustment","titleCn":"K2 Plus 速度调整","originalText":"I am curious if their is way to adjust speed between 50^ Stable and 100% standard\nAlso I would like think it would be nice to set the speed slower for first set of layers and continue on with other layers after that. That is what I am doing manually right now.","textCn":"我很好奇是否有办法把速度调到 50% 稳定和 100% 标准之间 另外我觉得如果能为首层那几层设置更慢的速度，之后再继续用其他层的速度，那就好了。这正是我现在手动在做的事情。","truncated":false,"url":"https://forum.creality.com/t/k2-plus-speed-adjustment/44830","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":1,"views":112,"likeCount":1,"sourceType":"论坛"},{"uid":"38f7100c9ed358aa","date":"2025-08-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K1MAX filement profiles for .08mm nozzle","titleCn":"K1MAX 的 .08mm 喷嘴耗材配置","originalText":"I have had a K1 Max for 9 months and I have yet to figure this out. When I print with the .04mm nozzle a print will take 4 hours, if I switch to .08, not only do I not have any filament options other then HyperPLA, the print takes an hour more. How do I get the missing filament profiles as well as my decreased printing time for the .08mm nozzle?\nThanks Danny","textCn":"我有一台 K1 Max 已经 9 个月了，到现在还没搞明白这件事。用 .04mm 喷嘴打印时，一个打印件需要 4 小时；如果我换成 .08mm，不仅除了 HyperPLA 之外没有任何耗材选项，打印时间还多出一小时。我怎样才能获得缺失的耗材配置，同时让 .08mm 喷嘴的打印时间缩短？\n谢谢 Danny","truncated":false,"url":"https://forum.creality.com/t/k1max-filement-profiles-for-08mm-nozzle/44825","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":25,"likeCount":0,"sourceType":"论坛"},{"uid":"a434be59ea76827d","date":"2025-08-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Nozzle scratch plate after update to V1.1.0.50","titleCn":"更新到 V1.1.0.50 后喷嘴刮板","originalText":"Hello.\nPrinter - Creality Hi.\nI had firmware V1.1.0.48, it was working perfectly. August 29 I have updated to V1.1.0.50, then I launched Autoleveling (after firmware update). And now it feels like the hotend is clinging to the plate. The first layer is smeared, even the logo on the plate is scratched. I ran the calibration again, the result is the same. Compared the printer.cfg file before and after - All values in levels became on average 0.218 smaller.\nDowngrade to V1.1.0.48 did not bring results.\nHow can I fix this situation?\nWas:\nIMG_7604\nNow:\nIMG_7605\nUpdated 31.08.2025:\nI look on my “flat plane” in fluidd (4408), and it looks like almost all points below the surface (I don’t have a perfectly flat table), but before update I had only a small hole.\nFor the experiment, I’ll raise the z-offset, and maybe play with the foil (recommendations from Z offset not saving - #9 by Teddy_G_Limanto ). But, in reality, a new good firmware is needed. Today I rolled back to “Factory settings” - did not help. Downgraded to the 44th firmware - did not help.\nMaybe reason in “5. Update step-servo motor system firmware and parameters.“ (from description of 50th firmware). …","textCn":"你好。打印机 - Creality Hi。我原来的固件是 V1.1.0.48，运行完美。8 月 29 日我更新到 V1.1.0.50，然后我运行了自动调平（固件更新后）。现在感觉热端像是贴着板子。首层被抹开了，连板子上的 logo 都被刮花了。我又跑了一次校准，结果一样。比较了更新前后的 printer.cfg 文件——所有 levels 里的数值平均变小了 0.218。降级到 V1.1.0.48 也没有带来结果。我该怎么解决这种情况？之前：IMG_7604 现在：IMG_7605 更新于 31.08.2025：我看了一下 fluidd（4408）里的我的“平面”，看起来几乎所有点都在表面之下（我没有完全平坦的台面），但更新前我只有一个小坑。为了实验，我会抬高 z-offset，也许还会摆弄一下垫片（来自 Z offset not saving - #9 by Teddy_G_Limanto 的建议）。但实际上，需要一个新的好固件。今天我回滚到“出厂设置”——没有帮助。降级到第 44 个固件——也没有帮助。也许原因在“5. 更新步进伺服电机系统固件和参数。”（来自第 50 个固件的说明）。……","truncated":true,"url":"https://forum.creality.com/t/nozzle-scratch-plate-after-update-to-v1-1-0-50/44764","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":9,"views":677,"likeCount":1,"sourceType":"论坛"},{"uid":"b28100868532c329","date":"2025-08-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Calibration - Retraction Tests","titleCn":"Creality Print 校准 - 回抽测试","originalText":"Creality Please can you advise your Software Team to modify the Retraction Tests STL that is called up from the Calibration Menu drop down list.\nFor along time now the STL looks like someone has modified it and inadvertantly saved it.\nRetraction Test SS - Marked\nThe file used to only contain the 2 pilars as shown in the above image.\nYou have a potentially good piece of software that is hampered continually by what appears to be a lack of quality Control.\nWhy do you think it was accidental? They changed a few other calibration tests like flow rate to new formula for interpreting results. So weird to assume it was a mistake unless you know something the rest of us don’t?\nI’m annoyed they have absolutely no documentation on retraction test, period.","textCn":"Creality，能否请你们建议软件团队修改一下从校准菜单下拉列表中调出的回抽测试 STL。很长一段时间以来，这个 STL 看起来像是被人修改过并且不小心保存了。Retraction Test SS - Marked。这个文件过去只包含上面图片中所示的两根柱体。你们有一款可能很不错的软件，却因为看起来缺乏质量控制而不断受到拖累。你为什么认为那是意外？他们把其他几个校准测试（比如流量）改成了新的结果解读公式。除非你知道我们其他人不知道的事，否则假定这是个失误很奇怪吧？让我恼火的是，他们对回抽测试根本没有任何文档说明，就这样。","truncated":false,"url":"https://forum.creality.com/t/creality-print-calibration-retraction-tests/44739","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":244,"likeCount":0,"sourceType":"论坛"},{"uid":"82b6b4b58aa3812b","date":"2025-08-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Applying Saved Process Settings to individual objects?","titleCn":"把保存的工艺设置应用到单个物体？","originalText":"I’m in the middle of a big MultiBoard (“MB”) project. I have a bunch of MB tiles spread across a bunch of plates in a single project in Creality Print V6.2.0.2827. Having all my parts in a single project keeps me organized. Some plates are prints of single MB Tiles. Others are MB tile “stack” prints. These require different ironing settings. I have created a separate Process for stack printing vs. not stack printing. Here’s my question…. Is there anyway to apply a Process to individual objects? Or to certain plates? Or can saved Processes only be applied globally? (And your only option is to manually change object settings?). If Creality Print won’t do this, is there a way to do it in Orca?\nI just screwed up a 28 hour 6x stack print because I neglected to turn on ironing for a 6x stack print object. Grrrr. There has to be a better way!\nSide note: I’m using Creality Print on a stock K1C for all my MB plate prints. I have a second heavily modified K1C that I’m using to print other parts of this project via Orca Slicer. …","textCn":"我正在做一个大型 MultiBoard（“MB”）项目。我在 Creality Print V6.2.0.2827 的同一个项目里，有一堆 MB 拼块分布在许多打印板上。把所有零件放在一个项目里让我保持条理。有些打印板是单个 MB 拼块的打印。另一些是 MB 拼块“堆叠”打印。这些需要不同的熨烫设置。我为堆叠打印和非堆叠打印分别创建了一个独立的工艺。我的问题是……有没有办法把工艺应用到单个物体？或者应用到特定的打印板？还是说保存的工艺只能全局应用？（而你唯一的选择就是手动更改物体设置？）如果 Creality Print 做不到这一点，那在 Orca 里有没有办法做到？我刚把一次 28 小时的 6 层堆叠打印搞砸了，因为我忘了为一个 6 层堆叠打印的物体打开熨烫。唉。一定有更好的办法！附注：我所有的 MB 打印板打印都在原装 K1C 上使用 Creality Print。我还有第二台大幅改装的 K1C，我通过 Orca Slicer 用它来打印这个项目的其他零件。……","truncated":true,"url":"https://forum.creality.com/t/applying-saved-process-settings-to-individual-objects/44723","productLine":"thirdparty","version":"6.2","versionRaw":"6.2","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":221,"likeCount":1,"sourceType":"论坛"},{"uid":"643bd94a11361755","date":"2025-08-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Does latest build(s) have issue with Z Axix","titleCn":"最新版本是否有 Z 轴问题","originalText":"I am curious if the latest builds of Creality Print 6.2x have issues with Z axis message. I been noticing that their is a lot of issues where my K2 Plus stops with a message about Z axis and a lot of time, if I turn of the Printer and turn it back on. I also notice that recalibration resolves the issues.\nIt just seems to get worst and worst. Today I change out the nozzle for first time because I was started getting stringing.\nPossiblely some issue with firsmware on the K2 Plus.","textCn":"我很好奇 Creality Print 6.2x 的最新版本是否存在 Z 轴信息的问题。我注意到有很多问题，我的 K2 Plus 会带着 Z 轴的提示停下来，而且很多时候，如果我把打印机关掉再打开就好。我也注意到重新校准能解决问题。它似乎越来越糟。今天我第一次更换了喷嘴，因为我开始出现拉丝。可能是 K2 Plus 上的固件有些问题。","truncated":false,"url":"https://forum.creality.com/t/does-latest-build-s-have-issue-with-z-axix/44717","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":1,"views":26,"likeCount":0,"sourceType":"论坛"},{"uid":"3b92bee003a8a4e2","date":"2025-08-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problems printing on CRM4 using Creality Print 6.1","titleCn":"使用 Creality Print 6.1 在 CRM4 上打印的问题","originalText":"I saved a file under Creality Print 6.1 and when I attempt to print on my CRM4 the arm makes a grinding sound and prints in mid air half way up. I stop the print right away.\nHow do I get Creality Print 6.2 settings set up so I can print on my CRM4? Here are some photos.\nIf I could get some detailed help that would be great.\nIMG_8194\nIMG_8192\nIMG_8190","textCn":"我在 Creality Print 6.1 中保存了一个文件，当我尝试在 CRM4 上打印时，机械臂发出摩擦声，并在半空中打印。我立刻停止了打印。我要怎么设置 Creality Print 6.2 的参数，才能在我的 CRM4 上打印？这里有一些照片。如果能得到详细的帮助就太好了。 IMG_8194 IMG_8192 IMG_8190","truncated":false,"url":"https://forum.creality.com/t/problems-printing-on-crm4-using-creality-print-6-1/44707","productLine":"print","version":"6.1","versionRaw":"6.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"sourceType":"论坛"},{"uid":"210680532359dd67","date":"2025-08-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Filament roll replacement in middle of print","titleCn":"打印中途更换料盘","originalText":"Hello Im looking for some help on my Enders 5 plus. While printing, I have no issues. When I run out of filament in the middle of a large print. I’m able to install a new roll without moving anything. But when I continue the print. I’m about 1/16 to 1/8th off the original print, and have to scrap the piece. Any help would be appreciated.\nThanks Mike","textCn":"大家好，我在 Enders 5 plus 上想寻求一些帮助。打印过程中没有问题。当我在一次大件打印中途耗材用完时，我可以在不移动任何东西的情况下装上新料盘。但当我继续打印时，会偏离原来的打印位置约 1/16 到 1/8，只能把零件报废。任何帮助都很感激。谢谢 Mike","truncated":false,"url":"https://forum.creality.com/t/filament-roll-replacement-in-middle-of-print/44708","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":50,"likeCount":0,"sourceType":"论坛"},{"uid":"4517cee97f31bb3b","date":"2025-08-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Cannot add Ender-5 Pro in Creality Print","titleCn":"无法在 Creality Print 中添加 Ender-5 Pro","originalText":"I’ve had my Ender-5 Pro for a few years, and I’ve been slicing with Creality Slicer the whole time. I was liking the ability to upload slices directly to Creality Cloud and manage my prints from the app once I got the little Creality network box (Creality Box 2.0, I think it’s called) to connect the printer to my cloud account. I’ve been missing the ability to directly upload slices to my cloud account since the function hasn’t worked for a long time, and also since Slicer hasn’t had an update in about 2 years, so I thought I’d try Creality Print. I installed the current release version, 6.2.1.3044. Well, it doesn’t see the printer on the network. The app shows me the IP address, CP doesn’t seem to see it there when I try the IP address option. When trying to manually select a printer type, the Ender-5 Pro is not listed as a selectable printer.\nI haven’t been able to find any information on this, and I’m not certain why the Ender-5 Pro wouldn’t be a choice for a printer in Creality’s own software. …","textCn":"我用 Ender-5 Pro 已经几年了，一直用 Creality Slicer 切片。我喜欢能把切片直接上传到 Creality Cloud，并在我拿到那个小 Creality 网络盒子（我想叫 Creality Box 2.0）把打印机连接到我的云端账户后，通过 App 管理打印。自从这个功能很久不能用了，而且 Slicer 大约两年没更新了，我一直缺少直接上传切片到云端账户的能力，所以我想试试 Creality Print。我安装了当前的发布版本 6.2.1.3044。结果它在网络上找不到打印机。App 给我显示了 IP 地址，但我在 CP 里尝试 IP 地址选项时似乎看不到它。当尝试手动选择打印机类型时，Ender-5 Pro 并没有被列为可选的打印机。我一直找不到任何相关信息，也不确定为什么 Ender-5 Pro 不能成为 Creality 自己软件里的打印机选项。……","truncated":true,"url":"https://forum.creality.com/t/cannot-add-ender-5-pro-in-creality-print/44682","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":1295,"likeCount":1,"sourceType":"论坛"},{"uid":"b451993a430b33e9","date":"2025-08-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bigger support tree brim in Print 6.2?","titleCn":"Print 6.2 里能让支撑树边缘更大吗？","originalText":"Is there a tree brim setting in Print 6.2? Sometimes a tall support loses adhesion and I would like to add a wider brim to those supports, or have the algorithm make the base bigger on taller supports.\n@linky_wolfka found it in a different post: Change the size of the support brim - #9 by linky_wolfka","textCn":"Print 6.2 里有树状边缘设置吗？有时候高支撑会失去热床附着，我想给这些支撑加一圈更宽的边缘，或者让算法把较高支撑的底部做大一些。@linky_wolfka 在另一个帖子里找到了：Change the size of the support brim - #9 by linky_wolfka","truncated":false,"url":"https://forum.creality.com/t/bigger-support-tree-brim-in-print-6-2/44653","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":79,"likeCount":0,"sourceType":"论坛"},{"uid":"308b3a6163533702","date":"2025-08-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print V6.2.1.3044","titleCn":"Creality Print V6.2.1.3044","originalText":"Is there a way to revert to previous versions of Creality Print?\nI have just installed CP Ver 6.2.1.3044 on my K1C and now for some reason the software keeps deleting all of my user presets when I close the program.\nI have spent hours calibrating for different filiaments and configurations only to find that all my work has been discarded.\nCome on Creality, sort your sh%t out, it seems like every time you add an update to CP, you mess up other areas of your software.\nYou have some great products that are currently let down by very poor quality control of your software.","textCn":"有没有办法回退到 Creality Print 的旧版本？我刚在我的 K1C 上安装了 CP Ver 6.2.1.3044，现在不知为何，每次我关闭程序时，软件都会删除我所有的用户预设。我花了好几个小时为不同的耗材和配置做校准，结果发现我所有的工作都被丢弃了。Creality 啊，把你们的破事处理好吧，似乎每次你们给 CP 加更新，都会搞砸软件的其他部分。你们有一些很棒的产品，但目前被你们软件极差的质量控制拖累了。","truncated":false,"url":"https://forum.creality.com/t/creality-print-v6-2-1-3044/44655","productLine":"print","version":"6.2","versionRaw":"6.2.1","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":71,"likeCount":0,"sourceType":"论坛"},{"uid":"59e2618bf753e06d","date":"2025-08-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Flatpak issues","titleCn":"Flatpak 的问题","originalText":"Minor issue I’m having currently. I run linux as my main OS, and as such am using the flatpak provided by creality. For the most part it works just fine, and functions better than the appimage I was using previously. However I’ve run into a bug thats fairly annoying. After I slice my model and move onto the preview page the info pane on the left is compressed. It blocks me from fully seeing the details such as weight and cost, and makes the check boxes for the preview unusable. Like I said, more of an annoyance than a major issue, but if anyone has run into the issue and knows how to fix it I’d be appreciative.\nI will note, there is no way to drag to adjust on the edge like with the print settings on the right, and there is nothing in the app settings for adjusting the ui.\nScreenshot_20250825_175513","textCn":"我现在遇到的一个小问题。我把 linux 作为主系统，所以用的是 creality 提供的 flatpak。大部分情况下它运行正常，比我之前用的 appimage 表现更好。不过我遇到了一个相当恼人的 bug。我切片完模型、进入预览页面后，左侧的信息面板被压缩了。它让我无法完整看到重量和成本等详细信息，还让预览用的复选框无法使用。就像我说的，这更像个烦人的小毛病而不是大问题，但如果有人遇到过并且知道怎么修，我会很感激。 我要说明一下，没法像右边打印设置那样拖动边缘来调整，而且应用设置里也没有调整界面的选项。 Screenshot_20250825_175513","truncated":false,"url":"https://forum.creality.com/t/flatpak-issues/44650","productLine":"cloud","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":295,"likeCount":0,"sourceType":"论坛"},{"uid":"fea0aa4dd47ce4b5","date":"2025-08-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality edit v6.2 bug dark screen in prepare menu","titleCn":"Creality edit v6.2 缺陷 准备菜单黑屏","originalText":"Screenshot 2025-08-19 191937\ndark screen and cant solve even by deleting app by revo uninstaller\nWell, that’s new. Do any of the controls react? i.e. can you select preview or device and get any reaction from the UI? How about the filament controls? Can you change a number in that area?\nNO, I tried many times to install the app but it is obviously a bug, i noticed when drag right side menu and suddenly the screen appears, welcoming menu got back and this black screen appears\nENDER 3 V3 KE","textCn":"Screenshot 2025-08-19 191937 黑屏，甚至用 revo uninstaller 删除 app 也解决不了 嗯，这是新情况。有任何控件有反应吗？也就是你能选择预览或设备并从界面得到任何反应吗？耗材控件呢？你能在那个区域改数字吗？ 不行，我试了很多次重装 app，但这明显是个缺陷，我注意到当我拖动右侧菜单时屏幕突然出现，欢迎菜单回来了，然后这个黑屏又出现 ENDER 3 V3 KE","truncated":false,"url":"https://forum.creality.com/t/creality-edit-v6-2-bug-dark-screen-in-prepare-menu/44353","productLine":"cloud","version":"6.2","versionRaw":"6.2","problemType":"ui","model":"Ender-3 V3 KE","grade":"有效","replyCount":5,"views":77,"likeCount":2,"sourceType":"论坛"},{"uid":"8535c5fbf8f6d8fc","date":"2025-08-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Change the size and shape of the support brim","titleCn":"更改支撑边缘的尺寸和形状","originalText":"Also, I am using Creality Print 6.2.1, and I cannot find the option for Bed Adhesion, which appears in YouTube videos using Creality Print 5. Can you confirm that the bed adhesion options have been integrated into the “Others” option?\nYes, but you need to have ‘Advanced Parameters’ turned on","textCn":"另外，我使用的是 Creality Print 6.2.1，我找不到热床附着这个选项，而 YouTube 上使用 Creality Print 5 的视频里有这个选项。你能确认热床附着的选项已经被整合进“Others”选项里了吗？ 是的，但你需要把“高级参数”打开。","truncated":false,"url":"https://forum.creality.com/t/change-the-size-and-shape-of-the-support-brim/44183","productLine":"print","version":"6.2","versionRaw":"6.2.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":65,"likeCount":0,"sourceType":"论坛"},{"uid":"64eed47a02a93e49","date":"2025-08-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Change the size of the support brim","titleCn":"更改支撑边缘的尺寸","originalText":"I cannot find an option to alter the size of the brim for my supports. When I change the brim size, only the part brim size changes. I have a problem with my support falling over, so I just wanted to increase its area.\nAlso, I am using Creality Print 6.2.1, and I cannot find the option for Bed Adhesion, which appears in YouTube videos using Creality Print 5. Can you confirm that the bed adhesion options have been integrated into the “Others” option?\nI had a hard time finding Brim size too. you can find it under “other” in the slicer settings:\nNote there are several options. I’m guessing Auto (default) isn’t cutting it for you. You can add some width if you need it to reach your supports. I do that for tall skinny things with tree supports, to hold the tree’s up.\nThanks for your reply, the brim width that you’re pointing out only changes the brim width of the part. I specifically wanted to alter the brim width of the support. I can’t seem to find that.","textCn":"我找不到可以更改支撑边缘尺寸的选项。当我更改边缘尺寸时，只有零件的边缘尺寸会变。我的支撑有倒下的问题，所以我只是想增大它的面积。另外，我用的是 Creality Print 6.2.1，我找不到热床附着的选项，而在使用 Creality Print 5 的 YouTube 视频里它有出现。你能确认热床附着选项已经被整合到“其他”选项里了吗？我也很难找到边缘尺寸。你可以在切片软件设置里的“其他”下面找到它：注意有好几个选项。我猜自动（默认）对你来说不够用。如果你需要它延伸到你的支撑，可以增加一些宽度。我就这样处理带树状支撑的高而细的东西，用来撑住树状支撑。谢谢你的回复，你指出的边缘宽度只会改变零件的边缘宽度。我特别想改的是支撑的边缘宽度。我似乎找不到那个。","truncated":false,"url":"https://forum.creality.com/t/change-the-size-of-the-support-brim/44164","productLine":"print","version":"6.2","versionRaw":"6.2.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":13,"views":1228,"likeCount":11,"sourceType":"论坛"},{"uid":"a59ad46dff4019fb","date":"2025-08-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"long retraction when cut","titleCn":"切料时的长回抽","originalText":"I’m just a CFS user and would like to know when this version with long retraction when cutting will be implemented. This will help reduce filament waste when changing.","textCn":"我只是一个 CFS 用户，想知道带切料时长回抽的这个版本什么时候会实现。这将有助于减少换料时的耗材浪费。","truncated":false,"url":"https://forum.creality.com/t/long-retraction-when-cut/44149","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":54,"likeCount":0,"sourceType":"论坛"},{"uid":"a016840d9f27b771","date":"2025-08-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Colour painting","titleCn":"颜色涂装","originalText":"Why cant I use colours on any model using the colour pallet?\nI have version V6,2.1.3044\nBut using version V5.1.7.10514 it works fine\nwhat is wrong with the new version V6.2.1.3044","textCn":"为什么我不能用调色板在任何模型上使用颜色？我使用的是 V6,2.1.3044 版本，但使用 V5.1.7.10514 版本时一切正常。新的 V6.2.1.3044 版本出了什么问题","truncated":false,"url":"https://forum.creality.com/t/colour-painting/44115","productLine":"print","version":"5.1","versionRaw":"5.1.7","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":32,"likeCount":0,"sourceType":"论坛"},{"uid":"325491aed35ce66a","date":"2025-08-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Error in saved STL file after cutting a block in creality print 6.2","titleCn":"在 creality print 6.2 中切割方块后保存的 STL 文件出错","originalText":"The scenario is as follows:\nI created a cube locally within Creality print 6.2 and expanded it to a 40x40mm cube using the scale operation.\nUsing the cut function, I include two connectors, one a snap in the centre, and one a frustrum plug towards a corner. Connectors are confirmed.\nI then confirm the cut and move the resulting top and bottom pieces around, and reorient the top (female) part so that I can see the holes.\nI save a single 3MF file, and also save a set of STL files.\nI can then restart the software and load the files.\nThe 3MF file is fine. Two half blocks are loaded in the same location on the plate.\nHOWEVER, of the two STL files, the male is fine, but the female has lost her holes, and has become solid.\nI’ve also opened the STL files in fusion 360 and they are the same, male okay, but female is solid.\n(the stl file for the female is also very small ( ) compared to the male ( ))\nHummmmm","textCn":"情况如下： 我在 Creality Print 6.2 中本地创建了一个立方体，并用缩放操作把它扩展到 40x40mm 的立方体。 使用切割功能，我加入了两个连接件，一个是位于中心的卡扣，另一个是朝向一个角的截锥插头。连接件已确认。 然后我确认切割，并把得到的上下两块移来移去，重新调整顶部（凹）部分的朝向，好让我能看到孔。 我保存为一个 3MF 文件，也保存了一组 STL 文件。 然后我可以重启软件并加载这些文件。 3MF 文件没问题。两个半块被加载到热床上的同一位置。 然而，在两个 STL 文件中，凸的那块没问题，但凹的那块丢失了它的孔，变成了实心的。 我也在 fusion 360 中打开了这些 STL 文件，情况一样，凸的没问题，但凹的是实心的。 （凹的那块的 stl 文件相比凸的那块也非常小（ ）） Hummmmm","truncated":false,"url":"https://forum.creality.com/t/error-in-saved-stl-file-after-cutting-a-block-in-creality-print-6-2/44135","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":46,"likeCount":1,"sourceType":"论坛"},{"uid":"d72f343174071ea5","date":"2025-08-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"G-code modification","titleCn":"G-code 修改","originalText":"Hi everyone! I updated both the printer and the software and now printing is different so I print from a g-code. The problem is the g-code has only one object. How can I make it like 6? Can anyone here modify my gcode or tell me how to do it so it can print 6 of my object?\nThanks in advance!\nHold CTRL and Click to select the objects on the bed that you want to duplicate\nCtrl+C (Copy)\nCTRL+V (Paste)\nCTRL+A (Select All)\nUse the move tool to center on the bed\nSlice the bed\nExport the Gcode\nWould be nice to have a duplicate button on the top tool bar!\nI can’t duplicate on the PREVIEW screen. It is a G-code, so it only shows the PREVIEW, I can’t go back PREPARE.","textCn":"大家好！我更新了打印机和软件，现在打印效果不一样了，所以我用 G-code 打印。问题是这个 G-code 里只有一个物体。我怎么才能把它变成 6 个？这里有人能帮我修改 G-code，或者告诉我怎么做，让它能打印 6 个我的物体吗？\n先谢谢了！\n按住 CTRL 并点击，来选中热床上你想要复制的物体\nCtrl+C（复制）\nCTRL+V（粘贴）\nCTRL+A（全选）\n使用移动工具在热床上居中\n对热床进行切片\n导出 G-code\n如果顶部工具栏上有一个复制按钮就好了！\n我在预览界面无法复制。它是 G-code，所以只显示预览，我回不到准备（PREPARE）界面。","truncated":false,"url":"https://forum.creality.com/t/g-code-modification/44051","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":14,"views":275,"likeCount":1,"sourceType":"论坛"},{"uid":"b4fe89c0c913ce18","date":"2025-08-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"100% infill prints on only part of my model","titleCn":"100% 填充只打印在模型的一部分上","originalText":"Hello,\nI would like to have part of my model print at 100% infill but I cannot find a tutorial or any literatrue on how to do it with Creality Print. I can only see some tutes and questions from people using Cura. I used to use Cura, but I have only just started with Creality Print since I purchased my K1C.","textCn":"你好，\n我希望模型的一部分以 100% 填充打印，但我找不到关于如何在 Creality Print 中做到这一点的教程或任何资料。我只能找到一些使用 Cura 的人的教程和问题。我以前用 Cura，但自从买了 K1C 之后我才刚开始用 Creality Print。","truncated":false,"url":"https://forum.creality.com/t/100-infill-prints-on-only-part-of-my-model/44041","productLine":"thirdparty","version":"","versionRaw":"","problemType":"compat","model":"K1C","grade":"有效","replyCount":2,"views":99,"likeCount":1,"sourceType":"论坛"},{"uid":"627beaaa2affd3ff","date":"2025-08-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Software fills in the hole in the center of item","titleCn":"软件把物件中心的孔填上了","originalText":"I’m using Creality Print 6.2.1. When I download the part in image 1, it gives me an error. When I fix it, it fills in the hole.\ncreality_1\ncreality_2\nDon’t know how to fix it.\nBMW_Cup_Holder_Insert2-FlangeTop.3mf (3.2 MB)\n\" Objects isnt manifold \" means it has something like a gap , hole or overlapping triangles in the mesh etc, youll need to go into another program like blender to fix it, or maybe you can fix the filled in hole by drilling it out again in creality print once creality print has filled it in havent tried it myself","textCn":"我用的是 Creality Print 6.2.1。当我下载图 1 中的零件时，它给我报错。当我修复它时，它把孔填上了。 creality_1 creality_2 不知道该怎么修复。 BMW_Cup_Holder_Insert2-FlangeTop.3mf (3.2 MB) “Objects isnt manifold”意味着网格里有类似缝隙、孔洞或重叠三角面之类的问题，你需要进入另一个程序（比如 Blender）来修复它，或者也许你可以在 Creality Print 把孔填上之后，再在 Creality Print 里把填上的孔重新钻出来，我自己没试过","truncated":false,"url":"https://forum.creality.com/t/software-fills-in-the-hole-in-the-center-of-item/43917","productLine":"print","version":"6.2","versionRaw":"6.2.1","problemType":"other","model":"K1 Max","grade":"有效","replyCount":2,"views":124,"likeCount":1,"sourceType":"论坛"},{"uid":"a046d79744acd272","date":"2025-08-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Turning off Auto-leveling.","titleCn":"关闭自动调平。","originalText":"Recently, the auto-leveling is turned on for every print. Is there a setting to shut it off by default? I can shut it off on the print screen each time, but if I forget, i add a lot of time to my print. It would be nice to have a setting in the Creality Print 6.2 to turn it off by default. I’m printing on a K1-Max","textCn":"最近，每次打印都会开启自动调平。有没有设置可以默认关闭它？我每次都可以在打印界面把它关掉，但如果忘了，就会给我的打印增加很多时间。如果 Creality Print 6.2 里能有个默认关闭它的设置就好了。我用的是 K1-Max 打印。","truncated":false,"url":"https://forum.creality.com/t/turning-off-auto-leveling/43911","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"feature","model":"K1","grade":"有效","replyCount":1,"views":231,"likeCount":1,"sourceType":"论坛"},{"uid":"c4f7177f6dd26e13","date":"2025-08-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Firmware 3v2 sprite and cr touch","titleCn":"3v2 固件、Sprite 和 CR Touch","originalText":"So I have upgraded my 3v2 with sprite extruder and cr-touch auto leveling and need the right firmware as mine is not centering correctly. Board is 4.2.2 and gig chip. Any help I’d appreciate\nSeems the big issue is the cr touch mount that fits sits to far forward\nHi Ben. I upgraded my Ender3 v2 some years ago. This included adding the Sprite Pro extruder, BLTouch and other mods. I do not think there is any commercial firmware available for you mdification, I had to learn Marlin and compile my own firmware for the additions .\nThe settings you will require for the crtouch offset are found in configuration.h files\nSome examples:\n#define NOZZLE_TO_PROBE_OFFSET { 10, 10, -1 } // Example “1”\n#define NOZZLE_TO_PROBE_OFFSET {-10, 5, -1 } // Example “2”\n#define NOZZLE_TO_PROBE_OFFSET { 5, -5, -1 } // Example “3”\n#define NOZZLE_TO_PROBE_OFFSET {-15,-10, -1 } // Example “4”\n+-- BACK ---+\n| [+] |\nL | 1 | R ← Example “1” (right+, back+)\nE | 2 | I ← Example “2” ( left-, back+)\nF |[-] N [+]| G ← Nozzle\nT | 3 | H ← Example “3” (right+, front-)\n| 4 | T <-- Example \"4\" ( left-, front-)\n| [-] |\nO-- FRONT --+\n*/\n#define NOZZLE_TO_PROBE_OFFSET { -40, -35, -4.85 }\nAlso you will have to change the feed ra …","textCn":"所以我把我的 3v2 升级了 Sprite 挤出机和 CR-Touch 自动调平，需要正确的固件，因为我的没有正确居中。主板是 4.2.2，GigaDevice 芯片。任何帮助我都很感激。看来大问题是能装上的 CR Touch 支架位置太靠前。嗨 Ben。几年前我升级了我的 Ender3 v2。包括加装 Sprite Pro 挤出机、BLTouch 和其他改装。我认为没有适合你改装的商用固件，我不得不学习 Marlin 并自己编译固件来支持这些加装。你需要的 CR Touch 偏移设置可以在 configuration.h 文件中找到。一些示例：#define NOZZLE_TO_PROBE_OFFSET { 10, 10, -1 } // 示例“1” #define NOZZLE_TO_PROBE_OFFSET {-10, 5, -1 } // 示例“2” #define NOZZLE_TO_PROBE_OFFSET { 5, -5, -1 } // 示例“3” #define NOZZLE_TO_PROBE_OFFSET {-15,-10, -1 } // 示例“4” +-- BACK ---+ | [+] | L | 1 | R ← 示例“1”（右+，后+） E | 2 | I ← 示例“2”（左-，后+） F |[-] N [+]| G ← 喷嘴 T | 3 | H ← 示例“3”（右+，前-） | 4 | T <-- 示例“4”（左-，前-） | [-] | O-- FRONT --+ */ #define NOZZLE_TO_PROBE_OFFSET { -40, -35, -4.85 } 另外你还必须更改进给速……","truncated":true,"url":"https://forum.creality.com/t/firmware-3v2-sprite-and-cr-touch/43844","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"Ender-3 V3","grade":"有效","replyCount":3,"views":891,"likeCount":0,"sourceType":"论坛"},{"uid":"2048f3a360ce67e5","date":"2025-08-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"I have to replace the nozzle every time I change filament","titleCn":"每次换耗材都得换喷嘴","originalText":"I can’t figure out what I’m doing wrong. Every time I change filament I backed the old and add the new filament. Problem is the tip is automatically clogged I guess. I have to replace the nozzle before I can proceed. I’m not quite sure why it keeps showing his clogged. I’m doing something wrong but I don’t know what.\nI am using creality print six and only creality filament on a creality hi printeri. The filament is brand new.\nHas anyone a clue of what I need to look at?\nI am assuming you are using the unload and load commands on the printer. If not you need to or you are breaking the filament inside the hot end rather than removing the filament,\nIts good workflow to change nozzle if changing materials though, otherwise you need to purge new materials at previous or higher of those to nozzle to ensure everything is purge out.","textCn":"我搞不明白我做错了什么。每次换耗材，我都会退下旧的，装上新的耗材。问题是喷嘴尖端自动就堵了，我猜。我必须换喷嘴才能继续。我不太确定为什么它总是显示堵塞。我做错了什么，但我不知道是什么。我用的是 Creality Print 6，在 Creality Hi 打印机上只用 Creality 耗材。耗材是全新的。有人知道我应该检查什么吗？我假设你在打印机上使用的是卸载和加载命令。如果不是，你需要这样做，否则你是在热端内部把耗材弄断，而不是把耗材取出来。不过换材料时更换喷嘴是好的流程，否则你需要用新材料的温度或更高的温度在喷嘴处清洗，以确保一切都被清干净。","truncated":false,"url":"https://forum.creality.com/t/i-have-to-replace-the-nozzle-every-time-i-change-filament/43492","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"Creality Hi","grade":"有效","replyCount":6,"views":172,"likeCount":0,"sourceType":"论坛"},{"uid":"0cd36ef56bf902f0","date":"2025-08-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Enabling Support, but not everywhere","titleCn":"启用支撑，但不是所有地方","originalText":"We recently experimented w/embossing our logo on the bottom of the print.\nBut if we enable support, the “Creality Print” slicing software fills in the lines and letters.\nWe do need supports on some other parts of the print.\nQuestion: Is there anyway to choose where and when the slicing software adds supports ?\nLike, only have supports above 3mm ?\nThanks in advance.\nu can manually draw support in the area you need.\nIs this done in the slicing software ?\nDo you have an example on how to do that ? (Video, document …)\nIf I can draw, can I delete support drawn by the Slicing software ?\nThanks","textCn":"我们最近尝试在打印件底部压印我们的标志。但如果启用支撑，“Creality Print”切片软件会把线条和字母填满。我们确实需要在打印件的其他一些部位加支撑。问题：有没有办法选择切片软件在何处、何时添加支撑？比如只在 3mm 以上才有支撑？先谢了。 你可以手动在你需要的区域绘制支撑。 这是在切片软件里做的吗？你有怎么做的示例吗？（视频、文档……） 如果我能绘制，那我能删除切片软件绘制的支撑吗？ 谢谢","truncated":false,"url":"https://forum.creality.com/t/enabling-support-but-not-everywhere/43452","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":196,"likeCount":2,"sourceType":"论坛"},{"uid":"d9418620a2e4ee11","date":"2025-08-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creatily box 2 camera in creality print","titleCn":"creality print 中的 Creatily box 2 摄像头","originalText":"I have a ender v3 we and a creality box 2. The problem is that I can see the camera on the creality cloud app. And through a web page on the ceeality site but the creality cloud app on the pc won’t show the printer.\nAnybody know why?","textCn":"我有一台 ender v3 we 和一个 creality box 2。问题是，我在 creality cloud 应用上能看到摄像头，通过 ceeality 网站上的网页也能看到，但电脑上的 creality cloud 应用却不显示打印机。有人知道为什么吗？","truncated":false,"url":"https://forum.creality.com/t/creatily-box-2-camera-in-creality-print/43443","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":39,"likeCount":0,"sourceType":"论坛"},{"uid":"6a945113d0cabd6e","date":"2025-08-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print latest release 6.2.1.3044 installer warning","titleCn":"Creality Print 最新版本 6.2.1.3044 安装程序警告","originalText":"After running the installer I get this warning message “Creality Printer” and the buttons yes no cancel no other info. So whats about it?.\nWhat kind of computer do you have？windows desktop?windows laptop? iMac?macbook?linux?\nWindows 10","textCn":"运行安装程序后，我收到这条警告信息“Creality Printer”，按钮有 yes、no、cancel，没有其他信息。那这是怎么回事？ 你用的是什么类型的电脑？Windows 台式机？Windows 笔记本？iMac？MacBook？Linux？ Windows 10","truncated":false,"url":"https://forum.creality.com/t/creality-print-latest-release-6-2-1-3044-installer-warning/43387","productLine":"print","version":"6.2","versionRaw":"6.2.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":3,"views":177,"likeCount":0,"sourceType":"论坛"},{"uid":"c7cc1c0409b2e809","date":"2025-08-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Camera on Sonic Pad in Creality Cloud?","titleCn":"Creality Cloud 里 Sonic Pad 上的摄像头？","originalText":"I have successful connected an Ender 5 S1 with a Sonic Pad and everything prints well (C Print 6.2). I have now installed a camera which shows in C Print but not in C Cloud. It says no camera is detected. Somewhat annoying since using the camera in the C Cloud App is usually how I monitor prints and its not been an issue with my K1 Max (inbuilt camera in that case). It’s a Logitech C930e camera BTW…\nSecond odd issue is I can see the Sonic Pad connected printer in C Print, Web and the C Cloud App\nbut NOT in C Cloud online ???\nI did read somewhere that you needed to enable IoT in the Sonic Pad settings but that seems to have been removed in the most recent firmware. I did prematurely tell someone that the Sonic Pad was the first thing from Creality that worked out of the box (3 prior printers & a Space Pi) but getting it online - with or without camera - has killed that…\nMine used to work with an Ender 3 Pro and Ender 3 V3 SE but I reflashed the firmware to both and now it doesn’t see the camera anymore.","textCn":"我成功地把一台 Ender 5 S1 和一个 Sonic Pad 连接起来了，一切打印都很好（C Print 6.2）。我现在装了一个摄像头，它在 C Print 里能显示，但在 C Cloud 里不显示。它说没有检测到摄像头。有点烦人，因为我通常就是用 C Cloud 应用里的摄像头来监控打印，而我的 K1 Max 一直没有这个问题（那个是内置摄像头）。顺带一提，这是个 Logitech C930e 摄像头……第二个奇怪的问题是，我能在 C Print、网页和 C Cloud 应用里看到连接到 Sonic Pad 的打印机，但在 C Cloud 在线版里却看不到？？？我确实在哪里读到过需要在 Sonic Pad 设置里启用 IoT，但在最近的固件里那
