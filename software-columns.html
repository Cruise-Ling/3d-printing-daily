个选项似乎被移除了。我之前还过早地告诉别人，Sonic Pad 是 Creality 第一个开箱即用的产品（之前有 3 台打印机和一个 Space Pi），但让它联网——不管有没有摄像头——就毁掉了这个说法……我的以前用 Ender 3 Pro 和 Ender 3 V3 SE 是可以的，但我给两者都重新刷了固件，现在它再也识别不到摄像头了。","truncated":false,"url":"https://forum.creality.com/t/camera-on-sonic-pad-in-creality-cloud/43342","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":2,"views":111,"likeCount":1,"sourceType":"论坛"},{"uid":"c4b836769406e33a","date":"2025-08-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CR10 Smart Pro Usb Camera not working with Ceality Print 6.2","titleCn":"CR10 Smart Pro 的 USB 摄像头无法在 Creality Print 6.2 中使用","originalText":"The original USB cam of my CR10 Smart Pro is not working with Creality Print 6.2.x. The camera works fine on Cloud Print on my iPhone and iPad. I tried to connect the printer with ethernet and WiFi. Any help is appreciated.","textCn":"我 CR10 Smart Pro 原装的 USB 摄像头在 Creality Print 6.2.x 里无法使用。这个摄像头在我的 iPhone 和 iPad 上的 Cloud Print 中工作正常。我试过用以太网和 WiFi 连接打印机。任何帮助都很感谢。","truncated":false,"url":"https://forum.creality.com/t/cr10-smart-pro-usb-camera-not-working-with-ceality-print-6-2/43368","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":78,"likeCount":0,"sourceType":"论坛"},{"uid":"03c00674642fc77e","date":"2025-08-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ended 3 pro w/ sprite pro extruder","titleCn":"Ended 3 pro 配 sprite pro 挤出机","originalText":"After installing the sprite pro on my ender 3 pro the screen is just black. I checked all the wires and tried to install the sprite firmware and the original firmware. I know I’m doing something wrong can someone just tell me what it is.","textCn":"在我的 ender 3 pro 上安装 sprite pro 之后，屏幕就全黑了。我检查了所有线材，也试过刷 sprite 固件和原厂固件。我知道我哪里做错了，有人能直接告诉我是什么吗。","truncated":false,"url":"https://forum.creality.com/t/ended-3-pro-w-sprite-pro-extruder/43379","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":23,"likeCount":0,"sourceType":"论坛"},{"uid":"3701082eb6173f8e","date":"2025-08-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Lost the ability to import gcode files with todays update","titleCn":"今天的更新后无法再导入 gcode 文件","originalText":"Lost the ability to import gcode files with todays update","textCn":"今天的更新后无法再导入 gcode 文件","truncated":false,"url":"https://forum.creality.com/t/lost-the-ability-to-import-gcode-files-with-todays-update/43288","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":841,"likeCount":4,"sourceType":"论坛"},{"uid":"c1c83501bf399241","date":"2025-07-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Halot Box 4.6.1.4101 stuck on \"Exporter\"","titleCn":"Halot Box 4.6.1.4101 卡在“Exporter”","originalText":"The new Halot Box software, after slicing, keep freeze on “Exporter” e does not save the file.\nNo problems with the older versions.\nAny suggestion?\nApp is so unstable. Almost always unable to export + persistent problems with crashes if to go to “Supports“ tab and back to “Settings“.","textCn":"新的 Halot Box 软件在切片后一直卡在“Exporter”，并且不保存文件。\n旧版本没有问题。\n有什么建议吗？\n这个应用太不稳定了。几乎总是无法导出，而且如果切到“Supports”标签页再切回“Settings”，还会持续崩溃。","truncated":false,"url":"https://forum.creality.com/t/halot-box-4-6-1-4101-stuck-on-exporter/43196","productLine":"print","version":"4.6","versionRaw":"4.6.1","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":156,"likeCount":1,"sourceType":"论坛"},{"uid":"72a42db5f2d8bfd0","date":"2025-07-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Firmware for filament runout sensor + spider hot end","titleCn":"耗材断料传感器 + Spider 热端的固件","originalText":"I have an Ender 3 pro with a Spider Hot end. I am trying to install a filament runout sensor, but I can’t find the firmware with both the high temp and the filament runout sensor.","textCn":"我有一台装有 Spider 热端的 Ender 3 pro。我正在尝试安装耗材断料传感器，但找不到同时支持高温和耗材断料传感器的固件。","truncated":false,"url":"https://forum.creality.com/t/firmware-for-filament-runout-sensor-spider-hot-end/43230","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":70,"likeCount":0,"sourceType":"论坛"},{"uid":"a5eaa56be9ed082f","date":"2025-07-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CFS reverse engineering","titleCn":"CFS 逆向工程","originalText":"GitHub - fake-name/cfs-reverse-engineering: Reverse engineering the Creality CFS for use as a...\nReverse engineering the Creality CFS for use as a general AMU/MMU system\nThis could be interesting to see!\nIf there were a list of console commands in a fluid environment for printer-CFS communication, that would be useful for many users. e.g. getting humidity from CFS","textCn":"GitHub - fake-name/cfs-reverse-engineering：逆向 Creality CFS 以用作……逆向 Creality CFS，使其可作为通用的 AMU/MMU 系统使用。这看起来会很有意思！如果能在 fluid 环境里有一份用于打印机与 CFS 通信的控制台命令清单，对很多用户都会很有用，例如从 CFS 读取湿度。","truncated":false,"url":"https://forum.creality.com/t/cfs-reverse-engineering/43103","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":564,"likeCount":4,"sourceType":"论坛"},{"uid":"0d59c369280f0b4c","date":"2025-07-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Allow Price change to system preset filaments","titleCn":"允许修改系统预设耗材的价格","originalText":"I’d like to see the system preset price allowed to be changed without creating a custom filament. The price used when figuring cost is off.\nIt really needs a much simpler system that should allow us to add the price of a drum of PLA, that would be much better.","textCn":"我希望能够在不创建自定义耗材的情况下修改系统预设价格。计算成本时使用的价格不对。真的需要一个简单得多的系统，应该允许我们添加一整卷 PLA 的价格，那样会好得多。","truncated":false,"url":"https://forum.creality.com/t/allow-price-change-to-system-preset-filaments/43072","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":142,"likeCount":3,"sourceType":"论坛"},{"uid":"876e6ef983c21234","date":"2025-07-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Turn \"Print Calibration\" option off by default","titleCn":"将“打印校准”选项默认设为关闭","originalText":"Everytime i need to turn off this option\nCaptura de tela 2025-07-25 021725\nThere is any way to make it turned off by default?\nI got here trying to figure out how to do this, so I guess we can only hope for the Creality team to do something about it.\nIt’s incredibly annoying, very unnecessary and a huge waste of time.\nThe last Creality Print update fix it!","textCn":"每次我都要关掉这个选项\nCaptura de tela 2025-07-25 021725\n有什么办法能让它默认关闭吗？\n我是为了搞清楚怎么做才找到这里的，所以我想我们只能指望 Creality 团队对此做点什么了。\n这非常烦人，完全没必要，而且极大地浪费时间。\n上一次 Creality Print 更新把它解决了！","truncated":false,"url":"https://forum.creality.com/t/turn-print-calibration-option-off-by-default/42873","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"K1C","grade":"有效","replyCount":4,"views":444,"likeCount":2,"sourceType":"论坛"},{"uid":"4f834ef0fbd2a653","date":"2025-07-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CFS USES WRONG MAX VOLUMETRIC SPEED FOR PURGE SEQUENCE!","titleCn":"CFS 在擦料序列中使用了错误的最大体积速度！","originalText":"I have a 0.2mm nozzle and im trying to print in black and white with it. However, i am unable to do so because the CFS ignores the max volumetric speed set in the slicer and instead chooses it own unchangeable value that is too high and causes the nozzle to jam!\nHere is a video that shows the problem.\nHopefully creality can at least add an option to change these values hardcoded into the CFS🙏\nhave you looked at the filament ramming advanced settings ?\nI’ve not played with that, but I understand its what you are looking for.\nIm gonna try this out","textCn":"我有一个 0.2mm 喷嘴，我想用它打印黑白。但是，我做不到，因为 CFS 忽略了切片软件中设置的最大体积速度，而是选择它自己不可更改的值，该值太高并导致喷嘴堵塞！这里有一个展示该问题的视频。希望 Creality 至少能添加一个选项来更改这些硬编码在 CFS 中的值🙏 你看过耗材回推高级设置吗？我还没试过，但我明白那正是你要找的。我要试试这个","truncated":false,"url":"https://forum.creality.com/t/cfs-uses-wrong-max-volumetric-speed-for-purge-sequence/42760","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":15,"views":470,"likeCount":2,"sourceType":"论坛"},{"uid":"09cf93423d6b595d","date":"2025-07-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Hi guys, I just just bought a K2 PLUS but can't get CURA to find the printer.","titleCn":"大家好，我刚买了一台 K2 PLUS，但 CURA 找不到打印机。","originalText":"So I used to use Cura on my CR10-S a few years ago, and came to create some keyrings etc, but the Creality slicer is very basic, I can’t even round edges on a square.\nWhen I try to find my printer in Cura it just says no printer exists.\nHas anyone managed to fix this?\nThanks everyone\nI do not use Cura, but this sounds like a more generic network problem. I might be able to help.\nBefore we look at the network, let me offer a workaround to get you going. Export a STL or 3MF file from Cura to a USB stick. Then move the USB stick to the K2 and print from there. It is not an elegant solution, but it will get you going.\nDo you have a VPN running? I have to turn my VPN off to reach the K2 (even though the VPN is exempt to local traffic). If you have a VPN, try turning it off temporarily.\nI assume the computer running Cura and the K2 are on the same network.\nLocate the IP address of the K2 and verify that you can “ping” it from the computer running Cura. if you can then the connection is good.\nIf there is a place to manually enter the IP address for a new printer in Cura, try that. Even on Creality’s Print software, I still had to enter my K2 IP address manually.\nThat’s a start. …","textCn":"几年前我在我的 CR10-S 上用 Cura，现在想做一些钥匙扣之类的，但 Creality 的切片软件非常基础，我甚至没法把一个方块的边角倒圆。当我在 Cura 里尝试查找我的打印机时，它只显示没有打印机存在。有人解决过这个问题吗？谢谢大家。我不用 Cura，但这听起来更像是一般的网络问题。也许我能帮上忙。在我们检查网络之前，先给你一个能马上用起来的变通办法。从 Cura 导出一个 STL 或 3MF 文件到 U 盘。然后把 U 盘插到 K2 上，从那里打印。这不是优雅的解决方案，但能让你先用起来。你开了 VPN 吗？我得关掉 VPN 才能连上 K2（尽管 VPN 已经对本地流量豁免）。如果你有 VPN，试着暂时关掉。我假设运行 Cura 的电脑和 K2 在同一个网络上。找到 K2 的 IP 地址，确认你能从运行 Cura 的电脑上“ping”通它。如果能通，连接就没问题。如果 Cura 里有地方可以手动为新打印机输入 IP 地址，试试那个。即使在 Creality 的 Print 软件上，我也仍然需要手动输入我的 K2 IP 地址。这只是个开始。……","truncated":true,"url":"https://forum.creality.com/t/hi-guys-i-just-just-bought-a-k2-plus-but-cant-get-cura-to-find-the-printer/42773","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":7,"views":2796,"likeCount":4,"sourceType":"论坛"},{"uid":"04c76fd1f5536ea9","date":"2025-07-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"[Creality 6.2] The current account does not match the device account again","titleCn":"[Creality 6.2] 当前账户再次与设备账户不匹配","originalText":"Well, found this discussion from a few version ago\n[Creality Print V6] The current printer does not match the preset settings of the selected printer Creality Print V5 and Beyond\nHello\nWith Creality Print V6, after slicing, when sending the print to my Ender V3, I sometimes get the following orange warning message:\n*The current printer does not match the preset settings of the selected printer\n[image]\nI have already tried searching the forums and googling but have found zero results.\nWhat does this message mean? Is this a problem? Can I do something about it? Why does it only happen sometimes? I do not understand what the “preset settings” of the selected printer ar…\nHas anyone found another solution to this?\nRemoved the app data from local and tried reinstalling CP 6.2 but still get the same error. What’s even weirder is today was the first time I was able to see one of my filament presets on the printer itself when I went to change the spool in the CFS.\nI can’t tell if this is a bug with 6.2 or a flaw in CP’s design. I’ve noticed whenever I uninstall/reinstall it will show a prompt that an older version “is already installed” but doesn’t show up anywhere in my app list. …","textCn":"好吧，从几个版本之前发现了这个讨论 [Creality Print V6] 当前打印机与所选打印机的预设设置不匹配 Creality Print V5 及更高版本 你好 使用 Creality Print V6，切片后，在将打印发送到我的 Ender V3 时，我有时会收到以下橙色警告消息：*当前打印机与所选打印机的预设设置不匹配 [图片] 我已经尝试搜索论坛和谷歌，但找到的结果为零。这条消息是什么意思？这是问题吗？我能做些什么吗？为什么它只是有时发生？我不明白所选打印机的“预设设置”是什么… 有人找到了另一个解决方案吗？从本地移除了应用数据，并尝试重新安装 CP 6.2，但仍然得到同样的错误。更奇怪的是，今天是我第一次在打印机本身上看到我的一个耗材预设，当时我去更换 CFS 中的料盘。我无法判断这是 6.2 的 bug 还是 CP 设计中的缺陷。我注意到每当我卸载/重新安装时，它会显示一个提示说旧版本“已安装”，但在我的应用列表中却哪里都找不到。…","truncated":true,"url":"https://forum.creality.com/t/creality-6-2-the-current-account-does-not-match-the-device-account-again/42590","productLine":"cloud","version":"6.2","versionRaw":"6.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":84,"likeCount":1,"sourceType":"论坛"},{"uid":"44f025acaa78a729","date":"2025-07-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CREALITY CLOUD DOWN?","titleCn":"CREALITY CLOUD 挂了？","originalText":"IOT ERROR CANT CONNECT TO SERVER?\n298 / 5.000\nI got the same error message, but I think my router is the bottleneck. I’ve already tried opening various ports (80,443,123,3128,5252 etc.), but I don’t seem to have narrowed down the problem yet.\nI can’t even pinpoint why the firewall is restricting access to the cloud.","textCn":"IOT 错误，无法连接到服务器？我收到了同样的错误消息，但我认为我的路由器是瓶颈。我已经尝试开放各种端口（80、443、123、3128、5252 等），但似乎还没能缩小问题范围。我甚至无法确定防火墙为什么会限制对云端的访问。","truncated":false,"url":"https://forum.creality.com/t/creality-cloud-down/41987","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":84,"likeCount":1,"sourceType":"论坛"},{"uid":"1f5a66ab731dd8da","date":"2025-07-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Black blocks instead of text in v6.2.0.2828","titleCn":"v6.2.0.2828 中文字变成黑块","originalText":"I just bought a K1C and installed the latest Creality Print for the first time, yet a good portion of the text is just black blocks. This happens regardless of day/night mode. How can I fix this?\nRunning Windows 11 on a Ryzen 7 3800X with a 7900XT.\nScreenshot 2025-07-09 231955\nLet me know if you figure it out having the same problem\nI am having this issue as well. There has been no help from creality and its a bummer when you invest north of 2k in creality and then you cant even use their software.","textCn":"我刚买了 K1C，第一次安装最新的 Creality Print，但很大一部分文字就是黑块。白天/夜间模式都一样。我怎么才能修复？运行 Windows 11，Ryzen 7 3800X，7900XT。Screenshot 2025-07-09 231955 如果你弄明白了告诉我，我也有同样的问题。我也有这个问题。Creality 一直没有提供帮助，当你在 Creality 上投入超过 2k 却连他们的软件都用不了，真是让人沮丧。","truncated":false,"url":"https://forum.creality.com/t/black-blocks-instead-of-text-in-v6-2-0-2828/42009","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"compat","model":"K1C","grade":"有效","replyCount":4,"views":207,"likeCount":4,"sourceType":"论坛"},{"uid":"5e0b3c1f9464640e","date":"2025-07-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Cant remove klipper or flash","titleCn":"无法移除 Klipper 或刷写","originalText":"I upgraded from octoprint and stock firmware to use Klipper.\nBuilt and flashed. Printer error “cannot connect to MCU”. Did something wrong and tried to revert back to stock firmware.\nUsing the SD card to flash no longer works. Just ignores the file. Have tried different file names, a marlin community build etc.\nOk.\nRead the guide here about resetting a v3. My mainboard does not have tbe boot and reset buttons, or pads. Found the reset, not the boot.\nOk.\nGot a STMcube programmer. Soldered on the header pins to the board.\nGreat. Stm recognises the board and lets me flash. Flashed the stock firmware. Reboot. Nothng.\nIf I minicom to the named pipe, the printer response is its stil running Klipper.\nOk.\nFlash again using stmcube. All.logs say success.\nMinicom to the device still says Klipper.\nWhat is going on?\nCan anyone pleae help guide me to get my printer back to stock fw?\nI worked it out and leave this post here in case it save some other poor soul in the future…\nFull chip erase with stm3cube\nBuilt the creality source from scratch adding this section. …","textCn":"我从 OctoPrint 和原厂固件升级到使用 Klipper。构建并刷写了。打印机报错“无法连接到 MCU”。做错了什么，并尝试回退到原厂固件。使用 SD 卡刷写不再有效。它只是忽略文件。试过不同的文件名、一个 Marlin 社区构建等等。好。阅读了这里关于重置 v3 的指南。我的主板没有 boot 和 reset 按钮，也没有焊盘。找到了 reset，没找到 boot。好。弄了一个 STMcube 编程器。把排针焊到了板上。很好。STM 识别到板子并让我刷写。刷写了原厂固件。重启。什么也没有。如果我用 minicom 连接到命名管道，打印机的响应是它仍在运行 Klipper。好。再次使用 stmcube 刷写。所有日志都显示成功。用 minicom 连接设备仍然说是 Klipper。这是怎么回事？有人能帮我指导一下如何让我的打印机恢复到原厂固件吗？我搞明白了，把这个帖子留在这里，以防将来能救其他可怜人… 用 stm3cube 进行全芯片擦除 从头构建 Creality 源码并添加这一部分。…","truncated":true,"url":"https://forum.creality.com/t/cant-remove-klipper-or-flash/41942","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"Ender-3 V3 SE","grade":"有效","replyCount":2,"views":289,"likeCount":0,"sourceType":"论坛"},{"uid":"dcfbabe98295ac36","date":"2025-07-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Print Calibration checkbox in 6.2","titleCn":"6.2 中的打印校准复选框","originalText":"Print Calibration checkbox in 6.2","textCn":"6.2 中的打印校准复选框","truncated":false,"url":"https://forum.creality.com/t/print-calibration-checkbox-in-6-2/41838","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"","model":"未标注","grade":"泛讨论","replyCount":9,"views":295,"likeCount":7,"sourceType":"论坛"},{"uid":"59d0bd6b228cd62d","date":"2025-07-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can't print using CFS from Creality Print","titleCn":"无法从 Creality Print 使用 CFS 打印","originalText":"Was working fine but not anymore.\nIf I upload to the cloud I can print with the CFS using the android App\nSoftware version: 6.2.0\nPlz assist.\ntnx\n2025-07-08_12-57-53\nSame problem for me. I’ve reinstalled latest 6.1 version and it work.\nI’ve installed latest version 6.2.2.3204 on PC and now it works.","textCn":"之前一直正常，但现在不行了。如果我上传到云端，我可以用安卓 App 通过 CFS 打印 软件版本：6.2.0 请协助。谢谢 2025-07-08_12-57-53 我也有同样的问题。我重新安装了最新的 6.1 版本，它就能用了。我在 PC 上安装了最新版本 6.2.2.3204，现在可以用了。","truncated":false,"url":"https://forum.creality.com/t/cant-print-using-cfs-from-creality-print/41836","productLine":"print","version":"6.2","versionRaw":"6.2.0","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":98,"likeCount":0,"sourceType":"论坛"},{"uid":"83251b52589c61b1","date":"2025-07-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"AI Makenow error","titleCn":"AI Makenow 错误","originalText":"When you upload the image then go to the step to generate model the error is \" ai task call out limit\". It will not perform the model generation. earlier today I created a model without any issues. Is there any known limits either for time or number of models you can create?\nozhawk:\ne image th\nozhawk:\nIt will not perform the model generation. earlier today I created a model w\nThere is a time limit. After you have used up the number of times, the count will reset after 24 hours and you can continue to use it. You are welcome to continue experiencing MakeNow’s tools~\nHello I want to use the MAkeNOW system But the System is not resetting my counter for the last 2 weeks. how do I get you to reset the counter for me.","textCn":"当你上传图片然后进入生成模型这一步时，错误是“ai task call out limit”。它不会执行模型生成。今天早些时候我创建模型没有任何问题。是有已知的时间限制或可创建模型数量的限制吗？ozhawk：图片 th ozhawk：它不会执行模型生成。今天早些时候我创建了一个模型 w。是有时间限制的。在你用完次数之后，计数会在 24 小时后重置，然后你就可以继续使用。欢迎继续体验 MakeNow 的工具～ 你好，我想用 MAkeNOW 系统，但系统在过去 2 周都没有重置我的计数器。我怎样才能让你帮我重置计数器。","truncated":false,"url":"https://forum.creality.com/t/ai-makenow-error/41628","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":184,"likeCount":0,"sourceType":"论坛"},{"uid":"8d96ceb3e975645f","date":"2025-07-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Color painting grayed out for Creality Print 6.2?","titleCn":"Creality Print 6.2 的颜色绘制变灰了？","originalText":"Creality Print recently updated to 6.2.0.2827 and for whatever reason the color painting option is grayed out. I used the tool a number of times before the update just fine. I’d click on an imported object and click color painting and then I could paint the object and match to different filament loaded in my CFS. The CFS and different filaments display in Creality Print just fine still and I can assignment a specific filament from the CFS to the entire print but can no longer seem to multi color print. Did something change and I’m doing something wrong now?\nThank you!\nDisregard… I figured it out. Now it seems you need to hit the tiny “auto mapping” button at the right of the Filament header at the top right. Oof. Lol.\ni have tryed to find this color mapping button option with no success. can you send me a screen shot showing where it is please?","textCn":"Creality Print 最近更新到了 6.2.0.2827，不知什么原因颜色绘制选项变灰了。更新前我多次使用这个工具，一切正常。我会点一个导入的物体，点击颜色绘制，然后就能给物体上色并匹配我 CFS 中装载的不同耗材。CFS 和不同耗材在 Creality Print 里仍然显示正常，我也能把 CFS 中某个特定耗材指定给整个打印，但似乎不能再多色打印了。是有什么变了吗，还是我现在哪里做错了？ 谢谢！ 忽略吧…我搞明白了。现在似乎需要点右上角 Filament 标题右侧那个小小的“自动映射”按钮。哎。哈哈。 我一直没能找到这个颜色映射按钮选项。你能给我发一张截图说明它在哪里吗？","truncated":false,"url":"https://forum.creality.com/t/color-painting-grayed-out-for-creality-print-6-2/41540","productLine":"print","version":"6.2","versionRaw":"6.2","problemType":"feature","model":"未标注","grade":"有效","replyCount":6,"views":2027,"likeCount":2,"sourceType":"论坛"},{"uid":"de69173621e3420b","date":"2025-07-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How do I make CP (6.2) remember my imported filaments?","titleCn":"怎样才能让 CP（6.2）记住我导入的耗材？","originalText":"As per the title…why does Creality Print (6.2, but 6.1 did it too) forget the filament profiles I import? I can import them just fine, and it’ll be able to use them for as long as the session is alive, every time Creality Print (re)starts I need to reimport my filaments (they’re in %Appdata%\\Creality\\Creality Print\\6.0\\user\\default\\filament just fine but for some reason are not loaded automagically).\nAlso note that CP is on 6.2 now but the profile directory is still 6.0 (and also the installation is in %ProgramFiles%\\Creality\\Creality Print 6.1). All in all very inconsistent, but I guess building installers is not Creality’s area of expertise. Or any software, for that matter.\nI believe the issue is that it is tied to your Creality cloud account. Try logging out and back in. I also notice this issue when I can’t find the CFS, I will usually do this and it fixes it.\nhello，polarwolf！Has your problem been solved so far? Only text description, we can not clearly know your specific phenomenon, can you send me a specific video to show, my Email:zhanglu@ , also I need your preset data!","textCn":"如标题所说……为什么 Creality Print（6.2，6.1 也是这样）会忘记我导入的耗材配置？我可以正常导入，而且只要这次会话没结束就能一直用，但每次 Creality Print（重新）启动，我都得重新导入我的耗材（它们明明好好地放在 %Appdata%\\Creality\\Creality Print\\6.0\\user\\default\\filament 里，但不知为何不会自动加载）。 还要说明一下，CP 现在是 6.2，但配置目录还是 6.0（而且安装目录是 %ProgramFiles%\\Creality\\Creality Print 6.1）。总的来说非常不一致，不过我猜做安装程序不是 Creality 的专长。或者说，做任何软件都不是。 我认为这个问题和你的 Creality 云账号绑定有关。试着退出后重新登录。我找不到 CFS 时也会遇到这个问题，通常这样做就能修好。 hello，polarwolf！你的问题到现在解决了吗？只有文字描述，我们无法清楚了解你的具体现象，你能发一段具体的视频来展示吗，我的邮箱：zhanglu@ ，另外我需要你的预设数据！","truncated":false,"url":"https://forum.creality.com/t/how-do-i-make-cp-6-2-remember-my-imported-filaments/41466","productLine":"cloud","version":"6.2","versionRaw":"6.2","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":373,"likeCount":3,"sourceType":"论坛"},{"uid":"63abfc7950e1cc75","date":"2025-06-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Linux Appimage v6.1.2 won't launch","titleCn":"Creality Print Linux Appimage v6.1.2 无法启动","originalText":"I downloaded CrealityPrint-V6.1.2.2458-x86_64-Release.AppImage and when I try to launch it, I get the following error:\n/tmp/.mount_CrealiVfWYPS/bin/CrealityPrint: error while loading shared libraries: libwebkit2gtk-4.0.so.37: cannot open shared object file: No such file or directory\nGreat. I did some searching and stumbled upon, judging from the filename, a specific Ubuntu 24.02 version of the Creality Print Appimage called “CrealityPrint_Ubuntu2404-V6.1.2.2458-x86_64-Release.AppImage.” You know, it would have been nice to have been pointed to this version from the main website instead of requiring me to just happen upon it on Creality’s Github page, but anyway, I decided to give it a try and I get this error:\n/tmp/.mount_CrealiWk9qru/bin/CrealityPrint: error while loading shared libraries: libusrsctp\n.so.2: cannot open shared object file: No such file or directory\nYes, I ensured both versions are set to be executable. Does any QA go into the Linux releases or does whoever makes this just compile and upload it?\nRan into same problem with both. Decided to use Ubuntu24.04 App image. Just used apt to install missing library.\nUse “apt search libusrsctp”. …","textCn":"我下载了 CrealityPrint-V6.1.2.2458-x86_64-Release.AppImage，当我尝试启动时，得到以下错误：/tmp/.mount_CrealiVfWYPS/bin/CrealityPrint: error while loading shared libraries: libwebkit2gtk-4.0.so.37: cannot open shared object file: No such file or directory 很好。我搜索了一下，偶然发现，从文件名判断，是一个特定的 Ubuntu 24.02 版本 Creality Print Appimage，叫「CrealityPrint_Ubuntu2404-V6.1.2.2458-x86_64-Release.AppImage」。你知道，如果官网能指给我这个版本，而不是要我自己在 Creality 的 Github 页面上偶然发现，那就好了，不过不管怎样，我决定试一试，然后得到这个错误：/tmp/.mount_CrealiWk9qru/bin/CrealityPrint: error while loading shared libraries: libusrsctp .so.2: cannot open shared object file: No such file or directory 是的，我确保两个版本都设置成了可执行。Linux 版本有做任何 QA 吗，还是做这个的人只是编译一下就上传？两个都遇到同样的问题。决定使用 Ubuntu24.04 App image。只是用 apt 安装了缺失的库。用「apt search libusrsctp」。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-linux-appimage-v6-1-2-wont-launch/41243","productLine":"cloud","version":"6.1","versionRaw":"6.1.2","problemType":"crash","model":"未标注","grade":"有效","replyCount":7,"views":2228,"likeCount":1,"sourceType":"论坛"},{"uid":"69dcd6da3391bc0e","date":"2025-06-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"Ender 5 Max latest firmware 1.2.0.20 bugs","titleCn":"Ender 5 Max 最新固件 1.2.0.20 的缺陷","originalText":"Greetings\nI recently updated my firmware to version 1.2.0.20 and when using orca slicer, the web interface now shows 404 not found.\nAdditionally I noticed there was a typo in the requests to download the thumbnail images for the models displayed under file in creality print when the printer is selected (missing a t in the url).\nCreality se nechová k ender5Max vůbec hezky.\nNejsou kryty, nefunguje url přístup, nepoznám vadnou serii postele, chybí profily ve sliceru-ano jsou tam dva.\nA spousta dalších problémů, které se neřeší.","textCn":"问候。我最近把固件更新到 1.2.0.20，使用 orca slicer 时，网页界面现在显示 404 not found。另外我注意到，当选择打印机时，Creality Print 中文件下显示模型的缩略图下载请求有个拼写错误（url 里少了一个 t）。Creality 对 Ender5Max 的态度一点也不友善。没有盖子，URL 访问不能用，我认不出有缺陷的热床批次，切片软件里缺少配置——是的，只有两个。还有很多其他问题没有得到解决。","truncated":false,"url":"https://forum.creality.com/t/ender-5-max-latest-firmware-1-2-0-20-bugs/40702","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"Ender-5 Max","grade":"有效","replyCount":2,"views":387,"likeCount":0,"sourceType":"论坛"},{"uid":"089bbce41635cde3","date":"2025-06-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Using a K1 Nozzle wipe build plate on Ender 3 V3 KE","titleCn":"在 Ender 3 V3 KE 上使用 K1 带喷嘴擦拭的打印平台","originalText":"Hi, I own a Ender-3 V3 KE which uses 235mm build plate. So if I use buy a K1 build plate like this one with a nozzle wipe brush. can I use it. Is there a way to tell Creality print to add the gcode to wipe nozzle before each print in my Ender-3 V3 KE ?\nThank you","textCn":"你好，我有一台 Ender-3 V3 KE，使用的是 235mm 的打印平台。所以如果我买一块像这样的带喷嘴擦拭刷的 K1 打印平台，我能用吗？有没有办法让 Creality Print 在我的 Ender-3 V3 KE 每次打印前加入擦拭喷嘴的 G-code？\n谢谢","truncated":false,"url":"https://forum.creality.com/t/using-a-k1-nozzle-wipe-build-plate-on-ender-3-v3-ke/40626","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":99,"likeCount":0,"sourceType":"论坛"},{"uid":"11891db068114353","date":"2025-06-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Slicing software won't allow me to pick K2","titleCn":"切片软件不让我选 K2","originalText":"When I am using the phone app to slice items directly from the website. It asked me to pick a printer. The K2 is not an option. the app recognizes my K2 I can see video and send past prints. I just can no longer slice items. It gives me every other printer to choose from but the K2.","textCn":"当我用手机 app 直接从网站切片时，它要求我选择一台打印机。K2 不是选项。app 能识别我的 K2，我能看视频、发送过去的打印任务。我只是不能再切片了。它把所有其他打印机都列出来给我选，唯独没有 K2。","truncated":false,"url":"https://forum.creality.com/t/slicing-software-wont-allow-me-to-pick-k2/40565","productLine":"cloud","version":"","versionRaw":"","problemType":"feature","model":"K2","grade":"有效","replyCount":1,"views":66,"likeCount":0,"sourceType":"论坛"},{"uid":"ec8ff97f63a15a90","date":"2025-06-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6 won't launch anymore (newest version as of 05/jun/2025)","titleCn":"Creality Print 6 无法再启动（2025 年 6 月 5 日为止的最新版本）","originalText":"The application suddenly stopped working mid a slice, then it won’t open anymore.\nAlready uninstalled normally, uninstalled using Revo ( completely wiping all registry and windows folders related to it ), reinstalled system drivers and redistributables related to the software, already tested the latest 5 versions, all are giving the same problem.\nAll other slicers are opening fine and slicing fine (Orca, Prusa, Cura, even Halot)\nAfter the splash screen, the software shows only the top tabs, one time it managed to show more, then it just freezes. Already let it stay alone for 3 minutes, then nothing (I’m on m.2 NVME, every app opens in less than 3 seconds)\nIs having the same issues. Tried to install and reload multiple time. That was no help. About to just start using orca. Seems more consistent. Really thought about not deleting the old version first and now I really wish I hadn’t.\nI’ve tested in my wife’s notebook and my work’s PC, creality is broken in the two as well.\nProabably is stuck trying to connect to a broken server or something like that.","textCn":"应用在切片中途突然停止工作，然后就再也打不开了。 已经正常卸载过，用 Revo 卸载过（完全清除所有相关注册表和 windows 文件夹），重装了系统驱动和与该软件相关的运行库，已经测试了最新的 5 个版本，全都出现同样的问题。 所有其他切片软件都能正常打开、正常切片（Orca、Prusa、Cura，甚至 Halot） 闪屏之后，软件只显示顶部标签页，有一次它成功显示了更多，然后就冻结了。已经让它自己待了 3 分钟，然后什么都没有（我用的是 m.2 NVME，每个应用打开都不到 3 秒） 也遇到同样的问题。试过多次安装和重装。没有帮助。快开始用 orca 了。它似乎更稳定。真的想过先不删除旧版本，现在我真希望我没删。 我在我妻子的笔记本和我工作的 PC 上测试过，这两台上的 creality 也坏了。 大概是卡在试图连接一个坏掉的服务器之类的。","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-wont-launch-anymore-newest-version-as-of-05-jun-2025/39956","productLine":"thirdparty","version":"6","versionRaw":"6","problemType":"crash","model":"未标注","grade":"有效","replyCount":17,"views":1768,"likeCount":6,"sourceType":"论坛"},{"uid":"13a1cdfb20a0e572","date":"2025-05-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 5 Max firmware","titleCn":"Ender 5 Max 固件","originalText":"Hello, I am writing here for the first time since there are not so many informations about the Ender 5 Max available online. I was wondering if there is any way to use the sonic pad instead of the nebula pad, so i can get a liite bit more acces to the printer, or if there is anything related to this in the creality roadmap for this printer.\nYou have prerooted firmware, so you can install helper and via helper install fluid and etc.","textCn":"你好，我是第一次在这里发帖，因为网上关于 Ender 5 Max 的信息并不多。我想知道是否有办法用 Sonic Pad 代替 Nebula Pad，这样我就能对打印机有更多一点的控制权，或者 Creality 针对这台打印机的路线图里有没有相关的内容。 你有已预置 root 的固件，所以你可以安装 helper，并通过 helper 安装 fluid 等等。","truncated":false,"url":"https://forum.creality.com/t/ender-5-max-firmware/39534","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Ender-5 Max","grade":"泛讨论","replyCount":2,"views":404,"likeCount":0,"sourceType":"论坛"},{"uid":"f53abfe0e2daffd7","date":"2025-05-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Where to see change logs for \"Online Params\"","titleCn":"在哪里查看“在线参数”的变更日志","originalText":"As mentioned in Title, where can I see the changes in the System Preset Parameters ? They update from time to time, but I would like to see what’s changed…\nHave the same question and found a similar post. We’ll see who @CREALITY answers first.\nCreality machine presets update Software\nToday I noticed a lot of machine preset updates in the Creality software. I updated the ones I needed for my K2 plus, but I can’t find a changelog. Is there a way to see see what has changed?\nFound this after some searching:\nCrealityPrint/resources/profiles/Creality at...\nContribute to CrealityOfficial/CrealityPrint development by creating an account on GitHub.","textCn":"如标题所说，我在哪里能看到系统预设参数的变更？它们会不时更新，但我想看到改了什么…\n我也有同样的问题，并且找到了一个类似的帖子。看看 @CREALITY 先回复谁。\nCreality 机器预设更新 软件\n今天我注意到 Creality 软件里有很多机器预设更新。我更新了我 K2 plus 需要的那些，但我找不到变更日志。有办法看到改了什么吗？\n搜索一番后找到了这个：\nCrealityPrint/resources/profiles/Creality at...\n通过创建账号来为 CrealityOfficial/CrealityPrint 的开发做出贡献，就在 GitHub 上。","truncated":false,"url":"https://forum.creality.com/t/where-to-see-change-logs-for-online-params/39243","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":3,"views":80,"likeCount":1,"sourceType":"论坛"},{"uid":"37ce604cef52da59","date":"2025-05-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CP 6.1.1.2274 Refill bug","titleCn":"CP 6.1.1.2274 补料 bug","originalText":"@Lu_Zhang\nI just had a print stop early on printing where the printer advised the filament had run out (external reel). It had NOT.\nI also noticed that the blue extruder indicator was not illuminated. I ensured that the filament was pushed thru to the extruder and that the blue light illuminated. Then I extruded some filament.\nThen I resumed printing from the screen.\nTwo things happened thereafter:-\n1 The message that appeared on the device page of the CP 6 advising the filament had run out, even though it was printing again continued to be displayed until I closed the CP6. When I reloaded CP6 it had gone.\n2, The printer was printing initially from the slice at 230 degrees but after the refill it stated the temperature at nozzle was 220 degrees. Bed temperature was as expected.\nLastly if the extruder motor stops (evidenced by no filament crushing / jamming / no extrusion) why does the print continue. Is it about time this was rectified. ???\n@ Mrburns Could you provide your device model and the firmware version? …","textCn":"@Lu_Zhang 我刚才在打印时提前停止了一次，打印机提示耗材用完了（外置料盘）。但并没有。我还注意到挤出机的蓝色指示灯没有亮。我确认耗材已经送到挤出机，蓝灯亮起。然后我挤出了一些耗材。接着我从屏幕上恢复了打印。此后发生了两件事：1. CP 6 设备页面上出现的耗材用完提示，即使它已经在重新打印了，还是一直显示，直到我关闭 CP6。当我重新加载 CP6 后，它消失了。2. 打印机最初是按切片以 230 度打印的，但补料之后，它显示喷嘴温度为 220 度。热床温度符合预期。最后，如果挤出机电机停了（没有耗材被压碎/卡住/没有挤出的迹象），为什么打印还在继续。是不是该修正这个问题了。？？？@ Mrburns 你能提供你的设备型号和固件版本吗？……","truncated":true,"url":"https://forum.creality.com/t/cp-6-1-1-2274-refill-bug/38965","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":4,"views":106,"likeCount":1,"sourceType":"论坛"},{"uid":"6b0fdfbe541500f9","date":"2025-05-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"DE","title":"Sonic pad connection with cloud","titleCn":"Sonic Pad 与云端的连接","originalText":"I’m having trouble connecting my Sonic pad to the creality cloud.\nAnyone who knows how to ?\nWorked before I did a reset when it got wrong on the printouts.\nKannst du mir dabei auch helfen?\nIch komme soweit bis es heißt E-Mail und Passwort und dann soll ich auf Code schicken drücken und jedes Mal heißt es das es illegal sei und nicht klappt oder nicht funktioniert und selbst wenn ich dies mit meiner Handy Nummer mache bekomme ich keinen Code zu gesendet! Ich habe es heute schon 30 mal versucht! Ich bin verzweifelt und suche Hilfe besten gruß Manuel","textCn":"我在把 Sonic Pad 连接到 Creality Cloud 时遇到了麻烦。有人知道怎么做吗？ 在我因为打印出问题而做了一次重置之前，它是能用的。 你能在这件事上也帮帮我吗？ 我一直走到提示输入电子邮件和密码那一步，然后它让我按发送验证码，每次都说是非法的，要么就是不行或无法工作，即使我用手机号码来做，也收不到验证码！我今天已经试了 30 次了！我很绝望，寻求帮助，此致敬意 Manuel","truncated":false,"url":"https://forum.creality.com/t/sonic-pad-connection-with-cloud/38871","productLine":"cloud","version":"","versionRaw":"","problemType":"ui","model":"Ender-3 V3 SE","grade":"有效","replyCount":2,"views":102,"likeCount":0,"sourceType":"论坛"},{"uid":"4bec0b9938da1a76","date":"2025-05-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Printerkeuze in Print onvoledig","titleCn":"Print 中的打印机选择不完整","originalText":"In de Printversie zie ik nergens de Ender 6 staan, beetje vreemd want het is toch een Creality printer.\nIn Print 6.0 are a lot of Creality Printers visible, the Ender 6 is not there strange enough, i thought it was a creality Printer so it should be there.\nAnd nobody knows this incompleted version. The Creality Ender 6 doesn’t get the place in the Creality collection, even the Creality employers doesn’t give any reaction. This is not the way to make yourself popular in the 3D Printing scene.","textCn":"在 Print 版本里我到处都看不到 Ender 6，有点奇怪，毕竟它也是 Creality 打印机。在 Print 6.0 中可以看到很多 Creality 打印机，但奇怪的是没有 Ender 6，我以为它是 Creality 打印机，所以应该在那里。而且没人了解这个不完整的版本。Creality Ender 6 在 Creality 的产品系列中没有得到应有的位置，甚至 Creality 的员工也不作任何回应。这不是在 3D 打印圈里让自己受欢迎的方式。","truncated":false,"url":"https://forum.creality.com/t/printerkeuze-in-print-onvoledig/38901","productLine":"print","version":"6.0","versionRaw":"6.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":31,"likeCount":0,"sourceType":"论坛"},{"uid":"8f76dd18b87ddcc2","date":"2025-05-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Flush Into Object doesn't seem to work correctly","titleCn":"Creality Print 的“冲入对象”似乎不能正确工作","originalText":"I was comparing Orca and Creality Print regarding Flush Into Object Setting… and I’m have my doubts that Creality Prints handles this correctly.\nOrca Without a flush object… 77g flushed (multiplier 1.0)\nCaptura de tela 2025-05-19 181657\nAlso Orca, but with a flush object with Flush Into Object and Flush Into Infill Set.\nDown to 49g, and the object if mostly white (and that makes sense, since is the color that we need to flush more).\nCaptura de tela 2025-05-19 181734\nNow creality Print 6.1.1.2277 without a flush object 118g flushed (default multiplier 1.3 - Creality Hi btw)\nCaptura de tela 2025-05-19 181856\nAnd now with a flush object… nothing has changed in the amount flushed, and the object is mostly red, brown and black.. with white only on the last layers.\nCaptura de tela 2025-05-19 181942\nIf we inspect layer by layer (layer 15 in this example), It starts printing with brown on the flush object. prints with brown my main objects… switches to white and directly print white on the main object… no white flush on my flush object.\nCaptura de tela 2025-05-19 182457\nBut orca does the opposite (same layer, layer 15).. …","textCn":"我在比较 Orca 和 Creality Print 在“冲入对象”设置上的表现…我怀疑 Creality Print 处理得不对。 Orca 没有冲入对象…冲洗了 77g（倍率 1.0） Captura de tela 2025-05-19 181657 同样是 Orca，但有一个冲入对象，并设置了“冲入对象”和“冲入填充”。 降到 49g，而且这个对象大部分是白色（这很合理，因为白色正是我们需要多冲洗的颜色）。 Captura de tela 2025-05-19 181734 现在 Creality Print 6.1.1.2277 没有冲入对象，冲洗了 118g（默认倍率 1.3 - 顺便说这是 Creality Hi） Captura de tela 2025-05-19 181856 现在加上冲入对象…冲洗量没有任何变化，而且这个对象大部分是红、棕和黑色…只有最后几层是白色。 Captura de tela 2025-05-19 181942 如果我们逐层检查（这个例子中是第 15 层），它在冲入对象上开始用棕色打印。用棕色打印我的主对象…切换到白色，直接在主对象上打印白色…在冲入对象上没有白色冲洗。 Captura de tela 2025-05-19 182457 但 Orca 做的是相反的（同一层，第 15 层）…","truncated":true,"url":"https://forum.creality.com/t/creality-print-flush-into-object-doesnt-seem-to-work-correctly/38837","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":14,"views":1890,"likeCount":2,"sourceType":"论坛"},{"uid":"17f6fa9a1705e61b","date":"2025-05-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K1C Layer Number double in Creality Print Device page","titleCn":"K1C 在 Creality Print 设备页面中层数翻倍","originalText":"When printing the current layer displayed on the Creality Print Device page is double the number it actually is, it adds two after each level is completed. I had not noticed this until after installing the latest Creality Print update ver: 6.1.1.2274 I also recently installed the CFS accessory upgrade.\nDoes this problem still exist in the latest version（CP 6.1.1.2274)?\nYes it does.","textCn":"打印时，Creality Print 设备页面显示的当前层数是实际层数的两倍，每完成一层它就会加两。直到安装了最新的 Creality Print 更新版本 6.1.1.2274 之后我才注意到这一点，我最近还安装了 CFS 配件升级。 这个在最新版本（CP 6.1.1.2274）里还存在吗？ 是的，仍然存在。","truncated":false,"url":"https://forum.creality.com/t/k1c-layer-number-double-in-creality-print-device-page/38277","productLine":"print","version":"6.1","versionRaw":"6.1.1","problemType":"","model":"K1","grade":"泛讨论","replyCount":7,"views":314,"likeCount":1,"sourceType":"论坛"},{"uid":"fd678a7238891bc9","date":"2025-05-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print Imported STL files snap back to the bed","titleCn":"Creality print 导入的 STL 文件会弹回热床","originalText":"Creality Print 6 Imported STL files snap back to the bed level when moved up on the z axis. How can I stop this from happening?\nWell parts cannot be printed in the air, so at least some piece must be touching the bed. If you’re trying to stack multiple parts on top of each other you would need to merge them after importing them so they are in an assembly. You can then move them up and down as needed.\nI’m having the same issue. This is super annoying as some models are not merged and are supposed to be separate parts. But when one drops to the plate instead of staying where it is, it kind of ruins the print.\nAlso, yes twistednexus, you can print in mid air. It’s called supports. I do it all the time in other slicers.","textCn":"Creality Print 6 导入的 STL 文件在沿 z 轴向上移动时会弹回热床平面。我怎么才能阻止这种情况？ 嗯，零件不能在空中打印，所以至少有一部分必须接触热床。如果你想堆叠多个零件，需要在导入后合并它们，使它们成为一个装配体。然后你就可以按需上下移动它们。 我也遇到同样的问题。这非常烦人，因为有些模型没有合并，本应是分开的零件。但当一个零件掉到板上而不是留在原处时，它会毁掉打印。 另外，是的 twistednexus，你可以在半空中打印。这叫支撑。我在其他切片软件里一直这么做。","truncated":false,"url":"https://forum.creality.com/t/creality-print-imported-stl-files-snap-back-to-the-bed/37869","productLine":"print","version":"6","versionRaw":"6","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":8,"views":3653,"likeCount":1,"sourceType":"论坛"},{"uid":"f6d85ba29f011a48","date":"2025-05-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"which 4.2.7 BLTouch software do I need for ender 5 pro?","titleCn":"Ender 5 Pro 需要哪个 4.2.7 的 BLTouch 软件？","originalText":"I recently was gifted an Ender 5 Pro and it had the original 8bit motherboard and being tech savy as I am i decided I will upgrade to the 4.2.7 and also decided to install the auto level censor.\nI went with the CR touch and I know BLtouch firmware is still the one to use, but idk about which 3 of these I am to use. I have looked all over the internet, but nothing narrows it down for me and I dont know what adapter it is even talking about or if its something else i can look into adding. thank you\nMarlin2.0.1 BLtouch V1.1.1 Non-adapter board firmwareTMC2225\nMarlin2.0.1 BLtouch V1.3.1 with-adapter board firmwareTMC2225（temporary）","textCn":"我最近获赠了一台 Ender 5 Pro，它装的是原装的 8 位主板，而像我这样懂点技术的人，我决定升级到 4.2.7，还决定安装自动调平传感器。 我选了 CR Touch，我知道 BLtouch 固件仍然是应该用的那个，但我不知道这三种里我该用哪一个。我把整个互联网都翻遍了，但没有什么能帮我缩小范围，我甚至不知道它说的是哪个转接板，或者是不是还有别的东西我可以考虑加装。谢谢 Marlin2.0.1 BLtouch V1.1.1 Non-adapter board firmwareTMC2225 Marlin2.0.1 BLtouch V1.3.1 with-adapter board firmwareTMC2225（temporary）","truncated":false,"url":"https://forum.creality.com/t/which-4-2-7-bltouch-software-do-i-need-for-ender-5-pro/37770","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":211,"likeCount":0,"sourceType":"论坛"},{"uid":"220ae324c08aa1e2","date":"2025-04-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problem selecting filament from CFS","titleCn":"从 CFS 选择耗材的问题","originalText":"I have a CFS with PLA in 1-3. In the 4th slot I have PETG. No matter how I try, after slicing, the send to printer has the media set to PLA. Filament device is set to CFS. Under that it states “Please select the CFS slot corresponding to the filaments”.\nA black box says “PLA” and under that is the selector.\nThe selector show the 3 PLA and the one PETG. But the PETG is hash marked out and not selectable.\nHow do I get this to select the filament I want to print in?\nIt seems to only look at Slot 1 of the 8 to pick up what filament is there.\nI moved the PETG to #1 and I can now select PETG.\nI have the same problem. Seems one should select the filament type before slicing. The print screen then only shows the slots with the same filament type to select the colour. Question is, why does the slicer only use slot 1?\nWith 400 views why has this not received a response???","textCn":"我有一台 CFS，1-3 号位放的是 PLA。第 4 个槽位放的是 PETG。不管我怎么试，切片之后“发送到打印机”里的材料都设成 PLA。耗材设备设的是 CFS。下面写着“请选择与耗材对应的 CFS 槽位”。 一个黑框显示“PLA”，下面就是选择器。 选择器显示了 3 个 PLA 和那 1 个 PETG。但 PETG 被打了斜线，无法选择。 我怎样才能让它选中我想用来打印的耗材？ 它似乎只查看 8 个槽位里的第 1 个，以此判断那里是什么耗材。 我把 PETG 移到了 #1，现在就能选 PETG 了。 我也有同样的问题。看来应该在切片前先选好耗材类型。然后打印界面只显示同类型耗材的槽位来选择颜色。问题是，为什么切片软件只用第 1 个槽位？ 有 400 次浏览，为什么这个问题一直没得到回复？？？","truncated":false,"url":"https://forum.creality.com/t/problem-selecting-filament-from-cfs/37507","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":1366,"likeCount":0,"sourceType":"论坛"},{"uid":"57bd5e9ee69bbb77","date":"2025-04-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 3 Sprite with CR Touch","titleCn":"带 CR Touch 的 Ender 3 Sprite","originalText":"The firmware for the Ender 3 Sprite with CR Touch on a 4.2.2 board doesn’t appear to be working right. Firmware was found here.\ncreality\ncreality\ncreality\nFirst problem right off the bat is that the EEPROM doesn’t always remember it’s settings and goes right back to default settings, which means I’m changing it from chinese back to english, then change all the rest of the settings involved with it. Doesn’t matter if I tell EEPROM to save, it will sooner rather than later forget it’s settings.\nThe next problem is that the small wire coming from the Sprite to the CR Touch doesn’t work right. When I try to level the bed or tell the hot end to go back home, the probe doesn’t extend. I can test the probe, and it will extend and retract, but when it comes to actually extending to detect the z-axis, it would rather just grind the hot end into the plate. To avoid this I have to bypass the sprite all together and use a really long wire from the board to the CR Touch. Appears to be a software issue that has been discussed on other forms for marlin.","textCn":"用于 4.2.2 板、带 CR Touch 的 Ender 3 Sprite 固件似乎工作不正常。固件是在这里找到的。creality creality creality。首先第一个问题就是 EEPROM 并不总是记住设置，会直接回到默认设置，这意味着我要把它从中文改回英文，然后更改所有相关的其他设置。不管我是否让 EEPROM 保存，它迟早会忘记设置。下一个问题是从 Sprite 接到 CR Touch 的那根细线工作不正常。当我尝试调平热床或让热端回原点时，探针不伸出。我可以测试探针，它会伸出和收回，但真正需要伸出探测 Z 轴时，它宁愿让热端磨到板上。为了避免这种情况，我不得不完全绕过 Sprite，从主板拉一根很长的线到 CR Touch。似乎是软件问题，在其他关于 Marlin 的论坛上讨论过。","truncated":false,"url":"https://forum.creality.com/t/ender-3-sprite-with-cr-touch/37101","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":89,"likeCount":0,"sourceType":"论坛"},{"uid":"50c2a0ee37e9e7df","date":"2025-04-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"New Ender 3 V3 firmware extrudes before retracting","titleCn":"新的 Ender 3 V3 固件在回抽前先挤出","originalText":"I updated the firmware on my Ender 3 V3 (regular) yesterday after receiving it earlier this week. I’m fairly new to this printer although I had an Ender 2 for a year and others before that. I could have sworn that when I used the retract option before upgrading the firmware it would just retract. Now it seems to extrude before retracting, has anyone else noticed this? Feels like a bug to me.\nI upgraded from 1.2.0.46 (shipped version) to 1.2.3.28 (latest at the time of upgrade).\nYes mine did the same thing after an update done months ago. I complained to Creality about the wasted filament and sent them a video of how the retract was working. Several more emails went back and forth until they finally came to the conclusion that everything was working as it should. I would have hoped the issue would be fixed by now. I resolved it by rolling the printer back to an update that worked as it should. The problem is I cannot get any new updates as I refuse to live with that issue.\nThat’s interesting. Doesn’t feel right to me either. …","textCn":"本周早些时候收到打印机后，我昨天更新了我的 Ender 3 V3（普通版）的固件。我对这台打印机还算新手，尽管我用过一年 Ender 2，之前也用过其他机器。我敢肯定在升级固件前，我使用回抽选项时它就只是回抽。现在它似乎在回抽前会先挤出，还有别人注意到这一点吗？我觉得这像是个 bug。 我从 1.2.0.46（出厂版本）升级到 1.2.3.28（升级时的最新版）。 是的，我几个月前更新后也出现了同样的情况。我向 Creality 投诉了浪费耗材的问题，并给他们发了一段回抽工作情况的视频。来回又发了几封邮件，直到他们最后得出结论说一切都在按应有的方式工作。我本以为这个问题现在会被修复。我的解决办法是把打印机回滚到工作正常的那个更新版本。问题是，我拿不到任何新更新，因为我拒绝忍受这个问题。 这很有意思。我也觉得不太对劲。…","truncated":true,"url":"https://forum.creality.com/t/new-ender-3-v3-firmware-extrudes-before-retracting/36930","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3","grade":"泛讨论","replyCount":3,"views":314,"likeCount":4,"sourceType":"论坛"},{"uid":"88d32742778edf32","date":"2025-04-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Hi not showing as available printer","titleCn":"Creality Hi 未显示为可用打印机","originalText":"Having issues with my new Creality Hi printer. When selecting a project, i go to select my Hi printer and doesnt show in list. I go into manage printer and it shows there. I removed it and re-add it only for it to show removed. If i close the app and open again, it doesnt show up again.\nScreenshot_20250418_132107_Creality Cloud\nScreenshot_20250418_132148_Creality Cloud\nDid you install the creality print 6.1 on your pc ?\nCould be that this has something to do with it.\nI did not have any problems installing and finding my High Combo on the pc and android.\nBut i do have creality print installed.\nI was having the issue with my android phone. I thought the same thing so installed newest software onto the laptop. Same issue. I can see it through the pc but still not showing on android phone and the Creality cloud app.","textCn":"我的新 Creality Hi 打印机有问题。选择项目时，我去选择我的 Hi 打印机，但它没有出现在列表里。我进入打印机管理，它在那里显示着。我把它移除再重新添加，结果它却显示为已移除。如果我关闭应用再重新打开，它又不会显示出来。\nScreenshot_20250418_132107_Creality Cloud\nScreenshot_20250418_132148_Creality Cloud\n你在电脑上安装了 Creality Print 6.1 吗？\n可能这跟它有关。\n我在电脑和安卓上安装并找到我的 Hi Combo 都没有任何问题。\n但我确实装了 Creality Print。\n我是在安卓手机上遇到这个问题。我想的也是一样，所以在笔记本电脑上装了最新软件。同样的问题。我可以通过电脑看到它，但在安卓手机和 Creality Cloud 应用上仍然不显示。","truncated":false,"url":"https://forum.creality.com/t/creality-hi-not-showing-as-available-printer/36792","productLine":"cloud","version":"6.1","versionRaw":"6.1","problemType":"ui","model":"Creality Hi","grade":"有效","replyCount":4,"views":716,"likeCount":1,"sourceType":"论坛"},{"uid":"77efe63b7b55d924","date":"2025-04-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"The light off delay on Halot R6 is either bugged, or if it is working in the intented way, it is useless.","titleCn":"Halot R6 上的熄灯延迟要么有缺陷，要么即使按预期工作也没用","originalText":"On the Halot R6, the light-off delay happens before the build plate lifts, while the cured layer is still pressed against the FEP. This is the opposite of how most resin printers work, where the delay happens after lifting, letting the resin settle and suction release more smoothly. Because of this, increasing light-off delay on the R6 just makes the print sit stuck to the FEP longer, which actually increases adhesion and makes peeling harder. This is especially a problem with viscous or tough resins. It’s likely a firmware issue, but it makes dialing in settings way more difficult than it should be. The problem could be resolved by setting the lifting height heigher, but the device limits it at 5 mm, which is not enough.","textCn":"在 Halot R6 上，熄灯延迟发生在构建板上升之前，此时固化层仍压在 FEP 上。这与大多数树脂打印机的工作方式相反，那些机器的延迟发生在上升之后，让树脂沉降并使吸力更平滑释放。因此，在 R6 上增加熄灯延迟只会让打印件更久地粘在 FEP 上，这实际上增加了附着，让剥离更难。对粘稠或韧性树脂尤其成问题。这很可能是固件问题，但它让调参比本该的困难得多。这个问题可以通过把上升高度设得更高来解决，但设备把它限制在 5 mm，这不够。","truncated":false,"url":"https://forum.creality.com/t/the-light-off-delay-on-halot-r6-is-either-bugged-or-if-it-is-working-in-the-intented-way-it-is-useless/36622","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":133,"likeCount":0,"sourceType":"论坛"},{"uid":"a13bddc2cef023ab","date":"2025-04-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print 6.1 supports","titleCn":"Creality Print 6.1 的支撑","originalText":"So I did an 11 hour print today. And it came out flawless. But unfortunately after it printed the supports were so badly stuck to the print it broke off a lot of the model. And one thing I noticed is in creality 6.1 for the k2 the tree support branch density is missing. So how do I now make the supports weaker so they aren’t as Glued to the model? I already made the z distance pretty far away and they still were Glued to it.\nI’m using tree(manual), organic, from build plate only, remove small overhangs.\nWith bridges somewhere works nice.\nTree_supports","textCn":"今天我做了一次 11 小时的打印。结果完美无瑕。但不幸的是，打印完成后支撑死死粘在打印件上，把模型弄断了很多地方。我还注意到，在 Creality 6.1 针对 K2 的版本里，树状支撑的分支密度不见了。那我现在要怎么让支撑更弱一些，不至于那么粘在模型上？我已经把 z 距离设得相当远了，它们还是粘在上面。我用的是树状（手动）、有机、仅从热床生成、移除小悬垂。在某些地方加桥接效果不错。 Tree_supports","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-1-supports/36345","productLine":"print","version":"6.1","versionRaw":"6.1","problemType":"","model":"K2","grade":"泛讨论","replyCount":2,"views":214,"likeCount":0,"sourceType":"论坛"},{"uid":"e252bf6168496808","date":"2025-04-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Scan with Linux?","titleCn":"Creality Scan 能在 Linux 上使用吗？","originalText":"Creality Scan with Linux?","textCn":"Creality Scan 能在 Linux 上使用吗？","truncated":false,"url":"https://forum.creality.com/t/creality-scan-with-linux/35959","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":24,"views":4655,"likeCount":80,"sourceType":"论坛"},{"uid":"6419b6f5b1f62534","date":"2025-03-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Very long startup before print","titleCn":"打印前启动时间非常长","originalText":"Ok, so this is my first Creality, but what’s with the 5 minutes of printer self-checking before a print starts. I’ve got calibration turned off (CFS turned on), but it still goes through 5 minutes (timed) of moving the gantry and head around the place before it settles down to a) check filament then b) start printing.\nIf I turn calibration back on then it’s another few minutes while it does a multi-point check of bel height - at least that bit I understand (coming from a Prusa MK3S+)\nThis is both pre-sliced (poop-deflector) and newly-sliced in CP6.0.5.1840\nI agree. I have the Hi Combo… Even on a single color print AND Calibration turned OFF… it takes 9 MINUTES for the print to even start. It seems to purge a couple of times even tho it is on a single color. It raises to the top 2 times.\nThis is ridiculous.\nOnce the print starts… it is FAST. But dang… waiting for it to start is beyond frustrating.\nYup, mine heats, reheats, is at 0% then goes for another loop… 4 minutes later it starts printing.\nI see that the first post was in March, yours was in Aug. Is anybody out there?\nSurely this is an easy firmware fix?","textCn":"好吧，这是我的第一台 Creality，但打印开始前 5 分钟的打印机自检是怎么回事。我已经关闭了校准（CFS 开启），但它仍然要花 5 分钟（计时过）让龙门架和打印头到处移动，然后才安定下来 a) 检查耗材，然后 b) 开始打印。如果我重新打开校准，那又要多几分钟，因为它要对热床高度进行多点检查——至少那部分我理解（我来自 Prusa MK3S+）。这既发生在预切片的（poop-deflector）上，也发生在我于 CP6.0.5.1840 中新切片的文件上。我同意。我有 Hi Combo… 即使单色打印并且校准关闭… 打印也要 9 分钟才能开始。它似乎会排料几次，尽管是单色。它升高到顶部 2 次。这太荒谬了。一旦打印开始… 它很快。但天哪… 等待它开始真是令人沮丧。是的，我的加热、再加热、在 0% 然后又开始另一个循环… 4 分钟后它开始打印。我看到第一个帖子是 3 月的，你的是 8 月的。外面有人在吗？这肯定是个简单的固件修复吧？","truncated":false,"url":"https://forum.creality.com/t/very-long-startup-before-print/35120","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":9,"views":1407,"likeCount":3,"sourceType":"论坛"},{"uid":"9c608cdd2dc32c17","date":"2025-03-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.0.4, gcode viewing","titleCn":"Creality Print 6.0.4，G-code 查看","originalText":"Creality Print 6.0.4, gcode viewing","textCn":"Creality Print 6.0.4，G-code 查看","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-0-4-gcode-viewing/34692","productLine":"print","version":"6","versionRaw":"6","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":161,"likeCount":0,"sourceType":"论坛"},{"uid":"b9e85b2340fa5001","date":"2025-03-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Include Ender 3 V2 in Creality Print","titleCn":"在 Creality Print 中加入 Ender 3 V2","originalText":"Why they not include the Ender 3 V2 and Neo on the Creality Print but the include the stock Ender 3\nI have the same question…I’m running klipper fine but can’t see the printer in 7.0.0.X","textCn":"为什么他们不在 Creality Print 里加入 Ender 3 V2 和 Neo，却包含了原版 Ender 3 我也有同样的问题……我运行 klipper 没问题，但在 7.0.0.X 里看不到这台打印机","truncated":false,"url":"https://forum.creality.com/t/include-ender-3-v2-in-creality-print/34217","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":88,"likeCount":0,"sourceType":"论坛"},{"uid":"d2f940fae538907e","date":"2025-03-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CFS integration with Orca Slicer","titleCn":"CFS 与 Orca Slicer 的集成","originalText":"Hi all, in common with many in the community, I’m finally going with the flow and switching to Orca Slicer (fed up with printer vendors locking us into their inferior ports of Orca - what a waste of resources!!). HOWEVER, it doesn’t seem to be able to integrate with the CFS (it talks to the printer fine, thanks to Creality using a reasonably standard Klipper firmware port). Has anyone found or written a plugin or extension to Orca to integrate with the Creality CFS?\nUpdate to the above: actually, integration with CFS is better than I thought! It seems one can add material “slots” to Orca, and specify the loaded filament manually, in the same way as one does with Creality Print (I can now see how little they’ve changed CP from the upstream Orca). So, it looks like Orca does just about everything I need it to do - the one thing I haven’t tested is whether it will switch to an alternate filament reel when the current one runs out - that’s a feature of the CFS I really want to use, so I’m hoping it’s a facet of the printer firmware, not the slicer.\nHi, note if you haven’t seen this yet, Orca has “beta” and other newer versions than their last official release. …","textCn":"大家好，和社区里很多人一样，我终于随大流转向了 Orca Slicer（受够了打印机厂商把我们锁在他们那些劣质的 Orca 移植版里——多浪费资源啊！！）。然而，它似乎无法与 CFS 集成（它和打印机通信正常，这要感谢 Creality 使用了相当标准的 Klipper 固件移植）。有人找到或编写了 Orca 的插件或扩展来与 Creality CFS 集成吗？ 对上述内容的更新：实际上，与 CFS 的集成比我以为的要好！似乎可以在 Orca 中添加材料“槽位”，并像在 Creality Print 中一样手动指定装入的耗材（我现在能看出他们把 CP 从上游 Orca 改动了多少）。所以，看起来 Orca 几乎做到了我需要的所有事情——我唯一没测试的是，当前料盘用完时它是否会切换到备用耗材盘——这是 CFS 我非常想用的功能，所以我希望它是打印机固件的功能，而不是切片软件的功能。 嗨，提醒一下，如果你还没看到，Orca 有“beta”版本以及其他比他们最后一次正式发布更新的版本。……","truncated":true,"url":"https://forum.creality.com/t/cfs-integration-with-orca-slicer/34061","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":10127,"likeCount":4,"sourceType":"论坛"},{"uid":"48bdba0428f517f3","date":"2025-03-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How do I set 3 Wall perimeter?","titleCn":"我如何设置 3 圈墙周长？","originalText":"How do I set 3 Wall perimeter? Could not find this setting\nIn the Processes area, the Strength tab, Wall Loops is the same thing as Wall Perimeter. Just put the number of walls you want in there. In your case 3. If you want 4 wall perimeters, enter 4 for the Wall Loops value.\nStrength>walls>wall loops","textCn":"我如何设置 3 圈墙周长？找不到这个设置。在 Processes（工艺）区域，Strength（强度）选项卡里的 Wall Loops（墙圈数）就是墙周长。把你想要的墙圈数填进去就行。你的情况填 3。如果你想要 4 圈墙周长，就在 Wall Loops 值里输入 4。Strength>walls>wall loops","truncated":false,"url":"https://forum.creality.com/t/how-do-i-set-3-wall-perimeter/33697","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":4,"views":439,"likeCount":1,"sourceType":"论坛"},{"uid":"aacc2d37af9d9345","date":"2025-03-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How do I set bed temperature in Creality Print?","titleCn":"我怎样在 Creality Print 中设置热床温度？","originalText":"Hi, I cant see this question on here, so sorry if i missed an answer to this already.\nIm trying to figure out how to set the bed temperature when using Creality Print.\nOne of my prints keeps pumping up the bed temperature to 70 degrees when all the others print fine at 50 degrees.\nIve tried looking for some ability to set the bed temp, but im not seeing anything,\nCan anyone point me at the relevant setting please?\nIm very new to 3d printing, so please explain it in a way even a total novice would understand.\nThanks for any help!\nSetBedTemp\nBill\nAh, interesting. Thanks, Bill.","textCn":"你好，我在这里没看到这个问题，所以如果我漏掉了已有的回答，很抱歉。 我正在想办法弄明白使用 Creality Print 时如何设置热床温度。 我有一件打印件总是把热床温度升到 70 度，而其他所有打印件在 50 度时都正常。 我试过寻找设置热床温度的功能，但我什么也没看到， 有人能指给我相关设置在哪里吗？ 我对 3D 打印非常新手，所以请用连完全的新手都能理解的方式解释。 感谢任何帮助！ SetBedTemp Bill 啊，有意思。谢谢，Bill。","truncated":false,"url":"https://forum.creality.com/t/how-do-i-set-bed-temperature-in-creality-print/33472","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":9897,"likeCount":4,"sourceType":"论坛"},{"uid":"d61efdf4fe23bac9","date":"2025-03-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How do I set up Creality Print for Hyper PETG filament","titleCn":"如何为 Hyper PETG 耗材设置 Creality Print","originalText":"The label on the filament reel says Speed 30-600; Temperature 220-260; Bed 60-80; Fan 50%.\nCreality Print has values for Softening Temperature, Recommended Nozzle temperature, etc. Print & Bed Temperature take values for first layer and other layers, how do I specify these values based upon the data on the label?\nThanks in advance,\nSteve\nMake sure your logged into Creality account on home page\nIs it Creality Hyper Petg - yes then\nIf using via CFS then the rfid will set it within CP6 and printer when you synchronise\nIf no then on the prepare tab select one of the filament names and hit the pencil icon. you will then be able to select Creality/Generic etc followed by Petg etc.\nIf it does not exist choose generic Petg then change parameters and save as - Ensure you save as to USER with a decent description.\nThanks, I don’t have CFS.\nWhat I need to know is what to change the parameters to, based on the values on the reel","textCn":"耗材盘上的标签写着 速度 30-600；温度 220-260；热床 60-80；风扇 50%。\nCreality Print 里有软化温度、推荐喷嘴温度等数值。打印温度和热床温度分别取首层和其他层的值，我该如何根据标签上的数据来指定这些值？\n先谢谢了，\nSteve\n确保你在首页登录了 Creality 账号\n是 Creality Hyper Petg 吗——是的，那就\n如果通过 CFS 使用，那么当你同步时，RFID 会在 CP6 和打印机中设置好\n如果不是，那么在准备标签页里选择其中一个耗材名称，点击铅笔图标。然后你就能选择 Creality/Generic 等，接着选 Petg 等。\n如果它不存在，选择 generic Petg，然后修改参数并另存为——确保以 USER 保存并写一个合适的描述。\n谢谢，我没有 CFS。\n我需要知道的是，根据料盘上的数值，应该把参数改成什么","truncated":false,"url":"https://forum.creality.com/t/how-do-i-set-up-creality-print-for-hyper-petg-filament/33429","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":6,"views":4942,"likeCount":0,"sourceType":"论坛"},{"uid":"6332070a74714588","date":"2025-03-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CP v6.0.4.1793 - Logging in Via home page in CO6 - Crazy","titleCn":"CP v6.0.4.1793 - 在 CO6 中通过首页登录 - 太疯狂了","originalText":"@Lu_Zhang\nWhen I click login on the home page it opens up a web page where I can login or scan QR via app; however it then loads another instance of the program. Crazy.\nIn addition there is no mechanism to ensure “stay logged in”, hence I never know if I am logged in or not without then defaulting to the home page and then signing again as above; again crazy.\nhas to be a better way - like logging in within CP6","textCn":"@Lu_Zhang\n当我在首页点击登录时，它会打开一个网页，我可以在那里登录或用应用扫码；但之后它又加载了另一个程序实例。太疯狂了。\n此外没有任何机制能保证“保持登录状态”，所以如果不回到首页再像上面那样重新登录一次，我就永远不知道自己到底有没有登录；又是太疯狂了。\n一定有更好的办法——比如在 CP6 内部登录","truncated":false,"url":"https://forum.creality.com/t/cp-v6-0-4-1793-logging-in-via-home-page-in-co6-crazy/33427","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":64,"likeCount":1,"sourceType":"论坛"},{"uid":"ecca07ddcefec053","date":"2025-03-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"User Filament synchronization from CP6 to K2 Plus","titleCn":"从 CP6 到 K2 Plus 的用户耗材同步","originalText":"@Lu_Zhang\nHi there,\nIs it possible to synchronize user filaments from the CP6 to the K2 plus printer filament settings dashboard screen dropdown? Currently it shows Creality/Generic/Esun\nIf not can this be looked as a feature request ?\nThanks","textCn":"@Lu_Zhang 你好，是否可以把用户耗材从 CP6 同步到 K2 Plus 打印机耗材设置面板的下拉列表中？目前它显示的是 Creality/Generic/Esun。如果不行，能否把它作为一个功能需求来看待？谢谢","truncated":false,"url":"https://forum.creality.com/t/user-filament-synchronization-from-cp6-to-k2-plus/33256","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":51,"likeCount":0,"sourceType":"论坛"},{"uid":"dfc5f4c5e6a6c6f2","date":"2025-02-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Nozzle crash into edge of bed on retry - Bent nozzle and damaged bed!","titleCn":"重试时喷嘴撞到热床边缘 - 喷嘴弯曲、热床损坏！","originalText":"Last night I had a nasty, but brief nozzle crash into the edge of the build plate!\nI had a filament jamming warning (Between CFS and K2), I pressed retry (as I have many times before without issue) and for some reason the hot end waited to cool, then it re heated to 260. It then launched into the edge of the bed. I then got a “2016 Unknown Exception” error, though the printer just carried on printing at the correct height (about 25mm above the bed). Sadly though, the Y axis was now offset by about 1 - 2mm. as the crash had bent the nozzle.\nA few layers later, after resuming it then crashed out and stopped with “XS2353 System Error, try restarting”\nThe printer offered to resume on restart, but the print was messed up already, so I aborted.\nMy guess is there is a firmware “issue” on pressing retry. Though this usually works. I’ve report it to Creality and am waiting for a response via the App and via WhatsApp. Nothing so far from support! Obs it is still under warranty.\nOnly minor damage to build plate, but nozzle is destroyed, hopefully hot end assembly is okay. Next prints with new nozzle seem fine so far.\nAnyone shed any light, or have this experience? …","textCn":"昨晚我的喷嘴狠狠地、但短暂地撞到了构建板边缘！ 我收到了一个耗材堵塞警告（在 CFS 和 K2 之间），我按了重试（像我以前很多次那样，没有出问题），不知为何热端等到冷却，然后又重新加热到 260。然后它就冲向了热床边缘。我随后收到一个“2016 Unknown Exception”错误，不过打印机只是继续以正确的高度打印（热床上方约 25mm）。但遗憾的是，Y 轴现在偏移了大约 1 - 2mm，因为撞击把喷嘴弄弯了。 几层之后，在恢复之后它又撞坏并停止，报“XS2353 System Error, try restarting” 打印机提示可以在重启后恢复，但打印已经乱了，所以我中止了。 我的猜测是按下重试时存在固件“问题”。不过这一般都能用。我已经向 Creality 报告了，正在通过 App 和 WhatsApp 等待回复。支持方面到目前为止没有任何消息！显然它还在保修期内。 构建板只有轻微损坏，但喷嘴毁了，希望热端组件没事。用新喷嘴做的后续打印到目前为止看起来没问题。 有人能说明一下，或者有过这种经历吗？……","truncated":true,"url":"https://forum.creality.com/t/nozzle-crash-into-edge-of-bed-on-retry-bent-nozzle-and-damaged-bed/32338","productLine":"firmware","version":"","versionRaw":"","problemType":"crash","model":"K2","grade":"有效","replyCount":1,"views":197,"likeCount":0,"sourceType":"论坛"},{"uid":"9392d675d1be3778","date":"2025-02-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Filament Spool Mounting Alternative","titleCn":"料盘安装的替代方案","originalText":"Like most people who own any of the Ender series printers, the side spool mount doesn’t really work well. It would constantly get jammed/tangled, preventing the filament from feeding. I was tempted to print the mount for the top but the top of my desk prevents that from being an option, so I went a different route.\nIf you have a spare lazy susan or record player/turntable laying around that’s not being used, place the spool on top of it (horizontally) and let it go.\nNow if this has already been said/recommended before, I apologize, I just felt the need to share.\nThis is such a frustration on this printer. Of the two major flaws with this printer, this one bothers me the most.","textCn":"像大多数拥有 Ender 系列打印机的人一样，侧边的料盘架其实不太好用。它会不断卡住/缠结，导致耗材无法进料。我曾想打印顶部的支架，但我桌子的顶部使这个方案不可行，所以我走了另一条路。如果你手边有一个闲置的转盘或唱片机/唱盘，把料盘（水平）放在上面，让它转就行。如果这之前已经有人说过/推荐过，我道歉，我只是觉得有必要分享。这台打印机的这个问题太让人沮丧了。这台打印机的两大缺陷中，这一个最让我烦恼。","truncated":false,"url":"https://forum.creality.com/t/filament-spool-mounting-alternative/30573","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3","grade":"泛讨论","replyCount":2,"views":126,"likeCount":0,"sourceType":"论坛"},{"uid":"cffeb683426d3631","date":"2025-02-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print V5 and Beyond","titleCn":"Creality Print V5 及以后版本","originalText":"Dedicated section for Creality’s software, focusing on Creality Print V5 and Beyond . Everyone can discussion all topics related to these models.\nHello,\nWell, for starters …\nCreality Print version 6 “Problems”\nOther than that, have a good look through YOUR forum. There are plenty of complaints !!!\nCheers.\nPlease add a support blocker, when making helmets its supports and making the printer time more and using a lot of filament for support,\nIf put a support blocker like cura has, it will cut on time and filament usage when you have a support blocker\nThank you very much\nTomas Garcia","textCn":"Creality 软件的专区，聚焦 Creality Print V5 及以后版本。大家可以讨论与这些型号相关的所有话题。你好，好吧，首先……Creality Print 第 6 版的“问题”。除此之外，好好看看你们自己的论坛。抱怨可不少！！！祝好。请添加一个支撑阻挡块，制作头盔时它的支撑会让打印机时间更长，并消耗大量耗材用于支撑。如果像 Cura 那样有支撑阻挡块，当你有支撑阻挡块时就能节省时间和耗材用量。非常感谢 Tomas Garcia","truncated":false,"url":"https://forum.creality.com/t/creality-print-v5-and-beyond/30453","productLine":"thirdparty","version":"5","versionRaw":"5","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":480,"likeCount":0,"sourceType":"论坛"},{"uid":"b80bc18ae77696fa","date":"2025-01-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print V6.0.2.1574 Custom Filament issues and printing with K2 PLUS and CFS. HELP PLEASE","titleCn":"Creality Print V6.0.2.1574 自定义耗材问题以及使用 K2 PLUS 和 CFS 打印。请帮忙","originalText":"Creality Print V6.0.2.1574 Custom Filament issues and printing with K2 PLUS and CFS. HELP PLEASE","textCn":"Creality Print V6.0.2.1574 自定义耗材问题以及使用 K2 PLUS 和 CFS 打印。请帮忙","truncated":false,"url":"https://forum.creality.com/t/creality-print-v6-0-2-1574-custom-filament-issues-and-printing-with-k2-plus-and-cfs-help-please/29756","productLine":"print","version":"6","versionRaw":"6","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":16,"views":3764,"likeCount":1,"sourceType":"论坛"},{"uid":"2ce089f6ddee0f2d","date":"2025-01-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6, don't loading filament start gcode","titleCn":"Creality Print 6 不加载耗材起始 gcode","originalText":"It seems that the commands entered in the filament profile in “start gcode” session, are not loaded correctly into gcode.\nI was only able to find them as comments at the end of the gcode file.\nI confirm the same problem with version 1574\nI’m using creality print V7.1.0.4414 and can confirm that the problem still excists. The filament start gcode is not picked up the first time. So, when printing in 1 color, no start gcode is found in the print gcode. When printing with multiple colors, the start gcode from the first color is missing. This is a bug that exists more than a year, so can this been looked at?","textCn":"看起来，在耗材配置的“起始 gcode”部分输入的命令，没有被正确加载进 gcode。 我只能在整个 gcode 文件的末尾以注释形式找到它们。 我在 1574 版本上确认有同样的问题 我用的是 creality print V7.1.0.4414，可以确认这个问题仍然存在。耗材起始 gcode 第一次不会被读取。所以单色打印时，打印 gcode 里找不到任何起始 gcode。多色打印时，第一个颜色的起始 gcode 缺失。这个 bug 存在一年多了，能不能看一下？","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-dont-loading-filament-start-gcode/29724","productLine":"print","version":"6","versionRaw":"6","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":98,"likeCount":1,"sourceType":"论坛"},{"uid":"373a30558de8651b","date":"2025-01-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print V 6.0.2.1574 - Filament Start G-Code not inserted into G-Code file!","titleCn":"Creality Print V 6.0.2.1574 - 耗材起始 G-Code 没有被插入 G-Code 文件！","originalText":"Creality Print V 6.0.2.1574 - Filament Start G-Code not inserted into G-Code file!","textCn":"Creality Print V 6.0.2.1574 - 耗材起始 G-Code 没有被插入 G-Code 文件！","truncated":false,"url":"https://forum.creality.com/t/creality-print-v-6-0-2-1574-filament-start-g-code-not-inserted-into-g-code-file/29115","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":452,"likeCount":3,"sourceType":"论坛"},{"uid":"1a8663ea5465c64f","date":"2025-01-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Use of subdirectories on printer with creality print","titleCn":"在打印机上配合 creality print 使用子目录","originalText":"Hello,\nI’m missing a key feature in creality print, the use of subdirectories to keep track of where to find your prints without having to scroll through and endless list of files…\nI know that If I root my K1-Max and use Fluidd, I will be able to create subdirectories and put my file there. Easy to find when I want to print them again.\nWhy is Creality Print not able to create subdirectories and put my files there? Now I have to “export” them and upload them while using Fluidd… I know the printer is able to recognize subdirectories and print the files that are in these subdirectories.\nNo comments in over a year…","textCn":"你好，我觉得 creality print 缺少一个关键功能，就是使用子目录来记录打印文件在哪里，而不必在无穷无尽的文件列表里滚动……我知道如果我给 K1-Max 做 root 并使用 Fluidd，就能创建子目录并把文件放进去。想再次打印时很容易找到。为什么 Creality Print 不能创建子目录并把我的文件放进去？现在我得把它们「导出」，然后在用 Fluidd 时上传……我知道打印机能够识别子目录并打印这些子目录中的文件。一年多都没有人评论……","truncated":false,"url":"https://forum.creality.com/t/use-of-subdirectories-on-printer-with-creality-print/29124","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"K1","grade":"有效","replyCount":2,"views":45,"likeCount":0,"sourceType":"论坛"},{"uid":"9e59ebb629db79cd","date":"2025-01-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Scan: Feature Request RGB Color Output","titleCn":"Creality Scan：功能请求 输出 RGB 颜色","originalText":"As a user of the Creality Raptor, I want the ability to export the raw RGB camera feed as a video/image set from a scan so that I can manually retexture areas with artifacts and explore new texturing methods (e.g., Gaussian Splatting , Gaussian Sugar ).\nContext / Rationale\nThe built-in texturing system is convenient and often works well, but sometimes artifacts appear, or the texture quality is lower than the mesh quality.\nExporting the raw RGB video would let users retexture problem areas directly.\nDevelopers could also leverage this data to create advanced texturing methods.\nCurrently, retexturing requires a separate camera, but direct access to the scanner’s RGB feed would speed up the process significantly.\nProposed Enhancements\nVideo Export of Raw RGB Feed\nProvide an option to export the camera’s raw RGB feed as a video during or after scanning.\nCOLMAP-Type File Generation\nGenerate a COLMAP or similar format file that contains frame positions, using the scanner’s known camera positions. This would simplify retexturing and 3D reconstruction in external tools. …","textCn":"作为 Creality Raptor 的用户，我希望能够从一次扫描中把原始 RGB 摄像头画面导出为视频/图像集，这样我就能手动对有瑕疵的区域重新贴图，并探索新的贴图方法（例如 Gaussian Splatting、Gaussian Sugar）。 背景/理由 内置的贴图系统很方便，而且通常效果不错，但有时会出现瑕疵，或者贴图质量低于网格质量。 导出原始 RGB 视频可以让用户直接对问题区域重新贴图。 开发者也可以利用这些数据来创建高级的贴图方法。 目前重新贴图需要单独的相机，但直接访问扫描仪的 RGB 画面会大大加快这个过程。 建议的增强功能 原始 RGB 画面的视频导出 提供一个选项，在扫描过程中或扫描之后把相机的原始 RGB 画面导出为视频。 生成 COLMAP 类型文件 生成一个包含帧位置的 COLMAP 或类似格式的文件，使用扫描仪已知的相机位置。这会简化在外部工具中重新贴图和 3D 重建。……","truncated":true,"url":"https://forum.creality.com/t/creality-scan-feature-request-rgb-color-output/28928","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":166,"likeCount":1,"sourceType":"论坛"},{"uid":"9b2483f2592b2771","date":"2025-01-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"[Creality Print V6] The current printer does not match the preset settings of the selected printer","titleCn":"[Creality Print V6] 当前打印机与所选打印机的预设设置不匹配","originalText":"Hello\nWith Creality Print V6, after slicing, when sending the print to my Ender V3, I sometimes get the following orange warning message:\n*The current printer does not match the preset settings of
