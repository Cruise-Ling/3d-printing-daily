-working-7-x/52790","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":7,"views":87,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9408b7d7c26a8b1e","topicId":52803,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-02","lastActive":"2026-08-06","title":"It would be nice to set a display name for a printer","originalText":"I found I have more ideas than bandwidth to print them, so I bought a second printer. The model is the same as my first printer. I would like to assign them display names in creality print rather than having to remember the ip address. Just an idea for the future. I’m not certain there is much demand for this, but I would like it.\n\nYou already can. Click the pencil icon next to the printer name in the devices list and rename it.\n\n image 1022×556 76.4 KB\n\nLove the firefly names of your printers!","url":"https://forum.creality.com/t/it-would-be-nice-to-set-a-display-name-for-a-printer/52803","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":9,"views":73,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"ad0506793c1edf8b","topicId":52806,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-02","lastActive":"2026-08-03","title":"Software installation error","originalText":"hi i tried to install creality scanner software on my surface it wont install and shows me this error\n\nthis is my system info:\n\n Processor Snapdragon(R) X 12-core X1E80100 @ 3.40 GHz (3.42 GHz)\n\nInstalled RAM 16.0 GB (15.6 GB usable)\n\n Screenshot 2026-08-02 144410 818×332 12.3 KB \n\n System type 64-bit operating system, ARM-based processor\n\n… it seems that the software is not compatible with Windows for ARM-processor…","url":"https://forum.creality.com/t/software-installation-error/52806","productLine":"print","version":"12.3","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":52,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f8c421d413c39847","topicId":52788,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-01","lastActive":"2026-08-11","title":"Blocking supportsin hidden areas","originalText":"I’m on Creality Print 7.2 and I have a model that needs supports, but I need to block area where I don’t want supports. The problem is that I can’t see it to block it. How can I block supports to an interior area?\n\n2 ways:\n\n \n \n Use paint on supports to just put them where you want them. You can right click to paint with red that blocks supports in that area too. Make sure you choose (manual) from the support type drop down.\n\n \n \n Use a support blocker. Select the model, right click on it, add support blocker. Move and resize the blocker where you need it. Using this one, leave it on (auto) from the support type so it will generate supports everywhere else. This way is better if you have a large area you want to not have supports.\n\nThe problem is that I can’t see the support area to paint over inside the figure no matter how I rotate it. it’s blocked from vision.. Is there a way to temporarily split the object so I can see the area I want to paint?","url":"https://forum.creality.com/t/blocking-supportsin-hidden-areas/52788","productLine":"print","version":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":66,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"6d0d3adf4c020680","topicId":52787,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-08-01","lastActive":"2026-08-01","title":"Creality print 7.205226 bug with device select (multiple printers online)","originalText":"The printers show up in the ‘home’ bar under device.\n\n When I select the printer in position 2 and click Prepare, I loose my data that was set for that printer.\n\n The previous CrealityPrint did not do this.\n\n Dan Sokol","url":"https://forum.creality.com/t/creality-print-7-205226-bug-with-device-select-multiple-printers-online/52787","productLine":"print","version":"7","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":26,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4fd4657de02e9c65","topicId":52755,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-31","lastActive":"2026-08-01","title":"my filament of any kind is loading up on the nozzle and it isn't printing smoothly why? is anyone else having problems since the update","originalText":"Either the filament is loading up through and around the nozzle or it has terrible print quality\n\nWhich printer, what type of filament and what settings do you use?\n\n And are you sure what you try to print is placed on the bed and not hoovering?","url":"https://forum.creality.com/t/my-filament-of-any-kind-is-loading-up-on-the-nozzle-and-it-isnt-printing-smoothly-why-is-anyone-else-having-problems-since-the-update/52755","productLine":"print","version":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":2,"views":33,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"06f636db837251d0","topicId":52759,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-31","lastActive":"2026-07-31","title":"3D Printer Files | 3MF File | Box Storage - 90x150x50 | Creality Cloud","originalText":"I saw this container and instantly thought, it has to be done in two colors. So happy with this result.\n\n All credit to OfficineCasperLAB\n\n cmp \n\n crealitymaker \n\n \n \n \n\n 3D Printer Files | 3MF File | Box Storage - 90x150x50 | Creality Cloud \n \n\n \n \n\n 3D Printer Files | 3MF File | Box Storage - 90x150x50 | Creality Cloud \n\n 📦 Object Storage Box 90x150x50 - Practical and Compact Organization 🛠️ This object storage box measuring 90x150x50 mm is the ideal solution for keeping small components, small parts, desk accessories or maker tools in order. The simple and...\n\n \n\n \n \n \n \n\n \n \n\n IMG_20260731_043812 1920×1920 300 KB \n\n {\"src\":\"https://forum.creality.com/uploads/default/original/3X/b/b/bbedadd7636682d14c8a3f1f7677ae0222e0a651.3mf\",\"poster\":\"https://forum.creality.com/uploads/default/original/3X/7/5/75194f61eb7dd0d877af20921b7979b100d35fa4.jpeg\"}","url":"https://forum.creality.com/t/3d-printer-files-3mf-file-box-storage-90x150x50-creality-cloud/52759","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":113,"likeCount":1,"tags":["crealityprint","k2plus"],"relReason":"tag","sourceType":"用户"},{"uid":"b0d829a71652cb89","topicId":52665,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-26","lastActive":"2026-07-26","title":"What Do You Use to Organize Your 3D Print Files?","originalText":"I’ve collected a lot of STL and other 3D printing files over the years, and I’m looking for a better way to organize, search, and preview them.\n\n Currently, I use Windows File Explorer with the Microsoft PowerToys add-on to display STL thumbnails. It kind of works, but it’s a little slow. I’m wondering what other systems or programs you guys are using, whether free or paid.\n\n A few I’ve read about include:\n\n \n Manyfold \n F3D \n Papa’s Best STL Thumbnails \n STL Library \n \n What do you use to manage your 3D print file collection? I’d especially like something that can quickly display previews and organize files using folders, tags, categories, or searchable descriptions.\n\n Please share what you use, what you like or dislike about it, and whether you think it is worth the cost if it’s not free.\n\n Thanks for any ideas…\n\nGreat topic!\n\n I see these as two different solutions. Fortunately, I was able to preserve an existing installation of the now-discontinued 3D Builder, along with the working File Explorer thumbnail support on that machine. Microsoft ended support for 3D Builder and removed it from the Microsoft Store in July 2024. Existing installations may continue to work, but it can no longer be installed normally through the Store.\n\n There are community installation workarounds on GitHub, but the one I found would not work on my company-managed Windows 11 system. Whether Windows 11 itself blocked it or our corporate security policies were responsible, I cannot say.\n\n I see the second issue as folder organization. Claude Desktop can do this very well if you enable filesystem access and grant it permission to the relevant folders. Some people may reasonably object to providing that access, but its scope can be limited to a specific folder tree, such as the 3D Objects folder. It can then examine the filenames and move the files into appropriate subfolders. It did a remarkable job for organizing many of my folders. It even thought of naming structures I likely would have missed.","url":"https://forum.creality.com/t/what-do-you-use-to-organize-your-3d-print-files/52665","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":97,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"500ac0811ed57e6e","topicId":52668,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-26","lastActive":"2026-10-11","title":"[SOLVED] K1C Firmware 1.3.5.22 - Internal Camera Working Again in Mainsail/Fluidd","originalText":"After spending several hours troubleshooting this together with ChatGPT, I finally found a solution that works on my K1C running firmware 1.3.5.22 with the new camera hardware .\n\n I hope this saves someone else a lot of time.\n\n Symptoms\n\n After updating to 1.3.5.22 :\n\n \n \n Camera still works in Creality Print \n\n \n \n AI detection still works\n\n \n \n Camera disappears from Mainsail/Fluidd \n\n \n \n Camera Settings Control cannot be installed (“not compatible with the new hardware version”)\n\n \n \n /webcam/?action=stream no longer works\n\n \n \n No mjpg_streamer service is running\n\n \n \n What I found \n The firmware no longer streams directly from the UVC device.\n\n Instead, Creality uses:\n\n cam_app\n \n which writes camera frames into shared memory:\n\n /dev/shm/camera_main\n \n The existing input_uvc.so method is no longer usable.\n\n Trying to start MJPG Streamer with input_uvc.so results in:\n\n undefined symbol: parse_resolution_opt\n \n The correct plugin is actually:\n\n input_memfd.so\n \n Why this works : \n Based on the behavior observed during troubleshooting, the firmware update appears to have changed the camera pipeline rather than simply blocking MJPEG access.\n\n The camera is now managed by cam_app , which feeds WebRTC and the AI services while exposing the image through a shared memory buffer ( /dev/shm/camera_main ).\n\n The legacy input_uvc.so plugin no longer works on this firmware (it fails with undefined symbol: parse_resolution_opt ), but input_memfd.so is still present and successfully reads the shared-memory frames produced by cam_app .\n\n This patch does not access the camera device directly ( /dev/video* ) and does not replace Creality’s camera pipeline. It simply starts mjpg_streamer using input_memfd.so , exposing the existing shared-memory stream as MJPEG for Mainsail/Fluidd.\n\n During testing, Creality Print, WebRTC and AI-related processes ( cam_app , cx_ai_middleware , webrtc , webrtc_local ) all continued running normally.\n\n First test \n Before modifying anything, I tested this manually:\n\n /usr/bin/mjpg_streamer \\\n-i \"/usr/lib/mjpg-streamer/input_memfd.so -t 0\" \\\n-o \"/usr/lib/mjpg-streamer/output_http.so -p 8080\"\n \n Immediately afterwards:\n\n \n \n port 8080 opened\n\n \n \n Mainsail camera started working\n\n \n \n Creality Print continued working\n\n \n \n AI functions continued working\n\n \n \n So the solution was confirmed.\n\n Permanent fix \n My firmware did not contain the /etc/init.d/S50usb_camera script mentioned by another user.\n\n Instead, I created a new startup service:\n\n /etc/init.d/S59mjpg_streamer\n \n with this content:\n\n #!/bin/sh\n\ncase \"$1\" in\nstart)\n i=0\n while [ ! -e /dev/shm/camera_main ] && [ $i -lt 30 ]; do\n sleep 1\n i=$((i+1))\n done\n\n pidof mjpg_streamer >/dev/null && exit 0\n\n /usr/bin/mjpg_streamer \\\n -b \\\n -i \"/usr/lib/mjpg-streamer/input_memfd.so -t 0\" \\\n -o \"/usr/lib/mjpg-streamer/output_http.so -p 8080\"\n ;;\n\nstop)\n killall -q mjpg_streamer\n ;;\n\nrestart)\n $0 stop\n sleep 1\n $0 start\n ;;\n\n*)\n echo \"Usage: $0 {start|stop|restart}\"\n exit 1\n ;;\nesac\n\nexit 0\n \n Then:\n\n chmod +x /etc/init.d/S59mjpg_streamer\n \n Since rcS automatically executes every executable S??* script inside /etc/init.d , the service starts automatically on every boot.\n\n Result \n After reboot:\n\n Camera works in Mainsail\n\n Camera still works in Creality Print\n\n AI features still appear to work\n\n WebRTC is still running\n\n CPU usage increased by only around 2% \n\n No other changes were required.\n\n Backup \n Since firmware updates may overwrite /etc/init.d , I also saved a copy:\n\n cp /etc/init.d/S59mjpg_streamer /usr/data/S59mjpg_streamer\n \n Restoring after a firmware update is simply:\n\n cp /usr/data/S59mjpg_streamer /etc/init.d/\nchmod +x /etc/init.d/S59mjpg_streamer\n \n Credits \n This solution was developed after a long troubleshooting session with ChatGPT. The investigation combined community reports, testing on the printer itself, and analysis of the firmware behavior. The key discovery was that the new camera hardware no longer uses input_uvc.so ; instead, it exposes frames through cam_app and input_memfd.so , allowing MJPG Streamer to publish the existing video stream without interfering with Creality Print or the AI pipeline.\n\nThx for sharing this!\n\nVery nice ! Thanks for sharing","url":"https://forum.creality.com/t/solved-k1c-firmware-1-3-5-22-internal-camera-working-again-in-mainsail-fluidd/52668","productLine":"firmware","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":22,"views":5727,"likeCount":21,"tags":["general-discussions","trouble-shooting","k1c","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"e96fac401324a282","topicId":52651,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-25","lastActive":"2026-07-27","title":"How to select filament to use from CFS???","originalText":"I want to believe this is easy but I cannot figure out how to select a filament in the CFS to print. I have four (4) filaments loaded and regardless of what I do it only wants to use the filament in Position 1. I want to use Position 4. HELP!!\n\n Also, Positions 3 and 4 contain the same filament. When I try to map them to auto select if one runs out, I get a notification saying it can’t map them to auto. I’ve checked and their settings are identical. Any ideas? They are generic ABS filaments, not Creality brand.\n\n Thanks for any help!\n\n John\n\nScreenshot 2026-07-26 143457 706×718 39 KB \n\n Where are you getting the notification about the inability to map to auto select?\n\n On the printer or in your Creality Print software?\n\n Take a screenshot and post it here so we can help you.\n\nThanks. Was able to finally select the correct filament to print! They could have documented that somewhere!\n\n Following are the pictures. These two MatterHacker reels have no RFID as far as I know.\n\n 20260726_132550 1920×1440 200 KB \n\n 20260726_132019 1920×1440 192 KB \n\n 20260726_132044 1920×1440 260 KB","url":"https://forum.creality.com/t/how-to-select-filament-to-use-from-cfs/52651","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":163,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b0a5772eb994734f","topicId":52639,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-25","lastActive":"2026-07-25","title":"creality print 7.2 so log","originalText":"after update with 7.2 everything is fine. But now it suddenly log. i cant create projects. it take so much time to move or do the thing\n\ncheck your pc and make sure you are not low on disk space. If your windows drive is full, it will cause issues.","url":"https://forum.creality.com/t/creality-print-7-2-so-log/52639","productLine":"print","version":"7.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":48,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"40aa78307695a18d","topicId":52575,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-21","lastActive":"2026-07-21","title":"Is there a good tutorial on how to do simple booleans (remove intersection of 2 parts) in Creality 7?","originalText":"the title says it all….\n\n any links or other help gratefully accepted….\n\n LJ\n\nSince what constitutes a “good tutorial” is subjective, let me suggest another approach.\n\n I would not spend much time looking for a tutorial specifically for Creality Print. Its interfaces and workflows are substantially similar to those of OrcaSlicer and Bambu Studio, so most Boolean-function tutorials for either program should transfer readily to Creality Print.\n\n Creality Print 7.0 was forked from OrcaSlicer, which was forked from Bambu Studio, which was based on PrusaSlicer. By comparison, Creality Print is relatively new in an otherwise mature slicer market.\n\n Speaking as an early adopter of both Bambu Studio and OrcaSlicer, I consider Creality Print a poor fork. Rather than improving the established interface, Creality appears to have rearranged and altered it largely for the sake of making the program look different. The result is less intuitive without offering much meaningful innovation in return.\n\n Very little in this corner of the 3D-printing world is developed in complete isolation. Most slicers combine features and ideas that originated in other projects. In that respect, the OrcaSlicer project, led by SoftFever, has distinguished itself. It took Bambu Studio and expanded it by restoring some PrusaSlicer functionality that Bambu Studio had omitted, while also incorporating ideas and features inspired by Cura and SuperSlicer.\n\n OrcaSlicer is developed by and for the 3D-printing community, and its documentation and tutorials are generally more useful than those available for Creality Print.\n\n Here is a YouTube search that returns several Boolean-function tutorials. Find the presenter whose explanation and teaching style work best for you:\n\n https://www.youtube.com/results?search_query=boolean+tutorial+slicer","url":"https://forum.creality.com/t/is-there-a-good-tutorial-on-how-to-do-simple-booleans-remove-intersection-of-2-parts-in-creality-7/52575","productLine":"thirdparty","version":"7.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":113,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9d90b40aea7ff82b","topicId":52532,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-19","lastActive":"2026-07-21","title":"Web editor never loads — the create-model / editType=editModel route renders blank, embedded or standalone","originalText":"Web editor never loads — the create-model / editType=editModel route renders blank, embedded or standalone \n Summary: Clicking Edit on any of my models navigates to the edit URL, renders the page shell, and then leaves the entire main content area blank. The editor component never mounts. The mobile app edits the same models without any problem.\n\n This is not a caching or environment issue on my end — I’ve isolated it fairly thoroughly (details below). It looks like a client-side regression in the web app.\n\n \n Environment \n \n \n \n \n \n \n \n \n \n \n Account \n MakerX (ID 3092010586) \n \n \n URL pattern \n crealitycloud.com/user/3092010586/create-model?groupId=<id>&editType=editModel \n \n \n Affected \n Chrome + Edge on Windows 11 (home desktop), Chrome on a separate work computer, Chrome on Android \n \n \n Working \n Creality Cloud mobile app — edits succeed normally \n \n \n First noticed \n Friday 17 July 2026 (work computer); re-confirmed 19 July 2026 on two further devices \n \n \n Support ticket \n #20260720893877 \n \n \n \n Prior contact \n I first hit this on Friday 17 July on my work computer and raised it through Creality support chat. I was advised to try a different computer. I did exactly that on 19 July , on two further devices and two further networks, and the failure is identical in every case. This report is the result of that follow-up testing.\n\n Creality support chat has logged this as ticket #20260720893877 .\n\n What I ruled out \n \n Cleared cache and cookies in both browsers \n Chrome incognito (no extensions) \n Full PC reboot \n Three separate machines — home desktop, work computer, and an Android phone — across two operating systems \n Three separate networks — work network, home Wi-Fi, and cellular with Wi-Fi disabled (different IP, ISP and DNS in each case) \n Both dark and light theme \n Multiple different models — fails on all of them \n \n Same result every time in the browser; the app always works. That points at the web client rather than my environment, my account, or the model data.\n\n Symptoms \n The page navigates correctly and the shell renders fine — top nav, profile sidebar, stats, and the Home / 3D Model / Favorites Folder / Print Files / Prints & Score / Community tab row are all present and correct. The session is clearly authenticated, since profile data loads.\n\n The entire main content region below that stays empty. The editor never appears.\n\n Console \n Two lines repeat continuously and indefinitely, at high speed, from bundle 0fe0128….js:1 :\n\n JYF-handleIframeMessage MessageEvent {isTrusted: true, data: {…},\n origin: 'https://www.crealitycloud.com', lastEventId: '', source: Window, …}\npostMessageTheme dark https://www.crealitycloud.com\n \n In light mode the second line becomes postMessageTheme light — otherwise identical. The loop does not terminate; it continues for as long as the tab is left open.\n\n Network \n No request fails. I filtered with -status-code:200 across the All request type and got no 4xx, no 5xx, and no failed document request. The only non-200 rows are Google Analytics / GTM beacons returning 204 (which is normal for beacons) plus a handful of cancelled beacons.\n\n However, the total request count climbs continuously on a completely idle page:\n\n 189 → 642 → 1091 → 1540 → 2438 …\n \n Those are overwhelmingly collect?v=2&tid=G-G7YED6183T , 315437176?gtm=… , and rum calls — i.e. each iteration of the message loop is firing another analytics beacon. An idle stuck tab generates thousands of requests.\n\n DOM \n The only <iframe> in the document is height=\"1\" width=\"1\" with visibility: hidden — a tracking pixel, not the editor. There is no editor iframe present.\n\n Inspecting the blank region resolves to <body> itself, not to an empty or collapsed editor container. <div id=\"__nuxt\"> is present and the _nuxt/*.js bundles all load successfully.\n\n So the editor component is not rendering empty — it never mounts in the first place. \n\n The editor is an embedded FlowPrint page \n The Google Analytics beacons fired from the stuck page carry a dl (document location) parameter identifying what the embedded frame believes it is. Decoded:\n\n https://www.crealitycloud.com/flowprint/iframe-embedded-page/user/3092010586/model?cre-theme=light\n \n Three things follow:\n\n \n The editor is served as a separate embedded application under /flowprint/iframe-embedded-page/ , not as part of the main Nuxt app. \n The accompanying dt (document title) parameter is empty — consistent with a page that initialises far enough to fire analytics but never renders. \n The theme is passed twice : once as the cre-theme query parameter on that URL, and again over postMessage via postMessageTheme . That duplication is a plausible origin for the loop. \n \n Requests for main.js in this context also return 302 redirects.\n\n Minimal reproduction: the failure is in the create-model route itself \n Loading these FlowPrint URLs directly in their own tab, with no iframe involved , isolates the fault to a single route:\n\n \n \n \n \n URL \n Result \n \n \n \n \n /flowprint/iframe-embedded-page/user/3092010586/model?cre-theme=light \n Renders correctly. Complete model grid — all folders, all model cards, view/download/like counts, print-configuration links. Fast, no errors. \n \n \n /flowprint/iframe-embedded-page/user/3092010586/create-model?groupId=<id>&editType=editModel&cre-theme=light \n Blank. Renders the FlowPrint shell — profile sidebar, stats, and the Models / Print Settings tab row — then leaves the content area completely empty. Identical to the failure seen inside the iframe. \n \n \n /flowprint/user/3092010586/create-model?groupId=<id>&editType=editModel \n 404 (incorrect path — listed only for completeness). \n \n \n \n This is the key finding. The model route renders correctly and the create-model route renders blank, and both behave the same way whether or not they are embedded. The fault is therefore not in the embedding layer, not in authentication, and not in the model data — it is in the create-model route itself.\n\n The second URL above should be a complete, self-contained reproduction.\n\n Where I think it’s going wrong \n The theme-sync handshake looks like it has no loop guard. handleIframeMessage appears to respond to an incoming message event by calling postMessageTheme , which posts back to the same origin, which re-triggers handleIframeMessage , and so on without a terminating condition or an origin/source check to distinguish its own echo from a genuine inbound message.\n\n Since the loop occurs identically in both themes, the theme value isn’t the trigger — the handshake itself is.\n\n Because the create-model route fails identically whether embedded or loaded standalone, while its sibling model route works in both cases, the defect is in that route’s own rendering path. The page initialises far enough to draw the FlowPrint shell and fire analytics, but the view itself never mounts and the document title is never set.\n\n The looping postMessage handshake is described above because it is clearly abnormal and worth fixing on its own account — a single idle tab issuing thousands of requests is a real problem. But it is most likely a second symptom rather than the cause, since the standalone reproduction needs no parent frame to fail.\n\n Worth noting: this may only reproduce on the editType=editModel path, since the rest of the site behaves normally in the same session.\n\n Questions \n \n Is this a known regression? It was already failing on 17 July 2026 , and my last successful web edit was a few weeks before that, so it landed somewhere in that window. \n Is anyone else seeing a blank editor on editType=editModel ? \n Is there a supported workaround besides the mobile app? \n Does the standalone create-model URL above render blank for you as well? \n \n Happy to supply a HAR file, full console export, or test any build you’d like.\n\nResolved by Creality on Monday 20 July; the edit flow now uses a create-model-new route","url":"https://forum.creality.com/t/web-editor-never-loads-the-create-model-edittype-editmodel-route-renders-blank-embedded-or-standalone/52532","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":24,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"bb555d0e604eb5e5","topicId":52527,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-19","lastActive":"2026-07-19","title":"Feature Request: Part Cooling Fan Pre‑Start for Overhangs & Bridges","originalText":"Feature Request: Add Part Cooling Fan Pre‑Start\n\n Creality Print needs a cooling option that lets the part cooling fan turn on before an overhang or bridge begins. Right now, the fan only activates at the moment the overhang starts, which causes curling or sagging on the first few millimeters.\n\n Other brands already support this behavior, and it makes a noticeable difference.\n\n Please add: “Fan pre‑start distance” (mm) and or “Fan pre‑start time” (s)\n\n This would greatly improve PETG and TPU print quality.","url":"https://forum.creality.com/t/feature-request-part-cooling-fan-pre-start-for-overhangs-bridges/52527","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":20,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"62f6685d0650dfdc","topicId":52506,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-18","lastActive":"2026-07-18","title":"Linux branch of Creality Print not booting","originalText":"Hi,\n\n Looking for a bit of help and to raise awareness to the devs.\n\n I am having problems installing the current version of Creality Print. I am running Ubuntu 26.04 LTS and run a number of applications without problem. However the Linux appimage doesn’t even start to install it seams.\n\n My process:\n\nDownload file, give run permission, run (pretty straight forward)\n\nOutcome:\n\nNothing happens.\n\n I have done the same in command prompt with similar outcomes. With the exception being that it registrars the file for permission change but when I attempt to run it, same directory and file name, it spits back a “file not found” error.\n\nHave you tried running it with Gear Lever?","url":"https://forum.creality.com/t/linux-branch-of-creality-print-not-booting/52506","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":65,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"00295af30ab1665e","topicId":52455,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-15","lastActive":"2026-07-16","title":"Bed Temperature taken from wrong filament setting","originalText":"Setup: K2 Plus with 2 CFS, printing with ASA and an Epoxy Resin Plate, Creality Print V 7.2.0.5225\n\n The filament is set up to use a bed temperature of 90° degreeC with this build plate, the correct build plate is chosens and the edited filament is selected in the cfs settings (Slot 6).\n\n But since the newest software version the print starts with the wrong bed temperatur (40°C), which can also be seen in the G-Code preview.\n\n Strange behavior: When i edit the filament settings for slot 1 (PLA, which by default has a bed temperature of 40°C for the Epoxy resin plate) to use 90°C for this bed type, the slicer choses this (correct) temperature for my filament in slot 6.\n\n This behavior is definitly new and was not present in 7.0.x of Creality Print\n\nbean\n\n you need to edit the filament settings. Select the filament you want to use, click the pen on the right side. then scroll down to the expoxy plate and change both temps from 40 to 90. you can save it as a profile or just make the changes and it will apply to the active print. if you save it you can use it later for other prints. see pictures below.\n\n Screenshot 2026-07-15 132434_edited 1920×1200 391 KB \n\n Screenshot 2026-07-15 132246_edited 1920×1200 164 KB \n\n hope this helps\n\n MAC486\n\nThanks, that’s how it should work, and i am aware of those settings. But as stated, in this slicer version and with my setup with two CFS, the temperature for the bed is taken from somewhere else.\n\n The default temperature for the Epoxy Resin Plate inside the ASA Material is 0°C, so by default it throws an error when setting up a print. But i already had this value set to the intended 90°C, and the slicer still takes 40°C for the bed. Nozzle temperatures and fan-settings are fine.","url":"https://forum.creality.com/t/bed-temperature-taken-from-wrong-filament-setting/52455","productLine":"print","version":"7.2","problemType":"ui","model":"K2 Plus","grade":"有效","replyCount":4,"views":61,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"c5f06a906a55154d","topicId":52428,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-14","lastActive":"2026-07-15","title":"Default Creality Slicer Jerk Values are wrong?","originalText":"Hi There, i have a Ender 3 V3 SE and i use the Creality Slicer. I use all the default settings from the slicer, as it is from the same organization as the printer i assume they have all setup best than i can.\n\n When i use the 0.20mm profile, nothing is wrong, but every time i try to change to the 0.16mm or the 0.12mm profiles i got this message:\n\n image 440×111 7.89 KB \n\n Yes the warning is cropped and show no scrollbar.\n\n Beside that i found it odd that the values change itself when changing profile, see:\n\n 0.20mm\n\n image 762×562 20.8 KB \n\n 0.16mm and 0.12mm are the same\n\n image 491×576 18.8 KB \n\n image 718×569 20.9 KB \n\n 0.12mm\n\nCompare the “Top Surface” value… it is set to 8 in the 0.20 profile that works, in all other profiles this is set to 20… change it and hope for the best \n\n It’s not strange that settings change when loading other profiles, the settings are saved in the profile!\n\nI mean it is strange that the value change to one that is not allowed","url":"https://forum.creality.com/t/default-creality-slicer-jerk-values-are-wrong/52428","productLine":"print","version":"7.89","problemType":"slice","model":"Ender-3 V3 SE","grade":"有效","replyCount":4,"views":102,"likeCount":0,"tags":["trouble-shooting","ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"4a74b42dfc4a7087","topicId":52405,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-12","lastActive":"2026-07-13","title":"Creality Print 7.1 Theme","originalText":"I am new to Creality and 3D printing in general. I just wanted to come on here and say that I would like to see support for toggling from dark to light theme. I understand this was an option on the older versions but it now defaults to the system default. I like to have my system set to dark theme but prefer with most apps to have a lighter interface for more contrast. Since this is a port or OrcaSlicer, I don’t understand why the latest version of Orca supports a light theme and CrealityPrint does not. Simply don’t remove it from the original source on next update. Better yet, work with OrcaSlicer so their product can send files directly to Creality printers and don’t waste the effort of having a separate fork.\n\n… you can still “toggle” between dark or light mode of the screen… Press CTRL+P and unthick “Enable dark mode”…\n\nThank you so much! That was extremely helpful.","url":"https://forum.creality.com/t/creality-print-7-1-theme/52405","productLine":"thirdparty","version":"7.1","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":89,"likeCount":2,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"2d67ca823103c185","topicId":52390,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-10","lastActive":"2026-07-10","title":"Feature Request: Start Printing at a Set Time","originalText":"Feature Request: Start Printing at a Set Time \n\n I’d like to request a scheduling option in Creality Print that allows users to select a specific time for a print to begin.\n\n For example, I could prepare and send a job to the printer, then choose “Start printing at 2:00 am” rather than starting it immediately. (Obviously with an idiot disclaimer about clearing build plate..)\n\n This would be useful for people working around off-peak electricity rates, household noise, shared workspaces, or simply wanting a print to begin when they’ll be available to check the first few layers.\n\n Ideally, id liek Creality Print would confirm that the printer is online, ready and free from errors before the scheduled job begins. A simple countdown, cancellation button and notification before printing starts would also be helpful.\n\n If this feature already exist somewhere in the software then ignore and point me to it please\n\n If not, I think it would be a genuinely useful addition.","url":"https://forum.creality.com/t/feature-request-start-printing-at-a-set-time/52390","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":65,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"c6907c713febca53","topicId":52380,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-10","lastActive":"2026-07-10","title":"Problem with Cyrillic symbols in file names","originalText":"image 1920×1146 129 KB Cyrillic symbols are shown as “???” marks — in red ellipses.\n\nBut it’s OK in green ellipse — Cyrillic symbols as they should to be…\n\n Creality Print V7.2.0.5225.\n\n By the way, there is no such problem in Creality Print V6.2.","url":"https://forum.creality.com/t/problem-with-cyrillic-symbols-in-file-names/52380","productLine":"print","version":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":27,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e34142860f34a830","topicId":52357,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-08","lastActive":"2026-07-12","title":"Creality Print producing voids","originalText":"I am trying to understand how this is happening and then what to do about it. I’ve been using Creality Print v7 with my K2SE for about 7 months and haven’t had a problem. I’m trying to print this small car that has Print In Place bearings for wheels. When I slice it in Creality Print the rollers end up with several voids in them at random layers. I know it’s not the STL, I can change the layer thickness from .20 to .18 to .16 and the voids jump to different rollers in different layers. I’ve sliced the same STL in Cura and there are no voids in any layers. These voids are usually 2 layers and even get overhang printed above them so the slicer sees the voids that it created as a real void. As you can imagine, the rollers just fall apart with two missing layers at random locations.\n\n Some of the voids get applied to neighboring parts.\n\n image 838×543 79.1 KB \n\n I like the way Creality Print works and I want to figure this out. Cura works but it’s just not the same. I’ve attached two PDF’s with screen shots of a few layers from both slicers for comparison.\n\n Creality Print Voids.pdf (759.0 KB)\n\n Cura No Voids.pdf (552.4 KB)\n\n Don\n\nCompare ALL settings of both slicers…\n\nhave you tried ‘fix model’ ? and if that does nothing, i would just add some random form to the project, then save it, then open the saved project and see if the voids are still there.\n\nI have actually downloaded the ‘wheels STL’ and there is no such missing layers….but mine looks different than yours does.\n\nIt’s not the exact same STL? i downloaded it from the page you linked.\n\nThe one i downloaded has hexagonal holes in the rollers and one big in the very center.\n\nHow come both slicers on your side just ignore the hexagonal holes?\n\nThat design itself does not require 100% infill nor more than 5 walls, if fact i would do 0% infill combined it reduces the printing time from 4hrs8min to just under 3hrs (ABS for filament).\n\n image 1300×1228 170 KB","url":"https://forum.creality.com/t/creality-print-producing-voids/52357","productLine":"thirdparty","version":"7","problemType":"other","model":"未标注","grade":"有效","replyCount":5,"views":81,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"2c4cad4b1fba6e0d","topicId":52323,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-07","lastActive":"2026-07-07","title":"[BUG] Firmware v1.1.6.1 overrides PETG temperature to 250°C and fails to detect textured PEI build plate","originalText":"After the automatic firmware update from:\n\n CR0CN240110C10_R_202605081127_ota_img_V1.1.5.5.img\n\n to:\n\n CR0CN240110C10_R_202606230954_ota_img_V1.1.6.1.img\n\n my printer started behaving incorrectly.\n\n For some unknown reason, the printer now starts printing PETG at 250°C, even though the G-code was generated with a nozzle temperature of 240°C.\n\n I have already checked the OrcaSlicer settings and reviewed the G-code files. The temperature in the G-code is correct, so this appears to be a printer firmware bug.\n\n Another issue that started after the update is that, when I send files to print, the printer reports an error saying that it cannot detect my textured build plate.\n\n For reference, my original textured plate was replaced with a gold PEI build plate. However, the temperature bug is the most serious problem, because the printer is overriding the correct G-code temperature and printing PETG 10°C hotter than expected.\n\n I am seriously considering downgrading the firmware because of this issue.\n\n WhatsApp Image 2026-07-07 at 00.59.22 (1) 960×1280 78 KB \n\n WhatsApp Image 2026-07-07 at 00.59.22 960×1280 64 KB\n\nMany thanks for the update, I will be downgrading after my first v1.1.6.1 print currently underway. That and the new “diversity anti-diversion function” which brought home how invasive Creality print wants to or has become has me completely isolating the printer from the cloud and I will no longer be uploading anything there for fear of connecting to it and at some point having “them” brick my printer for me by accident or malicoiusly.\n\n… switch off automatic updates and stay with the version that works for you (newer firmware are not always better then the one you already have)…\n\n In case of some firmware upgrades there is no way back to a previous version…","url":"https://forum.creality.com/t/bug-firmware-v1-1-6-1-overrides-petg-temperature-to-250-c-and-fails-to-detect-textured-pei-build-plate/52323","productLine":"thirdparty","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":143,"likeCount":0,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"aae51e92ef0b73ed","topicId":52289,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-07-05","lastActive":"2026-07-06","title":"Low Consumables Balance Reminder","originalText":"depuis les dernières mises a jour , même avec 4 bobines neuve j’ai toujours ce message a chaque impression sur le cloud “ Low Consumables Balance Reminder \n\n The consumables in slot of model Creality Hi-xxxx ​​are insufficient. Please replenish them in time.\n\nvince97: \n \n depuis les dernières mises a jour , même avec 4 bobines neuve j’ai toujours ce message a chaque impression sur le cloud “ Low Consumables Balance Reminder \n\n \n \n I have been seeing these also. I am sure it is a marketing ploy to get us to buy filament…\n\nj’avais pas vu sa comme sa","url":"https://forum.creality.com/t/low-consumables-balance-reminder/52289","productLine":"print","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":3,"views":252,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d665d063c47a81c9","topicId":52282,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-04","lastActive":"2026-08-25","title":"mutiple colours on same level","originalText":"Hi, my first print on the new sparkxi7 was the sparkx keylabel in three different colours. A base in one colour, the word ‘spark’ in a second and the ‘x’ in a third colour. The last two have the same height on the base and I am wondering, with what settings in Creality Print I can achieve that on another model. Thanks in advance.\n\nIf the model already contains separate bodies for the base, “spark,” and the “X,” the process is straightforward. Import the model into Creality Print, then assign a different filament to each body before slicing. If the model is a single solid object, use the Color Painting feature instead. The Fill tool works well for isolated letters, while the Height Range tool is ideal when all raised text starts at the same layer, just like the SparkX key label. Creality’s official guide explains these painting tools and the complete workflow in detail: How to Create Multi-Color Prints with Color Painting in Creality Print . You can also find additional documentation in the Creality Wiki: Introduction to the Color Painting Feature . If you’re creating your own models, this Multi Color 3D Print project is a helpful reference because it demonstrates a pre-colored 3MF file with separate color regions, making filament assignment much easier before printing.\n\nThanks @alia_rifat Appreciate your helpful reply!","url":"https://forum.creality.com/t/mutiple-colours-on-same-level/52282","productLine":"print","version":"","problemType":"","model":"SPARKX i7","grade":"泛讨论","replyCount":5,"views":99,"likeCount":0,"tags":["sparkxi7"],"relReason":"category","sourceType":"用户"},{"uid":"b31221cea88231af","topicId":52286,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-04","lastActive":"2026-08-03","title":"Problem with Creality Print 7.2 filament profiles","originalText":"Just updated to version 7.2 fully aware that I might have to re import my filament profiles. Sure enough I lost all my profiles. I followed Crealitys process to restore everything, but they still aren’t showing up. The filament settings has a system and user tab now. I’m assuming the user tab should have all my profiles, but it’s completely blank. Has anyone else had this issue?\n\n image 1920×2560 700 KB\n\nTry looking in the folder C:\\Users\\[User]\\AppData\\Roaming\\Creality\\Creality Print\\7.0\\user\\default\\filament and import from there\n\nAnd how can I import?","url":"https://forum.creality.com/t/problem-with-creality-print-7-2-filament-profiles/52286","productLine":"print","version":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":211,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"659fe603b327bf07","topicId":52280,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-04","lastActive":"2026-07-04","title":"Creality Shop - Member Exclusive","originalText":"Anyone understand the logic of the “Member Exclusive” items in the Creality Shop where you can spend your earned points? The only items that are attainable and I feel are worth buying are the dryers and as soon as I get anywhere near the points they became member exclusive. It is not as if they are at a discounted rate, the point conversion is higher than the price you would pay in the shop.\n\n I cannot see that the benefits gained from premium membership are anywhere near worth the price anyway so I suppose I will save the annual fee and just buy the dryer.\n\n Paul","url":"https://forum.creality.com/t/creality-shop-member-exclusive/52280","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":40,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"38ff6ce93f5e334f","topicId":52272,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-04","lastActive":"2026-07-04","title":"Full Spectrum Color Mixing","originalText":"So, I have just tried the mixed filament option on my K1C. It works okay, but why can’t we mix four different colors and are only allowed to use three? Four color CFS or eight color and can only mix three. That is a waste of why we use the CFS system.\n\nHopefully Creality expands the feature in future versions.","url":"https://forum.creality.com/t/full-spectrum-color-mixing/52272","productLine":"print","version":"","problemType":"feature","model":"K1C","grade":"有效","replyCount":2,"views":118,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6fae66cea236cd26","topicId":52267,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-03","lastActive":"2026-07-15","title":"Start print big problem","originalText":"Hello,\n\n I have calibrated full K2 SE => succefull.\n\n I load my modele (same model, never problem before) , the printer begin to initialized, and in right corner, big problem, see video.\n\n defect \n\n Thank for help. regards\n\nwhat firware u had when this happend? creality launched a lot of firmware updates for that printer\n\nHi it is the last, but I find, my problem is in my stl generated by Tinker cad, Z negatif….","url":"https://forum.creality.com/t/start-print-big-problem/52267","productLine":"firmware","version":"","problemType":"other","model":"K2","grade":"有效","replyCount":6,"views":64,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b2ff268beeedd2e5","topicId":52248,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-02","lastActive":"2026-07-02","title":"Can't edit most Filament settings in Creality Print 7.1","originalText":"Good afternoon, I am trying to add a new filament preset for a non-creality PETG I bought. I have created a new preset from the Generic PETG using the “save as”, but even then I can’t edit settings like Model fan speeds. Max volumetric speed, flow ratio, bed temperature, and so on. Whenever I try clicking the boxes they just dont allow me to input text, almost like they are locked / grayed out.\n\n I have tried setting my user role to Professional, but even then I cant edit most settings.\n\n Am I missing something or is my program broken?","url":"https://forum.creality.com/t/cant-edit-most-filament-settings-in-creality-print-7-1/52248","productLine":"print","version":"7.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":61,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"5c3aa7efbd1607d1","topicId":52219,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-01","lastActive":"2026-09-19","title":"Creality Print 7.2 Issue","originalText":"Since updating from 7.1 to 7.2 now all my previous project files will not open. It say’s there is no geometry in the project file which is not the case as all the project files opened ok in 7.1\n\nI have not encountered this (yet). Is there anything about the files that do not open, or is it consistent across all files? I am assuming these are project files, yes?\n\nStrange behavior.\n\n I assume you have restarted your computer after installation?\n\n 7.2 has been working excellent for me.\n\nLet us know if you can resolve the issue.","url":"https://forum.creality.com/t/creality-print-7-2-issue/52219","productLine":"print","version":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":10,"views":662,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"21c2c06db0671b01","topicId":52215,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-01","lastActive":"2026-07-22","title":"Creality Print v7.2.0 Release","originalText":"We’re excited to announce the release of Creality Print v7.2.0 , bringing AI-powered workflows, enhanced multi-color printing, and improved slicing accuracy for a smarter and more reliable printing experience.\n\n What’s New \n AI Workflow (Beta) \n\n \n Introduced an AI-guided printing workflow for a more intuitive and user-friendly experience. \n AI now assists with model import, model validation, automatic repair, and intelligent filament mapping. \n Added AI-powered print risk analysis, pre-print inspection, parameter recommendations, and the AI Knowledge Assistant. \n \n Enhanced Multi-Color Printing \n\n \n Added Mixed Filaments , enabling the creation of new colors by stacking different filament layers. \n Added support for importing color OBJ files with automatic color clustering and intelligent filament mapping. \n Introduced Purge to Object Skeleton (Experimental) to intelligently reduce purge waste during multi-color printing. \n \n Smarter Slicing & Better Reliability \n\n \n Optimized print time estimation for single-color models, reducing estimation error to within 5% . \n Upgraded the support generation algorithm with the new Validate & Repair Supports feature for improved print reliability. \n Model Repair is now available on macOS and Linux , delivering a more consistent cross-platform experience. \n \n General Improvements \n\n \n Fixed multiple issues related to stability, AI features, slicing algorithms, and device compatibility. \n \n Release Notes: \n\n \n \n \n\n Creality Wiki \n \n\n \n \n\n Creality Print v7.2.0 Release Notes \n\n \n\n \n \n \n \n\n \n \n\n Share Your Feedback: \n\n \n \n\n gcmomk3i2c.feishu.cn \n \n\n \n \n\n ‎\n\ncela ne semble pas corriger le bug de la camera depuis l’installation du firmware HI V1.1.0.72 su les creality hi\n\nzero interest in the “AI” features that just bloat the software unnecessarily, you should consider doing two separate versions, a proper slicer and the “AI” one\n\n needless to say i will be sticking with older version","url":"https://forum.creality.com/t/creality-print-v7-2-0-release/52215","productLine":"firmware","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":12,"views":974,"likeCount":14,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e7f47284497f4c75","topicId":52221,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-07-01","lastActive":"2026-07-01","title":"OrcaSlicer 2.4.1 — K2 Pro CFS + Device Control Findings","originalText":"For anyone running OrcaSlicer 2.4.1 with a K2 Pro, here’s what I’ve found on connection methods and what actually works.\n\n The Setup That Works \n\n \n \n Host Type: CrealityPrint\n\n \n \n Printer Agent: CrealityPrint\n\n \n \n Hostname: 192.168.1.xx:4408 (your printer’s IP + port 4408)\n\n \n \n See screenshot below.\n\n What You Get \n\n \n \n Device control through OrcaSlicer — printer status, temps, print management — all functional\n\n \n \n CFS filament slots visible and manageable\n\n \n \n Prints send and run without issue\n\n \n \n What You Don’t Get \n\n \n Camera — the K2 Pro uses WebRTC architecture that OrcaSlicer cannot access regardless of connection method. This is a hardware/firmware limitation, not an OrcaSlicer issue. \n \n Background \n\n Prior to 2.4.x the only working OrcaSlicer path was Octo/Klipper at :4408, which gave device control but no CFS sync. The CrealityPrint host type added in 2.4.x adds CFS sync — and using :4408 in the hostname field is what restores device control alongside it.\n\n Camera remains the outstanding limitation. If anyone has found a workaround post below.\n\nI think you need to use Creality Print or the Creality web/mobile interface to view the camera. Creality Print - Creality Slicer Softwares Download\n\nTry http://printer ip_address:8000","url":"https://forum.creality.com/t/orcaslicer-2-4-1-k2-pro-cfs-device-control-findings/52221","productLine":"thirdparty","version":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":3,"views":488,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"03d6eab4df8a5b99","topicId":52208,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-30","lastActive":"2026-07-03","title":"Creality Print 7.2 PETG Temperature Bug Confirmed by Support","originalText":"Just a heads-up for anyone using Creality Print 7.2 with PETG, especially eSUN PETG.\n\n After updating from Creality Print 7.1 to 7.2, my PETG filament profiles were affected. The recommended nozzle temperature range still looked normal, but the actual first-layer and other-layer print temperatures were changed to 200°C. Because of this, the printer could not extrude PETG properly.\n\n On the Creality K2 Plus itself, the filament still showed eSUN PETG with the correct range of around 230°C to 260°C, so the issue seems to be with the slicer/software profile after the update.\n\n I contacted Creality support, and they confirmed that this is a bug in the latest software version. Their advice was to uninstall the current version and install an older version of Creality Print. They specifically suggested trying version 7.1.1.4472_Release while their software team works on the bug.\n\n For now, before printing PETG in Creality Print 7.2, double-check your filament profile and make sure the actual print temperature is correct, not just the displayed recommended range.\n\n Hope this helps someone avoid failed PETG prints.\n\nI was searching for any topic based on what I’ve witnessed recently and this is close. Printing Creality PETG-CF and after updating versions the prints start out correctly with a bed temp of 70C but after the first 3 layers are printed it sets the bed back to 50C. All settings are correct in the slicer and profile but I’m having to go set it back to the correct value manually once the infill starts, then it will stay for the rest of the print. Never had to do this until a few days ago.","url":"https://forum.creality.com/t/creality-print-7-2-petg-temperature-bug-confirmed-by-support/52208","productLine":"print","version":"7.2","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":257,"likeCount":4,"tags":["trouble-shooting","filament"],"relReason":"category","sourceType":"用户"},{"uid":"53756c42916fdbbf","topicId":52194,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-06-30","lastActive":"2026-07-01","title":"New Firmware For Creality HI V1.1.0.73","originalText":"Hi everyone, creality just realesed the new firmware for the printer creality hi, the firmware is:\n\nCR4NU200360C20_ota_img_V1.1.0.73.img\n\n Do you guys tried? anything to say?\n\nCamera initially took a very long time to start for me but is now working on Windows Creality Print 7.1.1.4472 with this new firmware v1.1.0.73.\n\n Camera also working in Windows Creality Print version 7.2.0.5225. Doing a 5 hr print to check the rest of the features.\n\nj’attend les retours , les bug du V1.1.0.72 m’on servi de leçon","url":"https://forum.creality.com/t/new-firmware-for-creality-hi-v1-1-0-73/52194","productLine":"firmware","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":3,"views":218,"likeCount":0,"tags":["general-discussions","trouble-shooting","firmware","creality-hi"],"relReason":"tag","sourceType":"用户"},{"uid":"053b31c50a30b2ae","topicId":52171,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-28","lastActive":"2026-07-01","title":"Creality print device grey screen","originalText":"Hi,\n\n I went to make a new print today. I sliced the file and went to print and it failed. I went to look at my device on the software and received a grey screen. Thought it may just be a software issue so uninstalled it and downloaded the same version again still the same. Did the same uninstalled and downloaded an older version and the same again I’m now thinking it’s to do with something on my laptop but haven’t a clue what could be causing it. Also to mention the online model tab is also giving me the same grey screen. My internet is working fine and I’ve checked the permissions and they’re all good. Any help would be much appreciated.\n\nHi\n\n I have just had the same issue, grey screen and printer not recognised even after I input the correct IP address. I was on 4.3.9 for the last 12 months no problems.\n\n I did not want to upgrade because I use a V3 SE with nebula pad mod.\n\n So last night I downloaded Creality Print 7.1, updated to latest version and loaded the printer with no problems.\n\n After getting to grips with settings etc. I printed with PETG and was very surprised to find a flawless first layer,\n\n with no stringing and the speed is MUCH faster than previous.\n\n Try fully uninstalling both versions of creality print and try again.\n\n I also wonder if this is a creality cloud issue that effects the software running correctly.\n\n Good luck\n\nI did all that and it still didn’t work.\n\n Funnily enough I left it overnight and it appears to have sorted itself out haha\n\n Thank you though","url":"https://forum.creality.com/t/creality-print-device-grey-screen/52171","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":91,"likeCount":0,"tags":["general-discussions","ender-3-v3-plus"],"relReason":"category","sourceType":"用户"},{"uid":"57378b65acddae9e","topicId":52140,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-26","lastActive":"2026-07-14","title":"Creality Print 7.0 Vase Mode","originalText":"Maybe I’ve gone brain dead, but for the life of me I can’t remember how to take the top layer off of all the vase models I have. Every vase I slice has a sealed top. It’s not infill because when looking at the slice, once I get past the top two layers, it’s an open vase. What has this 80 year old brain forgotten?\n\nI don’t remember doing anything of the kind when I select vase mode (on my K2).\n\n But, have you tried to select 0 top layers? Just to see if it changes anything.\n\nThat’s strange. Why do your vases have a sealed top? Can you be more specific or post a screenshot of the slicer setting and slice window (Windows 11 just press “print screen” and save it). What did you use to create the model? I’ve never had that issue in hundreds of vases printed.","url":"https://forum.creality.com/t/creality-print-7-0-vase-mode/52140","productLine":"print","version":"7.0","problemType":"","model":"K2","grade":"泛讨论","replyCount":6,"views":173,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9fa9e2a97946c125","topicId":52088,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-23","lastActive":"2026-06-23","title":"Bowser King of the Koopas","originalText":"Used fanforge to convert my photo of Bowser from his castle in Super Nintendo Land and printed it in Creality black PLA. Used Creality Print Al to optimise the settings. It came out awesome, my son is very impressed and wants one 10x bigger!\n\n \n \n \n\n 3D Printer Files | 3MF File | Bowser \n \n\n \n \n\n 3D Printer Files | 3MF File | Bowser \n\n Printed the Bowser from his castle in Super Nintendo Land. Used Creality Print AI to optimise the settings.\n\n \n\n \n \n \n \n\n \n \n\n IMG_6457 1920×2560 527 KB \n\n IMG_6387 1849×1133 299 KB \n\n IMG_4150 1920×1643 411 KB \n\n IMG_6461 1920×2560 620 KB \n\n IMG_6460 1920×2560 509 KB \n\n IMG_6459 1920×2560 397 KB \n\n IMG_6458 1920×2560 513 KB","url":"https://forum.creality.com/t/bowser-king-of-the-koopas/52088","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":24,"likeCount":0,"tags":["cmp","crealityprint","crealitymaker"],"relReason":"tag","sourceType":"用户"},{"uid":"ee56436b234280c5","topicId":52063,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-22","lastActive":"2026-07-02","title":"Creality Print 7.2 Beta","originalText":"I tested out the AI in the new Creality print 7.2 beta. I told it to find a Darth Vader model, which it did. I then told it to optimize the settings for the best surface finish possible from the K2 with a 0.4mm nozzle. I accepted the recommendations, mapped the filament, and crossed my fingers. I have to say i was very satisfied with the finished product! I will be more specific with the support settings in the future but the AI is definitely on the right track for ease of use and results.\n\n IMG_6401 1920×2560 241 KB \n\n IMG_6400 1920×2560 234 KB \n\n IMG_6447 1920×2560 331 KB \n\n IMG_6448 1920×2560 438 KB \n\n IMG_6449 1920×2560 444 KB \n\n IMG_6450 1920×2560 408 KB\n\nAre there any way to download and test beta versions? Are there a beta program?\n\nTIA\n\nIt’s in the discord group","url":"https://forum.creality.com/t/creality-print-7-2-beta/52063","productLine":"print","version":"7.2","problemType":"quality","model":"K2","grade":"有效","replyCount":11,"views":746,"likeCount":4,"tags":["beta","k2","crealityprint-7"],"relReason":"tag","sourceType":"用户"},{"uid":"8a1c2eec6f870782","topicId":52042,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-20","lastActive":"2026-06-23","title":"Issues with Creality Print","originalText":"I have 2 Ender 3 v3 SE and a Sonic Pad, everything is on current firmware. My system is an AMD with 64GB RAM and Win 11 Pro, again everything is up to date. I have tried sending file to the printers via USB and via WIFI, I have changed speeds and many other parameters, I replaced the y belt on one of the printers, I have attached 2 files that show the issues with the y axis (yes I checked all of the possible issues I could find and corrected them) . The arrow shows the front of the print bed. It looks like the Y axis loses its origin.\n\n I finally went to Orca Slicer and imported my settings from my current models. Files are now printing great, so I have to ask what is the issue? I am ready to sell and reinvest in a Bambu A1 combo. I would rather not spend the money if I didn’t have to. The the Creality Print really that bad?\n\n 0 1452×1089 90.3 KB \n\n 4901 1920×1440 155 KB\n\nInstead of connecting the printer via USB to your computer use a Rapbery Pie with octoprint… The USB-connection is not stable nor is Windows… I have used Raspbery Pie with octorint for many many years…\n\nTo answer directly: Yes, Creality Print can genuinely be that problematic. It frequently introduces weird g-code bugs, buffer overruns, or sudden acceleration/jerk spikes that cause the stepper motors to skip steps—which perfectly explains why your Y-axis was losing its origin and drifting. It isn’t a hardware failure on your Ender 3 v3 SE, but rather a software optimization issue. Since Orca Slicer calculates paths and dynamics much more efficiently, stick with it! You just saved yourself from spending money on a Bambu A1 when your current machine is completely capable.\n\n Also, ignore the advice about adding a Raspberry Pi with OctoPrint; since you already have a Sonic Pad running Klipper, your network and firmware infrastructure is already top-tier. For anyone else dealing with complex technical systems or exploring completely different industries that rely on strict, highly regulated process optimization—such as navigating international medical logistics or the specialized IVF and legal surrogacy service pathways provided by platforms like https://ivmed.agency/ —following a structured, data-driven methodology is always the key to success. Stay on Orca and enjoy those clean prints!","url":"https://forum.creality.com/t/issues-with-creality-print/52042","productLine":"thirdparty","version":"","problemType":"","model":"Ender-3 V3","grade":"泛讨论","replyCount":3,"views":94,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4ee226fa0beaa24f","topicId":52001,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-18","lastActive":"2026-06-18","title":"Supports","originalText":"How can i use in the same part tree supports and normal supports?","url":"https://forum.creality.com/t/supports/52001","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":38,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"22e4f1b661885b7c","topicId":51965,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-16","lastActive":"2026-06-16","title":"About printing time","originalText":"The initial printing and color filament printing take way too long. It’s so frustrating. Can’t something be done about it?\n\n… print in one color and paint the object \n\n Printing in multi-color is time-consuming… you can do it faster with a printer that changes toolhead instead of filament…","url":"https://forum.creality.com/t/about-printing-time/51965","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":25,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c274e7be8bc2a2f2","topicId":51951,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"ZH","date":"2026-06-15","lastActive":"2026-06-15","title":"🏕 Camping Gear Design Contest is Open!","originalText":"Calling all makers, designers, and outdoor enthusiasts!\n\nWe’re inviting you to create innovative 3D printable camping gear that makes outdoor adventures more fun, practical, and creative.\n\n Fire up your printer\n\n Unleash your creativity\n\n Print Your Adventure\n\n Join the challenge and share your best design with the community!\n\n https://c.creality.com/vYMdzDt \n\n 1080_1350（有文字）品牌广告-IG 1080×1350 115 KB","url":"https://forum.creality.com/t/camping-gear-design-contest-is-open/51951","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":111,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"499657dca13de38c","topicId":51939,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-14","lastActive":"2026-06-14","title":"Print Default filament parameters do not match Creality Wiki","originalText":"The default filament printing parameters in version V7.1.1.4472 do not match the parameters listed on my K1C or on the Crealty Wiki site, K1 Flagship Series Complete Recommended Filament Parameters | Creality Wiki .\n\n What is the best way to resolve this discrepancy?\n\n Thank you for your help.","url":"https://forum.creality.com/t/print-default-filament-parameters-do-not-match-creality-wiki/51939","productLine":"print","version":"7.1.1","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":25,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"613d3e959e717393","topicId":51925,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-13","lastActive":"2026-06-25","title":"Creality Print 7.1.1.4472 Camera Images degraded on Linux vs Windows","originalText":"I have a Logitech C920 webcam connected to my Creality Hi USB port.\n\n I dual boot the same PC into Linux Mint 22.3 and Windows 11 so hardware is identical in both cases.\n\n I am using the same version 7.1.1.4472 of Creality Print on both systems.\n\n In Windows the camera shows up just fine using the Creality Print app.\n\n Screenshot 2026-06-13 154340 1920×1032 98.5 KB \n\n In Linux Mint the image is distrorted as can be seen below.\n\n Untitled_001 1920×1040 221 KB \n\n Is there anything I can do to improve the image I get in Linux Mint?\n\n Thanks.\n\nMike\n\nuser3033132230: \n \n Logitech C920 webcam\n\n \n \n What I would do is to check if webcam works properly in linux using for example Cheese ,Guvcview…. not thru creality print, to see if there is maybe driver or whatever issue. Maybe missing some codecs , since it is streaming from printer.\n\n Sorry i couldn’t help more\n\nJust stuck the camera into the computer running Linux Mint 22.3 and ran guvcview and here’s the image, just a-ok.\n\n Selection_008 876×707 442 KB \n\n Also plugged the camera into a completely seperate laptop also running Linux Mint 22.3 just incase and it works fine too.\n\n Selection_040 755×568 420 KB \n\n If I go onto the Hi’s web streaming page with the C920 connected the image is correctly displayed as below:\n\n Selection_041 1358×759 102 KB \n\n So it seems to be the way the image is being displayed in the Creality Print application on Linux where the issue is.","url":"https://forum.creality.com/t/creality-print-7-1-1-4472-camera-images-degraded-on-linux-vs-windows/51925","productLine":"print","version":"7.1.1","problemType":"compat","model":"Creality Hi","grade":"有效","replyCount":15,"views":270,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"47e6f0077961a8a9","topicId":51929,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-13","lastActive":"2026-06-13","title":"Opening someone else's .3mf file erases my presets","originalText":"When I opened a downloaded project file, all my existing presets were removed and only the preset contained in the download showed as present. This persisted even after I opened a new instance of the Creality 7 slicer program.\n\n So I located and re-imported all my previous presets, but I wanted to know if there is a way to keep this from happening. My workaround for the time being is to save an empty project file containing my presets as “Presets.3mf” and reload that when I want to start fresh. Is that the only way to deal with this?\n\n thanks\n\n LJ","url":"https://forum.creality.com/t/opening-someone-elses-3mf-file-erases-my-presets/51929","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0ca90260a2c5c677","topicId":51916,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-13","lastActive":"2026-06-13","title":"Actions grandes","originalText":"Gostaria de saber, como fazer um Actions grandes com a impressora pequena. Como fazer o fatiamento.","url":"https://forum.creality.com/t/actions-grandes/51916","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c5b2fea31d1c622e","topicId":51909,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-12","lastActive":"2026-06-12","title":"CrealityCloud.com - ME removing models from my downloads profile?","originalText":"When logged into CrealityCloud.com , how can I remove downloads from my profile? I’d like to remove things I’ve downloaded for whatever reason (model too large for my build surface, model gives too many errors or does not render in the slicer, something I am printing as a gift and do not need the kids to see it, etc.)","url":"https://forum.creality.com/t/crealitycloud-com-me-removing-models-from-my-downloads-profile/51909","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":40,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"99e116f9c15c1069","topicId":51903,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-12","lastActive":"2026-06-12","title":"Right side pull out for Creality 7.1","originalText":"Come on people!!! Fix the damn pull out on the right side. This is just basic stuff and you should fix it NOW! Very frustrating. If you are throwing out software without basic testing and fixing, what does that say???","url":"https://forum.creality.com/t/right-side-pull-out-for-creality-7-1/51903","productLine":"print","version":"7.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":24,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d1e164f50e227097","topicId":51873,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-10","lastActive":"2026-06-12","title":"Supports for models in Creality Print 7.1.1.4472","originalText":"I have recently upgraded to CP 7.1.1.4472. First thing I noticed is that all the local files on my K1 MAX have been deleted. Is there a reason for this? Secondly, I want to add supports to some of my models. I have looked everywhere (I think) but I am unable to find the tab / menu / button. Please can someone point me in the right direction. Thank you in advance. Paul\n\n… updating CP should not delete any stored files… for as far as I know, files on the printer are only deleted with a firmware upgrade… So always keep your Gcode-files stored on your computer as backup!\n\n Adding support for printing… see screenshot\n\n CP_support 1920×1080 117 KB\n\nThank you Mr_MBR\n\n I do store the model files on my PC but this was the first update that had erased them on the K1MAX.\n\n image 1914×979 100 KB \n\n This was all I was seeing on my screen and thanks to your reply I spotted a very small arrow in a semi-circle on the extreme right of the screen which then displayed the familiar menu. All good now - thank you. Paul","url":"https://forum.creality.com/t/supports-for-models-in-creality-print-7-1-1-4472/51873","productLine":"firmware","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":5,"views":80,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"19228df9bdbcf836","topicId":51831,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-09","lastActive":"2026-06-09","title":"Status of print API call?","originalText":"Anyone know if the Slicer can broadcast/call API with a print status update?\n\n What I’d like to do is change some WS2812 RGB LEDs depending on the status of the print (% finished, error, etc)\n\n [Edit] Assuming WiFi of BLE comms.\n\n Thoughts?\n\n Thanks.","url":"https://forum.creality.com/t/status-of-print-api-call/51831","productLine":"print","version":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":1,"views":23,"likeCount":0,"tags":["creality-hi"],"relReason":"category","sourceType":"用户"},{"uid":"3ab8dfb05e1df0d5","topicId":51818,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-06-08","lastActive":"2026-07-02","title":"User Filament Settings Unable to be edited in Creality Print 7.1.1.4472 on Linux Mint","originalText":"I am running Creality Print 7.1.1.4472 on Linux Mint as well as on Windows 11.\n\n I have 3 nozzle sizes to choose from. 0.4, 0.6 and 0.8mm.\n\n I can create custom slicing profiles per nozzle size just fine. i.e. 0.2mm Standard @Creality Hi 0.4 nozzle and edit them and save them as my new slicing profiles.\n\n I cannot create custom user filaments in Linux Mint like I can in Windows 11.\n\n I would like to be able to edit the user filaments to be able to assign prices, so that the print cost calculator has a realtime view of the print cost based on the nozzle size chosen.\n\n This is possible in Windows 11 version of Creality Print 7.1.1.4472 but is not possible in the Linux version.\n\n Please fix this so that the Linux version
