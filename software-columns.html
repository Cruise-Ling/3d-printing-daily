orum.creality.com/t/creality-print-improvement-or-suggestion/48915","productLine":"thirdparty","version":"","problemType":"feature","model":"K1","grade":"有效","replyCount":4,"views":356,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7a3fa12e94548954","topicId":48874,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-16","lastActive":"2026-03-14","title":"New firmware V1.1.0.65 released, What is Motion advance?","originalText":"Hello there fellow builders.\n\n Yesterday the Creality Hi firmware CR4NU200360C20_ota_img_V1.1.0.65.img was released, I downloaded manually and installed on my printer.\n\n Now on the control menu there is a new tab «Print settings» and the only option on it is a toggle switch «Motion Advance», What this new settings means and what it do?\n\n Regards\n\n image 576×1280 77.7 KB image 576×1280 79.8 KB image 576×1280 63.2 KB\n\nMotion advance is supposed to be a feature to compensate for possible VFAs from what I understand. Not sure how it does it and haven’t really tested it since I don’t have an issue with VFAs on my Hi anyway\n\nLoriAnneBrown: \n \n VFAs\n\n \n \n what is VFA?","url":"https://forum.creality.com/t/new-firmware-v1-1-0-65-released-what-is-motion-advance/48874","productLine":"firmware","version":"","problemType":"ui","model":"Creality Hi","grade":"有效","replyCount":6,"views":954,"likeCount":4,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"82d4c92e5a16d99c","topicId":48869,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-15","lastActive":"2026-02-16","title":"Monotonic Pattern issue","originalText":"I’m using Creality Print slicer with Top surface pattern set to Monotonic , but the top layer isn’t printing in a clean monotonic pattern. The lines don’t look consistent and the surface finish isn’t smooth.\n\n image 1345×792 237 KB\n\nIf you want a smooth top layer use ironing…","url":"https://forum.creality.com/t/monotonic-pattern-issue/48869","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":54,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"9f2e57c63fd36f7c","topicId":48847,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-14","lastActive":"2026-02-14","title":"moving shapes z axis","originalText":"the shapes move and respond as i expect them to but Z zero seems to be in a space relative to the first object placed.\n\n I dont understand. can i change that so its always relative to the bed or the UWC?","url":"https://forum.creality.com/t/moving-shapes-z-axis/48847","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":63,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"36a1c82e3e1e2964","topicId":48838,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-14","lastActive":"2026-02-14","title":"Ender-7 slicer?","originalText":"I have the following problem:\n\n \n No Ender-7 in 7.0 Creality Print. \n \n How am i supposed to print?\n\nFound the answer: Install Creality Slicer from the Creality Cloud. Make sure its at least build 291 and there it is: Ender-7. would be great if the downloadpage of the ender-7 would point to Creality Slicer and not Creality Print, since Print has no Ender-7…\n\n Creality Slicer - Creality Slicer Softwares Download","url":"https://forum.creality.com/t/ender-7-slicer/48838","productLine":"cloud","version":"7.0","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":96,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6d7af220ec37a709","topicId":48833,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-02-14","lastActive":"2026-02-14","title":"Crality Print no arranca - Creality Print won't start","originalText":"Hola, tengo el siguiente problema, desde que instalé la version 7 de Crality Print no puedo lograr que arranque se queda en la pantalla de inicio con la leyenda CARGANDO CONFIGURACION y de esa pantalla no pasa.\n\n Ante este problema intento arrancar versiones anteriores (que antes funcionaban, 5 o 6) y ahora tambien se quedan en la pantalla de incio del programa.\n\n Agradecere vuestra ayuda, tengo Windows 11 (ya realice una instalación limpia tanto de Windows como de Creality Print) sin éxito.\n\n Agradeceré vuestra ayuda. Saludos.\n\n Hello, I’m having the following problem: since installing Creality Print version 7, I can’t get it to start. It gets stuck on the “LOADING CONFIGURATION” screen and doesn’t go any further.\n\n When I try to start older versions (which used to work, versions 5 and 6), they also get stuck on the program’s startup screen.\n\n I would appreciate your help. I have Windows 11 (I’ve already performed a clean installation of both Windows and Creality Print) without success.\n\n Thank you for your help.\n\n image 856×474 115 KB","url":"https://forum.creality.com/t/crality-print-no-arranca-creality-print-wont-start/48833","productLine":"print","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":101,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e3ea1b01fcea63a0","topicId":48806,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-13","lastActive":"2026-03-25","title":"Creality K2 Chamber Temperature is Incorrect","originalText":"During testing of my retrofit chamber heater, it became obvious that the Chamber Temperature Sensor was not giving a true reading.\n\n https://www.crealitycloud.com/model-detail/creality-k2-k2-combo-chamber-heater \n\n At a reading of 52 o C the actual temperature was 60 o C\n\n At a reading of 35 o C the actual temperature was 40 o C\n\n I decided it was probably a miss match of thermistor to the configuration so I decided to do a three-point custom calibration to correct the error.\n\n What I found was the\n\n \n \n The sensor is a match for a EPCOS 100K B57560G104F\n\n \n \n The sensor is not damaged and is working correctly\n\n \n \n There is a bug in the Klipper firmware it is not correctly\n\n \n \n Translating the resistance to temperature on pin PC5\n\n What is a mystery is the Klipper firmware is the same for the K2 & K2 Pro. If the K2 pro is suffering the same error it is no wonder people are struggling to reach 60oC as they would actually be trying to get to over 70oC\n\n Creality K2 Chamber Temperature Sensor Three Point Calibration Error.pdf (425 KB)\n\nCould Somone check this out on the K2 Pro \n\n It’s easy to do\n\n From cold set the chamber temperature to 50 degrees\n\n Wait until it is up to temperature and stabilised\n\n Revert back with the bed temperature and the chamber temperature\n\n Thanks\n\nStill Not Fixed in V1.1.4.1","url":"https://forum.creality.com/t/creality-k2-chamber-temperature-is-incorrect/48806","productLine":"firmware","version":"","problemType":"ui","model":"K2 Pro","grade":"有效","replyCount":3,"views":112,"likeCount":1,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"c407258cd5a7b957","topicId":48792,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-12","lastActive":"2026-02-14","title":"Using cut on an object more than once","originalText":"I’ve got a k2 plus and I’m trying to use the keyed cut function in Creality print 7 on a 14 inch donut shape.\n\n To get it small enough to print I need to slice into 3 pie shape pieces. The problem is when it applies the cut it cuts through the other side of the model I don’t want to cut. Anyone have any ideas how to do this in Creality print?\n\n Thanks in advance\n\n Steve\n\nHumm, dont think you can do that.\n\nHi, did a cover 14 inch, cut it in 2 pieces, place one at 45 angles or so and print one at a time.","url":"https://forum.creality.com/t/using-cut-on-an-object-more-than-once/48792","productLine":"print","version":"7","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":4,"views":107,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"14897204252afcc3","topicId":48771,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-11","lastActive":"2026-05-05","title":"Creality Print won't load!","originalText":"Haven’t used my printer for some weeks, and yesterday when I tried to load creality print it won’t load, it hangs on the loading configuration image. Can’t even close it, have to hard reset the pc to get out.\n\n Have tried the latest version and some older ones. None of them work.\n\n I’m on windows 11\n\n Tried running as admin, no luck.\n\n Tried to add it in defender as an app not to block, no luck.\n\n Anyone experienced something like this?\n\nI have the same problem. I’ve tried installing it on another PC and the same thing happens.\n\nHola, mismo problema y sin poder encontarle una solucion. Uds. encontraron alguna solucionarlo?","url":"https://forum.creality.com/t/creality-print-wont-load/48771","productLine":"print","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":8,"views":394,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"53239ae2f0550f33","topicId":48754,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-11","lastActive":"2026-02-11","title":"Creality App","originalText":"I really like the Creality Cloud app but when something happens or the print is finished I just get a notification in the form of a banner. No sound at all. I use an iPhone and have tried other phones and also an iPad but the same thing. Anyone else have this problem?","url":"https://forum.creality.com/t/creality-app/48754","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":50,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"e80f376c716b4b32","topicId":48735,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-10","lastActive":"2026-02-10","title":"Creality Print","originalText":"Buenas tardes, desde hace un par de actualizaciones no guarda al laminar la temperatura ni la configuración del filamento seleccionado.\n\n Aunque cambie el filamento en la barra superior derecha imprime en una sola configuración.","url":"https://forum.creality.com/t/creality-print/48735","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":36,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b7008314cfa73f3f","topicId":48712,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-09","lastActive":"2026-02-09","title":"D1 Sermoon software","originalText":"I have Creality D1 Sermoon. I had SD card problem. For solving this issue I want to update software with guidance of Creality Forum. When I try, I didint find software. I ask the online customer service. They share me a link. From this link I download software and update printer. After that when I try the calibration I noticed my axes measurement is different. When I say “auto home” expected to go middle, but goes little left from middle. And when I want to update firmware from micro USB; I cannot update firmware automatically. When I try to manuel want .hex file but my file which downloaded have .bin file. Now my axes is differ and firmware is different from which original come","url":"https://forum.creality.com/t/d1-sermoon-software/48712","productLine":"firmware","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":32,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"9c8ab4e69384e35a","topicId":48683,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-08","lastActive":"2026-03-17","title":"Select face to align to the  build plate","originalText":"Hi ,\n\n I am not able to find Select face to align to the build plate option in CrealityPrint_7.0.1.4212_Release.\n\n image 361×316 16.7 KB \n\n image 292×529 64.9 KB \n\n In Cura slicer same feature:-\n\n image 1250×560 22.3 KB\n\nHello @FAIZ_HABEEB \n\nWelcome to the Creality Forum…! \n\n Is this the one you are asking about? It automatically puts the side you choose down towards the build plate:\n\n Lay-on-Face 425×629 20.8 KB\n\nThe one that @FAIZ_HABEEB showed in the photo is the automatic orientation. The one you are showing is the manual one. My experience is that the automatic one works most of the time, but I do occasionally need to use the manual face-align on occasion. The automatic feature is nice, but truth be told, we are still smarter than the machines.\n\n Also, for a support at that kind of angle, I strongly recommend using tree or tree-hybrid supports. The “standard” supports are not going to work well at that angle should you choose to print it like that.","url":"https://forum.creality.com/t/select-face-to-align-to-the-build-plate/48683","productLine":"thirdparty","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":8,"views":285,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f9968bcae684a9f0","topicId":48688,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-08","lastActive":"2026-02-08","title":"Stop supports on model from sticking","originalText":"I’m running CP 7.0.1.4212 on my K1 and have got the “build-plate-to-model” support values dialed in nicely:\n\n \n Enable Support = On \n On build plate only = Off \n Top Z distance = 0.34 \n \n I’m finding that my supports which sit on the model to support higher extensions stick to the model a bit too much. Are there any properties to control the support bases and how they are printed when the base is on the model?","url":"https://forum.creality.com/t/stop-supports-on-model-from-sticking/48688","productLine":"print","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"72ff497082e1887b","topicId":48692,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-08","lastActive":"2026-07-22","title":"[CRITICAL BUG REPORT] K1 Max 2.3.5.34 + CFS 1.1.3 - Temperature Override & Bed","originalText":"Dear Creality Firmware Team,\n\n I’m reporting critical firmware bugs affecting multi-material printing\n\n(PETG+PLA) on K1 Max + CFS kit. These issues render the CFS system\n\nunusable for common PETG body + PLA support interface workflows.\n\n Device Information:\n\n Model: Creality K1 Max + CFS Multi-Color Upgrade Kit\n\n Printer Firmware: 2.3.5.34\n\n CFS Firmware: 1.1.3\n\n Slicer: Creality Print 7.0\n\n Location: Santiago, Chile\n\n Date: February 08, 2026\n\n BUG #1: CFS TOOLCHANGE TEMPERATURE OVERRIDE (PETG → PLA / PLA → PETG)\n\n Observed Behavior:\n\nPETG configured: 220°C (slicer filament profile + printer filament settings)\n\nPLA configured: 220°C (support interface)\n\n During T[next_extruder] / CFS toolchange sequence:\n\n User G-code: M104 S220 / M109 S220 executed (nozzle reaches 220°C)\n\n CFS firmware macro IMMEDIATELY overrides to 250°C target during purge/extrusion\n\n PLA filament extruded at 250°C → heat creep in heatbreak → consistent clogs\n\n Root Cause (suspected):\n\nCFS CHANGE_TOOL or PURGE macro in gcode_macro.cfg contains hardcoded\n\nPETG temperature:\n\n{% set extruder_temp = 250%} ; Ignores slicer settings\n\nM109 S{extruder_temp} ; Overrides user M109 S220\n\nSlicer variables {nozzle_temperature[next_extruder]} are ignored.\n\n Impact: PLA softens in heatbreak (Tg ~60°C) before extrusion, causing\n\nrecurrent clogs.\n\n BUG #2: BED MESH CALIBRATION at FIXED 50°C vs PRINTING 70°C (PETG)\n\n Observed Behavior:\n\nBED_TEMP=70°C configured (PETG first layer)\n\nSTART_PRINT macro forces bed calibration at 50°C FIXED\n\nPrint starts: bed thermal expansion ~0.08-0.12mm → nozzle scrapes first layer\n\n Root Cause:\n\nSTART_PRINT / CX_PRINT_LEVELING_CALIBRATION macro sequence:\n\nM140 S50 / M190 S50 ; Fixed 50°C for mesh, ignores slicer BED_TEMP\n\nCX_PRINT_LEVELING_CALIBRATION ; Mesh created at wrong thermal state\n\n; Bed then heats to 70°C for printing\n\nNo compensation for aluminum bed thermal expansion between calibration\n\nand printing.\n\n Impact: Invalid Z-offset → first layer scraped / elephant foot / bed drag.\n\n BUG #3: ASYMMETRIC THERMAL RAMPING IN BIDIRECTIONAL TOOLCHANGE\n\n PETG → PLA (250°C → 220°C):\n\n250°C → M109 S220 executed → CFS macro re-targets 250°C → PLA extruded\n\nat 250°C (FAIL)\n\n PLA → PETG (220°C → 250°C):\n\n220°C → toolchange → immediate re-target 250°C → PETG extruded correctly (OK)\n\n Problem: Thermal ramp DOWN (PETG→PLA) interrupted by ascending\n\noverride. Ramp UP (PLA→PETG) respected.\n\n TECHNICAL SOLUTION PROPOSED (Klipper Macro Code)\n\n Fix CFS CHANGE_TOOL macro:\n\n[gcode_macro CFS_CHANGE_TOOL]\n\ngcode:\n\n{% set next_temp = printer.extruders[params.NEXT_EXTRUDER].target|float %}\n\n{% set next_bed_temp = printer.heater_bed.target|float %}\n\nT{params.NEXT_EXTRUDER}\n\nM109 S{next_temp} ; RESPECT slicer temperature\n\n; … rest of toolchange sequence\n\n Fix START_PRINT bed mesh timing:\n\n[gcode_macro START_PRINT]\n\ngcode:\n\n{% set bed_temp = params.BED_TEMP|float %}\n\n{% set extruder_temp = params.EXTRUDER_TEMP|float %}\n\nM140 S{bed_temp}\n\nM190 S{bed_temp} ; Wait for thermal expansion BEFORE mesh\n\nM104 S{extruder_temp}\n\nG28 ; Home\n\nCX_PRINT_LEVELING_CALIBRATION ; Mesh at correct thermal state\n\n Add UI toggle (CFS Settings Menu):\n\n“Respect Slicer Temperatures: [ON/OFF]”\n\n PRIORITY: CRITICAL\n\n Blocks core CFS functionality - PETG+PLA multi-material printing\n\n(primary CFS use case)\n\n Competitors handle perfectly - Bambu Lab AMS, Prusa MMU respect slicer\n\ntemperatures without overrides\n\n Forces unsafe workarounds - Users root printers or use custom Klipper\n\n(voids warranty)\n\n Material waste + hardware risk - Recurrent clogs damage hotend / extruder gears\n\n Requested Actions:\n\n Confirm bug reproduction with firmware versions 2.3.5.34 + CFS 1.1.3\n\n Release firmware update implementing slicer temperature respect in CFS macros\n\n Document CFS temperature logic in release notes for advanced users\n\n Add official PETG+PLA profile with validated purge volumes and thermal ramps\n\n Evidence available:\n\n G-code snippets showing M109 S220 → firmware override to 250°C\n\n This issue affects the core value proposition of the CFS upgrade kit.\n\nPlease escalate to the K1/CFS firmware development team for immediate\n\nattention.\n\n Best regards,\n\nAlberto C\n\n Captura de pantalla 2026-02-08 165128 812×226 7.73 KB \n\n Santiago, Chile\n\nK1 Max + CFS Owner\n\nThere is also an additional problem when printing with ABS filament: the print bed does not wait to reach the proper temperature, and the Z-axis is set too low, which causes clogs. This issue is occurring specifically in firmware version V2.3.5.34\n\nIs there any news received from Creality to tackle these problems? It seems that v2.3.5.34 is the last firmware update for the K1 series + CFS v1 (adapter kit CFS). Also struggling overhere with mixed PLA/PETG prints.","url":"https://forum.creality.com/t/critical-bug-report-k1-max-2-3-5-34-cfs-1-1-3-temperature-override-bed/48692","productLine":"firmware","version":"","problemType":"other","model":"K1 Max","grade":"有效","replyCount":3,"views":401,"likeCount":8,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"0dcd1f6a58d122f0","topicId":48655,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-07","lastActive":"2026-02-15","title":"Double Pop up tags in 7.0.1.4212","originalText":"In Creality Print 7.0.1.4212, when you send to print, does anyone else get two pop up screens where when you click send to print but then there is a second screen that is a duplicate of the first. The first one is sending the print to the printer and the second one does nothing. You can close it and the print still happens. Just wondering if that is just me or does anyone else get that?\n\nMine doesn’t do that. I have a different annoyance with Print 7.0.1.4212 for some odd reason it has chosen a really big font for the Filament window. Easy enough to work around, but really annoying. anyone else have this bug?\n\n image 744×132 7.92 KB \n\n BTW, nice feature in Print-7, there is a “user feedback button in the upper left:\n\n image 361×109 4.02 KB\n\nThis happens when the calibration switch is set. It’s a glitch, of course, but this is the reason.","url":"https://forum.creality.com/t/double-pop-up-tags-in-7-0-1-4212/48655","productLine":"print","version":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":143,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"30b3789d2627bdba","topicId":48652,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-06","lastActive":"2026-03-04","title":"Tree supports Creality Print 7 not strong enough with the filament i am using at the moment","originalText":"So i printed this character that requires tree supports with the Creality PETG and it worked fine. I finally got the color that i needed to print this and the supports are breaking. Ok so its a different material must not have as good layer adhesion. I have been trying and trying to create stronger tree supports. Can we not set a fill density for tree supports? I found lots of posts of people complaining that they were too strong. I can not seem to make them strong enough. If i choose Strong Tree then it makes these massive tree structures.. might work i guess but why not thinner ones with a fill pattern. I have tried lots of settings like Base Pattern spacing, Support Wall Loops, Tree support diameter. All with limited success. There is an initial density parameter but not a normal Density parameter. Is it time to leave Creality Print?\n\nWhen using PETG to support PLA prints you need to set the Z axis to 0.0, the support won’t work otherwise\n\nBeen experimenting with supports myself, and for TPU85A the normal supports are useless, as everything is too soft. So i go either with ‘support enforcer’ to place the supports where i want, or i go with cylinders and use them as a support combined with the default tree support…..so the support gets placed on top of a cylinder.\n\nIf the support is unstable with solid filament, you definitely need to adjust cooling, nozzle temperature or speed, as that degrades the adhesion.\n\n Myself new to 3D printing, i discovered that i can’t print with ABS without a chamber and like 45°C in the chamber, else there is low layer adhesion and i can easily break everything i print, even if it’s 100% solid.\n\nThe chamber + heating solved not only adhesion, but almost eliminated warping too.\n\n What kind of filament is it?","url":"https://forum.creality.com/t/tree-supports-creality-print-7-not-strong-enough-with-the-filament-i-am-using-at-the-moment/48652","productLine":"print","version":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":172,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c3ee28aef1ad3116","topicId":48605,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-05","lastActive":"2026-02-05","title":"Creality rewards","originalText":"Hi, I am relatively new to Creality and I am a bit confused about the rewards system. I have uploaded a number of models and on a couple I have received 100 points for each 10 downloads, but on one model that has 37 downloads I have not received any points. Could it be because I also uploaded a print file and the majority of the downloads have been of that and not the STL models?\n\n If so this is a bit of a disincentive to include print files.\n\n Many thanks\n\n Paul","url":"https://forum.creality.com/t/creality-rewards/48605","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":73,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"383fd5786a5ed830","topicId":48562,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-03","lastActive":"2026-05-22","title":"Creality Print 7.0 hollow tool","originalText":"Hi, New to the forum. I was trying to use the hollow tool and not really sure I am doing it correctly or the hollow tool is what I expected. I have a model that i have split in half. I selected the hollow tool and set the thickness at 2mm and then selected hollow. It looks like it is hollowing it out not sure what I expected. I did not try to print it yet I was hoping it would show me what it did. I was thinking that the walls of what I wanted to print would be 2mm thick. I can’t find anyone posting a video or anything yet to see if I am using that tool correctly or not. Any help appreciated.\n\nWhen i played with the hollow tool and also cutting the bottom off so that i could access the center i just played with the settings and would slice it to see what the result was. I was using it on a very complicated Disney castle.. and surprisingly it worked.\n\nI think the part that is not obvious with the hollow tool are these points…\n\n #1 The “hollow” mm setting has to be less than the thickness of the part if you want a bottom.\n\n #2 Do not generate top layers.\n\n #3 Turn off infill.\n\n If you do those three things you should see your hollowed out part.","url":"https://forum.creality.com/t/creality-print-7-0-hollow-tool/48562","productLine":"print","version":"7.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":649,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"01b86c2b025bdd9c","topicId":48557,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-03","lastActive":"2026-02-12","title":"Creality print 7 exclude objects","originalText":"Hello, could you put “Exclude objects” in Creality print not only on web interface and bed mesh too ?\n\nI’m not entirely sure I am understanding the request. In v7 of Creality Print, the exclude object is a little less than intuitive. This post covers it well.\n\n \n \n \n \n \n Help, New Creality Print version missing Exclude object Creality Print V5 and Beyond \n \n \n \n Creality print said there was a new version this morning so I downloaded it, under the device tab where the camera is located and what not the option to remove one of the objects being printed is gone. I’ve looked all over to see if there was some option to turn it back on. I tend to print multiple objects and when fails I just remove it so the printer skips over it, but the option is missing so now I’m wasting so much filament!\n\nIt’s in a tab now .. I asked the same Question ..\n\n delete object 1130×712 117 KB","url":"https://forum.creality.com/t/creality-print-7-exclude-objects/48557","productLine":"print","version":"7","problemType":"ui","model":"未标注","grade":"有效","replyCount":4,"views":237,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"db41f17abb4bd588","topicId":48560,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-03","lastActive":"2026-02-03","title":"Prime tower floating region?","originalText":"image 754×1058 141 KB Notice the green and blue floating regions in my prime tower? Why would the slicer do this, and yes the printer is attempting and failing to print these unsupported regions. Any ideas on a setting that will fix this?","url":"https://forum.creality.com/t/prime-tower-floating-region/48560","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"f171ee13f99cd1b0","topicId":48547,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-03","lastActive":"2026-02-03","title":"Creality crashes when try to add text","originalText":"Crality crashes when trying to add text","url":"https://forum.creality.com/t/creality-crashes-when-try-to-add-text/48547","productLine":"print","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":21,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0a485ecc16e2048d","topicId":48501,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-01","lastActive":"2026-02-06","title":"Import a .SVG to print as a different color into Creality Print","originalText":"I’m using CP v7.0.0.4127 and what I’m trying to do is merge an imported .SVG file into a rectangle (for example). Then I want to print the rectangle one color (blue for example) and the imported .svg another color (red). And I want these to be flush.\n\n \n \n How do I go about in doing this?\n\n \n \n Thank you!!\n\nLoad the rectangle, select it and right click on it. Add Part > SVG and import your SVG File. It will give you options like depth, etc. This will make it an assembly. Move the SVG into position where you want it.\n\n Then on the left side under the printer drop down, you should see the rectangle and svg listed as objects. Select the SVG and change the filament color.\n\nIs the filament an extra for the falcon A1 pro?","url":"https://forum.creality.com/t/import-a-svg-to-print-as-a-different-color-into-creality-print/48501","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":530,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f7ee762dfedbd576","topicId":48520,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-01","lastActive":"2026-02-01","title":"petg fillament not selecting","originalText":"on my k2 creality 3d printer i try selecting petg but it just wont select but it does if it is pla??? if i select it as pla it wont print properly.","url":"https://forum.creality.com/t/petg-fillament-not-selecting/48520","productLine":"print","version":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"00ac34675488be9e","topicId":48509,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-01","lastActive":"2026-02-01","title":"Creality Print Device Tap Map Support","originalText":"Hello,\n\n Wouldn’t it be great if we had Map support in the Device tab of Creality Print?\n\n What I mean is that in Fluidd, you can create folders so you can keep ABS, PETG, and PLA separate, and then select a folder for what you want to print. This keeps things organized rather than having everything mixed up.\n\n I would find this really easy and much more organized.\n\nThat would be helpful","url":"https://forum.creality.com/t/creality-print-device-tap-map-support/48509","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":66,"likeCount":5,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8c9e51b9e6801034","topicId":48484,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-31","lastActive":"2026-02-07","title":"White dots in Creality print while slicing","originalText":"White dots in the print layers 1918×1020 187 KB \n\n Hello everyone,\n\nMy name is Alan, I work as a teacher at a university and live in Belgium. Can anyone help me with the white dots problem in the “Creality Print” software program?\n\nAt first, I didn’t find it bothersome, but now that we’re working with more precise parts, it’s becoming a problem when trying to achieve a proper fit, especially when two parts need to fit together with high precision.\n\nIs this something that can be adjusted in the software during slicing, or how can it be prevented?\n\nThe printer we use is a Creality Ender-3 V3 KE.\n\nAny help is welcome.\n\nHave a nice day everyone.\n\nRegards, Alan\n\nThose are the z seam. You can try different options and slice the model again to preview the seam try to make it less noticeable.\n\nYeah that where the line ends when printing. It’s also called the seam.","url":"https://forum.creality.com/t/white-dots-in-creality-print-while-slicing/48484","productLine":"print","version":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":6,"views":155,"likeCount":7,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"10806632592e592e","topicId":48478,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-31","lastActive":"2026-01-31","title":"Remember the name for a file","originalText":"Not sure if this is the best place to submit this, but can we please retain the name of a file when we give it in send print? It keeps resetting itself and I keep forgetting which file is which across my multiple printers Would be nice if when I save the project, it saves the file name too.\n\nI second this","url":"https://forum.creality.com/t/remember-the-name-for-a-file/48478","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":42,"likeCount":2,"tags":["feature-need"],"relReason":"category","sourceType":"用户"},{"uid":"beaec8a2730a0d2f","topicId":48411,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-28","lastActive":"2026-01-28","title":"Can't get Creality Print Ver V7.0.0.4127 to run in LMDE 6","originalText":"Hello.\n\n I’ve been attempting to run the latest version of Creality Print on my computer which is running LMDE 6 as the OS, but have not been abler to even get the software to open up. I click on the icon and nothing happens. I downloaded the “CrealityPrint-V7.0.0.4127-x86_64-Release.AppImage” file and made the file excutable using both the graphical interface and the command line. What have I missed?\n\n Thanks in advance for your help here,\n\n Shawn C.","url":"https://forum.creality.com/t/cant-get-creality-print-ver-v7-0-0-4127-to-run-in-lmde-6/48411","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":31,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8f9bb9d2ab121dba","topicId":48386,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-26","lastActive":"2026-01-26","title":"2 questions about creality print 7","originalText":"Print 7 is working great with my new K1C but two things about it I dont understand ,\n\n \n \n On the preview screen it says my models x, y and z dimensions and for z its telling me its 245mm tall . Now I’m printing with 0.2mm layers so im thinking theres 5 x 0.2mm in 1 mm so 245mm should be 1225 layers but its showing 1678 layers why the discrepancy ? this difference happens no matter what print i load in\n\n \n \n On the preview screen it says the x,y,z dimensions and SPEED , The speed right now says 135 , if I load in a different file but keep all the printer settings as they were I would assume that the speed would remain the same . It can be higher or lower but I cant see any correlation as to why , surely no matter what model I print if the printer speed for all models is kept the same and the layer size etc why should it say the speed will be different , In the model im on now it has the printer set to 60mm/s for first inner and outer wall and for all other l;ayers 200mm/s outer and 250mm/s inner yet on the preview page its says ..X 147.369mm Y 202.266mm Z 245.0mm and Speed 135 , In what way does 135 relate to any of the speed settings i set in the printer settings or am I missing the point somewhere\n\n \n \n Don","url":"https://forum.creality.com/t/2-questions-about-creality-print-7/48386","productLine":"print","version":"7","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":92,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7950c46383877d09","topicId":48306,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-23","lastActive":"2026-01-23","title":"Side Auxiliary Fan Keeps Turning Off","originalText":"Creality Print 6.3 & Creality Print 7.0\n\n With my Creality K2, I am using my Side Auxiliary Fan to move air round the enclosure during heating.\n\n I turn the cooling feature off selecting side fan 0%\n\n Side Fan De-Selection 427×190 6.5 KB \n\n I then turn the fan on manually in Fluidd or use a modified gcode gcode_macro M141\n\n The side fan runs then turns off.\n\n I inspected the print gcode and Creality Print is adding “M106 P2 S0” in three places , this turns the side fan off.\n\n This occurrence is not a problem as I turn the side fan on after this.\n\n -----------------------\n\n First addition \n\n ; EXECUTABLE_BLOCK_START\n\n EXCLUDE_OBJECT_DEFINE NAME=50mm_Fan_Cradle.stl_id_0_copy_0 CENTER=130,130 POLYGON=[[76,185.4],[97,65],[163,65],[184,185.4],[184,195],[76,195],[76,185.4]]\n\n M73 P0 R52\n\n M106 S0\n\n M106 P2 S0 \n\n ----------------------------\n\n This is a problem as the print has started \n\n -----------------------\n\n Second addition \n\n ;TIME_ELAPSED:996.099609\n\n M106 P2 S0 \n\n ;LAYER_CHANGE\n\n -------------------------\n\n This occurrence is not a problem as it is at the end of the print and I turn the side fan off after this.\n\n --------------------\n\n Third addition \n\n EXCLUDE_OBJECT_END NAME=50mm_Fan_Cradle.stl_id_0_copy_0\n\n M106 S0\n\n M106 P2 S0 \n\n ;TYPE:Custom\n\n ; filament end gcode\n\n END_PRINT\n\n ----------------------\n\n With the side fan deselected there should be no occurrences of M106 P2 S0\n\n This looks like it is a reoccurrence of a problem in an old closed post with Creality Print 5\n\n https://forum.creality.com/t/auxiliary-fan-switches-on-and-then-switches-off-again/14190 \n\n In my print gcode I am having to edit the “M106 P2 S0” out in notepad.\n\n -------------------------------------\n\n I apologise, I didn’t understand the software, I have been trying to sort this for over a week.\n\n To stop the fans turning off in addition to selecting Side Fan Should 0%\n\n You also need to set Auxiliary Fan Opening Height to your maximum build height, in my case 260mm\n\n Side Fan De-Selection With Opening Height 377×188 6.35 KB \n\n This prevents the Creality Print is adding “M106 P2 S0” in the middle of the print\n\n I hope Somone will find this useful in the future","url":"https://forum.creality.com/t/side-auxiliary-fan-keeps-turning-off/48306","productLine":"print","version":"6.3","problemType":"","model":"K2","grade":"泛讨论","replyCount":1,"views":115,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8cb962e7fd4120a9","topicId":48288,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-22","lastActive":"2026-03-18","title":"K1C Filament Change & Poop amount Settings","originalText":"Just trying to print multicolor however noticed interesting poop action,\n\n printer lays the layers and then next layer is different color so cuts the filament, retracts and extrude new color however after that flushing one more time. That creates extra poop volume, i could not stop second flush although i put flush multiplier as “0”,\n\n Look at the sequence of poops, could not figure out how to stop or reduce secondary single color poop.\n\n I printed via creality print default settings with flush multiplier 0.\n\n Photo 22.01.2026, 17 21 55 1920×590 242 KB \n\n Photo 22.01.2026, 17 23 02 1920×2560 805 KB\n\nTenho tido o mesmo problema.","url":"https://forum.creality.com/t/k1c-filament-change-poop-amount-settings/48288","productLine":"print","version":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":140,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c79f9a74603c3e1f","topicId":48240,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-21","lastActive":"2026-07-19","title":"Request for Bridge Anchor Control (Start/End Position Adjustment)","originalText":"I’d like to request a feature that allows users to manually control or influence the start and end anchor positions of bridges in Creality Print. Currently, the slicer automatically chooses bridge anchor points based on geometry, but in many cases the anchors end up too close to the edge of a part even if the wall number is increased. This leads to weaker bridging, reduced dimensional accuracy, and increased sagging. A deeper anchor could in many cases produce a stronger, cleaner bridge. A “Bridge Anchor Offset” parameter (distance inward from the edge) would be great, there is clearly already some parameter driving this, I just need access to it. The pictures show a generic example of how adding more walls doesn’t fix this issue.\n\n Bridge start and end position 843×422 48.3 KB \n\n Bridge start and end position 2 784×377 38.1 KB\n\nStill no movement on this topic, does anyone know anything about it?","url":"https://forum.creality.com/t/request-for-bridge-anchor-control-start-end-position-adjustment/48240","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":44,"likeCount":0,"tags":["feature-need"],"relReason":"category","sourceType":"用户"},{"uid":"e17406c6a8d0e11f","topicId":48242,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-21","lastActive":"2026-01-21","title":"Creality Print switches colours through multiple layers instead of a single layer","originalText":"I have a Creality K2 Pro (including the CFS for multifilament printing) and want to print some tokens for gaming.\n\n I want the coloured icons on them to be a single layer thick on the top and bottom so that I’m not wasting filament swapping colours multiple times a print. I’m trying to slice the tokens in Creality Print but it changes the colour on all the shell layers instead of just the first.\n\n The coloured parts of the model are .2mm thick, the hight of a layer, as you can see in the second screen shot. I’ve tried making them thinner and it doesn’t help. Anyone got any ideas on how to solve this? Thanks in advance\n\n image 716×625 6 KB \n\n image 680×572 2.69 KB \n\n image 808×561 65.4 KB \n\n image 830×638 74.7 KB\n\nHello @RowSkin \n\nWelcome to the Creality Forum…! \n\n I’m not sure if this is the answer you are looking for but try this. In Creality 7 go to the paint icon. Choose the height range and then experiment with it so you can fill in that top layer with a different color. That would only work if the top layer sticks up a couple mm. Remember that a very thin light color on top of a dark color might show through. Hope that helps a little.\n\n Paint-1 639×478 22.3 KB \n\n Paint-2 1127×499 27 KB\n\njimandyen: \n \n I’m not sure if this is the answer you are looking for but try this. In Creality 7 go to the paint icon. Choose the height range and then adjust it so you can fill in that top layer with a different color. Remember that a very thin light color on top of a dark color might show through. Hope that helps a little.\n\n \n \n Thanks for the suggestion but I was hoping to have the tokens flat rather than have the coloured parts raised up, so changing colour by hight means you won’t see the icon","url":"https://forum.creality.com/t/creality-print-switches-colours-through-multiple-layers-instead-of-a-single-layer/48242","productLine":"print","version":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":12,"views":628,"likeCount":1,"tags":["trouble-shooting","k2pro"],"relReason":"category","sourceType":"用户"},{"uid":"a0ed69a269e05c20","topicId":48216,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-20","lastActive":"2026-01-20","title":"Cost of filament used","originalText":"In creality print 7 it tells me the weight and length of the filament that the model will use and it says how much the filament needed will cost , but how do i tell it what i paid for the 1KG reel so it can give a realistic cost for the model , where do I set the filament price per KG\n\n Cheers\n\n Don\n\nI can’t remember but in earlier versions of Creality Print you could actually type in the filament cost per roll. Prices vary with each roll so you’d have to average.\n\n In Creality Print 7.0.0.4127 I found this but haven’t tried to set it yet:\n\n Click on the pencil icon:\n\n cost-2 545×301 17.2 KB \n\n cost-1 1034×648 34 KB \n\n In the Filament Profile you can also add the price of each roll. You’d have to add each time for different prices:\n\nClick on the filament and then the pencil icon:\n\n Filament-Profile-2 520×216 12.2 KB \n\n Filament-Profile-1 1256×652 49.6 KB \n\n Hope that helps…\n\nBe forewarned: the filament usage calculator inherited from Bambu Studio / OrcaSlicer - which Creality Print v6 and later are based on - is effectively broken. It is barely usable even with a 0.4 mm nozzle, and on the K2 Plus with a 0.8 mm nozzle it is so far off that the results are meaningless.\n\n This is not a dig at Creality Print. The underlying algorithm is flawed industry-wide across all printers that rely on this approach. If you look at the OrcaSlicer GitHub issues, you will find extensive discussion of the problem. It was a neat idea, but because it does not affect print quality, it has never received much attention or sustained effort.\n\n As a result, the cost calculator - while conceptually appealing - has never worked reliably because it depends on accurate filament usage estimates.","url":"https://forum.creality.com/t/cost-of-filament-used/48216","productLine":"thirdparty","version":"7","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":4,"views":856,"likeCount":2,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"d6008512fd9c519f","topicId":48153,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-17","lastActive":"2026-02-23","title":"Creality Print Calibration models produce non-manifold errors?","originalText":"While setting up to print the Temperature calibration tower, I generated the internal CP temp tower and got this error:\n\n image 476×229 21.5 KB \n\n Really?\n\n I think I’m going to go back to V6.\n\n CP 7.0.0.4127\n\nThat’s a well known bug in the original Orca script. Simply click repair and it will make the error go away. This does not affect the model.\n\n For those curious, the reason why this come up is because in the original Python script that generates the temp tower, what it does is take and oversized model, calculate the layers and then cut the model to the top temp. So let’s say you have temp tower with these parameters.\n\n image 873×427 13.7 KB \n\n What you get is a 9 layer cake of temps.\n\n image 821×1135 105 KB \n\n If you slice it without correcting the open manifold, it does not affect the model.\n\n image 1113×1299 274 KB \n\n The full model can be found in the resource folder in the app itself.\n\n image 1328×586 17.9 KB \n\n If you tried to import the root STL, it’s actually 370mm tall, too tall for even the K2 Plus.\n\n image 719×1580 156 KB \n\n An illustration of how that can be used to punk a friend \n So for those mischievous folks who might want to punk a colleague. Here’s a trick which will show you how the temp tower actually works by simply replacing the Temperature_tower.stl with another model.\n\n \n Rename the old model to .STL_OLD \n Copy any model of your choosing to the resources directory and rename it Temperature_tower.stl\n\n image 1340×546 44.8 KB \n \n Now when they run the calibration, this is what they will see and likely say “WTF???”\n\n image 1339×1447 284 KB \n\n Yes, I know, very immature but hey, if you can’t have fun with your friends, who can you have fun with?\n\nI’m hitting this same issue and have found that I cannot solve this issue simply by “clicking repair”. Since Apparently I’m not using a windows machine. I’m really surprised to learn this can’t be fixed with a non-windows machine. Some warning about its incompatibility would have been nice to know before purchasing unit.\n\n Object name: temperature_tower\n\nSize: 44.49 × 10.00 x 90.00 mm\n\nVolume: 20634.2 mm?\n\nTriangles: 13052\n\nError: 14 non-manifold edges\n\nTips: “Fix Model” feature is currently only on Windows. Please repair the model on Creality Print(windows) or CAD softwares.","url":"https://forum.creality.com/t/creality-print-calibration-models-produce-non-manifold-errors/48153","productLine":"cloud","version":"","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":4,"views":378,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f00a43ef45c47b91","topicId":48166,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-17","lastActive":"2026-01-20","title":"Can not find K2 on local wifi in Creality Print software","originalText":"I want to direct my printer through my local wifi network instead of sending everything to the cloud. The software just won’t find it.\n\n \n Scanning automatically won’t work. \n IP Adress is not found. \n Webpage version through ip:port DOES work. \n \n All I got is the cloud and the app and I’m getting a little tired of having to send a print job five times because the cloud times out on me or not being able to actually check my stuff on the camera more quickly because, again, the cloud times out.\n\n Anyone got tips?\n\nWhen you checked from LCD panel and verified that it was connected to your WIFI, was the IP address that it used to connect to your local WiFi on the same LAN as your computer?\n\n When you pinged that IP address did you get a reply?\n\nI still wonder why Creality doesn’t give the option to set a FIXED/STATIC- IP-address…","url":"https://forum.creality.com/t/can-not-find-k2-on-local-wifi-in-creality-print-software/48166","productLine":"cloud","version":"","problemType":"compat","model":"K2","grade":"有效","replyCount":6,"views":241,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"297c4c2877dd899f","topicId":48162,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-17","lastActive":"2026-01-17","title":"Bad slice model with hole on bottom polygon","originalText":"Holes on buttom polygone havn`t cut.\n\n photo_2026-01-17_18-59-23 827×555 152 KB \n\n photo_2026-01-17_18-59-19 910×572 77.6 KB","url":"https://forum.creality.com/t/bad-slice-model-with-hole-on-bottom-polygon/48162","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":11,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d7322a6c1c3d032e","topicId":48105,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-15","lastActive":"2026-01-15","title":"BUG REPORT- CAD model looks OK, STL looks OK, CP sliced model not right","originalText":"This is the first time I’ve seen this happen. Every part of the process comes out OK until I slice the model in CP 7.0.04127.\n\n In fact I sliced the model in CP 5.1 and it worked OK.\n\n I sliced the model in CP 6.2 and it failed.\n\n This is the model in FreeCAD:\n\n Top view:\n\n 001 759×974 33.5 KB \n\n Cut-away showing the side cutouts and how the wall has no issues vertically:\n\n 003 1697×849 33.1 KB \n\n Angled view:\n\n 002 1269×1448 104 KB \n\n The STL as viewed in FreeCAD, with a cut-away view:\n\n 004 1728×906 29.8 KB \n\n The STL as viewed in Windows 3D Viewer:\n\n 005 3369×1888 120 KB \n\n The RAW STL loaded into CP 7.0:\n\n 006 1452×1688 99.6 KB \n\n The STL rendered in CP 7.0 (notice the vertical wall is NOT straight and has a step in it?):\n\n 007 1737×1815 344 KB \n\n Layer by Layer view showing the step out in the wall:\n\n 008 1920×1786 331 KB \n\n The same sliced file in CP 5.1- looks like it should with no problems in the wall:\n\n 009 1378×2011 325 KB\n\nHave you tried to repair the file ? In the slicer, right click on it and then “repair” !\n\nThat did not work, but what I did find was that if I changed the settings profile, the slicer worked. I narrowed the problem down to the setting Precision\\X-Y Contour compensation which was set to 1.0041. I changed this to 0 and it fixed the slice.\n\n I think there is a bug in CP because any value other than 0 causes PART of the model to scale out- not the whole model.\n\n Tray (Meshed).stl (501.4 KB)\n\n Model attached if anyone can check on their end?","url":"https://forum.creality.com/t/bug-report-cad-model-looks-ok-stl-looks-ok-cp-sliced-model-not-right/48105","productLine":"print","version":"5.1","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":59,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"f398d323338529f3","topicId":48101,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-15","lastActive":"2026-01-15","title":"STL breakup feature bugged","originalText":"The feature where you break up an stl in creality print into component/seperate pieces has a bug. Whenever I do it I get the error that there is no existing stl even though my model shows still\n\nHello ! Try to repair your model before cutting it ! Right click on your model and then “repair” !","url":"https://forum.creality.com/t/stl-breakup-feature-bugged/48101","productLine":"print","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":47,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"c2b508dc5d44eb3d","topicId":48036,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-12","lastActive":"2026-02-04","title":"Unable to use Creality Scan 4","originalText":"I’m trying to use my Ferret for the first time, but I can’t get the software to work. When I start the software, it pops up a message saying the scanner is connected. It then launches a dialog for Performance Testing. It has a circular status indicator that initially starts spinning as expected, but it quickly just freezes. Shortly after that, my whole computer freezes. I have to do a hard reset to get it to come back. I’ve tried letting it sit for a few hours, but it doesn’t get beyond that testing.\n\n I don’t have the most up-to-date computer, but it seems like it should work.\n\n CPU: Intel Core i7 9700K @ 3.60GHz\n\n RAM: 64.0GB Dual-Channel DDR4\n\n Video Card: AMD Radeon RX 7800 XT 16GB\n\n I have the latest video card drivers, and I’m plugging the scanner directly into a motherboard USB 3.0 slot (I’ve tried different ports, as well.). Is there anything I can do to use this scanner with my current hardware? Could an older version of Creality Scan still work?\n\n p.s. In searching for answers, I’ve seen a few posts saying official support is done through Facebook. Is that true? I don’t have a Facebook account, and I really don’t want one. I’m hoping to get some help here.\n\nSame here, 11700k\n\n AMD 7900 xt, current driver 26.x\n\n Otter up to date, newest software\n\n Disconnect everything, reinstall creality scan connect i can do one scan, make one error and the software freezes, you close the software open it again → performance check → freeze, need to hard reset cant use it until i reinstall, i learned to never go back, going back or doing something that would make the software think more than 3 seconds → reinstall\n\n Fresh otter, out of the box, unusable, 22d later and this post does not even have a reply yet this thing will go straight back to the dealer im not sitting around here with that lol …","url":"https://forum.creality.com/t/unable-to-use-creality-scan-4/48036","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":214,"likeCount":1,"tags":["3d-scanner","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"8dee7622273b9f95","topicId":48005,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-11","lastActive":"2026-01-11","title":"Manual / XYZ Control is missing from my installation Upgrade of V7.0.0.4127","originalText":"Since I updated to V7.0.0.4127 the XYZ Control Tab is now gone. The printer is a CR10-SE, and I do see live updates on Bed Temperature, Nozzle Temperature, and Fan Speed. The controls were there with V6.x.x.x, is it now not supported with my printer, as I have seen a few messages on my Android App stating it was now unsupported and reverting back, or something like that.","url":"https://forum.creality.com/t/manual-xyz-control-is-missing-from-my-installation-upgrade-of-v7-0-0-4127/48005","productLine":"cloud","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":31,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"26971dba5d2b12d5","topicId":47928,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-01-10","lastActive":"2026-01-10","title":"Generation manuelle des support avec l'option de la fonction preparer(peindre des supports)","originalText":"je cherche a générer manuellement des supports avec la fonction peindre des support de l’onglet preparer.\n\n tout fonctionne bien, je visualise l’emplavement de mes supports en vert, mais apres le tranchage, ils ont disparus et ne sont pas generer. quel qu’un peut m’aider a resourdre mon problème. merci d’avance.","url":"https://forum.creality.com/t/generation-manuelle-des-support-avec-loption-de-la-fonction-preparer-peindre-des-supports/47928","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":54,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"85bda4b760fab76a","topicId":47893,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-09","lastActive":"2026-01-14","title":"Strange Problem with Creality Print 7 and Custom Layer Change G-Code","originalText":"FYI.\n\n I had been using the command BOX_NOZZLE_CLEAN in the layer change g-code for my K2 Plus machine so that it would “clean” buildup off the nozzle at intervals during a long print. This worked great in Creality Print 6. But it stopped working after I upgraded(?) to Creality Print 7 !\n\n After digging into it I found that CP7 has a bug that removes any custom g-code text consisting of double Z characters. In other words, it took my layer change g-code with ‘BOX_NOZZLE_CLEAN’ and spits it out to the G-code file as ‘BOX_NOLE_CLEAN’, where the ‘ZZ’ is missing in the word NOZZLE. It doesn’t do this with other double letters, only the letter Z, and it has to be an uppercase Z. Lowercase works fine, as I changed it to ‘box_nozzle_clean’ or even ‘BOX_NOzzLE_CLEAN’ and then it works as it did with CP6.\n\n I opened a Tech Ticket with Creality notifying them of this issue. Not sure what Creality did to make CP7 behave like this, but it makes one wonder what other ‘subtle’ problems are lurking in CP7 ?\n\nVery interesting topic. Have you attempted another slicer such a Orca to see if you can reproduce this?\n\n Do you have an isolated model and 3MF file that you care to share and a method to reproduce this? I’d be glad to test it at my end to see if the problem can be reproduced in other slicers. Also, sharing the raw G-Code file to compare results would also help.\n\nI don’t think the model or the 3mf file has any bearing on the problem. I run the same model with CP6 and the examined the g-code, the words “BOX_NOZZLE_CLEAN” are there in the g-code just fine.\n\n But slice the same model with CP7 and the “BOX_NOZZLE_CLEAN” becomes “BOX_NOLE_CLEAN” in the g-code file. I also tried various other words shown below and the results for CP6 and CP7.\n\n FIZZ - CP6 outputs FIZZ, CP7 outputs FI\n\nBUZZER - CP6 outputs BUZZER, CP7 outputs BUER\n\n It’s definitely something wrong in CP7.","url":"https://forum.creality.com/t/strange-problem-with-creality-print-7-and-custom-layer-change-g-code/47893","productLine":"print","version":"7","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":3,"views":185,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7f428d3f32e678c1","topicId":47839,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-07","lastActive":"2026-01-11","title":"What have I done wrong in my slicer?","originalText":"Hi Everyone,\n\n New to 3d printing and I’m playing with my new Creality K1 printer. I’m using tinkercad to draw my objects, then export them to STL’s for import into Creality’s slicer.\n\n However, I’ve noticed that my object is not slicing correctly in Creality, but it is slicing correctly in Prusa slicer. You can see it in the screen shots below.\n\n Here is layer 16 where it all goes wrong in the Creality slicer:\n\n image 1392×929 161 KB \n\n And this is what layer 16 should look like, from Prusa slicer:\n\n image (1) 1392×874 305 KB \n\n Here’s my complete STL file:\n\n slicer test.stl (739.7 KB)\n\n Could anyone tell me where to start looking for what I’ve done wrong? I’d prefer to use the Creality slicer as the prints come out much better with it, even though I’m pretty sure I’ve copied over all the correct settings for the K1.\n\n Thank you,\n\n Tim\n\nHello @7604timo \n\nWelcome to the Creality Forum…! \n\n I checked your stl and it worked fine on Creality Print.\n\n The warning message you are getting in the yellow pop up (bottom left) means that the model is not laying on the bed flat and it needs supports. Somehow Creality Print turned it upside down..? Turn the model so the flat side is down.\n\nTurn off lite mode. It hides the infill by default in case you have a crappy pc. Lite mode is on the preview screen above the line type list. It will print - just not display.","url":"https://forum.creality.com/t/what-have-i-done-wrong-in-my-slicer/47839","productLine":"thirdparty","version":"","problemType":"ui","model":"K1","grade":"有效","replyCount":9,"views":314,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"3f4bbc013aa6104d","topicId":47791,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-07","lastActive":"2026-01-08","title":"TPU printing Help how to configure settings in Creality Print V7 for Ender-3 V3 SE","originalText":"Hey there everyone I’m very new to 3D Printing in general and more than a bit Autistic so as much detail you can give in your answers would be appreciated greatly but I have a Creality Ender - 3 V3 SE printer and while I have been using Creality Print for slicing and making my Gcode and using I have had great success with PLA and I got some TPU and my first few attempts have me very discouraged the flow that’s coming out of the print nozzle is incredibly inconsistent with it making these 1-2mm globs then 1-2mm thin strands creating walls that are more like infill the current setting preprogrammed in Creality Print V7 don’t seem to work and the info I can find about printing with TPU is either very vague or meant for another brand of printer or software specifically so any help in setting up the printing settings inside Creality Print V7 to print with TPU on an Ender 3 V3 SE would be greatly appreciated\n\n The TPU filament is 95A and has a label stating print temps 190c to 210c for 50-80/mm/s and 210c to 230c for 80-120mm/s\n\nHi Joey,\n\n We use 95A TPU on a Ender s1plus, its fairly similar to the SE, we use bed temp 70 and nozzle of 228. Check your Z clearance so that it gives an even and squished line of filament on the surface, it should not be round topped as it is too far away from the bed.\n\n When you have got this about right, do not calibrate before every print! Saves time and reduces the alterations you need to make to get a decent print.\n\n K","url":"https://forum.creality.com/t/tpu-printing-help-how-to-configure-settings-in-creality-print-v7-for-ender-3-v3-se/47791","productLine":"print","version":"7","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":2,"views":282,"likeCount":0,"tags":["crealityprint","trouble-shooting","ender-3-v3-se"],"relReason":"tag","sourceType":"用户"},{"uid":"09dfe8024b842b07","topicId":47819,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-07","lastActive":"2026-01-08","title":"Creality Print 6 - 7","originalText":"With all the issues surrounding the latest version of Creality’s slicer I’m interested to know if anyone has just completely scrapped the slicer altogether and began using a different slicer? If so what slicer are you using that seems to be the most seamless transition from Creality? For me it is VERY frustrating that Creality appears to have little to no interest in correcting the issues and customer satisfaction has no place in their business model, further I would not be surprised if the Creality following does not abandon ship and support another manufacturer .\n\nWe are using v6 and upto 6.32etc released in Sept25.\n\n The issues seem to come after that version.\n\n We have 13year olds and older using 24 Ender3 v3 ke’s with very little trouble! maybe 1 print in 30 goes wrong…usually pilot error, wrong materials, temperature or adhesion method. Use the standard settings mostly….some students are even sending their prints wirelessly! a great improvement over Ender3 v2’s which we used up till last spring.\n\n You could use Cura slicer!\n\n K","url":"https://forum.creality.com/t/creality-print-6-7/47819","productLine":"thirdparty","version":"6","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":2,"views":115,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"b1ed5ed24e7b23db","topicId":47832,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-01-07","lastActive":"2026-01-07","title":"Calibrage","originalText":"Bonjour ayant une CR 10 SE et utilisant créality print 4,3 ( qui me convient ès bien ) , je n’arrive pas à obtenir des cotes parfaites ,\n\n Par exemple quand je dessine sur FreeCad un axe de diamètre 15 , j’obtiens à l’impression j’ai toujours un diamètre supérieur , pareil avec les trous , bien sûr je compense en dessinant + ou – mes cotes ,\n\n Dernier exemple , je voulais emboîter deux pièces , 1 de diamètre 32 mm et l’autre de 31,9 disons , il ma fallut dessiner 5 pièces pour arriver à la bonne cote\n\n Ma question : comment calibrer au plus jute mon impression ?\n\n Existe t’il des modèles de calibrage avec solution ?\n\n Merci d’avance !\n\n Claude","url":"https://forum.creality.com/t/calibrage/47832","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":29,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"d636210a599cf448","topicId":47764,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-06","lastActive":"2026-01-14","title":"The brand-new Creality Print 7.0 is here!","originalText":"606889692_1326482229517462_3028381345922860521_n 1080×1350 125 KB \n\n The brand-new Creality Print 7.0 is here!\n\n AI now analyzes your 3D model and recommends the optimal support type — or determines whether supports are even needed at all — just one tap to analyze, powered by AI.\n\n Creality Print 7.0 also brings an upgraded print algorithm for higher quality print, optimized device control, and algorithm-driven waste reduction for switching filaments. There’s plenty more to explore.\n\n Check out Creality Wiki for the full feature list of Creality Print 7.0 and more.\n\n Creality Print 7.0.0 Release Notes | Creality Wiki\n\nloving the new 7.0 learning fast\n\nNeeds a lot of work…","url":"https://forum.creality.com/t/the-brand-new-creality-print-7-0-is-here/47764","productLine":"print","version":"7.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":601,"likeCount":2,"tags":["featured","crealityprint","crealityprint-7"],"relReason":"tag","sourceType":"用户"},{"uid":"7529d492fbe2ce18","topicId":47756,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-06","lastActive":"2026-01-06","title":"Why is my brim doing this. never had this before 7.0","originalText":"Instead of going around completely, it is diving into the next part and then kind of starts again.\n\n image 1920×805 110 KB","url":"https://forum.creality.com/t/why-is-my-brim-doing-this-never-had-this-before-7-0/47756","productLine":"print","version":"7.0","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":47,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"fa0dcb15add27ed0","topicId":47754,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-05","lastActive":"2026-01-17","title":"Creality print speed setings","originalText":"does anybody elss have a problem where they are adjusting the speed detings in creality print, but it doesn’t do anything? I have a K1, and it can print up to 600mm/sec, so i go to the speed setings using hyper PLA, set it to 500mm/sec and it doesn’t efect it at all.\n\nmax speed will always be restrained also by the object geometry, usually you can only get max speeds with very simple shapes / calibration files\n\noh ok, thanks.","url":"https://forum.creality.com/t/creality-print-speed-setings/47754","productLine":"print","version":"","problemType":"other","model":"K1","grade":"有效","replyCount":3,"views":87,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"64a85c323a6fc490","topicId":47743,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-05","lastActive":"2026-01-05","title":"laying 1 object on top of another without sinking to build plate","originalText":"I designed a housenumber and name sign. I want to print a background of 1.5mm in black and a detailed forgound with small unconnected elements in white on the foreground. Also 1.5 mm.\n\n When i try to assemble the objects i end up with the foreground sunk into the background.\n\n I also tried to move the background below the build plate before assembling, but i can not move it further down than about half.\n\n Anyone have a solution? Or a link to a solution?\n\n Greetz,\n\n Rik Lijkendijk","url":"https://forum.creality.com/t/laying-1-object-on-top-of-another-without-sinking-to-build-plate/47743","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":266,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"ce58b345ead4d672","topicId":47717,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-04","lastActive":"2026-04-04","title":"Version CrealityPrint_7.0.0.4127 GPU pinned at full usage","originalText":"issue with max gpu usage only on preview tab of CP 7, happens on both my Framework 13 ryzen 7840u and desktop ryzen 7700x / rtx3060 12gb\n\nI’m running fine on Intel cpu. Sounds like another bug. Support does not monitor the forums much. Could you send the details to support@creality.com or cs@creality.com I think they go to the same place, but Creality has not yet verified that.\n\nDoes this happen while slicing? In that case it might be an issue with the model. You coul try a new project and add (for instance) the torus from the testing primitives. If that does not ave the same problem the the issue is with the model. Otherwise you might check for the latest drivers for your GPU.\n\n I run V7 on my desktop (AMD Ryzen 7900X with GForce RTX4060) and everything works perfect.\n\n Good Luck","url":"https://forum.creality.com/t/version-crealityprint-7-0-0-4127-gpu-pinned-at-full-usage/47717","productLine":"print","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":14,"views":310,"likeCount":1,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"40bcfb9a27a724be","topicId":47720,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-04","lastActive":"2026-01-05","title":"CrealityPrint-V7.0.0.4127-x86_64-Release.AppImage On Linux","originalText":"Just got my K1C yesterday, and I’m pleased that the AppImage works GREAT in Ubuntu 24.04.\n\nThanks. That is good to know. There are some issues with the Windows version and lots of wish we were running Linux. Ubuntu is one of my favorites.\n\nI’ve run Linux for a very long time. Ubuntu LTS seems to be so stable and easy to work with that it’s my fall-back. The concerns with Linux is alway wondering what will/won’t run on it.\n\n Steam has brought gaming to Linux So I was actually able to delete those old windows partitions and use the space for steam games.\n\nWorking with my old 3d printer (creality 10s) I was glad that UltiMaker-Cura-5.11.0-linux-X64.AppImage ran perfectly as well. I used it to convert stl to gcode just fine.\n\nHappy printing!","url":"https://forum.creality.com/t/crealityprint-v7-0-0-4127-x86-64-release-appimage-on-linux/47720","productLine":"thirdparty","version":"","problemType":"compat","model":"K1C","grade":"有效","replyCount":3,"views":558,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"2bd325865da9daa4","topicId":47690,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-03","lastActive":"2026-01-04","title":"Calculator function in input fields","originalText":"I’d like to see a math calculator function added to all the input functions. In most cad/cam programs you can type in either (254x.03947) or (254/25.4) or even (10IN) or (254MM) and it will do the calculation and input the conversion automatically.\n\nThat would be a really convenient feature. I hope they add it.","url":"https://forum.creality.com/t/calculator-function-in-input-fields/47690","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":29,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"80b9a3de3978c78e","topicId":47678,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-03","lastActive":"2026-01-04","title":"How to Modify a drill hole","originalText":"is there a way to modify a drill hole?\n\nI would use a drill.\n\n Could you possibly be more cryptic? I left my mind reading glasses on the bus.","url":"https://forum.creality.com/t/how-to-modify-a-drill-hole/47678","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":86,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"5a9bca799ba5e705","topicId":47658,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-02","lastActive":"2026-01-02","title":"What's wrong with the Android app:","originalText":"I updated both the K1 Max printer’s software and Creality Print app. The only way I can see the progress visually on my android app now is to shut it down and restart it. It does not refresh otherwise. The previous version would update as soon as opened the window. This one gives me a black screen, but the progress bar updates. I have to close the app, open it up again and press the play button in the black scree to see the progress. BTW, why do I need to press the play button at all? The previous version worked fine. I opened the window and it ran. I could check back later by opening the app, and it would show me the video progress. Anyone else having this issue?","url":"https://forum.creality.com/t/whats-wrong-with-the-android-app/47658","productLine":"cloud","version":"","problemType":"ui","model":"K1 Max","grade":"有效","replyCount":1,"views":48,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"e97ac0126981a1a8","topicId":47627,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-01-01","lastActive":"2026-01-01","title":"Using KAMP with Orca Slicer","originalText":"If you can tell me how to get KAMP to work on Orcaslicer, I would appreciate it. I’d prefer Orcaslicer over CP due to the nightly builds they release with special features…but my bed likes to warp a bit too much to give a consistent first layer\n\nHiya! Welcome to the Forum!\n\nWhich printer are you using?\n\n The easiest way is to root the machine, if that option is available.\n\nI had thought Orca has the KAMP features built in to it. It’s been a long time since I’ve run a vanilla unit.\n\nThere should be a few entries to check in the printer.cfg file.\n\n I can write a book on warping issues! See some of my other posts, I’m no stranger to intrusive countermeasures. I’ve tried everything from foil tape to a 28oz Hammer. Can’t tell you how much filament I’ve used running off 1st layer tests\n\n Print a full bed area 1st layer. See where the issues are.\n\nHeat the Bed to 100C, Keep it there for at least 45 Min, I did it for 3 hrs.\n\n**When you reduce the heat, do so 10C at a time over 10 minutes, So 1C per minute cooldown path.\n\nYou can bring it right down to room temp once you’ve gone below 40C.\n\nWhen you let it heat back up to print temp, let it sit there for at least 10 min before you print.\n\nSee what your 1st layer looks like now.\n\nOptional: One thing that helped…putting dial up - spring tension wheels on.\n\n Hope it Helps!\n\nI noticed that I forgot to mention that you can look at your bed levelling data if you’re on a network.\n\nType in your IP the # and home\n\nxxx.xxx.xxx.xxx/#/home","url":"https://forum.creality.com/t/using-kamp-with-orca-slicer/47627","productLine":"thirdparty","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":416,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"0a569016bd0b76ec","topicId":47597,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2025-12-31","lastActive":"2026-01-19","title":"Creality Print v7.0.0.4127 - Adware:Win32/Tnega Detected in \"Remove-Edge.exe\" by Windows Defender","originalText":"I installed Creality Print v7.0.0.4127 on my Windows 11 laptop. A subsequent scan by Windows Defender detected the following…\n\n Screenshot 2025-12-31 075402 666×506 8.8 KB \n\n This i
