page and click “Cloud Slice”, select the file you want to slice and click “Try the new slicer” when you enter the slicer. \n \n 1 1511×808 73.4 KB \n\n 2 1369×811 26.6 KB \n\n \n When adding a printer for cloud slicing, the setup wizard will guide you. Select your printer and nozzle size, then click “next” to proceed to the material page, where you can choose your filament type and brand. \n \n 3 1026×755 24.7 KB \n\n \n We’ve improved the toolbar on the new page. Now, you can easily add or change printers and edit filament settings through the pop-ups. \n \n 4 1908×909 41.1 KB \n\n \n The process mode “Standard” offers official presets for your printer, and you can adjust these settings based on different process modes. For “Advanced” mode, you can extend more options for quality, strength, speed, and support configurations. You can switch back to the classic slicing view using the button at the top left corner. \n \n 5 491×632 16.3 KB \n\n \n Once you’ve edited the parameters, you can preview them. If everything looks good, complete the cloud slicing. \n \n 7 745×711 20.1 KB \n\n Remember to bind your printer to the App workbench and start printing. The Creality Cloud Web platform will also display your printing status in real time.","url":"https://forum.creality.com/t/creality-cloud-web-built-in-slicer-engine-upgrade/22420","productLine":"cloud","version":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":715,"likeCount":0,"tags":["blog","creality-cloud","slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"b23a653c2d3120f0","topicId":22280,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-11-19","lastActive":"2025-09-16","title":"CR-200B CREALITY PRINT PROFILE?","originalText":"Hello everybody.\n\nI have a CR-200B which until now I have been using with Creality Slicer 4.8.2.\n\nI want to use Creality Print 5.1, but I don’t have the printer profile for this software.\n\n Could someone tell me where to find it or how to create it from Slicer 4.8.2?\n\n Thanks in advance.\n\nCreality seems to have forgotten about us CR-200B owners as if we were a nightmare.","url":"https://forum.creality.com/t/cr-200b-creality-print-profile/22280","productLine":"print","version":"5.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":254,"likeCount":2,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"b7b5f1ed058602aa","topicId":19488,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-10-08","lastActive":"2026-03-14","title":"Exporting Material settings","originalText":"I’ve had too many fatal errors with CP 5 where I have the perfect material settings and then CP just wipes them out never to be seen again. This has caused major headaches. That being said: Is there a way to export “Material Settings” that I am not seeing? I want to have a record of Walls, speed, acceleration…settings. The only thing I am seeing in that panel is “Add, subtract, sync, edit and save as”. No export.\n\nI needed this today and figured it out. Leaving this here for posterity.\n\n For Creality Print v5: File > Export > Preset Config (exports all presets)\n\n For Creality Print v7: File > Export > Export Presets (allows you to pick which presets)\n\n Both export all settings as a ZIP archive with JSONs of each setting. They can be imported (even between versions) using the same process as before but using the “Import” menu.","url":"https://forum.creality.com/t/exporting-material-settings/19488","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":442,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"34879b982201908f","topicId":17811,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-09-12","lastActive":"2024-10-13","title":"Prints are getting ribs on my K1 max","originalText":"I don’t know why but my prints with creality 5.x.x. suddenly get ribs (lines of the mesh on the outside) the surface is not smooth as it should be.\n\nI have the latest update creality slicer.\n\n Anyone have any idea’s what could be wrong???\n\n It does it with all materials as pla, petg…\n\nThere could be a few mitigating factors, which version of CPrint are you using? Some versions work better than others, some are just painful to use. Creality has a repository of older versions.\n\nCould you post a pic of the issue?\n\nDo the “ribs” correspond to your infill pattern?\n\nThese are a few options that may contribute (V5.1.1.9490)\n\n Screenshot 2024-09-12 214821 1085×962 137 KB \n\n Hope it helps!\n\nhere is a picture\n\n 20240913_150533 1920×2560 275 KB \n\n it looks very ugly.\n\n the one wall on top setting I have already that box checked\n\n I have the latest version 5.1.4.10249.","url":"https://forum.creality.com/t/prints-are-getting-ribs-on-my-k1-max/17811","productLine":"print","version":"","problemType":"quality","model":"K1 Max","grade":"有效","replyCount":8,"views":461,"likeCount":1,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"aed0f18b10d4bf01","topicId":14442,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-07-17","lastActive":"2026-04-25","title":"Gcode Export Failed","originalText":"Hello, on certain models I try to slice I keep getting \"gcode export to (insert my pc filepath here) failed. Cannot open the file for writing.\n\n It happens randomly and only on certain models that I download the .stl file from. Any ideas?\n\n Thanks,\n\n-Glenn.\n\ndid you find any solution ?\n\nTake a look in here:\n\nC:\\Users[UserName]\\AppData\\Roaming\\Creality\\Creative3D\\5.0\\tmpProject\n\nAssuming Windows 11","url":"https://forum.creality.com/t/gcode-export-failed/14442","productLine":"print","version":"5.0","problemType":"other","model":"未标注","grade":"有效","replyCount":8,"views":1022,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"b934e8b08c8decbe","topicId":13425,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-06-25","lastActive":"2024-10-31","title":"Solved Creality print 5.0.3.8744 object deletion no langer active","originalText":"creality print 5.0.3.8744 is my version.\n\n I have lost the function object deletion, the object deletion screen is still there, but no objects to delete are on it while I am printing.\n\n objectdeletion 2175×1113 104 KB \n\n A few days ago it was all functioning well but now suddenly it has gone\n\nI already downloaded this latest version but with the same result\n\n Also on the little screen on my K1 max object deletion is gone, no green X anymore???\n\n It is solved :\n\n you have to check the checkbox “exclude objects” in creality print 5.0.\n\nWhere is the “checkbox” you speak of in Creality Print 5 and how does that affect the printer screen?\n\nIt is under others (set advanced “on” to see it under others)\n\n objectexcl 2247×1294 130 KB \n\n It affects On the printer screen by putting an extra symbol “X” on that screen which you can enter when you want delete a certain object and then select that object to exclude it from further printing.","url":"https://forum.creality.com/t/solved-creality-print-5-0-3-8744-object-deletion-no-langer-active/13425","productLine":"print","version":"5","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":8,"views":1933,"likeCount":2,"tags":["slicingsoftware"],"relReason":"tag","sourceType":"用户"},{"uid":"c92a712e20f8850f","topicId":12204,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-06-01","lastActive":"2024-11-13","title":"Missing Creality print 5 for linux","originalText":"Hello, I would like to use the Creality Print for Linux.\n\nI noticed that the Linux and mac os version are very outdated when compared to windows version.\n\n I bought a flagship printer that was supposed to support linux users too.\n\nWhen will we have access to creality print 5?\n\n thank you\n\n+1\n\nany news?\n\nthank you\n\nEven just an update would be nice. Almost looks as if they dropped support for Linux/MacOs.\n\nBut it might not be a wise idea to update to 5.x\n\nI just updated my windows version to 5.1 and my printer (Ender 3 V3 SE) is now printing horribly. After initial print of the brim and supports, it sounds like the nozzle is just dragging across the print, and I’m get random AI noodling detection. I have tried re-calibrating everything and even factory reset the printer. But still having major print issues. Switched back to 4.3.8.x, and all is good again, I didn’t even have to re-calibrate the printer.","url":"https://forum.creality.com/t/missing-creality-print-5-for-linux/12204","productLine":"print","version":"5","problemType":"compat","model":"K1 Max","grade":"有效","replyCount":6,"views":1397,"likeCount":3,"tags":["crealityprint","creality-k1-max","slicingsoftware","crealityprint-v5"],"relReason":"tag","sourceType":"用户"},{"uid":"d08c44de98e1dccd","topicId":10919,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-05-14","lastActive":"2025-09-12","title":"Why is there not a LW-PLA Profile in Creality Print?","originalText":"Both the latest K1 firmware update and the slicer update have improved my prints. But I still do not see a profile for LW PLA. Is there an intention to include a profile anytime soon? Or is there a good profile in the community (which uses Creality Slicer)?\n\nI print mostly RC planes and it would be great to use the Creality Slicer and K1 as it prints most other materials very well.\n\nThe foaming differs a lot from manufacturer to manufacturer. Since Creality has no LW-PLA that they sell which I would be aware of, they probably don’t add it because for example Eryone LW PLA would need a much different setting than Polymaker LW PLA.\n\nCreality does have a lw-pla now. It is a hyper type that prints the speeds of regular pla they say. As for other brands of lw-pla you might have to create your own profile or look to other communities for info on profiles for the k1 series printers. Im woring on creating my own for other brands of the filament.","url":"https://forum.creality.com/t/why-is-there-not-a-lw-pla-profile-in-creality-print/10919","productLine":"firmware","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":3,"views":1777,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1b66371de146bae8","topicId":10730,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-05-11","lastActive":"2026-03-28","title":"Bug Report：Creality_Print-v5.0.0.8636,Exhaust fan never turned on","originalText":"I tried to set the value of Active Air filtration from 0,1,255,but the exhaust fan never turned on for my K1C.I have to turned it on manually every time,this never happens when using creality print 4.3.\n\n Can any one tell me how to set correct value for this parameter or this is a bug for creality print?\n\n screen 707×252 18.3 KB\n\nleavic: \n \n I tried to set the value of Active Air filtration from 0,1,255,but the exhaust fan never turned on for my K1C.I have to turned it on manually every time,this never happens when using creality print 4.3.\n\n Can any one tell me how to set correct value for this parameter or this is a bug for creality print?\n\n \n \n basic info 1440×1088 59.8 KB \n\n toip icon on the left (printer) then click the edit pencil\n\n click advanced top right\n\n click tab basic information, Accessory and then\n\ncheck the auxiliarly cooling fan untill it lights up green\n\nThanks for reply.\n\nI’ve double checked and pretty sure those options are enabled here,still not working.When printing,all fans worked except the Back(Exhaust)fan.\n\n screen23 928×297 20.2 KB \n\n Something strange is that this option is only a check box in orca slicer,I don’t quite understand why here is a text box for creality print,which value am I supposed to enter here?\n\n screen1 512×242 8.77 KB \n\n The creality print 5 seems like a forked orca slicer combining old creality print4.Too many bugs here and I’ve rolled back to creality print 4.3 until they build a new release which I hope could be better.\n\n Another tiny bug is there is no total layer count when printing,which is not so serious but still annoying.\n\n bug1 353×147 5.4 KB","url":"https://forum.creality.com/t/bug-report-creality-print-v5-0-0-8636-exhaust-fan-never-turned-on/10730","productLine":"thirdparty","version":"4.3","problemType":"other","model":"K1C","grade":"有效","replyCount":18,"views":1545,"likeCount":2,"tags":["crealityprint","crealityprint-v5"],"relReason":"tag","sourceType":"用户"},{"uid":"e1f49ba1919b0aa0","topicId":10248,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-05-01","lastActive":"2026-03-09","title":"How to get things the correct size?","originalText":"Hi all. When I do a drawing in sketchup I save it as an STL file after I size the drawing in units (i.e. inches) that I want to end up with. For example I want a disk to be 2 inches in diameter. If I print it as it ends up in the printer I get something tiny (1/4\") If I scale it at 1600 it looks right but there is no way to tell until it prints. It is just trial and error. Is there a way that I can print it so it ends up with the dimensions defined in the original sketchup drawing?\n\nCould it be that you are mixing metric and imperial units?\n\nIf you are using Creality Print there is a ruler where you can measure the prints on their X, Y or Z axis. It’s in mm so you will have to do some converting… \n\n Also maybe try and test a simple disk in Tinker Cad or something and see how that compares. It might just be the sketch program…","url":"https://forum.creality.com/t/how-to-get-things-the-correct-size/10248","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":17,"views":12319,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"3e066253cb276dab","topicId":10157,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-04-30","lastActive":"2026-04-01","title":"Creality Print 5.0.0 Release and Above Version Upgrade","originalText":"pic1 1280×640 51.7 KB \n\n W e are delighted to announce that the brand new version 5.0 has been released officially, with all upgrades aimed at improving user experience.\n\n Firstly, with a new user interface and interaction experience, the process settings system has become simpler, and the slicer has become more user-friendly and intelligent. The K series/v3 high-speed machines now support 42 kinds of official filaments and general parameters. We have not only readjusted the machine process parameters, but all parameters can be saved and exported for sharing.\n\n Moreover, through our ongoing efforts, version 5.0 has faster printing speed and better printing quality.Now let’s see together what other surprises there.\n\n 1. Key Improvements \n 1.1 Revolutionary User Experience \n Comprehensive Upgrade of UI \n \n With the upgrading of the company’s Corporate Identity (VI) system to version 5.0, we have rolled out a fully revamped UI system. A brand-new logo, theme color, icons, and page layout will be introduced to provide users with a fresh visual experience. \n \n pic1 1280×640 51.7 KB \n\n \n We adjusted the UI layout after the upgrade according to mainstream visual habits: we repositioned the toolbar and prioritized the process setting systems. This made the operation interface clearer, not only reducing the operation steps for settings, but also greatly enhancing the smoothness of the user experience. \n \n 1280×693 250 KB \n\n Printing Becomes a Piece of Cake \n \n After extensive model testing and parameter adjustment, we have developed several configurations for different machines and nozzle types. You can conveniently select an appropriate configuration for one-click printing. For instance, we offer four configurations for the K1C-0.4 nozzle. \n We constantly monitor the processing status of the model to minimize any factors that could negatively affect print quality. Should there be any issues, our user interface will promptly provide friendly cues in the bottom-left corner, assisting users in promptly identifying and resolving the issue to minimize any potential losses. \n \n \n\n \n The variety of settings often causes confusion. For this reason, we have selected a set of commonly used parameters as the basic settings, enabling you to quickly adjust common parameters and diminish the impact of unnecessary information. \n \n 1262×477 60.4 KB \n\n \n 5.0 Version introduces a wealth of diagrams for parameters, illustrating complex parameters in an intuitive way. Along with these diagrams and elaborate descriptions, you can quickly understand the meaning of each parameter. \n \n \n\n 1153×618 82.1 KB \n\n More Efficient Process Tuning \n \n Indeed, we also accommodate more extensive parameter configurations. Simply switch to the advanced settings mode to access comprehensive parameter information, facilitating broad and meticulous adjustment. \n \n 427×565 38.2 KB \n\n Normal\n\n 428×754 55.2 KB \n\n Advance\n\n \n Evidently, the valid range of parameters is closely associated with various factors such as the types of consumables and the device model. This often makes it challenging for users to accurately judge the validity of settings. To address this issue, we have established a suitable range for each parameter and provided a color-coded input box. This allows users to easily determine the status of parameters while making changes. \n \n 832×470 52.5 KB \n\n \n Previewing slices has now become WYSIWYG - what you see is what you get. We now support real-time parameter modifications during previews, enabling you to rapidly observe the effects of your adjustments. \n \n \n\n More Convenient Professional Settings \n \n We not only support global settings but also offer flexible and detailed solutions. When printing multiple models in the same job, you can use object settings to apply individual parameters to each model. Each model is sliced with the parameters that suit it best, effectively enhancing the print quality and efficiency. \n \n \n\n \n Supports the comparison of different types of machines, materials, and process parameters. By using this feature, you can thoroughly compare the differences，to find out the key parameters affecting quality, providing guidance on the optimal direction for your printing tasks. \n \n 805×638 38.5 KB \n\n 1.2 Settings Configuration Upgrade \n \n Upgrade Of Default Parameter Configuration \n\nCreality Print provides an array of tested and official print configurations, encompassing aspects like printers, filaments, and process settings. These configurations, verified through extensive testing, are designed to guarantee successful printing in the majority of cases, and simultaneously meet essential printing needs. \n \n 820×637 52.8 KB \n\n （Printer）\n\n 801×620 55.8 KB \n\n （Filament）\n\n 428×455 23.9 KB \n\n （Process）\n\n A noteworthy update in the brand new 5.0 version is that we’ve upgraded and made great efforts to the printing configurations, with the aim of enhancing your printing experience. For instance, when printing the model in the following model on the same printer，using the default process settings of 0.2mm Standard process parameters, the print quality in version 5.0 is noticeably superior to that in version 4.3.8.\n\n 2763×1816 968 KB \n\n （5.0） （4.3.8）\n\n 3736×1816 1.33 MB \n\n （5.0） （4.3.8）\n\n \n Upgrade Of User Preset Configuration \n\nSimplify your printing process by creating custom slicing parameter presets for regular use according to your distinct print demands and habits, such as settings for other filaments. You can base these on official configurations, and save them to Creality Print, or export them as a Zip for reuse or sharing with friends. \n \n 741×575 75 KB \n\n （Printer）\n\n 813×632 59.8 KB \n\n （Filament）\n\n 476×499 45.6 KB \n\n （Process）\n\n The noteworthy aspect is the 5.0 version’s compatibility with other slicer software exported user presets, such as Prusa and Orca. This allows for a variety of configurations from different software.\n\nFurthermore, you can share and exchange your parameter configurations using 3mf project files. As a universal third-party standard file, 3mf offers richer and more accurate data descriptions compared to other formats. When using 3mf project files, not only printers, filaments, process settings, but also your databank for support coatings, Z-Seam drawing data, adaptive layer heights, etc., can be seamlessly used across multiple software platforms.\n\n 1.3 Efficient Multi-Plates Management \n In the past, when printing splicing structural models, we had to manually group a large number of models on a print plate and store them in multiple files for printing. This process was somewhat cumbersome, prone to error, and very time-consuming. Now, with multi-plates management, you can consolidate all the parts need to be printed in one file to increase convenience and operation efficiency in classifying models, making it easy to handle the printing tasks of multiple models.\n\nprimary functions：\n\n \n Supports regular operations of the plate, such as adding/removing/selecting/customizing names/locking, etc.; \n Supports automatic layout and orientation of the current tray model, and you can also manually drag to adjust; \n \n 1280×754 185 KB \n\n \n Supports saving the plates to 3MF and CXPRJ files for easy subsequent editing; \n Supports quick switching between different trays to perform slicing, previewing, and printing. \n \n 1280×753 241 KB \n\n 2. Performance and Quality \n 2.1 Faster Printing Speed \n The printing speed of the model is influenced by not only the hardware but also the slicing algorithm optimization. Thanks to algorithm improvements in version 5.0, a very apparent enhancement of printing speed, ranging potentially between 20% and 50%, though the exact percentage would vary based on model structure and printing process.\n\nThere are two key factors contributing to these speed improvements.\n\nFirst, efforts have been made to greatly increase the speed of certain types of lines, specifically the inner and outer walls, while still ensuring printing quality. As the graphic shows below, version 5.0 presents a visibly higher speed (indicated by color) for the lines of the inner and outer walls on each level compared with the previous versions.\n\n 1248×735 587 KB \n\n （Printing Time of 5.0：7h 24m 24s）\n\n 1917×1127 683 KB \n\n （Printing Time of 4.3.8：9h 4m 15s）\n\n Next, we have improved the continuity of 3D-printing paths and attempted to follow the shortest routes in the printings. Below you will see the printing pathways of both the old and new versions in the same layer. You may intuitively find that the path planning in the newer version has become considerably more efficient.\n\n \n\n （5.0）\n\n \n\n (4.3.8)\n\n 2.2 Higher Slicing Efficiency \n Not only that, we’ve optimized the slicing algorithm from a software engineering standpoint. Specifically, we have decoupled the geometric handling and process computations within the algorithm and leveraged multi-core parallel processing. This enables geometric handling and process calculations to occur concurrently, thereby greatly enhancing slicing efficiency.\n\nThe extent to which slicing efficiency improves depends on your computer settings and the magnitude of the model. For instance, as per the displayed model, it only takes a quarter of the previous slicing duration, so no more waiting for long periods!\n\n 694×471 169 KB \n\n 2.3 Better Quality \n Indeed, in terms of print quality, which everyone cares about most, version 5.0 has demonstrated significant improvements, particularly in the aspects of ‘overhang’, ‘Z-seam’, and ‘support’.Among them, ‘Z-seam’ and ‘support’ stand out.\n\nThese advancements originate from our comprehensive technical innovations, with the optimization of our path planning algorithm being a paramount element. Simultaneously, we have also made more precise adjustments in parameter settings. When these two efforts work together, they improve the print quality of our models.\n\n \n Overhang: The outer wall becomes more delicate and smooth. \n \n 1280×853 127 KB \n\n 4.3.8\n\n 1280×853 112 KB \n\n 5.0\n\n \n Z Seam: Higher precision, richer styles, such as alignment, nearest, back, random. For example, the model in the following picture utilizes the alignment style. \n \n 723×573 337 KB \n\n 4.3.8\n\n 757×572 400 KB \n\n 5.0\n\n \n Support: The generation of support is more rational. \n\nThere are many aspects to optimizing support, among which the key is that we have achieved fewer supports and more effective contact surfaces, making the supports easier to remove and the contact surface less likely to collapse. This greatly improves the surface quality of the model while reducing printing time and materials used. \n \n 2074×1488 464 KB \n\n 706×395 266 KB \n\n （4.3.8-Supporting Results and Print Quality）\n\n 2621×1921 457 KB \n\n 1908×997 370 KB \n\n （5.0-Supporting Results and Print Quality）\n\n 3. Others \n 3.1 Multi-color Printing \n 1）Model Import \n\n• Users can easily import a variety of common 3D model file formats, such as STL, OBJ, and 3mf, preparing for subsequent operations.\n\n 2）Model Coloring \n\n• Intuitive model coloring tools are provided, allowing users to assign required filament colors to different parts or surfaces.\n\n 3）Preview \n\n• The software provides real-time 3D preview functionality, enabling users to clearly view the color distribution and structure of each layer before printing, ensuring satisfactory print results.\n\n 4）Slicing File Export \n\n• The software supports converting colored models into slice files, generating G-codes for multi-color printing, thereby preparing the final steps for print preparation.\n\n 5）Local Area Network for Software to Filament Mapping \n\n• Through a local area network connection, the software can easily communicate with a multi-color printer and map materials, thereby enabling remote operation and monitoring of the print process.\n\n 6）Controlling the printer to start printing \n\n• Users can directly control the multi-color printer through the software interface, initiate the print job, monitor the print process, and adjust and intervene as needed.\n\nThe series of functionalities greatly simplifies and optimizes the workflow of FDM multi-color printing, helping users more effortlessly realize intricate multi-color print works.\n\n 1280×698 241 KB \n\n Import\n\n 1280×698 273 KB \n\n Painting\n\n 1280×698 455 KB \n\n Slicing\n\n 3.2 Synchronizing Configuration by the Cloud \n We are continuously researching and optimizing parameter settings to better adapt to different printer types and printing scenarios, consistently providing more efficient and suitable printing solutions.\n\nPreviously, users needed to update the slice to obtain new configurations, which was rather cumbersome. But now, we have enhanced the parameter synchronization method - with just one click, users can complete updates. As long as you are connected to the internet, we will instantly push the latest configurations to better assist you in completing printing tasks.\n\n 1280×693 260 KB \n\n 3.3 Adaptive Layer \n We have also launched the feature of adaptive layer height slicing. You might wonder why this feature is necessary. As you can see from the picture on the right, models printed with adaptive layer height slicing are of a higher quality than those produced with uniform layer heights. This method reduces layer lines, achieves finer detail handling, and also saves time.\n\nAdaptive layer height slicing devises a layer height strategy based on the model’s geometry, employing thinner layers for detailed areas and thicker layers for smoother regions. This approach enhances quality while also reducing printing time.\n\n 674×349 110 KB \n\n 678×398 274 KB \n\n PS：Each color on the model means a different layer height.\n\n 3.4 Support Painting \n The newly introduced manual support feature in Version 5.0 facilitates the addition and blocking of support positions using three methods–a paintbrush, fill, or gap fill. You can leverage the manual support feature to make specific adjustments when automatic support doesn’t yield the desired results.\n\n 1280×904 108 KB \n\n 1280×904 212 KB \n\n PS：The green color represents the position of the generated support while the red color indicates the position of blocked-off supports.\n\n 3.5 Z Seam Painting \n With the newly introduced Z-Seam painting feature, you now have the freedom to modify the Z-seam positions, enabling you to adjust the surface effect according to the model’s requirements.\n\n 726×726 161 KB \n\n Before\n\n 726×726 41.6 KB \n\n Seam Painting\n\n 726×726 161 KB \n\n After\n\n 4. Bug Fixing \n Beyond feature enhancements, version 5.0 also fixes several issues of interest to users, highlighted below:\n\n• Generative support algorithm optimized to ensure print quality while reducing the automated support generation area.\n\n• The fill algorithm is honed to rectify anomalies under specific scenarios.\n\n• The auto layout algorithm improved to solve model auto-flip issues and layout outside the plate problem.\n\n• Slicing performance enhanced, amplifying slicing efficiency for massive or multiple model slicing to shorten the slicing time.\n\n• Function added for choosing the path for model downloads, resolving the issue of memory usage in the C drive.\n\n• A shortcut key is added to the operation bar.\n\n• Skirt parameters amended to solve difficulty in removing the skirt.\n\n• Added a feature for space + left click platform drag to solve the Magic Mouse platform dragging issue.\n\n• Fixed a bug where the nozzle path dynamic view skipped the first layer and jumped directly to the second.\n\n• Rectified bug related to auto layout not automatically avoiding multiple objects when printing in order.\n\n• A print preview issue resulting in the non-display of estimated consumption weight has been addressed.\n\n• Bug resolved, where slicing a single-line print configuration could cause a crash.\n\n• Fixed an anomaly in the traversing path in hollow areas after support activation.\n\n• An established issue fixed where an interval parameter setting in slicing would not function correctly.\n\n• LAN device details page file list fix allows deletion of listed file.\n\n• Rectified bug where you don’t stop slicing after clicking the prompt, “Add support.”\n\n• A bug causing screen flash when clicking undo in specific scenarios has been corrected.\n\n• The hitch where filling is generated where the model has been shelled has been fixed.\n\n• The inability to engrave after pressing the delete key to cancel the engraving box bug was remedied.\n\n• Fixed the bug where the shell-removed area of the model was being cured and also created a patch.\n\n• A bug fixed where layer values were not displayed when moving the control layer slider.\n\n• Fixed program crashes when the set angle value for overhang exceeds the limit bug.\n\n• Z-axis inconsistency post model rotation issue solved.\n\n• Solved the problem of low sensitivity while right-click rotary platform with the mouse.\n\n• Anomalies resolved associated with lining in overhang printing.\n\n• The disappearing print platform bug resolved.\n\n• Fixed a bug where a model doesn’t inherit original data after rotation and invoke undo clone/copy.\n\n• Rectified page flash issue when importing large models.\n\n• Strange font usage on UI is fixed.\n\n• Other known issues have been addressed.\n\n Download Instructions \n Download link for Creality Print version 5.0:\n\n https://github.com/CrealityOfficial/CrealityPrint/releases/download/v5.0.0/Creality_Print-v5.0.0.8636-win64-Release.exe \n\n Currently, Creality Print 5.0 is compatible with the following models: K1, K1C, K1Max, Ender-3 V3, Ender-3 V3 KE, Ender-3 V3 SE and Ender-3 S1. We are actively working to enhance compatibility with more models, so stay tuned for more updates.\n\n For users of the K1 Max, please ensure to update your machine’s firmware to version [1.3.3.26]or higher to maximize the software experience.\n\n We’re making progress toward guaranteeing firmware compatibility for the K1,K1C,Ender V3 KE and Ender3 V3 units. The updated firmware is anticipated to be out in May, so please keep an eye out for update announcements.\n\n Here’s the firmware download link: https://www.crealitycloud.cn/software-firmware/firmware/flagship-series . (Chinese version)\n\n English version: Flagship Series Firmware Download | Creality 3D Printer Firmwares\n\nWow, this update is huge!","url":"https://forum.creality.com/t/creality-print-5-0-0-release-and-above-version-upgrade/10157","productLine":"thirdparty","version":"5","problemType":"ui","model":"K1 Max","grade":"有效","replyCount":275,"views":24945,"likeCount":136,"tags":["featured","crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"7ffa1186e1052123","topicId":5189,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-01-22","lastActive":"2026-07-01","title":"Firmware for Ender 3 with Sprite and BL Touch","originalText":"I have an original Ender 3 that has been upgraded as follows:\n\n4.2.7 motherboard\n\nBL Touch\n\nSprite Extruder Pro\n\n The printer worked fine after I installed the new MB and BL Touch. After installing the new extruder and using the only firmware I could find that claims to support the touch sensor and Sprite extruder bed levelling doesn’t work properly. If I level the bed from the printer interface it goes through the mesh routine, but at the end it returns to the middle of the bed and drives the hot end into the build plate.\n\n I have run the self-test on the BL touch and it always passes, so I don’t think it’s my sensor.\n\n Does anybody have suggestions for where to find a known working firmware file for this configuration? I can’t believe that I’m the only person who has installed a BL touch and Sprite extruder on an original Ender 3.\n\nHi @Dustin and welcome to the forums.\n\n You should find that the firmware needed for your printer along with the 4.2.7 board, cr touch and sprite extruder is Ender-3Pro_HW4.2.7_SW2.0.9.03_SpritExt_H300 dated: 02 Aug. 2022 which can be found here:\n\n Ender 3 Firmware \n\n Hope that helps.\n\nWill this work with the E3 Free-runs TMC2209, or do I need different firmware (same setup other than board)?","url":"https://forum.creality.com/t/firmware-for-ender-3-with-sprite-and-bl-touch/5189","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":10004,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"0c9306732a374f35","topicId":4582,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2024-01-10","lastActive":"2025-08-07","title":"Creality Print and Sonic Pad","originalText":"I have a Sonic Pad with an Ender 5 plus and an Ender 3 V3 SE connected, I can connect to the Sonic Pad through a browser no problem. Creality Print can see Sonic Pad and the printers printers when I do auto scan but it will not add them. Manually tried to add them and it still won’t add them. Am I missing something or is it a bug in Creality print? I have an Ender 3 V3 KE at home and that connects to Creality print, but is connected to a Nebula pad not a Sonic Pad. Any thoughts? Tried raising it with support but as usual all quiet on the western front.\n\nHi @Bonfireman and welcome to the forums.\n\n I have not had a chance to play with the Sonic Pad as yet but it sounds to me that the slicer is only able to communicate with the Pad itself and not the printers attached to the Pad. This could be deliberate or could be an oversight in the software/firmware.\n\n Support have been inundated with support requests lately so bare with them and they should get back to you soon. I have been told that the live chat via the Creality app or their Facebook support pages are usually the quickest for responses.\n\n Good luck and hope you find a fix\n\nCreality Print can see the Pad and the 2 printers attached to it but can’t connect to any of them, pad or printers. Updated to the latest Sonic Pad firmware, that seems to have dropped today, and no difference there. Thankfully drag and dropping files to the web browser works just fine, so a bit of a workaround.","url":"https://forum.creality.com/t/creality-print-and-sonic-pad/4582","productLine":"firmware","version":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":12,"views":3863,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"4450f82317e05e40","topicId":2828,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2023-12-15","lastActive":"2026-04-24","title":"Need firmware updates but in English","originalText":"I correctly installed the firmware update on my e3 v3 se, unfortunately, now my screen is now i think in Chinese and I cannot figure out how to change the language to English.\n\n In addition, the printer runs very slow and changing velocity has no effect.\n\n Is there a firmware update in English so I can attempt to figure out the issue?\n\nHi @SKIP_L_Goebel and welcome to the forums.\n\n There seems to be an odd glitch with the 1.0.6 SE firmware and the language.\n\n One known fix is to try the following…\n\n Download the firmware files from the website E3 V3 SE - Firmware Download. \n\nExtract the contents of the zip file.\n\nRename Ender-3 V3 SE_HWCR4NS200320C13_SWV1.0.6_GD303.bin to Firmware.bin \n\nCopy the Firmware.bin file to your SD card.\n\nInsert the card in to the printer and power on.\n\nOnce complete power off the printer and remove the SD card and delete any files left on the card if necessary.\n\n If the issue still persists please try updating the screen firmware using a Micro SD card as follows…\n\nInsert the Micro SD card into your computer and format as FAT32 and allocation size of 4096.\n\nCopy the only the TJC_SET folder and its contents to the Micro SD card.\n\nInsert the Micro SD card into the side of the screen and power on the printer.\n\nOnce updated power off the printer, remove the Micro SD card and power on the printer again.\n\nIf no improvement try re-flashing the motherboard firmware again after updating the screen.\n\n If all else fails flash back to the original firmware and the language should return to normal.\n\n Good luck and hope that helps.\n\nWhen that happened to me i used google translate live translate with the camera to find the language selection and change it back to english.","url":"https://forum.creality.com/t/need-firmware-updates-but-in-english/2828","productLine":"firmware","version":"","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":11,"views":5158,"likeCount":3,"tags":["ender-3-v3-se"],"relReason":"category","sourceType":"用户"},{"uid":"aae9155dab86a1ac","topicId":2644,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2023-12-13","lastActive":"2026-05-25","title":"Creality Print not connecting to printer","originalText":"My Ender 3 V3 KE is no longer showing up under devices in Creality Print. The printer is online and is showing as online in Creality Cloud. If I look in the personal center in Creality Print, I see the printer under devices, but it shows as offline and disconnected. It I attempt to manually add the printer using its IP address, I get a message that it cannot be found. I am using the latest version of Creality Print for Windows. I have uninstalled Creality Print completely, clearing all config files, and reinstalled, but it still does not work.\n\nIt sounds like network connectivity to the app may be blocked by Windows or possibly antivirus software. To check if Windows it blocking the app do the following…\n\n Click Start Menu and then type “Windows Defender Firewall” and hit enter.\n\nSelect “Allow an app or feature through Windows Defender Firewall” on the sidebar.\n\nSelect “Change Settings” above the list of apps.\n\nScroll down and locate “Creality Print” and ensure the relevant boxes are ticked.\n\nSelect OK to save the changes.\n\nUPDATE: It just started working again, leading me to believe there was an issue on the backend\n\nWhat is odd is that it used to work fine and now does not. This occurred sometime between December 8 and today. I had to manually add CrealityPrint to Windows Defender Firewall exceptions, but it is still not seeing my printer. I tried completely uninstalling 4.3.7 and then installing 4.3.6 and when I went to personal center, my printer was showing as online and connected. However, when I updated to 4.3.7, it stopped working. Very strange. I need to use 4.3.7 as that has the profile for the KE. I tried uploading to Creality Cloud, and while it showed it was uploading, when I went to Creality Cloud, nothing was there. It is as if Creality Print is not connecting to Creality Cloud.","url":"https://forum.creality.com/t/creality-print-not-connecting-to-printer/2644","productLine":"cloud","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":74,"views":34614,"likeCount":43,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"7ade6dc632808120","topicId":1916,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2023-11-09","lastActive":"2025-07-28","title":"Ender 3 Pro Z-Axis troubleshooting","originalText":"New to the forum because I’m doing some troubleshooting for my son. I haven’t been able to find this issue described elsewhere. Sorry for the long post, just trying to be thorough.\n\n He’s had an Ender 3 Pro for just over a year now - Marlin bugfix-2.0.x, 2021-12-07. BTT SKR Mini E3 V3.0 board - and we’re running into issues with Z axis positioning. Something is preventing the Z home from being set at it’s actual zero position.\n\n The couple ways we’ve experienced this issue:\n\n -Before we start any print, we have to manually position the Z axis at the bed by disabling the stepper motors. But upon starting the print, the Z-axis raises up off the bed, runs what I’ve assumed is an extruder purge along the Y-axis, moves over to the print location, but then does not drop back down to the bed. If the print is paused, the extruder is moved to a rest position (X = 0, Y = max, Z = same height) and there is not an option to disable the stepper motors so we can drop the nozzle back to the bed. The only option for adjusting the Z-axis is in the positive direction. With the factory motherboard, this same issue would occur, but the print could be paused, the nozzle would stay in the same position, and we could disable the steppers and drop the Z back down to the bed.\n\n -When just trying to configure - not printing - I can disable the stepper motors and bring the Z down to its lowest position (right at the limit switch) and try to ‘Set Home Offsets’, I get a message that says ‘Home XYZ First’. But when I Auto Home, the Z raises up approximately 6mm. If I go to adjust the Z axis using the screen and controls, I can only adjust in the positive direction, raising it up higher.\n\n The really weird part is that if I ‘Auto Home’ again, the X and Y both return to zero but the Z raises up another 6mm and I cannot lower it using the controls. I can only lower it by disabling the steppers, but then the described cycle starts over again.\n\n The Z-limit switch seems to be positioned well, no Z-probe currently installed. My assumption is this is a code issue that needs to be resolved, but it’s beyond my basic understanding of that. I recently installed what I thought was the most recent firmware for the board, but I’m probably missing something there as well.\n\n Any insights are greatly appreciated, especially considering the machine can’t currently print and my 11 year old is pretty frustrated about what is currently a fancy paperweight.\n\nHi and welcome to the forums!\n\n I have only ever come across one other person who has had this issue before and it turned out to be that they had over tightened the bed screws on all 4 corners which was causing the bed to be too low for the nozzle to reach it.\n\n To rectify the problem it was a case of loosening off all of the screws to bring the bed up higher and then proceed to work around each corner re-leveling the bed to the correct height.\n\n If you need the guide for the bed leveling you should be able to find it on page 7 of the User Manual available here:\n\n Ender 3 Pro - Downloads and User Manual \n\n Hope that helps and good luck, hope your 11 year old gets back to printing soon!\n\nThanks - unfortunately I don’t think that its a matter of the bed being too low. In the past using the original motherboard, we were always able to pause the print, disable the stepper motors, and manually drop the Z down to the bed. New motherboard doesn’t have the capacity to do that.\n\n I did run another test today and I was able to complete a print after baby stepping the Z…the only issue was it took me more than 3 minutes to dial through thousandths of mm’s to get to the -14.655mm position needed to be at the bed. By that point I had missed the first couple layers.\n\n -14.655mm = original unexplained starting point of ~6mm + another vertical advancement of ~6mm + the couple layers that were missed while dropping the nozzle.\n\n I have a few other tests to run in the next few days and we will be installing a Z-probe - seems to be enough overlap in tweaking and troubleshooting that may as well do them both at the same time.","url":"https://forum.creality.com/t/ender-3-pro-z-axis-troubleshooting/1916","productLine":"firmware","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":7,"views":1215,"likeCount":1,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"0835a822c22f1024","topicId":34,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2023-02-27","lastActive":"2024-12-19","title":"About the Software category","originalText":"Dedicated section for the Creality software, like Creality Print, Creality Cloud and so on. Everyone can discussion all topics related to these models.\n\nCan you add a Screen shot in Creality Print to the Camera.","url":"https://forum.creality.com/t/about-the-software-category/34","productLine":"cloud","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":5884,"likeCount":3,"tags":["creality-cloud","slicingsoftware","general-discussions","crealityprint","bug-report"],"relReason":"tag","sourceType":"用户"}],"extra":{"generatedAt":"2026-10-19 18:00"},"meta_foot":"<b>口径说明<\/b><br>① 数据源为 Creality 官方论坛的 Software 板块与 5 个软件相关标签，共 508 条；其中 284 条（55.9%）指向具体问题类型，另 224 条为使用提问 / 教程 / 公告，<b>只计入总量、不进问题榜<\/b>——不把提问硬归成缺陷，否则问题榜会失真。<br>② 「版本回归雷达」的行是软件版本，列是问题类型。回归标记的口径是：该版本某类问题 ≥ 上一主版本同类的 1.8 倍且 ≥ 3 条，才标「回归」；不是所有深色格子都叫回归，否则标记会失效。<br>③ 版本号从标题优先抽取，正文只作补充；抽取前会剔除型号与计量 token（Ender-3 V3、K1C、SPARK2 Plus、1.75mm、200°C、0.4 层高等），避免把规格当版本。<br>④ 「其他缺陷」是兜底类：明确是故障但六类拆不细的内容单列在这，不硬塞进「兼容性」或「界面」，避免这两类虚高。<br>⑤ 非中文内容保留原文；译文将在后续批次补齐，当前未做机器翻译，以免技术术语被误译。<br>⑥ 信源为厂商官方论坛，<b>厂商官方账号发布的公告/回复已标「官方」徽标<\/b>。"};

var ITEMS  = COL.items || [];
var EXTRA  = COL.extra || {};
var TYPE   = META.columnType || "sw";
var PAGE_SZ = 20;

var PROBLEM_NAME = {"crash":"崩溃 / 无法启动","slice":"切片错误 / 卡死","quality":"打印质量回归",
                    "ui":"界面 / 显示缺陷","feature":"功能缺失 / 需求","compat":"兼容性"};
var PRODUCT_NAME = {"print":"Creality Print","cloud":"Creality Cloud + APP","park":"Creality Park",
                    "firmware":"固件与 Klipper","thirdparty":"第三方切片兼容"};
var PRODUCT_COLOR= {"print":"#58a6ff","cloud":"#3fb950","park":"#bc8cff","firmware":"#d29922","thirdparty":"#f85149"};
var CHANNEL_ORDER = ["官方论坛","厂商官方","海外视频","海外媒体","国内媒体","社区","其他"];

var S = {product:"",version:"",problem:"",model:"",channel:"",grade:"",source:"",range:"all",q:"",page:1};
var lastKey = "";

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad2(n){return n<10?"0"+n:""+n;}
function dateOf(it){return (it.date||"").slice(0,10);}
function uniq(a){var o={},r=[];a.forEach(function(x){if(x&&!o[x]){o[x]=1;r.push(x);}});return r;}
function countBy(list,fn){var m={};list.forEach(function(x){var k=fn(x);if(k){m[k]=(m[k]||0)+1;}});return m;}

/* ---------- 时间范围 ---------- */
function daysAgo(n){
  var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function inRange(it){
  if(S.range==="all") return true;
  var n={"7":7,"30":30,"90":90}[S.range]||0;
  if(!n) return true;
  return dateOf(it) >= daysAgo(n);
}

/* ---------- 过滤核心：skip 用于 facet 自身不参与自身计数 ---------- */
function match(it,skip){
  if(skip!=="product" && S.product && it.productLine!==S.product) return false;
  if(skip!=="version" && S.version){
    var v=(it.version||"");
    if(S.version==="__none__"){ if(v) return false; }
    else if(v!==S.version) return false;
  }
  if(skip!=="problem" && S.problem){
    if(S.problem==="__none__"){ if(it.problemType) return false; }
    else if(it.problemType!==S.problem) return false;
  }
  if(skip!=="model" && S.model && (it.model||"未标注")!==S.model) return false;
  if(skip!=="channel" && S.channel && it.channel!==S.channel) return false;
  if(skip!=="grade" && S.grade && it.grade!==S.grade) return false;
  if(skip!=="source" && S.source && it.sourceType!==S.source) return false;
  if(!inRange(it)) return false;
  if(S.q){
    var q=S.q.toLowerCase();
    var hay=((it.title||"")+" "+(it.originalText||"")+" "+(it.model||"")+" "+(it.site||"")).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function applyFilters(skip){ return ITEMS.filter(function(it){return match(it,skip);}); }

/* ---------- 更新条 ---------- */

  var el=document.getElementById("updateBar");
  var mode = META.launchMode==="pre";
  el.innerHTML = '<span class="dot'+(mode?" y":"")+'"></span>'+
    '<span>口径：<b>'+(META.scope||"用户反馈")+'</b> · 更新至 <b>'+(META.updatedDate||"—")+'</b>'+
    '（'+(META.batch||"")+'） · 信源 <b>'+(META.sources||"")+'</b></span>'+
    '<span class="hist" id="updToggle">更新历史</span>';
  var h=document.getElementById("updHist");
  var log=META.updateLog||[];
  h.innerHTML = log.length

    : "<div>· 暂无历史记录（首版发布）</div>";
  document.getElementById("updToggle").onclick=function(){ h.className = h.className==="on"?"":"on"; };

/* ---------- KPI ---------- */
function renderKPIs(){
  var all=applyFilters(), el=document.getElementById("kpis");
  if(TYPE==="mbox"){
    var srcs=uniq(all.map(function(x){return x.site;}));
    var official=all.filter(function(x){return x.sourceType==="官方";}).length;
    var apps=EXTRA.apps||{};
    var park=null; for(var k in apps){ if(/park/i.test(apps[k].label||"")) park=apps[k]; }
    el.innerHTML =
      kpi("公开声量", all.length, "条 · 去重后全部内容", "") +
      kpi("独立信源", srcs.length, srcs.slice(0,3).join(" / ")||"—", "") +
      kpi("官方动作", official, "条 · 厂商官方发布", "") +
      kpi("配套应用评分", park&&park.rating?park.rating:"—",
          park?("Creality Park · "+park.ratingCount+" 人评分 · "+park.downloads+" 下载"):"未获取", "ye");
    return;
  }
  var valid=all.filter(function(x){return x.grade==="有效";}).length;
  var withPb=all.filter(function(x){return !!x.problemType;}).length;
  var vers=uniq(all.map(function(x){return x.version;}).filter(Boolean));
  var week=all.filter(function(x){return dateOf(x)>=daysAgo(7);}).length;
  el.innerHTML =
    kpi("软件反馈总量", all.length, "条 · 覆盖 "+vers.length+" 个版本", "") +
    kpi("问题反馈占比", all.length?((withPb/all.length*100).toFixed(1)+"%"):"—",
        withPb+" 条明确指向具体问题类型", "rd") +
    kpi("涉及版本", vers.length, vers.slice(0,4).join(" · ")||"未标注", "") +
    kpi("近 7 日新增", week, "条 · 持续增量", "");
}
function kpi(l,v,d,cls){
  return '<div class="kpi"><div class="l">'+l+'</div><div class="v '+(cls||"")+'">'+v+
         '</div><div class="d">'+esc(d)+'</div></div>';
}

/* ---------- 面板 ---------- */
function renderPanels(){
  var el=document.getElementById("panels");
  el.innerHTML = (TYPE==="mbox") ? panelsMbox() : panelsSw();
}

/* --- 软件：版本回归矩阵 --- */
function panelsSw(){
  var html="";
  var base=applyFilters("version").filter(function(x){return !!x.version;});
  var allV=countBy(base,function(x){return x.version;});
  var vers=Object.keys(allV).map(function(k){return {k:k,n:allV[k]};})
             .sort(function(a,b){return b.n-a.n;}).slice(0,6).map(function(x){return x.k;});
  var probs=["crash","slice","quality","ui","feature","compat"];

  if(vers.length){
    // 回归判定：本版本某类 >= max(3, 上一主版本同类 * 1.8)
    var prevOf={};
    vers.forEach(function(v,i){
      var maj=parseInt(v,10);
      for(var j=i+1;j<vers.length;j++){
        if(parseInt(vers[j],10)===maj-1){ prevOf[v]=vers[j]; break; }
      }
    });
    html += '<section><div class="sh"><h2>版本回归雷达</h2>'+
      '<span class="tag">核心视图</span>'+
      '<span class="note">行 = 版本 · 列 = 问题类型 · 数字 = 提及条数 · 点格子就地筛选</span></div>'+
      '<div class="mxwrap"><div class="mx" style="grid-template-columns:112px repeat('+probs.length+',1fr)">'+
      '<div class="hd rh">版本 / 问题</div>'+
      probs.map(function(p){return '<div class="hd">'+esc(PROBLEM_NAME[p]).replace(" / ","<br>")+'</div>';}).join("");

    vers.forEach(function(v){
      var rowTot=base.filter(function(x){return x.version===v;}).length;
      html += '<div class="rl"><span class="ver" data-v="'+esc(v)+'">'+esc(v)+'</span>'+
              '<span class="cnt">'+rowTot+'</span></div>';
      probs.forEach(function(p){
        var n=base.filter(function(x){return x.version===v && x.problemType===p;}).length;
        var reg=false;
        if(n>=3 && prevOf[v]){
          var pn=base.filter(function(x){return x.version===prevOf[v] && x.problemType===p;}).length;
          if(n >= Math.max(3, Math.round(pn*1.8))) reg=true;
        }
        var lvl = n===0?0 : n<=1?1 : n<=3?2 : n<=6?3 : n<=12?4 : 5;
        var on = (S.version===v && S.problem===p)?" on":"";
        html += '<div class="cell c'+lvl+(reg?" regress":"")+on+'" data-v="'+esc(v)+'" data-p="'+p+'"'+
                (n?'':' style="cursor:default"')+'>'+
                (reg?'<span class="flag">回归</span>':'')+(n||"")+'</div>';
      });
    });
    html += '</div><div class="legend"><span>低</span>'+
      '<span class="lg" style="background:rgba(255,255,255,.025)"></span>'+
      '<span class="lg" style="background:rgba(88,166,255,.13)"></span>'+
      '<span class="lg" style="background:rgba(88,166,255,.27)"></span>'+
      '<span class="lg" style="background:rgba(210,153,34,.28)"></span>'+
      '<span class="lg" style="background:rgba(248,81,73,.3)"></span>'+
      '<span class="lg" style="background:rgba(248,81,73,.52)"></span>'+
      '<span>高</span><span class="sp"><i></i>回归信号：该版本此类问题 ≥ 上一主版本 1.8 倍且 ≥ 3 条</span>'+
      '</div></div></section>';
  }

  // 双栏：产品线 + 问题类型
  html += '<section><div class="cols">';
  html += panelBars("产品线分布","按条数",
    buildBars(applyFilters("product"),function(x){return x.productLine;},PRODUCT_NAME,PRODUCT_COLOR,"product"));
  html += panelBars("问题类型分布","按条数",
    buildBars(applyFilters("problem"),function(x){return x.problemType;},PROBLEM_NAME,null,"problem"));
  html += '</div>';

  var noPb=applyFilters("problem").filter(function(x){return !x.problemType;}).length;
  html += '<div class="tip" style="border:none;padding-top:10px">'+
    '另有 <b style="color:var(--mu)">'+noPb+'</b> 条未指向具体问题类型（使用提问 / 教程 / 泛讨论），只计入总量，不进问题榜。'+
    '</div>';
  html += '</section>';
  return html;
}
function buildBars(list,getter,names,colors,key){
  var m=countBy(list,getter), tot=0;
  Object.keys(m).forEach(function(k){tot+=m[k];});
  var rows=Object.keys(m).map(function(k){return {k:k,n:m[k]};})
            .sort(function(a,b){return b.n-a.n;}).slice(0,8);
  if(!rows.length) return '<div class="tip">当前筛选下无数据。</div>';
  return rows.map(function(r){
    var pct= tot?(r.n/tot*100):0;
    var nm= names&&names[r.k] ? names[r.k] : (r.k==="__none__"?"未归类":r.k);
    var on= (S[key]===r.k)?" on":"";
    var col= colors&&colors[r.k] ? colors[r.k] : null;
    var bg= col ? "background:"+col : "";
    return '<div class="bar'+on+'" data-k="'+esc(key)+'" data-v="'+esc(r.k)+'">'+
      '<span class="nm" title="'+esc(nm)+'">'+esc(nm)+'</span>'+
      '<span class="tr"><span class="fl" style="width:'+pct.toFixed(1)+'%;'+bg+'"></span></span>'+
      '<span class="vv">'+r.n+'</span><span class="pc">'+pct.toFixed(0)+'%</span></div>';
  }).join("");
}
function panelBars(title,note,inner){
  return '<div class="panel"><div class="ph">'+title+' <span>'+note+'</span></div>'+inner+'</div>';
}

/* --- mbox：渠道 + 来源 + 预热说明 --- */
function panelsMbox(){
  var html="";
  html += '<section><div class="cols">';
  html += panelBars("渠道分布","按条数",
    buildBars(applyFilters("channel"),function(x){return x.channel;},null,null,"channel"));
  html += panelBars("来源结构","按条数",
    buildBars(applyFilters("source"),function(x){return x.sourceType;},null,null,"source"));
  html += '</div>';

  // 采集探针如实呈现
  var probes=EXTRA.probes||[];
  if(probes.length){
    html += '<section style="margin-top:13px"><div class="panel"><div class="ph">采集覆盖盘点'+
      ' <span>哪些源有货、哪些没有，如实标注</span></div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">'+
      probes.map(function(p){
        var st=p.status, col = st==="ok"?"var(--green)": st==="empty"?"var(--mu2)": st==="absent"?"var(--mu2)":"var(--red)";
        var txt = st==="ok"?"可采": st==="empty"?"零声量": st==="absent"?"未上线":"不可达";
        return '<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:7px 10px;background:var(--card2);border-radius:6px">'+
          '<span style="color:'+col+';font-weight:700;flex:none">'+txt+'</span>'+
          '<span style="color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.source)+'</span></div>';
      }).join("")+'</div></div></section>';
  }
  return html;
}

/* ---------- 筛选栏（已选条件不在这里渲染，见 renderSummary） ---------- */
function renderFilters(){
  var el=document.getElementById("filters");
  var h="";
  function sel(key,label,opts){
    var o='<div class="fg"><label>'+label+'</label><select data-k="'+key+'">'+
      '<option value="">全部</option>';
    opts.forEach(function(x){
      o+='<option value="'+esc(x.v)+'"'+(S[key]===x.v?" selected":"")+'>'+esc(x.t)+' ('+x.n+')</option>';
    });
    return o+'</select></div>';
  }
  var all=applyFilters();
  var base=applyFilters("");
  if(TYPE!=="mbox"){
    var pl=countBy(applyFilters("product"),function(x){return x.productLine;});
    h+=sel("product","产品线",Object.keys(pl).sort(function(a,b){return pl[b]-pl[a];})
      .map(function(k){return {v:k,t:PRODUCT_NAME[k]||k,n:pl[k]};}));
    var vs=countBy(applyFilters("version"),function(x){return x.version;});
    var vitems=Object.keys(vs).filter(function(k){return k;}).sort(function(a,b){return vs[b]-vs[a];})
      .map(function(k){return {v:k,t:"v"+k,n:vs[k]};});
    if(base.filter(function(x){return !x.version;}).length)
      vitems.push({v:"__none__",t:"未标注版本",n:base.filter(function(x){return !x.version;}).length});
    h+=sel("version","版本",vitems);
    var pb=countBy(applyFilters("problem"),function(x){return x.problemType;});
    h+=sel("problem","问题类型",Object.keys(pb).sort(function(a,b){return pb[b]-pb[a];})
      .map(function(k){return {v:k,t:PROBLEM_NAME[k]||k,n:pb[k]};}));
    var md=countBy(applyFilters("model"),function(x){return x.model||"未标注";});
    h+=sel("model","机型",Object.keys(md).sort(function(a,b){return md[b]-md[a];}).slice(0,12)
      .map(function(k){return {v:k,t:k,n:md[k]};}));
  }
  var ch=countBy(applyFilters("channel"),function(x){return x.channel;});
  h+=sel("channel","渠道",Object.keys(ch).sort(function(a,b){return ch[b]-ch[a];})
    .map(function(k){return {v:k,t:k,n:ch[k]};}));
  if(TYPE!=="mbox"){
    var gr=countBy(applyFilters("grade"),function(x){return x.grade;});
    h+=sel("grade","审核",Object.keys(gr).map(function(k){return {v:k,t:k,n:gr[k]};}));
  }

  h+='<div class="fg">';
  [["7","近7天"],["30","近30天"],["90","近90天"],["all","全部"]].forEach(function(r){
    h+='<button class="fbtn'+(S.range===r[0]?" on":"")+'" data-range="'+r[0]+'">'+r[1]+'</button>';
  });
  h+='</div>';

  h+='<div class="sp"><input id="searchBox" placeholder="搜索标题 / 正文 / 机型" value="'+esc(S.q)+'">'+
     '<button class="fbtn" id="resetBtn">重置</button></div>';

  el.innerHTML=h;

  el.querySelectorAll("select").forEach(function(s){
    s.onchange=function(){ setFilter(s.getAttribute("data-k"), s.value); };
  });
  el.querySelectorAll("[data-range]").forEach(function(b){
    b.onclick=function(){ S.range=b.getAttribute("data-range"); S.page=1; renderAll(); };
  });
  var sb=document.getElementById("searchBox");
  if(sb){
    var t=null;
    sb.oninput=function(){ clearTimeout(t); var v=sb.value;
      t=setTimeout(function(){ S.q=v; S.page=1; renderAll(); },260); };
  }
  var rb=document.getElementById("resetBtn");
  if(rb) rb.onclick=clearAllFilters;
}

/* ---------- 摘要（唯一一处展示已选条件） ---------- */
var FILTER_LABEL={product:"产品线",version:"版本",problem:"问题类型",model:"机型",
                  channel:"渠道",grade:"审核",source:"来源",range:"时间"};
function filterValText(k,v){
  if(k==="product") return PRODUCT_NAME[v]||v;
  if(k==="problem") return PROBLEM_NAME[v]||v;
  if(k==="version") return v==="__none__"?"未标注版本":"v"+v;
  if(k==="problem"&&v==="__none__") return "未归类";
  if(k==="range") return {"7":"近 7 天","30":"近 30 天","90":"近 90 天","all":"全部"}[v]||v;
  return v;
}
function activeKeys(){
  var ks=[];
  ["product","version","problem","model","channel","grade","source"].forEach(function(k){
    if(S[k]) ks.push(k);
  });
  if(S.range!=="all") ks.push("range");
  if(S.q) ks.push("q");
  return ks;
}
function renderSummary(){
  var el=document.getElementById("filterSummary"), ks=activeKeys();
  if(!ks.length){ el.className=""; el.innerHTML=""; return; }
  var n=applyFilters().length, h='<span class="lbl">已选</span>';
  ks.forEach(function(k){
    var v = k==="q" ? S.q : (k==="range"?S.range:S[k]);
    h+='<span class="chipx">'+FILTER_LABEL[k]+' <b>'+esc(filterValText(k,v))+'</b>'+
       '<i data-rm="'+k+'">✕</i></span>';
  });
  h+='<span class="cnt">命中 '+n+' / '+ITEMS.length+' 条</span>';
  h+='<span class="clr" id="clrAll">清空全部</span>';
  el.className="on"; el.innerHTML=h;
  el.querySelectorAll("[data-rm]").forEach(function(i){
    i.onclick=function(){ removeFilter(i.getAttribute("data-rm")); };
  });
  var c=document.getElementById("clrAll");
  if(c) c.onclick=clearAllFilters;
}
function setFilter(k,v){
  if(k==="range"){ S.range=v||"all"; }
  else S[k]=v||"";
  S.page=1; lastKey=k; renderAll();
}
function removeFilter(k){
  if(k==="range") S.range="all";
  else if(k==="q"){ S.q=""; }
  else S[k]="";
  S.page=1; lastKey=k; renderAll();
}
function clearAllFilters(){
  ["product","version","problem","model","channel","grade","source","q"].forEach(function(k){S[k]="";});
  S.range="all"; S.page=1; lastKey=""; renderAll();
}

/* ---------- 明细卡 ---------- */
function renderCards(){
  var all=applyFilters();
  var el=document.getElementById("cards");
  document.getElementById("flowCount").textContent = all.length+" 条";
  if(!all.length){
    el.innerHTML='<div class="empty"><b>当前条件下没有内容</b>'+
      '请放宽筛选，或点「重置」查看全部。</div>';
    document.getElementById("pager").innerHTML="";
    return;
  }
  var total=Math.ceil(all.length/PAGE_SZ);
  if(S.page>total) S.page=total;
  var start=(S.page-1)*PAGE_SZ;
  var page=all.slice(start,start+PAGE_SZ);

  el.innerHTML = page.map(function(it){
    var top="";
    if(it.version) top+='<span class="chip ch-ver">v'+esc(it.version)+'</span>';
    if(it.productLine) top+='<span class="chip ch-prod" style="'+
      (TYPE==="mbox"?'':'color:'+(PRODUCT_COLOR[it.productLine]||"#58a6ff"))+'">'+
      esc(PRODUCT_NAME[it.productLine]||it.productLine)+'</span>';
    if(it.problemType) top+='<span class="chip ch-pb">'+esc(PROBLEM_NAME[it.problemType]||it.problemType)+'</span>';
    if(it.grade) top+='<span class="chip '+(it.grade==="有效"?"ch-ok":"ch-mu")+'">'+esc(it.grade)+'</span>';
    if(it.sourceType==="官方") top+='<span class="chip ch-ye">官方</span>';
    top+='<span class="tm">'+esc(dateOf(it)||"—")+'</span>';

    var body='';
    var txt=(it.originalText||"").replace(/\s+/g," ").trim();
    if(txt && txt!==it.title){
      body='<div class="bd">'+(it.language&&it.language!=="ZH"?'<span class="lang">'+esc(it.language)+'</span>':'')+
           esc(txt.slice(0,320))+'</div>';
    }
    var tr="";
    if(it.textCn){
      tr='<div class="tr2"><span class="ml">译文 · 机器翻译</span>'+esc(it.textCn.slice(0,320))+'</div>';
    }
    var mt=[];
    if(it.model && it.model!=="未标注") mt.push("机型 <b>"+esc(it.model)+"</b>");
    if(it.site) mt.push("信源 <b>"+esc(it.site)+"</b>");
    if(it.replyCount) mt.push("回复 <b>"+it.replyCount+"</b>");
    if(it.views) mt.push("浏览 <b>"+it.views+"</b>");
    if(it.author) mt.push("作者 <b>"+esc(it.author)+"</b>");

    return '<div class="card"><div class="top">'+top+'</div>'+
      '<div class="ti"><a href="'+esc(it.url||"#")+'" target="_blank" rel="noopener">'+esc(it.title)+'</a></div>'+
      body+tr+
      (mt.length?'<div class="mt">'+mt.map(function(x){return "<span>"+x+"</span>";}).join("")+'</div>':'')+
      '</div>';
  }).join("");

  document.getElementById("pager").innerHTML =
    '<button '+(S.page<=1?"disabled":"")+' data-pd="-1">上一页</button>'+
    '<span class="pg">'+S.page+' / '+total+'</span>'+
    '<button '+(S.page>=total?"disabled":"")+' data-pd="1">下一页</button>';
  document.querySelectorAll("[data-pd]").forEach(function(b){
    b.onclick=function(){ S.page += parseInt(b.getAttribute("data-pd"),10); renderCards(); window.scrollTo({top:document.getElementById("cards").offsetTop-90,behavior:"smooth"}); };
  });
}

/* ---------- CSV ---------- */
function exportCSV(){
  var all=applyFilters();
  var head=["日期","渠道","站点","产品线","版本","问题类型","机型","审核","标题","原文","链接"];
  var rows=[head].concat(all.map(function(it){
    return [dateOf(it), it.channel||"", it.site||"", PRODUCT_NAME[it.productLine]||it.productLine||"",
            it.version||"", PROBLEM_NAME[it.problemType]||it.problemType||"", it.model||"",
            it.grade||"", it.title||"", (it.originalText||"").replace(/\s+/g," "), it.url||""];
  }));
  var csv=rows.map(function(r){return r.map(function(c){
    var s=String(c==null?"":c);
    return '"'+s.replace(/"/g,'""')+'"';
  }).join(",");}).join("\r\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(META.fileStem||"column")+"_"+new Date().toISOString().slice(0,10)+".csv";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- 事件绑定 ---------- */
function bindPanels(){
  document.querySelectorAll(".bar[data-k]").forEach(function(b){
    b.onclick=function(){ setFilter(b.getAttribute("data-k"), b.getAttribute("data-v")); };
  });
  document.querySelectorAll(".cell[data-p]").forEach(function(c){
    c.onclick=function(){
      var v=c.getAttribute("data-v"), p=c.getAttribute("data-p");
      if(!c.textContent.replace("回归","").trim()) return;
      // 就地筛选：版本 + 问题类型 同时生效，不跳转
      S.version=v; S.problem=p; S.page=1; lastKey="problem"; renderAll();
    };
  });
  document.querySelectorAll(".rl .ver").forEach(function(v){
    v.onclick=function(){ setFilter("version", v.getAttribute("data-v")); };
  });
}

function flashCards(){
  var el=document.getElementById("cards");
  if(!el) return;
  var first=el.firstElementChild;
  if(first){ first.classList.remove("flash"); void first.offsetWidth; first.classList.add("flash"); }
}

function renderAll(){
  renderKPIs();
  renderPanels();
  renderFilters();
  renderSummary();
  renderCards();
  bindPanels();
  if(lastKey) flashCards();
}

/* ---------- 页脚 ---------- */
function renderFoot(){
  document.getElementById("foot").innerHTML = META.foot || "";
}

renderUpdateBar();
renderFoot();
renderAll();
document.getElementById("csvBtn").onclick=exportCSV;

// 调试与校验钩子
window.__COL = {items:ITEMS, meta:META, S:S, applyFilters:applyFilters,
                setFilter:setFilter, removeFilter:removeFilter,
                clearAllFilters:clearAllFilters, renderAll:renderAll};
})();
</script>
</body>
</html>
