 the selected printer\nI have already tried searching the forums and googling but have found zero results.\nWhat does this message mean? Is this a problem? Can I do something about it? Why does it only happen sometimes? I do not understand what the “preset settings” of the selected printer are versus how the current printer could match them. Are they uploaded and stored on the printer? Are they automatically overridden by the preset settings? Then why even inform me with such a message?\nThis message is extremely confusing and colored like an issue or error that needs solving. Please explain in detail what it means and what to do when it appears.\nThank you kindly,\nRain\nensure your filament selection and settings match the machines filament settings when you load filament in the machine\nI’m having the same issue. Could you please explain exactly what you mean by matching filament settings?","textCn":"你好，用 Creality Print V6，切片之后把打印任务发送到我的 Ender V3 时，我有时会收到下面这条橙色警告信息：*当前打印机与所选打印机的预设设置不匹配。我已经试过搜索论坛和谷歌，但一无所获。这条信息是什么意思？是个问题吗？我能做点什么吗？为什么只是有时候出现？我不理解所选打印机的“预设设置”是什么，也不理解当前打印机怎样才能与它们匹配。它们会被上传并保存在打印机上吗？它们会被预设设置自动覆盖吗？那为什么还要用这样的信息通知我？这条信息非常令人困惑，而且配色看起来像是一个需要解决的问题或错误。请详细解释它的含义以及出现时该怎么做。非常感谢，Rain。加载耗材到机器时，确保你的耗材选择和设置与机器的耗材设置匹配。我也遇到同样的问题。你能具体解释一下“匹配耗材设置”是什么意思吗？","truncated":false,"url":"https://forum.creality.com/t/creality-print-v6-the-current-printer-does-not-match-the-preset-settings-of-the-selected-printer/28899","productLine":"print","version":"6","versionRaw":"6","problemType":"compat","model":"未标注","grade":"有效","replyCount":23,"views":7367,"likeCount":9,"sourceType":"论坛"},{"uid":"17ebce2dd10ee629","date":"2025-01-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print version 6 \"Problems\"","titleCn":"Creality Print 版本 6 的“问题”","originalText":"Hello all,\nI have created this thread with the hope ALL mentions of problems found when using CP version 6 can be written here.\nAt present, there are so many new posts scattered around the place over many days, often by people that think they are the only ones having a problem with it.\nI am sure this thread will keep it self toward the top by it self and be seen …\nCheers\nAfter slicing an STL file and sending it to the printer, the printer starts printing another previous print.\nVersion 6.02.1574\nBefore, I had a few printouts that worked. The problem occurred all of a sudden and continued even after restarting the program and also the computer\nWell Creality Print is currently at version 6.0.2.1574 … … up from version 6.0.0\nI guess that when it gets to version 6.6.6 it will be a devil of a program","textCn":"大家好，我创建这个帖子，是希望所有关于使用 CP 版本 6 时发现的问题都能写在这里。目前，许多天来有太多新帖散落在各处，发帖的人往往以为只有自己遇到了这个问题。我相信这个帖子会自动保持在顶部，被大家看到…… 干杯 在对一个 STL 文件切片并发送到打印机后，打印机开始打印之前的另一个打印任务。版本 6.02.1574 之前，我有几次打印是正常的。问题突然出现，而且在重启程序和电脑之后仍然存在 嗯，Creality Print 目前是 6.0.2.1574 版本……从 6.0.0 版本升上来的 我猜当它到 6.6.6 版本时，会是个魔鬼般的程序","truncated":false,"url":"https://forum.creality.com/t/creality-print-version-6-problems/28797","productLine":"print","version":"6","versionRaw":"6","problemType":"","model":"未标注","grade":"泛讨论","replyCount":71,"views":6061,"likeCount":24,"sourceType":"论坛"},{"uid":"d8519c1b3fb4238c","date":"2025-01-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"In creality print 6.0 and web interface, \"Z-\" is making ender 3 v3 ke hotend go UP not Down, in creality 5 and in nebula pad all is normal","titleCn":"在 Creality Print 6.0 和网页界面中，“Z-”使 Ender 3 V3 KE 的热端向上而不是向下，在 Creality 5 和 Nebula Pad 中一切正常","originalText":"as said in title, in creality print 6.0.1 and web interface by the ender address, the behavior of the buttons of the z axis is reversed. As you cann see in the attached video, Z- / Z↓ is making the head go UP instead of down, and Z+ is making it go down.\nI got this problem by surprise TODAY, since i’ve been controlling my printer from creality 6 and web interface just fine for weeks, and it made my printer hit the hotend against the bed pretty badly.\nIn creality print 5, it is behaving normally, in the nebula pad as well. Z+/Z↑ makes it go up, z-/z↓ down.\nFirmware is the latest, i did not do any modification whatsoever to the firmware, printer is unrooted.\nPlease check this, that can have pretty serious consequences for other users if not fixed\nIssue was resolved after some updates from version 6.2 onwards","textCn":"如标题所说，在 Creality Print 6.0.1 和通过 Ender 地址访问的网页界面中，Z 轴按钮的行为是反的。正如你在所附视频中看到的，Z- / Z↓ 让打印头向上而不是向下，而 Z+ 让它向下。\n我今天突然遇到这个问题，因为几周来我一直用 Creality 6 和网页界面控制打印机都一切正常，而它让我的打印机把热端相当严重地撞到了热床上。\n在 Creality Print 5 里它表现正常，在 Nebula Pad 里也是。Z+/Z↑ 让它向上，Z-/Z↓ 向下。\n固件是最新的，我对固件没有做任何改动，打印机未 root。\n请检查一下这个问题，如果不修复，可能会对其他用户造成相当严重的后果\n从 6.2 版本开始的一些更新之后，问题已解决","truncated":false,"url":"https://forum.creality.com/t/in-creality-print-6-0-and-web-interface-z-is-making-ender-3-v3-ke-hotend-go-up-not-down-in-creality-5-and-in-nebula-pad-all-is-normal/27389","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"Ender-3 V3 KE","grade":"有效","replyCount":2,"views":138,"likeCount":0,"sourceType":"论坛"},{"uid":"7314e783da9c6d79","date":"2025-01-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Are servers down? Can't bind to cloud","titleCn":"服务器是不是挂了？无法绑定到云端","originalText":"I’m currently getting a n error when trying to bind to the creality cloud. “IOT initialization failed, check server settings”. Are the cloud servers down right now or something?\nLooks like that. There are no warnings or messages about it in my personal account\nI had a heck of a time tonight. I’ve only had my printer for a week, and this is my first ever printer, so I figured I was doing something wrong. I’ve had zero issues until tonight. Turned it on and it wouldn’t connect. Powered off and on several times. Logged in and out of my phone app. It just finally worked. I was able to get something started printing, but it still keeps disconnecting from my app.","textCn":"我现在尝试绑定 creality cloud 时一直报错。“IOT initialization failed, check server settings”（IOT 初始化失败，请检查服务器设置）。是云服务器现在挂了还是怎么回事？ 看起来是的。我的个人账号里没有任何相关警告或消息 今晚我可真是折腾惨了。我拿到打印机才一周，这是我第一台打印机，所以我还以为是我哪里做错了。在今晚之前我一点问题都没有。打开它就连不上。关机再开机好几次。在手机 App 里反复登录退出。它最后终于好了。我成功开始打印了某个东西，但它仍然不断从我的 App 上断开。","truncated":false,"url":"https://forum.creality.com/t/are-servers-down-cant-bind-to-cloud/27254","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"K1","grade":"有效","replyCount":12,"views":2151,"likeCount":1,"sourceType":"论坛"},{"uid":"a67a6ec5298e4120","date":"2025-01-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CP V 6 - an improvement to the control of Active chamber temperature","titleCn":"CP V 6 - 对主动腔体温度控制的改进","originalText":"At present you can:-\n1 Manually set chamber temperature before print (from K2 screen)\n2 Setting Print off (from CP V6 or other)\n3 Set chamber temperature after print (from K2 screen)\n4 Manually switch off chamber temperature. (from K2 screen)\nThe marketing suggested users had control of chamber temperature in order to improve print quality but at present with active chamber temperature it takes ages to reach desired temperature therefore making this feature less than advertised. The only remedy is to action the above manually at present.\nI recognise the chamber heater is not that powerful and therefore automating the above would allow better control day or night.\nI suggest the ability to automate this within the active chamber control on the filament page.\nfor example:-\nPartially related the Qidi Plus 4 printer had a problem with the Solid State Relay (SSR) where it would burn out in 115V countries, was fine in 230V (half the current). To fix it there was a new firmware written to lower the current draw as a temporary fix. Since then a new uprated SSR has been used to return to the correct output. Wondering if an upgraded SSR for the K2 would allow the higher temperature. …","textCn":"目前你可以： 1 打印前手动设置腔体温度（从 K2 屏幕） 2 设置打印关闭（从 CP V6 或其他） 3 打印后设置腔体温度（从 K2 屏幕） 4 手动关闭腔体温度（从 K2 屏幕） 营销暗示用户可以控制腔体温度以提升打印质量，但目前用主动腔体温度需要很久才能达到目标温度，因此让这个功能不如宣传的那样。目前唯一的补救办法是手动执行上述操作。 我明白腔体加热器功率不算大，因此把上述操作自动化可以让你无论白天黑夜都更好地控制。 我建议在耗材页面中的主动腔体控制里实现这一自动化。 例如： 与此部分相关的是，Qidi Plus 4 打印机的固态继电器（SSR）有个问题，在 115V 国家会烧坏，在 230V（电流减半）则没事。为了解决这个问题，他们写了一个新固件来降低电流消耗作为临时修复。之后使用了新的升级版 SSR 恢复到正确输出。想知道给 K2 升级 SSR 是否能允许更高的温度。…","truncated":true,"url":"https://forum.creality.com/t/cp-v-6-an-improvement-to-the-control-of-active-chamber-temperature/26745","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":14,"views":1176,"likeCount":1,"sourceType":"论坛"},{"uid":"9b719e3077cb6e7b","date":"2024-12-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.0 is Here!","titleCn":"Creality Print 6.0 来了！","originalText":"Creality Print 6-0\nCreality Print 6.0 is Here!\nUpgrade now /pages/download-software\nThis release transforms your 3D printing experience, prioritizing usability for a smoother and more efficient workflow with Creality Print.\nWhat’s New in 6.0?\nProfessional-level slicing made easy.\nEnjoy better print quality with updated Z-seam assembly modes, advanced overhangs, co\nSo, have you actually fixed it yet ???\nCreality Print version 6 “Problems”\nDialogue with the Creality Print V5 and above R&D Team Creality Print V5 and Beyond\n[pic2]\nWe are very pleased to welcome @Simmons-Creality from the Creality Print V5 and above R&D Team to our forum. You can share your usage experience, report bugs, and even express your future needs by filling out the feedback form below.\nCreality Print V5 and above Feedback Form\nIf the R&D Team finds your input particularly valuable, you may be invited to engage in in-depth discussions directly with the development team!\nEveryone can submit their issues in this form above. The R&D team will review the feedback regularly, thanks.","textCn":"Creality Print 6-0 Creality Print 6.0 来了！立即升级 /pages/download-software 这个版本改变了你的 3D 打印体验，优先考虑易用性，让 Creality Print 的工作流程更顺畅、更高效。6.0 有什么新内容？专业级切片变得简单。通过更新的 Z 接缝组装模式、高级悬垂、co 享受更好的打印质量。那么，你们到底修好了没有？？？Creality Print 版本 6「问题」与 Creality Print V5 及以上研发团队对话 Creality Print V5 及以后 [pic2] 我们非常高兴欢迎来自 Creality Print V5 及以上研发团队的 @Simmons-Creality 来到我们的论坛。你可以通过填写下面的反馈表分享使用体验、报告 bug，甚至表达你未来的需求。Creality Print V5 及以上反馈表 如果研发团队认为你的反馈特别有价值，你可能会被邀请直接与开发团队进行深入讨论！大家都可以在上面的表格中提交问题。研发团队会定期查看反馈，谢谢。","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-0-is-here/30336","productLine":"print","version":"6.0","versionRaw":"6.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":84,"views":7932,"likeCount":21,"sourceType":"论坛"},{"uid":"6c5a0550a94e8316","date":"2024-12-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Saving your file as a g-code","titleCn":"将文件保存为 G-code","originalText":"This is my first time 3d printing I am using version 5.1 . I am unable to save the file as a G-code. Can anyone help me?\nslice the object with button “slice plate”\nexport object with button “export plate”\nchange .3mf to .gcode\nsave the file\ndone\nThanks for taking the time to assist. My problem is that the export option only gives me the 2 options “export as a preset config” or export as a “model file”. Using the later states there is “no model selected to save”","textCn":"这是我第一次进行 3D 打印，我使用的是 5.1 版本。我无法把文件保存为 G-code。有人能帮我吗？ 用“slice plate”按钮对物体进行切片 用“export plate”按钮导出物体 把 .3mf 改成 .gcode 保存文件 完成 感谢你花时间帮助。我的问题是，导出选项只给我 2 个选项：“export as a preset config”或导出为“model file”。使用后者时会提示“no model selected to save”。","truncated":false,"url":"https://forum.creality.com/t/saving-your-file-as-a-g-code/25830","productLine":"print","version":"5.1","versionRaw":"5.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":2563,"likeCount":0,"sourceType":"论坛"},{"uid":"99044e95eaa0b26a","date":"2024-12-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Printer head crashes into center object when printing sequence is by object","titleCn":"按物体顺序打印时，打印头撞上中间的物体","originalText":"If I put multiple objects to print by object on the same plate and the center one is taller than the last object printed, when finished the head goes all the way to the side without lowering the bed, crashing into the center object.\nThe bed should lower to at least 45mm (maximum height allowed when printing by object) before the head moving all the way to the side.\nprint by object\nI don’t know if it’s a problem in Creality Print (currently 5.1.7.10514) or K1 firmware (1.3.3.29)\nIts a problem with the slicer, we are waiting for either an update or a workaround. I think the slicer bases it on a 24mm maximum height.\nI realized that also and what I saw was that the printer crashed into a part when cutting off filament!\nIf he cuts filament he moves from back to center and then to center left at the last height of the last part printed with old filament.\nIf there is any other part in this range which is higher it crashes into it!\nThe slicer would need to move the bed up to highest part level before issuing a filament change!","textCn":"如果我在同一块打印板上放置多个物体并按物体逐个打印，而且中间那个比最后打印的物体更高，那么打印完成后打印头会一路移到侧边，却不降低热床，结果撞上中间的物体。在打印头一路移到侧边之前，热床至少应该下降到 45mm（按物体打印时允许的最大高度）。按物体打印。我不知道这是 Creality Print（当前 5.1.7.10514）的问题还是 K1 固件（1.3.3.29）的问题。这是切片软件的问题，我们在等更新或变通方法。我认为切片软件是按 24mm 的最大高度来计算的。我也意识到了这一点，我看到的是打印机在切断耗材时撞上了一个零件！如果它切断耗材，它会从后面移到中间，然后移到中间偏左，高度是最后用旧耗材打印的零件的最后高度。如果这个范围内还有更高的零件，它就会撞上去！切片软件需要在执行换料之前把热床移动到最高零件的高度！","truncated":false,"url":"https://forum.creality.com/t/printer-head-crashes-into-center-object-when-printing-sequence-is-by-object/24930","productLine":"firmware","version":"","versionRaw":"","problemType":"crash","model":"K1","grade":"有效","replyCount":6,"views":237,"likeCount":1,"sourceType":"论坛"},{"uid":"c2f49dd36be9de41","date":"2024-12-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Trouble Slicing","titleCn":"切片遇到问题","originalText":"I am new to 3D printing and am having trouble slicing my designs from Tinker cad. After I make me design and save it then open it in the Creality app and chose to slice all it shows that it’s sliced so I download it to a flash drive, plug it in the printer it shows the flash drive as empty.\nHello Hopes2,\nDoes the name of file you put on the flash drive end with .gcode ??\nIf not reload the .stl file you created through Tinker Cad, onto the Creality app, slice it and then save the gcode it created to your flash drive.\nHope this helps.\nMy .stl files refuse to show up and if I try to copy and paste or drag it from files the software won’t recognize it. If I could guess what is wrong with it, it would take me an entire day to figure it out.","textCn":"我是 3D 打印新手，在给来自 Tinker cad 的设计做切片时遇到了问题。我做好设计并保存后，在 Creality 应用里打开它并选择全部切片，它显示已经切片了，于是我把它下载到 U 盘，插到打印机上，打印机却显示 U 盘是空的。\n你好 Hopes2，\n你放到 U 盘里的文件名是以 .gcode 结尾的吗？？\n如果不是，请把你通过 Tinker Cad 创建的 .stl 文件重新载入 Creality 应用，切片，然后把它生成的 G-code 保存到你的 U 盘。\n希望这有帮助。\n我的 .stl 文件根本不肯显示出来，如果我尝试复制粘贴或者从文件中拖拽，软件也识别不了。如果让我猜它出了什么问题，我得花上一整天才能弄明白。","truncated":false,"url":"https://forum.creality.com/t/trouble-slicing/23249","productLine":"cloud","version":"","versionRaw":"","problemType":"slice","model":"K1","grade":"有效","replyCount":5,"views":290,"likeCount":1,"sourceType":"论坛"},{"uid":"f781c43e9580bd14","date":"2024-11-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"My halot R6 won't have it's qr code scanned","titleCn":"我的 halot R6 的二维码扫不上","originalText":"Hi guys, I just got a Halot R6. Part of the installation asks you to scan a QR code displayed on the screen to pair the device with your account but it just won’t work. Every time I try a message pops up telling me to scan the QR code. Feels like I’ve tried everything to get it to work\nHi there. I’m having the same problem. Did you manage to sort yours?","textCn":"大家好，我刚拿到一台 Halot R6。安装的一部分要求你扫描屏幕上显示的二维码，以便把设备与你的账号配对，但就是不成功。每次我尝试，都会弹出一条消息让我扫描二维码。感觉我把能试的都试过了 你好。我也遇到同样的问题。你解决了吗？","truncated":false,"url":"https://forum.creality.com/t/my-halot-r6-wont-have-its-qr-code-scanned/22982","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":119,"likeCount":0,"sourceType":"论坛"},{"uid":"a29a3f08295b21c8","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Cloud WEB Built-in Slicer Engine Upgrade","titleCn":"Creality Cloud Web 内置切片引擎升级","originalText":"W e’re excited to announce an upgrade to the cloud slicing engine on the Creality Cloud Web. This update currently supports the following devices: Creality K1、K1 MAX、K1C、CR-10 SE、Ender-3 V3 KE、Ender-3 V3 Plus、Ender-3 V3、Ender-3 V3 SE (The resin printer will not be upgrading the engine this time). Along with a more stable and responsive cloud slicing experience, we’ve also added a setup wizard to the web slicing interface to help you get started quickly!\nHere’s how to use the new slicing feature:\nGo to the Creality Cloud Web model detail page and click “Cloud Slice”, select the file you want to slice and click “Try the new slicer” when you enter the slicer.\n1\n2\nWhen adding a printer for cloud slicing, the setup wizard will guide you. Select your printer and nozzle size, then click “next” to proceed to the material page, where you can choose your filament type and brand.\n3\nWe’ve improved the toolbar on the new page. Now, you can easily add or change printers and edit filament settings through the pop-ups.\n4\nThe process mode “Standard” offers official presets for your printer, and you can adjust these settings based on different process modes. …","textCn":"我们很高兴地宣布 Creality Cloud Web 上的云端切片引擎升级。本次更新目前支持以下设备：Creality K1、K1 MAX、K1C、CR-10 SE、Ender-3 V3 KE、Ender-3 V3 Plus、Ender-3 V3、Ender-3 V3 SE（本次树脂打印机不会升级引擎）。除了更稳定、更灵敏的云端切片体验外，我们还在网页切片界面中添加了设置向导，帮助你快速上手！ 以下是使用新切片功能的方法： 进入 Creality Cloud Web 的模型详情页，点击“Cloud Slice”，选择你要切片的文件，进入切片软件时点击“Try the new slicer”。 1 2 添加用于云端切片的打印机时，设置向导会引导你。选择你的打印机和喷嘴尺寸，然后点击“next”进入材料页面，在那里你可以选择耗材类型和品牌。 3 我们改进了新页面上的工具栏。现在，你可以通过弹窗轻松添加或更换打印机，并编辑耗材设置。 4 工艺模式“Standard”为你的打印机提供官方预设，你可以根据不同的工艺模式调整这些设置。……","truncated":true,"url":"https://forum.creality.com/t/creality-cloud-web-built-in-slicer-engine-upgrade/22420","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":717,"likeCount":0,"sourceType":"论坛"},{"uid":"8b8e009445cc65fd","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to Use .3MF Files in Creality Print?","titleCn":"如何在 Creality Print 中使用 .3MF 文件？","originalText":"How to Use .3MF Files in Creality Print?\nUsing Creality Print version 5.1 and above , you can adjust printing parameters for .3MF files. This article provides a detailed guide on how to utilize your .3MF files within Creality Print, as well as instructions on importing models in formats such as STL into Creality Print and converting them into .3MF print configuration files.\nI. How to Use Your .3MF Files in Creality Print\nFirst, you can refer to this article on What is .3MF Files and How to Obtain Them? . Once you have acquired a .3MF file, all the printing parameters, model data, and color information are already included. Therefore, there is no need for tedious model coloring or complex parameter adjustments. You only need to make minor tweaks, and in some cases, you can start printing without any adjustments at all.\nThe following sections will detail the process of printing after obtaining your .3MF file.\n.3MF\nStep 1: Open Creality Print 5.1 or a later version. After downloading the .3MF file to your local device, navigate to the file menu and select “Open Project.” Then, choose the corresponding .3MF file to open it. …","textCn":"如何在 Creality Print 中使用 .3MF 文件？\n使用 Creality Print 5.1 及以上版本，你可以为 .3MF 文件调整打印参数。本文详细介绍了如何在 Creality Print 中使用你的 .3MF 文件，以及如何将 STL 等格式的模型导入 Creality Print 并把它们转换为 .3MF 打印配置文件。\n一、如何在 Creality Print 中使用你的 .3MF 文件\n首先，你可以参考这篇关于什么是 .3MF 文件以及如何获取它们的文章。一旦你获得了 .3MF 文件，所有打印参数、模型数据和颜色信息都已经包含在内。因此，无需繁琐的模型上色或复杂的参数调整。你只需要做小幅微调，在某些情况下，你完全不需要任何调整就可以开始打印。\n以下章节将详细介绍在获得 .3MF 文件后进行打印的流程。\n.3MF\n第 1 步：打开 Creality Print 5.1 或更高版本。将 .3MF 文件下载到本地设备后，进入文件菜单并选择“打开项目”。然后，选择相应的 .3MF 文件打开它。…","truncated":true,"url":"https://forum.creality.com/t/how-to-use-3mf-files-in-creality-print/22431","productLine":"cloud","version":"5.1","versionRaw":"5.1","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":2,"views":2704,"likeCount":1,"sourceType":"论坛"},{"uid":"6e4518aba913b171","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"No USB Printing with Creality Print 5.1?","titleCn":"Creality Print 5.1 无法通过 USB 打印？","originalText":"No USB Printing with Creality Print 5.1?","textCn":"Creality Print 5.1 无法通过 USB 打印？","truncated":false,"url":"https://forum.creality.com/t/no-usb-printing-with-creality-print-5-1/22463","productLine":"print","version":"5.1","versionRaw":"5.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":22,"views":7701,"likeCount":4,"sourceType":"论坛"},{"uid":"6946ada1995110f9","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"What is .3MF Files and How to Obtain Them?","titleCn":"什么是 .3MF 文件以及如何获得它们？","originalText":".3mf files\nWhat is .3MF Files and How to Obtain Them?\nI. What is a .3MF File?\nThe .3MF (3D Manufacturing Format) is an open standard file format specifically designed for 3D printing. Its purpose is to provide a unified and efficient way to represent various aspects of 3D models, including geometry, color, texture, and material properties. This facilitates seamless transfer and printing across different 3D design software, slicing software, and 3D printers. Compared to other formats, the .3MF format offers enhanced compatibility and a richer set of features.II.\nII. Advantages of the 3MF File Format\nRichness: While the STL format is widely used, it lacks information regarding color and material properties. In contrast, the .3MF format includes comprehensive data on geometry, color, materials, and copyright information. This ensures data integrity and accuracy, reduces the risk of data loss, and enhances manufacturing efficiency and precision.\nEfficiency: The STL format can result in large file sizes due to the decomposition of complex contours into numerous small triangles, which negatively impacts speed and storage. …","textCn":".3mf 文件 什么是 .3MF 文件以及如何获得它们？ I. 什么是 .3MF 文件？ .3MF（3D 制造格式）是一种专为 3D 打印设计的开放标准文件格式。它的目的是提供一种统一且高效的方式来表示 3D 模型的各个方面，包括几何形状、颜色、纹理和材料属性。这促进了在不同 3D 设计软件、切片软件和 3D 打印机之间的无缝传输和打印。与其他格式相比，.3MF 格式提供了更好的兼容性和更丰富的功能集。II. II. 3MF 文件格式的优势 丰富性：虽然 STL 格式被广泛使用，但它缺少关于颜色和材料属性的信息。相比之下，.3MF 格式包含了关于几何形状、颜色、材料和版权信息的全面数据。这确保了数据的完整性和准确性，降低了数据丢失的风险，并提高了制造效率和精度。 效率：STL 格式由于把复杂轮廓分解成众多小三角形，可能导致文件体积很大，这对速度和存储都有负面影响。……","truncated":true,"url":"https://forum.creality.com/t/what-is-3mf-files-and-how-to-obtain-them/22429","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":1206,"likeCount":0,"sourceType":"论坛"},{"uid":"650c8a25e5840bd0","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Guide to Creating Quality Print Settings","titleCn":"创建高质量打印设置指南","originalText":"Creality Print\nGuide to Creating Quality Print Settings\nWant your print setting to be recognized in the community?\nFollow these guidelines to make your print setting more popular and downloaded by more people.\n*If you are wondering how to upload .3MF files to Creality Cloud, you can refer to this article: How to Upload .3MF Files to Creality Cloud?\nI. Make Your Print Setting More Popular\n1. Carefully optimized slicing parameter print setting\nCreality Cloud recommends that creators provide at least one physical photo of the print configuration to demonstrate printability, as photos of real model prints can increase user confidence in printing and the popularity of the print setting.\nCarefully optimized slicing parameter print setting\nMachine Setting: Generally no need to adjust.\nProcess Setting: First select a template like 0.2standrad@K2 Plus, then fine-tune parameters on the template, such as support/skirt.\nMaterial Parameters: First select a template like hyper pla, then fine-tune parameters like temperature and cooling.\nLayer Height: Choose a layer height suitable for model details and print speed, usually 0.1-0.2mm layer height can provide higher accuracy. …","textCn":"Creality Print 创建高质量打印设置指南 想让你的打印设置在社区里被认可吗？ 遵循这些准则，让你的打印设置更受欢迎、被更多人下载。 *如果你想知道如何把 .3MF 文件上传到 Creality Cloud，可以参考这篇文章：如何把 .3MF 文件上传到 Creality Cloud？ 一、让你的打印设置更受欢迎 1. 精心优化的切片参数打印设置 Creality Cloud 建议创作者至少提供一张打印配置的实物照片，以证明可打印性，因为真实模型打印的照片能增加用户打印的信心，并提高打印设置的受欢迎程度。 精心优化的切片参数打印设置 机器设置：一般无需调整。 工艺设置：先选择一个模板，如 0.2standrad@K2 Plus，然后在模板上微调参数，例如支撑/裙边。 材料参数：先选择一个模板，如 hyper pla，然后微调温度和冷却等参数。 层高：选择适合模型细节和打印速度的层高，通常 0.1-0.2mm 层高可以提供更高精度。…","truncated":true,"url":"https://forum.creality.com/t/guide-to-creating-quality-print-settings/22433","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":3829,"likeCount":0,"sourceType":"论坛"},{"uid":"32cd1fe17df4a510","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to Upload .3MF Files to Creality Cloud?","titleCn":"如何将 .3MF 文件上传到 Creality Cloud？","originalText":"Upload models\nHow to Upload .3MF Files to Creality Cloud?\nIn the previous article , we provided a detailed overview of the .3MF file format and its advantages, as well as how to obtain such files. Next, we will guide you on how to upload .3MF files to the Creality Cloud platform (via Creality Cloud and Creality Print). For better understanding, we recommend familiarizing yourself with the differences between .3MF model files and .3MF print setting files within the Creality Cloud platform.\nI. Uploading .3MF Files via the Creality Cloud Website/App\nMethod 1: Upload the .3MF file as a print setting\nUploading in the form of a print setting is currently only supported through the Creality Cloud website. On the model details page, find the upload entry for the .3MF print setting file, click “Add Print setting File”, and import the .3MF file exported by Creality Print 5.1 or a later version.\nAfter clicking “Confirm,” you will be able to see the .3MF print setting you uploaded in the print setting section of the model.\nMethod 2: Uploading .3MF Files as Model Files\nTo upload .3MF model files via the Creality Cloud website, refer to the screenshot below. …","textCn":"上传模型\n如何将 .3MF 文件上传到 Creality Cloud？\n在上一篇文章中，我们详细概述了 .3MF 文件格式及其优势，以及如何获取这类文件。接下来，我们将指导你如何将 .3MF 文件上传到 Creality Cloud 平台（通过 Creality Cloud 和 Creality Print）。为了更好地理解，我们建议你先熟悉 Creality Cloud 平台上 .3MF 模型文件和 .3MF 打印设置文件之间的区别。\n一、通过 Creality Cloud 网站/应用上传 .3MF 文件\n方法 1：将 .3MF 文件作为打印设置上传\n目前只有通过 Creality Cloud 网站才支持以打印设置的形式上传。在模型详情页面，找到 .3MF 打印设置文件的上传入口，点击“添加打印设置文件”，并导入由 Creality Print 5.1 或更高版本导出的 .3MF 文件。\n点击“确认”后，你就能在模型的打印设置区域看到你上传的 .3MF 打印设置。\n方法 2：将 .3MF 文件作为模型文件上传\n要通过 Creality Cloud 网站上传 .3MF 模型文件，请参考下面的截图。…","truncated":true,"url":"https://forum.creality.com/t/how-to-upload-3mf-files-to-creality-cloud/22430","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":788,"likeCount":0,"sourceType":"论坛"},{"uid":"28c68f8df4c8d800","date":"2024-11-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to Make the Most of Multi-Color .3MF Models on Creality Cloud?","titleCn":"如何在 Creality Cloud 上充分利用多色 .3MF 模型？","originalText":"Creality Cloud\nHow to Make the Most of Multi-Color .3MF Models on Creality Cloud?\nThe .3MF format print configuration files showcase immense potential and value in 3D printing due to their high versatility. This article will guide you on how to fully leverage the unique advantages of .3MF files on the Creality Cloud platform, from selecting files and editing models to configuring print parameters and sharing experiences with others, allowing you to explore multi-color models in Creality Cloud.\nI. Log in to Creality Cloud to Select and Print Your .3MF Multi-Color Model\nVisit the Creality Cloud website, click on “Models,” then select “Multi-Color Models.” Under the model file section, choose the .3MF option to filter and find your desired .3MF model files.\nOn this page, you can refine your selection based on personal preferences using the filtering tool in the upper right corner. This allows you to sift through numerous .3MF models to find the ones that best meet your expectations. Additionally, you can sort the options flexibly, making the search for your ideal model more efficient and personalized. …","textCn":"Creality Cloud。如何在 Creality Cloud 上充分利用多色 .3MF 模型？.3MF 格式的打印配置文件由于其高度的通用性，在 3D 打印中展现出巨大的潜力和价值。本文将指导你如何在 Creality Cloud 平台上充分利用 .3MF 文件的独特优势，从选择文件和编辑模型到配置打印参数以及与他人分享经验，让你在 Creality Cloud 中探索多色模型。一、登录 Creality Cloud 选择并打印你的 .3MF 多色模型。访问 Creality Cloud 网站，点击“Models”，然后选择“Multi-Color Models”。在模型文件部分，选择 .3MF 选项来筛选并找到你想要的 .3MF 模型文件。在此页面上，你可以使用右上角的筛选工具根据个人偏好进一步筛选。这样就能从众多 .3MF 模型中筛选出最符合你期望的模型。此外，你还可以灵活排序选项，让寻找理想模型更高效、更个性化。……","truncated":true,"url":"https://forum.creality.com/t/how-to-make-the-most-of-multi-color-3mf-models-on-creality-cloud/22432","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":760,"likeCount":0,"sourceType":"论坛"},{"uid":"b23a653c2d3120f0","date":"2024-11-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CR-200B CREALITY PRINT PROFILE?","titleCn":"CR-200B 的 CREALITY PRINT 配置？","originalText":"Hello everybody.\nI have a CR-200B which until now I have been using with Creality Slicer 4.8.2.\nI want to use Creality Print 5.1, but I don’t have the printer profile for this software.\nCould someone tell me where to find it or how to create it from Slicer 4.8.2?\nThanks in advance.\nCreality seems to have forgotten about us CR-200B owners as if we were a nightmare.","textCn":"大家好。我有一台 CR-200B，到目前为止一直使用 Creality Slicer 4.8.2。我想使用 Creality Print 5.1，但我没有这款软件的打印机配置。有人能告诉我到哪里找，或者如何从 Slicer 4.8.2 创建吗？提前感谢。Creality 似乎把我们 CR-200B 用户忘了，好像我们是一场噩梦。","truncated":false,"url":"https://forum.creality.com/t/cr-200b-creality-print-profile/22280","productLine":"print","version":"5.1","versionRaw":"5.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":254,"likeCount":2,"sourceType":"论坛"},{"uid":"b7b5f1ed058602aa","date":"2024-10-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Exporting Material settings","titleCn":"导出材料设置","originalText":"I’ve had too many fatal errors with CP 5 where I have the perfect material settings and then CP just wipes them out never to be seen again. This has caused major headaches. That being said: Is there a way to export “Material Settings” that I am not seeing? I want to have a record of Walls, speed, acceleration…settings. The only thing I am seeing in that panel is “Add, subtract, sync, edit and save as”. No export.\nI needed this today and figured it out. Leaving this here for posterity.\nFor Creality Print v5: File > Export > Preset Config (exports all presets)\nFor Creality Print v7: File > Export > Export Presets (allows you to pick which presets)\nBoth export all settings as a ZIP archive with JSONs of each setting. They can be imported (even between versions) using the same process as before but using the “Import” menu.","textCn":"我在 CP 5 上遇到过太多致命错误：我有了完美的材料设置，然后 CP 就把它们清掉，再也找不回来。这造成了很大的麻烦。话虽如此：有没有办法导出我看不到的“材料设置”？我想留下墙壁、速度、加速度……等设置的记录。我在那个面板里只看到“添加、减少、同步、编辑和另存为”。没有导出。 我今天需要这个，并且弄明白了。把它留在这里供后人参考。 对于 Creality Print v5：File > Export > Preset Config（导出所有预设） 对于 Creality Print v7：File > Export > Export Presets（允许你选择哪些预设） 两者都会把所有设置导出为一个 ZIP 压缩包，其中包含每个设置的 JSON。它们可以用和以前相同的过程导入（甚至跨版本），但要使用“导入”菜单。","truncated":false,"url":"https://forum.creality.com/t/exporting-material-settings/19488","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":442,"likeCount":0,"sourceType":"论坛"},{"uid":"34879b982201908f","date":"2024-09-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Prints are getting ribs on my K1 max","titleCn":"我的 K1 max 打印件出现肋纹","originalText":"I don’t know why but my prints with creality 5.x.x. suddenly get ribs (lines of the mesh on the outside) the surface is not smooth as it should be.\nI have the latest update creality slicer.\nAnyone have any idea’s what could be wrong???\nIt does it with all materials as pla, petg…\nThere could be a few mitigating factors, which version of CPrint are you using? Some versions work better than others, some are just painful to use. Creality has a repository of older versions.\nCould you post a pic of the issue?\nDo the “ribs” correspond to your infill pattern?\nThese are a few options that may contribute (V5.1.1.9490)\nScreenshot 2024-09-12 214821\nHope it helps!\nhere is a picture\n20240913_150533\nit looks very ugly.\nthe one wall on top setting I have already that box checked\nI have the latest version 5.1.4.10249.","textCn":"我不知道为什么，但我用 creality 5.x.x. 的打印件突然出现肋纹（外部的网格线），表面不像应该的那样光滑。 我用的是最新更新的 Creality 切片软件。 有人知道可能是什么问题吗？？？ 它对所有材料都这样，比如 pla、petg…… 可能有几个缓解因素，你用的是哪个版本的 CPrint？有些版本比其他版本好用，有些用起来就是很痛苦。Creality 有一个旧版本的仓库。 你能发一张问题的照片吗？ 这些“肋纹”和你的填充图案对应吗？ 这些是可能有影响的几个选项（V5.1.1.9490） Screenshot 2024-09-12 214821 希望有帮助！ 这是照片 20240913_150533 看起来非常难看。 顶层单壁那个设置我已经勾选了 我用的是最新版本 5.1.4.10249。","truncated":false,"url":"https://forum.creality.com/t/prints-are-getting-ribs-on-my-k1-max/17811","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"K1 Max","grade":"有效","replyCount":8,"views":461,"likeCount":1,"sourceType":"论坛"},{"uid":"aed0f18b10d4bf01","date":"2024-07-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Gcode Export Failed","titleCn":"G-code 导出失败","originalText":"Hello, on certain models I try to slice I keep getting \"gcode export to (insert my pc filepath here) failed. Cannot open the file for writing.\nIt happens randomly and only on certain models that I download the .stl file from. Any ideas?\nThanks,\n-Glenn.\ndid you find any solution ?\nTake a look in here:\nC:\\Users[UserName]\\AppData\\Roaming\\Creality\\Creative3D\\5.0\\tmpProject\nAssuming Windows 11","textCn":"你好，在某些模型上我尝试切片时总是收到「gcode 导出到（此处插入我的电脑文件路径）失败。无法打开文件进行写入。」它是随机发生的，而且只出现在我从某些网站下载的 .stl 文件的模型上。有什么想法吗？谢谢，-Glenn。你找到解决办法了吗？看看这里：C:\\Users[UserName]\\AppData\\Roaming\\Creality\\Creative3D\\5.0\\tmpProject 假设是 Windows 11","truncated":false,"url":"https://forum.creality.com/t/gcode-export-failed/14442","productLine":"print","version":"5.0","versionRaw":"5.0","problemType":"other","model":"未标注","grade":"有效","replyCount":8,"views":1022,"likeCount":0,"sourceType":"论坛"},{"uid":"b934e8b08c8decbe","date":"2024-06-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Solved Creality print 5.0.3.8744 object deletion no langer active","titleCn":"已解决 Creality print 5.0.3.8744 对象删除不再可用","originalText":"creality print 5.0.3.8744 is my version.\nI have lost the function object deletion, the object deletion screen is still there, but no objects to delete are on it while I am printing.\nobjectdeletion\nA few days ago it was all functioning well but now suddenly it has gone\nI already downloaded this latest version but with the same result\nAlso on the little screen on my K1 max object deletion is gone, no green X anymore???\nIt is solved :\nyou have to check the checkbox “exclude objects” in creality print 5.0.\nWhere is the “checkbox” you speak of in Creality Print 5 and how does that affect the printer screen?\nIt is under others (set advanced “on” to see it under others)\nobjectexcl\nIt affects On the printer screen by putting an extra symbol “X” on that screen which you can enter when you want delete a certain object and then select that object to exclude it from further printing.","textCn":"creality print 5.0.3.8744 是我的版本。我失去了对象删除功能，对象删除界面还在，但我打印时上面没有可删除的对象。 objectdeletion 几天前一切都正常，但现在它突然没了 我已经下载了这个最新版本但结果相同 另外在我的 K1 max 的小屏幕上，对象删除也没了，不再有绿色 X？？？ 已解决： 你必须在 creality print 5.0 中勾选“排除对象”复选框。 你说的“复选框”在 Creality Print 5 里在哪，它如何影响打印机屏幕？ 它在其他下面（把高级设为“开”才能在“其他”下面看到它） objectexcl 它对打印机屏幕的影响是在那个屏幕上增加一个额外的符号“X”，当你想要删除某个对象时可以进入它，然后选择该对象以将其排除在后续打印之外。","truncated":false,"url":"https://forum.creality.com/t/solved-creality-print-5-0-3-8744-object-deletion-no-langer-active/13425","productLine":"print","version":"5","versionRaw":"5","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":8,"views":1933,"likeCount":2,"sourceType":"论坛"},{"uid":"c92a712e20f8850f","date":"2024-06-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Missing Creality print 5 for linux","titleCn":"缺少适用于 linux 的 Creality print 5","originalText":"Hello, I would like to use the Creality Print for Linux.\nI noticed that the Linux and mac os version are very outdated when compared to windows version.\nI bought a flagship printer that was supposed to support linux users too.\nWhen will we have access to creality print 5?\nthank you\n+1\nany news?\nthank you\nEven just an update would be nice. Almost looks as if they dropped support for Linux/MacOs.\nBut it might not be a wise idea to update to 5.x\nI just updated my windows version to 5.1 and my printer (Ender 3 V3 SE) is now printing horribly. After initial print of the brim and supports, it sounds like the nozzle is just dragging across the print, and I’m get random AI noodling detection. I have tried re-calibrating everything and even factory reset the printer. But still having major print issues. Switched back to 4.3.8.x, and all is good again, I didn’t even have to re-calibrate the printer.","textCn":"你好，我想使用 Linux 版的 Creality Print。我注意到与 windows 版相比，Linux 和 mac os 版本非常过时。我买了一台旗舰打印机，本应也支持 linux 用户。我们什么时候才能用上 creality print 5？谢谢。+1。有消息吗？谢谢。哪怕只是一个更新说明也好。看起来他们几乎像是放弃了对 Linux/MacOs 的支持。但升级到 5.x 可能并不是个明智的主意。我刚刚把我的 windows 版本更新到了 5.1，我的打印机（Ender 3 V3 SE）现在打印得很糟糕。在打印完边缘和支撑之后，听起来喷嘴就在打印件上拖着走，而且我还随机收到 AI 面条检测。我试过重新校准所有东西，甚至把打印机恢复出厂设置。但仍然有严重的打印问题。换回 4.3.8.x 之后，一切又都好了，我甚至都不用重新校准打印机。","truncated":false,"url":"https://forum.creality.com/t/missing-creality-print-5-for-linux/12204","productLine":"print","version":"5","versionRaw":"5","problemType":"compat","model":"K1 Max","grade":"有效","replyCount":6,"views":1397,"likeCount":3,"sourceType":"论坛"},{"uid":"d08c44de98e1dccd","date":"2024-05-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Why is there not a LW-PLA Profile in Creality Print?","titleCn":"为什么 Creality Print 里没有 LW-PLA 配置？","originalText":"Both the latest K1 firmware update and the slicer update have improved my prints. But I still do not see a profile for LW PLA. Is there an intention to include a profile anytime soon? Or is there a good profile in the community (which uses Creality Slicer)?\nI print mostly RC planes and it would be great to use the Creality Slicer and K1 as it prints most other materials very well.\nThe foaming differs a lot from manufacturer to manufacturer. Since Creality has no LW-PLA that they sell which I would be aware of, they probably don’t add it because for example Eryone LW PLA would need a much different setting than Polymaker LW PLA.\nCreality does have a lw-pla now. It is a hyper type that prints the speeds of regular pla they say. As for other brands of lw-pla you might have to create your own profile or look to other communities for info on profiles for the k1 series printers. Im woring on creating my own for other brands of the filament.","textCn":"最新的 K1 固件更新和切片软件更新都改善了我的打印。但我仍然看不到 LW PLA 的配置。近期有加入配置的打算吗？或者社区里有没有好的配置（使用 Creality Slicer 的）？我主要打印 RC 飞机，能用 Creality Slicer 和 K1 就太好了，因为它打印大多数其他材料都很好。发泡程度在不同厂商之间差异很大。据我所知 Creality 没有自己销售的 LW-PLA，所以他们可能不会添加，因为例如 Eryone LW PLA 需要的设置和 Polymaker LW PLA 差别很大。Creality 现在确实有 lw-pla 了。他们说这是一种 hyper 类型，能以普通 pla 的速度打印。至于其他品牌的 lw-pla，你可能得自己创建配置，或者去其他社区找 k1 系列打印机的配置信息。我正在为其他品牌的耗材制作自己的配置。","truncated":false,"url":"https://forum.creality.com/t/why-is-there-not-a-lw-pla-profile-in-creality-print/10919","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":3,"views":1779,"likeCount":0,"sourceType":"论坛"},{"uid":"1b66371de146bae8","date":"2024-05-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bug Report：Creality_Print-v5.0.0.8636,Exhaust fan never turned on","titleCn":"Bug 报告：Creality_Print-v5.0.0.8636，排气风扇从未开启","originalText":"I tried to set the value of Active Air filtration from 0,1,255,but the exhaust fan never turned on for my K1C.I have to turned it on manually every time,this never happens when using creality print 4.3.\nCan any one tell me how to set correct value for this parameter or this is a bug for creality print?\nscreen\nleavic:\nbasic info\ntoip icon on the left (printer) then click the edit pencil\nclick advanced top right\nclick tab basic information, Accessory and then\ncheck the auxiliarly cooling fan untill it lights up green\nThanks for reply.\nI’ve double checked and pretty sure those options are enabled here,still not working.When printing,all fans worked except the Back(Exhaust)fan.\nscreen23\nSomething strange is that this option is only a check box in orca slicer,I don’t quite understand why here is a text box for creality print,which value am I supposed to enter here?\nscreen1\nThe creality print 5 seems like a forked orca slicer combining old creality print4.Too many bugs here and I’ve rolled back to creality print 4.3 until they build a new release which I hope could be better.\nAnother tiny bug is there is no total layer count when printing,which is not so serious but still annoying.\nbug1","textCn":"我尝试将主动空气过滤的值设置为 0、1、255，但我的 K1C 的排气风扇从未开启。我每次都必须手动打开它，使用 Creality Print 4.3 时从未发生过这种情况。有人能告诉我如何为这个参数设置正确的值，还是说这是 Creality Print 的一个 bug？屏幕 leavic：基本信息 左侧的 toip 图标（打印机），然后点击编辑铅笔 点击右上角的高级 点击“基本信息”选项卡、“附件”，然后 勾选辅助冷却风扇，直到它亮起绿色 感谢回复。我再次检查过，很确定这些选项在这里已启用，但仍然不工作。打印时，所有风扇都工作，除了后部（排气）风扇。screen23 奇怪的是，在 Orca 切片软件中这个选项只是一个复选框，我不太明白为什么这里 Creality Print 是一个文本框，我应该在这里输入什么值？screen1 Creality Print 5 似乎是一个分支版的 Orca 切片软件，结合了旧的 Creality Print 4。这里 bug 太多了，我已经回滚到 Creality Print 4.3，直到他们发布新版本，我希望那会更好。另一个小 bug 是打印时没有总层数，这不那么严重，但仍然很烦人。bug1","truncated":false,"url":"https://forum.creality.com/t/bug-report-creality-print-v5-0-0-8636-exhaust-fan-never-turned-on/10730","productLine":"thirdparty","version":"4.3","versionRaw":"4.3","problemType":"other","model":"K1C","grade":"有效","replyCount":18,"views":1545,"likeCount":2,"sourceType":"论坛"},{"uid":"e1f49ba1919b0aa0","date":"2024-05-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to get things the correct size?","titleCn":"如何得到正确尺寸？","originalText":"Hi all. When I do a drawing in sketchup I save it as an STL file after I size the drawing in units (i.e. inches) that I want to end up with. For example I want a disk to be 2 inches in diameter. If I print it as it ends up in the printer I get something tiny (1/4\") If I scale it at 1600 it looks right but there is no way to tell until it prints. It is just trial and error. Is there a way that I can print it so it ends up with the dimensions defined in the original sketchup drawing?\nCould it be that you are mixing metric and imperial units?\nIf you are using Creality Print there is a ruler where you can measure the prints on their X, Y or Z axis. It’s in mm so you will have to do some converting…\nAlso maybe try and test a simple disk in Tinker Cad or something and see how that compares. It might just be the sketch program…","textCn":"大家好。当我在 sketchup 里画图时，我按想要的最终单位（比如英寸）给图形定好尺寸，然后存为 STL 文件。例如我想要一个直径 2 英寸的圆盘。如果我按它在打印机里最终的样子打印，我得到的东西很小（1/4\"）。如果我按 1600 缩放它看起来对了，但打印前没法确认。这纯粹是反复试错。有没有办法让我打印出来的尺寸就是原始 sketchup 图纸里定义的尺寸？ 会不会是你把公制和英制单位混了？ 如果你用 Creality Print，有一个标尺可以在 X、Y 或 Z 轴上测量打印件。它是毫米，所以你得做些换算…… 另外也许可以试试在 Tinker Cad 里做一个简单的圆盘看看比较如何。可能只是画图程序的问题……","truncated":false,"url":"https://forum.creality.com/t/how-to-get-things-the-correct-size/10248","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":17,"views":12325,"likeCount":0,"sourceType":"论坛"},{"uid":"3e066253cb276dab","date":"2024-04-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 5.0.0 Release and Above Version Upgrade","titleCn":"Creality Print 5.0.0 版本及更高版本的升级","originalText":"pic1\nW e are delighted to announce that the brand new version 5.0 has been released officially, with all upgrades aimed at improving user experience.\nFirstly, with a new user interface and interaction experience, the process settings system has become simpler, and the slicer has become more user-friendly and intelligent. The K series/v3 high-speed machines now support 42 kinds of official filaments and general parameters. We have not only readjusted the machine process parameters, but all parameters can be saved and exported for sharing.\nMoreover, through our ongoing efforts, version 5.0 has faster printing speed and better printing quality.Now let’s see together what other surprises there.\n1. Key Improvements\n1.1 Revolutionary User Experience\nComprehensive Upgrade of UI\nWith the upgrading of the company’s Corporate Identity (VI) system to version 5.0, we have rolled out a fully revamped UI system. A brand-new logo, theme color, icons, and page layout will be introduced to provide users with a fresh visual experience.\npic1\nWe adjusted the UI layout after the upgrade according to mainstream visual habits: we repositioned the toolbar and prioritized the process setting systems. …","textCn":"pic1\n我们很高兴地宣布，全新的 5.0 版本已正式发布，所有升级都旨在改善用户体验。\n首先，凭借全新的用户界面和交互体验，工艺设置系统变得更简单，切片软件也变得更友好、更智能。K 系列/v3 高速机型现在支持 42 种官方耗材和通用参数。我们不仅重新调整了机器工艺参数，而且所有参数都可以保存并导出用于分享。\n此外，通过我们持续的努力，5.0 版本拥有更快的打印速度和更好的打印质量。现在让我们一起看看还有哪些其他惊喜。\n1. 关键改进\n1.1 革命性的用户体验\nUI 全面升级\n随着公司企业形象（VI）系统升级到 5.0 版本，我们推出了全面革新的 UI 系统。全新的标志、主题色、图标和页面布局将被引入，为用户提供全新的视觉体验。\npic1\n升级后，我们按照主流视觉习惯调整了 UI 布局：我们重新定位了工具栏，并优先考虑工艺设置系统。…","truncated":true,"url":"https://forum.creality.com/t/creality-print-5-0-0-release-and-above-version-upgrade/10157","productLine":"thirdparty","version":"5","versionRaw":"5","problemType":"ui","model":"K1 Max","grade":"有效","replyCount":275,"views":24954,"likeCount":136,"sourceType":"论坛"},{"uid":"7ffa1186e1052123","date":"2024-01-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Firmware for Ender 3 with Sprite and BL Touch","titleCn":"用于配备 Sprite 和 BL Touch 的 Ender 3 的固件","originalText":"I have an original Ender 3 that has been upgraded as follows:\n4.2.7 motherboard\nBL Touch\nSprite Extruder Pro\nThe printer worked fine after I installed the new MB and BL Touch. After installing the new extruder and using the only firmware I could find that claims to support the touch sensor and Sprite extruder bed levelling doesn’t work properly. If I level the bed from the printer interface it goes through the mesh routine, but at the end it returns to the middle of the bed and drives the hot end into the build plate.\nI have run the self-test on the BL touch and it always passes, so I don’t think it’s my sensor.\nDoes anybody have suggestions for where to find a known working firmware file for this configuration? I can’t believe that I’m the only person who has installed a BL touch and Sprite extruder on an original Ender 3.\nHi @Dustin and welcome to the forums.\nYou should find that the firmware needed for your printer along with the 4.2.7 board, cr touch and sprite extruder is Ender-3Pro_HW4.2.7_SW2.0.9.03_SpritExt_H300 dated: 02 Aug. 2022 which can be found here:\nEnder 3 Firmware\nHope that helps. …","textCn":"我有一台原版 Ender 3，做了如下升级：4.2.7 主板；BL Touch；Sprite Extruder Pro。在装上新主板和 BL Touch 之后，打印机工作正常。装上新的挤出机并使用我唯一能找到的、声称支持该触摸传感器和 Sprite 挤出机热床调平的固件之后，热床调平就不正常了。如果我从打印机界面调平热床，它会走完网格测量流程，但最后会回到热床中央，然后把热端顶进打印平台。我对 BL touch 跑过自检，每次都通过，所以我不认为问题出在我的传感器上。有人能建议去哪里找这个配置下已知可用的固件文件吗？我不相信我是唯一一个在原版 Ender 3 上装了 BL touch 和 Sprite 挤出机的人。你好 @Dustin，欢迎来到论坛。你应该会发现，你的打印机配 4.2.7 主板、cr touch 和 sprite 挤出机所需的固件是 Ender-3Pro_HW4.2.7_SW2.0.9.03_SpritExt_H300，日期：2022 年 8 月 2 日，可以在这里找到：Ender 3 固件。希望这有帮助。……","truncated":true,"url":"https://forum.creality.com/t/firmware-for-ender-3-with-sprite-and-bl-touch/5189","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":10004,"likeCount":2,"sourceType":"论坛"},{"uid":"0c9306732a374f35","date":"2024-01-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print and Sonic Pad","titleCn":"Creality Print 与 Sonic Pad","originalText":"I have a Sonic Pad with an Ender 5 plus and an Ender 3 V3 SE connected, I can connect to the Sonic Pad through a browser no problem. Creality Print can see Sonic Pad and the printers printers when I do auto scan but it will not add them. Manually tried to add them and it still won’t add them. Am I missing something or is it a bug in Creality print? I have an Ender 3 V3 KE at home and that connects to Creality print, but is connected to a Nebula pad not a Sonic Pad. Any thoughts? Tried raising it with support but as usual all quiet on the western front.\nHi @Bonfireman and welcome to the forums.\nI have not had a chance to play with the Sonic Pad as yet but it sounds to me that the slicer is only able to communicate with the Pad itself and not the printers attached to the Pad. This could be deliberate or could be an oversight in the software/firmware.\nSupport have been inundated with support requests lately so bare with them and they should get back to you soon. I have been told that the live chat via the Creality app or their Facebook support pages are usually the quickest for responses. …","textCn":"我有一台 Sonic Pad，连接着 Ender 5 plus 和 Ender 3 V3 SE，我可以通过浏览器毫无问题地连接到 Sonic Pad。当我自动扫描时，Creality Print 能看到 Sonic Pad 和那些打印机，但它不会添加它们。我手动尝试添加它们，仍然添加不了。是我漏掉了什么，还是 Creality Print 的 bug？我家里有一台 Ender 3 V3 KE，那台能连接到 Creality Print，但它连接的是 Nebula Pad 而不是 Sonic Pad。有什么想法吗？我试着向支持反映，但和往常一样，西线无战事般的寂静。 你好 @Bonfireman，欢迎来到论坛。 我还没有机会摆弄 Sonic Pad，但在我看来，切片软件只能与 Pad 本身通信，而不能与连接到 Pad 的打印机通信。这可能是故意的，也可能是软件/固件中的疏忽。 支持团队最近被支持请求淹没了，所以请耐心等待，他们应该很快会回复你。有人告诉我，通过 Creality 应用或其 Facebook 支持页面的在线聊天通常回复最快。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-and-sonic-pad/4582","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":12,"views":3863,"likeCount":3,"sourceType":"论坛"},{"uid":"4450f82317e05e40","date":"2023-12-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Need firmware updates but in English","titleCn":"需要英文版固件更新","originalText":"I correctly installed the firmware update on my e3 v3 se, unfortunately, now my screen is now i think in Chinese and I cannot figure out how to change the language to English.\nIn addition, the printer runs very slow and changing velocity has no effect.\nIs there a firmware update in English so I can attempt to figure out the issue?\nHi @SKIP_L_Goebel and welcome to the forums.\nThere seems to be an odd glitch with the 1.0.6 SE firmware and the language.\nOne known fix is to try the following…\nDownload the firmware files from the website E3 V3 SE - Firmware Download.\nExtract the contents of the zip file.\nRename Ender-3 V3 SE_HWCR4NS200320C13_SWV1.0.6_GD303.bin to Firmware.bin\nCopy the Firmware.bin file to your SD card.\nInsert the card in to the printer and power on.\nOnce complete power off the printer and remove the SD card and delete any files left on the card if necessary.\nIf the issue still persists please try updating the screen firmware using a Micro SD card as follows…\nInsert the Micro SD card into your computer and format as FAT32 and allocation size of 4096.\nCopy the only the TJC_SET folder and its contents to the Micro SD card. …","textCn":"我在我的 e3 v3 se 上正确安装了固件更新，不幸的是，现在我的屏幕我觉得是中文的，我搞不懂怎么把语言改成英语。 另外，打印机运行非常慢，改变速度也没有效果。 有英文版的固件更新吗，这样我可以试着弄清楚问题？ 嗨 @SKIP_L_Goebel，欢迎来到论坛。 1.0.6 SE 固件和语言似乎存在一个奇怪的故障。 一个已知的解决办法是试试以下操作…… 从网站 E3 V3 SE - Firmware Download 下载固件文件。 解压 zip 文件的内容。 将 Ender-3 V3 SE_HWCR4NS200320C13_SWV1.0.6_GD303.bin 重命名为 Firmware.bin 把 Firmware.bin 文件复制到你的 SD 卡。 把卡插入打印机并开机。 完成后关闭打印机，取出 SD 卡，必要时删除卡上残留的文件。 如果问题仍然存在，请尝试按以下方式用 Micro SD 卡更新屏幕固件…… 把 Micro SD 卡插入电脑，格式化为 FAT32，分配单元大小为 4096。 只把 TJC_SET 文件夹及其内容复制到 Micro SD 卡。……","truncated":true,"url":"https://forum.creality.com/t/need-firmware-updates-but-in-english/2828","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":11,"views":5158,"likeCount":3,"sourceType":"论坛"},{"uid":"aae9155dab86a1ac","date":"2023-12-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print not connecting to printer","titleCn":"Creality Print 无法连接到打印机","originalText":"My Ender 3 V3 KE is no longer showing up under devices in Creality Print. The printer is online and is showing as online in Creality Cloud. If I look in the personal center in Creality Print, I see the printer under devices, but it shows as offline and disconnected. It I attempt to manually add the printer using its IP address, I get a message that it cannot be found. I am using the latest version of Creality Print for Windows. I have uninstalled Creality Print completely, clearing all config files, and reinstalled, but it still does not work.\nIt sounds like network connectivity to the app may be blocked by Windows or possibly antivirus software. To check if Windows it blocking the app do the following…\nClick Start Menu and then type “Windows Defender Firewall” and hit enter.\nSelect “Allow an app or feature through Windows Defender Firewall” on the sidebar.\nSelect “Change Settings” above the list of apps.\nScroll down and locate “Creality Print” and ensure the relevant boxes are ticked.\nSelect OK to save the changes.\nUPDATE: It just started working again, leading me to believe there was an issue on the backend\nWhat is odd is that it used to work fine and now does not. …","textCn":"我的 Ender 3 V3 KE 不再出现在 Creality Print 的设备下。打印机在线，并且在 Creality Cloud 中显示为在线。如果我看 Creality Print 的个人中心，我在设备下能看到打印机，但它显示为离线和断开连接。如果我尝试用它的 IP 地址手动添加打印机，我会收到一条无法找到它的消息。我用的是 Windows 版最新的 Creality Print。我已经完全卸载了 Creality Print，清除了所有配置文件并重新安装，但仍然不行。听起来可能是 Windows 或杀毒软件阻止了应用访问网络。要检查 Windows 是否阻止了该应用，请执行以下操作……点击开始菜单，然后输入“Windows Defender 防火墙”并按回车。在侧边栏选择“允许应用或功能通过 Windows Defender 防火墙”。在应用列表上方选择“更改设置”。向下滚动找到“Creality Print”，确保相关复选框已勾选。选择确定以保存更改。更新：它刚刚又开始工作了，这让我相信是后端出了问题。奇怪的是，它以前工作正常，现在却不行了。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-not-connecting-to-printer/2644","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":74,"views":34619,"likeCount":43,"sourceType":"论坛"},{"uid":"7ade6dc632808120","date":"2023-11-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender 3 Pro Z-Axis troubleshooting","titleCn":"Ender 3 Pro Z 轴故障排查","originalText":"New to the forum because I’m doing some troubleshooting for my son. I haven’t been able to find this issue described elsewhere. Sorry for the long post, just trying to be thorough.\nHe’s had an Ender 3 Pro for just over a year now - Marlin bugfix-2.0.x, 2021-12-07. BTT SKR Mini E3 V3.0 board - and we’re running into issues with Z axis positioning. Something is preventing the Z home from being set at it’s actual zero position.\nThe couple ways we’ve experienced this issue:\n-Before we start any print, we have to manually position the Z axis at the bed by disabling the stepper motors. But upon starting the print, the Z-axis raises up off the bed, runs what I’ve assumed is an extruder purge along the Y-axis, moves over to the print location, but then does not drop back down to the bed. If the print is paused, the extruder is moved to a rest position (X = 0, Y = max, Z = same height) and there is not an option to disable the stepper motors so we can drop the nozzle back to the bed. The only option for adjusting the Z-axis is in the positive direction. …","textCn":"我是新来的，因为我在帮儿子做一些故障排查。我没能在其他地方找到对这个问题的描述。抱歉帖子有点长，只是想说得详尽一些。他用 Ender 3 Pro 有一年多了——Marlin bugfix-2.0.x，2021-12-07。BTT SKR Mini E3 V3.0 主板——我们遇到了 Z 轴定位的问题。有东西阻止 Z 轴回零被设定在它真正的零位。我们遇到这个问题的几种情况：- 在开始任何打印之前，我们必须通过禁用步进电机手动把 Z 轴放到热床上。但一开始打印，Z 轴就会从热床上升起来，沿 Y 轴执行一个我以为是挤出机冲刷的动作，移动到打印位置，然后就再也不降回热床。如果打印暂停，挤出机会移动到一个休息位置（X = 0，Y = 最大，Z = 同一高度），而且没有禁用步进电机的选项，所以我们无法把喷嘴降回热床。调整 Z 轴的唯一选项是正方向。……","truncated":true,"url":"https://forum.creality.com/t/ender-3-pro-z-axis-troubleshooting/1916","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":7,"views":1215,"likeCount":1,"sourceType":"论坛"},{"uid":"0835a822c22f1024","date":"2023-02-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"About the Software category","titleCn":"关于软件版块","originalText":"Dedicated section for the Creality software, like Creality Print, Creality Cloud and so on. Everyone can discussion all topics related to these models.\nCan you add a Screen shot in Creality Print to the Camera.","textCn":"Creality 软件的专用版块，例如 Creality Print、Creality Cloud 等。所有人都可以讨论与这些型号相关的所有话题。 你能在 Creality Print 中给相机加上截图功能吗。","truncated":false,"url":"https://forum.creality.com/t/about-the-software-category/34","productLine":"cloud","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":5884,"likeCount":3,"sourceType":"论坛"}]};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad2(n){return n<10?"0"+n:""+n;}
function uniq(a){var o={},r=[];a.forEach(function(x){if(x&&!o[x]){o[x]=1;r.push(x);}});return r;}
function countBy(list,fn){var m={};list.forEach(function(x){var k=fn(x);if(k){m[k]=(m[k]||0)+1;}});return m;}
function majorOf(v){ var m=String(v||"").match(/^(\d{1,2})/); return m? m[1]+".x" : ""; }
function isCN(it){ return /[\u4e00-\u9fff]/.test((it.titleCn||"")+(it.textCn||"")); }
function langOf(it){
  if(/[\u4e00-\u9fff]/.test((it.title||"")+(it.originalText||""))) return "中文";
  return it.language || "EN";
}
function daysAgo(n){
  var d=new Date(REF||new Date()); d.setHours(0,0,0,0); d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function inRange(it){
  if(S.range==="all") return true;
  var n={"7":7,"30":30,"90":90}[S.range]||0;
  if(!n) return true;
  return (it.date||"") >= daysAgo(n);
}

/* ---------------- 过滤 ---------------- */
function match(it,skip){
  if(skip!=="product" && S.product && (it.productLine||"未标注")!==S.product) return false;
  if(skip!=="major" && S.major && majorOf(it.version)!==S.major) return false;
  if(skip!=="version" && S.version && (it.version||"未标注")!==S.version) return false;
  if(skip!=="problem" && S.problem && (it.problemType||"未分类")!==S.problem) return false;
  if(skip!=="model" && S.model && (it.model||"未标注")!==S.model) return false;

  if(skip!=="channel" && S.channel && (it.channel||"未知")!==S.channel) return false;

  if(!inRange(it)) return false;
  if(S.q){
    var q=S.q.toLowerCase();
    var hay=((it.title||"")+" "+(it.titleCn||"")+" "+(it.originalText||"")+" "+(it.textCn||"")).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function apply(skip){ return ITEMS.filter(function(x){ return match(x,skip); }); }

  var users = apply();
  var extra = KIND==="sw"
    ? '<span>有效问题 <b>'+ITEMS.filter(function(x){return x.grade==="有效";}).length+'</b></span>'
    : '<span>独立信源 <b>'+uniq(ITEMS.map(function(x){return x.site;})).length+'</b> 家</span>';
  var logs = M.updateLog||[];
  document.getElementById("updateBar").innerHTML =
    '<span><span class="live"></span>数据更新至 <b>'+esc(M.updatedDate||REF)+'</b></span>'+
    '<span>批次时刻 <b>'+esc(M.batch||"工作日 03:30")+'</b></span>'+
    '<span>总条数 <b>'+ITEMS.length+'</b></span>'+ extra +
    (logs.length? '<button class="hbtn" onclick="document.getElementById(\'updHist\').classList.toggle(\'on\')">更新历史 ▾</button>':'');
  if(logs.length){
    document.getElementById("updHist").innerHTML = logs.map(function(l){
      return '<div class="hl"><span class="hd">'+esc(l.date)+'</span><span>'+esc(l.text)+'</span></div>';
    }).join("");
  }
}

/* ---------------- KPI ---------------- */
function kpiCard(c){
  return '<div class="kpi"><div class="k-label">'+c.l+'</div>'+
    '<div class="k-value" style="color:'+(c.c||"#e6edf3")+'">'+c.v+'</div>'+
    '<div class="k-sub">'+c.s+'</div></div>';
}
function renderKPI(){
  var cards = [];
  if(KIND==="sw"){
    var valid = ITEMS.filter(function(x){return x.grade==="有效";}).length;
    var vers = ITEMS.filter(function(x){return x.version;});
    var models = uniq(ITEMS.map(function(x){return x.model;}).filter(function(m){return m && m!=="未标注";}));
    var m30 = ITEMS.filter(function(x){ return (x.date||"") >= daysAgo(30); }).length;
    var m7 = ITEMS.filter(function(x){ return (x.date||"") >= daysAgo(7); }).length;
    cards = [
      {l:"总声量", v:ITEMS.length, s:"Creality Print "+ITEMS.filter(function(x){return x.productLine==="print";}).length+
        " · 固件 "+ITEMS.filter(function(x){return x.productLine==="firmware";}).length+
        " · 云+APP "+ITEMS.filter(function(x){return x.productLine==="cloud";}).length+
        " · 第三方 "+ITEMS.filter(function(x){return x.productLine==="thirdparty";}).length, c:"#e6edf3"},
      {l:"有效问题率", v:(valid/ITEMS.length*100).toFixed(1)+"%",
        s:valid+" / "+ITEMS.length+" · 泛讨论 "+(ITEMS.length-valid)+" 条只计声量", c:"#f85149"},
      {l:"覆盖版本", v:uniq(vers.map(function(x){return x.version;})).length,
        s:"已归一为主.次 · 7.x "+vers.filter(function(x){return majorOf(x.version)==="7.x";}).length+
          " · 6.x "+vers.filter(function(x){return majorOf(x.version)==="6.x";}).length, c:"#58a6ff"},
      {l:"覆盖机型", v:models.length,
        s:"未标注 "+ITEMS.filter(function(x){return !x.model||x.model==="未标注";}).length+" 条（原帖未提机型）", c:"#e6edf3"},
      {l:"近 30 日新增", v:m30, s:"近 7 日 "+m7+" 条 · 按发帖日计入", c:"#d29922"}
    ];
  }else{
    var sites = uniq(ITEMS.map(function(x){return x.site;}));
    cards = [
      {l:"总声量", v:ITEMS.length, s:"媒体 "+ITEMS.filter(function(x){return x.sourceType==="媒体";}).length+
        " · 官方 "+ITEMS.filter(function(x){return x.sourceType==="官方";}).length, c:"#e6edf3"},
      {l:"独立信源", v:sites.length, s:sites.join(" · ").slice(0,42), c:"#58a6ff"},
      {l:"官方动作", v:ITEMS.filter(function(x){return x.sourceType==="官方";}).length, s:"厂商官方账号发布的内容", c:"#3fb950"},
      {l:"覆盖渠道", v:uniq(ITEMS.map(function(x){return x.channel;})).length,
        s:uniq(ITEMS.map(function(x){return x.channel;})).join(" · ").slice(0,40), c:"#e6edf3"},
      {l:"近 7 日新增", v:ITEMS.filter(function(x){return (x.date||"")>=daysAgo(7);}).length,
        s:"按发布日期计入", c:"#6e7681"}
    ];
  }
  document.getElementById("kpiRow").innerHTML = cards.map(kpiCard).join("");
}

/* ---------------- 面板 ---------------- */
function barRows(rows,total,pickKey,colorFn){
  if(!rows.length) return '<div class="empty">当前筛选下无数据</div>';
  var mx = Math.max.apply(null, rows.map(function(r){return r[1];}));
  return rows.map(function(r){
    var c = colorFn? colorFn(r[0]) : "#58a6ff";
    var on = S[pickKey]===r[0] ? " on" : "";
    return '<div class="brow'+on+'" data-pick="'+pickKey+'" data-val="'+esc(r[0])+'">'+
      '<span class="nm" title="'+esc(r[0])+'">'+esc(r[0])+'</span>'+
      '<span class="track"><i class="fill" style="width:'+(mx?(r[1]/mx*100):0)+'%;background:'+c+'"></i></span>'+
      '<span class="vl">'+r[1]+' · '+(total?(r[1]/total*100).toFixed(1):"0.0")+'%</span></div>';
  }).join("");
}
function panel(title,note,inner,span){
  return '<div class="panel"'+(span?' style="grid-column:1/-1"':'')+'><h3>'+title+'<span>'+note+'</span></h3>'+inner+'</div>';
}
function matrixTable(){
  var keys=["crash","slice","quality","ui","compat","feature","other"];
  var valid = ITEMS.filter(function(x){return x.grade==="有效" && x.version;});
  var majors = uniq(valid.map(function(x){return majorOf(x.version);})).sort(function(a,b){return parseFloat(b)-parseFloat(a);});
  if(!majors.length) return '<div class="empty">无可归类的版本数据</div>';
  var mx = 1;
  majors.forEach(function(mv){
    keys.forEach(function(k){
      var n = valid.filter(function(x){return majorOf(x.version)===mv && x.problemType===k;}).length;
      if(n>mx) mx=n;
    });
  });
  var head = '<tr><th>主版本</th>'+keys.map(function(k){return '<th>'+PROBLEM_NAME[k]+'</th>';}).join("")+'<th>合计</th><th>月均</th></tr>';
  var body = majors.map(function(mv){
    var sub = valid.filter(function(x){return majorOf(x.version)===mv;});
    var dates = sub.map(function(x){return x.date;}).sort();
    var span = 1, tot = sub.length;
    if(dates.length){ span = Math.max(1, Math.round((new Date(dates[dates.length-1])-new Date(dates[0]))/(1000*60*60*24*30))); }
    var tds = keys.map(function(k){
      var n = sub.filter(function(x){return x.problemType===k;}).length;
      var bg = n? 'background:rgba(88,166,255,'+(0.10+0.55*(n/mx)).toFixed(2)+')' : 'color:#484f58';
      return '<td style="'+bg+'">'+(n||"—")+'</td>';
    }).join("");
    return '<tr><td>'+mv+'</td>'+tds+'<td style="font-weight:700">'+tot+'</td>'+
      '<td style="color:#8b949e">'+(tot/span).toFixed(1)+'</td></tr>';
  }).join("");
  return '<table class="mx"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
}
function renderPanels(){
  var A=document.getElementById("panelsA"), B=document.getElementById("panelsB");
  if(KIND==="sw"){
    var p1 = apply("problem");
    var rows1 = Object.keys(countBy(p1,function(x){return x.problemType||"未分类";}))
      .map(function(k){return [k, countBy(p1,function(x){return x.problemType||"未分类";})[k]];})
      .sort(function(a,b){return b[1]-a[1];})
      .map(function(r){return [r[0]==="未分类"?"未分类（泛讨论）":PROBLEM_NAME[r[0]]||r[0], r[1], r[0]];});
    var rows1raw = rows1.map(function(r){return r;});
    var html1 = rows1raw.length? rows1raw.map(function(r){
      return null;
    }).join("") : "";
    // 直接用原始 key 生成，label 与 key 分开
    var p1map = countBy(p1,function(x){return x.problemType||"未分类";});
    var arr1 = Object.keys(p1map).map(function(k){return [k,p1map[k]];}).sort(function(a,b){return b[1]-a[1];});
    A.innerHTML = panel("问题类型构成","共 "+p1.length+" 条 · 点击可筛选",
      arr1.map(function(r){
        var lab = r[0]==="未分类"? "未分类（泛讨论）" : (PROBLEM_NAME[r[0]]||r[0]);
        var on = S.problem===r[0]?" on":"";
        var mx = Math.max.apply(null,arr1.map(function(z){return z[1];}));
        return '<div class="brow'+on+'" data-pick="problem" data-val="'+esc(r[0])+'">'+
          '<span class="nm" title="'+esc(lab)+'">'+esc(lab)+'</span>'+
          '<span class="track"><i class="fill" style="width:'+(r[1]/mx*100)+'%;background:'+(PROBLEM_COLOR[r[0]]||"#8b949e")+'"></i></span>'+
          '<span class="vl">'+r[1]+' · '+(r[1]/p1.length*100).toFixed(1)+'%</span></div>';
      }).join(""));

    var p2 = apply("product");
    var arr2 = Object.keys(countBy(p2,function(x){return x.productLine||"未标注";}))
      .map(function(k){return [k,countBy(p2,function(x){return x.productLine||"未标注";})[k]];})
      .sort(function(a,b){return b[1]-a[1];});
    A.innerHTML += panel("产品线结构","按条数 · 点击可筛选",
      arr2.map(function(r){
        var lab=PRODUCT_NAME[r[0]]||r[0];
        var mx = Math.max.apply(null,arr2.map(function(z){return z[1];}));
        var on = S.product===r[0]?" on":"";
        return '<div class="brow'+on+'" data-pick="product" data-val="'+esc(r[0])+'">'+
          '<span class="nm">'+esc(lab)+'</span><span class="track"><i class="fill" style="width:'+(r[1]/mx*100)+'%;background:'+(PRODUCT_COLOR[r[0]]||"#8b949e")+'"></i></span>'+
          '<span class="vl">'+r[1]+' · '+(r[1]/p2.length*100).toFixed(1)+'%</span></div>';
      }).join("")+
      '<div class="pnote">单一信源：全部条目来自 Creality 官方论坛 Software 板块，暂不含电商评价与第三方社区。</div>');

    var p3 = apply("major");
    var arr3 = Object.keys(countBy(p3,function(x){return majorOf(x.version);}))
      .map(function(k){return [k,countBy(p3,function(x){return majorOf(x.version);})[k]];})
      .sort(function(a,b){return parseFloat(b[0])-parseFloat(a[0]);});
    B.innerHTML = panel("主版本热度","条数 · 点击可筛选",
      arr3.length? arr3.map(function(r){
        var mx = Math.max.apply(null,arr3.map(function(z){return z[1];}));
        var mv = r[0].replace(".x","");
        var on = S.major===r[0]?" on":"";
        return '<div class="brow'+on+'" data-pick="major" data-val="'+esc(r[0])+'">'+
          '<span class="nm">'+esc(r[0])+'</span><span class="track"><i class="fill" style="width:'+(r[1]/mx*100)+'%;background:'+(VER_COLOR[mv]||"#8b949e")+'"></i></span>'+
          '<span class="vl">'+r[1]+' 条</span></div>';
      }).join("") : '<div class="empty">当前筛选下无版本数据</div>');
    B.innerHTML += panel("版本 × 问题类型","仅有效档 · 纯展示",
      matrixTable()+
      '<div class="pnote">版本已归一为「主.次」；月均 = 该主版本条数 ÷ 其时间跨度月数。绝对条数受历史存量影响，跨版本比较请看月均列。</div>');
  }else{
    var pA = apply("channel");
    var arrA = Object.keys(countBy(pA,function(x){return x.channel;})).map(function(k){return [k,countBy(pA,function(x){return x.channel;})[k]];});
    A.innerHTML = panel("信源结构","按条数 · 点击可筛选",
      arrA.length? barRows(arrA,pA.length,"channel",null) : '<div class="empty">暂无数据</div>');
    var pB = apply("source");
    var arrB = Object.keys(countBy(pB,function(x){return x.sourceType;})).map(function(k){return [k,countBy(pB,function(x){return x.sourceType;})[k]];});
    A.innerHTML += panel("载体结构","图文 / 视频 · 点击可筛选",
      arrB.length? barRows(arrB,pB.length,"source",function(){return "#bc8cff";}) : '<div class="empty">暂无数据</div>');
    var noProblem = ITEMS.filter(function(x){return x.problemType;}).length;
    B.innerHTML = panel("问题点 Top","—",
      noProblem? '<div class="empty">已有 '+noProblem+' 条可归类的问题点</div>'
      : '<div class="empty">当前 '+ITEMS.length+' 条均为媒体报道与官方物料，尚无可归类到具体问题点的用户反馈。<br>该面板在有第一条用户反馈后自动填充，不需要改页面。</div>', true);
  }
}

/* ---------------- 筛选栏 ---------------- */
function selHTML(key,label,opts){
  var o = '<div class="fg"><label>'+label+'</label><select data-k="'+key+'">'+
    '<option value="">全部</option>';
  opts.forEach(function(v){
    o += '<option value="'+esc(v[0])+'"'+(S[key]===v[0]?" selected":"")+'>'+esc(v[1])+'</option>';
  });
  return o+'</select></div>';
}
function renderFilters(){
  var el = document.getElementById("filters"), h = "";
  function opts(fn,labelFn,skip){
    var base = ITEMS.filter(function(x){ return match(x,skip); });
    var m = countBy(base,fn);
    return Object.keys(m).sort(function(a,b){return m[b]-m[a];})
      .map(function(k){return [k, (labelFn?labelFn(k):k)+" ("+m[k]+")"];});
  }
  if(KIND==="sw"){
    h += selHTML("product","产品线", opts(function(x){return x.productLine||"未标注";},function(k){return PRODUCT_NAME[k]||k;},"product"));
    h += selHTML("major","主版本", opts(function(x){return majorOf(x.version);},null,"major"));
    h += selHTML("problem","问题类型", opts(function(x){return x.problemType||"未分类";},function(k){return k==="未分类"?"未分类":(PROBLEM_NAME[k]||k);},"problem"));
    h += selHTML("model","机型", opts(function(x){return x.model||"未标注";},null,"model"));
    h += selHTML("grade","审核档", opts(function(x){return x.grade||"未审核";},null,"grade"));
  }else{
    h += selHTML("channel","渠道", opts(function(x){return x.channel;},null,"channel"));
    h += selHTML("source","来源类型", opts(function(x){return x.sourceType;},null,"source"));
    h += selHTML("lang","语种", opts(function(x){return langOf(x);},null,"lang"));
  }
  h += '<div class="fg"><label>时间</label><select data-k="range">'+
    '<option value="all"'+(S.range==="all"?" selected":"")+'>全部</option>'+
    '<option value="90"'+(S.range==="90"?" selected":"")+'>近 90 天</option>'+
    '<option value="30"'+(S.range==="30"?" selected":"")+'>近 30 天</option>'+
    '<option value="7"'+(S.range==="7"?" selected":"")+'>近 7 天</option></select></div>';
  h += '<div class="fg"><input id="qBox" placeholder="搜索标题 / 正文 / 译文" value="'+esc(S.q)+'"></div>';
  el.innerHTML = h;
}

/* ---------------- 已选条件摘要（唯一一处） ---------------- */
var LABELS = {product:"产品线",major:"主版本",version:"版本",problem:"问题类型",model:"机型",
              grade:"审核档",channel:"渠道",source:"来源类型",lang:"语种",range:"时间"};
function renderSummary(hits){
  var el = document.getElementById("filterSummary"), chips = [];
  Object.keys(LABELS).forEach(function(k){
    if(S[k] && !(k==="range"&&S.range==="all")){
      var v = S[k];
      if(k==="range") v = ({"7":"近 7 天","30":"近 30 天","90":"近 90 天"})[S[k]]||S[k];
      if(k==="product") v = PRODUCT_NAME[v]||v;
      if(k==="problem" && v!=="未分类") v = PROBLEM_NAME[v]||v;
      chips.push('<span class="chip">'+LABELS[k]+'：'+esc(v)+' <i data-clr="'+k+'">✕</i></span>');
    }
  });
  if(S.q) chips.push('<span class="chip">关键词：'+esc(S.q)+' <i data-clr="q">✕</i></span>');
  if(!chips.length){ el.innerHTML=""; return; }
  el.innerHTML = '<span>已选条件：</span>'+chips.join("")+
    '<span style="margin-left:6px">命中 <b style="color:#e6edf3">'+hits+'</b> 条</span>'+
    '<button class="clr" id="clearAllBtn">清空全部</button>';
}

/* ---------------- 明细卡片 ---------------- */
function tagsOf(it){
  var t = [];
  if(it.problemType) t.push('<span class="tag t-'+it.problemType+'">'+esc(PROBLEM_NAME[it.problemType]||it.problemType)+'</span>');
  if(it.grade) t.push('<span class="tag '+(it.grade==="有效"?"t-ok":"t-gen")+'">'+esc(it.grade)+'</span>');
  if(KIND==="sw" && it.productLine) t.push('<span class="tag">'+esc(PRODUCT_NAME[it.productLine]||it.productLine)+'</span>');
  if(it.versionRaw) t.push('<span class="tag t-ver">v'+esc(it.versionRaw)+'</span>');
  if(it.model && it.model!=="未标注") t.push('<span class="tag t-model">'+esc(it.model)+'</span>');
  if(KIND==="mbox" && it.sourceType) t.push('<span class="tag '+(it.sourceType==="官方"?"t-ok":"")+'">'+esc(it.sourceType)+'</span>');
  if(it.mirrorOf) t.push('<span class="tag t-gen">同稿 · '+esc(it.mirrorOf.replace("3druck-",""))+'</span>');
  return t.join("");
}
function cardHTML(it){
  var cnT = it.titleCn || "", cnB = it.textCn || "";
  var showCn = !!(cnT || cnB);
  return '<div class="card" data-uid="'+esc(it.uid)+'">'+
    '<div class="c-top">'+tagsOf(it)+
      '<span class="c-date">'+esc(it.date)+'</span>'+
      '<span class="c-src">'+esc(it.platform)+'</span>'+
      (it.url? '<a class="c-link" href="'+esc(it.url)+'" target="_blank" rel="noopener">原文 ↗</a>':'')+
    '</div>'+
    (cnT? '<div class="c-title">'+esc(cnT)+'</div><div class="c-title-en">'+esc(it.title)+'</div>'
        : '<div class="c-title">'+esc(it.title)+'</div>')+
    '<div class="c-seg"><span class="seg-lb">原文 · '+esc(langOf(it))+'</span>'+
      '<span class="seg-tx">'+esc(it.originalText)+'</span></div>'+
    (showCn? '<div class="c-seg"><span class="seg-lb">译文<span class="mt">机翻</span></span>'+
      '<span class="seg-tx cn">'+esc(cnB || cnT)+'</span></div>' : '')+
    (it.truncated? '<div class="cut">原文过长已截断（保留前 1,200 字），完整内容见原帖。</div>':'')+
  '</div>';
}
function renderCards(){
  var list = apply();
  var pages = Math.max(1, Math.ceil(list.length / PAGE_SZ));
  if(S.page > pages) S.page = pages;
  var start = (S.page-1)*PAGE_SZ;
  var slice = list.slice(start, start+PAGE_SZ);
  document.getElementById("cardGrid").innerHTML = slice.length
    ? slice.map(cardHTML).join("")
    : '<div class="panel"><div class="empty">当前筛选条件下没有条目。<br>试着清空条件，或把时间范围放宽。</div></div>';

  document.getElementById("countLine").textContent =
    "共 "+list.length+" 条 · 第 "+S.page+" / "+pages+" 页 · 每页 "+PAGE_SZ+" 条";
  document.getElementById("flowHint").textContent =
    "原文 + 译文双段 · 点击上方面板可就地筛选";

  var p = document.getElementById("pager"), h = "";
  h += '<button data-pg="'+(S.page-1)+'"'+(S.page<=1?" disabled":"")+'>上一页</button>';
  h += '<span class="pg">'+S.page+' / '+pages+'</span>';
  h += '<button data-pg="'+(S.page+1)+'"'+(S.page>=pages?" disabled":"")+'>下一页</button>';
  p.innerHTML = h;
  return list;
}

/* ---------------- 页脚 ---------------- */
function renderFoot(){
  document.getElementById("foot").innerHTML =
    (M.foot||"") + '<div style="margin-top:8px">'+ (M.sources||"") +'</div>';
}

/* ---------------- 交互 ---------------- */
function renderAll(){
  renderUpdateBar(); renderKPI(); renderPanels(); renderFilters();
  var list = renderCards(); renderSummary(list.length); renderFoot();
  console.log("[col] renderAll done, cards =", list.length);
}
function flash(){
  var cs = document.querySelectorAll(".card.flash");
  for(var i=0;i<cs.length;i++) cs[i].classList.remove("flash");
  var n = document.querySelectorAll(".card");
  for(var j=0;j<Math.min(3,n.length);j++) n[j].classList.add("flash");
}
function setFilter(k,v){
  if(k==="range"){ S.range = v; }
  else if(S[k]===v){ S[k]=""; }
  else { S[k]=v; }
  S.page=1; renderAll(); flash();
}
function pick(k,v){
  if(k!=="range" && v==="") S[k]="";
  else S[k]= (S[k]===v? "" : v);
  S.page=1; renderAll(); flash();
}
function clearAll(){
  ["product","major","version","problem","model","grade","channel","source","lang"].forEach(function(k){S[k]="";});
  S.range="all"; S.q=""; S.page=1; renderAll();
}

document.addEventListener("click",function(e){
  var b = e.target.closest("[data-pick]");
  if(b){ pick(b.getAttribute("data-pick"), b.getAttribute("data-val")); return; }
  var c = e.target.closest("[data-clr]");
  if(c){
    var k = c.getAttribute("data-clr");
    if(k==="q"){ S.q=""; } else if(k==="range"){ S.range="all"; } else { S[k]=""; }
    S.page=1; renderAll(); return;
  }
  var pg = e.target.closest("[data-pg]");
  if(pg){ S.page = parseInt(pg.getAttribute("data-pg"),10)||1; renderAll(); window.scrollTo({top:document.getElementById("filters").offsetTop-20,behavior:"smooth"}); return; }
  if(e.target.id==="clearAllBtn"){ clearAll(); }
});

document.addEventListener("change",function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if(k){ pick(k, e.target.value); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="qBox"){
    S.q = e.target.value.trim(); S.page=1;
    var keep = document.activeElement===e.target;
    renderAll();
    if(keep){ var box=document.getElementById("qBox"); if(box){ box.focus(); box.setSelectionRange(S.q.length,S.q.length);} }
  }
});

function boot(){
  console.log("[col] boot start", KIND, "records =", ITEMS.length);
  renderAll();
}
try{ boot(); }
catch(err){
  console.error("[col] boot failed", err);
  document.getElementById("cardGrid").innerHTML =
    '<div class="panel"><div class="empty">渲染失败：'+esc(err && err.message || err)+'</div></div>';
}
})();
</script>
