形错误？","originalText":"Creality Print Calibration models produce non-manifold errors?","textCn":"Creality Print 校准模型会产生非流形错误？","truncated":false,"url":"https://forum.creality.com/t/creality-print-calibration-models-produce-non-manifold-errors/48153","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":379,"likeCount":1,"sourceType":"论坛"},{"uid":"297c4c2877dd899f","date":"2026-01-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bad slice model with hole on bottom polygon","titleCn":"底部多边形带孔洞的模型切片异常","originalText":"Holes on buttom polygone havn`t cut.\nphoto_2026-01-17_18-59-23\nphoto_2026-01-17_18-59-19","textCn":"底部多边形上的孔洞没有被切出来。\nphoto_2026-01-17_18-59-23\nphoto_2026-01-17_18-59-19","truncated":false,"url":"https://forum.creality.com/t/bad-slice-model-with-hole-on-bottom-polygon/48162","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":11,"likeCount":0,"sourceType":"论坛"},{"uid":"f398d323338529f3","date":"2026-01-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"STL breakup feature bugged","titleCn":"STL 拆分功能有缺陷","originalText":"The feature where you break up an stl in creality print into component/seperate pieces has a bug. Whenever I do it I get the error that there is no existing stl even though my model shows still\nHello ! Try to repair your model before cutting it ! Right click on your model and then “repair” !","textCn":"在 Creality Print 中把 STL 拆分成组件/独立件的功能有缺陷。每次我这么做都会报错说没有现存的 STL，尽管我的模型仍然显示着 你好！在切割模型之前先尝试修复它！右键点击你的模型，然后选择 “repair”！","truncated":false,"url":"https://forum.creality.com/t/stl-breakup-feature-bugged/48101","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"d7322a6c1c3d032e","date":"2026-01-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"BUG REPORT- CAD model looks OK, STL looks OK, CP sliced model not right","titleCn":"BUG 报告 - CAD 模型看起来正常，STL 看起来正常，CP 切片后的模型不正常","originalText":"This is the first time I’ve seen this happen. Every part of the process comes out OK until I slice the model in CP 7.0.04127.\nIn fact I sliced the model in CP 5.1 and it worked OK.\nI sliced the model in CP 6.2 and it failed.\nThis is the model in FreeCAD:\nTop view:\n001\nCut-away showing the side cutouts and how the wall has no issues vertically:\n003\nAngled view:\n002\nThe STL as viewed in FreeCAD, with a cut-away view:\n004\nThe STL as viewed in Windows 3D Viewer:\n005\nThe RAW STL loaded into CP 7.0:\n006\nThe STL rendered in CP 7.0 (notice the vertical wall is NOT straight and has a step in it?):\n007\nLayer by Layer view showing the step out in the wall:\n008\nThe same sliced file in CP 5.1- looks like it should with no problems in the wall:\n009\nHave you tried to repair the file ? In the slicer, right click on it and then “repair” !\nThat did not work, but what I did find was that if I changed the settings profile, the slicer worked. I narrowed the problem down to the setting Precision\\X-Y Contour compensation which was set to 1.0041. I changed this to 0 and it fixed the slice. …","textCn":"这是我第一次见到这种情况。在 CP 7.0.04127 里切片模型之前，流程的每一步结果都正常。事实上我在 CP 5.1 里切片这个模型，一切正常。我在 CP 6.2 里切片这个模型，它就出错了。这是 FreeCAD 里的模型：顶视图：001。剖切视图，显示侧面开孔以及墙体在垂直方向没有问题：003。斜视图：002。在 FreeCAD 中查看的 STL，带剖切视图：004。在 Windows 3D 查看器中查看的 STL：005。加载到 CP 7.0 中的原始 STL：006。在 CP 7.0 中渲染的 STL（注意竖直墙面并不直，还出现了一个台阶？）：007。逐层视图显示墙面外凸的台阶：008。同一个切片文件在 CP 5.1 中——看起来正是应有的样子，墙面没有问题：009。你试过修复文件吗？在切片软件里，右键点击它，然后选“修复”！那没有用，但我发现如果更换配置参数，切片软件就能正常工作。我把问题缩小到设置 Precision\\X-Y Contour compensation，它被设成了 1.0041。我把它改成 0，切片就正常了。……","truncated":true,"url":"https://forum.creality.com/t/bug-report-cad-model-looks-ok-stl-looks-ok-cp-sliced-model-not-right/48105","productLine":"print","version":"5.1","versionRaw":"5.1","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":59,"likeCount":0,"sourceType":"论坛"},{"uid":"c2b508dc5d44eb3d","date":"2026-01-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Unable to use Creality Scan 4","titleCn":"无法使用 Creality Scan 4","originalText":"I’m trying to use my Ferret for the first time, but I can’t get the software to work. When I start the software, it pops up a message saying the scanner is connected. It then launches a dialog for Performance Testing. It has a circular status indicator that initially starts spinning as expected, but it quickly just freezes. Shortly after that, my whole computer freezes. I have to do a hard reset to get it to come back. I’ve tried letting it sit for a few hours, but it doesn’t get beyond that testing.\nI don’t have the most up-to-date computer, but it seems like it should work.\nCPU: Intel Core i7 9700K @ 3.60GHz\nRAM: 64.0GB Dual-Channel DDR4\nVideo Card: AMD Radeon RX 7800 XT 16GB\nI have the latest video card drivers, and I’m plugging the scanner directly into a motherboard USB 3.0 slot (I’ve tried different ports, as well.). Is there anything I can do to use this scanner with my current hardware? Could an older version of Creality Scan still work?\np.s. In searching for answers, I’ve seen a few posts saying official support is done through Facebook. Is that true? I don’t have a Facebook account, and I really don’t want one. I’m hoping to get some help here. …","textCn":"我第一次尝试使用我的 Ferret，但我无法让软件正常工作。当我启动软件时，它弹出一条消息说扫描仪已连接。然后它启动一个性能测试对话框。它有一个圆形状态指示器，最初按预期开始旋转，但很快就卡住了。不久之后，我的整台电脑都卡住了。我不得不硬重启才能恢复。我试过让它放几个小时，但它无法通过那个测试。我的电脑不是最新的，但看起来应该能用。CPU：Intel Core i7 9700K @ 3.60GHz；RAM：64.0GB 双通道 DDR4；显卡：AMD Radeon RX 7800 XT 16GB。我安装了最新的显卡驱动，并且把扫描仪直接插到主板的 USB 3.0 插槽上（我也试过不同的端口）。有什么办法能让这台扫描仪在我当前的硬件上使用吗？旧版本的 Creality Scan 还能用吗？附注：在搜索答案时，我看到一些帖子说官方支持是通过 Facebook 进行的。这是真的吗？我没有 Facebook 账号，也真的不想要。我希望在这里能得到一些帮助。……","truncated":true,"url":"https://forum.creality.com/t/unable-to-use-creality-scan-4/48036","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":214,"likeCount":1,"sourceType":"论坛"},{"uid":"8dee7622273b9f95","date":"2026-01-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Manual / XYZ Control is missing from my installation Upgrade of V7.0.0.4127","titleCn":"我的安装升级到 V7.0.0.4127 后缺少手动 / XYZ 控制","originalText":"Since I updated to V7.0.0.4127 the XYZ Control Tab is now gone. The printer is a CR10-SE, and I do see live updates on Bed Temperature, Nozzle Temperature, and Fan Speed. The controls were there with V6.x.x.x, is it now not supported with my printer, as I have seen a few messages on my Android App stating it was now unsupported and reverting back, or something like that.","textCn":"自从我更新到 V7.0.0.4127 后，XYZ 控制选项卡就不见了。打印机是 CR10-SE，我确实能看到热床温度、喷嘴温度和风扇转速的实时更新。在 V6.x.x.x 中这些控制项还在，现在是不是我的打印机不支持了？因为我在 Android 应用上看到几条消息，说现在不支持并回退，或者类似的话。","truncated":false,"url":"https://forum.creality.com/t/manual-xyz-control-is-missing-from-my-installation-upgrade-of-v7-0-0-4127/48005","productLine":"cloud","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":31,"likeCount":0,"sourceType":"论坛"},{"uid":"26971dba5d2b12d5","date":"2026-01-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"Generation manuelle des support avec l'option de la fonction preparer(peindre des supports)","titleCn":"使用准备功能中的支撑绘制选项手动生成支撑","originalText":"je cherche a générer manuellement des supports avec la fonction peindre des support de l’onglet preparer.\ntout fonctionne bien, je visualise l’emplavement de mes supports en vert, mais apres le tranchage, ils ont disparus et ne sont pas generer. quel qu’un peut m’aider a resourdre mon problème. merci d’avance.","textCn":"我想用“准备”选项卡中的支撑绘制功能手动生成支撑。 一切都很正常，我能看到绿色的支撑摆放位置，但切片之后它们就消失了，没有被生成。有谁能帮我解决这个问题吗。提前感谢。","truncated":false,"url":"https://forum.creality.com/t/generation-manuelle-des-support-avec-loption-de-la-fonction-preparer-peindre-des-supports/47928","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":54,"likeCount":0,"sourceType":"论坛"},{"uid":"85bda4b760fab76a","date":"2026-01-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Strange Problem with Creality Print 7 and Custom Layer Change G-Code","titleCn":"Creality Print 7 与自定义换层 G-Code 的奇怪问题","originalText":"FYI.\nI had been using the command BOX_NOZZLE_CLEAN in the layer change g-code for my K2 Plus machine so that it would “clean” buildup off the nozzle at intervals during a long print. This worked great in Creality Print 6. But it stopped working after I upgraded(?) to Creality Print 7 !\nAfter digging into it I found that CP7 has a bug that removes any custom g-code text consisting of double Z characters. In other words, it took my layer change g-code with ‘BOX_NOZZLE_CLEAN’ and spits it out to the G-code file as ‘BOX_NOLE_CLEAN’, where the ‘ZZ’ is missing in the word NOZZLE. It doesn’t do this with other double letters, only the letter Z, and it has to be an uppercase Z. Lowercase works fine, as I changed it to ‘box_nozzle_clean’ or even ‘BOX_NOzzLE_CLEAN’ and then it works as it did with CP6.\nI opened a Tech Ticket with Creality notifying them of this issue. Not sure what Creality did to make CP7 behave like this, but it makes one wonder what other ‘subtle’ problems are lurking in CP7 ?\nVery interesting topic. Have you attempted another slicer such a Orca to see if you can reproduce this? …","textCn":"供参考。 我一直在我的 K2 Plus 机器的换层 G-code 中使用 BOX_NOZZLE_CLEAN 命令，好让它在长时间打印中按间隔“清洁”喷嘴上的堆积物。这在 Creality Print 6 中效果很好。但在我升级（？）到 Creality Print 7 之后它就不工作了！ 深入研究后我发现 CP7 有一个 bug，会移除任何由两个 Z 字符组成的自定义 G-code 文本。换句话说，它把我带有 'BOX_NOZZLE_CLEAN' 的换层 G-code 输出到 G-code 文件时变成了 'BOX_NOLE_CLEAN'，其中 NOZZLE 一词里少了 'ZZ'。它对其他重复字母不这样，只对字母 Z，而且必须是大写 Z。小写没问题，因为我把它改成 'box_nozzle_clean' 甚至 'BOX_NOzzLE_CLEAN' 后就恢复了 CP6 时的效果。 我向 Creality 提交了技术工单通知他们这个问题。不确定 Creality 做了什么让 CP7 变成这样，但这让人不禁想 CP7 里还潜伏着哪些其他“微妙”的问题？ 很有意思的话题。你有没有试过其他切片软件，比如 Orca，看看能否复现？……","truncated":true,"url":"https://forum.creality.com/t/strange-problem-with-creality-print-7-and-custom-layer-change-g-code/47893","productLine":"print","version":"7","versionRaw":"7","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":3,"views":185,"likeCount":3,"sourceType":"论坛"},{"uid":"b1ed5ed24e7b23db","date":"2026-01-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"Calibrage","titleCn":"校准","originalText":"Bonjour ayant une CR 10 SE et utilisant créality print 4,3 ( qui me convient ès bien ) , je n’arrive pas à obtenir des cotes parfaites ,\nPar exemple quand je dessine sur FreeCad un axe de diamètre 15 , j’obtiens à l’impression j’ai toujours un diamètre supérieur , pareil avec les trous , bien sûr je compense en dessinant + ou – mes cotes ,\nDernier exemple , je voulais emboîter deux pièces , 1 de diamètre 32 mm et l’autre de 31,9 disons , il ma fallut dessiner 5 pièces pour arriver à la bonne cote\nMa question : comment calibrer au plus jute mon impression ?\nExiste t’il des modèles de calibrage avec solution ?\nMerci d’avance !\nClaude","textCn":"你好，我有一台 CR 10 SE，并使用 Creality Print 4.3（它很适合我），但我无法获得完美的尺寸。例如，当我在 FreeCAD 上画一个直径 15 的轴时，打印出来我总是得到更大的直径，孔也是如此，当然我通过把尺寸画大或画小来补偿。最后一个例子，我想把两个零件套在一起，一个直径 32 mm，另一个就算是 31.9，我不得不画了 5 个零件才达到正确的尺寸。我的问题：如何尽可能精确地校准我的打印？是否存在带解决方案的校准模型？提前感谢！Claude","truncated":false,"url":"https://forum.creality.com/t/calibrage/47832","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":29,"likeCount":0,"sourceType":"论坛"},{"uid":"7f428d3f32e678c1","date":"2026-01-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"What have I done wrong in my slicer?","titleCn":"我在切片软件里做错了什么？","originalText":"Hi Everyone,\nNew to 3d printing and I’m playing with my new Creality K1 printer. I’m using tinkercad to draw my objects, then export them to STL’s for import into Creality’s slicer.\nHowever, I’ve noticed that my object is not slicing correctly in Creality, but it is slicing correctly in Prusa slicer. You can see it in the screen shots below.\nHere is layer 16 where it all goes wrong in the Creality slicer:\nAnd this is what layer 16 should look like, from Prusa slicer:\nimage (1)\nHere’s my complete STL file:\nslicer test.stl ( )\nCould anyone tell me where to start looking for what I’ve done wrong? I’d prefer to use the Creality slicer as the prints come out much better with it, even though I’m pretty sure I’ve copied over all the correct settings for the K1.\nThank you,\nTim\nHello @7604timo\nWelcome to the Creality Forum…!\nI checked your stl and it worked fine on Creality Print.\nThe warning message you are getting in the yellow pop up (bottom left) means that the model is not laying on the bed flat and it needs supports. Somehow Creality Print turned it upside down..? Turn the model so the flat side is down.\nTurn off lite mode. It hides the infill by default in case you have a crappy pc. …","textCn":"大家好，\n我是 3D 打印新手，正在玩我的新 Creality K1 打印机。我用 tinkercad 画我的物体，然后导出为 STL 导入 Creality 的切片软件。\n但是，我注意到我的物体在 Creality 里切片不正确，而在 Prusa slicer 里切片是正确的。你可以在下面的截图中看到。\n这是 Creality 切片软件里出问题的第 16 层：\n而这应该是第 16 层的样子，来自 Prusa slicer：\nimage (1)\n这是我的完整 STL 文件：\nslicer test.stl ( )\n有人能告诉我该从哪里开始查找我做错了什么吗？我更想用 Creality 切片软件，因为用它打印出来的效果要好得多，尽管我很确定我已经把 K1 的所有正确设置都照搬过来了。\n谢谢，\nTim\n你好 @7604timo\n欢迎来到 Creality 论坛…！\n我检查了你的 STL，它在 Creality Print 上运行正常。\n你在黄色弹窗（左下角）中收到的警告信息意思是模型没有平放在热床上，需要支撑。不知怎么的 Creality Print 把它上下颠倒了..？把模型转过来，让平的一面朝下。\n关闭精简模式。默认情况下它会隐藏填充，以防你的电脑性能较差。…","truncated":true,"url":"https://forum.creality.com/t/what-have-i-done-wrong-in-my-slicer/47839","productLine":"thirdparty","version":"","versionRaw":"","problemType":"ui","model":"K1","grade":"有效","replyCount":9,"views":316,"likeCount":2,"sourceType":"论坛"},{"uid":"3f4bbc013aa6104d","date":"2026-01-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"TPU printing Help how to configure settings in Creality Print V7 for Ender-3 V3 SE","titleCn":"TPU 打印求助：如何在 Creality Print V7 中为 Ender-3 V3 SE 配置设置","originalText":"Hey there everyone I’m very new to 3D Printing in general and more than a bit Autistic so as much detail you can give in your answers would be appreciated greatly but I have a Creality Ender - 3 V3 SE printer and while I have been using Creality Print for slicing and making my Gcode and using I have had great success with PLA and I got some TPU and my first few attempts have me very discouraged the flow that’s coming out of the print nozzle is incredibly inconsistent with it making these 1-2mm globs then 1-2mm thin strands creating walls that are more like infill the current setting preprogrammed in Creality Print V7 don’t seem to work and the info I can find about printing with TPU is either very vague or meant for another brand of printer or software specifically so any help in setting up the printing settings inside Creality Print V7 to print with TPU on an Ender 3 V3 SE would be greatly appreciated\nThe TPU filament is 95A and has a label stating print temps 190c to 210c for 50-80/mm/s and 210c to 230c for 80-120mm/s\nHi Joey,\nWe use 95A TPU on a Ender s1plus, its fairly similar to the SE, we use bed temp 70 and nozzle of 228. …","textCn":"大家好，我总体上非常新手，而且有点自闭症，所以你们回答时能给出的细节越多，我会越感激，不过我有一台 Creality Ender - 3 V3 SE 打印机，我一直用 Creality Print 切片和生成我的 G-code，用 PLA 取得了很大成功，我买了一些 TPU，我最开始的几次尝试让我非常沮丧，从打印喷嘴出来的料流非常不稳定，它会打出这些 1-2mm 的料块，然后是 1-2mm 的细丝，打出的墙更像是填充，Creality Print V7 里当前预编程的设置似乎不管用，我能找到的关于 TPU 打印的信息要么非常含糊，要么是专门针对其他品牌打印机或软件的，所以任何关于在 Creality Print V7 里设置打印参数以便在 Ender 3 V3 SE 上打印 TPU 的帮助都将非常感激 TPU 耗材是 95A，标签上写着打印温度 190c 到 210c 对应 50-80/mm/s，210c 到 230c 对应 80-120mm/s 嗨 Joey， 我们在 Ender s1plus 上使用 95A TPU，它和 SE 相当相似，我们用热床温度 70 和喷嘴 228。……","truncated":true,"url":"https://forum.creality.com/t/tpu-printing-help-how-to-configure-settings-in-creality-print-v7-for-ender-3-v3-se/47791","productLine":"print","version":"7","versionRaw":"7","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":2,"views":283,"likeCount":0,"sourceType":"论坛"},{"uid":"09dfe8024b842b07","date":"2026-01-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6 - 7","titleCn":"Creality Print 6 - 7","originalText":"With all the issues surrounding the latest version of Creality’s slicer I’m interested to know if anyone has just completely scrapped the slicer altogether and began using a different slicer? If so what slicer are you using that seems to be the most seamless transition from Creality? For me it is VERY frustrating that Creality appears to have little to no interest in correcting the issues and customer satisfaction has no place in their business model, further I would not be surprised if the Creality following does not abandon ship and support another manufacturer .\nWe are using v6 and upto 6.32etc released in Sept25.\nThe issues seem to come after that version.\nWe have 13year olds and older using 24 Ender3 v3 ke’s with very little trouble! maybe 1 print in 30 goes wrong…usually pilot error, wrong materials, temperature or adhesion method. Use the standard settings mostly….some students are even sending their prints wirelessly! a great improvement over Ender3 v2’s which we used up till last spring.\nYou could use Cura slicer!\nK","textCn":"围绕 Creality 切片软件最新版本的所有问题，我想知道有没有人干脆完全弃用这个切片软件，开始用别的切片软件？如果有，你用的是哪个、看起来从 Creality 过渡最无缝？对我来说非常沮丧的是，Creality 似乎对纠正这些问题兴趣很小甚至没有，客户满意度在他们的商业模式里没有位置，而且如果 Creality 的用户群抛弃他们去支持另一家厂商，我也不会惊讶。 我们用 v6，直到 25 年 9 月发布的 6.32 等等。问题似乎出现在那个版本之后。 我们有 13 岁及更大的孩子使用 24 台 Ender3 v3 ke，几乎没什么麻烦！大概 30 次打印有 1 次出错……通常是飞手失误、材料错误、温度或附着方法问题。大多用标准设置……有些学生甚至在无线发送他们的打印任务！相比我们用到去年春天的 Ender3 v2 是很大的改进。 你可以用 Cura 切片软件！ K","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-7/47819","productLine":"thirdparty","version":"6","versionRaw":"6","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":2,"views":115,"likeCount":0,"sourceType":"论坛"},{"uid":"d636210a599cf448","date":"2026-01-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"The brand-new Creality Print 7.0 is here!","titleCn":"全新的 Creality Print 7.0 来了！","originalText":"606889692_1326482229517462_3028381345922860521_n\nThe brand-new Creality Print 7.0 is here!\nAI now analyzes your 3D model and recommends the optimal support type — or determines whether supports are even needed at all — just one tap to analyze, powered by AI.\nCreality Print 7.0 also brings an upgraded print algorithm for higher quality print, optimized device control, and algorithm-driven waste reduction for switching filaments. There’s plenty more to explore.\nCheck out Creality Wiki for the full feature list of Creality Print 7.0 and more.\nCreality Print 7.0.0 Release Notes | Creality Wiki\nloving the new 7.0 learning fast\nNeeds a lot of work…","textCn":"606889692_1326482229517462_3028381345922860521_n 全新的 Creality Print 7.0 来了！AI 现在会分析你的 3D 模型并推荐最佳支撑类型——或者判断是否根本需要支撑——只需一键分析，由 AI 驱动。Creality Print 7.0 还带来了升级的打印算法，以实现更高质量的打印、优化的设备控制，以及由算法驱动的换料浪费减少。还有更多内容值得探索。查看 Creality Wiki 了解 Creality Print 7.0 的完整功能列表及更多内容。 Creality Print 7.0.0 发布说明 | Creality Wiki 喜欢新的 7.0，学得很快 需要大量改进……","truncated":false,"url":"https://forum.creality.com/t/the-brand-new-creality-print-7-0-is-here/47764","productLine":"print","version":"7.0","versionRaw":"7.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":601,"likeCount":2,"sourceType":"论坛"},{"uid":"7529d492fbe2ce18","date":"2026-01-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Why is my brim doing this. never had this before 7.0","titleCn":"为什么我的边缘会这样，7.0 以前从没出现过","originalText":"Instead of going around completely, it is diving into the next part and then kind of starts again.","textCn":"它没有完整地绕一圈，而是直接扎进下一个零件，然后又有点像重新开始。","truncated":false,"url":"https://forum.creality.com/t/why-is-my-brim-doing-this-never-had-this-before-7-0/47756","productLine":"print","version":"7.0","versionRaw":"7.0","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"fa0dcb15add27ed0","date":"2026-01-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print speed setings","titleCn":"Creality Print 速度设置","originalText":"does anybody elss have a problem where they are adjusting the speed detings in creality print, but it doesn’t do anything? I have a K1, and it can print up to 600mm/sec, so i go to the speed setings using hyper PLA, set it to 500mm/sec and it doesn’t efect it at all.\nmax speed will always be restrained also by the object geometry, usually you can only get max speeds with very simple shapes / calibration files\noh ok, thanks.","textCn":"有没有人也遇到这样的问题：在 Creality Print 中调整速度设置，但完全没有效果？我有一台 K1，它最高能打印到 600mm/sec，所以我用 hyper PLA 进入速度设置，把它设成 500mm/sec，结果完全没有影响。 最高速度也总是受物体几何形状的限制，通常只有非常简单的形状/校准文件才能达到最高速度 好的，谢谢。","truncated":false,"url":"https://forum.creality.com/t/creality-print-speed-setings/47754","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K1","grade":"有效","replyCount":3,"views":88,"likeCount":2,"sourceType":"论坛"},{"uid":"64a85c323a6fc490","date":"2026-01-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"laying 1 object on top of another without sinking to build plate","titleCn":"把一个物体叠在另一个上面而不陷入热床","originalText":"I designed a housenumber and name sign. I want to print a background of 1.5mm in black and a detailed forgound with small unconnected elements in white on the foreground. Also 1.5 mm.\nWhen i try to assemble the objects i end up with the foreground sunk into the background.\nI also tried to move the background below the build plate before assembling, but i can not move it further down than about half.\nAnyone have a solution? Or a link to a solution?\nGreetz,\nRik Lijkendijk","textCn":"我设计了一个门牌号和姓名牌。我想打印一层 1.5mm 的黑色背景，以及前层一个细节丰富、带细小不相连元素的白色前景。也是 1.5 mm。当我尝试组合这些物体时，前景最后会陷进背景里。我也试过在组合前把背景移到热床下方，但我最多只能往下移大约一半。有人有解决办法吗？或者有解决办法的链接？此致，Rik Lijkendijk","truncated":false,"url":"https://forum.creality.com/t/laying-1-object-on-top-of-another-without-sinking-to-build-plate/47743","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":267,"likeCount":0,"sourceType":"论坛"},{"uid":"ce58b345ead4d672","date":"2026-01-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Version CrealityPrint_7.0.0.4127 GPU pinned at full usage","titleCn":"CrealityPrint_7.0.0.4127 版本 GPU 占用被顶满","originalText":"issue with max gpu usage only on preview tab of CP 7, happens on both my Framework 13 ryzen 7840u and desktop ryzen 7700x / rtx3060 12gb\nI’m running fine on Intel cpu. Sounds like another bug. Support does not monitor the forums much. Could you send the details to support@ or cs@ I think they go to the same place, but Creality has not yet verified that.\nDoes this happen while slicing? In that case it might be an issue with the model. You coul try a new project and add (for instance) the torus from the testing primitives. If that does not ave the same problem the the issue is with the model. Otherwise you might check for the latest drivers for your GPU.\nI run V7 on my desktop (AMD Ryzen 7900X with GForce RTX4060) and everything works perfect.\nGood Luck","textCn":"在 CP 7 的预览标签页上出现 GPU 占用最高的问题，我的 Framework 13 ryzen 7840u 和台式机 ryzen 7700x / rtx3060 12gb 上都会发生。我在 Intel CPU 上运行正常。听起来又是另一个 bug。客服不太看论坛。你能把详细信息发给 support@ 或 cs@ 吗，我觉得它们会到同一个地方，但 Creality 还没有确认。这是在切片时发生的吗？如果是，可能是模型的问题。你可以试试新建一个项目，比如加入测试基本体里的圆环。如果它没有同样的问题，那问题就在模型上。否则你可以检查一下 GPU 的最新驱动。我在台式机（AMD Ryzen 7900X 配 GForce RTX4060）上运行 V7，一切都很完美。祝好运","truncated":false,"url":"https://forum.creality.com/t/version-crealityprint-7-0-0-4127-gpu-pinned-at-full-usage/47717","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":14,"views":310,"likeCount":1,"sourceType":"论坛"},{"uid":"40bcfb9a27a724be","date":"2026-01-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CrealityPrint-V7.0.0.4127-x86_64-Release.AppImage On Linux","titleCn":"Linux 上的 CrealityPrint-V7.0.0.4127-x86_64-Release.AppImage","originalText":"Just got my K1C yesterday, and I’m pleased that the AppImage works GREAT in Ubuntu 24.04.\nThanks. That is good to know. There are some issues with the Windows version and lots of wish we were running Linux. Ubuntu is one of my favorites.\nI’ve run Linux for a very long time. Ubuntu LTS seems to be so stable and easy to work with that it’s my fall-back. The concerns with Linux is alway wondering what will/won’t run on it.\nSteam has brought gaming to Linux So I was actually able to delete those old windows partitions and use the space for steam games.\nWorking with my old 3d printer (creality 10s) I was glad that UltiMaker-Cura-5.11.0-linux-X64.AppImage ran perfectly as well. I used it to convert stl to gcode just fine.\nHappy printing!","textCn":"我昨天刚拿到 K1C，很高兴这个 AppImage 在 Ubuntu 24.04 里运行得非常好。 谢谢。知道这一点很好。Windows 版本有一些问题，很多人都希望我们用 Linux。Ubuntu 是我的最爱之一。 我用 Linux 已经很久了。Ubuntu LTS 似乎非常稳定、易于使用，所以它是我的备选。用 Linux 的顾虑总是要担心什么能跑、什么不能跑。 Steam 把游戏带到了 Linux，所以我实际上能删掉那些旧的 Windows 分区，把空间用于 Steam 游戏。 在配合我的旧 3D 打印机（creality 10s）时，我很高兴 UltiMaker-Cura-5.11.0-linux-X64.AppImage 也能完美运行。我用它把 stl 转成 gcode，完全没问题。 打印愉快！","truncated":false,"url":"https://forum.creality.com/t/crealityprint-v7-0-0-4127-x86-64-release-appimage-on-linux/47720","productLine":"thirdparty","version":"","versionRaw":"","problemType":"compat","model":"K1C","grade":"有效","replyCount":3,"views":558,"likeCount":2,"sourceType":"论坛"},{"uid":"80b9a3de3978c78e","date":"2026-01-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to Modify a drill hole","titleCn":"如何修改钻孔","originalText":"is there a way to modify a drill hole?\nI would use a drill.\nCould you possibly be more cryptic? I left my mind reading glasses on the bus.","textCn":"有没有办法修改钻孔？我会用钻头。你能说得再隐晦一点吗？我把读心眼镜落在公交车上了。","truncated":false,"url":"https://forum.creality.com/t/how-to-modify-a-drill-hole/47678","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":86,"likeCount":1,"sourceType":"论坛"},{"uid":"2bd325865da9daa4","date":"2026-01-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Calculator function in input fields","titleCn":"输入框中的计算器功能","originalText":"I’d like to see a math calculator function added to all the input functions. In most cad/cam programs you can type in either (254x.03947) or (254/25.4) or even (10IN) or (254MM) and it will do the calculation and input the conversion automatically.\nThat would be a really convenient feature. I hope they add it.","textCn":"我希望所有输入功能都能加上数学计算器功能。在大多数 CAD/CAM 软件里，你可以输入 (254x.03947) 或 (254/25.4)，甚至 (10IN) 或 (254MM)，它会自动完成计算并输入换算结果。 那会是非常方便的功能，希望他们能加上。","truncated":false,"url":"https://forum.creality.com/t/calculator-function-in-input-fields/47690","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":29,"likeCount":1,"sourceType":"论坛"},{"uid":"5a9bca799ba5e705","date":"2026-01-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"What's wrong with the Android app:","titleCn":"Android 应用出了什么问题：","originalText":"I updated both the K1 Max printer’s software and Creality Print app. The only way I can see the progress visually on my android app now is to shut it down and restart it. It does not refresh otherwise. The previous version would update as soon as opened the window. This one gives me a black screen, but the progress bar updates. I have to close the app, open it up again and press the play button in the black scree to see the progress. BTW, why do I need to press the play button at all? The previous version worked fine. I opened the window and it ran. I could check back later by opening the app, and it would show me the video progress. Anyone else having this issue?","textCn":"我同时更新了 K1 Max 打印机的软件和 Creality Print 应用。现在我在安卓应用上唯一能看到进度画面的方式就是关闭它再重新启动，否则它不会刷新。之前的版本只要打开窗口就会更新。这个版本给我一个黑屏，但进度条会更新。我必须关闭应用，再打开，然后按黑屏上的播放按钮才能看到进度。顺便问一下，我为什么非得按播放按钮？之前的版本运行得很好。我打开窗口它就开始运行。我之后打开应用就能查看，它会显示视频进度。还有别人遇到这个问题吗？","truncated":false,"url":"https://forum.creality.com/t/whats-wrong-with-the-android-app/47658","productLine":"cloud","version":"","versionRaw":"","problemType":"ui","model":"K1 Max","grade":"有效","replyCount":1,"views":48,"likeCount":0,"sourceType":"论坛"},{"uid":"e97ac0126981a1a8","date":"2026-01-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Using KAMP with Orca Slicer","titleCn":"在 Orca Slicer 中使用 KAMP","originalText":"If you can tell me how to get KAMP to work on Orcaslicer, I would appreciate it. I’d prefer Orcaslicer over CP due to the nightly builds they release with special features…but my bed likes to warp a bit too much to give a consistent first layer\nHiya! Welcome to the Forum!\nWhich printer are you using?\nThe easiest way is to root the machine, if that option is available.\nI had thought Orca has the KAMP features built in to it. It’s been a long time since I’ve run a vanilla unit.\nThere should be a few entries to check in the printer.cfg file.\nI can write a book on warping issues! See some of my other posts, I’m no stranger to intrusive countermeasures. I’ve tried everything from foil tape to a 28oz Hammer. Can’t tell you how much filament I’ve used running off 1st layer tests\nPrint a full bed area 1st layer. See where the issues are.\nHeat the Bed to 100C, Keep it there for at least 45 Min, I did it for 3 hrs.\n**When you reduce the heat, do so 10C at a time over 10 minutes, So 1C per minute cooldown path.\nYou can bring it right down to room temp once you’ve gone below 40C.\nWhen you let it heat back up to print temp, let it sit there for at least 10 min before you print. …","textCn":"如果你能告诉我如何让 KAMP 在 Orcaslicer 上运行，我将非常感激。相比 CP，我更喜欢 Orcaslicer，因为他们发布的每夜构建版本带有一些特殊功能…但我的热床翘曲有点太厉害，无法获得一致的首层\n嗨！欢迎来到论坛！\n你用的是哪台打印机？\n最简单的方法是给机器 root，如果这个选项可用的话。\n我本以为 Orca 内置了 KAMP 功能。我已经很久没有运行过原厂机器了。\n在 printer.cfg 文件里应该有几处需要检查的条目。\n关于翘曲问题我能写一本书！看看我的其他一些帖子，我对各种激进的对抗措施并不陌生。从铝箔胶带到 28 盎司的锤子我都试过了。我没法告诉你我为跑首层测试用掉了多少耗材\n打印一整床面积的首层。看看问题出在哪里。\n把热床加热到 100C，保持至少 45 分钟，我是保持了 3 小时。\n**降温时，每 10 分钟降 10C，也就是每分钟降 1C 的降温路径。\n降到 40C 以下后，你可以直接降到室温。\n当你让它重新升到打印温度时，打印前至少静置 10 分钟。…","truncated":true,"url":"https://forum.creality.com/t/using-kamp-with-orca-slicer/47627","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":416,"likeCount":0,"sourceType":"论坛"},{"uid":"0a569016bd0b76ec","date":"2025-12-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print v7.0.0.4127 - Adware:Win32/Tnega Detected in \"Remove-Edge.exe\" by Windows Defender","titleCn":"Creality Print v7.0.0.4127 - Windows Defender 在“Remove-Edge.exe”中检测到 Adware:Win32/Tnega","originalText":"I installed Creality Print v7.0.0.4127 on my Windows 11 laptop. A subsequent scan by Windows Defender detected the following…\nScreenshot 2025-12-31 075402\nThis is quite concerning and I’ve uninstalled this version for now.\nAnyone else getting this detection? Thoughts or comments from Creality?\nThanks.\nSJMarty:\nCreality Print v7.0.0.4127\nYes. Same here. I quarantined it and so far it has not had an affect on Print-7. It is deeply disturbing that Creality security would allow malware into their download repository. Until Creality lays out what they have done to mitigate the problem. Trojan:Win32/Tnega!MSR\", also known as “Win32/RA-based.NJV”\" is serious. Here is a good summery on the NordVPN sitye:\nI can not trust Creality. It may be deliberate. I can no longer run my regular security on this forum. I have to use an incognito window that allows targeting cookies in order to use this forum. Since incognito windows delete cookies on exit, I think that is reasonably safe as long as I do not leave a connection to Creality open for any longer than needed.\nI have alerted Creality Tech support on Facebook and e-mail. …","textCn":"我在 Windows 11 笔记本上安装了 Creality Print v7.0.0.4127。随后 Windows Defender 的扫描检测到以下内容……Screenshot 2025-12-31 075402。这相当令人担忧，我暂时卸载了这个版本。还有别人遇到这个检测吗？Creality 有什么想法或评论吗？谢谢。SJMarty：Creality Print v7.0.0.4127。是的，我这里也一样。我把它隔离了，到目前为止对 Print-7 还没有影响。Creality 的安全防护竟然允许恶意软件进入他们的下载仓库，这让人深感不安。在 Creality 说明他们采取了什么措施来缓解这个问题之前。“Trojan:Win32/Tnega!MSR”，也称为“Win32/RA-based.NJV”，很严重。NordVPN 网站上有很好的总结。我无法信任 Creality。这可能是故意的。我已经无法在这个论坛上运行我常用的安全防护。我必须使用允许定向 cookie 的无痕窗口才能访问这个论坛。由于无痕窗口在退出时会删除 cookie，只要我不把与 Creality 的连接保留超过必要时间，我认为这还算比较安全。我已经在 Facebook 和电子邮件上提醒了 Creality 技术支持。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-v7-0-0-4127-adware-win32-tnega-detected-in-remove-edge-exe-by-windows-defender/47597","productLine":"print","version":"7","versionRaw":"7","problemType":"compat","model":"未标注","grade":"有效","replyCount":62,"views":4610,"likeCount":35,"sourceType":"论坛"},{"uid":"be6aa4b4c60f3641","date":"2025-12-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bricked Ender-3 S1 Pro After Firmware Updates","titleCn":"固件更新后变砖的 Ender-3 S1 Pro","originalText":"Hi, all. I have an Ender 3 S1 Pro. I bought it in Nov of 2024. It has the STM32F401 chip.\nTHE STORY: It was working fine but I felt like updating the firmware just to try it out and now nothing works. I went to this website: . I downloaded the latest version, V3.1.9, and followed all instructions for both main board and screen updates. Now The screen powers on but only shows black; I’m also pretty sure the board firmware didn’t take either but with a blank screen I can’t really tell.\nTHE DETAILS: I have 8gb micro SDs that are formatted in the correct MS-DOS + 4096 allocation size setup. I followed all of the instructions as outlined in the readme.txt files, reached out to support ( via phone, which did nothing, and email, which has not responded yet) and even googled my brains out for solutions but still no dice. I’ve even tried going back through all older firmware versions as a sort of “factory reset” but am still getting nowhere.\nHELP: So now I’m hitting the forums for deeper help. Am I using the wrong link for these updates? …","textCn":"大家好。我有一台 Ender 3 S1 Pro。我在 2024 年 11 月买的。它用的是 STM32F401 芯片。 事情经过：它本来运行正常，但我想着更新一下固件试试看，现在什么都不工作了。我去了这个网站：。我下载了最新版本 V3.1.9，并按照所有说明操作了主板和屏幕的更新。现在屏幕能通电但只显示黑屏；我也很确定主板的固件也没刷进去，但屏幕是黑的，我实在看不出来。 详细信息：我有 8GB 的 micro SD 卡，格式化为正确的 MS-DOS + 4096 分配单元大小设置。我按照 readme.txt 文件里列出的所有说明操作，联系了支持部门（打过电话，毫无用处；发过邮件，至今没有回应），甚至还拼命谷歌找解决方案，但还是没戏。我甚至试过把所有旧固件版本都刷一遍，算是某种“恢复出厂设置”，但依然毫无进展。 求助：所以现在我来论坛寻求更深入的帮助。我是不是用错了这些更新的链接？……","truncated":true,"url":"https://forum.creality.com/t/bricked-ender-3-s1-pro-after-firmware-updates/47587","productLine":"firmware","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":3,"views":351,"likeCount":0,"sourceType":"论坛"},{"uid":"a10a58e4ebaf7dc3","date":"2025-12-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Crealit print V 7.0.0.4127 on Mac","titleCn":"Mac 上的 Crealit print V 7.0.0.4127","originalText":"i’ve installed Creality print v 7.0.0.4127 on a mac with os 26.2, and i ve a trouble with language selection in settings, Every time I change the language of the program, when I restart it everything goes back to the way it was when I first installed it, preferences and original language.\nHas this happened to anyone else?\nI have the exact same problem. I haven’t found a solution yet.\nThey’re getting pretty sloppy over at Creality software. The windows version comes with a virus. See: Creality Print v7.0.0.4127 - Adware:Win32/Tnega Detected in “Remove-Edge.exe” by Windows Defender","textCn":"我在一台 os 26.2 的 mac 上安装了 Creality print v 7.0.0.4127，我在设置里的语言选择上有麻烦，每次我更改程序语言，重启后一切都回到我最初安装时的样子，偏好设置和原始语言。 有人遇到过吗？ 我遇到完全相同的问题。我还没找到解决办法。 Creality 软件那边越来越马虎了。Windows 版本还带病毒。见：Creality Print v7.0.0.4127 - Windows Defender 在“Remove-Edge.exe”中检测到 Adware:Win32/Tnega","truncated":false,"url":"https://forum.creality.com/t/crealit-print-v-7-0-0-4127-on-mac/47582","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":181,"likeCount":2,"sourceType":"论坛"},{"uid":"c4aa68570d0a6037","date":"2025-12-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Crealityprint 7 request for change to Bridge Density","titleCn":"Creality Print 7 请求修改桥接密度","originalText":"Bridge Density controls the thickness of the bridge layer printed over infill, with 100% typically being solid and ideal for strength , recent updates in Orca slicer allow increasing it (e.g., to 120%) for smoother, gap-free bridges, working alongside Bridge Flow Ratio . A number of creality users and myself have had some success with improving bridging. BF 1.4 and BD 105 work well for me in PLA.\nThe results on bridging are very good but do need a bit of calibration. There are a number of articles on printables and Youtube that explain this and indicate optimum setting.\nCan we implement this in Crealityprint please.\nThanks\nUse the link given by the developers to report your idea\nCreality Print 7.0 beta UAT Survey","textCn":"桥接密度控制打印在填充之上的桥接层的厚度，100% 通常是实心，最适合强度，Orca 切片软件最近的更新允许把它提高（例如提高到 120%），以获得更平滑、无缝隙的桥接，并可与桥接流量比配合使用。一些 Creality 用户和我自己在改善桥接方面取得了一些成功。在 PLA 上 BF 1.4 和 BD 105 对我来说效果很好。桥接的结果非常好，但确实需要一点校准。Printables 和 YouTube 上有很多文章解释了这一点并指出了最佳设置。请问我们能在 Creality Print 里实现这个吗。谢谢 使用开发者提供的链接来报告你的想法 Creality Print 7.0 beta UAT 调查","truncated":false,"url":"https://forum.creality.com/t/crealityprint-7-request-for-change-to-bridge-density/47559","productLine":"thirdparty","version":"7","versionRaw":"7","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":172,"likeCount":2,"sourceType":"论坛"},{"uid":"59ab6e02e8df0507","date":"2025-12-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bug report on Creality Print 7.0.0.4127","titleCn":"Creality Print 7.0.0.4127 的 Bug 报告","originalText":"Hi,\nSince V7.0.0.4127, I can no longer drag and drop an STL file from 7Zip directly into Creative Print. It tells me there is no geometric data in the file. There’s no problem if I drag and drop from File Explorer.\nAre you unzipping the 7Zip file before you drag it into Creality Print.? It won’t work unless you unzip the file and then move the .stl into Creality Print.\nWhen you drag’n drop your file from 7zip to creality, it unzip the file directly in Creality.\nIt was fine on v6\n{2D1D8F3C-4E7D-4C34-9F5D-E2AAAAC65472}","textCn":"你好，从 V7.0.0.4127 开始，我不能再把 STL 文件从 7Zip 直接拖放到 Creality Print 里了。它告诉我文件里没有几何数据。如果我从文件资源管理器拖放就没有问题。 你在把 7Zip 文件拖进 Creality Print 之前，有没有先解压？除非你解压文件，然后把 .stl 移进 Creality Print，否则是不行的。 当你把文件从 7zip 拖放到 creality 时，它会在 Creality 里直接解压该文件。 在 v6 上一切正常 {2D1D8F3C-4E7D-4C34-9F5D-E2AAAAC65472}","truncated":false,"url":"https://forum.creality.com/t/bug-report-on-creality-print-7-0-0-4127/47565","productLine":"print","version":"7","versionRaw":"7","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":376,"likeCount":0,"sourceType":"论坛"},{"uid":"32ed1d0a52f9c474","date":"2025-12-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Crealty Print Software - Suggestions for Improvement","titleCn":"Creality Print 软件 - 改进建议","originalText":"I’m using the latest Creality Print V7 software, but this problem is not new to that version. As long as I’ve been using Creality Print, under the “Device” details, when starting a print if I click on speed “Stable 50%” anytime before purging filament to start the print then it will automatically change it back to “Standard 100%” speed without warning. I have had numerous failed prints that could have been prevented if the speed stayed at “Stable 50%” during actual printing. I would like to request that your technical team change the Creality Print software so that when selecting a print speed change before filament purging the selection will remain for the actual printing process. This is for a K1C with Creality CFS.\nI agree, it is annoying. But if it is any consolation, this bug has been in place since Bambu Studio which Orca Slicer was forked from and which Creality Print is forked once again. I did a little Googling and it looks like the first mention if this feature is the introduction of the G-code M220 command which overrides speed.\nHere’s the first reference in RepRap’s Wiki page which appears to go back to 2012. …","textCn":"我正在使用最新的 Creality Print V7 软件，但这个问题对这个版本来说并不新鲜。自从我开始使用 Creality Print 以来，在“设备”详情下，开始打印时，如果我在耗材排料开始打印之前的任何时间点击速度“稳定 50%”，那么它会自动将其改回“标准 100%”速度，而且没有警告。我有许多失败的打印，如果速度在实际打印期间保持在“稳定 50%”，这些失败本可以避免。我希望请求你们的技术团队更改 Creality Print 软件，使得在耗材排料之前选择打印速度更改时，该选择将在实际打印过程中保持。这是用于一台带 Creality CFS 的 K1C。我同意，这很烦人。但如果说这能安慰你的话，这个 bug 从 Bambu Studio 就存在了，Orca Slicer 是从它分支出来的，而 Creality Print 又再次分支。我在谷歌上查了一下，看起来这个功能的首次提及是 G-code M220 命令的引入，它会覆盖速度。这是 RepRap Wiki 页面中的第一个参考，似乎可以追溯到 2012 年。…","truncated":true,"url":"https://forum.creality.com/t/crealty-print-software-suggestions-for-improvement/47572","productLine":"thirdparty","version":"7","versionRaw":"7","problemType":"other","model":"K1C","grade":"有效","replyCount":4,"views":194,"likeCount":2,"sourceType":"论坛"},{"uid":"ebb2efc9f26806c1","date":"2025-12-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Crerality Cloud Annual Designer Awards 2025","titleCn":"Crerality Cloud 2025 年度设计师大奖","originalText":"Crerality Cloud Annual Designer Awards 2025\nSince 2022, Creality Cloud has recognized the creative talent and dedicated efforts of its Top 100 Designers by awarding honorary badges. This cherished tradition has now entered its fourth year, remaining committed to acknowledging designers’ outstanding contributions to the platform and garnering widespread acclaim from the global design community.\nIn 2025, we are proud to announce this year’s Top 100 Designers list and specially invite them to participate in the independent design of exclusive badges and models. Additionally, community users can vote to select 15 Designer of the Year and 10 Emerging Designer of the Year. Winners will receive generous prizes, such as the K2 Pro Combo 3D Printer, K2 Plus Combo 3D Printer, or 3D Scanner. Users who actively participate in voting also stand a chance to win a K2 Pro Combo 3D Printer!\nFurthermore, each designer has created an exclusive fan model for voting users—simply cast a vote to unlock it!\nthanks Creality! very honoured to have been nominated! …","textCn":"Crerality Cloud 2025 年度设计师大奖 自 2022 年以来，Creality Cloud 通过颁发荣誉徽章来表彰其 Top 100 设计师的创意才华和专注努力。这一珍贵的传统如今已进入第四个年头，依然致力于肯定设计师对平台的杰出贡献，并获得了全球设计界的广泛赞誉。2025 年，我们很自豪地公布今年的 Top 100 设计师名单，并特别邀请他们参与专属徽章和模型的独立设计。此外，社区用户可以投票选出 15 位年度设计师和 10 位年度新锐设计师。获奖者将获得丰厚奖品，例如 K2 Pro Combo 3D 打印机、K2 Plus Combo 3D 打印机或 3D 扫描仪。积极参与投票的用户也有机会赢得 K2 Pro Combo 3D 打印机！此外，每位设计师都为投票用户制作了一个专属粉丝模型——只需投出一票即可解锁！感谢 Creality！非常荣幸能被提名！……","truncated":true,"url":"https://forum.creality.com/t/crerality-cloud-annual-designer-awards-2025/47525","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":3,"views":64,"likeCount":1,"sourceType":"论坛"},{"uid":"c3d3517a7aab8fd4","date":"2025-12-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K2 Printer not in printer lidt","titleCn":"K2 打印机不在打印机列表中","originalText":"Screenshot_20251226_071621_Creality Cloud\nTrying to cloud slice from the app. When I click on slice from the app it brings me to this selection page and there’s no K2 printers listed.\nWhat software is this? It does not look anything like the phone app, or computer app, I am using. Could It simply be an old version that does not yet contain the K2 series>","textCn":"Screenshot_20251226_071621_Creality Cloud 我试着从 app 里进行云端切片。当我在 app 里点击切片时，会跳转到这个选择页面，而列表里没有 K2 系列打印机。这是什么软件？它和我正在用的手机 app 或电脑端 app 一点都不像。会不会只是一个还没有包含 K2 系列的旧版本？","truncated":false,"url":"https://forum.creality.com/t/k2-printer-not-in-printer-lidt/47501","productLine":"cloud","version":"","versionRaw":"","problemType":"compat","model":"K2","grade":"有效","replyCount":2,"views":42,"likeCount":0,"sourceType":"论坛"},{"uid":"f8e66520f99865f1","date":"2025-12-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print UI - why the hell the box is semitransparent?","titleCn":"Creality Print 界面——这个框到底为什么是半透明的？","originalText":"Creality Print UI - why the hell the box is semitransparent?","textCn":"Creality Print 界面——这个框到底为什么是半透明的？","truncated":false,"url":"https://forum.creality.com/t/creality-print-ui-why-the-hell-the-box-is-semitransparent/47480","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":6,"views":95,"likeCount":1,"sourceType":"论坛"},{"uid":"9c3e26e4e24c06ff","date":"2025-12-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Which version is the best one currently available?","titleCn":"目前可用的哪个版本最好？","originalText":"Which version is the best right now?\nscreenshot_1766628722\n10 years ago I used the CR10S5… 96 machines.\nThen, in 2024, we upgraded to 40 K1 Max machines and used a new slicer.\nBut each version has its advantages and disadvantages.\nVersion 6 seems to have added more convenient machine arrangement and layout capabilities - but it still creates too many difficulties.\nThe most stable version is still version 5.\nEdit: Non working or suspicious Link Removed.\nscreenshot_1766628722 . tôi vẫn thích nhất 5.1","textCn":"现在哪个版本最好？screenshot_1766628722 10 年前我用的是 CR10S5……96 台机器。然后，在 2024 年，我们升级到 40 台 K1 Max 机器，并使用了新的切片软件。但每个版本都有它的优缺点。版本 6 似乎增加了更方便的机器排列和布局能力——但它仍然制造了太多困难。最稳定的版本仍然是版本 5。编辑：已移除无法使用或可疑的链接。screenshot_1766628722 . 我仍然最喜欢 5.1","truncated":false,"url":"https://forum.creality.com/t/which-version-is-the-best-one-currently-available/47474","productLine":"print","version":"9.79","versionRaw":"9.79","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":2,"views":55,"likeCount":0,"sourceType":"论坛"},{"uid":"4b922a3da20bb224","date":"2025-12-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"What the hell is going on with version 6?","titleCn":"版本 6 到底怎么回事？","originalText":"There’s no way around version 6, I’m really disappointed. I remember when it was released and I opened it, the first thing that struck me was the interface. I literally thought, “They’ve screwed it up”… everything in version 6 is much more complicated than in version 5. Anyway, aside from that…\nEven though it’s been out for quite some time, it still behaves like a beta program, even in the simplest tasks. Not even the “move” function works properly. Here’s the problem:\nI open the newly installed software (clean install, latest version), add a cube from “test model,” select the cube, click the “move” button, and I find a 10mm offset on the Z-axis relative to the printer bed… (as seen in the image).\nHow is this possible? I’ve had to stick with version 5, which hasn’t been updated in ages.\nScreenshot_12\nScreenshot_2\ni can put up with the interface, but what did they do to stop the STEP models from opening normally? at 5, the model opens in 2 seconds, and at 6 it opens in 5 minutes?","textCn":"版本 6 是绕不过去的，我真的很失望。我记得它刚发布时我打开它，第一件让我震惊的事就是界面。我当时真的想，“他们把它搞砸了”……版本 6 里的一切都比版本 5 复杂得多。总之，撇开这个不谈……尽管它已经发布相当一段时间了，但即使是最简单的任务，它仍然表现得像个 beta 程序。“移动”功能都不能正常工作。这是问题所在：我打开新安装的软件（干净安装，最新版本），从“测试模型”里添加一个立方体，选中立方体，点击“移动”按钮，然后我发现在 Z 轴上相对于打印机热床有 10mm 的偏移……（如图中所示）。这怎么可能？我不得不继续用版本 5，它已经很久没更新了。Screenshot_12 Screenshot_2 界面我可以忍受，但他们把 STEP 模型的正常打开怎么了？在 5 上，模型 2 秒就打开了，在 6 上要 5 分钟？","truncated":false,"url":"https://forum.creality.com/t/what-the-hell-is-going-on-with-version-6/47471","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":169,"likeCount":1,"sourceType":"论坛"},{"uid":"f1127cba9e314e3a","date":"2025-12-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Dynamic changing of Temperature and Flow Rate","titleCn":"动态改变温度和流量","originalText":"I’m new to the forum and to Creality. My old work horse Prusa broke down on Black Friday and low and behold the K1C was on sale and I pulled a hair trigger. I had a little learning curve on using Creality-Print, but now I’m liking it better than my Cura habit. I’ve really been impressed with the K1C both in speed, and especially in the fire-and-forget print reliability. I’ve tried PLA, ABS, Nylon, and Carbon/Polycarbonate without incident. I also purchased my first roll of LW-PLA to build RC airplanes and have been experimenting with different temperature/Flow rates to see the differences in weight versus strength. Currently I’m printing a 40” wingspan power glider that should come in less than 100 grams (print weight) while all the powered guts will exceed 120 grams. Which brings me to the question…\nIs it possible to change the Nozzle temperature and material flow rate during the print?\nWhy you say? There are portions of a print say like a control horn on a plane’s empennage. During the layers printing the horn, I’d like the temperature at 220C and flowrate at 75%. Once in the main layers for the entire surface, I’d like it to switch to 270C and 40% flowrate. …","textCn":"我是论坛和 Creality 的新人。我那台老黄牛 Prusa 在黑色星期五坏了，结果发现 K1C 在打折，我就立刻下手了。使用 Creality-Print 有一点学习曲线，但现在我比用惯了的 Cura 更喜欢它。K1C 让我印象深刻，无论是速度，还是尤其那种“设好就不用管”的打印可靠性。我试过 PLA、ABS、尼龙和碳纤维/聚碳酸酯，都没出问题。我还买了第一盘 LW-PLA 来做遥控飞机，一直在试验不同的温度/流量，看看重量与强度的差异。目前我在打印一架 40 英寸翼展的动力滑翔机，打印重量应该不到 100 克，而所有动力部件会超过 120 克。这就引出了我的问题……能不能在打印过程中改变喷嘴温度和材料流量？为什么这么问？打印中有一些部分，比如飞机尾翼上的控制角。在打印这个角的那些层时，我希望温度是 220C、流量是 75%。一旦进入整个表面的主体层，我希望切换到 270C 和 40% 流量。……","truncated":true,"url":"https://forum.creality.com/t/dynamic-changing-of-temperature-and-flow-rate/47441","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":107,"likeCount":1,"sourceType":"论坛"},{"uid":"9d713d1458d33bf8","date":"2025-12-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Unable to \"Add Pause\" when print sequence is \"By object\"","titleCn":"打印顺序为“逐对象”时无法“添加暂停”","originalText":"When I select print sequence by object, I can’t add a pause. It happens even if there is only 1 object on the plate. And I can’t think of a reason why this shouldn’t be allowed.","textCn":"当我选择逐对象打印顺序时，我无法添加暂停。即使平台上只有 1 个对象也会这样。而且我想不出为什么这不应该被允许。","truncated":false,"url":"https://forum.creality.com/t/unable-to-add-pause-when-print-sequence-is-by-object/47460","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":45,"likeCount":2,"sourceType":"论坛"},{"uid":"682a11ed64256f3a","date":"2025-12-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","title":"Приложение Creality print не видит многоцветовую печать на принтере с функцией CFS","titleCn":"Creality Print 应用在带 CFS 功能的打印机上看不到多色打印","originalText":"Я приобрел принтер creality k1 max v5 CFS .Скачал приложение creality print последней версии и повязал устройства k1 max cfs.Сам принтер видит устройство cfs,приложение видит,что на принтере есть cfs.Так же стоит профиль k1max cfs.И когда я загружаю модели с разными цветами,то справа сверху доступен только 1 пруток(филамент).А если нажать на кнопку,где добавляются цвета(вроде называется автоматическое картирование),то пишет,что устройства с нужными данными типо нету.Помогите пожалуйста с этой проблемой многоцветовой печати.","textCn":"我买了一台 creality k1 max v5 CFS 打印机。下载了最新版本的 creality print 应用并绑定了 k1 max cfs 设备。打印机本身能看到 cfs 设备，应用也能看到打印机上有 cfs。配置选的也是 k1max cfs。可是当我加载不同颜色的模型时，右上角只有 1 个料盘（耗材）可选。而如果点击添加颜色的按钮（好像叫自动映射），它就提示没有带所需数据的设备。请帮我解决一下这个多色打印的问题。","truncated":false,"url":"https://forum.creality.com/t/creality-print-cfs/47461","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":1,"views":95,"likeCount":0,"sourceType":"论坛"},{"uid":"44a9cc55cb45979d","date":"2025-12-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Cloud App","titleCn":"Creality Cloud 应用","originalText":"I am very happy with the creality cloud app but I can’t get notifications with sound in the app. I only get a notification but no sound. I have tried to see what the problem could be but can’t find anything wrong. I have an iPhone with iOS 26.2\nthx in advance Anders","textCn":"我对 Creality Cloud 应用非常满意，但我在应用里收不到带声音的通知。我只收到通知但没有声音。我试着查找问题可能出在哪里，但找不到任何异常。我用的是装有 iOS 26.2 的 iPhone 提前感谢 Anders","truncated":false,"url":"https://forum.creality.com/t/creality-cloud-app/47449","productLine":"cloud","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":60,"likeCount":0,"sourceType":"论坛"},{"uid":"f9570f1efd206a6c","date":"2025-12-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Hello to everybody new in the forum wondering if someone can help whit my mage pro just not printing my model its just printing a flat bed","titleCn":"大家好，我是论坛新人，想问问有没有人能帮帮我，我的 Mage Pro 就是不打印我的模型，只是打出一个平板","originalText":"20251217_122526","textCn":"20251217_122526","truncated":false,"url":"https://forum.creality.com/t/hello-to-everybody-new-in-the-forum-wondering-if-someone-can-help-whit-my-mage-pro-just-not-printing-my-model-its-just-printing-a-flat-bed/47337","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":20,"likeCount":0,"sourceType":"论坛"},{"uid":"a100bf1029c93197","date":"2025-12-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Feature Request: Please Add \"Area Fill\" to Seam Painting","titleCn":"功能请求：请为接缝涂绘添加「区域填充」","originalText":"There actually is an applicaiton for this. I mostly print with PETG and I’ve yet to find settings that don’t result in an unsightly scar left by the seam. In some cases I can get away with using Random for the Seam Position . But, not always. And for those cases, I came up with a workaround: Designate an area for the random seam. That way, it plays like an intentional isolated pattern (aka the random scatter, confined to a smaller area, reads like a textured pattern–kind of a sparse furry skin ). But, seam-painting that area is tedious using the Brush Shape , especially along the edges. And, what makes it extra irritating is that any change in the model, and all of that tedious painting vanishes (aka, has to be redone )! For instance, if you forget to Repair non-modals, or you load a new, updated STL in it’s place, all seam painting is wiped away.\nThus, please add Area Fill (like in Support Painting ) to the Seam Painting tool. Because, with an Area Fill selection, painting (and repainting) random seam areas would be far less of a chore.","textCn":"这确实有实际用途。我主要用 PETG 打印，至今还没找到不会留下难看接缝疤痕的设置。在某些情况下我可以用随机接缝位置应付过去。但并非总是如此。对于那些情况，我想出了一个变通办法：指定一个区域用于随机接缝。这样它就像一个有意为之的孤立图案（也就是把随机散布限制在较小的区域内，看起来像有纹理的图案——有点像稀疏的毛皮）。但是用笔刷形状来涂绘那个区域很繁琐，尤其是沿着边缘。更让人恼火的是，模型任何改动，所有这些繁琐的涂绘都会消失（也就是必须重做）！例如，如果你忘了修复非流形，或者你在原位置加载了一个新的、更新过的 STL，所有接缝涂绘都会被抹掉。因此，请把区域填充（像支撑涂绘里那样）加到接缝涂绘工具中。因为有了区域填充选择，涂绘（和重新涂绘）随机接缝区域就会轻松得多。","truncated":false,"url":"https://forum.creality.com/t/feature-request-please-add-area-fill-to-seam-painting/47330","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":36,"likeCount":0,"sourceType":"论坛"},{"uid":"e9c9848f530f67c6","date":"2025-12-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.3.1 No temperature graph window?","titleCn":"Creality Print 6.3.1 没有温度图表窗口？","originalText":"Ok, so am I missing something here? Just installed 6.3.1.3548 and when looking at ‘Device’ window, I can no longer see the temperature graph window. Removed in this version or switched off somewhere/how?\nI know it’s not crucial, but it is information I liked to see.\nThe numbers are still there, but I agree, I miss the graph. My printer is in the garage and the graph gives good insight to the stability of the print environment.\nThey apparently took a number of things out of the UI in this last release. You can still see it all in the Fluidd page via a browser but on in the desktop client it has been removed. I agree, it was a nice feature but I can understand that it created clutter that made screen real estate cramped.","textCn":"好吧，是我漏掉了什么吗？刚安装了 6.3.1.3548，查看“设备”窗口时，我再也看不到温度图表窗口了。是这个版本移除了，还是在某处/以某种方式被关掉了？\n我知道它不关键，但这是我喜欢看的信息。\n数字还在，但我同意，我也怀念那个图表。我的打印机在车库里，图表能很好地反映打印环境的稳定性。\n他们显然在上一个版本中从界面里去掉了一些东西。你仍然可以通过浏览器在 Fluidd 页面里看到全部内容，但在桌面客户端里它被移除了。我同意，那是个不错的功能，但我也能理解它造成了杂乱，让屏幕空间变得拥挤。","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-3-1-no-temperature-graph-window/47235","productLine":"print","version":"6.3","versionRaw":"6.3.1","problemType":"feature","model":"未标注","grade":"有效","replyCount":8,"views":161,"likeCount":10,"sourceType":"论坛"},{"uid":"a0e0fe1989a36055","date":"2025-12-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Start print button","titleCn":"Creality 开始打印按钮","originalText":"I noticed in Creality Print 6.3 that the “Start Print” button is hanging outside the window on the bottom.\nEverytime I have to scroll the window to make button visible.\nIs there a setting to change that?\n(resizing the window is temporary: if you leave the window, size setting is lost)\nPeter\nHi there,\nYES, BUMP … Why does it do That ? and the layout seems to have changed ? Is there a way to put the camera back on the right side of the screen ?\nAnyone have any Idea?\nGL\nI find the new layout horrible. Huge wide spaced buttons and text, only little bit of useful info on one whole screen…\nXYZ params on one line instead using quarter of the screen now was much easier and more efficient…\n(we don’t need an “interface for dummies”… )","textCn":"我注意到在 Creality Print 6.3 里，“开始打印”按钮悬在窗口底部之外。每次我都得滚动窗口才能让按钮可见。有设置可以改这个吗？（调整窗口大小只是临时的：一旦离开窗口，大小设置就丢了） Peter 你好，顶一下……为什么会这样？而且布局好像也变了？有办法把摄像头放回屏幕右侧吗？有人知道吗？ GL 我觉得新布局糟透了。又大又宽的按钮和文字，一整屏只有一点点有用信息……以前 XYZ 参数在一行里，只用屏幕的四分之一，现在要容易高效得多……（我们不需要“傻瓜界面”……）","truncated":false,"url":"https://forum.creality.com/t/creality-start-print-button/47249","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"crash","model":"未标注","grade":"有效","replyCount":6,"views":121,"likeCount":0,"sourceType":"论坛"},{"uid":"1caf2fcdf774e88d","date":"2025-12-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Layerheight issue with multicolor in Creality Print 6.3.1.3548","titleCn":"Creality Print 6.3.1.3548 中多色打印的层高问题","originalText":"Trying to print a multi-color model with Creality Print 6.3.1.3548 on my Creality Hi, using the standard 0.20 layer height profile…\nInitial layer is set to 0.20 mm, and layer height to 0.20mm - but when slicing, the initial layer height is 0.20, and the following are 0.16mm ? If using the same settings on a plate only utilizing a single color, things works OK.\nSetting layer height to 0.21 mm (for both) does not seem to change anything but the initial layer height…\nFound out, that someone did a layer height 0.16 on the object ….","textCn":"尝试在我的 Creality Hi 上用 Creality Print 6.3.1.3548 打印一个多色模型，使用标准的 0.20 层高配置……首层设置为 0.20 mm，层高设置为 0.20mm——但切片时，首层高度是 0.20，后面的却是 0.16mm？如果在只使用单一颜色的打印板上使用相同设置，一切正常。把层高设置为 0.21 mm（两者都设）似乎除了首层高度之外没有改变任何东西……后来发现，是有人在这个对象上设置了 0.16 的层高……","truncated":false,"url":"https://forum.creality.com/t/layerheight-issue-with-multicolor-in-creality-print-6-3-1-3548/47181","productLine":"print","version":"6.3","versionRaw":"6.3.1","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":2,"views":72,"likeCount":1,"sourceType":"论坛"},{"uid":"32f63c0e4ef76f20","date":"2025-12-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"AI Auto PA and Flow Rate calibration questions","titleCn":"AI 自动 PA 和流量校准的问题","originalText":"I assume the AI Auto Calibrations on the printer, override the settings for the selected filament. Is there a place to view what the Auto Calibration selected? Does the Auto Calibration setting “stick” anywhere, or does it have to be re-done on a print by print bassis? Is the AI any good at picking these settings or should I just ignore them?\n20251209_115815\nFrom my understanding, the PA and flow rate calibration is only done before the print (when it does the zig-zag to check the pressure advance and the flat rectangle for the flow.\nIt then writes a value in the console on Fluidd so yes, it kind of overrides the settings for the selected filament.\nStill from my understanding, it doesn’t stick anywhere, you have to copy them and make a new filament settings in the slicer\nAs long as filaments are from the same type (settings given for HyperPLA are not working well with Solyein PLA for example), I am pleased with what it is giving me.\n@Alex2Lab Thanks. That makes sense. I usually don’t use all the “extra” calibrations for every print. they are time consuming and seemed redundant. I’m having trouble with one specific filament. …","textCn":"我假设打印机上的 AI 自动校准会覆盖所选耗材的设置。有没有地方可以查看自动校准选了什么？自动校准的设置会“保存”在某个地方吗，还是每次打印都必须重做？AI 在挑选这些设置方面好用吗，还是我应该直接忽略它们？ 20251209_115815 据我理解，PA 和流量校准只在打印前进行（就是它走锯齿线检查压力提前量、走扁平矩形检查流量的那一步）。 然后它会在 Fluidd 的控制台里写入一个值，所以是的，它有点像是覆盖了所选耗材的设置。 同样据我理解，它不会保存在任何地方，你得把它们复制下来，在切片软件里新建一个耗材设置 只要耗材是同一种类型（比如给 HyperPLA 的设置用在 Solyein PLA 上效果就不好），我对它给出的结果很满意。 @Alex2Lab 谢谢。这就说得通了。我通常不会每次打印都用上所有“额外”的校准。它们很费时间，而且看起来是多余的。我在某一种特定耗材上遇到了麻烦。…","truncated":true,"url":"https://forum.creality.com/t/ai-auto-pa-and-flow-rate-calibration-questions/47158","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":10,"views":578,"likeCount":4,"sourceType":"论坛"},{"uid":"f587f0f243961d05","date":"2025-12-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print V6.3.1.3546","titleCn":"Creality Print V6.3.1.3546","originalText":"where is the Object Deletion ,Why was it removed it’s a handy feature’\nCheck this discussion from yesterday:\nExcluding Objects","textCn":"对象删除功能在哪里？为什么要移除它，这是个很方便的功能。看看昨天这个讨论：排除对象","truncated":false,"url":"https://forum.creality.com/t/creality-print-v6-3-1-3546/47093","productLine":"print","version":"6.3","versionRaw":"6.3.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":98,"likeCount":0,"sourceType":"论坛"},{"uid":"655f6259ddacefec","date":"2025-12-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can't add a second model (6.3.1.3548)","titleCn":"无法添加第二个模型（6.3.1.3548）","originalText":"I get this warning when I add a second model.\n“Current tray is full; Unarranged models are place above tray 1”\nThese models are under 6.5cm wide. So the plate is not full.","textCn":"添加第二个模型时我收到了这个警告。\n“当前托盘已满；未排列的模型被放置在托盘 1 上方”\n这些模型的宽度都不到 6.5cm。所以热床并没有满。","truncated":false,"url":"https://forum.creality.com/t/cant-add-a-second-model-6-3-1-3548/47094","productLine":"print","version":"6.3","versionRaw":"6.3.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":41,"likeCount":0,"sourceType":"论坛"},{"uid":"31c8e9eed3731177","date":"2025-12-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"User created Printer presets disappeared from Creality Print","titleCn":"用户创建的打印机预设从 Creality Print 中消失了","originalText":"I created several user presets for different nozzles and use them in several projects. Today when I opened Creality Print none of the presets show in the Printer selection area, just one System Preset is there. Has anyone seen this behavior or know how to get the presets back?\nI found them stored in Windows folder under user\\ C:\\Users\\AppData\\Roaming\\Creality\\Creality\\Print\\6.0\\user\\125489617\\machine folder. But they do not show in Creality Print any more under the pulldown selection for Printers.\n1000% frustration with this, and the lack of being able to simply exchange presets openly, and without them disappearing with every new version. This is pushing me back to Orca Slicer yet again. Total frustration.\nI would not have so much of an issue if the developers would simply provide all the presets that you need. For my K1C, the only nozzle options that they appear to recognize is a 0.4mm or higher, but my unit came with a 0.2mm nozzle.\nAn idea solution would be to have a folder that you specify where you put your presets, and then let anyone add, remove, modify, and exchange to their hearts content. …","textCn":"我为不同的喷嘴创建了几个用户预设，并在几个项目中使用。今天我打开 Creality Print 时，打印机选择区域里一个预设都不显示，只有一个系统预设在那里。有人见过这种行为，或者知道怎么把预设找回来吗？ 我发现它们存储在 Windows 文件夹里，路径是 user\\ C:\\Users\\AppData\\Roaming\\Creality\\Creality\\Print\\6.0\\user\\125489617\\machine。但它们不再显示在 Creality Print 的打印机下拉选择里了。 对此百分之千的沮丧，而且无法简单地公开交换预设，每个新版本一来它们就消失。这又把我推回 Orca Slicer。彻底的沮丧。 如果开发者能直接提供你需要的所有预设，我的问题就不会这么大。对于我的 K1C，他们似乎只认得 0.4mm 或更大的喷嘴，但我这台机器配的是 0.2mm 喷嘴。 一个理想的方案是有一个你指定用来放预设的文件夹，然后让任何人尽情地添加、删除、修改和交换。……","truncated":true,"url":"https://forum.creality.com/t/user-created-printer-presets-disappeared-from-creality-print/47092","productLine":"thirdparty","version":"6.0","versionRaw":"6.0","problemType":"","model":"K1C","grade":"泛讨论","replyCount":7,"views":590,"likeCount":0,"sourceType":"论坛"},{"uid":"a5bcc597b177e528","date":"2025-12-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"This model isn't supported?","titleCn":"这个型号不受支持？","originalText":"On my iPad, I opened the Creality app, and went to my workbench.\nMy printer is shown at the top, left hand corner, and when I turn it on. It goes from offline to online, so the app knows it’s there.\nHowever, the message on the screen says:\nThis printer model is not supported.\nFloPrint does not support this device yet.\nIt worked fine before the cloud update 4 days ago.\nRoll back the update\nHow am I supposed to do that?","textCn":"在我的 iPad 上，我打开 Creality app，进入我的工作台。我的打印机显示在左上角，当我开机时，它从离线变为在线，所以 app 知道它在那里。然而，屏幕上的消息说：此打印机型号不受支持。FloPrint 尚不支持此设备。在 4 天前的云更新之前它一直正常工作。回滚更新 我该怎么做？","truncated":false,"url":"https://forum.creality.com/t/this-model-isnt-supported/47090","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":137,"likeCount":0,"sourceType":"论坛"},{"uid":"8b835d1bdc6203f3","date":"2025-12-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can’t Import STL Files into Creality Print After Latest Update","titleCn":"最新更新后无法将 STL 文件导入 Creality Print","originalText":"Hello everyone,\nI recently updated Creality Print to the latest version and since then I’ve had the following problem: I can’t import any .stl files anymore. I open the corresponding folders, but no files are shown there. When I try to drag the files from Explorer into Creality Print, that doesn’t work anymore either (I’m pretty sure this used to work without any issues).\nIf I open the files with a double-click, Creality Print launches and the STL model is loaded without any problems, but only a single one. If I open multiple files at once, a separate instance of Creality Print opens for each STL file.\nIt’s slowly driving me insane because I have absolutely no idea what could be causing this! Help!\n@Metheldas You could go back to the last version 3420 for windows.\nDownload Link Here Creality Print 3420\nI have the same problem. Creative Cloud is unlogical and extremely difficult to use. Would it be possible to use some third-party software where the interface would be a USB stick to the printer itself?","textCn":"大家好，\n我最近把 Creality Print 更新到了最新版本，从那以后我就遇到了下面的问题：我再也不能导入任何 .stl 文件了。我打开相应的文件夹，但那里不显示任何文件。当我尝试把文件从资源管理器拖到 Creality Print 里时，这也不再有效了（我很确定以前这是完全没问题的）。\n如果我双击打开文件，Creality Print 会启动，STL 模型也能正常加载，但只能加载一个。如果我一次打开多个文件，每个 STL 文件都会打开一个单独的 Creality Print 实例。\n这慢慢要把我逼疯了，因为我完全不知道是什么原因导致的！求助！\n@Metheldas 你可以回退到上一个 Windows 版本 3420。\n下载链接在这里 Creality Print 3420\n我也有同样的问题。Creative Cloud 不合逻辑而且极难使用。有没有可能用某种第三方软件，让接口直接就是插到打印机上的 U 盘？","truncated":false,"url":"https://forum.creality.com/t/can-t-import-stl-files-into-creality-print-after-latest-update/47072","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":8,"views":822,"likeCount":2,"sourceType":"论坛"},{"uid":"30700d3dd7c9706a","date":"2025-12-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Sliced line widths greater than line width settings (per preview information and G code)","titleCn":"切片后的线宽大于线宽设置（根据预览信息和 G-code）","originalText":"Hello,\nI’m using Creality Print 6.1.0 and have found an annoying problem. I am trying to dial in a TPU filament that I have using one of the objects from the flow calibration as my print sample. I was trying to nail down the flow rate, but the filament kept jamming in the print head. When I do a nozzle purge, there is no problem whatsoever, so I know the issue is with the flow rate calculated by the slicer.\nAnyway, I have disabled retraction and have been adjusting Max Volumetric Speed. I was able to finally get a complete print, but with problems. When I go to the preview, I can see where the flow is staying below my set point, but I noticed that speeds were wonky (ie one layer at 66mm/s with an 11.63 flow and another layer at 46mm/s with an 11.61 flow rate). This led me to look at line widths where I noticed that there were some that were well above my set line widths. This is where my problem comes in.\nI decided to set all line widths to the size of my nozzle (0.6mm), but when I slice, it still gives me line widths up to 0.85mm (see image below)\nline width problem\nThis is a top surface layer, and no matter what I try (short of lowering my Max Volumetric Speed) I can’t change thi …","textCn":"你好，我用的是 Creality Print 6.1.0，发现了一个烦人的问题。我正试着用流量校准中的一个物体作为我的打印样品来调校一款 TPU 耗材。我试图确定流量，但耗材总是堵在打印头里。当我做喷嘴冲洗时，完全没问题，所以我知道问题出在切片软件计算出的流量上。总之，我已经禁用了回抽，并一直在调整最大体积速度。我终于完成了一次完整的打印，但有问题。当我进入预览时，我能看到流量保持在我的设定值以下，但我注意到速度很奇怪（例如一层是 66mm/s、流量 11.63，另一层是 46mm/s、流量 11.61）。这让我去查看线宽，我注意到有些线宽远远高于我设定的线宽。我的问题就出在这里。我决定把所有线宽都设成我喷嘴的尺寸（0.6mm），但切片时，它仍然给我高达 0.85mm 的线宽（见下图）线宽问题。这是一个顶面层，无论我怎么试（除了降低我的最大体积速度之外），我都无法改变这……","truncated":true,"url":"https://forum.creality.com/t/sliced-line-widths-greater-than-line-width-settings-per-preview-information-and-g-code/47064","productLine":"print","version":"6.1","versionRaw":"6.1.0","problemType":"other","model":"K1 Max","grade":"有效","replyCount":1,"views":144,"likeCount":0,"sourceType":"论坛"},{"uid":"decf29638be5d1ab","date":"2025-12-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Help, New Creality Print version missing Exclude object","titleCn":"求助，新版 Creality Print 缺少排除对象","originalText":"Creality print said there was a new version this morning so I downloaded it, under the device tab where the camera is located and what not the option to remove one of the objects being printed is gone. I’ve looked all over to see if there was some option to turn it back on. I tend to print multiple objects and when fails I just remove it so the printer skips over it, but the option is missing so now I’m wasting so much filament!\nHello @Hpcat\nWelcome to the Creality Forum…!\nexclude-icon\nPressing this icon brings up the exclude screen.\nIt should also be on the printer screen. It replaced the “X” that was used to exclude prints.\nMake sure in your slicer that the option for exclude objects is\nExclue-Objects\nOOOOH that’s why I couldn’t find it! I was scared pressing that icon was going to mess up the print because I hovered over it it said skip, thank you so much!","textCn":"Creality print 今天早上提示有新版本，我就下载了，在设备标签页里摄像头所在的地方，移除正在打印的某个对象的选项不见了。我到处找有没有什么选项能把它重新打开。我倾向于一次打印多个对象，失败时我就把它移除，让打印机跳过它，但这个选项不见了，所以现在浪费了好多耗材！你好 @Hpcat 欢迎来到 Creality 论坛……！exclude-icon 按下这个图标会调出排除界面。它也应该在打印机屏幕上。它取代了以前用来排除打印件的「X」。确保你的切片软件里排除对象的选项是 Exclue-Objects OOOOH 难怪我找不到！我担心按那个图标会弄乱打印，因为我悬停上去时它显示的是跳过，非常感谢！","truncated":false,"url":"https://forum.creality.com/t/help-new-creality-print-version-missing-exclude-object/47040","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":6,"views":1250,"likeCount":7,"sourceType":"论坛"},{"uid":"7764eccb90a172d9","date":"2025-12-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can't find device in creality cloud","titleCn":"在 Creality Cloud 中找不到设备","originalText":"New to 3d printing I have a new K2 plus combo that is set up and has printed the test pieces that come with the printer. The cloud app and web site show the printer as online yet when I try to print it says no device found connect device. I have checked the IP address and it matches the IP address on my router and shows it connected. On the printer touch screen under account it shows my Creality Cloud ID number and user Number. and the network tab shows it connected to my home network. I can use all the help I can get.","textCn":"我是 3D 打印新手，我有一台新的 K2 Plus combo，已经设置好并且打印了打印机附带的测试件。云端应用和网站显示打印机在线，但当我尝试打印时，它说找不到设备，请连接设备。我检查了 IP 地址，它与我的路由器上的 IP 地址一致，并显示已连接。在打印机触摸屏的账户下，它显示了我的 Creality Cloud ID 号和用户编号，网络选项卡显示它已连接到我的家庭网络。我能得到的所有帮助都欢迎。","truncated":false,"url":"https://forum.creality.com/t/cant-find-device-in-creality-cloud/46981","productLine":"cloud","version":"","versionRaw":"","problemType":"compat","model":"K2 Plus","grade":"有效","replyCount":1,"views":155,"likeCount":0,"sourceType":"论坛"},{"uid":"636de86eff65c3a6","date":"2025-12-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K1 + CFS and Creality Print","titleCn":"K1 + CFS 与 Creality Print","originalText":"I upgraded the K1 to CFS, but now I have the problem that when loading colored 3MF files, only a monochrome model is displayed. There is supposed to be a print called K1 + CFS, but I can’t find it.","textCn":"我把 K1 升级到了 CFS，但现在的问题是在加载彩色 3MF 文件时，只显示单色模型。应该有一个叫做 K1 + CFS 的打印配置，但我找不到。","truncated":false,"url":"https://forum.creality.com/t/k1-cfs-and-creality-print/46983","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"K1","grade":"有效","replyCount":1,"views":55,"likeCount":0,"sourceType":"论坛"},{"uid":"cd75809c367ec15d","date":"2025-11-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Cloud g login problem","titleCn":"Creality Cloud g 登录问题","originalText":"Anyone knows how to fix logi?\nIn have added printer and successfully ran single print another day\nAnd now I’m not able to login again. Login works from web. But not from Android App. I have tried joining beta program - app updated, but it didn’t help. Have tried cleaning up cache - didn’t help. I can login eith email, but not with google authentication.\nScreenshot_20251129-160529\nDid you solve this problem? Mine did an update and logged out. When trying to log in again, I’m having the same error. Tried to uninstall / install to no avail.\nI’ve got the same issue with no solution","textCn":"有人知道怎么修好登录吗？我已经添加了打印机，前几天还成功运行了一次单件打印。现在我又无法登录了。从网页能登录，但从安卓应用登录不了。我试过加入测试计划——应用更新了，但没用。试过清理缓存——没用。我可以用邮箱登录，但用谷歌验证登不了。Screenshot_20251129-160529。你解决这个问题了吗？我的更新后就被登出了。再次尝试登录时，我也遇到同样的错误。试过卸载/安装，没用。我也遇到同样的问题，没有办法","truncated":false,"url":"https://forum.creality.com/t/creality-cloud-g-login-problem/46917","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":6,"views":429,"likeCount":1,"sourceType":"论坛"},{"uid":"f68375152352d0d7","date":"2025-11-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problems with point cloud and merging","titleCn":"点云与合并方面的问题","originalText":"Problems with point cloud and merging","textCn":"点云与合并方面的问题","truncated":false,"url":"https://forum.creality.com/t/problems-with-point-cloud-and-merging/46904","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":36,"likeCount":0,"sourceType":"论坛"},{"uid":"6b21ee60361a797f","date":"2025-11-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Disable \"models on platform\" warning toggle missing in Creality Print v6","titleCn":"Creality Print v6 中缺少禁用“平台上有模型”警告的开关","originalText":"Has anyone found the setting to disable this warning in Creality Print for the K2 Plus? Documentation for v5 shows a checkbox to turn it off, but I can’t find any equivalent option in the current version. If there’s a new location for that toggle, or if the feature was removed, I’d appreciate any clarification from someone who has already dug into it.\nTo be honest, I never saw it before\nI’m using Creality Print 6.3. which one are you using ?\nI’m using 6.3.","textCn":"有人在 K2 Plus 的 Creality Print 中找到禁用这个警告的设置了吗？v5 的文档里显示有一个可以关闭它的复选框，但在当前版本中我找不到任何对应的选项。如果那个开关换了新位置，或者这个功能被移除了，希望已经深入研究过的人能给我一些说明。\n说实话，我以前从没见过它\n我用的是 Creality Print 6.3。你用的是哪个版本？\n我用的是 6.3。","truncated":false,"url":"https://forum.creality.com/t/disable-models-on-platform-warning-toggle-missing-in-creality-print-v6/46900","productLine":"print","version":"6","versionRaw":"6","problemType":"feature","model":"K2 Plus","grade":"有效","replyCount":5,"views":116,"likeCount":1,"sourceType":"论坛"},{"uid":"f12e35853887b0fa","date":"2025-11-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Beta v7 so far is GREAT!!!","titleCn":"到目前为止 Beta v7 太棒了！！！","originalText":"Hi to all!!\nNeed to spam about it… but so far is awesome!\nWe recover the preview cam over internet on the Device tab.\nThe slicing time is greatly reduced! More than 3 times faster than v6.3.\nNavigating through layers, WAY faster and snappier!\nSo far, a very good version…\nTranslation, have issues… but i live with that….\nCreality Print 7 Goods 01\nThat’s nice. When will Creality be moving their changes back into mainstream Orca, and providing support for Linux users?","textCn":"大家好！！需要为它疯狂宣传一下……但到目前为止它真的很棒！我们恢复了 Device 标签页上通过互联网的预览摄像头。切片时间大大缩短！比 v6.3 快 3 倍以上。在层之间浏览快得多、更流畅！到目前为止，这是一个非常好的版本……翻译有问题……但我可以忍受……Creality Print 7 Goods 01 很好。Creality 什么时候会把他们的改动合并回主流 Orca，并为 Linux 用户提供支持？","truncated":false,"url":"https://forum.creality.com/t/beta-v7-so-far-is-gre
