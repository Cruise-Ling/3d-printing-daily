<script>var COL={"meta":{"kind":"sw","updatedDate":"2026-10-13","refDate":"2026-10-13","batch":"工作日 03:30","updateLog":[{"date":"2026-10-13","text":"全量采集 502 条（Software 板块 + 5 个标签）；版本归一到主.次；全量补原文 + 机翻"}],"sources":"信源：Creality 官方论坛 Software 板块（497 主题）+ 标签 crealityprint / slicingsoftware / bug-report / firmware / feature-need · 每日增量采集","foot":"<b>口径说明</b><br>① <b>信源单一</b>：全部条目来自 Creality 官方论坛 Software 板块，暂不含电商评价与第三方社区，因此不设「渠道结构」面板，改用产品线结构。② <b>审核</b>：有效（可归入七类问题）进问题榜；泛讨论（提问 / 教程 / 公告）只计声量，不强行归类。③ <b>版本</b>：已归一到「主.次」，原始版本串保留在明细卡片；月均 = 该主版本条数 ÷ 时间跨度月数，跨版本比较请看月均而非绝对条数。④ <b>译文</b>：非中文内容全量机器翻译，原文零改动；正文超过 1,200 字的保留前 1,200 字并标注可跳原帖。","badges":"<span class=\"badge b-blue\">502 条</span><span class=\"badge b-grn\">有效 265</span><span class=\"badge b-gray\">泛讨论 237</span><span class=\"badge b-yel\">22 个版本</span><span class=\"badge b-blue\">原文 + 译文</span>","title":"3D 打印软件用户使用专栏","icon":"🧩","subtitle":"Creality Print / 固件 / 云 + APP / 第三方切片 · 官方论坛全量采集 · 版本回归追踪 · 覆盖 22 个版本 / 13 个机型 · 每日增量 · 原文 + 机翻双段"},"items":[{"uid":"63d8e35e4eed3431","date":"2026-10-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Latest firmware for K1C 2025r monochrome","titleCn":"K1C 2025r 单色版的最新固件","originalText":"Customer support said that the latest version is the one you can found here: (2nd from bottom)\nFlagship Series Firmware Download\nFind all Creality firmware downloads for your Flagship Series 3D printers, including K1, K1 Max and K1C. Update your printer with the latest firmware for optimal performance.\nCR4SU200382C13_ota_K1C-2025_V1.0.0.26.20251024S.img\nBut there is a lot of bigger version number under here:\nK1C Downloads Center: Firmware, Software & User Manuals\nDownload the latest Creality K1C firmware, slicing software, and user manuals. Keep your 3D printer updated with official drivers and technical guides.\nwhich one should I use for single color printing?\nThanks in advance","textCn":"客服说最新版本是你能在这里找到的那个：（倒数第二个） 旗舰系列固件下载 找到你的旗舰系列 3D 打印机的所有 Creality 固件下载，包括 K1、K1 Max 和 K1C。用最新固件升级你的打印机以获得最佳性能。 CR4SU200382C13_ota_K1C-2025_V1.0.0.26.20251024S.img 但在这下面还有很多版本号更大的： K1C 下载中心：固件、软件和用户手册 下载最新的 Creality K1C 固件、切片软件和用户手册。用官方驱动和技术指南让你的 3D 打印机保持更新。 单色打印我该用哪一个？ 提前感谢","truncated":false,"url":"https://forum.creality.com/t/latest-firmware-for-k1c-2025r-monochrome/54166","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":59,"likeCount":0,"sourceType":"论坛"},{"uid":"0c9549ee2aaf0801","date":"2026-10-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Arc Fitting (Ajuste de Arco)","titleCn":"圆弧拟合（Arc Fitting）","originalText":"Dear Team,\nWhy are the Orca and Creality Print profiles set with the “Arc Fitting” option enabled for K2 series printers, even though it is recommended to keep it disabled?\nAfter all, Klipper firmware converts arcs into line segments. Requesting the slicer to generate arcs (G2/G3) only causes the firmware to convert them back into line segments, which could be handled directly if this option were left unchecked in the default profile.","textCn":"尊敬的团队，为什么 Orca 和 Creality Print 的配置(参数配置)在 K2 系列打印机上把“圆弧拟合”选项设为启用，尽管推荐保持禁用？毕竟，Klipper 固件会把圆弧转换成线段。让切片软件生成圆弧（G2/G3）只会导致固件再把它们转回线段，而如果在默认配置中不勾选这个选项，这些本来就可以直接处理。","truncated":false,"url":"https://forum.creality.com/t/arc-fitting-ajuste-de-arco/54040","productLine":"firmware","version":"","versionRaw":"","problemType":"feature","model":"K2","grade":"有效","replyCount":1,"views":26,"likeCount":0,"sourceType":"论坛"},{"uid":"31ec825ca4c17a93","date":"2026-09-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print > 7.1.1.4472 CY2586 Y-axis print coordinates out of range on K2 Plus","titleCn":"Creality Print > 7.1.1.4472 在 K2 Plus 上出现 CY2586 Y 轴打印坐标超出范围","originalText":"Creality Print > 7.1.1.4472 causes a CY2586 error when slicing with multiple colors on a K2 Plus with CFS. The gcode contains moves to Y 378 during color switching which is beyond the Y 350 range of print plate. Earlier versions don’t generate such movements.\nCY2586\nY378","textCn":"在配备 CFS 的 K2 Plus 上使用多色切片时，Creality Print > 7.1.1.4472 会导致 CY2586 错误。G-code 在换色过程中包含移动到 Y 378 的动作，超出了打印板 Y 350 的范围。较早的版本不会生成这样的移动。 CY2586 Y378","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-1-1-4472-cy2586-y-axis-print-coordinates-out-of-range-on-k2-plus/53933","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":1,"views":46,"likeCount":0,"sourceType":"论坛"},{"uid":"d36d23459921b778","date":"2026-09-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bug in Creality Print 7.2.2.5483 – CFS NANO assigns unused filament and causes TR0116","titleCn":"Creality Print 7.2.2.5483 中的 bug——CFS NANO 分配未使用的耗材并导致 TR0116","originalText":"Hello,\nI found what appears to be a bug in Creality Print 7.2.2.5483 when using the CFS NANO with the SPARKX i7.\nI have 3 filament rolls loaded in my CFS NANO , for example:\nCFS 1A → Black PLA\nCFS 1B → White PLA\nCFS 1D → Orange PLA\nI wanted to print a model that uses only two colors: black and orange .\nWhen I opened the project in Creality Print, the CFS section automatically had all three loaded filaments available in the project:\nBlack\nWhite\nOrange\nEven though the model only required black and orange.\nI sent the print without removing the unused white filament from the Creality Print project. The printer then stopped with error:\nTR0116 – Filament run out\nThe CFS and the printer were working correctly, and the filaments were physically available.\nImportant test\nI then opened the same project and removed the unused white filament from the CFS filament list in Creality Print , leaving only:\nBlack → CFS 1A\nOrange → CFS 1D\nI generated the G-code again and sent it to the printer.\nThe exact same model then printed correctly, including the automatic color change.\nI also tested the printer using a 3-color model stored in the printer’s internal memory , and that model printed perfectly. …","textCn":"你好，我发现 Creality Print 7.2.2.5483 在配合 SPARKX i7 使用 CFS NANO 时似乎有一个 bug。我的 CFS NANO 里装了 3 卷耗材，例如：CFS 1A → 黑色 PLA CFS 1B → 白色 PLA CFS 1D → 橙色 PLA 我想打印一个只使用两种颜色的模型：黑色和橙色。当我在 Creality Print 中打开项目时，CFS 部分自动把三卷已装载的耗材都放进了项目里：黑色 白色 橙色 尽管模型只需要黑色和橙色。我没有从 Creality Print 项目中移除未使用的白色耗材就发送了打印。然后打印机因错误停止：TR0116 – Filament run out CFS 和打印机工作正常，耗材也物理上存在。重要测试 然后我打开同一个项目，从 Creality Print 的 CFS 耗材列表中移除未使用的白色耗材，只留下：黑色 → CFS 1A 橙色 → CFS 1D 我重新生成 G-code 并发送到打印机。完全相同的模型随后打印正确，包括自动换色。我还用打印机内部存储器中保存的 3 色模型测试了打印机，那个模型打印得很完美。……","truncated":true,"url":"https://forum.creality.com/t/bug-in-creality-print-7-2-2-5483-cfs-nano-assigns-unused-filament-and-causes-tr0116/53815","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"SPARKX i7","grade":"有效","replyCount":1,"views":43,"likeCount":2,"sourceType":"论坛"},{"uid":"599da5109a91f4d3","date":"2026-09-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality 7.2: interior corners at convex \"stepped\" shapes not solid","titleCn":"Creality 7.2：凸起「阶梯」形状的内角不是实心的","originalText":"I’ve been having an issue with Creality Print for a long time now. I’ve reported this on reddit like last year but it still persists.\nBasically, whenever I print something with “stepped” structures (a vertical wall meets a horizontal floor/ceiling at a perfect 90degree angle), the corner where the two sides meet always ends up being a point of failure, as it doesn’t properly place solid material there. The vertical wall ends, there’s a single layer in the horizontal structure that overlaps it, and the rest of the horizontal structure starts at the vertical wall’s outer surface.\nIn basically every case I’ve dealt with thus far, this has resulted in the vertical structure having an incredibly weak connection to the horizontal one, being essentially held together by a few wall-widths of bottom surface layer, and sparse infill. Especially in the case of objects with “shafts” which are completely embedded within horizontal surfaces, this results in “shafts” which break off incredibly easily, due to a lack of solid structural connection/support, and we’ve had to waste a lot of effort designing around this problem.\nIt’s difficult to explain, so I shall do so with pictures. …","textCn":"我用 Creality Print 很久以来一直有个问题。我去年在 reddit 上报告过，但问题依然存在。基本上，每当我打印带有「阶梯」结构的东西（一段垂直墙与水平的地面/顶面以完全 90 度角相接），两侧相交的角落总是成为失效点，因为它没有在那里正确放置实心材料。垂直墙结束，水平结构中只有一层与它重叠，水平结构的其余部分从垂直墙的外表面开始。在我迄今处理过的几乎所有情况中，这导致垂直结构与水平结构的连接极其脆弱，基本上只靠几层墙宽的底面层和稀疏填充连在一起。特别是对于「轴」完全嵌入水平表面的对象，这会导致「轴」极其容易断裂，因为缺少实心结构连接/支撑，我们不得不花费大量精力在设计上规避这个问题。很难解释，所以我用图片来说明。……","truncated":true,"url":"https://forum.creality.com/t/creality-7-2-interior-corners-at-convex-stepped-shapes-not-solid/53762","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":18,"likeCount":0,"sourceType":"论坛"},{"uid":"a2fb13c72e8a69cb","date":"2026-09-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Multiple Processes?","titleCn":"多个流程？","originalText":"Hi all,\nI am wondering if one is able to save more than one process and use at will. At the moment I’m using the default and changing it every time. Which is fine. But I made one that I like for a specific print, and I am hoping that I could save that Process that I could call on when needed.\nIf this is something one can do, how does one do so?\nRunning the Creality Print V7,2,1.546-x86_64 Appimage on Linux Mint.\nthanks!","textCn":"大家好，我想知道是否能够保存多个流程并随意使用。目前我在用默认配置，每次都要改动。这也没问题。但我为一个特定打印做了一个我喜欢的配置，希望能保存那个流程，在需要时调用。如果这可以做到，该怎么做？在 Linux Mint 上运行 Creality Print V7,2,1.546-x86_64 Appimage。谢谢！","truncated":false,"url":"https://forum.creality.com/t/multiple-processes/53731","productLine":"print","version":"7","versionRaw":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":13,"likeCount":0,"sourceType":"论坛"},{"uid":"3e1beae361c5afc7","date":"2026-09-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print version 7.2.2.5483 & spheres","titleCn":"Creality Print 版本 7.2.2.5483 与球体","originalText":"Creality Print version 7.2.2.5483 & spheres","textCn":"Creality Print 版本 7.2.2.5483 与球体","truncated":false,"url":"https://forum.creality.com/t/creality-print-version-7-2-2-5483-spheres/53732","productLine":"print","version":"7.2","versionRaw":"7.2.2","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":26,"likeCount":0,"sourceType":"论坛"},{"uid":"7931206f2aac5bb8","date":"2026-09-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Hi shut down during printing and won't turn back on.","titleCn":"Creality Hi 在打印过程中关机，之后再也无法开机。","originalText":"Hello, I have a Creality Hi 3D printer. The other day, the firmware update was interrupted halfway through. I turned the printer off and on again, and it initially started normally. I then started a print, but before the print could begin, the printer suddenly shut itself down and has not turned on again since.\nI am also attaching a photo of the motherboard. What do you think could be causing the problem, and what would be the solution?\ni think the problem could be only the power unit of the machine, or your wall outlet might be in poor condition or have inadequate wiring, causing momentary power interruptions that lead to this issue. If the outlet was indeed faulty—perhaps due to thin or low-quality wiring—and the problem persists even after fixing it or plugging the printer into a different, properly functioning outlet, then the original outlet likely fried the printer’s power supply or another component.\nI performed the measurements; it is functional, and my motherboard is functional too","textCn":"你好，我有一台 Creality Hi 3D 打印机。前几天，固件更新中途被中断了。我把打印机关机再开机，它一开始正常启动了。然后我开始了一个打印，但在打印真正开始之前，打印机突然自己关机了，从那以后就再也没开过机。\n我还附上一张主板的照片。你觉得可能是什么原因导致这个问题，解决办法是什么？\n我认为问题可能只出在机器的电源单元上，或者你的墙上插座状况不佳或线路不合适，导致瞬时断电，从而引发这个问题。如果插座确实有故障——也许是线太细或质量太差——而且在修复之后或把打印机插到另一个正常工作的插座上问题仍然存在，那么原来的插座很可能烧坏了打印机的电源或其他部件。\n我做了测量；它是正常的，我的主板也是正常的","truncated":false,"url":"https://forum.creality.com/t/creality-hi-shut-down-during-printing-and-wont-turn-back-on/53725","productLine":"firmware","version":"","versionRaw":"","problemType":"crash","model":"Creality Hi","grade":"有效","replyCount":3,"views":44,"likeCount":0,"sourceType":"论坛"},{"uid":"4fd34caebd29b1af","date":"2026-09-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 5.1.1.9490 suddenly corrupts system filament and print configurations — presets move to User Configuration and get incorrect settings","titleCn":"Creality Print 5.1.1.9490 突然损坏系统耗材和打印配置 —— 预设移动到用户配置并得到错误设置","originalText":"Hello,\nI am experiencing a serious configuration/preset problem with Creality Print 5.1.1.9490 on Windows with a Creality K1C.\nI have been using Creality Print 5.1.1.9490 for more than 1.5 years. During this entire period the software was working normally, including while connected to the internet. I have hundreds of models that were designed, sliced and printed successfully using this version.\nAbout 7–10 days ago everything was still normal. I did not change my local configuration.\nWhen I opened Creality Print recently, I found that many default system filament presets had suddenly appeared under “User Configuration”, even though I never created custom versions of these filaments.\nMore importantly, their parameters have also been changed.\nAll of the affected filament presets have been assigned the same incorrect parameters: 200°C nozzle / 45°C bed. This includes ABS profiles as well, which clearly should not have the same settings as PLA.\nThis is not only a filament temperature problem. The print/process configuration also appears to have been changed. …","textCn":"你好，我在 Windows 上使用 Creality Print 5.1.1.9490 搭配 Creality K1C 时遇到了严重的配置/预设问题。我使用 Creality Print 5.1.1.9490 已经超过 1.5 年了。在这整个期间，软件一直正常工作，包括连接互联网的时候。我有数百个使用这个版本设计、切片并成功打印的模型。大约 7–10 天前一切还都正常。我没有更改我的本地配置。最近我打开 Creality Print 时，发现许多默认系统耗材预设突然出现在“用户配置”下，尽管我从未创建过这些耗材的自定义版本。更重要的是，它们的参数也变了。所有受影响的耗材预设都被赋予了同样错误的参数：200°C 喷嘴 / 45°C 热床。这也包括 ABS 配置，而它显然不应该和 PLA 有相同的设置。这不仅是耗材温度的问题。打印/工艺配置似乎也被更改了。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-5-1-1-9490-suddenly-corrupts-system-filament-and-print-configurations-presets-move-to-user-configuration-and-get-incorrect-settings/53605","productLine":"print","version":"5.1","versionRaw":"5.1.1","problemType":"ui","model":"K1C","grade":"有效","replyCount":1,"views":36,"likeCount":0,"sourceType":"论坛"},{"uid":"00672c04cb55554d","date":"2026-09-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Did I find a new hidden firmware because of a misleading title?","titleCn":"我是不是因为一个误导性标题发现了一个新的隐藏固件？","originalText":"I came across something really strange: a firmware update with a misleading title—it looks like an old version, yet it has the most recent upload date of them all. Could it be a new update that was mislabeled? Also, I’ve noticed that since the machine’s last firmware update (the one for the CFS Nano and so on), the AI ​​isn’t working properly; it no longer detects the “spaghetti” effect or printing issues, and it behaves strangely during calibration and similar processes.\nfwsaefase\naefafdes\nI also want to mention that “1.1.4.0.2” firmware doesn’t appear on the other sites; I’ll show you.\nAnd in case you’re wondering, no, I don’t have the guts to install that firmware to see what it does…","textCn":"我碰到一件很奇怪的事：一个标题有误导性的固件更新——它看起来像旧版本，却有着所有版本中最新的上传日期。会不会是被标错的新更新？另外，我注意到自从机器上次固件更新（CFS Nano 那一次等等）之后，AI 就不正常工作了；它不再检测“面条”现象或打印问题，而且在校准和类似过程中表现怪异。 fwsaefase aefafdes 我还想提一下，“1.1.4.0.2”固件没有出现在其他网站上；我给你们看。 另外，如果你想知道，不，我没那个胆子装那个固件看看它会怎样……","truncated":false,"url":"https://forum.creality.com/t/did-i-find-a-new-hidden-firmware-because-of-a-misleading-title/53607","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":99,"likeCount":1,"sourceType":"论坛"},{"uid":"c397590e07d6cd92","date":"2026-09-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"a serious error has occured in some app. Please send this report","titleCn":"某个应用发生了严重错误。请发送此报告","originalText":"a serious error has occured in some app. Please send this report","textCn":"某个应用发生了严重错误。请发送此报告","truncated":false,"url":"https://forum.creality.com/t/a-serious-error-has-occured-in-some-app-please-send-this-report/53569","productLine":"cloud","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":24,"likeCount":0,"sourceType":"论坛"},{"uid":"49b4d28c1406fd7f","date":"2026-09-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CHANGE FILAMENT TYPES WHEN SLICING A PRINT.","titleCn":"切片打印时更改耗材类型。","originalText":"CHANGE FILAMENT TYPES WHEN SLICING A PRINT.","textCn":"切片打印时更改耗材类型。","truncated":false,"url":"https://forum.creality.com/t/change-filament-types-when-slicing-a-print/53529","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"31b48285fbd11023","date":"2026-09-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Estimated completion time - shows in military time","titleCn":"预计完成时间 - 显示为 24 小时制","originalText":"In CrealityPrint 7.2.2.5483\nDevice Tab during a print,\nEstimated completion time:\nis in military time. That is 1:21 PM is shown as 13:21\nIs there any way to change that?\nThanks","textCn":"在 CrealityPrint 7.2.2.5483 中，打印期间的设备标签页里，预计完成时间显示为 24 小时制。也就是说下午 1:21 显示成 13:21。有办法改吗？谢谢","truncated":false,"url":"https://forum.creality.com/t/estimated-completion-time-shows-in-military-time/53539","productLine":"print","version":"7.2","versionRaw":"7.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":20,"likeCount":0,"sourceType":"论坛"},{"uid":"f052f0bf19f80dd6","date":"2026-09-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Secondary display issue in V7.2.2.5483","titleCn":"V7.2.2.5483 中的副屏问题","originalText":"To my laptop I have a secondary screen connected. After opening Creality Print I drag the application window to my secondary, then I try maximizing the Creality Print application window. ISSUE: As soon as I maximize the Creality Print application window the application goes black/blank. Only solution is to go into the activity manager and close the application. Then start it again. Sidenote: If i just drag the application to my secondary screen all is good. It is tha maximizing action that craches the application.","textCn":"我的笔记本电脑连接了一块副屏。打开 Creality Print 后，我把应用窗口拖到副屏，然后尝试最大化 Creality Print 应用窗口。问题：一旦我最大化 Creality Print 应用窗口，应用就会变黑/空白。唯一的解决办法是进入任务管理器并关闭应用，然后再启动它。旁注：如果我只是把应用拖到副屏，一切正常。是最大化操作让应用崩溃的。","truncated":false,"url":"https://forum.creality.com/t/secondary-display-issue-in-v7-2-2-5483/53496","productLine":"print","version":"7.2","versionRaw":"7.2.2","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":19,"likeCount":0,"sourceType":"论坛"},{"uid":"19a93aac57953c8c","date":"2026-09-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Homing issues","titleCn":"回零问题","originalText":"I was trying to print and my spark x i7 and it will not home. It starts and when it goes to clear the nozzle it bounces an will not go all the way left. I tryed to reset it and it does the same thing.","textCn":"我想打印的时候，我的 spark x i7 无法回零。它启动后，当它去清理喷嘴时会弹一下，而且不会一直走到左边。我试过重置它，但还是做同样的事。","truncated":false,"url":"https://forum.creality.com/t/homing-issues/53499","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"e9b39a4e5cd73840","date":"2026-09-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Photoshop layers in Falcon Design space","titleCn":"在 Falcon Design 空间中使用 Photoshop 图层","originalText":"I am new to my Falcon A1 and Falcon design software. Is there a way to use layers created in Photoshop to create a line engraving layer and line cutting layer in Falcon design software.\nthanks Jon…","textCn":"我是 Falcon A1 和 Falcon design 软件的新手。有没有办法使用在 Photoshop 中创建的图层，在 Falcon design 软件里生成线条雕刻图层和线条切割图层。谢谢 Jon…","truncated":false,"url":"https://forum.creality.com/t/photoshop-layers-in-falcon-design-space/53473","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"da851cf848277eac","date":"2026-09-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality k2 coombo","titleCn":"Creality k2 coombo","originalText":"Title: Creality K2 Pro Combo stuck during Auto Leveling in Self-Inspection\nHello everyone,\nI have a Creality K2 Pro Combo and I’m experiencing an issue during the printer’s Self-Inspection / Self-Test .\nThe test goes through all the previous steps normally, but when it reaches the final step, Auto Leveling , it gets stuck and does not proceed.\nThere is:\nNo error message.\nNo failure notification.\nNo success/completion message.\nThe printer simply remains stuck on the Auto Leveling step indefinitely.\nI have tried waiting for the process to finish, but it never moves past this stage.\nHas anyone experienced the same issue with the K2 Pro Combo?\nWhat could be causing the Auto Leveling process to get stuck, and what steps can I take to fix it?\nAny help or suggestions would be greatly appreciated.\nThank you!\nHi,\nI had got exact same problem with brand new K2, printer got stuck on Auto Leveling for hours.\nThe only thing that helped was to insert USB stick with the newest firmware, upon start-up printer will detect it and let you proceed with the upgrade.","textCn":"标题：Creality K2 Pro Combo 在自检的自动调平阶段卡住 大家好，我有一台 Creality K2 Pro Combo，我在打印机的自检/自测过程中遇到问题。测试正常通过之前的所有步骤，但当它到达最后一步，自动调平，它卡住了，不再继续。 现象： 没有错误消息。 没有失败通知。 没有成功/完成消息。 打印机就无限停留在自动调平这一步。 我试过等待流程结束，但它从未越过这个阶段。 有人在 K2 Pro Combo 上遇到过同样的问题吗？ 自动调平过程卡住可能是什么原因，我可以采取哪些步骤来修复？ 任何帮助或建议都非常感谢。 谢谢！ 你好，我用全新的 K2 也遇到完全相同的问题，打印机在自动调平上卡了几个小时。唯一有用的是插入装有最新固件的 U 盘，启动时打印机会检测到它并让你继续升级。","truncated":false,"url":"https://forum.creality.com/t/creality-k2-coombo/53404","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":49,"likeCount":0,"sourceType":"论坛"},{"uid":"e843bcf356ee3585","date":"2026-09-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CR-M4 – Power Loss Recovery & Filament Runout Sensor not activated by default in Creality Print G-code","titleCn":"CR-M4 – 在 Creality Print 的 G-code 中，断电续打与断料检测传感器默认未启用","originalText":"CR-M4 – Power Loss Recovery & Filament Runout Sensor not activated by default in Creality Print G-code","textCn":"CR-M4 – 在 Creality Print 的 G-code 中，断电续打与断料检测传感器默认未启用","truncated":false,"url":"https://forum.creality.com/t/cr-m4-power-loss-recovery-filament-runout-sensor-not-activated-by-default-in-creality-print-g-code/53347","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":20,"likeCount":1,"sourceType":"论坛"},{"uid":"0ebe6d44d2110832","date":"2026-08-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Not able to slice a file","titleCn":"无法切片某个文件","originalText":"Creality print (Latest version) with a K2 plus printer.\nI have several files that when I try to slice them, I get a warning that NO layers can be found.\nThe original maker says they slice in Orca, and they in fact do, but I don’t like that tool.\nWhat can I do to open and print with Creality Print?\nHello ! Can you share some pictures so we see what’s happening ?","textCn":"Creality Print（最新版本）搭配 K2 Plus 打印机。我有几个文件，当我尝试切片时，会收到找不到任何层的警告。原作者说他们在 Orca 里能切片，事实上确实可以，但我不喜欢那个工具。我能做些什么来用 Creality Print 打开并打印？你好！你能分享一些图片，让我们看看发生了什么吗？","truncated":false,"url":"https://forum.creality.com/t/not-able-to-slice-a-file/53323","productLine":"print","version":"","versionRaw":"","problemType":"slice","model":"K2 Plus","grade":"有效","replyCount":2,"views":26,"likeCount":0,"sourceType":"论坛"},{"uid":"89e6596e689adc00","date":"2026-08-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Extruder light ON while changing filament","titleCn":"换料时挤出机灯亮起","originalText":"Extruder light ON while changing filament","textCn":"换料时挤出机灯亮起","truncated":false,"url":"https://forum.creality.com/t/extruder-light-on-while-changing-filament/53293","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":33,"likeCount":0,"sourceType":"论坛"},{"uid":"1d5de6cd7fa9ce90","date":"2026-08-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Wipe Tower Issue","titleCn":"擦料塔问题","originalText":"Hello,\ni use creality print 7.2.2.5483\nThis is my Wipetower. I can’t find the issue. The issue is only when more than one part of the bed.","textCn":"你好，我使用的是 Creality Print 7.2.2.5483。这是我的擦料塔。我找不到问题所在。这个问题只在热床上有不止一个零件时出现。","truncated":false,"url":"https://forum.creality.com/t/wipe-tower-issue/53288","productLine":"print","version":"7.2","versionRaw":"7.2.2","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":29,"likeCount":0,"sourceType":"论坛"},{"uid":"67c62739c530a1df","date":"2026-08-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K2 Pro-update to V7.2.1.5476","titleCn":"K2 Pro 升级至 V7.2.1.5476","originalText":"K2 Pro-update to V7.2.1.5476","textCn":"K2 Pro 升级至 V7.2.1.5476","truncated":false,"url":"https://forum.creality.com/t/k2-pro-update-to-v7-2-1-5476/53283","productLine":"print","version":"7.2","versionRaw":"7.2.1","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":5,"views":100,"likeCount":0,"sourceType":"论坛"},{"uid":"ce5615ed4a72481c","date":"2026-08-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","title":"Problems with installing the Ender3 S1 firmware for the Nebula Smart Kit (display and camera)","titleCn":"为 Nebula Smart Kit（显示屏和摄像头）安装 Ender3 S1 固件的问题","originalText":"Hi everybody. I have an Ender-3 S1 with a C14 motherboard (it has an STM32F401RET6 microcontroller). I bought the Creality Nebula Smart Kit.\nWhen I tried to install and configure the Nebula Pad, problems arose. When I connected the Nebula display, I couldn’t load the pre‑installed S1 firmware, as the manufacturer had only installed it for C13. I tried to update the printer’s firmware using a firmware I found online; as required, I placed it in the STM32F4_UPDATE folder, but the firmware installation on the old display freezes.\nI read online that the C14 F401 board may be incompatible with the Nebula Pad, but there are firmware versions that solve this problem.\nCould you tell me if there is currently a working solution to this issue? Perhaps someone has a test firmware from Creality or another way to make this work? I don’t want to buy the C13 board yet.\nIf possible, please send the required firmware if you have it.\nThank you in advance!\nПривет всем. У меня Ender-3 S1 с материнской платой C14 (на ней стоит микроконтроллер STM32F401RET6). Я купил Creality Nebula Smart Kit.\nПри попытке установки и настройки Nebula Pad возникли проблемы. …","textCn":"大家好。我有一台 Ender-3 S1，主板是 C14（上面是 STM32F401RET6 微控制器）。我买了 Creality Nebula Smart Kit。 当我尝试安装和配置 Nebula Pad 时，出现了问题。当我连接 Nebula 显示屏时，我无法加载预装的 S1 固件，因为厂商只针对 C13 安装了它。我尝试用在网上找到的固件更新打印机固件；按照要求，我把它放进了 STM32F4_UPDATE 文件夹，但在旧显示屏上的固件安装卡住了。 我在网上看到，C14 F401 主板可能与 Nebula Pad 不兼容，但有一些固件版本可以解决这个问题。 你能告诉我目前是否有可行的解决方案吗？也许有人有 Creality 的测试固件，或者有其他办法能让它工作？我还不想买 C13 主板。 如果可以，请把你有的所需固件发给我。 先谢谢了！","truncated":true,"url":"https://forum.creality.com/t/problems-with-installing-the-ender3-s1-firmware-for-the-nebula-smart-kit-display-and-camera/53262","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":33,"likeCount":0,"sourceType":"论坛"},{"uid":"327d689b2221cdd5","date":"2026-08-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3x stronger infill design","titleCn":"强度提升 3 倍的填充设计","originalText":"How do I get this info to Creality:\nA team of researchers from University College London (UCL) have developed a new 3D-printable structure called a “triply-twinned” lattice that is up to 380% stiffer and 279% stronger than ordinary cubic designs. Best of all, it uses the same amount of material!\nMakeUseOf – 26 Aug 26\nEngineers just discovered how to make 3D prints 3x stronger without extra...\nThis new printing technique seems so simple, but could have major implications for the future of the technology.\nright, and they did that without enclosure, with the cheapest 3D printer, and with cheap filament?\nWell, if they didn’t, then its not 380% stiffer. First of all, after the printed model gets cold, and it has been made of PC for example, and wall thickness is like 5mm in total, i guarantee, that any infill you go with, will not affect the stiffness by much, as PC on it’s own is very rigid and kinda brittle too.\nGiving numbers where tests have been done under perfect conditions means literally nothing in real world.","textCn":"我怎样才能把这个信息传达给 Creality：伦敦大学学院（UCL）的一组研究人员开发了一种名为“三孪生”晶格的新型可 3D 打印结构，它比普通的立方体设计刚度高 380%，强度高 279%。最棒的是，它使用的材料量相同！MakeUseOf – 26 Aug 26 Engineers just discovered how to make 3D prints 3x stronger without extra... 这种新的打印技术看起来如此简单，却可能对该技术的未来产生重大影响。对，而且他们是在没有封闭腔体、用最便宜的 3D 打印机和便宜耗材的情况下做到的吗？嗯，如果他们不是，那就不是 380% 的刚度。首先，打印的模型冷却后，比如它是用 PC 做的，壁厚总共大约 5mm，我保证，无论你用哪种填充，对刚度的影响都不会太大，因为 PC 本身非常刚性，也有点脆。在完美条件下进行测试给出的数字在现实世界中毫无意义。","truncated":false,"url":"https://forum.creality.com/t/3x-stronger-infill-design/53265","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":42,"likeCount":0,"sourceType":"论坛"},{"uid":"f545a8e0cff5a029","date":"2026-08-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"creality printer problem after upgrade","titleCn":"升级后 creality 打印机的问题","originalText":"After I upgrade version of Creality Printer to version 7.2.1.5476, the CUBE that allow us to see the object in it Top, Botton, Front, Back, Left, Right, was also translated to Portuguese.\nBefore this upgrade, WHEN i WAS IN THE PREVIOUS RELEASE, in spite of the fact that all the rest was in Portuguese, the Cube was in English.\nWith the upgrade, the translation appeared totally wrong:\nTop appeared as: TOP (em inglês) when the right term is: Topo\nFront appeared as: Frante when the right term is: Frente\nBack appeared as: Voltar when the right term should be: Verso\nBotton appeared as: Baço when the right term should be: Base\nRight appeared as Direito when the right term should be: Direita\nLeft is the only one that is correct, and is Esquerda\nBUT I SUGGEST TO KEEP THE CUBE IN ENGLISH, IN SPITE OF THE FACT THAT THE LANGUAGE IS IN PORTUGUESE, BECAUSE THE TERMS IN PORTUGUESE ARE TO TOO BIG AND EXTEND THE SIZE OF THE CUBE","textCn":"在我把 Creality Printer 的版本升级到 7.2.1.5476 之后，那个让我们能看到物体顶部、底部、前面、后面、左面、右面的立方体也被翻译成了葡萄牙语。 在这次升级之前，当我在上一个版本时，尽管其他所有内容都是葡萄牙语，立方体仍然是英语。 升级之后，翻译显得完全错误： Top 显示为：TOP（英语），而正确的术语是：Topo Front 显示为：Frante，而正确的术语是：Frente Back 显示为：Voltar，而正确的术语应该是：Verso Botton 显示为：Baço，而正确的术语应该是：Base Right 显示为 Direito，而正确的术语应该是：Direita Left 是唯一正确的一个，是 Esquerda 但我建议尽管语言是葡萄牙语，还是把立方体保持为英语，因为葡萄牙语的术语太长了，会把立方体的尺寸撑大","truncated":false,"url":"https://forum.creality.com/t/creality-printer-problem-after-upgrade/53238","productLine":"print","version":"7.2","versionRaw":"7.2.1","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":49,"likeCount":0,"sourceType":"论坛"},{"uid":"9bbe234e472dd72e","date":"2026-08-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"HI COMBO","titleCn":"HI COMBO","originalText":"Problem sending prints via Wi-Fi to Creality Hi Combo\nHi everyone, I’m having a recurring issue when trying to print via Wi-Fi with my Creality Hi Combo using Creality Print .\nWhen I send a file to the printer, the process often gets stuck during the G-code transfer/upload window and doesn’t progress, so the print never starts. Sometimes it works normally, but other times I have to retry the transfer several times before it goes through.\nIt doesn’t seem to be an Internet speed or Wi-Fi signal issue because:\nMy Internet connection is approximately 100 Mbps .\nThe printer is located right next to the router .\nThe PC running Creality Print is connected to the router via Ethernet cable .\nThe issue mainly occurs while transferring the G-code to the printer.\nHas anyone experienced the same problem with the Creality Hi/Hi Combo ?\nIs there any network, router, Creality Print, or printer setting I should check or change to make the G-code transfer more reliable and print over Wi-Fi without having to retry several times?\nAny solutions or settings that worked for you would be greatly appreciated. Thanks!","textCn":"通过 Wi-Fi 向 Creality Hi Combo 发送打印任务时的问题\n大家好，我用 Creality Print 通过 Wi-Fi 在我的 Creality Hi Combo 上打印时，反复遇到一个问题。\n当我向打印机发送文件时，过程常常卡在 G-code 传输/上传窗口，不再继续，所以打印永远不会开始。有时它能正常工作，但其他时候我不得不多次重试传输才能成功。\n这看起来不像是网速或 Wi-Fi 信号的问题，因为：\n我的网络连接大约为 100 Mbps。\n打印机就放在路由器旁边。\n运行 Creality Print 的电脑通过以太网线连接到路由器。\n这个问题主要发生在把 G-code 传输到打印机的过程中。\n有人在 Creality Hi/Hi Combo 上遇到过同样的问题吗？\n有没有什么网络、路由器、Creality Print 或打印机设置是我应该检查或更改的，好让 G-code 传输更可靠，并且无需多次重试就能通过 Wi-Fi 打印？\n任何对你有效的解决方案或设置都非常感谢。谢谢！","truncated":false,"url":"https://forum.creality.com/t/hi-combo/53239","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":1,"views":30,"likeCount":0,"sourceType":"论坛"},{"uid":"0c8a5bc58521929a","date":"2026-08-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K1C: How to run MY custom START_PRINT from the touchscreen in firmware 1.3.5.22?","titleCn":"K1C：在固件 1.3.5.22 中如何从触摸屏运行我自定义的 START_PRINT？","originalText":"Hi everyone,\nI’m trying to use my own custom START_PRINT macro on my Creality K1C instead of the stock routine created by Creality.\nHere is the issue: I created my own script in gcode_macro.cfg and specified it in Orca Slicer. Everything works perfectly as long as I start the print via the Fluidd web interface.\nHowever, if I start a print directly from the printer’s touchscreen, it completely ignores my script. It also ignores the macro in /Helper-Script/KAMP/Start_Print.cfg and just executes some built-in internal routine.\nDoes anyone know what and where needs to be modified so that starting a print from the touchscreen uses the START_PRINT macro defined in the .cfg files, rather than the hardcoded routine hidden inside the firmware?\nAny help or ideas would be appreciated!\nNow, do not take my word for it but I have seen some macro sections in the Creality Slicer (not Orca).\nLet me get some screenshots.\nCreality_Print_PPS\nG-Code_Types\nThat may help you in case you wanted to test some g-code out on the Creality Print. I know what you are asking and I know nothing about Orca for now. I am sorry.\nHi @For_Ward ,\nThanks for the screenshots and reply! …","textCn":"大家好， 我想在我的 Creality K1C 上使用我自己自定义的 START_PRINT 宏，而不是 Creality 创建的出厂例程。 问题在这里：我在 gcode_macro.cfg 中创建了自己的脚本，并在 Orca Slicer 中指定了它。只要我通过 Fluidd 网页界面开始打印，一切就完美运行。 但是，如果我直接从打印机的触摸屏开始打印，它会完全忽略我的脚本。它也会忽略 /Helper-Script/KAMP/Start_Print.cfg 中的宏，只是执行一些内置的内部例程。 有人知道需要修改什么以及在哪里修改，才能让从触摸屏开始打印时使用 .cfg 文件中定义的 START_PRINT 宏，而不是固件里隐藏的硬编码例程吗？ 任何帮助或想法都非常感谢！ 现在，别把我的话当真，但我在 Creality Slicer（不是 Orca）中看到过一些宏部分。 让我弄些截图。 Creality_Print_PPS G-Code_Types 如果你想在 Creality Print 上测试一些 G-code，这可能会对你有帮助。我知道你在问什么，而我现在对 Orca 一无所知。很抱歉。 你好 @For_Ward， 感谢截图和回复！……","truncated":true,"url":"https://forum.creality.com/t/k1c-how-to-run-my-custom-start-print-from-the-touchscreen-in-firmware-1-3-5-22/53242","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"K1C","grade":"有效","replyCount":6,"views":131,"likeCount":1,"sourceType":"论坛"},{"uid":"4ca86fb2ee2a670c","date":"2026-08-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"creality slicer not work on surface 11 pro","titleCn":"Creality 切片软件在 Surface 11 Pro 上无法运行","originalText":"Hello EVERYONE\nI bought a K2 Pro printer\nWhen I download creality slicer not work on surface 11 pro\n, I can’t run the program, and an error message appears.\nI download the last version but not working\nMy device runs win 11\nSnapDragon X Elite Processor\nIs there a solution to this problem?!\nHello ! CrealitySlicer or CrealityPrint ?\nCrealitySlicer is a very old software so it would not be surprising at all\nNowadays, we’re using CrealityPrint instead. As your computer is in Windows 11…It should work though\nOr you may have to use the emulator of microsoft for that : How emulation works on Arm | Microsoft Learn\nThank you for your response but as you mentioned I bought it now and did not use the Thank you for your response but as you mentioned I bought it now and never used the printer before I consider a new user I hope you have explained! the image","textCn":"大家好。我买了一台 K2 Pro 打印机。当我下载 Creality 切片软件时，它在 Surface 11 Pro 上无法运行，我打不开程序，会出现一条错误信息。我下载了最新版本，但还是不能用。我的设备运行 Win 11，SnapDragon X Elite 处理器。这个问题有解决办法吗？！你好！是 CrealitySlicer 还是 CrealityPrint？CrealitySlicer 是非常老的软件，所以出现这种情况一点也不奇怪。现在我们用的都是 CrealityPrint。你的电脑是 Windows 11……不过它应该能运行。或者你可能得用微软的模拟器：How emulation works on Arm | Microsoft Learn。感谢你的回复，但正如你所说，我是刚买的，还没用过打印机，我算是个新用户，希望你能解释一下！图片","truncated":false,"url":"https://forum.creality.com/t/creality-slicer-not-work-on-surface-11-pro/53218","productLine":"print","version":"","versionRaw":"","problemType":"slice","model":"K2 Pro","grade":"有效","replyCount":4,"views":34,"likeCount":2,"sourceType":"论坛"},{"uid":"83491c3a560286db","date":"2026-08-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Issue connecting the printer to Creality Cloud","titleCn":"将打印机连接到 Creality Cloud 的问题","originalText":"My Printer is Hi-COMBO\nAfter updating the app to version 7.3.19, I can no longer access the printer remotely. I have already tried a factory reset, but that didn’t work either. I tried removing the printer, but when scanning the QR code, the app reads it and adds the printer (though it stays offline), while the printer’s display remains stuck on the QR code screen without showing the added account.","textCn":"我的打印机是 Hi-COMBO。把应用更新到 7.3.19 版后，我再也无法远程访问打印机了。我已经试过恢复出厂设置，但也没用。我试过移除打印机，但扫描二维码时，应用能读到并添加打印机（不过它一直显示离线），而打印机的显示屏却始终停在二维码界面，不显示已添加的账号。","truncated":false,"url":"https://forum.creality.com/t/issue-connecting-the-printer-to-creality-cloud/53194","productLine":"cloud","version":"7.3","versionRaw":"7.3.19","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":35,"likeCount":0,"sourceType":"论坛"},{"uid":"c3d874be4a55bc05","date":"2026-08-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"shutting down on old and new software","titleCn":"在旧版和新版软件上都会崩溃关闭","originalText":"Halot box is crashing on supports, and shuts down completely","textCn":"Halot Box 在生成支撑时崩溃，并完全关闭。","truncated":false,"url":"https://forum.creality.com/t/shutting-down-on-old-and-new-software/53127","productLine":"print","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"a3a8b2673d146497","date":"2026-08-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Scammers","titleCn":"骗子","originalText":"Hello everyone I want to warn you about potential problems. Scammers are operating on the Creality Cloud platform and threatening you. Do not click the link and blacklist the scammers’ account. I contacted customer support. They confirmed it was a scam and promised to investigate and block the scammers’ account. Be vigilant!\nScreenshot_20260820_083249_Creality Cloud\nScreenshot_20260820_083257_Creality Cloud\nScreenshot_20260820_083304_Creality Cloud\nThanks ! It seems that scammers are already using the new feature of CrealityCloud\nThese _________ are everywhere.","textCn":"大家好，我想提醒你们潜在的问题。骗子正在 Creality Cloud 平台上活动并威胁你。不要点击链接，并把骗子的账号拉黑。我联系了客服。他们确认这是诈骗，并承诺调查并封禁骗子的账号。保持警惕！ Screenshot_20260820_083249_Creality Cloud Screenshot_20260820_083257_Creality Cloud Screenshot_20260820_083304_Creality Cloud 谢谢！看来骗子已经在利用 CrealityCloud 的新功能了 这些 _________ 到处都是。","truncated":false,"url":"https://forum.creality.com/t/scammers/53121","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":139,"likeCount":5,"sourceType":"论坛"},{"uid":"ff08912447a19b4b","date":"2026-08-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Comprehensive List of ALL printer settings","titleCn":"所有打印机设置的完整列表","originalText":"I have searched and searched for a comprehensive list of descriptions for ALL of the settings available in the Printer Settings window. For instance, in the Extruder tab there is no explanation or description that I can find for extruder offset in the Position section. Does anyone know of a complete list for all the parameters included in all 6 tabs of this window?\nScreenshot 2026-08-14 085459\nWelcome to the community.\nYou may be approaching this from a slightly different direction than necessary. It sounds like you are looking for a comprehensive cheat sheet or user manual covering every setting. I have not found a single document that does that. However, two available tools may be even more useful.\nCreality Print is based on OrcaSlicer, so a good place to start is the OrcaSlicer Wiki. It documents the printer settings, terminology, and features found throughout the software:\nOrcaSlicer Wiki\nOfficial Wiki for OrcaSlicer - A powerful open source slicer for FFF (FDM) 3D Printers\nNote : Creality Print implements only a subset of OrcaSlicer’s features, and Creality sometimes renames standard features. …","textCn":"我搜索了又搜索，想找到打印机设置窗口中所有可用设置的完整说明列表。例如，在挤出机选项卡中，我找不到位置部分中挤出机偏移的任何解释或说明。有谁知道这个窗口全部 6 个选项卡中包含的所有参数的完整列表吗？截图 2026-08-14 085459 欢迎加入社区。你可能从与所需略有不同的方向来处理这个问题。听起来你在寻找一份涵盖每项设置的全面速查表或用户手册。我没有找到一份能做到这一点的单一文档。不过，有两个可用的工具可能更有用。Creality Print 基于 OrcaSlicer，所以一个好的起点是 OrcaSlicer Wiki。它记录了整个软件中的打印机设置、术语和功能：OrcaSlicer Wiki OrcaSlicer 官方 Wiki - 用于 FFF（FDM）3D 打印机的强大开源切片软件 注意：Creality Print 只实现了 OrcaSlicer 功能的一个子集，而且 Creality 有时会重命名标准功能。…","truncated":true,"url":"https://forum.creality.com/t/comprehensive-list-of-all-printer-settings/53028","productLine":"thirdparty","version":"","versionRaw":"","problemType":"ui","model":"K1","grade":"有效","replyCount":3,"views":136,"likeCount":1,"sourceType":"论坛"},{"uid":"3c5cb846d9063405","date":"2026-08-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print background after update","titleCn":"更新后 Creality print 的背景","originalText":"After most recent update to Creality print and my K2 it has changed my background on print to white behind the build plate. This is horrible and ugly, how do i change this back to black?\nMine did that too. I re-installed and it got better. and yes, I agree, the white background was just plain unusable.\n@Gentoo As if the printer heard your question, my Print 7 just flipped to white background when I moved from the device to the prepare tab! The computer is under heavy load. I’m running Civ-7 in the background. It is a graphics pig. That may be a factor. All I had to do was close Print-7 and it reopened with the dark background. Seems like a stability issue.","textCn":"在最近一次更新 Creality print 和我的 K2 之后，它把我的打印背景变成了构建板后面的白色。这太糟糕、太丑了，我怎么把它改回黑色？我的也这样了。我重新安装后就变好了。是的，我同意，白色背景简直没法用。@Gentoo 就好像打印机听到了你的问题一样，当我从设备选项卡切到准备选项卡时，我的 Print 7 就变成了白色背景！电脑负载很重。我在后台运行 Civ-7。它非常吃显卡。那可能是个因素。我所要做的就是关闭 Print-7，它重新打开时就恢复了深色背景。看起来是稳定性问题。","truncated":false,"url":"https://forum.creality.com/t/creality-print-background-after-update/53004","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":5,"views":110,"likeCount":0,"sourceType":"论坛"},{"uid":"39eb55e1a3668be1","date":"2026-08-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Does anyone actually read these and try to help?","titleCn":"真的有人看这些并且试着帮忙吗？","originalText":"upgraded to creality print 7.2 and now basic toolbar items dont work tried previous versions and they still dont work. im guessing since the community is no help and creality is no help ill be learning a new slicer.\n… strange, I use CP 7.2 without any problems… please be more specific which items don’t work so we can check!\nHaven’t had any issues. Are you using PC or Mac? I’m using v7.2.1.5476 Release on windows 11 and it’s been perfect. I would suggest uninstalling any versions you have and reinstalling from a fresh download. I did have an auto update mess up once and break things, but reinstalling fresh solved the issue.","textCn":"升级到 creality print 7.2 之后，基本的工具栏项目就不能用了，试过以前的版本，它们也还是不能用。我猜既然社区帮不上忙，creality 也帮不上忙，那我就去学一个新的切片软件了。……奇怪，我用 CP 7.2 没有任何问题……请说得更具体一些，哪些项目不能用，这样我们才能检查！我没遇到任何问题。你用的是 PC 还是 Mac？我在 windows 11 上用的是 v7.2.1.5476 Release 版，一直很完美。我建议卸载你现有的所有版本，然后从全新下载的安装包重新安装。我确实遇到过一次自动更新搞坏东西的情况，但重新全新安装后问题就解决了。","truncated":false,"url":"https://forum.creality.com/t/does-anyone-actually-read-these-and-try-to-help/52962","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":84,"likeCount":4,"sourceType":"论坛"},{"uid":"69f64e6db4d406c1","date":"2026-08-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"slicing removes part of model","titleCn":"切片后模型的一部分消失","originalText":"all of model is seen in the prepare screen, when sliced part of the model is no longer there and will not print if printed\nshow pictures, i already can tell what is your problem, but plz show images of everything shown on the prepare screen and then in slice screen, posting pictures is easy, just take a screenshoot and paste in the comment, or paste the screenshoot in paint and save as u wish. but without pictures we cant help you\nthanks for responding!!!\ni have attached a before slicing screenshot and a few after slicing screenshots……i have tried repairing the stl, opening it in different slicers, making changes inside the slicer with no luck. The model is lifesize so continously attempting failed prints is getting costly. Lifesize Deadpool BTW\nScreenshot (8)\nScreenshot (12)\nScreenshot (11)","textCn":"在准备界面能看到整个模型，切片后模型的一部分就不见了，如果打印的话就不会打印出来。请展示图片，我已经能看出你的问题是什么了，但请把准备界面和切片界面上显示的所有内容都截图发出来，发图片很容易，截个屏粘贴到评论里，或者把截图粘贴到画图里按你的喜好保存。但没有图片我们帮不了你。感谢回复！！！我附上了一张切片前的截图和几张切片后的截图……我试过修复 stl，用不同的切片软件打开它，在切片软件里做修改，都没有用。这个模型是真人等比例的，所以不断尝试失败的打印越来越费钱。顺带一提，是等身大小的死侍。Screenshot (8) Screenshot (12) Screenshot (11)","truncated":false,"url":"https://forum.creality.com/t/slicing-removes-part-of-model/52954","productLine":"print","version":"","versionRaw":"","problemType":"slice","model":"未标注","grade":"有效","replyCount":6,"views":69,"likeCount":0,"sourceType":"论坛"},{"uid":"809288ec8ce0b4c3","date":"2026-08-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Reporting Low Consumables after update to V7.2.1.5476 MacOS Apple K2 Pro","titleCn":"MacOS Apple K2 Pro 上将 Creality Print 更新到 V7.2.1.5476 后报告耗材不足","originalText":"After updating Creality Print to V7.2.1.5476 MacOS Apple every time I send print I get the following message: \"Low Consumables Balance Reminder The consumables in slot of model K2Pro are insufficient, Please replenish them in time.”\nThe printer is a K2 Pro with the latest firmware. No CFS. I am using non-Creality filaments. I’ve never received this message before the Creality Print update.\nAnother issue is that I am expecting leveling problems I believe since the extruder tip is hitting the top surface of the objects. Not sure if it’s a Creality Print issue or caused by the updated firmware since both were updated recently.\nI hope this will help.\nI get the same message. Using CFS and run Creality Print on Windows. So I guess it is some issue in the new update. But as You said - both firmware end software was updated.\nHaving the same.\nBecause the nozzle is somehow touching the plate—I have been unable to print since then.\nIs there anyone who can share ideas to solve this?","textCn":"将 Creality Print 更新到 V7.2.1.5476 MacOS Apple 后，每次我发送打印都会收到以下消息：“耗材余量不足提醒 型号 K2Pro 的插槽中耗材不足，请及时补充。” 打印机是 K2 Pro，固件是最新的。没有 CFS。我用的是非 Creality 的耗材。在 Creality Print 更新之前我从未收到过这条消息。 另一个问题是我相信是调平问题，因为挤出机喷嘴正在撞击物体的顶面。不确定这是 Creality Print 的问题还是更新固件造成的，因为两者最近都更新了。 我希望这会有帮助。 我也收到同样的消息。用 CFS，并在 Windows 上运行 Creality Print。所以我猜这是新更新中的某个问题。但正如你所说——固件和软件都更新了。 我也一样。 因为喷嘴不知怎么地碰到了热床——从那以后我就一直无法打印。 有人能分享解决的想法吗？","truncated":false,"url":"https://forum.creality.com/t/creality-print-reporting-low-consumables-after-update-to-v7-2-1-5476-macos-apple-k2-pro/52924","productLine":"firmware","version":"","versionRaw":"","problemType":"compat","model":"K2 Pro","grade":"有效","replyCount":3,"views":430,"likeCount":2,"sourceType":"论坛"},{"uid":"80d96e6e07f5d845","date":"2026-08-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Cooling fans","titleCn":"散热风扇","originalText":"Hi,\nI have this setup but the fans keep going to 40%, why?\ni want them at 20% max\ncooler","textCn":"你好，我用了这个设置，但风扇一直跑到 40%，为什么？我希望它们最高只到 20%。cooler","truncated":false,"url":"https://forum.creality.com/t/cooling-fans/52911","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":44,"likeCount":1,"sourceType":"论坛"},{"uid":"e861f420f47b1a8c","date":"2026-08-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Hey You/Way to Go/Thank You","titleCn":"嘿你们/干得好/谢谢","originalText":"Hey…some people and this includes myself here were discussing updating/upgrading the firmware on the K1C. Rightly so, it came through and not a second too late. Thank you!\nI am testing it now. It was a small upgrade but nonetheless, an upgrade and better vision for the camera.\nI am testing now. The camera is spot on. Yes!","textCn":"嘿……有些人，包括我自己，之前在这里讨论过更新/升级 K1C 上的固件。说得很对，它来了，而且来得一点也不算晚。谢谢！我现在正在测试它。这是一次小升级，但无论如何，它是一次升级，而且摄像头的视野更好了。我现在正在测试。摄像头非常准。是的！","truncated":false,"url":"https://forum.creality.com/t/hey-you-way-to-go-thank-you/52904","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":109,"likeCount":3,"sourceType":"论坛"},{"uid":"85e93538cc62c1a4","date":"2026-08-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.0+ supoort X/Y distance ignored","titleCn":"Creality Print 7.0+ 忽略支撑 X/Y 距离","originalText":"I hope I’m not the only one to realize that creality print 7.0 and above ignores the X/Y support distance making supports impossible to remove from objects. The z Distance is fine but the X/Y is ignored even if you increase the values\nGlad it’s not just me ! Whatever I increased it by, support still touching model !\nI’ve been having this issue as well. Not everywhere, but in random places, XY distance will be ignored and it will print support right against the outer surface, making it essentially another wall that is difficult or impossible to remove cleanly.","textCn":"希望我不是唯一一个发现 creality print 7.0 及以上版本会忽略 X/Y 支撑距离的人，这使得支撑无法从对象上移除。Z 距离是正常的，但 X/Y 被忽略，即使你增大数值也一样。很高兴不只是我！无论我把数值调多大，支撑仍然接触模型！我也一直有这个问题。不是所有地方，而是随机位置，XY 距离会被忽略，支撑会直接贴着外表面打印，基本上变成了另一堵墙，很难或根本无法干净地移除。","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-0-supoort-x-y-distance-ignored/52881","productLine":"print","version":"7.0","versionRaw":"7.0","problemType":"ui","model":"未标注","grade":"有效","replyCount":3,"views":59,"likeCount":0,"sourceType":"论坛"},{"uid":"6e7145a827abc80a","date":"2026-08-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Is there a way you can add more colours into your printer software? I don’t mean CFS.","titleCn":"有没有办法在打印机软件里加入更多颜色？我指的不是 CFS。","originalText":"IMG_2544\nIn here colours are very limited what if you wanna Pacific colour that you wanna add to your printer but you can’t because you don’t have that colour in it and what if you wanna add your specific colour that you want to select without selecting a whole different colour that you well know that isn’t that color? because I had to do that a couple times and there are times that I completely forgot to change the filament out for a different color. Why can’t we have a screen? It looks similar to this one or a little bit simpler like this to add to the screen like we have above to select our colour and have virtually little to no error of forgetting to change the filament to make the right colour and yes, I know when you’re painting your 3-D model they have that screen on, but that’s completely different. That’s on your computer not the printer and I tried looking up something of a solution that I had but no results please creality. Can you make it happen?\nIMG_2545\nHello @\nWelcome to the Creality Forum…!\nI think I understand what you’re asking. …","textCn":"IMG_2544 这里的颜色非常有限，如果你想用一种 Pacific 色加进打印机却做不到，因为里面没有那个颜色；如果你想添加你想选择的特定颜色，而不是选一个你明知不是那个颜色的完全不同的颜色，又该怎么办？因为我不得不这样做过几次，而且有几次我完全忘了把耗材换成另一种颜色。为什么我们不能有一个屏幕？看起来和这个类似，或者像上面这个更简单一点的，加到屏幕上来选择我们的颜色，这样忘记更换耗材以得到正确颜色导致的错误几乎为零。是的，我知道你在给 3D 模型上色时他们有那个屏幕，但那完全不一样。那是在你的电脑上，不是打印机上，我也试过查找我那个问题的解决方案但没有结果，拜托 creality。你能实现它吗？IMG_2545 你好 @ 欢迎来到 Creality 论坛……！我想我明白你在问什么。……","truncated":true,"url":"https://forum.creality.com/t/is-there-a-way-you-can-add-more-colours-into-your-printer-software-i-don-t-mean-cfs/52870","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":88,"likeCount":2,"sourceType":"论坛"},{"uid":"d9654d68581a53ef","date":"2026-08-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"It is impossible to start print on K1C after FW update to 1.3.5.22","titleCn":"K1C 升级到固件 1.3.5.22 后无法开始打印","originalText":"I have recently updated firmware on my K1C to version 1.3.5.22. All my previous settings were obviously erased, which is a huge problem for me. I have managed to make 3 prints. After that I can’t upload any file to my printer in any way, that I know\nI’m using “Creality Print” software (yeah, I know, big mistake). I tried “Send G-code” option, “One-click print”, “Multi-machine”. None of it works. What is worse, even direct printing from USB didn’t bring any results, since printer can’t see G-code files on the drive. The camera-issue discussed in other threads is also present, but it is the least of my current issues.\nHow can I restore functioning of my printer in the fastest way possible?\nP.S. I’m shocked with Creality’s QC-team work… if there is one at all\nDowngrade to previous firmware-version (if possible).\nAfter updating my K1, my print head now hits the build plate and the build plate won’t return to the normal position after calibration. I can’t do any prints at all. I also downgraded to the previous firmware and it does not work. I’m waiting on a remedy from customer service now, because the logs say I now have a strain gauge problem, that didn’t exist before this update. …","textCn":"我最近把 K1C 的固件更新到 1.3.5.22 版本。我之前所有的设置显然都被清除了，这对我来说是个大问题。我勉强打印了 3 次。之后我用我知道的任何方式都无法再向打印机上传文件。我用的是“Creality Print”软件（是啊，我知道，这是个巨大的错误）。我试过“Send G-code”选项、“一键打印”、“多机”。全都不行。更糟的是，甚至直接从 USB 打印也没有结果，因为打印机看不到 U 盘上的 G-code 文件。其他帖子里讨论的摄像头问题也存在，但那是我目前问题中最小的。我要怎样才能以最快的速度恢复打印机的工作？附言：Creality 质检团队的工作让我震惊……如果真有这个团队的话。降级到之前的固件版本（如果可能）。更新我的 K1 之后，打印头现在会撞到打印平台，而且校准后平台也回不到正常位置。我完全没法打印。我也降级到了之前的固件，还是不行。我现在在等客服给出解决方案，因为日志显示我现在有应变片问题，而这个更新之前并不存在。……","truncated":true,"url":"https://forum.creality.com/t/it-is-impossible-to-start-print-on-k1c-after-fw-update-to-1-3-5-22/52843","productLine":"firmware","version":"","versionRaw":"","problemType":"crash","model":"K1C","grade":"有效","replyCount":3,"views":134,"likeCount":0,"sourceType":"论坛"},{"uid":"f7d73a6b7efabdef","date":"2026-08-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"The ability to have multiple build plates from different printers visible at the same time","titleCn":"能够同时查看来自不同打印机的多个打印平台","originalText":"I’ve been using Creality Print for a while now, and the one thing that bothers me the most is that I have multiple Creality printers, but they are different models. It’s annoying having to switch back and forth between settings for each build plate. I think it would be awesome to be able to open up multiple build plates from different machines all at the same time—like I could have my Ender-5 max build plate with its settings on the same screen as my K2 Plus, or my K1, or my K1 Max, without having to jump back and forth.\nI just open multiple copies of Creality Print, though it would be nice to perhaps be able to open it once and they have multiple tabs within it for each printer you want to use.","textCn":"我用 Creality Print 已经有一段时间了，最让我困扰的一点是我有多台 Creality 打印机，但它们是不同的型号。为每个打印平台来回切换设置很烦人。我觉得如果能同时打开来自不同机器的多个打印平台就太好了——比如我可以在同一屏幕上同时看到我的 Ender-5 max 打印平台及其设置和我的 K2 Plus、K1 或 K1 Max，而不用来回跳转。我现在只是打开多个 Creality Print 副本，不过如果能只打开一次，并在其中为你想使用的每台打印机提供多个标签页，那就好了。","truncated":false,"url":"https://forum.creality.com/t/the-ability-to-have-multiple-build-plates-from-different-printers-visible-at-the-same-time/52826","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":2,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"7c2d8dde5825c7e9","date":"2026-08-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Elephant's Foot and Brim Don't Play Nice Together","titleCn":"象腿与边缘不能好好配合","originalText":"When adding a brim, I noticed that the elephant’s foot compensation caused the brim to disconnect from the first layer of the model.\nAs a workaround I had to turn the brim-object-gap to 0 and slowly turn down the elephant’s foot compensation till it connected with the brim.\nExpected behavior is the brim inner distance starts from the elephant’s foot compensated perimeter instead of strictly the model’s.\nDepending on the part to print I add a chamfer of 0.5mm tot the bottom, then I don’t have to compensate for elephant foot… adding a chamfer isn’t always possible, but I also don’t need a brim all the time (99,9% of my prints are without!).","textCn":"添加边缘时，我注意到象腿补偿导致边缘与模型的第 1 层脱开。作为变通，我只能把边缘-物体间隙设为 0，然后慢慢降低象腿补偿，直到它与边缘连上。预期的行为是边缘的内侧距离从经过象腿补偿的外周长开始，而不是严格从模型的周长开始。根据要打印的零件，我会在底部加 0.5mm 的倒角，这样就不必补偿象腿……加倒角并不总是可行，但我也不是总需要边缘（我 99,9% 的打印都不用！）。","truncated":false,"url":"https://forum.creality.com/t/elephants-foot-and-brim-dont-play-nice-together/52835","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":2,"views":31,"likeCount":1,"sourceType":"论坛"},{"uid":"189ccb0c8ae8a164","date":"2026-08-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print and material index","titleCn":"Creality Print 与材料索引","originalText":"Creality Print and material index","textCn":"Creality Print 与材料索引","truncated":false,"url":"https://forum.creality.com/t/creality-print-and-material-index/52827","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"ad0506793c1edf8b","date":"2026-08-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Software installation error","titleCn":"软件安装错误","originalText":"hi i tried to install creality scanner software on my surface it wont install and shows me this error\nthis is my system info:\nProcessor Snapdragon(R) X 12-core X1E80100 @ 3.40 GHz (3.42 GHz)\nInstalled RAM 16.0 GB (15.6 GB usable)\nScreenshot 2026-08-02 144410\nSystem type 64-bit operating system, ARM-based processor\n… it seems that the software is not compatible with Windows for ARM-processor…","textCn":"你好，我尝试在我的 Surface 上安装 Creality 扫描仪软件，但装不上，并显示这个错误 这是我的系统信息：处理器 Snapdragon(R) X 12 核 X1E80100 @ 3.40 GHz（3.42 GHz）已安装内存 16.0 GB（15.6 GB 可用）截图 2026-08-02 144410 系统类型 64 位操作系统，基于 ARM 的处理器 …看起来该软件不兼容面向 ARM 处理器的 Windows…","truncated":false,"url":"https://forum.creality.com/t/software-installation-error/52806","productLine":"print","version":"12.3","versionRaw":"12.3","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":52,"likeCount":0,"sourceType":"论坛"},{"uid":"9408b7d7c26a8b1e","date":"2026-08-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"It would be nice to set a display name for a printer","titleCn":"能给打印机设置一个显示名称就好了","originalText":"It would be nice to set a display name for a printer","textCn":"能给打印机设置一个显示名称就好了","truncated":false,"url":"https://forum.creality.com/t/it-would-be-nice-to-set-a-display-name-for-a-printer/52803","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":9,"views":73,"likeCount":4,"sourceType":"论坛"},{"uid":"709d3160f470261e","date":"2026-08-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Painted fuzzy skin not working 7.x","titleCn":"7.x 中绘制的绒毛表皮不生效","originalText":"I tried to make some fuzzy skin samples, but no fuzzy skin. I’m not sure where I went wrong. The .3MF is attached. The print had 3 objects with different types of fuzzy skin. Can you only have one type? There is one comment in the roll-over help I did not fine, it said:\nArachne?!?! what is that? I’m sure it is a a setting somewhere, but I’ve never run across it.\nfuzzy skin tests.3mf ( )\nIt does work. Arachne is the wall generator type - see the screenshot. Arachne works better for texture and curves than classic.\nThank You. I’ll give it a try with athe Arachine setting.","textCn":"我尝试做一些绒毛表皮样品，但没有出现绒毛表皮。我不确定哪里弄错了。附上了 .3MF 文件。这次打印有 3 个物体，分别用了不同类型的绒毛表皮。是不是只能有一种类型？悬停帮助里有一条注释我没看懂，它说： Arachne？！？！那是什么？我确定它是某个地方的设置，但我从没碰到过。 fuzzy skin tests.3mf（ ） 它确实有效。Arachne 是墙体生成器类型——见截图。Arachne 在纹理和曲线上比 classic 效果更好。 谢谢。我会用 Arachine 这个设置试一下。","truncated":false,"url":"https://forum.creality.com/t/painted-fuzzy-skin-not-working-7-x/52790","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":7,"views":87,"likeCount":4,"sourceType":"论坛"},{"uid":"f8c421d413c39847","date":"2026-08-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Blocking supportsin hidden areas","titleCn":"在看不见的区域阻挡支撑","originalText":"I’m on Creality Print 7.2 and I have a model that needs supports, but I need to block area where I don’t want supports. The problem is that I can’t see it to block it. How can I block supports to an interior area?\n2 ways:\nUse paint on supports to just put them where you want them. You can right click to paint with red that blocks supports in that area too. Make sure you choose (manual) from the support type drop down.\nUse a support blocker. Select the model, right click on it, add support blocker. Move and resize the blocker where you need it. Using this one, leave it on (auto) from the support type so it will generate supports everywhere else. This way is better if you have a large area you want to not have supports.\nThe problem is that I can’t see the support area to paint over inside the figure no matter how I rotate it. it’s blocked from vision.. Is there a way to temporarily split the object so I can see the area I want to paint?","textCn":"我用的是 Creality Print 7.2，我有一个需要支撑的模型，但我需要阻挡掉不想加支撑的区域。问题是我看不到它，没法阻挡。我要怎么对内部区域阻挡支撑？ 两种方法： 使用绘制支撑，只把支撑放在你想要的地方。你可以右键点击用红色绘制，那也会在该区域阻挡支撑。确保你在支撑类型下拉菜单中选择（手动）。 使用支撑阻挡器。选中模型，右键点击它，添加支撑阻挡器。把阻挡器移动并调整大小到你需要的部位。用这个的话，支撑类型保持（自动），这样它会在其他所有地方生成支撑。如果你有一大片不想要支撑的区域，这个方式更好。 问题是无论我怎么旋转，我都看不到图形内部的支撑区域来绘制覆盖它。它被遮住了……有没有办法临时把物体拆分，好让我看到想绘制的区域？","truncated":false,"url":"https://forum.creality.com/t/blocking-supportsin-hidden-areas/52788","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":66,"likeCount":0,"sourceType":"论坛"},{"uid":"6d0d3adf4c020680","date":"2026-08-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print 7.205226 bug with device select (multiple printers online)","titleCn":"Creality Print 7.205226 设备选择的 bug（多台打印机在线）","originalText":"The printers show up in the ‘home’ bar under device.\nWhen I select the printer in position 2 and click Prepare, I loose my data that was set for that printer.\nThe previous CrealityPrint did not do this.\nDan Sokol","textCn":"打印机会显示在 device 下的“home”栏里。当我选中第 2 个位置的打印机并点击 Prepare 时，我为那台打印机设置的数据就丢失了。之前的 CrealityPrint 没有这个问题。Dan Sokol","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-205226-bug-with-device-select-multiple-printers-online/52787","productLine":"print","version":"7","versionRaw":"7","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":26,"likeCount":0,"sourceType":"论坛"},{"uid":"4fd4657de02e9c65","date":"2026-07-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"my filament of any kind is loading up on the nozzle and it isn't printing smoothly why? is anyone else having problems since the update","titleCn":"不管什么耗材都会堆积在喷嘴上，打印不顺畅，为什么？更新后还有其他人遇到问题吗","originalText":"Either the filament is loading up through and around the nozzle or it has terrible print quality\nWhich printer, what type of filament and what settings do you use?\nAnd are you sure what you try to print is placed on the bed and not hoovering?","textCn":"要么耗材在喷嘴内部和周围堆积，要么打印质量极差 你用的是哪台打印机、什么类型的耗材、什么设置？ 还有，你确定你要打印的东西是放在热床上的，而不是悬空的吗？","truncated":false,"url":"https://forum.creality.com/t/my-filament-of-any-kind-is-loading-up-on-the-nozzle-and-it-isnt-printing-smoothly-why-is-anyone-else-having-problems-since-the-update/52755","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":2,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"06f636db837251d0","date":"2026-07-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3D Printer Files | 3MF File | Box Storage - 90x150x50 | Creality Cloud","titleCn":"3D 打印文件 | 3MF 文件 | 收纳盒 - 90x150x50 | Creality Cloud","originalText":"I saw this container and instantly thought, it has to be done in two colors. So happy with this result.\nAll credit to OfficineCasperLAB\ncmp\ncrealitymaker\n3D Printer Files | 3MF File | Box Storage - 90x150x50 | Creality Cloud\n📦 Object Storage Box 90x150x50 - Practical and Compact Organization 🛠️ This object storage box measuring 90x150x50 mm is the ideal solution for keeping small components, small parts, desk accessories or maker tools in order. The simple and...\nIMG_20260731_043812\n{\"src\":\"","textCn":"我看到这个容器，立刻觉得它必须用两种颜色来做。对结果非常满意。一切归功于 OfficineCasperLAB cmp crealitymaker 3D 打印文件 | 3MF 文件 | 收纳盒 - 90x150x50 | Creality Cloud 物品收纳盒 90x150x50 - 实用紧凑的收纳 这个尺寸为 90x150x50 mm 的物品收纳盒是保持小零件、小部件、桌面配件或创客工具井井有条的理想方案。简单的…… IMG_20260731_043812","truncated":false,"url":"https://forum.creality.com/t/3d-printer-files-3mf-file-box-storage-90x150x50-creality-cloud/52759","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":113,"likeCount":1,"sourceType":"论坛"},{"uid":"b0d829a71652cb89","date":"2026-07-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"What Do You Use to Organize Your 3D Print Files?","titleCn":"你用什么来整理你的 3D 打印文件？","originalText":"I’ve collected a lot of STL and other 3D printing files over the years, and I’m looking for a better way to organize, search, and preview them.\nCurrently, I use Windows File Explorer with the Microsoft PowerToys add-on to display STL thumbnails. It kind of works, but it’s a little slow. I’m wondering what other systems or programs you guys are using, whether free or paid.\nA few I’ve read about include:\nManyfold\nF3D\nPapa’s Best STL Thumbnails\nSTL Library\nWhat do you use to manage your 3D print file collection? I’d especially like something that can quickly display previews and organize files using folders, tags, categories, or searchable descriptions.\nPlease share what you use, what you like or dislike about it, and whether you think it is worth the cost if it’s not free.\nThanks for any ideas…\nGreat topic!\nI see these as two different solutions. Fortunately, I was able to preserve an existing installation of the now-discontinued 3D Builder, along with the working File Explorer thumbnail support on that machine. Microsoft ended support for 3D Builder and removed it from the Microsoft Store in July 2024. …","textCn":"这些年我收集了很多 STL 和其他 3D 打印文件，我在寻找更好的方式来整理、搜索和预览它们。 目前我用 Windows 文件资源管理器配合 Microsoft PowerToys 插件来显示 STL 缩略图。它勉强能用，但有点慢。我想知道你们在用什么其他系统或程序，免费的还是付费的。 我读到过的有几个： Manyfold F3D Papa's Best STL Thumbnails STL Library 你用什么来管理你的 3D 打印文件收藏？我特别想要一个能快速显示预览、并且能用文件夹、标签、分类或可搜索描述来整理文件的东西。 请分享你用的是什么、你喜欢或不喜欢它什么，以及如果它不免费，你觉得是否值这个价。 感谢任何建议…… 很好的话题！ 我认为这是两种不同的解决方案。幸运的是，我保留了一台机器上现已停产的 3D Builder 的现有安装，以及那台机器上可用的文件资源管理器缩略图支持。微软于 2024 年 7 月终止了对 3D Builder 的支持，并将其从 Microsoft Store 中移除。……","truncated":true,"url":"https://forum.creality.com/t/what-do-you-use-to-organize-your-3d-print-files/52665","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":97,"likeCount":1,"sourceType":"论坛"},{"uid":"500ac0811ed57e6e","date":"2026-07-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"[SOLVED] K1C Firmware 1.3.5.22 - Internal Camera Working Again in Mainsail/Fluidd","titleCn":"[已解决] K1C 固件 1.3.5.22 - 内置摄像头在 Mainsail/Fluidd 中恢复正常","originalText":"After spending several hours troubleshooting this together with ChatGPT, I finally found a solution that works on my K1C running firmware 1.3.5.22 with the new camera hardware .\nI hope this saves someone else a lot of time.\nSymptoms\nAfter updating to 1.3.5.22 :\nCamera still works in Creality Print\nAI detection still works\nCamera disappears from Mainsail/Fluidd\nCamera Settings Control cannot be installed (“not compatible with the new hardware version”)\n/webcam/?action=stream no longer works\nNo mjpg_streamer service is running\nWhat I found\nThe firmware no longer streams directly from the UVC device.\nInstead, Creality uses:\ncam_app\nwhich writes camera frames into shared memory:\n/dev/shm/camera_main\nThe existing input_uvc.so method is no longer usable.\nTrying to start MJPG Streamer with input_uvc.so results in:\nundefined symbol: parse_resolution_opt\nThe correct plugin is actually:\ninput_memfd.so\nWhy this works :\nBased on the behavior observed during troubleshooting, the firmware update appears to have changed the camera pipeline rather than simply blocking MJPEG access. …","textCn":"在跟 ChatGPT 一起花了几个小时排查这个问题后，我终于找到了一个在我运行固件 1.3.5.22、配备新摄像头硬件的 K1C 上可行的解决方案。 希望这能替别人省下大量时间。 症状 更新到 1.3.5.22 之后： 摄像头在 Creality Print 里仍然可用 AI 检测仍然可用 摄像头从 Mainsail/Fluidd 中消失 摄像头设置控制无法安装（“不兼容新硬件版本”） /webcam/?action=stream 不再工作 没有 mjpg_streamer 服务在运行 我的发现 固件不再直接从 UVC 设备推流。 取而代之，Creality 使用了： cam_app 它把摄像头帧写入共享内存： /dev/shm/camera_main 现有的 input_uvc.so 方法不再可用。 尝试用 input_uvc.so 启动 MJPG Streamer 会得到： undefined symbol: parse_resolution_opt 正确的插件实际上是： input_memfd.so 为什么这有效： 根据排查过程中观察到的行为，这次固件更新似乎是改变了摄像头管线，而不是简单地阻止 MJPEG 访问。…","truncated":true,"url":"https://forum.creality.com/t/solved-k1c-firmware-1-3-5-22-internal-camera-working-again-in-mainsail-fluidd/52668","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":22,"views":5754,"likeCount":21,"sourceType":"论坛"},{"uid":"e96fac401324a282","date":"2026-07-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How to select filament to use from CFS???","titleCn":"如何从 CFS 中选择要使用的耗材？？？","originalText":"I want to believe this is easy but I cannot figure out how to select a filament in the CFS to print. I have four (4) filaments loaded and regardless of what I do it only wants to use the filament in Position 1. I want to use Position 4. HELP!!\nAlso, Positions 3 and 4 contain the same filament. When I try to map them to auto select if one runs out, I get a notification saying it can’t map them to auto. I’ve checked and their settings are identical. Any ideas? They are generic ABS filaments, not Creality brand.\nThanks for any help!\nJohn\nScreenshot 2026-07-26 143457\nWhere are you getting the notification about the inability to map to auto select?\nOn the printer or in your Creality Print software?\nTake a screenshot and post it here so we can help you.\nThanks. Was able to finally select the correct filament to print! They could have documented that somewhere!\nFollowing are the pictures. These two MatterHacker reels have no RFID as far as I know.\n20260726_132550\n20260726_132019\n20260726_132044","textCn":"我想相信这很简单，但我搞不懂如何在 CFS 中选择耗材来打印。我装了四（4）种耗材，无论我做什么，它都只想使用位置 1 的耗材。我想使用位置 4。求助！！另外，位置 3 和 4 装有相同的耗材。当我尝试将它们映射为在其中一种用完时自动选择时，我收到通知说无法将它们映射为自动。我检查过，它们的设置完全相同。有什么想法吗？它们是通用 ABS 耗材，不是 Creality 品牌。感谢任何帮助！John 截图 2026-07-26 143457 你是在哪里收到无法映射为自动选择的通知的？在打印机上还是在你的 Creality Print 软件中？截个图发到这里，这样我们才能帮你。谢谢。终于能够选择正确的耗材来打印了！他们本应该在某处记录这一点！以下是图片。这两卷 MatterHacker 据我所知没有 RFID。20260726_132550 20260726_132019 20260726_132044","truncated":false,"url":"https://forum.creality.com/t/how-to-select-filament-to-use-from-cfs/52651","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":163,"likeCount":0,"sourceType":"论坛"},{"uid":"b0a5772eb994734f","date":"2026-07-25","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"creality print 7.2 so log","titleCn":"Creality Print 7.2 如此卡顿","originalText":"after update with 7.2 everything is fine. But now it suddenly log. i cant create projects. it take so much time to move or do the thing\ncheck your pc and make sure you are not low on disk space. If your windows drive is full, it will cause issues.","textCn":"更新到 7.2 后一切正常。但现在它突然卡顿。我无法创建项目。移动或做事情要花很长时间。检查你的电脑，确保磁盘空间不足。如果你的 Windows 系统盘满了，就会导致问题。","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-2-so-log/52639","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":48,"likeCount":0,"sourceType":"论坛"},{"uid":"40aa78307695a18d","date":"2026-07-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Is there a good tutorial on how to do simple booleans (remove intersection of 2 parts) in Creality 7?","titleCn":"Creality 7 里有关于如何做简单布尔运算（去除 2 个零件的相交部分）的好教程吗？","originalText":"the title says it all….\nany links or other help gratefully accepted….\nLJ\nSince what constitutes a “good tutorial” is subjective, let me suggest another approach.\nI would not spend much time looking for a tutorial specifically for Creality Print. Its interfaces and workflows are substantially similar to those of OrcaSlicer and Bambu Studio, so most Boolean-function tutorials for either program should transfer readily to Creality Print.\nCreality Print 7.0 was forked from OrcaSlicer, which was forked from Bambu Studio, which was based on PrusaSlicer. By comparison, Creality Print is relatively new in an otherwise mature slicer market.\nSpeaking as an early adopter of both Bambu Studio and OrcaSlicer, I consider Creality Print a poor fork. Rather than improving the established interface, Creality appears to have rearranged and altered it largely for the sake of making the program look different. The result is less intuitive without offering much meaningful innovation in return.\nVery little in this corner of the 3D-printing world is developed in complete isolation. Most slicers combine features and ideas that originated in other projects. …","textCn":"标题已经说明一切…… 任何链接或其他帮助都感激不尽…… LJ 由于“好教程”的定义是主观的，我建议换一种思路。 我不会花太多时间专门去找 Creality Print 的教程。它的界面和工作流与 OrcaSlicer 和 Bambu Studio 大体相似，所以这两个程序中大多数布尔功能教程应该都能直接套用到 Creality Print。 Creality Print 7.0 是从 OrcaSlicer 分叉出来的，而 OrcaSlicer 又是从 Bambu Studio 分叉出来的，后者基于 PrusaSlicer。相比之下，在一个本就成熟的切片软件市场里，Creality Print 相对较新。 作为 Bambu Studio 和 OrcaSlicer 的早期使用者，我认为 Creality Print 是一个糟糕的分叉版本。Creality 似乎并没有改进已有的界面，而主要是为了让程序看起来不一样而对其进行了重新排列和改动。结果就是它没那么直观，却没有换来多少有意义的创新。 3D 打印世界的这一角落里，几乎没有什么是完全孤立开发出来的。大多数切片软件都融合了源自其他项目的功能和想法。……","truncated":true,"url":"https://forum.creality.com/t/is-there-a-good-tutorial-on-how-to-do-simple-booleans-remove-intersection-of-2-parts-in-creality-7/52575","productLine":"thirdparty","version":"7.0","versionRaw":"7.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":114,"likeCount":0,"sourceType":"论坛"},{"uid":"bb555d0e604eb5e5","date":"2026-07-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Feature Request: Part Cooling Fan Pre‑Start for Overhangs & Bridges","titleCn":"功能请求：悬垂与桥接的部件冷却风扇预启动","originalText":"Feature Request: Add Part Cooling Fan Pre‑Start\nCreality Print needs a cooling option that lets the part cooling fan turn on before an overhang or bridge begins. Right now, the fan only activates at the moment the overhang starts, which causes curling or sagging on the first few millimeters.\nOther brands already support this behavior, and it makes a noticeable difference.\nPlease add: “Fan pre‑start distance” (mm) and or “Fan pre‑start time” (s)\nThis would greatly improve PETG and TPU print quality.","textCn":"功能请求：添加部件冷却风扇预启动。Creality Print 需要一个冷却选项，让部件冷却风扇在悬垂或桥接开始之前就开启。现在，风扇只在悬垂开始的那一刻才启动，这会导致最初几毫米出现翘边或下垂。其他品牌已经支持这一行为，而且效果差异明显。请添加：“风扇预启动距离”（mm）和/或“风扇预启动时间”（s）。这将大大改善 PETG 和 TPU 的打印质量。","truncated":false,"url":"https://forum.creality.com/t/feature-request-part-cooling-fan-pre-start-for-overhangs-bridges/52527","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":20,"likeCount":0,"sourceType":"论坛"},{"uid":"9d90b40aea7ff82b","date":"2026-07-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Web editor never loads — the create-model / editType=editModel route renders blank, embedded or
