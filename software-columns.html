 Creative: You can paint these, add textures, or even 3D print your own ears, faces, and accessories. Let your imagination run wild! …","textCn":"设计理念 这是我迄今为止最喜欢的打印作品！我的目标是挑战 Creality K2 的极限，制作一个巨大的高模型，用到几乎一整卷 1kg 的耗材——全部在一个构建板上完成，零支撑。 通过把三个部件嵌套在一起，我得以最大化利用 K2 的构建体积（260x260x254 mm）。最终组装好的兔子高达 2.17ft（660.4mm）。它用了 917g 耗材，几乎零浪费，同时呈现出巨大的实体存在感。 用途 大型可堆叠兔子兼顾了美学魅力和功能设计。它有趣、可互动的结构可以自定义或重新排列，非常适合作为： 模块化玩具：对孩子来说堆叠玩耍既吸引人又有趣。 奇趣收纳：一种有创意的收纳小物件或玩具的方式。 醒目装饰：儿童房、起居区或创意工作空间的视觉焦点 发挥创意：你可以给它们上色、添加纹理，甚至 3D 打印自己的耳朵、脸和配件。让你的想象力尽情驰骋！…","truncated":true,"url":"https://forum.creality.com/t/maximize-your-print-and-filament-no-supports-no-waste/49842","productLine":"park","version":"","versionRaw":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":4,"views":81,"likeCount":3,"sourceType":"论坛"},{"uid":"f8daae5cba2d3503","date":"2026-03-24","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K Pro Update 1.1.4.1 malfunction (2026-03-23)","titleCn":"K Pro 更新 1.1.4.1 故障（2026-03-23）","originalText":"Finished a print on the K2 Pro and an update popped up. Downloaded the 1.1.4.1 and rebooted. Printer sends the table to the bottom and stops. Nothing but a weird low speed fan noise.\nI did a factory reset and let it do a function check. Everything turned out good and now seems to be functioning normally.\nDid you root the printer and run the script to install options? If yes, you should have reset to factory before updating firmware!\nIf the problem is stil there, try with updating from USB-stick instead of letting the printer download the firmware!","textCn":"在 K2 Pro 上打印完一个模型后弹出了更新。我下载了 1.1.4.1 并重启。打印机把热床送到最底部然后停住，只有奇怪的低速风扇噪音。 我做了一次恢复出厂设置，让它执行功能检查。结果一切都正常，现在似乎运行正常了。 你对打印机做 root 并运行了安装选项的脚本吗？如果是，你在更新固件前应该先恢复出厂设置！ 如果问题仍然存在，试试用 U 盘更新，而不是让打印机下载固件！","truncated":false,"url":"https://forum.creality.com/t/k-pro-update-1-1-4-1-malfunction-2026-03-23/49799","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":2,"views":131,"likeCount":1,"sourceType":"论坛"},{"uid":"6ab01acb20733201","date":"2026-03-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"3D Printer Files | 3MF File | 🍋 Zesty Stack – Lemon Slice Coaster Set |","titleCn":"3D 打印文件 | 3MF 文件 | 🍋 Zesty Stack – 柠檬切片杯垫套装 |","originalText":"3D Printer Files | 3MF File | 🍋 Zesty Stack – Lemon Slice Coaster Set | Creality...\n3D Printer Files | 3MF File | 🍋 Zesty Stack – Lemon Slice Coaster Set |...\nBrighten up your space with a splash of citrus charm! The Zesty Stack is a vibrant 8-piece coaster set inspired by fresh lemon slices, neatly stacked in a sleek holder for easy access. Each coaster delivers a juicy pop of color while protecting your...\nIMG_20260322_151016\nFinished with a glossy UV resin coating, these coasters have a smooth, glass-like shine that enhances the vibrant lemon design while adding extra durability and easy cleaning.\nIMG_20260322_150711\nPerfect for entertaining or everyday use, this set is where functionality meets fun—because even your drinks deserve a little zest!\n{\"src\":\"","textCn":"3D 打印文件 | 3MF 文件 | 🍋 Zesty Stack – 柠檬切片杯垫套装 | Creality...\n3D 打印文件 | 3MF 文件 | 🍋 Zesty Stack – 柠檬切片杯垫套装 |...\n用一抹柑橘魅力点亮你的空间！Zesty Stack 是一套色彩鲜艳的 8 件杯垫套装，灵感来自新鲜柠檬切片，整齐地叠放在一个简洁的支架中，方便取用。每个杯垫都带来饱满多汁的色彩点缀，同时保护你的……\nIMG_20260322_151016\n这些杯垫表面覆有光泽的 UV 树脂涂层，拥有光滑如玻璃般的亮泽，既凸显了鲜艳的柠檬图案，又增加了额外的耐用性并便于清洁。\nIMG_20260322_150711\n无论是招待客人还是日常使用都非常合适，这套杯垫正是功能与趣味的结合——因为连你的饮品也值得一点点柠檬的热情！","truncated":false,"url":"https://forum.creality.com/t/3d-printer-files-3mf-file-zesty-stack-lemon-slice-coaster-set/49774","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":32,"likeCount":0,"sourceType":"论坛"},{"uid":"c8ae35466e3437fe","date":"2026-03-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Home (G28) without heating up","titleCn":"不加热的情况下回零（G28）","originalText":"Printer Creality CR-6 SE, Motherboard: CR-ERA v1.1.0.3.\nMotherboard and screen running code from CF6.1.1-Final-cr6-se-v4.5.3+v1.1.0.3ERA-mb-2024-12-16.zip.\nFor testing purposes I need to send commands to the printer. To set home I issue G28 or G28 X0 Y0.\nWith both commands the printer starts to heat up bed and hotend totally unnecessary.\nHow can I home the printer without the heating?\nHow do you send the command to the printer? A simple G28 shouldn’t result in heating up hotend or bed!\nYes and no. G28 X0 Y0 switches to a heating-up window for some seconds then revert back to normal.\nThe community firmware seems a bit sloppy. Rough-and-ready / quick and dirty programming.","textCn":"打印机 Creality CR-6 SE，主板：CR-ERA v1.1.0.3。主板和屏幕运行的是 CF6.1.1-Final-cr6-se-v4.5.3+v1.1.0.3ERA-mb-2024-12-16.zip 里的代码。为了测试，我需要向打印机发送命令。要回零，我发送 G28 或 G28 X0 Y0。这两个命令都会让打印机完全没必要地开始加热热床和热端。我怎样才能在不加热的情况下回零？你是怎么把命令发给打印机的？一个简单的 G28 不应该导致热端或热床加热！是也不是。G28 X0 Y0 会切换到加热窗口几秒钟，然后恢复正常。这个社区固件似乎有点马虎。粗糙、临时凑合的编程。","truncated":false,"url":"https://forum.creality.com/t/home-g28-without-heating-up/49749","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":55,"likeCount":0,"sourceType":"论坛"},{"uid":"2d7f73148fd01280","date":"2026-03-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"What software is in these pictures","titleCn":"这些图片里是什么软件","originalText":"What software is in these pictures","textCn":"这些图片里是什么软件","truncated":false,"url":"https://forum.creality.com/t/what-software-is-in-these-pictures/49736","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":83,"likeCount":2,"sourceType":"论坛"},{"uid":"5a76ae450b86347e","date":"2026-03-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"OctoPrint.org - Descarga e instalación de OctoPrint","titleCn":"OctoPrint.org - 下载与安装 OctoPrint","originalText":"- Descarga e installing de OctoPri\nnt - Download & Setup OctoPrint","textCn":"- 下载并安装 OctoPrint - 下载与设置 OctoPrint","truncated":false,"url":"https://forum.creality.com/t/octoprint-org-descarga-e-instalacion-de-octoprint/49708","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"08c7d67d628e9640","date":"2026-03-19","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"OctoPrint.org - Descarga e instalación de OctoPrint","titleCn":"OctoPrint.org - 下载并安装 OctoPrint","originalText":"- Descarga e installing de OctoPri\nnt - Download & Setup OctoPrint","textCn":"- 下载并安装 OctoPrint - 下载与设置 OctoPrint","truncated":false,"url":"https://forum.creality.com/t/octoprint-org-descarga-e-instalacion-de-octoprint/49709","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"fd1ec30bbf365332","date":"2026-03-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Gear Bracelet","titleCn":"齿轮手链","originalText":"3D Printer Files | 3MF File | Mechanical Motion Gear Bracelet | Creality Cloud\nThe ConceptTake your love for engineering everywhere you go. This Gear Bracelet is a fusion of industrial style and functional mechanics. Designed with a modular approach, the center gears are printed separately to ensure high-precision teeth and a...\n20260315_140259 (1)","textCn":"3D 打印机文件 | 3MF 文件 | 机械运动齿轮手链 | Creality Cloud 概念：把你的工程热爱带到任何地方。这款齿轮手链是工业风格与功能机械的融合。采用模块化设计，中心齿轮单独打印以确保高精度齿形，以及一个…… 20260315_140259 (1)","truncated":false,"url":"https://forum.creality.com/t/gear-bracelet/49639","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":23,"likeCount":0,"sourceType":"论坛"},{"uid":"a2802a2160f00a22","date":"2026-03-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Hi \"Motion Advance\" setting added by mistake?","titleCn":"Creality Hi \"Motion Advance\" 设置是误加的吗？","originalText":"Hello,\nI was wondering if anyone knew why the latest update (V1.1.0.65) added “Motion Advance” to the Creality Hi. AFAIK the Hi doesn’t have the necessary hardware in the tool head to be able to perform it, along with Creality Print not adding the needed Gcode to files for the printer to even attempt it, resulting in an error( AC0504) from the printer at start of print.\nThey listed it as a feature in the firmware release notes so don’t think it was a mistake. I think it uses the input shaping sensors for additional compensation for VFAs\nweird that they added the feature without proper support from the slicer, hopefully it’ll be addressed in the next update for the slicer","textCn":"你好，我想知道有没有人知道为什么最新更新（V1.1.0.65）给 Creality Hi 加上了「Motion Advance」。据我所知，Hi 的打印头里没有执行它所需的硬件，而且 Creality Print 也没有在文件中加入所需的 G-code 让打印机尝试执行，导致打印开始时打印机报错（AC0504）。他们在固件更新说明里把它列为一项功能，所以我不认为这是失误。我认为它是用输入整形传感器来对 VFA 做额外补偿。奇怪的是他们在切片软件没有适当支持的情况下就加了这个功能，希望切片软件的下一次更新能解决。","truncated":false,"url":"https://forum.creality.com/t/creality-hi-motion-advance-setting-added-by-mistake/49643","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":17,"views":974,"likeCount":8,"sourceType":"论坛"},{"uid":"2ba3af162581b4f6","date":"2026-03-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print does not support CR-6 MAX printers","titleCn":"Creality Print 不支持 CR-6 MAX 打印机","originalText":"The only supported printer is the CR-6 SE, which means I either cannot take advantage of the larger bed area, or I have to configure an entirely custom printer; I should not have to create a standard Creality printer inside Creality’s own software. This also means I cannot add my CR-6 MAX from the Sonic Pad attached to it, because Creality Print doesn’t recognize it.\nPlease add support for the CR-6 MAX to Creality Print.","textCn":"唯一支持的打印机是 CR-6 SE，这意味着我要么无法利用更大的热床面积，要么必须配置一台完全自定义的打印机；我不应该在 Creality 自己的软件里创建一台标准的 Creality 打印机。这也意味着我无法通过连接在 CR-6 MAX 上的 Sonic Pad 添加它，因为 Creality Print 不识别它。请为 Creality Print 添加对 CR-6 MAX 的支持。","truncated":false,"url":"https://forum.creality.com/t/creality-print-does-not-support-cr-6-max-printers/49611","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":54,"likeCount":1,"sourceType":"论坛"},{"uid":"8c81bf825006ebce","date":"2026-03-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Modifiers effect on infill and walls","titleCn":"修改器对填充和墙的影响","originalText":"I have been experiencing issues using modifiers to locally alter infill. Wall thickness seems to behave exactly as expected, however infill on the modifier appears to affect the entire object, even outside the modifier.\nstep_01\nI create an object and set it to 5% infill, 2 walls globally\nstep_02\nmodel is set to 5% infill and 2 walls at the object level\nstep_03\nModifier at the object level is set to 50% infill and 10 walls\nstep_04\nafter slicing, the entire model is %50 infill, however the wall loops setting is respected. I would have expected within the modifier to be 50% infill and 5% outside the modifier?\nDid I use the modifier/settings incorrectly, or is this the expected behavior (if so, what is the infill setting on the modifier useful for?\nWhat have you selected on the left side where the different objects show while you changed the per object settings? Was the main object accidentally selected?\nI don’t think I selected the wrong objects. The white guides indicate what is selected on the plate I thought?","textCn":"我在使用修改器局部更改填充时遇到了问题。墙厚似乎完全按预期表现，但修改器上的填充似乎影响整个对象，甚至修改器之外。step_01 我创建一个对象，全局设置为 5% 填充、2 层墙。step_02 模型在对象级别设置为 5% 填充和 2 层墙。step_03 对象级别的修改器设置为 50% 填充和 10 层墙。step_04 切片后，整个模型都是 50% 填充，但墙环设置被正确遵循。我本以为修改器内是 50% 填充，修改器外是 5%？是我错误地使用了修改器/设置，还是这是预期行为（如果是，修改器上的填充设置有什么用？）。当你更改逐对象设置时，左侧显示不同对象的地方你选了什么？是不是不小心选中了主对象？我认为我没有选错对象。我以为白色引导线表示打印板上选中的是什么？","truncated":false,"url":"https://forum.creality.com/t/modifiers-effect-on-infill-and-walls/49563","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":114,"likeCount":1,"sourceType":"论坛"},{"uid":"1d7cb3410aa6115a","date":"2026-03-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"BUG_CrealityPrint_V_7.0_Duplicated_Send_Window","titleCn":"BUG_CrealityPrint_V_7.0_重复的发送窗口","originalText":"Hello,\nI found a bug in Creality Print 7.0 .\nIssue:\nWhen I click “Send Print” , two separate windows open for sending the print job instead of just one.\nSystem information:\nOS: Windows 11\nSoftware: Creality Print 7.0\nVersion: Latest updated version\nExpected behavior:\nClicking “Send Print” should open only one send-print window.\nActual behavior:\nClicking “Send Print” opens two windows. See attached image.\nSteps to reproduce:\nOpen Creality Print 7.0\nPrepare a model for printing\nClick “Send Print”\nTwo send-print windows appear\nNotes:\nThis started happening after the latest update.\nThank you.\nHi! I am using same OS and Creality Print version but did not get this problem. You can contact Creality Support to send info about this issue. I hope it will be repaired soon! Here’s the link to find contact to the Creality support - you can use chat for example - Creality Aftersales\nhaha, so it is not a feature, i was wondering why there is a secondary window, that allows me to turn off/on calibration, despite the printer already printing stuff.","textCn":"你好，我在 Creality Print 7.0 里发现了一个 bug。问题：当我点击“Send Print”时，会打开两个独立的窗口来发送打印任务，而不是一个。系统信息：操作系统：Windows 11；软件：Creality Print 7.0；版本：最新更新版本。预期行为：点击“Send Print”应该只打开一个发送打印窗口。实际行为：点击“Send Print”会打开两个窗口。见附图。复现步骤：打开 Creality Print 7.0；准备一个用于打印的模型；点击“Send Print”；出现两个发送打印窗口。备注：这个问题是在最新更新之后开始出现的。谢谢。你好！我用的是同样的操作系统和 Creality Print 版本，但没有遇到这个问题。你可以联系 Creality 支持把这个问题的信息发给他们。我希望它能尽快修好！这里是找到 Creality 支持联系方式的链接——比如可以用聊天——Creality Aftersales。哈哈，所以这不是功能，我还在纳闷为什么会有第二个窗口，让我能开/关校准，尽管打印机已经在打印东西了。","truncated":false,"url":"https://forum.creality.com/t/bug-crealityprint-v-7-0-duplicated-send-window/49573","productLine":"print","version":"7.0","versionRaw":"7.0","problemType":"compat","model":"未标注","grade":"有效","replyCount":4,"views":86,"likeCount":1,"sourceType":"论坛"},{"uid":"fbe447ca2bd3f6e0","date":"2026-03-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Slicer is not working properly HELP!","titleCn":"切片软件不能正常工作 求助！","originalText":"My slicer is all of a sudden not doing as well as it has. I have tried uninstalling and reinstalling, light mode, I have downgraded to V5 and still does not cut correctly. As you can see from the pics The marker protruding is not there. it has the cup and the letters but cuts off part of the marker. Has anyone seen this before and do you know the fix.\nCreality2\ncreality 1\n@3Doober welcome to the forum Can you download and try to slice this exact model in Orca Slicer?\nOrca Slicer\nOrca Slicer » 3D Printing Slicer [Download Now]\nDownload the latest version of Orca Slicer for free to prepare 3D models for printing. Get fine-tuned prints with Ocra's calibration tools and AI algorithm.\nLet me know if it slices correctly or if the issue still persists. This will allow us to narrow down on whether the issue is related to a software bug in Creality Print or if it’s caused by the model itself having some issue.\nWarmest Regards\nAlawhie\n3Doober:\nowngraded to V5 and still does not cut correctly. As you can see from the pics The marker protruding is not there. it has the cup and the letters but cuts off part of the marker. Has anyone seen this before and do you know the fix.\nHello ! …","textCn":"我的切片软件突然没有以前那么好用了。我试过卸载重装、精简模式，我降级到 V5，仍然不能正确切割。从图片可以看出，突出的标记不见了。它有杯子和字母，但切掉了标记的一部分。有人见过这种情况吗，你知道怎么修吗。Creality2 creality 1 @3Doober 欢迎来到论坛 你能下载并在 Orca Slicer 中尝试切片这个确切的模型吗？Orca Slicer Orca Slicer » 3D 打印切片软件 [立即下载] 免费下载最新版本的 Orca Slicer 来为打印准备 3D 模型。使用 Ocra 的校准工具和 AI 算法获得精细调整的打印。让我知道它是否能正确切片，或者问题是否仍然存在。这将使我们能够缩小范围，确定问题是与 Creality Print 中的软件 bug 有关，还是由模型本身存在某些问题引起的。此致 Alawhie 3Doober：降级到 V5 仍然不能正确切割。从图片可以看出，突出的标记不见了。它有杯子和字母，但切掉了标记的一部分。有人见过这种情况吗，你知道怎么修吗。你好！…","truncated":true,"url":"https://forum.creality.com/t/slicer-is-not-working-properly-help/49501","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":9,"views":196,"likeCount":2,"sourceType":"论坛"},{"uid":"d84f8144a2e12dcb","date":"2026-03-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Filament temperature - silly question","titleCn":"耗材温度——一个傻问题","originalText":"Filament temperature - silly question","textCn":"耗材温度——一个傻问题","truncated":false,"url":"https://forum.creality.com/t/filament-temperature-silly-question/49521","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":64,"likeCount":3,"sourceType":"论坛"},{"uid":"c3e19b6b968a4998","date":"2026-03-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Pink Parade Zoo Biscuit Clicker","titleCn":"粉色巡游动物园饼干按键器","originalText":"Pink Parade Zoo Biscuit Clicker","textCn":"粉色巡游动物园饼干按键器","truncated":false,"url":"https://forum.creality.com/t/pink-parade-zoo-biscuit-clicker/49449","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":3,"views":35,"likeCount":1,"sourceType":"论坛"},{"uid":"7ac06f3526b832b0","date":"2026-03-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"New PythonSCAD functionality: use of colormaps for laser cutting (Creality Falcon-2)","titleCn":"PythonSCAD 新功能：将色图用于激光切割（Creality Falcon-2）","originalText":"New PythonSCAD functionality: use of colormaps for laser cutting (Creality Falcon-2)","textCn":"PythonSCAD 新功能：将色图用于激光切割（Creality Falcon-2）","truncated":false,"url":"https://forum.creality.com/t/new-pythonscad-functionality-use-of-colormaps-for-laser-cutting-creality-falcon-2/49395","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":34,"likeCount":0,"sourceType":"论坛"},{"uid":"647f8ba6946356da","date":"2026-03-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"ZH","title":"Creality Print Windows Webview Installation Failure Guide","titleCn":"Creality Print Windows WebView 安装失败指南","originalText":"WebView installation failure may result in the following scenarios. Take corresponding steps based on the symptoms encountered:\nThe added printer page shows as blank\nIf WebView is not installed or has failed, the Add Printer page in Creality Print may appear blank.\nUninstall existing Edge\nDownload the uninstaller: Releases · ShadowWhisperer/Remove-MS-Edge · GitHub\n(Program source: )\nDownload and unzip the file and run it with administrator permission\nReinstall Microsoft Edge\nRedownload and install Edge browser from Microsoft’s official website: Download Microsoft Edge: Windows, macOS, iOS & Android\nDownload and install Microsoft WebView2\n/microsoftedgewebview2runtimeinstallerx64.exe\nRestart Creality Print\nAfter the Edge installation is complete, restart CrealityPrint，select Yes in the pop-up window, CrealityPrint will be launched automatically after the installation is complete.\nCompatibility issue error\nDownload the registry file and double-click to import it. Then restart CrealityPrint.\n/crealityprint/webview中文/fix_webview.reg\nThis does not seem to work. I have followed the steps. I still get the error that it could not create the data directory. …","textCn":"WebView 安装失败可能导致以下情况。根据遇到的症状采取相应步骤：添加的打印机页面显示为空白 如果未安装 WebView 或安装失败，Creality Print 中的添加打印机页面可能会显示为空白。卸载现有 Edge 下载卸载程序：Releases · ShadowWhisperer/Remove-MS-Edge · GitHub（程序来源：）下载并解压文件，以管理员权限运行 重新安装 Microsoft Edge 从微软官方网站重新下载并安装 Edge 浏览器：下载 Microsoft Edge：Windows、macOS、iOS 和 Android 下载并安装 Microsoft WebView2 /microsoftedgewebview2runtimeinstallerx64.exe 重启 Creality Print  Edge 安装完成后，重启 CrealityPrint，在弹出的窗口中选择“是”，安装完成后 CrealityPrint 将自动启动。兼容性问题错误 下载注册表文件并双击导入。然后重启 CrealityPrint。/crealityprint/webview中文/fix_webview.reg 这似乎不起作用。我已按照步骤操作。我仍然收到无法创建数据目录的错误。…","truncated":true,"url":"https://forum.creality.com/t/creality-print-windows-webview-installation-failure-guide/49343","productLine":"print","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":160,"likeCount":0,"sourceType":"论坛"},{"uid":"de8d852b64423044","date":"2026-03-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"NEED Help Top Surface Layer","titleCn":"需要帮助：顶层表面","originalText":"SP\nHi Everyone, I am trying to print a flat design with name but on the top surface of base it print the text on. How can I smoothen the top surface? because it really give bad surface.\nI’d start with flow rate calibration. Personally, I find the auto calibration as good or than the test pattern and my judgement, and way faster.","textCn":"SP 大家好，我正在尝试打印一个带名字的平面设计，但在底座的顶层表面上会印上文字。我要怎样才能让顶层表面变平滑？因为它确实造成了很差的表面。 我会从流量校准开始。就我个人而言，我觉得自动校准和测试图案加我的判断一样好，而且快得多。","truncated":false,"url":"https://forum.creality.com/t/need-help-top-surface-layer/49318","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"8b4e035a60511a02","date":"2026-03-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Infill anchor settings greyed out in 7.0.1","titleCn":"7.0.1 中填充锚点设置变灰不可用","originalText":"Hi, I’m trying to reinforce the front section of the wing using long infill anchors. The settings for sparse infill anchors are greyed out no matter what I select or do. Any idea what is causing this?\nThis works perfectly in Prusa Slicer, but I still would like to try printing the wing from Crealty Slicer.\ngrafik","textCn":"你好，我正在尝试用长填充锚点加固机翼的前段。无论我选择什么或做什么，稀疏填充锚点的设置都是灰的。有人知道是什么原因造成的吗？ 这在 Prusa Slicer 中完全正常，但我仍然想试试用 Creality 切片软件打印机翼。 grafik","truncated":false,"url":"https://forum.creality.com/t/infill-anchor-settings-greyed-out-in-7-0-1/49320","productLine":"thirdparty","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":32,"likeCount":0,"sourceType":"论坛"},{"uid":"11a241a8b556362d","date":"2026-03-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"I need firmware that creality no longer support","titleCn":"我需要 Creality 已不再支持的固件","originalText":"I am looking for the firmware for a LD 003 where in the world can I get the download file\nWAYBACK MACHINE\nI know but would really like to get it up and running","textCn":"我在找 LD 003 的固件，到底在哪里能拿到下载文件 WAYBACK MACHINE 我知道，但我真的很想让它跑起来","truncated":false,"url":"https://forum.creality.com/t/i-need-firmware-that-creality-no-longer-support/49263","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":58,"likeCount":0,"sourceType":"论坛"},{"uid":"c43f509acbcd982c","date":"2026-03-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Hi - manual filament change","titleCn":"Creality Hi - 手动换料","originalText":"My brother has a Creality Hi without CFS (I have one with CFS).\nThe question is whether it is possible to do multicolor prints with manual filament change ?\nOn my Creality Ender3v3 I can do it with a custom klipper maco, that parks the hotend and automatically makes retract of filament - so one only would have to insert the new color, extrude until the new color is “pure”, and then continue…\nCan a similar approach be used on the Hi ? I cannot see any “park” macro in printer.cfg - that is why I am a bit unsure….\nHi @bipsen Trust you are well. I do not personally have a Creality Hi to test this on, so take this more as an assumption rather than hands on experience.\nSince the Hi runs a modified version of Klipper under Creality OS, in theory there is no reason why manual multicolour prints would not be possible. At its core it is still a single extruder machine unless the CFS is attached, so colour changes should be achievable the same way we do it on other Klipper based printers.\nFrom what I understand, Creality does not include a built in park or M600 macro in the default printer.cfg because they expect colour changes to be handled by the CFS. …","textCn":"我兄弟有一台没有 CFS 的 Creality Hi（我有一台带 CFS 的）。问题是能否通过手动换料进行多色打印？在我的 Creality Ender3v3 上，我可以用自定义的 klipper 宏做到，它会把热端停靠并自动回抽耗材——这样只需插入新颜色，挤出直到新颜色「纯净」，然后继续……在 Hi 上能用类似的方法吗？我在 printer.cfg 里看不到任何「park」宏——所以有点不确定……你好 @bipsen 相信你一切都好。我本人没有 Creality Hi 可以测试，所以请把这当作假设而不是亲身经验。由于 Hi 在 Creality OS 下运行的是修改版的 Klipper，理论上没有理由不能手动多色打印。其核心仍然是一台单挤出机机器，除非连接了 CFS，所以换色应该能像我们在其他基于 Klipper 的打印机上那样实现。据我了解，Creality 没有在默认 printer.cfg 中包含内置的 park 或 M600 宏，因为他们期望换色由 CFS 处理。……","truncated":true,"url":"https://forum.creality.com/t/creality-hi-manual-filament-change/49233","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":5,"views":292,"likeCount":4,"sourceType":"论坛"},{"uid":"898b24da2a348df2","date":"2026-02-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"!!!  best connect SpacePi X4 and VFS on creality K2 Plus !!!","titleCn":"!!! 在 Creality K2 Plus 上连接 SpacePi X4 和 VFS 的最佳方式 !!!","originalText":"Comment, quel personne a une idée.\nHow, which person has an idea?","textCn":"怎么说，有谁有想法。 怎么做，有谁有想法？","truncated":false,"url":"https://forum.creality.com/t/best-connect-spacepi-x4-and-vfs-on-creality-k2-plus/49163","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":25,"likeCount":0,"sourceType":"论坛"},{"uid":"e885d573ccf34d07","date":"2026-02-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Camera Dirty error before launch print since last firmware update 1.1.3.6 on K2 Pro","titleCn":"K2 Pro 上次固件更新到 1.1.3.6 后，开始打印前出现摄像头脏污错误","originalText":"Hi,\nSince the last firmware update on my K2 Pro (1.1.3.6) i have an issue with the new feature “smart light”.\nif my room is in the dark and the light of the printer is turned off (waiting going on by the smart system) and i try to launch a print i have an error “dirty camera”.\nif i turn on manually the light of the printer and aknoledge the error on the printer screen and restart the print, it’s ok.\non my point of view the light don’t turn on automaticaly before the self test of the camera and the system think there is a default because the image on the camera is too dark.\ncan you solve this issue ?\ni’m the only one to have this issue ?\ni know it’s a minor issue but in fact for me it’s completly impossible to use this new cool feature\nThank you for your help\nThank you for the post! I have recently have had the same issue - I turn the light off and then later go to turn it back on and boom there is a problem and this same dirty camera or blocked message comes up. I thought I f’d my device and then I would have to hide from the wife since she bought for me for Christmas!","textCn":"你好，自从我的 K2 Pro 上次固件更新（1.1.3.6）后，我在新功能「智能灯」上遇到了问题。如果我房间是暗的，而打印机的灯是关着的（智能系统正在等待开启），我尝试开始打印时就会收到「dirty camera」错误。如果我手动打开打印机的灯，在打印机屏幕上确认该错误并重新开始打印，就没问题。在我看来，灯没有在摄像头自检之前自动打开，系统认为有故障，因为摄像头图像太暗了。你能解决这个问题吗？只有我有这个问题吗？我知道这是个小问题，但事实上对我来说完全无法使用这个很棒的新功能。谢谢你的帮助。感谢发帖！我最近也遇到了同样的问题——我把灯关掉，然后稍后再打开，砰，就出问题了，出现同样的摄像头脏污或被遮挡的消息。我以为我把设备弄坏了，然后还得躲着老婆，因为这是她买给我的圣诞礼物！","truncated":false,"url":"https://forum.creality.com/t/camera-dirty-error-before-launch-print-since-last-firmware-update-1-1-3-6-on-k2-pro/48935","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":74,"likeCount":1,"sourceType":"论坛"},{"uid":"69b6158600f41523","date":"2026-02-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 6.2.2 for K2 Plus: Invalid Custom G-Code","titleCn":"适用于 K2 Plus 的 Creality Print 6.2.2：自定义 G-Code 无效","originalText":"Creality Print 6.2.2 for K2 Plus: Invalid Custom G-Code","textCn":"适用于 K2 Plus 的 Creality Print 6.2.2：自定义 G-Code 无效","truncated":false,"url":"https://forum.creality.com/t/creality-print-6-2-2-for-k2-plus-invalid-custom-g-code/48936","productLine":"print","version":"6.2","versionRaw":"6.2.2","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":3,"views":245,"likeCount":0,"sourceType":"论坛"},{"uid":"2315ced8415c230f","date":"2026-02-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How is this a Tree Support?","titleCn":"这怎么会是树状支撑？","originalText":"CP version 7.0.1.4212\nI enable Support, select Type = Tree(Auto), Style = Default, and get this:\nNormal(Auto) looks a little more like the normal boxy style supports, but both Tree(Auto) looks like the above. It seems strange to me.\nStyle = Tree(Slim) looks better:\nStyle = Tree(Hybrid) looks very similar to Normal(Auto).\nIs this a bug in CP?","textCn":"CP 版本 7.0.1.4212 我启用了支撑，类型选择 Tree(Auto)，样式选择 Default，然后得到的是这样：Normal(Auto) 看起来更像普通的方正样式支撑，但 Tree(Auto) 二者都像上面那样。我觉得很奇怪。样式 = Tree(Slim) 看起来好一些：样式 = Tree(Hybrid) 看起来和 Normal(Auto) 非常相似。这是 CP 的 bug 吗？","truncated":false,"url":"https://forum.creality.com/t/how-is-this-a-tree-support/48939","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":62,"likeCount":0,"sourceType":"论坛"},{"uid":"c205c2719f802456","date":"2026-02-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"How do you defined the \"excluded bed area\" w/in Creality Print","titleCn":"在 Creality Print 中如何定义“排除热床区域”","originalText":"How do you defined the \"excluded bed area\" w/in Creality Print","textCn":"在 Creality Print 中如何定义“排除热床区域”","truncated":false,"url":"https://forum.creality.com/t/how-do-you-defined-the-excluded-bed-area-w-in-creality-print/48928","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":7,"views":211,"likeCount":0,"sourceType":"论坛"},{"uid":"70f980a6253e3c86","date":"2026-02-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print improvement or suggestion","titleCn":"Creality Print 改进或建议","originalText":"Creality print improvement or suggestion","textCn":"Creality Print 改进或建议","truncated":false,"url":"https://forum.creality.com/t/creality-print-improvement-or-suggestion/48915","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":4,"views":357,"likeCount":1,"sourceType":"论坛"},{"uid":"7a3fa12e94548954","date":"2026-02-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"New firmware V1.1.0.65 released, What is Motion advance?","titleCn":"新固件 V1.1.0.65 发布，什么是 Motion advance？","originalText":"Hello there fellow builders.\nYesterday the Creality Hi firmware CR4NU200360C20_ota_img_V1.1.0.65.img was released, I downloaded manually and installed on my printer.\nNow on the control menu there is a new tab «Print settings» and the only option on it is a toggle switch «Motion Advance», What this new settings means and what it do?\nRegards\nMotion advance is supposed to be a feature to compensate for possible VFAs from what I understand. Not sure how it does it and haven’t really tested it since I don’t have an issue with VFAs on my Hi anyway\nLoriAnneBrown:\nVFAs\nwhat is VFA?","textCn":"各位建造者好。昨天 Creality Hi 固件 CR4NU200360C20_ota_img_V1.1.0.65.img 发布了，我手动下载并安装到了我的打印机上。现在控制菜单里有一个新标签页「打印设置」，上面唯一的选项是一个开关「Motion Advance」，这个新设置是什么意思，它做什么？此致 据我理解，Motion advance 应该是一个用来补偿可能出现的 VFA 的功能。不确定它是怎么做到的，也没有真正测试过，因为我的 Hi 本来就没有 VFA 问题 LoriAnneBrown：VFAs 什么是 VFA？","truncated":false,"url":"https://forum.creality.com/t/new-firmware-v1-1-0-65-released-what-is-motion-advance/48874","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"Creality Hi","grade":"有效","replyCount":6,"views":954,"likeCount":4,"sourceType":"论坛"},{"uid":"82d4c92e5a16d99c","date":"2026-02-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Monotonic Pattern issue","titleCn":"单调模式问题","originalText":"I’m using Creality Print slicer with Top surface pattern set to Monotonic , but the top layer isn’t printing in a clean monotonic pattern. The lines don’t look consistent and the surface finish isn’t smooth.\nIf you want a smooth top layer use ironing…","textCn":"我在使用 Creality Print 切片软件，顶面模式设为单调（Monotonic），但顶层并没有打印出干净的单调模式。线条看起来不一致，表面也不光滑。如果你想要光滑的顶层，就用熨烫……","truncated":false,"url":"https://forum.creality.com/t/monotonic-pattern-issue/48869","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":54,"likeCount":0,"sourceType":"论坛"},{"uid":"9f2e57c63fd36f7c","date":"2026-02-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"moving shapes z axis","titleCn":"移动模型的 Z 轴","originalText":"the shapes move and respond as i expect them to but Z zero seems to be in a space relative to the first object placed.\nI dont understand. can i change that so its always relative to the bed or the UWC?","textCn":"模型移动和响应都符合我的预期，但 Z 零点似乎是相对于放置的第一个对象所在的空间。我不明白。我能改成始终相对于热床或 UWC 吗？","truncated":false,"url":"https://forum.creality.com/t/moving-shapes-z-axis/48847","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":63,"likeCount":0,"sourceType":"论坛"},{"uid":"6d7af220ec37a709","date":"2026-02-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"Crality Print no arranca - Creality Print won't start","titleCn":"Creality Print 无法启动 - Creality Print won't start","originalText":"Hola, tengo el siguiente problema, desde que instalé la version 7 de Crality Print no puedo lograr que arranque se queda en la pantalla de inicio con la leyenda CARGANDO CONFIGURACION y de esa pantalla no pasa.\nAnte este problema intento arrancar versiones anteriores (que antes funcionaban, 5 o 6) y ahora tambien se quedan en la pantalla de incio del programa.\nAgradecere vuestra ayuda, tengo Windows 11 (ya realice una instalación limpia tanto de Windows como de Creality Print) sin éxito.\nAgradeceré vuestra ayuda. Saludos.\nHello, I’m having the following problem: since installing Creality Print version 7, I can’t get it to start. It gets stuck on the “LOADING CONFIGURATION” screen and doesn’t go any further.\nWhen I try to start older versions (which used to work, versions 5 and 6), they also get stuck on the program’s startup screen.\nI would appreciate your help. I have Windows 11 (I’ve already performed a clean installation of both Windows and Creality Print) without success.\nThank you for your help.","textCn":"你好，我遇到以下问题：自从安装了 Creality Print 版本 7，我就无法让它启动，它停留在启动画面，显示“LOADING CONFIGURATION”，无法通过那个画面。 面对这个问题，我尝试启动之前的版本（以前能用的，5 或 6），现在它们也停留在程序的启动画面。 感谢你们的帮助，我用的是 Windows 11（我已经对 Windows 和 Creality Print 都做了干净安装）但没有成功。 感谢你们的帮助。此致。 你好，我遇到以下问题：自从安装 Creality Print 版本 7 后，我无法让它启动。它卡在“LOADING CONFIGURATION”画面上，不再往下走。 当我尝试启动旧版本（以前能用的，版本 5 和 6）时，它们也卡在程序的启动画面上。 感谢你们的帮助。我用的是 Windows 11（我已经对 Windows 和 Creality Print 都做了干净安装），但没有成功。 感谢你们的帮助。","truncated":false,"url":"https://forum.creality.com/t/crality-print-no-arranca-creality-print-wont-start/48833","productLine":"print","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":101,"likeCount":0,"sourceType":"论坛"},{"uid":"36a1c82e3e1e2964","date":"2026-02-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Ender-7 slicer?","titleCn":"Ender-7 的切片软件？","originalText":"I have the following problem:\nNo Ender-7 in 7.0 Creality Print.\nHow am i supposed to print?\nFound the answer: Install Creality Slicer from the Creality Cloud. Make sure its at least build 291 and there it is: Ender-7. would be great if the downloadpage of the ender-7 would point to Creality Slicer and not Creality Print, since Print has no Ender-7…\nCreality Slicer - Creality Slicer Softwares Download","textCn":"我遇到了以下问题：7.0 版 Creality Print 里没有 Ender-7。我该怎么打印？找到答案了：从 Creality Cloud 安装 Creality Slicer。确保它至少是 build 291，然后 Ender-7 就在那里了。如果 Ender-7 的下载页面能指向 Creality Slicer 而不是 Creality Print 就好了，因为 Print 里没有 Ender-7……Creality Slicer - Creality Slicer 软件下载","truncated":false,"url":"https://forum.creality.com/t/ender-7-slicer/48838","productLine":"cloud","version":"7.0","versionRaw":"7.0","problemType":"other","model":"未标注","grade":"有效","replyCount":2,"views":96,"likeCount":0,"sourceType":"论坛"},{"uid":"e3ea1b01fcea63a0","date":"2026-02-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality K2 Chamber Temperature is Incorrect","titleCn":"Creality K2 腔体温度不正确","originalText":"During testing of my retrofit chamber heater, it became obvious that the Chamber Temperature Sensor was not giving a true reading.\nAt a reading of 52 o C the actual temperature was 60 o C\nAt a reading of 35 o C the actual temperature was 40 o C\nI decided it was probably a miss match of thermistor to the configuration so I decided to do a three-point custom calibration to correct the error.\nWhat I found was the\nThe sensor is a match for a EPCOS 100K B57560G104F\nThe sensor is not damaged and is working correctly\nThere is a bug in the Klipper firmware it is not correctly\nTranslating the resistance to temperature on pin PC5\nWhat is a mystery is the Klipper firmware is the same for the K2 & K2 Pro. If the K2 pro is suffering the same error it is no wonder people are struggling to reach 60oC as they would actually be trying to get to over 70oC\nCreality K2 Chamber Temperature Sensor Three Point Calibration Error.pdf ( )\nCould Somone check this out on the K2 Pro\nIt’s easy to do\nFrom cold set the chamber temperature to 50 degrees\nWait until it is up to temperature and stabilised\nRevert back with the bed temperature and the chamber temperature\nThanks\nStill Not Fixed in V1.1.4.1","textCn":"在测试我改装的腔体加热器时，很明显腔体温度传感器没有给出真实读数。 读数为 52 o C 时，实际温度是 60 o C 读数为 35 o C 时，实际温度是 40 o C 我判断这可能是热敏电阻与配置不匹配，所以我决定做一次三点自定义校准来修正误差。 我的发现是 该传感器与 EPCOS 100K B57560G104F 相匹配 传感器没有损坏，工作正常 Klipper 固件里有一个 bug，它在 PC5 引脚上没有正确地把电阻转换为温度 奇怪的是，Klipper 固件对 K2 和 K2 Pro 是相同的。如果 K2 Pro 也在承受同样的误差，难怪人们很难达到 60oC，因为他们实际上是在试图达到 70oC 以上 Creality K2 Chamber Temperature Sensor Three Point Calibration Error.pdf（ ） 有人能在 K2 Pro 上验证一下吗 这很容易做 从冷态开始把腔体温度设为 50 度 等它升到温度并稳定 回复一下热床温度和腔体温度 谢谢 在 V1.1.4.1 里仍未修复","truncated":false,"url":"https://forum.creality.com/t/creality-k2-chamber-temperature-is-incorrect/48806","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"K2 Pro","grade":"有效","replyCount":3,"views":112,"likeCount":1,"sourceType":"论坛"},{"uid":"c407258cd5a7b957","date":"2026-02-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Using cut on an object more than once","titleCn":"对一个对象多次使用切割","originalText":"I’ve got a k2 plus and I’m trying to use the keyed cut function in Creality print 7 on a 14 inch donut shape.\nTo get it small enough to print I need to slice into 3 pie shape pieces. The problem is when it applies the cut it cuts through the other side of the model I don’t want to cut. Anyone have any ideas how to do this in Creality print?\nThanks in advance\nSteve\nHumm, dont think you can do that.\nHi, did a cover 14 inch, cut it in 2 pieces, place one at 45 angles or so and print one at a time.","textCn":"我有一台 K2 Plus，我想在 Creality Print 7 中对一个 14 英寸的甜甜圈形状使用键槽切割功能。 为了让它小到可以打印，我需要把它切成 3 块扇形。问题是应用切割时，它会切穿模型另一侧我不想切的部分。有人在 Creality Print 中知道怎么做吗？ 提前感谢 Steve 嗯，我觉得你做不到。 你好，我做过一个 14 英寸的盖子，把它切成 2 块，把其中一块以大约 45 度角摆放，一次打印一个。","truncated":false,"url":"https://forum.creality.com/t/using-cut-on-an-object-more-than-once/48792","productLine":"print","version":"7","versionRaw":"7","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":4,"views":107,"likeCount":0,"sourceType":"论坛"},{"uid":"53239ae2f0550f33","date":"2026-02-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality App","titleCn":"Creality App","originalText":"I really like the Creality Cloud app but when something happens or the print is finished I just get a notification in the form of a banner. No sound at all. I use an iPhone and have tried other phones and also an iPad but the same thing. Anyone else have this problem?","textCn":"我很喜欢 Creality Cloud App，但当有情况发生或打印完成时，我只收到横幅形式的通知，完全没有声音。我用的是 iPhone，也试过其他手机和 iPad，但情况一样。还有别人遇到这个问题吗？","truncated":false,"url":"https://forum.creality.com/t/creality-app/48754","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":50,"likeCount":0,"sourceType":"论坛"},{"uid":"14897204252afcc3","date":"2026-02-11","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print won't load!","titleCn":"Creality Print 无法加载！","originalText":"Haven’t used my printer for some weeks, and yesterday when I tried to load creality print it won’t load, it hangs on the loading configuration image. Can’t even close it, have to hard reset the pc to get out.\nHave tried the latest version and some older ones. None of them work.\nI’m on windows 11\nTried running as admin, no luck.\nTried to add it in defender as an app not to block, no luck.\nAnyone experienced something like this?\nI have the same problem. I’ve tried installing it on another PC and the same thing happens.\nHola, mismo problema y sin poder encontarle una solucion. Uds. encontraron alguna solucionarlo?","textCn":"我已经几周没用打印机了，昨天我试着加载 Creality Print，它却无法加载，卡在加载配置的界面上。甚至无法关闭它，只能硬重启电脑才能退出。我试过最新版本和一些旧版本，都不行。我用的是 Windows 11。试过以管理员身份运行，不行。试过在 Defender 里把它添加为不阻止的应用，也不行。有人遇到过类似的情况吗？我有同样的问题。我试过在另一台 PC 上安装，也是同样的情况。你好，同样的问题，而且找不到解决办法。你们找到解决办法了吗？","truncated":false,"url":"https://forum.creality.com/t/creality-print-wont-load/48771","productLine":"print","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":8,"views":395,"likeCount":0,"sourceType":"论坛"},{"uid":"e80f376c716b4b32","date":"2026-02-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print","titleCn":"Creality Print","originalText":"Buenas tardes, desde hace un par de actualizaciones no guarda al laminar la temperatura ni la configuración del filamento seleccionado.\nAunque cambie el filamento en la barra superior derecha imprime en una sola configuración.","textCn":"下午好，从最近几次更新之后，切片时不再保存温度，也不保存所选耗材的配置。即使我在右上角的栏里更换耗材，打印时仍然只用一套配置。","truncated":false,"url":"https://forum.creality.com/t/creality-print/48735","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":36,"likeCount":0,"sourceType":"论坛"},{"uid":"b7008314cfa73f3f","date":"2026-02-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"D1 Sermoon software","titleCn":"D1 Sermoon 软件","originalText":"I have Creality D1 Sermoon. I had SD card problem. For solving this issue I want to update software with guidance of Creality Forum. When I try, I didint find software. I ask the online customer service. They share me a link. From this link I download software and update printer. After that when I try the calibration I noticed my axes measurement is different. When I say “auto home” expected to go middle, but goes little left from middle. And when I want to update firmware from micro USB; I cannot update firmware automatically. When I try to manuel want .hex file but my file which downloaded have .bin file. Now my axes is differ and firmware is different from which original come","textCn":"我有一台 Creality D1 Sermoon。我的 SD 卡出了问题。为了解决这个问题，我想按照 Creality 论坛的指导更新软件。当我尝试时，我找不到软件。我问了在线客服，他们分享给我一个链接。我从这个链接下载软件并更新了打印机。之后当我尝试校准，我注意到我的轴测量值不一样了。当我说“自动回零”时，预期是到中间，但它会往中间偏左一点。而当我想通过 micro USB 更新固件时，我无法自动更新固件。当我尝试手动更新时需要 .hex 文件，但我下载的文件是 .bin 文件。现在我的轴不一样了，固件也和原来自带的不同了","truncated":false,"url":"https://forum.creality.com/t/d1-sermoon-software/48712","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":32,"likeCount":0,"sourceType":"论坛"},{"uid":"f9968bcae684a9f0","date":"2026-02-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Stop supports on model from sticking","titleCn":"阻止模型上的支撑粘连","originalText":"I’m running CP 7.0.1.4212 on my K1 and have got the “build-plate-to-model” support values dialed in nicely:\nEnable Support = On\nOn build plate only = Off\nTop Z distance = 0.34\nI’m finding that my supports which sit on the model to support higher extensions stick to the model a bit too much. Are there any properties to control the support bases and how they are printed when the base is on the model?","textCn":"我在 K1 上运行 CP 7.0.1.4212，并且已经把“热床到模型”的支撑参数调得不错：启用支撑 = 开；仅在热床上 = 关；顶部 Z 距离 = 0.34。我发现那些立在模型上、用于支撑更高延伸部分的支撑有点过于粘在模型上。有没有什么属性可以控制支撑底座，以及当底座位于模型上时它们的打印方式？","truncated":false,"url":"https://forum.creality.com/t/stop-supports-on-model-from-sticking/48688","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"9c8ab4e69384e35a","date":"2026-02-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Select face to align to the  build plate","titleCn":"选择要贴合打印平台的面","originalText":"Hi ,\nI am not able to find Select face to align to the build plate option in CrealityPrint_7.0.1.4212_Release.\nIn Cura slicer same feature:-\nHello @FAIZ_HABEEB\nWelcome to the Creality Forum…!\nIs this the one you are asking about? It automatically puts the side you choose down towards the build plate:\nLay-on-Face\nThe one that @FAIZ_HABEEB showed in the photo is the automatic orientation. The one you are showing is the manual one. My experience is that the automatic one works most of the time, but I do occasionally need to use the manual face-align on occasion. The automatic feature is nice, but truth be told, we are still smarter than the machines.\nAlso, for a support at that kind of angle, I strongly recommend using tree or tree-hybrid supports. The “standard” supports are not going to work well at that angle should you choose to print it like that.","textCn":"你好，我在 CrealityPrint_7.0.1.4212_Release 中找不到“选择要贴合打印平台的面”选项。在 Cura 切片软件中同样的功能：- 你好 @FAIZ_HABEEB 欢迎来到 Creality 论坛…！这是你在问的那个吗？它会自动把你选择的那一面朝下贴向打印平台：Lay-on-Face（面朝下放置）@FAIZ_HABEEB 在照片中展示的是自动定向。你展示的是手动的那一个。我的经验是自动的大多数时候有效，但我偶尔确实需要使用手动面对齐。自动功能很好，但说实话，我们仍然比机器更聪明。另外，对于那种角度的支撑，我强烈建议使用树状或树状混合支撑。如果你选择那样打印，“标准”支撑在那种角度下不会很好地工作。","truncated":false,"url":"https://forum.creality.com/t/select-face-to-align-to-the-build-plate/48683","productLine":"thirdparty","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":8,"views":286,"likeCount":0,"sourceType":"论坛"},{"uid":"72ff497082e1887b","date":"2026-02-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"[CRITICAL BUG REPORT] K1 Max 2.3.5.34 + CFS 1.1.3 - Temperature Override & Bed","titleCn":"【严重缺陷报告】K1 Max 2.3.5.34 + CFS 1.1.3 - 温度覆盖与热床","originalText":"Dear Creality Firmware Team,\nI’m reporting critical firmware bugs affecting multi-material printing\n(PETG+PLA) on K1 Max + CFS kit. These issues render the CFS system\nunusable for common PETG body + PLA support interface workflows.\nDevice Information:\nModel: Creality K1 Max + CFS Multi-Color Upgrade Kit\nPrinter Firmware: 2.3.5.34\nCFS Firmware: 1.1.3\nSlicer: Creality Print 7.0\nLocation: Santiago, Chile\nDate: February 08, 2026\nBUG #1: CFS TOOLCHANGE TEMPERATURE OVERRIDE (PETG → PLA / PLA → PETG)\nObserved Behavior:\nPETG configured: 220°C (slicer filament profile + printer filament settings)\nPLA configured: 220°C (support interface)\nDuring T[next_extruder] / CFS toolchange sequence:\nUser G-code: M104 S220 / M109 S220 executed (nozzle reaches 220°C)\nCFS firmware macro IMMEDIATELY overrides to 250°C target during purge/extrusion\nPLA filament extruded at 250°C → heat creep in heatbreak → consistent clogs\nRoot Cause (suspected):\nCFS CHANGE_TOOL or PURGE macro in gcode_macro.cfg contains hardcoded\nPETG temperature:\n{% set extruder_temp = 250%} ; Ignores slicer settings\nM109 S{extruder_temp} ; Overrides user M109 S220\nSlicer variables {nozzle_temperature[next_extruder]} are ignored. …","textCn":"亲爱的 Creality 固件团队，我正在报告影响 K1 Max + CFS 套件上多材料打印（PETG+PLA）的严重固件缺陷。这些问题使 CFS 系统在常见的 PETG 主体 + PLA 支撑接触面工作流中无法使用。设备信息：型号：Creality K1 Max + CFS 多色升级套件 打印机固件：2.3.5.34 CFS 固件：1.1.3 切片软件：Creality Print 7.0 地点：智利圣地亚哥 日期：2026 年 2 月 08 日 缺陷 #1：CFS 换料温度覆盖（PETG → PLA / PLA → PETG）观察到的行为：PETG 配置：220°C（切片软件耗材配置 + 打印机耗材设置）PLA 配置：220°C（支撑接触面）在 T[next_extruder] / CFS 换料序列期间：用户 G-code：M104 S220 / M109 S220 执行（喷嘴达到 220°C）CFS 固件宏在清洗/挤出期间立即覆盖为 250°C 目标 PLA 耗材在 250°C 下被挤出 → 热断处热蠕变 → 持续堵料 疑似根本原因：gcode_macro.cfg 中的 CFS CHANGE_TOOL 或 PURGE 宏包含硬编码的 PETG 温度：{% set extruder_temp = 250%} ; 忽略切片软件设置 M109 S{extruder_temp} ; 覆盖用户的 M109 S220 切片软件变量 {nozzle_temperature[next_extruder]} 被忽略。……","truncated":true,"url":"https://forum.creality.com/t/critical-bug-report-k1-max-2-3-5-34-cfs-1-1-3-temperature-override-bed/48692","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K1 Max","grade":"有效","replyCount":3,"views":401,"likeCount":8,"sourceType":"论坛"},{"uid":"0dcd1f6a58d122f0","date":"2026-02-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Double Pop up tags in 7.0.1.4212","titleCn":"7.0.1.4212 中重复弹出的窗口","originalText":"In Creality Print 7.0.1.4212, when you send to print, does anyone else get two pop up screens where when you click send to print but then there is a second screen that is a duplicate of the first. The first one is sending the print to the printer and the second one does nothing. You can close it and the print still happens. Just wondering if that is just me or does anyone else get that?\nMine doesn’t do that. I have a different annoyance with Print 7.0.1.4212 for some odd reason it has chosen a really big font for the Filament window. Easy enough to work around, but really annoying. anyone else have this bug?\nBTW, nice feature in Print-7, there is a “user feedback button in the upper left:\nThis happens when the calibration switch is set. It’s a glitch, of course, but this is the reason.","textCn":"在 Creality Print 7.0.1.4212 中，当你发送打印时，有没有人也会看到两个弹出窗口——你点击发送打印后，又出现第二个和第一个一模一样的窗口。第一个会把打印发送到打印机，第二个什么也不做。你可以关掉它，打印依然会进行。只是想知道是只有我这样，还是别人也有？我的不会这样。我对 Print 7.0.1.4212 有另一个困扰，不知为何它给耗材窗口选了非常大的字体。很容易绕过，但真的很烦。还有人有这个 bug 吗？顺便说一句，Print-7 有个不错的功能，左上角有一个「用户反馈」按钮：当校准开关被设置时就会出现这种情况。当然，这是个故障，但原因就是这个。","truncated":false,"url":"https://forum.creality.com/t/double-pop-up-tags-in-7-0-1-4212/48655","productLine":"print","version":"7","versionRaw":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":8,"views":143,"likeCount":3,"sourceType":"论坛"},{"uid":"30b3789d2627bdba","date":"2026-02-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Tree supports Creality Print 7 not strong enough with the filament i am using at the moment","titleCn":"Creality Print 7 的树状支撑在我目前使用的耗材下不够坚固","originalText":"So i printed this character that requires tree supports with the Creality PETG and it worked fine. I finally got the color that i needed to print this and the supports are breaking. Ok so its a different material must not have as good layer adhesion. I have been trying and trying to create stronger tree supports. Can we not set a fill density for tree supports? I found lots of posts of people complaining that they were too strong. I can not seem to make them strong enough. If i choose Strong Tree then it makes these massive tree structures.. might work i guess but why not thinner ones with a fill pattern. I have tried lots of settings like Base Pattern spacing, Support Wall Loops, Tree support diameter. All with limited success. There is an initial density parameter but not a normal Density parameter. Is it time to leave Creality Print?\nWhen using PETG to support PLA prints you need to set the Z axis to 0.0, the support won’t work otherwise\nBeen experimenting with supports myself, and for TPU85A the normal supports are useless, as everything is too soft. …","textCn":"所以我用 Creality PETG 打印了这个需要树状支撑的角色，效果很好。我终于弄到了打印这个所需的颜色，结果支撑却断了。好，那是不同的材料，层间附着肯定没那么好。我一直在反复尝试制作更坚固的树状支撑。我们难道不能为树状支撑设置填充密度吗？我发现很多帖子都在抱怨它们太结实了。我却似乎无法让它们足够结实。如果我选择 Strong Tree，它会生成这些巨大的树状结构……也许能行，但为什么不用带填充图案的更细的结构呢。我试了很多设置，比如 Base Pattern spacing、Support Wall Loops、Tree support diameter。效果都有限。有一个初始密度参数，但没有普通的 Density 参数。是时候离开 Creality Print 了吗？当用 PETG 支撑 PLA 打印件时，你需要把 Z 轴设为 0.0，否则支撑不会起作用。我自己也一直在试验支撑，对于 TPU85A，普通支撑没用，因为一切都太软了。……","truncated":true,"url":"https://forum.creality.com/t/tree-supports-creality-print-7-not-strong-enough-with-the-filament-i-am-using-at-the-moment/48652","productLine":"print","version":"7","versionRaw":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":172,"likeCount":0,"sourceType":"论坛"},{"uid":"c3ee28aef1ad3116","date":"2026-02-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality rewards","titleCn":"Creality 奖励","originalText":"Hi, I am relatively new to Creality and I am a bit confused about the rewards system. I have uploaded a number of models and on a couple I have received 100 points for each 10 downloads, but on one model that has 37 downloads I have not received any points. Could it be because I also uploaded a print file and the majority of the downloads have been of that and not the STL models?\nIf so this is a bit of a disincentive to include print files.\nMany thanks\nPaul","textCn":"你好，我接触 Creality 相对较新，对奖励系统有点困惑。我上传了一些模型，其中几个我每 10 次下载获得 100 积分，但有一个模型有 37 次下载，我却没收到任何积分。会不会是因为我也上传了打印文件，而大部分下载都是那个文件而不是 STL 模型？如果是这样，这会让人不太愿意附带打印文件。非常感谢 Paul","truncated":false,"url":"https://forum.creality.com/t/creality-rewards/48605","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":73,"likeCount":0,"sourceType":"论坛"},{"uid":"f171ee13f99cd1b0","date":"2026-02-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality crashes when try to add text","titleCn":"Creality 在尝试添加文字时崩溃","originalText":"Crality crashes when trying to add text","textCn":"Creality 在尝试添加文字时崩溃","truncated":false,"url":"https://forum.creality.com/t/creality-crashes-when-try-to-add-text/48547","productLine":"print","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":1,"views":21,"likeCount":0,"sourceType":"论坛"},{"uid":"db41f17abb4bd588","date":"2026-02-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Prime tower floating region?","titleCn":"擦料塔悬空区域？","originalText":"Notice the green and blue floating regions in my prime tower? Why would the slicer do this, and yes the printer is attempting and failing to print these unsupported regions. Any ideas on a setting that will fix this?","textCn":"注意到我的擦料塔里绿色和蓝色的悬空区域了吗？切片软件为什么会这样做？是的，打印机正在尝试打印这些无支撑区域但失败了。有什么设置能解决这个问题吗？","truncated":false,"url":"https://forum.creality.com/t/prime-tower-floating-region/48560","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":1,"views":37,"likeCount":0,"sourceType":"论坛"},{"uid":"383fd5786a5ed830","date":"2026-02-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.0 hollow tool","titleCn":"Creality Print 7.0 镂空工具","originalText":"Hi, New to the forum. I was trying to use the hollow tool and not really sure I am doing it correctly or the hollow tool is what I expected. I have a model that i have split in half. I selected the hollow tool and set the thickness at 2mm and then selected hollow. It looks like it is hollowing it out not sure what I expected. I did not try to print it yet I was hoping it would show me what it did. I was thinking that the walls of what I wanted to print would be 2mm thick. I can’t find anyone posting a video or anything yet to see if I am using that tool correctly or not. Any help appreciated.\nWhen i played with the hollow tool and also cutting the bottom off so that i could access the center i just played with the settings and would slice it to see what the result was. I was using it on a very complicated Disney castle.. and surprisingly it worked.\nI think the part that is not obvious with the hollow tool are these points…\n#1 The “hollow” mm setting has to be less than the thickness of the part if you want a bottom.\n#2 Do not generate top layers.\n#3 Turn off infill.\nIf you do those three things you should see your hollowed out part.","textCn":"你好，论坛新手。我试着用镂空工具，不太确定我用得对不对，或者镂空工具是不是我预期的样子。我有一个模型，我把它切成了两半。我选择了镂空工具并把厚度设为 2mm，然后选择镂空。它看起来确实在把它掏空，但我不确定我期望的是什么。我还没试着打印它，我希望它能让我看到它做了什么。我以为我想打印的壁厚会是 2mm。我找不到有人发视频或别的什么来看看我用这个工具是否正确。任何帮助都很感谢。 当我玩镂空工具并且还把底部切掉以便进入中心时，我只是瞎调设置然后切片看结果。我用它做了一个非常复杂的迪士尼城堡……而且出乎意料地成功了。 我认为镂空工具不明显的点是这些…… #1 如果你想要底部，“镂空”的毫米设置必须小于零件的厚度。 #2 不要生成顶层。 #3 关闭填充。 如果你做这三件事，你应该能看到掏空后的零件。","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-0-hollow-tool/48562","productLine":"print","version":"7.0","versionRaw":"7.0","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":649,"likeCount":1,"sourceType":"论坛"},{"uid":"01b86c2b025bdd9c","date":"2026-02-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print 7 exclude objects","titleCn":"Creality Print 7 排除对象","originalText":"Hello, could you put “Exclude objects” in Creality print not only on web interface and bed mesh too ?\nI’m not entirely sure I am understanding the request. In v7 of Creality Print, the exclude object is a little less than intuitive. This post covers it well.\nHelp, New Creality Print version missing Exclude object Creality Print V5 and Beyond\nCreality print said there was a new version this morning so I downloaded it, under the device tab where the camera is located and what not the option to remove one of the objects being printed is gone. I’ve looked all over to see if there was some option to turn it back on. I tend to print multiple objects and when fails I just remove it so the printer skips over it, but the option is missing so now I’m wasting so much filament!\nIt’s in a tab now .. I asked the same Question ..\ndelete object","textCn":"你好，能不能把“排除对象”不只放在 Creality Print 的网页界面上，也放到热床网格上？我不太确定我理解了这个请求。在 Creality Print 的 v7 中，排除对象功能不太直观。这个帖子讲得很清楚。求助，新版 Creality Print 缺少排除对象 Creality Print V5 及以后版本。今天早上 Creality Print 说有一个新版本，所以我下载了它，在摄像头所在的设备选项卡下，移除正在打印的某个对象的选项不见了。我到处找了，看是否有选项能把它重新打开。我倾向于一次打印多个对象，失败时就移除它，让打印机跳过它，但这个选项不见了，所以现在浪费了很多耗材！它现在在一个选项卡里……我问了同样的问题……删除对象","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-exclude-objects/48557","productLine":"print","version":"7","versionRaw":"7","problemType":"ui","model":"未标注","grade":"有效","replyCount":4,"views":237,"likeCount":4,"sourceType":"论坛"},{"uid":"f7ee762dfedbd576","date":"2026-02-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"petg fillament not selecting","titleCn":"无法选中 PETG 耗材","originalText":"on my k2 creality 3d printer i try selecting petg but it just wont select but it does if it is pla??? if i select it as pla it wont print properly.","textCn":"在我的 K2 Creality 3D 打印机上，我想选中 PETG，但就是选不上，可如果是 PLA 就能选中？？？如果我把它当成 PLA 来选，又打印不正常。","truncated":false,"url":"https://forum.creality.com/t/petg-fillament-not-selecting/48520","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"0a485ecc16e2048d","date":"2026-02-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Import a .SVG to print as a different color into Creality Print","titleCn":"把 .SVG 导入 Creality Print 以用不同颜色打印","originalText":"I’m using CP v7.0.0.4127 and what I’m trying to do is merge an imported .SVG file into a rectangle (for example). Then I want to print the rectangle one color (blue for example) and the imported .svg another color (red). And I want these to be flush.\nHow do I go about in doing this?\nThank you!!\nLoad the rectangle, select it and right click on it. Add Part > SVG and import your SVG File. It will give you options like depth, etc. This will make it an assembly. Move the SVG into position where you want it.\nThen on the left side under the printer drop down, you should see the rectangle and svg listed as objects. Select the SVG and change the filament color.\nIs the filament an extra for the falcon A1 pro?","textCn":"我用的是 CP v7.0.0.4127，我想做的是把一个导入的 .SVG 文件合并到一个矩形里（举例来说）。然后我想把矩形打印成一种颜色（比如蓝色），把导入的 .svg 打印成另一种颜色（红色）。而且我希望它们是齐平的。 我该怎么做？ 谢谢！！ 加载矩形，选中它并右键点击它。添加零件 > SVG 并导入你的 SVG 文件。它会给你深度等选项。这会让它成为一个装配体。把 SVG 移动到你想要的位置。 然后在左侧打印机下拉菜单下，你应该能看到矩形和 svg 被列为对象。选中 SVG 并更改耗材颜色。 这个耗材是 falcon A1 pro 的额外配件吗？","truncated":false,"url":"https://forum.creality.com/t/import-a-svg-to-print-as-a-different-color-into-creality-print/48501","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":531,"likeCount":0,"sourceType":"论坛"},{"uid":"00ac34675488be9e","date":"2026-02-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Device Tap Map Support","titleCn":"Creality Print 设备标签页的 Map 支持","originalText":"Hello,\nWouldn’t it be great if we had Map support in the Device tab of Creality Print?\nWhat I mean is that in Fluidd, you can create folders so you can keep ABS, PETG, and PLA separate, and then select a folder for what you want to print. This keeps things organized rather than having everything mixed up.\nI would find this really easy and much more organized.\nThat would be helpful","textCn":"你好，如果 Creality Print 的设备标签页里支持 Map，那不是很好吗？我的意思是，在 Fluidd 里你可以创建文件夹，从而把 ABS、PETG 和 PLA 分开存放，然后选择想打印的文件夹。这样能让东西井井有条，而不是全都混在一起。我会觉得这非常方便，也更有条理。那会很有帮助。","truncated":false,"url":"https://forum.creality.com/t/creality-print-device-tap-map-support/48509","productLine":"print","version":"","versionRaw":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":2,"views":66,"likeCount":5,"sourceType":"论坛"},{"uid":"8c9e51b9e6801034","date":"2026-01-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"White dots in Creality print while slicing","titleCn":"Creality Print 切片时出现白点","originalText":"White dots in the print layers\nHello everyone,\nMy name is Alan, I work as a teacher at a university and live in Belgium. Can anyone help me with the white dots problem in the “Creality Print” software program?\nAt first, I didn’t find it bothersome, but now that we’re working with more precise parts, it’s becoming a problem when trying to achieve a proper fit, especially when two parts need to fit together with high precision.\nIs this something that can be adjusted in the software during slicing, or how can it be prevented?\nThe printer we use is a Creality Ender-3 V3 KE.\nAny help is welcome.\nHave a nice day everyone.\nRegards, Alan\nThose are the z seam. You can try different options and slice the model again to preview the seam try to make it less noticeable.\nYeah that where the line ends when printing. It’s also called the seam.","textCn":"打印层中的白点 大家好，我叫 Alan，在大学当老师，住在比利时。有人能帮我解决“Creality Print”软件程序里的白点问题吗？ 一开始我并不觉得它烦人，但现在我们要做更精密的零件，在想要达到合适的配合时就变成问题了，尤其是当两个零件需要高精度地拼合在一起时。 这是切片时能在软件里调整的东西吗，还是说该怎么避免？ 我们用的打印机是 Creality Ender-3 V3 KE。 任何帮助都欢迎。 祝大家有美好的一天。 此致，Alan 那些是 Z 轴接缝。你可以试试不同的选项，然后重新切片模型来预览接缝，尽量让它不那么明显。 对，那是打印时线结束的地方。它也叫接缝。","truncated":false,"url":"https://forum.creality.com/t/white-dots-in-creality-print-while-slicing/48484","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Ender-3 V3 KE","grade":"有效","replyCount":6,"views":157,"likeCount":7,"sourceType":"论坛"},{"uid":"10806632592e592e","date":"2026-01-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Remember the name for a file","titleCn":"记住文件名","originalText":"Not sure if this is the best place to submit this, but can we please retain the name of a file when we give it in send print? It keeps resetting itself and I keep forgetting which file is which across my multiple printers Would be nice if when I save the project, it saves the file name too.\nI second this","textCn":"不确定这是不是提交此问题的最佳地方，但能否在我们发送打印时保留文件名？它会不断自动重置，而我在多台打印机之间老是忘记哪个文件是哪个。如果保存项目时也能一并保存文件名就好了。我也赞同","truncated":false,"url":"https://forum.creality.com/t/remember-the-name-for-a-file/48478","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":42,"likeCount":2,"sourceType":"论坛"},{"uid":"beaec8a2730a0d2f","date":"2026-01-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can't get Creality Print Ver V7.0.0.4127 to run in LMDE 6","titleCn":"无法在 LMDE 6 中运行 Creality Print V7.0.0.4127","originalText":"Hello.\nI’ve been attempting to run the latest version of Creality Print on my computer which is running LMDE 6 as the OS, but have not been abler to even get the software to open up. I click on the icon and nothing happens. I downloaded the “CrealityPrint-V7.0.0.4127-x86_64-Release.AppImage” file and made the file excutable using both the graphical interface and the command line. What have I missed?\nThanks in advance for your help here,\nShawn C.","textCn":"你好。 我一直在尝试在系统为 LMDE 6 的电脑上运行最新版本的 Creality Print，但连软件都打不开。我点击图标，什么也没发生。我下载了“CrealityPrint-V7.0.0.4127-x86_64-Release.AppImage”文件，并用图形界面和命令行两种方式都把它设为可执行。我漏掉了什么？ 先感谢你的帮助， Shawn C.","truncated":false,"url":"https://forum.creality.com/t/cant-get-creality-print-ver-v7-0-0-4127-to-run-in-lmde-6/48411","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":31,"likeCount":0,"sourceType":"论坛"},{"uid":"8f9bb9d2ab121dba","date":"2026-01-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"2 questions about creality print 7","titleCn":"关于 creality print 7 的两个问题","originalText":"Print 7 is working great with my new K1C but two things about it I dont understand ,\nOn the preview screen it says my models x, y and z dimensions and for z its telling me its 245mm tall . Now I’m printing with 0.2mm layers so im thinking theres 5 x 0.2mm in 1 mm so 245mm should be 1225 layers but its showing 1678 layers why the discrepancy ? this difference happens no matter what print i load in\nOn the preview screen it says the x,y,z dimensions and SPEED , The speed right now says 135 , if I load in a different file but keep all the printer settings as they were I would assume that the speed would remain the same . It can be higher or lower but I cant see any correlation as to why , surely no matter what model I print if the printer speed for all models is kept the same and the layer size etc why should it say the speed will be different , In the model im on now it has the printer set to 60mm/s for first inner and outer wall and for all other l;ayers 200mm/s outer and 250mm/s inner yet on the preview page its says ..X 147.369mm Y 202.266mm Z 245.0mm and Speed 135 , In what way does 135 relate to any of the speed settings i set in the printer settings or am I missing the point som …","textCn":"Print 7 在我的新 K1C 上运行得很好，但有两件事我不明白， 在预览屏幕上它显示我模型的 x、y 和 z 尺寸，对于 z 它告诉我高度是 245mm。现在我用 0.2mm 层高打印，所以我想 1 mm 里有 5 个 0.2mm，那么 245mm 应该是 1225 层，但它显示 1678 层，为什么有差异？无论我载入什么打印，这个差异都会出现 在预览屏幕上它显示 x、y、z 尺寸和速度，现在速度显示 135，如果我载入另一个文件但保持所有打印机设置不变，我会以为速度保持不变。它可能更高或更低，但我看不出任何相关性来解释为什么，明明无论我打印什么模型，如果所有模型的打印机速度都保持一致，层高等等也一致，为什么它会说速度不同，在我现在这个模型里它把打印机的首层内壁和外壁设为 60mm/s，其他所有层外壁 200mm/s 内壁 250mm/s，然而预览页面显示……X 147.369mm Y 202.266mm Z 245.0mm 和速度 135，135 与我设置的任何速度设置有什么关系，还是我哪里没理解……","truncated":true,"url":"https://forum.creality.com/t/2-questions-about-creality-print-7/48386","productLine":"print","version":"7","versionRaw":"7","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":92,"likeCount":0,"sourceType":"论坛"},{"uid":"7950c46383877d09","date":"2026-01-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Side Auxiliary Fan Keeps Turning Off","titleCn":"侧辅助风扇总是关闭","originalText":"Creality Print 6.3 & Creality Print 7.0\nWith my Creality K2, I am using my Side Auxiliary Fan to move air round the enclosure during heating.\nI turn the cooling feature off selecting side fan 0%\nSide Fan De-Selection\nI then turn the fan on manually in Fluidd or use a modified gcode gcode_macro M141\nThe side fan runs then turns off.\nI inspected the print gcode and Creality Print is adding “M106 P2 S0” in three places , this turns the side fan off.\nThis occurrence is not a problem as I turn the side fan on after this.\n-----------------------\nFirst addition\n; EXECUTABLE_BLOCK_START\nEXCLUDE_OBJECT_DEFINE NAME=50mm_Fan_Cradle.stl_id_0_copy_0 CENTER=130,130 POLYGON=[[76,185.4],[97,65],[163,65],[184,185.4],[184,195],[76,195],[76,185.4]]\nM73 P0 R52\nM106 S0\nM106 P2 S0\n----------------------------\nThis is a problem as the print has started\n-----------------------\nSecond addition\n;TIME_ELAPSED:996.099609\nM106 P2 S0\n;LAYER_CHANGE\n-------------------------\nThis occurrence is not a problem as it is at the end of the print and I turn the side fan off after this. …","textCn":"Creality Print 6.3 和 Creality Print 7.0 用我的 Creality K2 时，我在加热期间用侧辅助风扇让空气在机箱内循环。 我把冷却功能关掉，选择侧风扇 0% 取消勾选侧风扇 然后我在 Fluidd 里手动打开风扇，或者使用修改过的 gcode gcode_macro M141 侧风扇转起来后又关了。 我检查了打印 gcode，发现 Creality Print 在三处添加了“M106 P2 S0”，这会把侧风扇关掉。 这一处不是问题，因为我在这之后会打开侧风扇。 ----------------------- 第一处 ; EXECUTABLE_BLOCK_START EXCLUDE_OBJECT_DEFINE NAME=50mm_Fan_Cradle.stl_id_0_copy_0 CENTER=130,130 POLYGON=[[76,185.4],[97,65],[163,65],[184,185.4],[184,195],[76,195],[76,185.4]] M73 P0 R52 M106 S0 M106 P2 S0 ---------------------------- 这是个问题，因为打印已经开始了 ----------------------- 第二处 ;TIME_ELAPSED:996.099609 M106 P2 S0 ;LAYER_CHANGE ------------------------- 这一处不是问题，因为它位于打印结束时，我在这之后会关掉侧风扇。……","truncated":true,"url":"https://forum.creality.com/t/side-auxiliary-fan-keeps-turning-off/48306","productLine":"print","version":"6.3","versionRaw":"6.3","problemType":"","model":"K2","grade":"泛讨论","replyCount":1,"views":115,"likeCount":0,"sourceType":"论坛"},{"uid":"8cb962e7fd4120a9","date":"2026-01-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"K1C Filament Change & Poop amount Settings","titleCn":"K1C 换料与废料排出量设置","originalText":"Just trying to print multicolor however noticed interesting poop action,\nprinter lays the layers and then next layer is different color so cuts the filament, retracts and extrude new color however after that flushing one more time. That creates extra poop volume, i could not stop second flush although i put flush multiplier as “0”,\nLook at the sequence of poops, could not figure out how to stop or reduce secondary single color poop.\nI printed via creality print default settings with flush multiplier 0.\nPhoto 22.01.2026, 17 21 55\nPhoto 22.01.2026, 17 23 02\nTenho tido o mesmo problema.","textCn":"只是尝试打印多色，不过注意到了有趣的排废动作：打印机铺好各层，然后下一层是不同颜色，于是切断耗材、回抽并挤出新颜色，然而之后又冲洗了一次。这产生了额外的废料量，尽管我把冲洗倍数设为“0”，还是无法阻止第二次冲洗。看看这些排废的顺序，我实在搞不懂如何停止或减少二次单色排废。我是通过 Creality Print 默认设置、冲洗倍数为 0 打印的。照片 22.01.2026, 17 21 55。照片 22.01.2026, 17 23 02。我也一直遇到同样的问题。","truncated":false,"url":"https://forum.creality.com/t/k1c-filament-change-poop-amount-settings/48288","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K1C","grade":"泛讨论","replyCount":2,"views":140,"likeCount":0,"sourceType":"论坛"},{"uid":"e17406c6a8d0e11f","date":"2026-01-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print switches colours through multiple layers instead of a single layer","titleCn":"Creality Print 在多个层而不是单层中切换颜色","originalText":"I have a Creality K2 Pro (including the CFS for multifilament printing) and want to print some tokens for gaming.\nI want the coloured icons on them to be a single layer thick on the top and bottom so that I’m not wasting filament swapping colours multiple times a print. I’m trying to slice the tokens in Creality Print but it changes the colour on all the shell layers instead of just the first.\nThe coloured parts of the model are .2mm thick, the hight of a layer, as you can see in the second screen shot. I’ve tried making them thinner and it doesn’t help. Anyone got any ideas on how to solve this? Thanks in advance\nHello @RowSkin\nWelcome to the Creality Forum…!\nI’m not sure if this is the answer you are looking for but try this. In Creality 7 go to the paint icon. Choose the height range and then experiment with it so you can fill in that top layer with a different color. That would only work if the top layer sticks up a couple mm. Remember that a very thin light color on top of a dark color might show through. Hope that helps a little. …","textCn":"我有一台 Creality K2 Pro（包括用于多色打印的 CFS），想打印一些游戏用的棋子。我希望上面的彩色图标在顶部和底部只有一层厚，这样就不会在一次打印中多次换色浪费耗材。我在 Creality Print 里尝试对这些棋子切片，但它在所有外壳层上都改变了颜色，而不只是第一层。如第二张截图所示，模型的彩色部分是 .2mm 厚，正好是一层的厚度。我试过把它们做得更薄，但没有帮助。有人知道怎么解决吗？先谢谢了 你好 @RowSkin 欢迎来到 Creality 论坛……！ 我不确定这是不是你要的答案，但试试这个。在 Creality 7 中进入上色图标。选择高度范围，然后试验它，这样你就能用不同的颜色填充那一顶层。只有当顶层凸出几毫米时才行。记住，在深色上面很薄的浅色可能会透出来。希望这有点帮助。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-switches-colours-through-multiple-layers-instead-of-a-single-layer/48242","productLine":"print","version":"","versionRaw":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":12,"views":630,"likeCount":1,"sourceType":"论坛"},{"uid":"c79f9a74603c3e1f","date":"2026-01-21","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Request for Bridge Anchor Control (Start/End Position Adjustment)","titleCn":"请求增加桥接锚点控制（起点/终点位置调整）","originalText":"Request for Bridge Anchor Control (Start/End Position Adjustment)","textCn":"请求增加桥接锚点控制（起点/终点位置调整）","truncated":false,"url":"https://forum.creality.com/t/request-for-bridge-anchor-control-start-end-position-adjustment/48240","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":2,"views":44,"likeCount":0,"sourceType":"论坛"},{"uid":"a0ed69a269e05c20","date":"2026-01-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Cost of filament used","titleCn":"所用耗材的成本","originalText":"In creality print 7 it tells me the weight and length of the filament that the model will use and it says how much the filament needed will cost , but how do i tell it what i paid for the 1KG reel so it can give a realistic cost for the model , where do I set the filament price per KG\nCheers\nDon\nI can’t remember but in earlier versions of Creality Print you could actually type in the filament cost per roll. Prices vary with each roll so you’d have to average.\nIn Creality Print 7.0.0.4127 I found this but haven’t tried to set it yet:\nClick on the pencil icon:\ncost-2\ncost-1\nIn the Filament Profile you can also add the price of each roll. You’d have to add each time for different prices:\nClick on the filament and then the pencil icon:\nFilament-Profile-2\nFilament-Profile-1\nHope that helps…\nBe forewarned: the filament usage calculator inherited from Bambu Studio / OrcaSlicer - which Creality Print v6 and later are based on - is effectively broken. It is barely usable even with a 0.4 mm nozzle, and on the K2 Plus with a 0.8 mm nozzle it is so far off that the results are meaningless.\nThis is not a dig at Creality Print. …","textCn":"在 Creality Print 7 里，它会告诉我模型将使用的耗材重量和长度，也会说所需耗材要花多少钱，但我要怎么告诉它我买 1KG 料盘花了多少钱，这样它才能给出真实的模型成本？我在哪里设置每 KG 的耗材价格？ 谢谢 Don 我记不清了，但在较早版本的 Creality Print 里，你其实可以输入每卷耗材的成本。每卷价格都不一样，所以你得取平均值。 在 Creality Print 7.0.0.4127 里我找到了这个，但还没试着设置： 点击铅笔图标： cost-2 cost-1 在耗材配置里你也可以添加每卷的价格。不同价格你得每次添加： 点击耗材，然后点击铅笔图标： Filament-Profile-2 Filament-Profile-1 希望这有帮助… 提醒一下：从 Bambu Studio / OrcaSlicer 继承来的耗材用量计算器——Creality Print v6 及以后版本就是基于它——实际上是坏的。即使配 0.4 mm 喷嘴也几乎不能用，而在配 0.8 mm 喷嘴的 K2 Plus 上偏差太大，结果毫无意义。 这不是在贬低 Creality Print。…","truncated":true,"url":"https://forum.creality.com/t/cost-of-filament-used/48216","productLine":"thirdparty","version":"7","versionRaw":"7","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":4,"views":858,"likeCount":2,"sourceType":"论坛"},{"uid":"f00a43ef45c47b91","date":"2026-01-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can not find K2 on local wifi in Creality Print software","titleCn":"在 Creality Print 软件中无法通过本地 wifi 找到 K2","originalText":"I want to direct my printer through my local wifi network instead of sending everything to the cloud. The software just won’t find it.\nScanning automatically won’t work.\nIP Adress is not found.\nWebpage version through ip:port DOES work.\nAll I got is the cloud and the app and I’m getting a little tired of having to send a print job five times because the cloud times out on me or not being able to actually check my stuff on the camera more quickly because, again, the cloud times out.\nAnyone got tips?\nWhen you checked from LCD panel and verified that it was connected to your WIFI, was the IP address that it used to connect to your local WiFi on the same LAN as your computer?\nWhen you pinged that IP address did you get a reply?\nI still wonder why Creality doesn’t give the option to set a FIXED/STATIC- IP-address…","textCn":"我想通过本地 wifi 网络直接控制我的打印机，而不是把所有东西都发到云端。软件就是找不到它。自动扫描不起作用。找不到 IP 地址。通过 ip:port 访问网页版确实能用。我只有云端和 App，而且我有点厌倦了因为云端超时不得不把打印任务发送五次，或者因为云端又超时了而无法更快地在摄像头上查看我的东西。有人有技巧吗？当你从 LCD 面板检查并确认它已连接到你的 WIFI 时，它用来连接本地 WiFi 的 IP 地址和你的电脑在同一个局域网吗？你 ping 那个 IP 地址时有回复吗？我还是想知道为什么 Creality 不提供设置固定/静态 IP 地址的选项……","truncated":false,"url":"https://forum.creality.com/t/can-not-find-k2-on-local-wifi-in-creality-print-software/48166","productLine":"cloud","version":"","versionRaw":"","problemType":"compat","model":"K2","grade":"有效","replyCount":6,"views":242,"likeCount":0,"sourceType":"论坛"},{"uid":"d6008512fd9c519f","date":"2026-01-17","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Calibration models produce non-manifold errors?","titleCn":"Creality Print 校准模型会产生非流
