 standalone","titleCn":"网页编辑器始终无法加载——create-model / editType=editModel 路由渲染为空白，无论是嵌入式还是独立运行","originalText":"Web editor never loads — the create-model / editType=editModel route renders blank, embedded or standalone","textCn":"网页编辑器始终无法加载——create-model / editType=editModel 路由渲染为空白，无论是嵌入式还是独立运行","truncated":false,"url":"https://forum.creality.com/t/web-editor-never-loads-the-create-model-edittype-editmodel-route-renders-blank-embedded-or-standalone/52532","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":24,"likeCount":0,"sourceType":"论坛"},{"uid":"62f6685d0650dfdc","date":"2026-07-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Linux branch of Creality Print not booting","titleCn":"Creality Print 的 Linux 版本无法启动","originalText":"Linux branch of Creality Print not booting","textCn":"Creality Print 的 Linux 版本无法启动","truncated":false,"url":"https://forum.creality.com/t/linux-branch-of-creality-print-not-booting/52506","productLine":"print","version":"","versionRaw":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":2,"views":65,"likeCount":0,"sourceType":"论坛"},{"uid":"00295af30ab1665e","date":"2026-07-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bed Temperature taken from wrong filament setting","titleCn":"热床温度取自错误的耗材设置","originalText":"Setup: K2 Plus with 2 CFS, printing with ASA and an Epoxy Resin Plate, Creality Print V 7.2.0.5225\nThe filament is set up to use a bed temperature of 90° degreeC with this build plate, the correct build plate is chosens and the edited filament is selected in the cfs settings (Slot 6).\nBut since the newest software version the print starts with the wrong bed temperatur (40°C), which can also be seen in the G-Code preview.\nStrange behavior: When i edit the filament settings for slot 1 (PLA, which by default has a bed temperature of 40°C for the Epoxy resin plate) to use 90°C for this bed type, the slicer choses this (correct) temperature for my filament in slot 6.\nThis behavior is definitly new and was not present in 7.0.x of Creality Print\nbean\nyou need to edit the filament settings. Select the filament you want to use, click the pen on the right side. then scroll down to the expoxy plate and change both temps from 40 to 90. you can save it as a profile or just make the changes and it will apply to the active print. if you save it you can use it later for other prints. see pictures below. …","textCn":"设置：K2 Plus 配 2 个 CFS，使用 ASA 和环氧树脂板，Creality Print V 7.2.0.5225。该耗材被设置为在这种构建板上使用 90°C 的热床温度，选择了正确的构建板，并且在 CFS 设置（槽位 6）中选择了编辑过的耗材。但自从最新的软件版本以来，打印开始时热床温度是错误的（40°C），这在 G-Code 预览中也能看到。奇怪的行为：当我编辑槽位 1 的耗材设置（PLA，默认在这种环氧树脂板上热床温度为 40°C）为这种板型使用 90°C 时，切片软件为我槽位 6 的耗材选择了这个（正确的）温度。这种行为肯定是新出现的，在 Creality Print 7.0.x 中并不存在。bean 你需要编辑耗材设置。选择你想用的耗材，点击右侧的笔。然后向下滚动到环氧板，把两个温度都从 40 改成 90。你可以把它保存为配置，或者直接修改，它会应用到当前打印。如果保存了，以后其他打印也可以用。见下面的图片。……","truncated":true,"url":"https://forum.creality.com/t/bed-temperature-taken-from-wrong-filament-setting/52455","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"ui","model":"K2 Plus","grade":"有效","replyCount":4,"views":61,"likeCount":0,"sourceType":"论坛"},{"uid":"c5f06a906a55154d","date":"2026-07-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Default Creality Slicer Jerk Values are wrong?","titleCn":"Creality 切片软件的默认 Jerk 值有误？","originalText":"Hi There, i have a Ender 3 V3 SE and i use the Creality Slicer. I use all the default settings from the slicer, as it is from the same organization as the printer i assume they have all setup best than i can.\nWhen i use the 0.20mm profile, nothing is wrong, but every time i try to change to the 0.16mm or the 0.12mm profiles i got this message:\nYes the warning is cropped and show no scrollbar.\nBeside that i found it odd that the values change itself when changing profile, see:\n0.20mm\n0.16mm and 0.12mm are the same\n0.12mm\nCompare the “Top Surface” value… it is set to 8 in the 0.20 profile that works, in all other profiles this is set to 20… change it and hope for the best\nIt’s not strange that settings change when loading other profiles, the settings are saved in the profile!\nI mean it is strange that the value change to one that is not allowed","textCn":"你好，我有一台 Ender 3 V3 SE，我使用 Creality 切片软件。我使用切片软件的所有默认设置，因为它与打印机来自同一组织，我认为他们已经把一切都设置得比我所能做的更好。当我使用 0.20mm 配置时，一切正常，但每次我尝试切换到 0.16mm 或 0.12mm 配置时，我都会收到这条消息：是的，警告被裁剪了，并且没有显示滚动条。除此之外，我觉得切换配置时数值自己变化很奇怪，看：0.20mm 0.16mm 和 0.12mm 是一样的 0.12mm 比较“Top Surface”值…在正常的 0.20 配置中它被设为 8，在所有其他配置中它被设为 20…改掉它，然后祈祷最好的结果 加载其他配置时设置发生变化并不奇怪，设置保存在配置里！我的意思是，数值变成不允许的值才奇怪","truncated":false,"url":"https://forum.creality.com/t/default-creality-slicer-jerk-values-are-wrong/52428","productLine":"print","version":"7.89","versionRaw":"7.89","problemType":"slice","model":"Ender-3 V3 SE","grade":"有效","replyCount":4,"views":102,"likeCount":0,"sourceType":"论坛"},{"uid":"4a74b42dfc4a7087","date":"2026-07-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.1 Theme","titleCn":"Creality Print 7.1 主题","originalText":"I am new to Creality and 3D printing in general. I just wanted to come on here and say that I would like to see support for toggling from dark to light theme. I understand this was an option on the older versions but it now defaults to the system default. I like to have my system set to dark theme but prefer with most apps to have a lighter interface for more contrast. Since this is a port or OrcaSlicer, I don’t understand why the latest version of Orca supports a light theme and CrealityPrint does not. Simply don’t remove it from the original source on next update. Better yet, work with OrcaSlicer so their product can send files directly to Creality printers and don’t waste the effort of having a separate fork.\n… you can still “toggle” between dark or light mode of the screen… Press CTRL+P and unthick “Enable dark mode”…\nThank you so much! That was extremely helpful.","textCn":"我是 Creality 和 3D 打印的新手。我只是想上来说一句，我希望支持在深色和浅色主题之间切换。我理解这在旧版本里是个选项，但现在它默认跟随系统默认。我喜欢把系统设为深色主题，但大多数应用我更喜欢较浅的界面，以获得更大的对比度。既然这是 OrcaSlicer 的一个移植版本，我不理解为什么最新版 Orca 支持浅色主题而 CrealityPrint 不支持。下次更新时干脆别从原始源码里把它删掉。更好的是，和 OrcaSlicer 合作，让他们的产品能直接把文件发送到 Creality 打印机，别浪费精力搞一个单独的分支。……你仍然可以在屏幕的深色或浅色模式之间“切换”……按 CTRL+P，取消勾选“Enable dark mode”……太感谢了！这非常有帮助。","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-1-theme/52405","productLine":"thirdparty","version":"7.1","versionRaw":"7.1","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":89,"likeCount":2,"sourceType":"论坛"},{"uid":"c6907c713febca53","date":"2026-07-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problem with Cyrillic symbols in file names","titleCn":"文件名中西里尔字母的问题","originalText":"Cyrillic symbols are shown as “???” marks — in red ellipses.\nBut it’s OK in green ellipse — Cyrillic symbols as they should to be…\nCreality Print V7.2.0.5225.\nBy the way, there is no such problem in Creality Print V6.2.","textCn":"西里尔字母显示为“???”符号——在红色椭圆中。但在绿色椭圆中没问题——西里尔字母显示的是它们应有的样子…… Creality Print V7.2.0.5225。顺便说一句，在 Creality Print V6.2 中没有这个问题。","truncated":false,"url":"https://forum.creality.com/t/problem-with-cyrillic-symbols-in-file-names/52380","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":27,"likeCount":0,"sourceType":"论坛"},{"uid":"2d67ca823103c185","date":"2026-07-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Feature Request: Start Printing at a Set Time","titleCn":"功能请求：在指定时间开始打印","originalText":"Feature Request: Start Printing at a Set Time","textCn":"功能请求：在指定时间开始打印","truncated":false,"url":"https://forum.creality.com/t/feature-request-start-printing-at-a-set-time/52390","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":66,"likeCount":0,"sourceType":"论坛"},{"uid":"e34142860f34a830","date":"2026-07-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print producing voids","titleCn":"Creality Print 产生空洞","originalText":"I am trying to understand how this is happening and then what to do about it. I’ve been using Creality Print v7 with my K2SE for about 7 months and haven’t had a problem. I’m trying to print this small car that has Print In Place bearings for wheels. When I slice it in Creality Print the rollers end up with several voids in them at random layers. I know it’s not the STL, I can change the layer thickness from .20 to .18 to .16 and the voids jump to different rollers in different layers. I’ve sliced the same STL in Cura and there are no voids in any layers. These voids are usually 2 layers and even get overhang printed above them so the slicer sees the voids that it created as a real void. As you can imagine, the rollers just fall apart with two missing layers at random locations.\nSome of the voids get applied to neighboring parts.\nI like the way Creality Print works and I want to figure this out. Cura works but it’s just not the same. I’ve attached two PDF’s with screen shots of a few layers from both slicers for comparison.\nCreality Print Voids.pdf ( )\nCura No Voids.pdf ( )\nDon\nCompare ALL settings of both slicers…\nhave you tried ‘fix model’ ? …","textCn":"我想弄明白这是怎么发生的，然后该怎么办。我用 Creality Print v7 配我的 K2SE 大约 7 个月了，没出过问题。我正在打印一辆小车，它的轮子有就地打印的轴承。当我在 Creality Print 里切片时，滚轮在随机层上出现了几个空洞。我知道这不是 STL 的问题，我可以把层厚从 .20 改到 .18 再到 .16，空洞就会跳到不同滚轮的不同层上。我在 Cura 里切片同一个 STL，任何层都没有空洞。这些空洞通常是 2 层，甚至在上面还打印了悬垂，所以切片软件把它自己创造的空洞当成了真正的空洞。你可以想象，滚轮因为随机位置缺了两层而直接散架。有些空洞会出现在相邻的零件上。我喜欢 Creality Print 的工作方式，我想弄清楚这个问题。Cura 能用，但就是不一样。我附上了两个 PDF，里面有来自两个切片软件的几层截图作比较。Creality Print Voids.pdf ( ) Cura No Voids.pdf ( ) Don 比较两个切片软件的所有设置……你试过“修复模型”吗？……","truncated":true,"url":"https://forum.creality.com/t/creality-print-producing-voids/52357","productLine":"thirdparty","version":"7","versionRaw":"7","problemType":"other","model":"未标注","grade":"有效","replyCount":5,"views":81,"likeCount":0,"sourceType":"论坛"},{"uid":"2c4cad4b1fba6e0d","date":"2026-07-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"[BUG] Firmware v1.1.6.1 overrides PETG temperature to 250°C and fails to detect textured PEI build plate","titleCn":"[BUG] 固件 v1.1.6.1 将 PETG 温度强制改为 250°C，并且无法检测纹理 PEI 打印板","originalText":"After the automatic firmware update from:\nCR0CN240110C10_R_202605081127_ota_img_V1.1.5.5.img\nto:\nCR0CN240110C10_R_202606230954_ota_img_V1.1.6.1.img\nmy printer started behaving incorrectly.\nFor some unknown reason, the printer now starts printing PETG at 250°C, even though the G-code was generated with a nozzle temperature of 240°C.\nI have already checked the OrcaSlicer settings and reviewed the G-code files. The temperature in the G-code is correct, so this appears to be a printer firmware bug.\nAnother issue that started after the update is that, when I send files to print, the printer reports an error saying that it cannot detect my textured build plate.\nFor reference, my original textured plate was replaced with a gold PEI build plate. However, the temperature bug is the most serious problem, because the printer is overriding the correct G-code temperature and printing PETG 10°C hotter than expected.\nI am seriously considering downgrading the firmware because of this issue.\nWhatsApp Image 2026-07-07 at 00.59.22 (1)\nWhatsApp Image 2026-07-07 at 00.59.22\nMany thanks for the update, I will be downgrading after my first v1.1.6.1 print currently underway. …","textCn":"在固件从以下版本自动更新之后： CR0CN240110C10_R_202605081127_ota_img_V1.1.5.5.img 更新到： CR0CN240110C10_R_202606230954_ota_img_V1.1.6.1.img 我的打印机开始出现异常行为。 出于某种未知原因，打印机现在开始以 250°C 打印 PETG，尽管生成的 G-code 中喷嘴温度是 240°C。 我已经检查了 OrcaSlicer 设置并查看了 G-code 文件。G-code 中的温度是正确的，所以这看起来是打印机固件的 bug。 更新后出现的另一个问题是，当我发送文件打印时，打印机会报错，说无法检测到我的纹理打印板。 作为参考，我原来的纹理板已更换为金色 PEI 打印板。不过温度 bug 是最严重的问题，因为打印机覆盖了正确的 G-code 温度，比预期高出 10°C 来打印 PETG。 因为这个问题，我正在认真考虑降级固件。 WhatsApp Image 2026-07-07 at 00.59.22 (1) WhatsApp Image 2026-07-07 at 00.59.22 非常感谢这次更新，我在完成目前正在进行的第一次 v1.1.6.1 打印后就会降级。……","truncated":true,"url":"https://forum.creality.com/t/bug-firmware-v1-1-6-1-overrides-petg-temperature-to-250-c-and-fails-to-detect-textured-pei-build-plate/52323","productLine":"thirdparty","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":143,"likeCount":0,"sourceType":"论坛"},{"uid":"aae51e92ef0b73ed","date":"2026-07-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Low Consumables Balance Reminder","titleCn":"耗材余量不足提醒","originalText":"Low Consumables Balance Reminder","textCn":"耗材余量不足提醒","truncated":false,"url":"https://forum.creality.com/t/low-consumables-balance-reminder/52289","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":252,"likeCount":0,"sourceType":"论坛"},{"uid":"d665d063c47a81c9","date":"2026-07-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"mutiple colours on same level","titleCn":"同一层上的多种颜色","originalText":"Hi, my first print on the new sparkxi7 was the sparkx keylabel in three different colours. A base in one colour, the word ‘spark’ in a second and the ‘x’ in a third colour. The last two have the same height on the base and I am wondering, with what settings in Creality Print I can achieve that on another model. Thanks in advance.\nIf the model already contains separate bodies for the base, “spark,” and the “X,” the process is straightforward. Import the model into Creality Print, then assign a different filament to each body before slicing. If the model is a single solid object, use the Color Painting feature instead. The Fill tool works well for isolated letters, while the Height Range tool is ideal when all raised text starts at the same layer, just like the SparkX key label. Creality’s official guide explains these painting tools and the complete workflow in detail: How to Create Multi-Color Prints with Color Painting in Creality Print . You can also find additional documentation in the Creality Wiki: Introduction to the Color Painting Feature . …","textCn":"你好，我在新的 SparkX i7 上的第一次打印是三色 SparkX 键帽标签。底座一种颜色，单词“spark”第二种颜色，“x”第三种颜色。最后两个在底座上高度相同，我想知道在 Creality Print 中用什么设置可以在另一个模型上实现这一点。提前感谢。如果模型已经包含底座、“spark”和“X”的独立实体，过程就很直接。将模型导入 Creality Print，然后在切片前为每个实体分配不同的耗材。如果模型是单一实体对象，则改用颜色绘制功能。填充工具非常适合孤立的字母，而当所有凸起文字都从同一层开始时，高度范围工具是理想选择，就像 SparkX 键帽标签一样。Creality 的官方指南详细解释了这些绘制工具和完整工作流程：如何在 Creality Print 中使用颜色绘制创建多色打印。你还可以在 Creality Wiki 中找到更多文档：颜色绘制功能简介。…","truncated":true,"url":"https://forum.creality.com/t/mutiple-colours-on-same-level/52282","productLine":"print","version":"","versionRaw":"","problemType":"","model":"SPARKX i7","grade":"泛讨论","replyCount":5,"views":100,"likeCount":0,"sourceType":"论坛"},{"uid":"b31221cea88231af","date":"2026-07-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Problem with Creality Print 7.2 filament profiles","titleCn":"Creality Print 7.2 耗材配置的问题","originalText":"Just updated to version 7.2 fully aware that I might have to re import my filament profiles. Sure enough I lost all my profiles. I followed Crealitys process to restore everything, but they still aren’t showing up. The filament settings has a system and user tab now. I’m assuming the user tab should have all my profiles, but it’s completely blank. Has anyone else had this issue?\nTry looking in the folder C:\\Users\\[User]\\AppData\\Roaming\\Creality\\Creality Print\\7.0\\user\\default\\filament and import from there\nAnd how can I import?","textCn":"刚更新到 7.2 版本，我很清楚可能需要重新导入我的耗材配置(参数配置)。果然，我所有的配置都没了。我按照 Creality 的流程恢复所有内容，但它们仍然没有显示出来。耗材设置现在有系统和用户两个标签页。我猜用户标签页里应该有我所有的配置，但它是完全空的。还有别人遇到这个问题吗？ 试试查看文件夹 C:\\Users\\[User]\\AppData\\Roaming\\Creality\\Creality Print\\7.0\\user\\default\\filament 并从那里导入 那我要怎么导入？","truncated":false,"url":"https://forum.creality.com/t/problem-with-creality-print-7-2-filament-profiles/52286","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":211,"likeCount":0,"sourceType":"论坛"},{"uid":"659fe603b327bf07","date":"2026-07-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Shop - Member Exclusive","titleCn":"Creality 商店——会员专享","originalText":"Anyone understand the logic of the “Member Exclusive” items in the Creality Shop where you can spend your earned points? The only items that are attainable and I feel are worth buying are the dryers and as soon as I get anywhere near the points they became member exclusive. It is not as if they are at a discounted rate, the point conversion is higher than the price you would pay in the shop.\nI cannot see that the benefits gained from premium membership are anywhere near worth the price anyway so I suppose I will save the annual fee and just buy the dryer.\nPaul","textCn":"有人能理解 Creality 商店里那些可以花积分兑换的“会员专享”商品的逻辑吗？唯一能兑换到、而且我觉得值得买的商品就是干燥盒，可每次我的积分快接近时，它们就变成会员专享了。它们并不是打折价，积分换算下来比你在商店里直接付的钱还高。 反正我看不出高级会员带来的好处哪里值这个价，所以我想我会省下年费，直接买干燥盒。 Paul","truncated":false,"url":"https://forum.creality.com/t/creality-shop-member-exclusive/52280","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":40,"likeCount":0,"sourceType":"论坛"},{"uid":"38ff6ce93f5e334f","date":"2026-07-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Full Spectrum Color Mixing","titleCn":"全光谱混色","originalText":"Full Spectrum Color Mixing","textCn":"全光谱混色","truncated":false,"url":"https://forum.creality.com/t/full-spectrum-color-mixing/52272","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":118,"likeCount":0,"sourceType":"论坛"},{"uid":"6fae66cea236cd26","date":"2026-07-03","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Start print big problem","titleCn":"开始打印大问题","originalText":"Hello,\nI have calibrated full K2 SE => succefull.\nI load my modele (same model, never problem before) , the printer begin to initialized, and in right corner, big problem, see video.\ndefect\nThank for help. regards\nwhat firware u had when this happend? creality launched a lot of firmware updates for that printer\nHi it is the last, but I find, my problem is in my stl generated by Tinker cad, Z negatif….","textCn":"你好，我对 K2 SE 做了完整校准 => 成功。我加载我的模型（同一个模型，以前从没出过问题），打印机开始初始化，然后右下角出现大问题，见视频。缺陷。感谢帮助。此致。你遇到这个时用的是哪个固件？Creality 为那台打印机发布了很多固件更新。你好，是最新的，但我发现我的问题出在我用 Tinker cad 生成的 STL 上，Z 轴为负……","truncated":false,"url":"https://forum.creality.com/t/start-print-big-problem/52267","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2","grade":"有效","replyCount":6,"views":64,"likeCount":0,"sourceType":"论坛"},{"uid":"b2ff268beeedd2e5","date":"2026-07-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can't edit most Filament settings in Creality Print 7.1","titleCn":"在 Creality Print 7.1 中无法编辑大多数耗材设置","originalText":"Good afternoon, I am trying to add a new filament preset for a non-creality PETG I bought. I have created a new preset from the Generic PETG using the “save as”, but even then I can’t edit settings like Model fan speeds. Max volumetric speed, flow ratio, bed temperature, and so on. Whenever I try clicking the boxes they just dont allow me to input text, almost like they are locked / grayed out.\nI have tried setting my user role to Professional, but even then I cant edit most settings.\nAm I missing something or is my program broken?","textCn":"下午好，我正在为我买的一款非 Creality 的 PETG 添加新的耗材预设。我用“另存为”从 Generic PETG 创建了一个新预设，但即便如此，我也无法编辑模型风扇速度、最大体积速度、流量比例、热床温度等设置。每当我尝试点击这些输入框时，它们就是不让我输入文字，几乎像是被锁定/灰掉了。\n我试过把我的用户角色设为 Professional，但即便如此我也无法编辑大多数设置。\n是我漏掉了什么，还是我的程序坏了？","truncated":false,"url":"https://forum.creality.com/t/cant-edit-most-filament-settings-in-creality-print-7-1/52248","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":62,"likeCount":0,"sourceType":"论坛"},{"uid":"e7f47284497f4c75","date":"2026-07-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"OrcaSlicer 2.4.1 — K2 Pro CFS + Device Control Findings","titleCn":"OrcaSlicer 2.4.1 —— K2 Pro CFS + 设备控制的发现","originalText":"For anyone running OrcaSlicer 2.4.1 with a K2 Pro, here’s what I’ve found on connection methods and what actually works.\nThe Setup That Works\nHost Type: CrealityPrint\nPrinter Agent: CrealityPrint\nHostname: 192.168.1.xx:4408 (your printer’s IP + port 4408)\nSee screenshot below.\nWhat You Get\nDevice control through OrcaSlicer — printer status, temps, print management — all functional\nCFS filament slots visible and manageable\nPrints send and run without issue\nWhat You Don’t Get\nCamera — the K2 Pro uses WebRTC architecture that OrcaSlicer cannot access regardless of connection method. This is a hardware/firmware limitation, not an OrcaSlicer issue.\nBackground\nPrior to 2.4.x the only working OrcaSlicer path was Octo/Klipper at :4408, which gave device control but no CFS sync. The CrealityPrint host type added in 2.4.x adds CFS sync — and using :4408 in the hostname field is what restores device control alongside it.\nCamera remains the outstanding limitation. If anyone has found a workaround post below.\nI think you need to use Creality Print or the Creality web/mobile interface to view the camera. Creality Print - Creality Slicer Softwares Download\nTry ip_address:8000","textCn":"对于任何在 K2 Pro 上运行 OrcaSlicer 2.4.1 的人，这是我关于连接方式以及实际有效的内容的发现。有效的设置：主机类型：CrealityPrint 打印机代理：CrealityPrint 主机名：192.168.1.xx:4408（你打印机的 IP + 端口 4408）见下方截图。你能得到什么：通过 OrcaSlicer 进行设备控制——打印机状态、温度、打印管理——全部可用；CFS 耗材槽可见且可管理；打印任务可以发送并正常运行。你得不到什么：摄像头——K2 Pro 使用 WebRTC 架构，无论用什么连接方式，OrcaSlicer 都无法访问。这是硬件/固件限制，不是 OrcaSlicer 的问题。背景：在 2.4.x 之前，唯一可用的 OrcaSlicer 路径是 :4408 上的 Octo/Klipper，它能提供设备控制但不支持 CFS 同步。2.4.x 新增的 CrealityPrint 主机类型增加了 CFS 同步——而在主机名字段中使用 :4408 正是让设备控制与之同时恢复的原因。摄像头仍然是未解决的限制。如果有人找到了变通方法，请在下面发帖。我认为你需要使用 Creality Print 或 Creality 网页/移动界面来查看摄像头。Creality Print - Creality 切片软件下载。试试 ip_address:8000","truncated":false,"url":"https://forum.creality.com/t/orcaslicer-2-4-1-k2-pro-cfs-device-control-findings/52221","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":3,"views":493,"likeCount":0,"sourceType":"论坛"},{"uid":"5c3aa7efbd1607d1","date":"2026-07-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.2 Issue","titleCn":"Creality Print 7.2 的问题","originalText":"Since updating from 7.1 to 7.2 now all my previous project files will not open. It say’s there is no geometry in the project file which is not the case as all the project files opened ok in 7.1\nI have not encountered this (yet). Is there anything about the files that do not open, or is it consistent across all files? I am assuming these are project files, yes?\nStrange behavior.\nI assume you have restarted your computer after installation?\n7.2 has been working excellent for me.\nLet us know if you can resolve the issue.","textCn":"从 7.1 更新到 7.2 之后，我之前所有的项目文件都打不开了。它说项目文件里没有几何体，但事实并非如此，因为这些项目文件在 7.1 里都能正常打开 我（还）没有遇到这个情况。那些打不开的文件有什么特别之处吗，还是所有文件都一致如此？我猜这些是项目文件，对吧？ 奇怪的行为。 我猜你安装后重启过电脑了？ 7.2 对我来说一直运行得很好。 如果你能解决这个问题，请告诉我们。","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-2-issue/52219","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"other","model":"未标注","grade":"有效","replyCount":10,"views":662,"likeCount":2,"sourceType":"论坛"},{"uid":"21c2c06db0671b01","date":"2026-07-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print v7.2.0 Release","titleCn":"Creality Print v7.2.0 发布","originalText":"We’re excited to announce the release of Creality Print v7.2.0 , bringing AI-powered workflows, enhanced multi-color printing, and improved slicing accuracy for a smarter and more reliable printing experience.\nWhat’s New\nAI Workflow (Beta)\nIntroduced an AI-guided printing workflow for a more intuitive and user-friendly experience.\nAI now assists with model import, model validation, automatic repair, and intelligent filament mapping.\nAdded AI-powered print risk analysis, pre-print inspection, parameter recommendations, and the AI Knowledge Assistant.\nEnhanced Multi-Color Printing\nAdded Mixed Filaments , enabling the creation of new colors by stacking different filament layers.\nAdded support for importing color OBJ files with automatic color clustering and intelligent filament mapping.\nIntroduced Purge to Object Skeleton (Experimental) to intelligently reduce purge waste during multi-color printing.\nSmarter Slicing & Better Reliability\nOptimized print time estimation for single-color models, reducing estimation error to within 5% .\nUpgraded the support generation algorithm with the new Validate & Repair Supports feature for improved print reliability. …","textCn":"我们很高兴宣布 Creality Print v7.2.0 发布，带来 AI 驱动的工作流、增强的多色打印以及更高的切片精度，带来更智能、更可靠的打印体验。 新增内容 AI 工作流（Beta） 引入了 AI 引导的打印工作流，带来更直观、更友好的体验。 AI 现在可协助模型导入、模型校验、自动修复和智能耗材映射。 新增 AI 驱动的打印风险分析、打印前检查、参数推荐和 AI 知识助手。 增强的多色打印 新增混合耗材，可通过堆叠不同耗材层来创造新颜色。 新增对导入彩色 OBJ 文件的支持，具备自动颜色聚类和智能耗材映射。 引入废料转入对象骨架（实验性），可在多色打印时智能减少废料。 更智能的切片与更好的可靠性 优化了单色模型的打印时间估算，将估算误差降低到 5% 以内。 升级了支撑生成算法，新增校验并修复支撑功能，提升打印可靠性。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-v7-2-0-release/52215","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":12,"views":976,"likeCount":14,"sourceType":"论坛"},{"uid":"53756c42916fdbbf","date":"2026-06-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","title":"New Firmware For Creality HI V1.1.0.73","titleCn":"Creality HI 新固件 V1.1.0.73","originalText":"Hi everyone, creality just realesed the new firmware for the printer creality hi, the firmware is:\nCR4NU200360C20_ota_img_V1.1.0.73.img\nDo you guys tried? anything to say?\nCamera initially took a very long time to start for me but is now working on Windows Creality Print 7.1.1.4472 with this new firmware v1.1.0.73.\nCamera also working in Windows Creality Print version 7.2.0.5225. Doing a 5 hr print to check the rest of the features.\nj’attend les retours , les bug du V1.1.0.72 m’on servi de leçon","textCn":"大家好，Creality 刚刚发布了 Creality HI 打印机的新固件，固件是： CR4NU200360C20_ota_img_V1.1.0.73.img 你们试过吗？有什么想说的？ 摄像头一开始启动花了很长时间，但现在用这个新固件 v1.1.0.73 在 Windows 版 Creality Print 7.1.1.4472 上能正常工作了。 摄像头在 Windows 版 Creality Print 7.2.0.5225 中也能用。正在做一次 5 小时的打印来检查其余功能。 我等反馈，V1.1.0.72 的 bug 已经给我教训了","truncated":false,"url":"https://forum.creality.com/t/new-firmware-for-creality-hi-v1-1-0-73/52194","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":3,"views":218,"likeCount":0,"sourceType":"论坛"},{"uid":"03d6eab4df8a5b99","date":"2026-06-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.2 PETG Temperature Bug Confirmed by Support","titleCn":"支持团队确认 Creality Print 7.2 的 PETG 温度缺陷","originalText":"Just a heads-up for anyone using Creality Print 7.2 with PETG, especially eSUN PETG.\nAfter updating from Creality Print 7.1 to 7.2, my PETG filament profiles were affected. The recommended nozzle temperature range still looked normal, but the actual first-layer and other-layer print temperatures were changed to 200°C. Because of this, the printer could not extrude PETG properly.\nOn the Creality K2 Plus itself, the filament still showed eSUN PETG with the correct range of around 230°C to 260°C, so the issue seems to be with the slicer/software profile after the update.\nI contacted Creality support, and they confirmed that this is a bug in the latest software version. Their advice was to uninstall the current version and install an older version of Creality Print. They specifically suggested trying version 7.1.1.4472_Release while their software team works on the bug.\nFor now, before printing PETG in Creality Print 7.2, double-check your filament profile and make sure the actual print temperature is correct, not just the displayed recommended range.\nHope this helps someone avoid failed PETG prints. …","textCn":"提醒一下所有在 Creality Print 7.2 中使用 PETG 的人，尤其是 eSUN PETG。从 Creality Print 7.1 更新到 7.2 后，我的 PETG 耗材配置受到了影响。推荐的喷嘴温度范围看起来还正常，但实际的首层和其他层打印温度被改成了 200°C。因此，打印机无法正常挤出 PETG。在 Creality K2 Plus 本机上，耗材仍然显示 eSUN PETG 和正确的约 230°C 到 260°C 范围，所以问题似乎出在更新后的切片软件/软件配置上。我联系了 Creality 支持，他们确认这是最新软件版本中的一个缺陷。他们的建议是卸载当前版本并安装旧版 Creality Print。他们特别建议尝试 7.1.1.4472_Release 版本，同时他们的软件团队正在修复这个缺陷。目前，在 Creality Print 7.2 中打印 PETG 之前，请仔细检查你的耗材配置，确保实际打印温度正确，而不只是显示的建议范围。希望这能帮助某人避免 PETG 打印失败。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-7-2-petg-temperature-bug-confirmed-by-support/52208","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":2,"views":257,"likeCount":4,"sourceType":"论坛"},{"uid":"053b31c50a30b2ae","date":"2026-06-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print device grey screen","titleCn":"Creality Print 设备灰屏","originalText":"Hi,\nI went to make a new print today. I sliced the file and went to print and it failed. I went to look at my device on the software and received a grey screen. Thought it may just be a software issue so uninstalled it and downloaded the same version again still the same. Did the same uninstalled and downloaded an older version and the same again I’m now thinking it’s to do with something on my laptop but haven’t a clue what could be causing it. Also to mention the online model tab is also giving me the same grey screen. My internet is working fine and I’ve checked the permissions and they’re all good. Any help would be much appreciated.\nHi\nI have just had the same issue, grey screen and printer not recognised even after I input the correct IP address. I was on 4.3.9 for the last 12 months no problems.\nI did not want to upgrade because I use a V3 SE with nebula pad mod.\nSo last night I downloaded Creality Print 7.1, updated to latest version and loaded the printer with no problems.\nAfter getting to grips with settings etc. I printed with PETG and was very surprised to find a flawless first layer,\nwith no stringing and the speed is MUCH faster than previous. …","textCn":"你好， 我今天想做一次新的打印。我切好了文件去打印，结果失败了。我去软件里看我的设备，收到一个灰屏。我想可能只是软件问题，所以卸载了它并重新下载了同一个版本，还是一样。同样卸载并下载了一个旧版本，还是一样，我现在觉得这和我笔记本上的某个东西有关，但我一点头绪都没有可能是什么造成的。还要提一下，在线模型选项卡也给我同样的灰屏。我的网络正常，我也检查了权限，都没问题。任何帮助都非常感谢。 你好 我刚遇到同样的问题，灰屏，而且即使我输入了正确的 IP 地址，打印机也识别不出来。过去 12 个月我一直用 4.3.9，没有问题。 我不想升级，因为我用的是带 nebula pad 改装的 V3 SE。 所以昨晚我下载了 Creality Print 7.1，更新到最新版本，毫无问题地加载了打印机。 在熟悉了设置等之后。我用 PETG 打印，非常惊讶地发现首层完美无瑕， 没有拉丝，而且速度比之前快得多。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-device-grey-screen/52171","productLine":"cloud","version":"","versionRaw":"","problemType":"other","model":"未标注","grade":"有效","replyCount":3,"views":91,"likeCount":0,"sourceType":"论坛"},{"uid":"57378b65acddae9e","date":"2026-06-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.0 Vase Mode","titleCn":"Creality Print 7.0 花瓶模式","originalText":"Maybe I’ve gone brain dead, but for the life of me I can’t remember how to take the top layer off of all the vase models I have. Every vase I slice has a sealed top. It’s not infill because when looking at the slice, once I get past the top two layers, it’s an open vase. What has this 80 year old brain forgotten?\nI don’t remember doing anything of the kind when I select vase mode (on my K2).\nBut, have you tried to select 0 top layers? Just to see if it changes anything.\nThat’s strange. Why do your vases have a sealed top? Can you be more specific or post a screenshot of the slicer setting and slice window (Windows 11 just press “print screen” and save it). What did you use to create the model? I’ve never had that issue in hundreds of vases printed.","textCn":"也许我脑子不好使了，但我怎么也想不起来如何去掉我所有花瓶模型的顶层。我切片的每个花瓶都有一个封闭的顶部。不是填充的问题，因为看切片时，过了顶部两层之后，它就是一个开放的花瓶。我这个 80 岁的脑子忘了什么？我不记得在选择花瓶模式时（在我的 K2 上）做过类似的事情。不过，你试过选择 0 顶层吗？只是看看有没有变化。这很奇怪。为什么你的花瓶有封闭的顶部？你能说得更具体些，或者贴一张切片软件设置和切片窗口的截图吗（Windows 11 只需按“print screen”并保存）。你用什么创建模型的？我打印过几百个花瓶，从未遇到过这个问题。","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-0-vase-mode/52140","productLine":"print","version":"7.0","versionRaw":"7.0","problemType":"","model":"K2","grade":"泛讨论","replyCount":6,"views":173,"likeCount":2,"sourceType":"论坛"},{"uid":"9fa9e2a97946c125","date":"2026-06-23","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Bowser King of the Koopas","titleCn":"库巴，龟壳之王","originalText":"Used fanforge to convert my photo of Bowser from his castle in Super Nintendo Land and printed it in Creality black PLA. Used Creality Print Al to optimise the settings. It came out awesome, my son is very impressed and wants one 10x bigger!\n3D Printer Files | 3MF File | Bowser\nPrinted the Bowser from his castle in Super Nintendo Land. Used Creality Print AI to optimise the settings.\nIMG_6457\nIMG_6387\nIMG_4150\nIMG_6461\nIMG_6460\nIMG_6459\nIMG_6458","textCn":"用 fanforge 把我拍的库巴在任天堂世界城堡里的照片转换出来，并用 Creality 黑色 PLA 打印了它。用 Creality Print Al 优化了设置。效果棒极了，我儿子非常喜欢，还想要一个放大 10 倍的！3D 打印机文件 | 3MF 文件 | Bowser。打印了任天堂世界城堡里的库巴。用 Creality Print AI 优化了设置。IMG_6457 IMG_6387 IMG_4150 IMG_6461 IMG_6460 IMG_6459 IMG_6458","truncated":false,"url":"https://forum.creality.com/t/bowser-king-of-the-koopas/52088","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":24,"likeCount":0,"sourceType":"论坛"},{"uid":"ee56436b234280c5","date":"2026-06-22","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.2 Beta","titleCn":"Creality Print 7.2 Beta","originalText":"I tested out the AI in the new Creality print 7.2 beta. I told it to find a Darth Vader model, which it did. I then told it to optimize the settings for the best surface finish possible from the K2 with a 0.4mm nozzle. I accepted the recommendations, mapped the filament, and crossed my fingers. I have to say i was very satisfied with the finished product! I will be more specific with the support settings in the future but the AI is definitely on the right track for ease of use and results.\nIMG_6401\nIMG_6400\nIMG_6447\nIMG_6448\nIMG_6449\nIMG_6450\nAre there any way to download and test beta versions? Are there a beta program?\nTIA\nIt’s in the discord group","textCn":"我测试了新的 Creality print 7.2 beta 里的 AI。我让它找一个大黑暗尊主（Darth Vader）模型，它找到了。然后我让它针对配 0.4mm 喷嘴的 K2 优化设置，以获得尽可能最好的表面效果。我接受了建议，映射了耗材，然后祈祷。我得说我对成品非常满意！以后我会把支撑设置说得更具体，但 AI 在易用性和结果上绝对走对了方向。 IMG_6401 IMG_6400 IMG_6447 IMG_6448 IMG_6449 IMG_6450 有没有办法下载并测试 beta 版本？有 beta 计划吗？ TIA 在 discord 群里","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-2-beta/52063","productLine":"print","version":"7.2","versionRaw":"7.2","problemType":"quality","model":"K2","grade":"有效","replyCount":11,"views":746,"likeCount":4,"sourceType":"论坛"},{"uid":"8a1c2eec6f870782","date":"2026-06-20","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Issues with Creality Print","titleCn":"Creality Print 的问题","originalText":"I have 2 Ender 3 v3 SE and a Sonic Pad, everything is on current firmware. My system is an AMD with 64GB RAM and Win 11 Pro, again everything is up to date. I have tried sending file to the printers via USB and via WIFI, I have changed speeds and many other parameters, I replaced the y belt on one of the printers, I have attached 2 files that show the issues with the y axis (yes I checked all of the possible issues I could find and corrected them) . The arrow shows the front of the print bed. It looks like the Y axis loses its origin.\nI finally went to Orca Slicer and imported my settings from my current models. Files are now printing great, so I have to ask what is the issue? I am ready to sell and reinvest in a Bambu A1 combo. I would rather not spend the money if I didn’t have to. The the Creality Print really that bad?\n0\n4901\nInstead of connecting the printer via USB to your computer use a Rapbery Pie with octoprint… The USB-connection is not stable nor is Windows… I have used Raspbery Pie with octorint for many many years…\nTo answer directly: Yes, Creality Print can genuinely be that problematic. …","textCn":"我有 2 台 Ender 3 v3 SE 和一个 Sonic Pad，所有设备都是当前固件。我的系统是 AMD，64GB 内存，Win 11 Pro，同样一切都是最新的。我试过通过 USB 和 WIFI 把文件发送到打印机，我更改过速度和许多其他参数，我给其中一台打印机换了 y 轴皮带，我附上了 2 个显示 y 轴问题的文件（是的，我检查了我能找到的所有可能问题并做了修正）。箭头指向打印热床的前方。看起来 Y 轴失去了它的原点。我最终换到了 Orca Slicer，并从当前的模型导入了我的设置。现在文件打印得很好，所以我不得不问，问题到底是什么？我准备卖掉它，再投资一台 Bambu A1 combo。如果不是没必要，我宁愿不花这笔钱。Creality Print 真的那么差吗？0 4901。与其用 USB 把打印机连接到电脑，不如用树莓派配合 octoprint……USB 连接不稳定，Windows 也不稳定……我很多很多年都在用树莓派配合 octorint……直接回答：是的，Creality Print 确实可能真的那么成问题。……","truncated":true,"url":"https://forum.creality.com/t/issues-with-creality-print/52042","productLine":"thirdparty","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3","grade":"泛讨论","replyCount":3,"views":94,"likeCount":0,"sourceType":"论坛"},{"uid":"4ee226fa0beaa24f","date":"2026-06-18","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Supports","titleCn":"支撑","originalText":"How can i use in the same part tree supports and normal supports?","textCn":"如何在同一个零件上同时使用树状支撑和普通支撑？","truncated":false,"url":"https://forum.creality.com/t/supports/52001","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":38,"likeCount":0,"sourceType":"论坛"},{"uid":"22e4f1b661885b7c","date":"2026-06-16","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"About printing time","titleCn":"关于打印时间","originalText":"The initial printing and color filament printing take way too long. It’s so frustrating. Can’t something be done about it?\n… print in one color and paint the object\nPrinting in multi-color is time-consuming… you can do it faster with a printer that changes toolhead instead of filament…","textCn":"初始打印和彩色耗材打印花的时间太长了。太让人沮丧了。就不能做点什么吗？……用单色打印然后给物体上色。多色打印很耗时……用更换工具头的打印机而不是更换耗材的打印机可以更快……","truncated":false,"url":"https://forum.creality.com/t/about-printing-time/51965","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":25,"likeCount":0,"sourceType":"论坛"},{"uid":"c274e7be8bc2a2f2","date":"2026-06-15","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"ZH","title":"🏕 Camping Gear Design Contest is Open!","titleCn":"🏕 露营装备设计大赛开始啦！","originalText":"Calling all makers, designers, and outdoor enthusiasts!\nWe’re inviting you to create innovative 3D printable camping gear that makes outdoor adventures more fun, practical, and creative.\nFire up your printer\nUnleash your creativity\nPrint Your Adventure\nJoin the challenge and share your best design with the community!\n1080_1350（有文字）品牌广告-IG","textCn":"召集所有创客、设计师和户外爱好者！ 我们邀请你创作创新的可 3D 打印露营装备，让户外探险更有趣、更实用、更有创意。 启动你的打印机 释放你的创造力 打印你的冒险 加入挑战，与社区分享你最好的设计！ 1080_1350（有文字）品牌广告-IG","truncated":false,"url":"https://forum.creality.com/t/camping-gear-design-contest-is-open/51951","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":111,"likeCount":3,"sourceType":"论坛"},{"uid":"499657dca13de38c","date":"2026-06-14","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Print Default filament parameters do not match Creality Wiki","titleCn":"打印默认耗材参数与 Creality Wiki 不一致","originalText":"The default filament printing parameters in version V7.1.1.4472 do not match the parameters listed on my K1C or on the Crealty Wiki site, K1 Flagship Series Complete Recommended Filament Parameters | Creality Wiki .\nWhat is the best way to resolve this discrepancy?\nThank you for your help.","textCn":"V7.1.1.4472 版本中的默认耗材打印参数与我的 K1C 上列出的参数或 Crealty Wiki 网站上的参数不一致，K1 旗舰系列完整推荐耗材参数 | Creality Wiki。解决这一差异的最佳方法是什么？感谢你的帮助。","truncated":false,"url":"https://forum.creality.com/t/print-default-filament-parameters-do-not-match-creality-wiki/51939","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"","model":"K1C","grade":"泛讨论","replyCount":1,"views":25,"likeCount":0,"sourceType":"论坛"},{"uid":"613d3e959e717393","date":"2026-06-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7.1.1.4472 Camera Images degraded on Linux vs Windows","titleCn":"Creality Print 7.1.1.4472 摄像头图像在 Linux 上比 Windows 上画质下降","originalText":"I have a Logitech C920 webcam connected to my Creality Hi USB port.\nI dual boot the same PC into Linux Mint 22.3 and Windows 11 so hardware is identical in both cases.\nI am using the same version 7.1.1.4472 of Creality Print on both systems.\nIn Windows the camera shows up just fine using the Creality Print app.\nScreenshot 2026-06-13 154340\nIn Linux Mint the image is distrorted as can be seen below.\nUntitled_001\nIs there anything I can do to improve the image I get in Linux Mint?\nThanks.\nMike\nuser3033132230:\nLogitech C920 webcam\nWhat I would do is to check if webcam works properly in linux using for example Cheese ,Guvcview…. not thru creality print, to see if there is maybe driver or whatever issue. Maybe missing some codecs , since it is streaming from printer.\nSorry i couldn’t help more\nJust stuck the camera into the computer running Linux Mint 22.3 and ran guvcview and here’s the image, just a-ok.\nSelection_008\nAlso plugged the camera into a completely seperate laptop also running Linux Mint 22.3 just incase and it works fine too. …","textCn":"我有一个罗技 C920 网络摄像头，连接到我的 Creality Hi 的 USB 接口。我把同一台电脑双系统启动到 Linux Mint 22.3 和 Windows 11，所以两种情况硬件完全相同。我在两个系统上使用的是同一版本 7.1.1.4472 的 Creality Print。在 Windows 上，使用 Creality Print 应用时摄像头显示完全正常。 Screenshot 2026-06-13 154340 在 Linux Mint 中图像严重扭曲，如下图所示。 Untitled_001 我在 Linux Mint 里能做什么来改善图像吗？谢谢。 Mike user3033132230： 罗技 C920 网络摄像头 我会做的是用比如 Cheese、Guvcview……来检查摄像头在 Linux 下是否正常工作，而不是通过 Creality Print，看看是不是驱动之类的问题。也可能是缺少一些编解码器，因为它是从打印机串流过来的。抱歉没能帮上更多忙 我刚把摄像头插到运行 Linux Mint 22.3 的电脑上，运行了 guvcview，这是图像，完全没问题。 Selection_008 我还把摄像头插到另一台完全独立、也运行 Linux Mint 22.3 的笔记本上以防万一，它也能正常工作。……","truncated":true,"url":"https://forum.creality.com/t/creality-print-7-1-1-4472-camera-images-degraded-on-linux-vs-windows/51925","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"compat","model":"Creality Hi","grade":"有效","replyCount":15,"views":270,"likeCount":0,"sourceType":"论坛"},{"uid":"47e6f0077961a8a9","date":"2026-06-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Opening someone else's .3mf file erases my presets","titleCn":"打开别人的 .3mf 文件会清除我的预设","originalText":"When I opened a downloaded project file, all my existing presets were removed and only the preset contained in the download showed as present. This persisted even after I opened a new instance of the Creality 7 slicer program.\nSo I located and re-imported all my previous presets, but I wanted to know if there is a way to keep this from happening. My workaround for the time being is to save an empty project file containing my presets as “Presets.3mf” and reload that when I want to start fresh. Is that the only way to deal with this?\nthanks\nLJ","textCn":"当我打开一个下载的项目文件时，我所有现有的预设都被移除了，只显示下载文件中包含的那个预设。即使我打开一个新的 Creality 7 切片软件实例，这种情况依然存在。于是我找到并重新导入了之前所有的预设，但我想知道有没有办法防止这种情况发生。我目前的变通方法是把我预设保存为一个空项目文件，命名为「Presets.3mf」，想重新开始时再加载它。这是唯一的办法吗？谢谢 LJ","truncated":false,"url":"https://forum.creality.com/t/opening-someone-elses-3mf-file-erases-my-presets/51929","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"0ca90260a2c5c677","date":"2026-06-13","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Actions grandes","titleCn":"大型作品","originalText":"Gostaria de saber, como fazer um Actions grandes com a impressora pequena. Como fazer o fatiamento.","textCn":"我想知道，如何用小型打印机做一个大型作品。如何进行切片。","truncated":false,"url":"https://forum.creality.com/t/actions-grandes/51916","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"c5b2fea31d1c622e","date":"2026-06-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"CrealityCloud.com - ME removing models from my downloads profile?","titleCn":"CrealityCloud.com - 是我自己从我的下载配置里删除了模型吗？","originalText":"- ME removing models from my downloads profile?","textCn":"- 是我自己从我的下载配置里删除了模型吗？","truncated":false,"url":"https://forum.creality.com/t/crealitycloud-com-me-removing-models-from-my-downloads-profile/51909","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":40,"likeCount":0,"sourceType":"论坛"},{"uid":"99e116f9c15c1069","date":"2026-06-12","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Right side pull out for Creality 7.1","titleCn":"Creality 7.1 右侧的拉出面板","originalText":"Come on people!!! Fix the damn pull out on the right side. This is just basic stuff and you should fix it NOW! Very frustrating. If you are throwing out software without basic testing and fixing, what does that say???","textCn":"拜托各位！！！把右侧那个该死的拉出面板修好。这只是最基础的东西，你们现在就应该修好！非常让人沮丧。如果你们连基础测试和修复都不做就把软件丢出来，这说明了什么？？？","truncated":false,"url":"https://forum.creality.com/t/right-side-pull-out-for-creality-7-1/51903","productLine":"print","version":"7.1","versionRaw":"7.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":24,"likeCount":1,"sourceType":"论坛"},{"uid":"d1e164f50e227097","date":"2026-06-10","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Supports for models in Creality Print 7.1.1.4472","titleCn":"Creality Print 7.1.1.4472 中为模型添加支撑","originalText":"I have recently upgraded to CP 7.1.1.4472. First thing I noticed is that all the local files on my K1 MAX have been deleted. Is there a reason for this? Secondly, I want to add supports to some of my models. I have looked everywhere (I think) but I am unable to find the tab / menu / button. Please can someone point me in the right direction. Thank you in advance. Paul\n… updating CP should not delete any stored files… for as far as I know, files on the printer are only deleted with a firmware upgrade… So always keep your Gcode-files stored on your computer as backup!\nAdding support for printing… see screenshot\nCP_support\nThank you Mr_MBR\nI do store the model files on my PC but this was the first update that had erased them on the K1MAX.\nThis was all I was seeing on my screen and thanks to your reply I spotted a very small arrow in a semi-circle on the extreme right of the screen which then displayed the familiar menu. All good now - thank you. Paul","textCn":"我最近升级到了 CP 7.1.1.4472。我注意到的第一件事是，我 K1 MAX 上所有本地文件都被删除了。这是有原因的吗？其次，我想给一些模型添加支撑。我到处都找过了（我觉得），但找不到那个标签页/菜单/按钮。请谁能给我指个方向。提前感谢。Paul ……更新 CP 不应该删除任何已存储的文件……据我所知，打印机上的文件只有在固件升级时才会被删除……所以一定要把 G-code 文件存在你的电脑上做备份！ 为打印添加支撑……见截图 CP_support 谢谢你 Mr_MBR 我确实把模型文件存在我的 PC 上，但这是第一次更新把 K1MAX 上的文件清掉了。 我的屏幕上当时就只看到这些，多亏你的回复，我发现了屏幕最右边一个很小的半圆里的箭头，点开后显示出了熟悉的菜单。现在都好了——谢谢。Paul","truncated":false,"url":"https://forum.creality.com/t/supports-for-models-in-creality-print-7-1-1-4472/51873","productLine":"firmware","version":"","versionRaw":"","problemType":"","model":"K1 Max","grade":"泛讨论","replyCount":5,"views":81,"likeCount":1,"sourceType":"论坛"},{"uid":"19228df9bdbcf836","date":"2026-06-09","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Status of print API call?","titleCn":"打印状态 API 调用的情况？","originalText":"Anyone know if the Slicer can broadcast/call API with a print status update?\nWhat I’d like to do is change some WS2812 RGB LEDs depending on the status of the print (% finished, error, etc)\n[Edit] Assuming WiFi of BLE comms.\nThoughts?\nThanks.","textCn":"有人知道切片软件能否广播/调用 API 来发送打印状态更新吗？\n我想做的是根据打印状态（完成百分比、错误等）改变一些 WS2812 RGB LED 的颜色\n[编辑] 假设通过 WiFi 或 BLE 通信。\n大家怎么看？\n谢谢。","truncated":false,"url":"https://forum.creality.com/t/status-of-print-api-call/51831","productLine":"print","version":"","versionRaw":"","problemType":"other","model":"Creality Hi","grade":"有效","replyCount":1,"views":23,"likeCount":0,"sourceType":"论坛"},{"uid":"b0c0302d060134ea","date":"2026-06-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Modifiers doesn`t work........?","titleCn":"修改器不起作用........？","originalText":"in Creality Print 7.1.1 Windows 11 the Modifiers doesn`t work.\nAnyone have the same Problem or i am the only?\nI have not seen that problem here.\nThe issue is that “modifiers don’t work” is not enough information for anyone to troubleshoot. That could mean several different things.\nTo get a useful answer, you need to provide some specifics:\nWhat modifier were you trying to use?\nWhat object type were you applying it to?\nWhat exact result did you expect?\nWhat actually happened?\nCan you post a screenshot of the model, the modifier settings, and the area of the interface you are using?\nPeople are usually willing to help, but they need something more concrete than “doesn’t work.”\nI have a frame with 8% Infill. The corners need more infil with a Modifier.\nPicture one you see the frame normal, Picture two you see the Area with Modifier, Picture three you see the infill is the same like picture one.\nPicture 1:\nslicer1\nPicture 2:\nslicer2\nPicture 3:\nslicer3","textCn":"在 Windows 11 的 Creality Print 7.1.1 中，修改器不起作用。有人遇到同样的问题吗，还是只有我？我在这里没见过这个问题。问题是，“修改器不起作用”不足以让任何人排查。这可能意味着几种不同的情况。要得到有用的答案，你需要提供一些具体信息：你尝试使用哪个修改器？你把它应用到什么对象类型上？你期望的确切结果是什么？实际发生了什么？你能贴一张模型、修改器设置以及你所用界面区域的截图吗？人们通常愿意帮忙，但他们需要比“不起作用”更具体的信息。我有一个 8% 填充的框架。角落需要用修改器增加填充。图一你看到框架正常，图二你看到带修改器的区域，图三你看到填充和图一一样。图 1：slicer1 图 2：slicer2 图 3：slicer3","truncated":false,"url":"https://forum.creality.com/t/modifiers-doesn-t-work/51822","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"compat","model":"未标注","grade":"有效","replyCount":4,"views":94,"likeCount":0,"sourceType":"论坛"},{"uid":"8b95e2cf1a3eb0b3","date":"2026-06-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Why Is the Hourly Machine Cost Not Added to the Total Print Cost?","titleCn":"为什么每小时机器成本没有计入打印总成本？","originalText":"Hourly Cost Setting Is Ignored in Print Cost Calculation\nHello Creality Print Team and users,\nI would like to report what appears to be a bug or an unfinished feature in Creality Print.\nI currently own two Creality printers, a Creality Hi and a Creality K2 Plus , and I use Creality Print as my primary slicer for both machines.\nIn the printer settings, there is an option to define an hourly machine cost . This feature is extremely useful for users who sell 3D prints because it helps calculate the true production cost of a part.\nHowever, after slicing a model, the total print cost only includes the filament cost . The hourly machine cost is completely ignored, regardless of the value entered in the printer settings.\nFor example:\nFilament cost: calculated correctly.\nPrint time: displayed correctly.\nHourly machine cost: configured in printer settings.\nTotal print cost: only reflects filament usage.\nAs a result, the estimated print cost is inaccurate and cannot be used to properly calculate selling prices or evaluate the real cost of production.\nI have already contacted support regarding this issue, but I have not received a solution or clarification. …","textCn":"打印成本计算中忽略了每小时成本设置 你好 Creality Print 团队和用户们，我想报告 Creality Print 中一个看起来是 bug 或未完成功能的问题。我目前拥有两台 Creality 打印机，一台 Creality Hi 和一台 Creality K2 Plus，我把 Creality Print 作为这两台机器的主要切片软件。在打印机设置中，有一个选项可以定义每小时机器成本。这个功能对销售 3D 打印件的用户非常有用，因为它有助于计算零件的真实生产成本。然而，切片模型后，打印总成本只包含耗材成本。每小时机器成本被完全忽略，无论打印机设置中输入什么数值。例如：耗材成本：计算正确。打印时间：显示正确。每小时机器成本：在打印机设置中已配置。打印总成本：只反映耗材使用量。因此，估算的打印成本不准确，无法用来正确计算销售价格或评估真实的生产成本。我已经就这个问题联系了支持，但没有收到解决方案或说明。……","truncated":true,"url":"https://forum.creality.com/t/why-is-the-hourly-machine-cost-not-added-to-the-total-print-cost/51820","productLine":"thirdparty","version":"","versionRaw":"","problemType":"ui","model":"K2 Plus","grade":"有效","replyCount":2,"views":94,"likeCount":2,"sourceType":"论坛"},{"uid":"3ab8dfb05e1df0d5","date":"2026-06-08","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"User Filament Settings Unable to be edited in Creality Print 7.1.1.4472 on Linux Mint","titleCn":"在 Linux Mint 上无法编辑 Creality Print 7.1.1.4472 的用户耗材设置","originalText":"I am running Creality Print 7.1.1.4472 on Linux Mint as well as on Windows 11.\nI have 3 nozzle sizes to choose from. 0.4, 0.6 and 0.8mm.\nI can create custom slicing profiles per nozzle size just fine. i.e. 0.2mm Standard @Creality Hi 0.4 nozzle and edit them and save them as my new slicing profiles.\nI cannot create custom user filaments in Linux Mint like I can in Windows 11.\nI would like to be able to edit the user filaments to be able to assign prices, so that the print cost calculator has a realtime view of the print cost based on the nozzle size chosen.\nThis is possible in Windows 11 version of Creality Print 7.1.1.4472 but is not possible in the Linux version.\nPlease fix this so that the Linux version has the same full functionality as the Windows version.\nSelection_005\nI appear to be having this issue also, I dont have a windows machine to try this on but I guess its because I am using Linux. Still looking for a fix!","textCn":"我在 Linux Mint 以及 Windows 11 上运行 Creality Print 7.1.1.4472。 我有 3 种喷嘴尺寸可选：0.4、0.6 和 0.8mm。 我可以按喷嘴尺寸正常创建自定义切片配置。例如 0.2mm Standard @Creality Hi 0.4 nozzle，并编辑它们、保存为我的新切片配置。 在 Linux Mint 里我无法像在 Windows 11 里那样创建自定义用户耗材。 我希望能够编辑用户耗材以便设定价格，这样打印成本计算器就能根据所选喷嘴尺寸实时查看打印成本。 这在 Windows 11 版本的 Creality Print 7.1.1.4472 里是可行的，但在 Linux 版本里不行。 请修复这个问题，让 Linux 版本拥有和 Windows 版本一样的完整功能。 Selection_005 我似乎也有这个问题，我没有 Windows 机器可以试，但我猜是因为我用的是 Linux。仍在寻找解决办法！","truncated":false,"url":"https://forum.creality.com/t/user-filament-settings-unable-to-be-edited-in-creality-print-7-1-1-4472-on-linux-mint/51818","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"compat","model":"Creality Hi","grade":"有效","replyCount":2,"views":48,"likeCount":0,"sourceType":"论坛"},{"uid":"10cb3e89dec70b79","date":"2026-06-07","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Cloud -Creality cfs desiccant holder (for filament sepera... From SCULPTURED_REALITIES https://www.crealitycloud.com/model-detail/6a247fc3a953031a1f9476c0","titleCn":"Creality Cloud - Creality CFS 干燥剂盒（用于耗材分隔… 来自 SCULPTURED_REALITIES https://www.crealitycloud.com/model-detail/6a247fc3a953031a1f9476c0","originalText":"The Creality CFS Desiccant Holder is crafted to enhance filament storage by efficiently housing desiccant beads while fitting seamlessly into the filament separation slot of the CFS. Its sleek and efficient design is perfect for reducing humidity, thereby improving print quality.\nNB.\n(model looks solid until you slice it,\nYOU can adjust hole size by lessening or increasing sparse infill percantage)\nPRINT AT 50% SPEED FOR NEATER OVERHANGS.\nthis model is less likely to be exposed to room moisture when you open your machine as it sits between the filament spools as apposed to the opened front and rear printed desiccant bead holder/trays thus prolonging your silica bead gels while giving maximum protection to your direct spools and filament\nIF YOU STRUGGLE WITH PRINT FAILURES DUE TO MOISTURE,DRY YOUR FILAMENTS FIRST WITH A DRYER,PRINT THESE WHILST DRYING,TOP THEM UP WITH SILICA AND INSTALL FILAMENT WITH CREALITY CFS DESICCANT HOLDER AT SAME TIME FOR OPTIMAL DRYING AND MOISTURE CONTROL OF CFS UNIT\nModel can be found on CrealityCloud (downloads free)\nCreality Cloud -Creality cfs desiccant holder (for filament sepera… From SCULPTURED_REALITIES 3D Printer Files | 3MF File | Creality cfs de …","textCn":"Creality CFS 干燥剂盒的设计旨在通过高效容纳干燥剂颗粒来增强耗材存储，同时无缝装入 CFS 的耗材分隔槽。其简洁高效的设计非常适合降低湿度，从而提升打印质量。\n注意\n（模型在切片之前看起来很实心，\n你可以通过减少或增加稀疏填充百分比来调整孔径）\n以 50% 速度打印可获得更整齐的悬垂。\n当你打开机器时，这个模型较少暴露在室内湿气中，因为它位于耗材盘之间，而不是像前后那种敞开的已打印干燥剂颗粒盒/托盘，从而延长硅胶珠的使用寿命，同时为你的直连料盘和耗材提供最大保护\n如果你因湿气而遭遇打印失败，请先用烘干机干燥你的耗材，在烘干的同时打印这些物件，给它们装满硅胶，并同时用 Creality CFS 干燥剂盒安装耗材，以实现 CFS 单元的最佳干燥和湿度控制\n模型可在 CrealityCloud 上找到（免费下载）\nCreality Cloud - Creality CFS 干燥剂盒（用于耗材分隔… 来自 SCULPTURED_REALITIES 3D 打印文件 | 3MF 文件 | Creality CFS 干 …","truncated":true,"url":"https://forum.creality.com/t/creality-cloud-creality-cfs-desiccant-holder-for-filament-sepera-from-sculptured-realities-https-www-crealitycloud-com-model-detail-6a247fc3a953031a1f9476c0/51799","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":56,"likeCount":0,"sourceType":"论坛"},{"uid":"ab32e2a1c2be183e","date":"2026-06-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Fix the right hand side pull out options on Creality Slicer - not rocket science","titleCn":"修复 Creality 切片软件右侧拉出选项的问题 —— 这不是火箭科学","originalText":"I keep waiting for more people to complain about the fact that half the time you cannot pull out the right hand side option tab so you can see the whole thing. Even on a good day when it “works” you have slide up and down the perimeter line hunting for it. AI says this is a well know problem.\nThis has been brought up before, and at this point it is hard to avoid the obvious conclusion: Creality either does not understand the problem or does not care.\nThe frustrating part is that they started with a good slicer. Orca already worked. Instead of building carefully on top of it, Creality modified working behavior, broke core functions, and shipped the result as if “different” somehow meant “better.”\nTo be fair, they did add a few quality-of-life improvements. The problem is that those improvements are buried under the new problems they introduced. The issues you are describing are not isolated annoyances. They are symptoms of a slicer that is being changed without adequate regression testing.\nSimple example: import an STL or STEP file, modify it in CAD, then refresh the model. STL files refresh. STEP files do not. Why? This is basic workflow functionality. …","textCn":"我一直等着更多人来抱怨这个事实：有一半的时间你无法拉出右侧选项选项卡，从而看到全部内容。即使在“正常”的日子里，它“能用”的时候，你也得沿着周边线上下滑动去寻找它。AI 说这是一个众所周知的问题。这个问题之前就被提过，而现在很难避免一个显而易见的结论：Creality 要么不理解这个问题，要么不在乎。令人沮丧的是，他们一开始有一个很好的切片软件。Orca 本来就能用。Creality 没有在它之上小心构建，而是修改了原本正常的行为，破坏了核心功能，然后把这个结果发布出去，就好像“不同”在某种程度上意味着“更好”。公平地说，他们确实增加了一些提升使用体验的改进。问题是，这些改进被埋在他们引入的新问题之下。你所描述的问题不是孤立的烦恼。它们是一个在没有充分回归测试的情况下被不断修改的切片软件的症状。简单的例子：导入一个 STL 或 STEP 文件，在 CAD 中修改它，然后刷新模型。STL 文件会刷新。STEP 文件不会。为什么？这是基本的工作流程功能。……","truncated":true,"url":"https://forum.creality.com/t/fix-the-right-hand-side-pull-out-options-on-creality-slicer-not-rocket-science/51780","productLine":"thirdparty","version":"","versionRaw":"","problemType":"ui","model":"K2","grade":"有效","replyCount":4,"views":74,"likeCount":1,"sourceType":"论坛"},{"uid":"29280c4ae6fd4506","date":"2026-06-06","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Having huge problem and customer support suck!","titleCn":"遇到巨大问题，而客户支持很糟糕！","originalText":"I’ve almost had it we spend a lot of money on the K2 pro and last firmware up date made it useless. It’s starts a print and stops line 2 wtf ! We depended on it to make money! Now I’m looking around for something else ! Anyone have any ideas what’s up with the new update ?\nHi @Rainbow_fyer !\nSorry that your having trouble with your K2 printer. Please tell us if the printer shows any error code while stopping the print? It is happening with the specific file or have you tried printing any other gcodes?\nBest regards,\nKrzysztof!","textCn":"我几乎受够了，我们在 K2 pro 上花了很多钱，而最近一次固件更新让它变得没法用了。它开始打印然后在第 2 行就停了，搞什么！我们靠它赚钱！现在我正在四处寻找别的东西！有人知道这次新更新出了什么问题吗？\n嗨 @Rainbow_fyer ！\n很抱歉你的 K2 打印机遇到了麻烦。请告诉我们打印机在停止打印时是否显示任何错误码？是只在这个特定文件上发生，还是你试过打印其他 G-code？\n此致，\nKrzysztof！","truncated":false,"url":"https://forum.creality.com/t/having-huge-problem-and-customer-support-suck/51772","productLine":"firmware","version":"","versionRaw":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":43,"likeCount":0,"sourceType":"论坛"},{"uid":"5416bf661d442a4f","date":"2026-06-05","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Recommendations for alternatives to Creality Print (documentation is my major gripe)","titleCn":"Creality Print 替代品推荐（文档是我最大的痛点）","originalText":"After several months of using my K1C, I am ready to pull the plug on Creality software and switch to another slicer. My biggest problem is the scant documentation along with the complex menu system. I suspect there are other settings panels I still don’t know about ‘cos I haven’t randomly clicked on the pixel which opens them).\nWould like to know what users of other slicers have to say. I would be happy to switch to almost any slicer which has online, searchable written documentation. (I am definitely NOT interested in watching a dozen YouTube videos in search of the thirty second segment which might have the answer to my question)\nthanks in advance\nLJ\norcaslicer (which is what creality print is based on)","textCn":"用了几个月的 K1C 之后，我准备彻底放弃 Creality 的软件，换用别的切片软件。我最大的问题是文档太少，再加上复杂的菜单系统。我怀疑还有别的设置面板我根本不知道，因为我一直没碰巧点到那个能把它们打开的像素点）。 想知道用其他切片软件的人怎么说。我乐意换成几乎任何一款有在线可搜索书面文档的切片软件。（我绝对没兴趣看十几个 YouTube 视频，只为找那三十秒可能包含我问题答案的片段） 提前感谢 LJ orcaslicer（creality print 就是基于它做的）","truncated":false,"url":"https://forum.creality.com/t/recommendations-for-alternatives-to-creality-print-documentation-is-my-major-gripe/51759","productLine":"thirdparty","version":"","versionRaw":"","problemType":"ui","model":"K1C","grade":"有效","replyCount":2,"views":48,"likeCount":0,"sourceType":"论坛"},{"uid":"fb110445c63991a5","date":"2026-06-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","title":"Покупки на баллы в creality cloud","titleCn":"在 creality cloud 用积分购物","originalText":"Здравствуйте, спешу поделиться радостью! Сегодня получил посылку от Creality, в приложении Creality Cloud, заработал баллы ( ежедневно посещаю облако и отмечаюсь там, выполняю задания, выкладываю модели и за это получаю вознаграждение) и на них купил катушки пластика и первая сегодня пришла мне по почте, очень рад, что система поощрений реально работает, хочу выразить огромную благодарность производителю Creality и всем сотрудникам этой фирмы за ваш труд и прекрасную продукцию которая позволяет реализовать творческий потенциал и идеи в жизнь.\n20260604_113615\n20260604_113653\n20260604_113648\n20260604_113625\nScreenshot_20260604_205707_Creality Cloud\nЗдравствуйте, сколько дней посылка шла? Тоже катушку заказал, с 23 июля никак не дойдёт.\nЗдравствуйте, заказывал 8 мая в июне приехала, но если долго не идет напишите в техподдержку, в отдел продаж в Creality cloud они напишут вам на электронную почту и сними вопрос по посылке решится очень быстро , а если филамент не отправили баллы вернут у меня был такой опыт.","textCn":"大家好，我迫不及待想分享这份喜悦！今天我收到了 Creality 寄来的包裹，在 Creality Cloud App 里，我赚了积分（我每天访问云端并签到、完成任务、发布模型，以此获得奖励），用这些积分买了塑料料盘，第一盘今天就寄到了，很高兴这个奖励系统真的有效，我想对 Creality 厂商和这家公司所有员工表达极大的感谢，感谢你们的付出和优秀的产品，让人们能把创造力和想法变成现实。 20260604_113615 20260604_113653 20260604_113648 20260604_113625 Screenshot_20260604_205707_Creality Cloud 你好，包裹走了多少天？我也订了一盘，从 7 月 23 日起就一直没到。 你好，我是 5 月 8 日下单的，六月到的，但如果很久没到，就写信给技术支持，Creality Cloud 的销售部门，他们会发邮件给你，包裹的问题会很快解决，如果耗材没发货，积分会退还，我有过这样的经历。","truncated":false,"url":"https://forum.creality.com/t/creality-cloud/51712","productLine":"cloud","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":78,"likeCount":1,"sourceType":"论坛"},{"uid":"0a0a8d4be00c81cf","date":"2026-06-04","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"App Crash on Filament Profile Access After Update – v7.1.1.4472 macOS M4","titleCn":"更新后在访问耗材配置时应用崩溃 —— v7.1.1.4472 macOS M4","originalText":"Subject: Creality Print 7.1.1.4472 — Crash on Filament Profile Access / Cloud Sync Loop (macOS, M4)\nDevice: Mac Mini M4 OS: macOS Sequoia App Version: Creality Print 7.1.1.4472 Printer: Creality Hi\nIssue: Since updating to version 7.1.1.4472, Creality Print crashes consistently when accessing filament profiles. The issue began on approximately May 27, 2026 and has persisted across every session since.\nConfirmed from logs:\nOn startup, dozens of system config files throw errors for deprecated keys ( material_flow_dependent_temperature , material_flow_temp_graph ) that were removed in the new version but still exist in the installed system profiles.\nEvery time the filament panel is opened, the app enters a runaway loop attempting to sync filament presets to Creality Cloud, receiving repeated status=429 and error code 1088 responses (“Please do not repeat the same operation many times”). This loop appears to cause the crash.\nIn one session, loading a 3MF file caused the filename to be logged dozens of times in rapid succession, suggesting a second runaway loop triggered by file loading. …","textCn":"主题：Creality Print 7.1.1.4472 —— 访问耗材配置时崩溃 / 云同步循环（macOS，M4）设备：Mac Mini M4 操作系统：macOS Sequoia 应用版本：Creality Print 7.1.1.4472 打印机：Creality Hi。问题：自从更新到 7.1.1.4472 版本后，Creality Print 在访问耗材配置时持续崩溃。该问题大约始于 2026 年 5 月 27 日，此后每次会话都会出现。从日志确认：启动时，数十个系统配置文件因已弃用的键（material_flow_dependent_temperature、material_flow_temp_graph）报错，这些键在新版本中已被移除，但仍存在于已安装的系统配置中。每次打开耗材面板时，应用都会进入一个失控循环，试图把耗材预设同步到 Creality Cloud，反复收到 status=429 和错误码 1088 的响应（“请不要多次重复同一操作”）。这个循环似乎就是导致崩溃的原因。在一次会话中，加载一个 3MF 文件导致文件名被快速连续记录数十次，这表明由文件加载触发了第二个失控循环。……","truncated":true,"url":"https://forum.creality.com/t/app-crash-on-filament-profile-access-after-update-v7-1-1-4472-macos-m4/51720","productLine":"cloud","version":"7.1","versionRaw":"7.1","problemType":"crash","model":"Creality Hi","grade":"有效","replyCount":1,"views":40,"likeCount":0,"sourceType":"论坛"},{"uid":"ec90293618bc9347","date":"2026-06-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print 7 with Ender 3 S1 Pro","titleCn":"Creality Print 7 与 Ender 3 S1 Pro","originalText":"Creality Print 7 with Ender 3 S1 Pro","textCn":"Creality Print 7 与 Ender 3 S1 Pro","truncated":false,"url":"https://forum.creality.com/t/creality-print-7-with-ender-3-s1-pro/51634","productLine":"print","version":"7","versionRaw":"7","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":39,"likeCount":0,"sourceType":"论坛"},{"uid":"335ee7c85c00bf26","date":"2026-06-02","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"No thumbnail to printer kc1","titleCn":"打印机 kc1 没有缩略图","originalText":"Can not get thumbnails to appear on printer(kc1)\nNot seeing fields under advanced Creality print ver 7\n1 thumbnail size eg 96x96 etc\n2 format eg png\nLastest Firmware? Latest version Creality Print?\nCreality version 7.1\nfirmware version 1.3.2.31\ncan get thumbnails to appear on k1 max\ncan not get thumbnails to appear on K1C\nany ideas please","textCn":"无法让缩略图显示在打印机（kc1）上。在 Creality print 7 版的高级选项下看不到这些字段：1 缩略图尺寸，例如 96x96 等等；2 格式，例如 png。最新固件？最新版 Creality Print？Creality 版本 7.1，固件版本 1.3.2.31。能让缩略图显示在 k1 max 上，却无法让缩略图显示在 K1C 上。有什么想法吗，请指教","truncated":false,"url":"https://forum.creality.com/t/no-thumbnail-to-printer-kc1/51633","productLine":"firmware","version":"","versionRaw":"","problemType":"ui","model":"K1","grade":"有效","replyCount":3,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"4a9e163ef4bfebf7","date":"2026-06-01","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Mesh boolean time?","titleCn":"网格布尔运算耗时？","originalText":"Has anyone had a Mesh Boolean take hours to process??\nThanks\nSteve\nIn Creality Print? No.","textCn":"有人遇到过网格布尔运算处理要花好几个小时吗？？谢谢 Steve 在 Creality Print 里？没有。","truncated":false,"url":"https://forum.creality.com/t/mesh-boolean-time/51610","productLine":"print","version":"","versionRaw":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":44,"likeCount":0,"sourceType":"论坛"},{"uid":"b21a59486a27ab99","date":"2026-05-31","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"RU","title":"Не работает служба поддержки после обновления v7.3.4","titleCn":"v7.3.4 更新后在线支持不工作","originalText":"Здравствуйте, после обновления приложения на v7.3.4 не работает онлайн поддержка, сброс настроек, очистка данных и кэш не помогает, до обновления все работало исправно.\nScreenshot_20260531-225733\nScreenshot_20260531-230134\nTry with posting in English… I’m too lazy to use Google Translate…\nHello, after updating the application to version 7.3.4, online support does not work. Resetting settings, clearing data and cache does not help. Everything worked properly before the update.","textCn":"你好，把应用更新到 v7.3.4 后，在线支持不工作，重置设置、清除数据和缓存都没用，更新前一切正常。 Screenshot_20260531-225733 Screenshot_20260531-230134 试着用英语发帖吧……我太懒了不想用谷歌翻译…… 你好，把应用更新到 7.3.4 版后，在线支持无法使用。重置设置、清除数据和缓存都没有帮助。更新前一切正常。","truncated":false,"url":"https://forum.creality.com/t/v7-3-4/51593","productLine":"print","version":"7.3","versionRaw":"7.3.4","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":47,"likeCount":0,"sourceType":"论坛"},{"uid":"cc94fe6666ff532b","date":"2026-05-30","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Minimum tree base diameter","titleCn":"树状支撑底座最小直径","originalText":"Is there a way in creality print to force a minimum tree trunk starting diameter? Support branch diameter doesn’t seem to affect the starting diameter and first layer expansion just creates a brim.","textCn":"在 Creality Print 里有没有办法强制设定树状支撑主干的最小起始直径？支撑分支直径似乎不影响起始直径，而首层扩展只会生成一圈边缘。","truncated":false,"url":"https://forum.creality.com/t/minimum-tree-base-diameter/51559","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":28,"likeCount":0,"sourceType":"论坛"},{"uid":"9b53dce3a564b2cd","date":"2026-05-29","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Default print settings for ender V3 outside the printers abilities!","titleCn":"Ender V3 的默认打印设置超出了打印机的能力！","originalText":"In creality print the default speed and jerk settings for 0.12 and 0.16 layer hieght are way above what the Ender 3 V3 can actually do. so much so that the software gives me a warning at least for the jerk settings. How can Ender get their own settings wrong and then warn about themselves getting the settings wrong?\nmakes me wonder what else is wrong. I noticed the line width was bigger on the thinner layers, this doesn’t seem right to me but I am a newb to 3D prinitng.","textCn":"在 Creality Print 中，0.12 和 0.16 层高的默认速度和 jerk 设置远远超出 Ender 3 V3 的实际能力。以至于软件至少会针对 jerk 设置给我一个警告。Ender 怎么能把自己的设置弄错，然后又警告自己设置错了？\n这让我怀疑还有什么是错的。我注意到在更薄的层上线宽反而更大，这在我看来不太对，但我在 3D 打印方面还是个新手。","truncated":false,"url":"https://forum.creality.com/t/default-print-settings-for-ender-v3-outside-the-printers-abilities/51543","productLine":"print","version":"","versionRaw":"","problemType":"","model":"Ender-3 V3 SE","grade":"泛讨论","replyCount":1,"views":65,"likeCount":0,"sourceType":"论坛"},{"uid":"57212b97a97f9d4c","date":"2026-05-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality print not opening","titleCn":"Creality Print 打不开","originalText":"I hope someone is able to help. My Creality Print app is not opening all of a sudden. I have removed it from my Mac laptop and reinstalled it. I have updated my computer and 3D printer. I have restarted my laptop. NOTHING is working. This is so frustrating. I don’t know why it stopped working all of a sudden. Please help\ncan’t really say what could be going wrong, as it’s very likely something very specific to your laptop. what i can say is that you can use orca slicer while you troubleshoot and see what might be the issue/conflict on your laptop\nDid you manage to solve the problem? I got the same error.","textCn":"希望有人能帮忙。我的 Creality Print 应用突然打不开了。我已经把它从我的 Mac 笔记本上卸载并重新安装。我更新了电脑和 3D 打印机。我重启了笔记本。什么都不管用。太令人沮丧了。我不知道它为什么突然就不工作了。请帮帮忙 很难说可能是哪里出了问题，因为这很可能是你这台笔记本特有的某个问题。我能说的是，你可以在排查期间使用 orca slicer，看看你笔记本上可能存在的问题/冲突 你解决这个问题了吗？我遇到了同样的错误。","truncated":false,"url":"https://forum.creality.com/t/creality-print-not-opening/51532","productLine":"thirdparty","version":"","versionRaw":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":3,"views":70,"likeCount":0,"sourceType":"论坛"},{"uid":"28da88bf397d15c7","date":"2026-05-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Creality Print Vers. 7.1.1.442 Not loading or deleting Local Files?????🤷‍♂️","titleCn":"Creality Print 版本 7.1.1.442 无法加载或删除本地文件?????🤷‍♂️","originalText":"Hello, in the last few weeks, When I “Send Print” to my K2 Pro, it does not show up in the local files section. I have to open a new project/Creality Print and it shows up then, so I can not print it.\nLike wise when I delete a print from the local files section, it does not disappear, but when I open a new project/CR it has gone.\nCan anyone explain why? As it used to show/delete print files straight away, just like deleting/moving any files within Finder etc.\nTIA\nJonny","textCn":"你好，最近几周，当我向 K2 Pro“发送打印”时，它不会出现在本地文件区域。我必须新建一个项目/Creality Print，它才会显示出来，所以我没法打印它。 同样地，当我从本地文件区域删除一个打印文件时，它不会消失，但当我新建项目/CR 后它就不见了。 有人能解释一下为什么吗？因为它以前会立即显示/删除打印文件，就像在 Finder 等里面删除/移动任何文件一样。 提前感谢 Jonny","truncated":false,"url":"https://forum.creality.com/t/creality-print-vers-7-1-1-442-not-loading-or-deleting-local-files/51512","productLine":"print","version":"7.1","versionRaw":"7.1.1","problemType":"crash","model":"K2 Pro","grade":"有效","replyCount":1,"views":42,"likeCount":0,"sourceType":"论坛"},{"uid":"1ef25c38c835eafa","date":"2026-05-28","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Can't send to OctoPrint server from Creality Print","titleCn":"无法从 Creality Print 发送到 OctoPrint 服务器","originalText":"I have the Ender-3 S1 Pro, and I’ve set up an OctoPrint server for it. OctoPrint is working great, sending prints and returning data, and I can use it via web UI on my home LAN.\nNow I want to send prints to it from Creality Print (v7.1.1.4472). I don’t want to go through Creality Cloud, I’m expecting this should work locally on the LAN without any account logins. I did install the Creality Cloud plugin in OctoPrint, but I suspect that shouldn’t even be necessary.\nIn the Device section of Creality Print, I manually added a new “other” printer of type “Octo/Klipper”. I gave it the IP address and API key, and the test connection is successful (screenshot #1 ). The new device appears in the sole device group ( #2 ). I can click “Details” on that device, and the OctoPrint web UI loads in Creality Print ( #3 ).\nThe trouble is when I slice the plate, then choose “Send print” (screenshot #4 ). There are no devices available to choose from. I’ve deleted and re-added the printer a bunch of times, restarted Creality Print and my whole PC, but the printer never shows up here.\nSo can anyone help me send a print to the printer? Thanks! …","textCn":"我有 Ender-3 S1 Pro，并且为它设置了一个 OctoPrint 服务器。OctoPrint 运行得很好，可以发送打印任务并返回数据，我可以通过家庭局域网上的 Web UI 使用它。现在我想从 Creality Print（v7.1.1.4472）向它发送打印任务。我不想通过 Creality Cloud，我期望这应该能在局域网上本地工作，无需任何账户登录。我确实在 OctoPrint 中安装了 Creality Cloud 插件，但我怀疑那甚至不应该有必要。在 Creality Print 的设备部分，我手动添加了一台类型为“Octo/Klipper”的新“其他”打印机。我给了它 IP 地址和 API 密钥，测试连接成功（截图 #1）。新设备出现在唯一的设备组中（#2）。我可以点击该设备上的“详情”，OctoPrint Web UI 会在 Creality Print 中加载（#3）。麻烦的是，当我切片平台，然后选择“发送打印”（截图 #4）时，没有可选择的设备。我已经删除并重新添加打印机很多次，重启了 Creality Print 和我的整台 PC，但打印机从未出现在这里。那么有人能帮我向打印机发送打印任务吗？谢谢！…","truncated":true,"url":"https://forum.creality.com/t/cant-send-to-octoprint-server-from-creality-print/51533","productLine":"thirdparty","version":"7.1","versionRaw":"7.1.1","problemType":"ui","model":"未标注","grade":"有效","replyCount":4,"views":292,"likeCount":0,"sourceType":"论坛"},{"uid":"843bcbd7210819ef","date":"2026-05-27","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"An Idea for the Creality Team to help fix single color layer lines.","titleCn":"给 Creality 团队的一个想法，帮助修复单色层线条问题。","originalText":"Most times when you print in multi-color layers on complex curves, you end up with staggered single layers which wastes time and material. Could we have a simple “Ignore Single Layers” button? It would simply default to the next color and skip the single print layers.\nIf this exists and I missed it then could someone please point this out.","textCn":"大多数时候，当你在复杂曲面上进行多色分层打印时，最终会出现交错的单层，浪费时间和材料。我们能不能有一个简单的“忽略单层”按钮？它会直接默认为下一种颜色，并跳过这些单层打印。如果这个功能已经存在而我漏掉了，请有人指出来。","truncated":false,"url":"https://forum.creality.com/t/an-idea-for-the-creality-team-to-help-fix-single-color-layer-lines/51482","productLine":"print","version":"","versionRaw":"","problemType":"quality","model":"未标注","grade":"有效","replyCount":1,"views":22,"likeCount":0,"sourceType":"论坛"},{"uid":"b4b5ce9de7c090d6","date":"2026-05-26","platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","title":"Feature request = axis Jerk settings","titleCn":"功能请求 = 各轴 Jerk 设置","originalText":"When printing tall skinny objects on a bed slinger printer I think the jerk and accleration of the bed becomes the main cause of failed prints. I understand some other slicer software allows you to set the jerk settings of the axis indipendently so you can reduce these failures. A more advanced option would be to set a top and bottom layer jerk/acceleratoin speed. IE the higher you print the slower it goes as the more prone to failure.\nand yes I know skinny objects should be printed with brims.","textCn":"在热床移动式打印机上打印又高又细的物体时，我认为热床的 jerk 和加速度会成为打印失败的主要原因。我了解到其他一些切片软件允许独立设置各轴的 jerk 参数，从而减少这类失败。更进阶的选项是设置顶层和底层的 jerk/加速度速度。也就是说，打印得越高就走得越慢，因为越容易失败。 是的，我知道细长物体应该加边缘打印。","truncated":false,"url":"https://forum.creality.com/t/feature-request-axis-jerk-settings/51448","productLine":"print","version":"","versionRaw":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":1,"views":24,"likeCount":0,"sourceType":"论坛"},{"uid":"a5681024fa9e6380","date"
