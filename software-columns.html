rum.creality.com/t/crealityprint-v-7-1-0-4414-brim-type-mouse-ear-corner-detection-failure/50647","productLine":"print","version":"7.1","problemType":"other","model":"未标注","grade":"有效","replyCount":4,"views":70,"likeCount":0,"tags":["bug-report"],"relReason":"category","sourceType":"用户"},{"uid":"9c7e6ced827d7310","topicId":50652,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-19","lastActive":"2026-04-20","title":"How to import print profiles from Orca Slicer to Creality Print?","originalText":"Does anyone know an effective and easy way to export Orca Slicer print profiles and import them to Creality Print?\n\ncan not done, the internal names of variables are incompatible between creality print and all the others prusa based slicers., you must to manually create them.\n\nIf you think the printer profiles of Orca slicer are better then CP, simply use Orca Slicer to create the Gcode for your printer… have done that for years and years when I was printing with my Ender 3 Pro…","url":"https://forum.creality.com/t/how-to-import-print-profiles-from-orca-slicer-to-creality-print/50652","productLine":"thirdparty","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":189,"likeCount":2,"tags":["general-discussions","trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"2bb73083de235011","topicId":50645,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-19","lastActive":"2026-04-19","title":"Creality Print improvement suggestions","originalText":"New to this 3D printing world of Creality but I have been using it for 5 months now. I am not a fan of the support base layer choices. I suggest, if I may, have one that is like a brim and it incorporates both the brim and support base all in one go. No start/stop nonsense like the rectillinear.","url":"https://forum.creality.com/t/creality-print-improvement-suggestions/50645","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":46,"likeCount":0,"tags":["general-discussions","k2plus"],"relReason":"category","sourceType":"用户"},{"uid":"6a85dbf28e5b76e0","topicId":50625,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-17","lastActive":"2026-04-18","title":"3DConnexion 3D Mouse support","originalText":"Creality Print is listed as supporting the 3DConnection 3D mouse, but it doesn’t work with the application. I’ve contacted 3DConnexion suppoirt and their response indivcates that it’s up to Creality to make it work if they so desire.\n\n I am running version 7.1.0.4414 om a Mac, Tahoe 26.2 version OS.\n\n Does anyone have this working?\n\nnope it doesn’t work, it does work with orca though, so it’s something on the implementation that didn’t get transferred in the fork\n\nThe product does work but I have found that the 3D Connexion Software is buggy as hell.\n\n I found their tech support to be very responsive but totally clueless. If I were to guess, they hire part time high school students to man the tech support desk.\n\n I found that I often have to do two things:\n\n \n \n Restart the connexion software while the app is already launched and that it says CrealityPrint when you open the app. It often gets confused as to what app is on top.\n\n image 826×756 60.2 KB \n\n \n \n The Creality support for the mouse is pointless, one has to go in and check all the boxes to be active manually.\n\n image 1194×903 107 KB \n\n \n \n Here’s proof that it does work. You can’t do this kind of rotation with a plane mouse, it is one of the reasons I use the 3D Connexion mouse.","url":"https://forum.creality.com/t/3dconnexion-3d-mouse-support/50625","productLine":"cloud","version":"7.1","problemType":"","model":"未标注","grade":"泛讨论","replyCount":5,"views":89,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7dc06e6a5ebf7af3","topicId":50540,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-14","lastActive":"2026-07-23","title":"Ccloud app problems starting print","originalText":"in CC app (iphone) I select the model and then have 2 issues. app v 7.3.0\n\n \n \n fails to find the CFS approx 50% of the time. so i have to restart the print job until it finally loads the CFS profile correctly.\n\n \n \n after select filament click print and it either hangs forever on the loading icon, or it moves to the workbench page but doesnt actually load the job to the K2. I then have to close the app and restart the job from scratch. after approx 5-10 attempts it will finally send the job to printer.\n\n IMG_2157 1206×2622 237 KB \n\n IMG_2156.PNG 1206×2622 181 KB\n\nSame here. Sometimes it works just fine and others it doesn’t.\n\nSame problem here but now I can’t even get it to load print preview neither will it print acts like I never hit print and just shows my last project that I successfully printed is this just a K2 SE problem?","url":"https://forum.creality.com/t/ccloud-app-problems-starting-print/50540","productLine":"cloud","version":"7.3.0","problemType":"other","model":"K2","grade":"有效","replyCount":4,"views":219,"likeCount":0,"tags":["k2-se"],"relReason":"category","sourceType":"用户"},{"uid":"c60ce696e7859be3","topicId":50461,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-12","lastActive":"2026-04-12","title":"Doom on Creality K1","originalText":"Hi everyone! I’ve got a bit of a crazy experiment in mind. We all know the ‘Can it run Doom?’ challenge, and I think the Creality K1 is a perfect candidate!\n\n I have a USB hub with a mouse and keyboard ready to go. I also have a bootable Xubuntu drive. My main question is: does the K1’s bootloader (U-Boot) allow selecting an external boot device, or should I look into running it through a Klipper/framebuffer port instead?\n\n Would love to hear if anyone has tried this or has tips on accessing the display’s framebuffer!\n\nNice. hope you get it.","url":"https://forum.creality.com/t/doom-on-creality-k1/50461","productLine":"firmware","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":2,"views":61,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"7280767e30a8fe15","topicId":50345,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-09","lastActive":"2026-04-09","title":"cant login into falcon desktop app","originalText":"i have the falcon design downloaded onto my pc, i keep getting an error message that states invalid parameter. all im trying to do is login into the app using creality web or whatever. ive followed the instructions that says to allow pop ups from id.creality.com but that didnt work. ive tried doing the QR code but that didnt work either.\n\n anyone have any suggestions on this?","url":"https://forum.creality.com/t/cant-login-into-falcon-desktop-app/50345","productLine":"cloud","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":1,"views":40,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"12cb9d9870246e4a","topicId":50323,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-08","lastActive":"2026-04-12","title":"Creality 7.1   The properties box will not slide out all the way on the right","originalText":"In the latest update 7.1 the slideout box on the right will not slide out all the way. It is extremely awkward to use. Does anyone know how to make slide out past the partial view?\n\nHello @slushbender1 \n\nWelcome to the Creality Forum…! \n\n You can drag the edge of the window and adjust the size and pull it out to see more.\n\nAre you running multiple monitors? I noticed when I drag my Creality Print window from the laptop screen to the 27in monitor, I will get some VERY weird results. One of them was the slideout covering the entire screen.\n\n This time I was able to grab the edge of that green box and drag it smaller to the right. But I have had times where that did not work. I’m trying to find a way to replicate that, but I haven’t been able to .\n\n YOU ARE NOT ALONE….\n\n but try the green box edge, see if that works.\n\n image 1811×1210 145 KB","url":"https://forum.creality.com/t/creality-7-1-the-properties-box-will-not-slide-out-all-the-way-on-the-right/50323","productLine":"print","version":"7.1","problemType":"ui","model":"未标注","grade":"有效","replyCount":5,"views":84,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"2a0525bc2933c7f2","topicId":50283,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-07","lastActive":"2026-04-09","title":"3D Printer Files | 3MF File | Bluey Buddy Flex 🐾💙 | Creality Cloud","originalText":"3D Printer Files | 3MF File | Bluey Buddy Flex 🐾💙 | Creality Cloud \n \n\n \n \n\n 3D Printer Files | 3MF File | Bluey Buddy Flex 🐾💙 | Creality Cloud \n\n Bring home the playful spirit of Bluey with this adorable articulated figure! 🐶✨ Designed with movable joints, this little Blue Heeler is full of personality and ready for fun poses, fidgeting, or display. The vibrant colors and chunky, toy-like...\n\n \n\n \n \n \n \n\n \n \n\n Bring home the playful spirit of Bluey with this adorable articulated figure! Designed with movable joints, this little Blue Heeler is full of personality and ready for fun poses, fidgeting, or display. The vibrant colors and chunky, toy-like style make it perfect for fans of all ages—whether it’s for your desk, shelf, or as a cheerful companion on the go. \n\n *Nose and eye detail painted on.\n\n IMG_20260407_043816 1920×2560 227 KB \n\n IMG_20260407_043911 1920×2560 131 KB\n\nThis model is very cute! Looks funny \n\n Quite long printing time, I wouldn’t wait c570de5dc64fbb4a41186849c1c313d.jpeg\"}","url":"https://forum.creality.com/t/3d-printer-files-3mf-file-rock-a-plant-creality-cloud/50282","productLine":"cloud","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":41,"likeCount":1,"tags":["showcase","crealityprint","ender-3-v3-ke"],"relReason":"tag","sourceType":"用户"},{"uid":"7c5c3fd519fa3fbf","topicId":50261,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-06","lastActive":"2026-04-06","title":"The egg-celerator","originalText":"My son had said “wouldn’t it be cool if we could shoot easter eggs”. Thats all it took to get my wheels going, a couple of prototypes (PT) later and we have the Egg-Celerator. The 1st pt had 6 parts, not easy to assemble, only 1 small spring, and the egg did not leave the barrel. Thats when my son threw in the towel. Kids today, lol. I too was going to throw in the towel but i thought what am I teaching him. So back to the drawing board (computer). PT 2 still had 6 parts some intergration was done, this time the egg popped out around a foot at the most. But seeing that my son was ready to get back into the game. So we sat down and redesigned amlost everything. He was the one who said “dad why can’t we print the 2 springs together” then as I moving the parts around in CAD, he said \" and the push rod too\". so we gave it a try and I was amazed how the part came out. So PT 3, 4 parts quickly assemble/disassemble, no additional harware. The Egg-Celerator lauches the egg 10 ft. feel free to check it out. This is why I bought a Creality Print. It took 4 months to happen but enjoyed every minute of it and hopefully my son got some life lessons too.\n\n \n \n \n\n 3D Printer Files | 3MF File | The Egg-Celerator (Hare force one) | Creality... \n \n\n \n \n\n 3D Printer Files | 3MF File | The Egg-Celerator (Hare force one) | Creality... \n\n Project DescriptionThe Egg-celerator (Hare Force One)\"Why hide eggs when you can launch them? Designed for the ultimate high-speed Easter celebration, the Egg-celerator is a custom 3D-printed masterpiece that blends holiday whimsy with clever...\n\n \n\n \n \n \n \n\n \n \n\n 20260403_222328 1920×2560 301 KB \n\n 20260403_222213 1920×2560 194 KB \n\n 20260403_222204 1920×2560 142 KB \n\n 20260403_221950 1920×2560 150 KB \n\n 20260403_222551 1920×2560 299 KB \n\n 20260403_222123 1920×2560 185 KB \n\n 20260403_222115 1920×2560 189 KB \n\n 20260403_222109 1920×2560 256 KB \n\n 20260403_222101 1920×2560 251 KB","url":"https://forum.creality.com/t/the-egg-celerator/50261","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":35,"likeCount":0,"tags":["showcase","crealityprint","creality-cloud"],"relReason":"tag","sourceType":"用户"},{"uid":"90e2f3a206e15669","topicId":50260,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-06","lastActive":"2026-04-06","title":"Print setting Egg-celerator","originalText":"My son and my easter contest entry. and the story behind it.\n\n My son had said “wouldn’t it be cool if we could shoot easter eggs”. Thats all it took to get my wheels going, a couple of prototypes (PT) later and we have the Egg-Celerator. The 1st pt had 6 parts, not easy to assemble, only 1 small spring, and the egg did not leave the barrel. Thats when my son threw in the towel. Kids today, lol. I too was going to throw in the towel but i thought what am I teaching him. So back to the drawing board (computer). PT 2 still had 6 parts some intergration was done, this time the egg popped out around a foot at the most. But seeing that my son was ready to get back into the game. So we sat down and redesigned amlost everything. He was the one who said “dad why can’t we print the 2 springs together” then as I moving the parts around in CAD, he said \" and the push rod too\". so we gave it a try and I was amazed how the part came out. So PT 3, 4 parts quickly assemble/disassemble, no additional harware. The Egg-Celerator lauches the egg 10 ft. feel free to check it out. This is why I bought a Creality Print. It took 4 months to happen but enjoyed every minute of it and hopefully my son got some life lessons too.\n\n \n \n \n\n 3D Printer Files | 3MF File | The Egg-Celerator (Hare force one) | Creality... \n \n\n \n \n\n 3D Printer Files | 3MF File | The Egg-Celerator (Hare force one) | Creality... \n\n Project DescriptionThe Egg-celerator (Hare Force One)\"Why hide eggs when you can launch them? Designed for the ultimate high-speed Easter celebration, the Egg-celerator is a custom 3D-printed masterpiece that blends holiday whimsy with clever...","url":"https://forum.creality.com/t/print-setting-egg-celerator/50260","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":30,"likeCount":0,"tags":["showcase","crealityprint","creality-cloud"],"relReason":"tag","sourceType":"用户"},{"uid":"fa049fa872c9cd62","topicId":50259,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-06","lastActive":"2026-04-06","title":"YOUTUBE video","originalText":"Here is the video my son and I made for the easter project we designed and printed together\n\n the egg-celerator in print build launch","url":"https://forum.creality.com/t/youtube-video/50259","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"tags":["showcase","crealityprint","creality-cloud"],"relReason":"tag","sourceType":"用户"},{"uid":"51a63dcd0a3bc09b","topicId":50241,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-05","lastActive":"2026-04-10","title":"Modifiers and how to use them","originalText":"The modifier tool is a really helpful tool in Creality Print that allows you to change settings in specific areas of your model rather than the entire print. Let’s call them “targeted tweaks.” \n\n Simply right-click on your model, then select Add Modifier.\n\n Step 1 1771×1374 361 KB \n\n By using a modifier you can change infill density to either go higher or lower; you can increase infill where strength is needed (like joints or thin parts) or reduce infill in non-critical areas to save time & filament\n\n But modifiers are more than just changing infill. When working on prints that ask for more than just “one size fits all” in the settings, modifiers are great, as they add flexibility to your needs. You can fine-tune precisely where it matters, giving you stronger pieces, cleaner finishes, and better outcomes without wasting time or filament, rather than compromising over the entire model.\n\n Modifiers are essential for functional printing like mounts, hinges, and clips. These parts often have unique stress spots that ask for more strength. You can make your prints stronger, more durable, and more purpose-built without modifying all by supporting only the key areas instead of putting walls or infill across the entire model, which takes time and material.\n\n Recovered_UNTITLED-1 2149×1026 338 KB \n\n By using modifiers, you can adjust the support settings; you can either lower dense support elsewhere or add it just where it’s necessary, like in complex overhangs. This saves material, improves print quality, and simplifies cleanup.\n\n Modifiers can be used to slow down in certain areas but, on the flip side, also used to speed up. This is great. as it helps avoid blobs or poor detail.\n\n With the use of modifiers, you can easily improve the quality, strength, and cleanliness of your print where it matters.\n\nGreat post on a topic I never dug into before – Thanks!\n\nYou are welcome. It’s actually quite interesting, I think there is still more to explore.","url":"https://forum.creality.com/t/modifiers-and-how-to-use-them/50241","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":857,"likeCount":7,"tags":["creality-cloud"],"relReason":"category","sourceType":"用户"},{"uid":"17f0e8cdd488177d","topicId":50203,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-04","lastActive":"2026-04-07","title":"Arachne walls","originalText":"Oh, for goodness sake, WHY IS ARACHNE NOT ON BY DEFAULT?!?!\n\n I’ve been trying to print lithophanes for a couple of days now on the Hi Combo and they’ve been way too thick & terrible, while the old Prusa MK3S+ & Slicer were producing perfect results. Turns out the Wall Generator is set to Classic by default, not the more modern Arachne mode, and hidden in the depths of the settings. WHY???\n\nThe reason probably because it is a very esoteric setting. I have never considered it. The setting for infill is on the main screen and I change that all the time.\n\nI wouldn’t call it hidden, though I do agree they should be the default. I always create my own profile and that is one of the things I change.","url":"https://forum.creality.com/t/arachne-walls/50203","productLine":"print","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":3,"views":189,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"23f95ede08ac71e7","topicId":50214,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-04","lastActive":"2026-04-04","title":"3D Printer Files | 3MF File | Emberwing Glow 🔥🦅 | Creality Cloud","originalText":"3D Printer Files | 3MF File | Emberwing Glow 🔥🦅 | Creality Cloud \n \n\n \n \n\n 3D Printer Files | 3MF File | Emberwing Glow 🔥🦅 | Creality Cloud \n\n Let your space take flight with the Emberwing Glow ✨ A bold fusion of light and design, this 3D printed LED lamp features a striking winged silhouette and a warm glow that spills through the detailed cut-outs, casting dramatic shadows that transform...\n\n \n\n \n \n \n \n\n \n \n\n Really love how this came out.\n\n Can be printed on the K2 Plus but also on the KE. These LED lights are very affordable and easy to incorporate into designs.\n\n {\"src\":\"https://forum.creality.com/uploads/default/original/3X/6/3/63bf297075918942e27b37787c7f54ddc5a4dadd.3mf\",\"poster\":\"https://forum.creality.com/uploads/default/original/3X/3/8/3847688c42f0f73c892081680d7d6a98810d8831.jpeg\"}","url":"https://forum.creality.com/t/3d-printer-files-3mf-file-emberwing-glow-creality-cloud/50214","productLine":"cloud","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"tags":["general-discussions","showcase","crealityprint","ender-3-v3-ke"],"relReason":"tag","sourceType":"用户"},{"uid":"bfe2f6984060e16c","topicId":50194,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-03","lastActive":"2026-04-07","title":"software issues, beyond v 6.2","originalText":"Hi,\n\n is anyone else having problems loading the slicing software. Anything after v6.2 will not load. The icon appears but does nothing. tried all releases beyond v6.2 without success.\n\n any help would be much appreciated.\n\n Printer : K2 Pro.\n\n PC. Windows 11.\n\n any other information required?\n\n thanks\n\n Dave\n\nBe aware, Creality Print 6.x and Creality Print 7.x ARE INSTALLED ON DIFFERENT folders and different start menu sections.\n\n Even if the Creality Print 7.x told you it will uninstall previous one, IT DID NOT REMOVE Creality Print 6.x. so you can end with links to Creality Print 6.x and also for Creality Print 7.x\n\n manually remove all of them and install latest you like.\n\nHi,\n\n thanks for the pointer, unfortunately tried it a couple of times but still not working.\n\n I have both v6.3 and 7 working on my laptop but unable to sort it on my desktop.\n\n cannot get any version working past v6.2.\n\n Dave","url":"https://forum.creality.com/t/software-issues-beyond-v-6-2/50194","productLine":"print","version":"6.2","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":6,"views":110,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6986441de90d0613","topicId":50136,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-02","lastActive":"2026-04-02","title":"3D Printer Files | 3MF File | Subaru Drift Tag ✨🔑","originalText":"3D Printer Files | 3MF File | Subaru Drift Tag ✨🔑 \n \n\n \n \n\n 3D Printer Files | 3MF File | Subaru Drift Tag ✨🔑 \n\n Carry a piece of the legend wherever you go with this bold Subaru keyring. Featuring the iconic star cluster design in crisp blue and white, this tag is all about clean style and unmistakable identity. 🌌Lightweight yet durable, it’s perfect for keys,...\n\n \n\n \n \n \n \n\n \n \n\n \n\n {\"src\":\"https://forum.creality.com/uploads/default/original/3X/7/d/7d8eff3be7e814c175ae8ee066e7b201e874ecb3.3mf\",\"poster\":\"https://forum.creality.com/uploads/default/original/3X/6/f/6f0779f80e2b2bf20399fab6ce5526877ff4e1a6.jpeg\"}\n \n\n \n\n \n\n Carry a piece of the legend wherever you go with this bold Subaru keyring. Featuring the iconic star cluster design in crisp blue and white, this tag is all about clean style and unmistakable identity. \n\n Lightweight yet durable, it’s perfect for keys, bags, or even as a statement piece for true fans of the boxer spirit. \n\n Because every journey starts with a spark… and this one? It’s in the stars.","url":"https://forum.creality.com/t/3d-printer-files-3mf-file-subaru-drift-tag/50136","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":27,"likeCount":1,"tags":["showcase","crealityprint","k2plus"],"relReason":"tag","sourceType":"用户"},{"uid":"0ea34dac7d23140b","topicId":50105,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-04-01","lastActive":"2026-04-02","title":"Auto Shut Off Please","originalText":"Started a print and went to bed. Woke up to a finished print and a hot printer. Turns out the printer was heating the bed and chamber all night.\n\nPlease add a shut off when print finishes feature.\n\nMy old QIDI X-Plus has this option.\n\nSure this isn’t a USER ERROR? All my printers stop heating hotend/bed/chamber after print is finished!\n\n Did you change the END-Gcode of CP?\n\nThanks for the insult but, according to AI Creality does not have such a feature.\n\n QIDI has it as a machine function on the UI.\n\n Creality printers like the Ender 3 series do not have a built-in automatic shut-off feature after a print completes, requiring users to implement third-party solutions for this functionality.\n\n There was an Error that the print did not finish due to out of range Y Axis. But it did finish the print.\n\n Yes, Possibly the End gcode is changed. I changed it in Orcaslicer and it worked fine. But I used Creality Print Slicer for this print. I assume the gcode is the CP End gcode.\n\n I would not have even asked and would have investigated further but when AI said there is not auto shut off I had to ask.","url":"https://forum.creality.com/t/auto-shut-off-please/50105","productLine":"thirdparty","version":"","problemType":"feature","model":"未标注","grade":"有效","replyCount":12,"views":369,"likeCount":11,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"35677375e48e1d64","topicId":49957,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-28","lastActive":"2026-03-29","title":"Ender 3 S1 (STM32F401RCT6 / V24S1_301) bricked after multiple SWD flash attempts – stuck on Creality logo, no serial response","originalText":"Hardware:\n\n \n Printer: Creality Ender-3 S1 \n Mainboard: V24S1_301 \n SoC: STM32F401RCT6 (256KB Flash) \n Display: TJC (small flash variant) \n Probe: CR Touch (X-31.80, Y-40.50) \n Host: OctoPrint on Raspberry Pi Zero 2W \n \n Original Problem:\n\nCreality firmware V3.2.1 has a hardcoded bug: M420 S1 is called internally during G28, causing “Invalid mesh / Failed to enable Bed Leveling” errors when no valid mesh exists in EEPROM. SD card flashing was not possible – the bootloader silently rejected all binaries regardless of filename or folder placement.\n\n Goal:\n\nFlash mriscoc community firmware (Ender3S1-F4-20260106.bin) via SWD using ST-Link V2 Mini to permanently fix the bug.\n\n What we tried (all via STM32CubeProgrammer + ST-Link V2 over SWD):\n\n \n Flashed Creality V3.2.1 at 0x08000000 via Automatic Mode → boots once after ST-Link flash, but frozen Creality logo after cold boot \n Flashed Bootloader (STM32f401RCTx_BootLoader_v1.bin) at 0x08000000 + firmware at 0x08010000 → works once after ST-Link flash, frozen after cold boot \n Patched bootloader (byte 0x348E: 0x02 → 0x06) + firmware at 0x08010000 → same result, works once, frozen after cold boot \n mriscoc at 0x08000000 without bootloader → no serial response at any baudrate (115200 / 250000) \n Multiple Full chip erases + reflash attempts with V3.0.3, V3.0.4, V3.2.1, mriscoc \n TJC display firmware updated multiple times (V3.0.4, V3.1.9 versions) \n Option bytes verified: RDP=AA, BOR_LEV=3 (OFF), all WRP unchecked – all look normal \n \n Current state:\n\n \n Printer frozen on Creality logo after every cold boot \n No serial response on 115200 or 250000 baud \n ST-Link connects successfully (STM32F401x8/C detected, 3.21V) \n Firmware flashes and verifies successfully via SWD every time \n Printer runs correctly immediately after ST-Link flash (warm state), but dies on next cold boot \n \n Key observation:\n\nThe printer only works in the warm state right after an ST-Link flash. A real power cycle (cold boot) always results in a frozen Creality logo with no serial response. This happens with every firmware version we tried.\n\n Question:\n\nHas anyone successfully achieved a permanent cold-boot-stable flash on this exact hardware combination (STM32F401RCT6 + V24S1_301 + TJC display)? Is there a known working bootloader or flash procedure for this chip?\n\n Any help appreciated – we have been at this for two full days.\n\nResolved: a custom firmware built with mriscoc‘s configurator immediately flashed an runs. G28 command runs without error after first test. Big thanks to mriscoc for all his efforts and great tools!\n \n \n\n github.com/mriscoc/Special_Configurations \n \n\n \n README.md \n\n \n main \n \n\n # Special Configurations\nIn this repository there are the configuration files for several Marlin firmware features for the Ender3 V2/S1 printer, the main\nproject files are in the firmware repository: https://github.com/mriscoc/Ender3V2S1\n\n#### These special configurations and releases are sponsored by donors.\n\n## How to request a custom build\nPlease check the suscription levels on [Patreon](https://www.patreon.com/mriscoc), there are levels that allow to request custom compile. Patrons from [Patreon platform](https://www.patreon.com/mriscoc) can request a configuration sending a message. If you made a equivalent donation through [Paypal](https://www.paypal.com/donate/?business=85SPAAR6UZEE8&currency_code=USD), please reply the message that I sent you or use any of the other communication media (Facebook, Telegram) providing the name used in Paypal. I'm happy and grateful for the contributions but please don't confuse that with paid work. I do what is possible in my little free time, be aware that a donation does not give you the right more than my thanks, a specialized job like coding and compiling a custom firmware could be a work quoted in 3 digits. Github also have a [Sponsor platform](https://github.com/sponsors/mriscoc).\n\n## Contributions\nThank you for your support, I receive donations through [Patreon](https://www.patreon.com/mriscoc) and [Paypal](https://www.paypal.com/paypalme/mriscoc) \n\n[<img src=\"https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif\">](https://www.paypal.com/donate?business=85SPAAR6UZEE8&currency_code=USD)\n\n## Creating your own custom configuration\nIt is now possible to use an small Python GUI interface (Professional Firmware **Configurator**) for generate the configuration files,\nafter downloading the repository execute the Python file `Configurator.pyw`:\n\n![image](https://github.com/mriscoc/Special_Configurations/raw/main/images/Configurator.png)\n\n \n\n This file has been truncated. show original","url":"https://forum.creality.com/t/ender-3-s1-stm32f401rct6-v24s1-301-bricked-after-multiple-swd-flash-attempts-stuck-on-creality-logo-no-serial-response/49957","productLine":"firmware","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":120,"likeCount":0,"tags":["ender-3-s1","trouble-shooting","firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"020e1aa401d333bf","topicId":49943,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-03-27","lastActive":"2026-03-27","title":"Creality Cloud","originalText":"Bonjour, cela fait maintenant deux semaines qu’il m’est impossible d’imprimer depuis Creality Cloud , le fichier envoie le téléchargement, mais reste à 0 %.\n\n J’ai une imprimante K2\n\n Est-ce que d’autres personnes ont ce problème?\n\nuser1053815290: \n \n Bonjour, cela fait maintenant deux semaines qu’il m’est impossible d’imprimer depuis Creality Cloud , le fichier envoie le téléchargement, mais reste à 0 %.\n\n J’ai une imprimante K2\n\n Est-ce que d’autres personnes ont ce problème\n\n \n \n Yes, I have. To test the app is the problem download Creality Print to your computer.\n\n Also, flowprint seems to be more problematic than the classic version.","url":"https://forum.creality.com/t/creality-cloud/49943","productLine":"cloud","version":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":2,"views":58,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"295f7683be3847fc","topicId":49928,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-27","lastActive":"2026-03-27","title":"Time lapse videos no longer available in creality print K2Pro","originalText":"Does anybody else have the issue so you can no longer download the time lapse videos from Creality Print I used to work but now for some reason it doesn’t\n\nOn iphone, I go to print reocrd last icon under account. Change to time lapse and choose the one you want and click on the three dots … and choose save to album. No you just have to get it from you phone to computer if needed.\n\nI haven’t tried that but it worked fine on my pc, so I don’t understand what changed, it seems to have been removed ?","url":"https://forum.creality.com/t/time-lapse-videos-no-longer-available-in-creality-print-k2pro/49928","productLine":"print","version":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":3,"views":116,"likeCount":1,"tags":["general-discussions","trouble-shooting","k2pro"],"relReason":"category","sourceType":"用户"},{"uid":"311e7b7d207ca985","topicId":49879,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-26","lastActive":"2026-03-26","title":"D3P riser attachmenst Buffer mount and LED switch holder","originalText":"if your using a D3P riser and want to clean up your cabling and wiring. here are some ideas. Buffer mounts and LED switch holder. The LED is for the one D3P recommends with his prints. Its an quick print, snaps into any of the holes on the back side.\n\n Untitled (1) 1920×2560 218 KB \n\n 20260325_190627 1920×2560 305 KB \n\n 20260325_190541 1920×2560 238 KB","url":"https://forum.creality.com/t/d3p-riser-attachmenst-buffer-mount-and-led-switch-holder/49879","productLine":"print","version":"","problemType":"","model":"K1","grade":"泛讨论","replyCount":1,"views":32,"likeCount":0,"tags":["creality-cloud","crealitymaker","k2plus","creality-k1","crealityprint","k2","creality-k1-max","k2pro"],"relReason":"tag","sourceType":"用户"},{"uid":"71952d4d2bdfc208","topicId":49838,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-25","lastActive":"2026-03-25","title":"Printer is out of app. No connection futher possible","originalText":"I have problemes with my Creality 3Dprinter 10-SE. There is no connection anymore with the app. Also a new connection is not possible, why the scan readyof the app do not to reccognise my ID of the printer.\n\n What to do?\n\n King regards\n\n Wim","url":"https://forum.creality.com/t/printer-is-out-of-app-no-connection-futher-possible/49838","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":39,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"41ca7748ea448dc7","topicId":49842,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-25","lastActive":"2026-03-26","title":"Maximize your print and filament, NO supports no waste","originalText":"DESIGN CONCEPT\n\nThis is my favorite print to date! My goal was to push the Creality K2 to its absolute limits by creating a massive, tall model that utilizes nearly a full 1kg roll of filament—all on a single build plate with zero supports .\n\n By nestling the three parts inside one another, I was able to maximize the K2’s build volume (260x260x254 mm) . The final assembled bunny stands at an impressive 2.17ft (660.4mm) tall . It uses 917g of filament, ensuring almost zero waste while delivering a huge physical presence.\n\n Purpose\n\nThe Large Bunny Stackable balances aesthetic charm with functional design. Its playful, interactive structure can be customized or rearranged, making it perfect as:\n\n A Modular Toy: Engaging and fun for kids to stack and play with.\n\nWhimsical Storage: A creative way to organize small items or toys.\n\nBold Decor: A statement piece for a nursery, living area, or creative workspace\n\n Get Creative: You can paint these, add textures, or even 3D print your own ears, faces, and accessories. Let your imagination run wild! (My kids already made two—check out the pictures below!) It is scalable you can go bigger or turn it down and make mini stackables\n\n Assembly Instructions\n\nNo tools or glue required! Simply align the sections, snap them into place, and stack\n\n https://www.crealitycloud.com/model-detail/large-bunny-stackable?source=22 \n\n 20260321_181344 1920×2560 405 KB \n\n 20260321_175733 1920×2560 278 KB \n\n 20260321_181834 1920×2560 138 KB \n\n 20260321_181848 1920×2560 252 KB\n\nFantastic print!\n\nVery clever approach on printing!","url":"https://forum.creality.com/t/maximize-your-print-and-filament-no-supports-no-waste/49842","productLine":"park","version":"","problemType":"","model":"K2","grade":"泛讨论","replyCount":4,"views":81,"likeCount":3,"tags":["showcase","crealityprint","creality-cloud"],"relReason":"tag","sourceType":"用户"},{"uid":"f8daae5cba2d3503","topicId":49799,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-24","lastActive":"2026-03-24","title":"K Pro Update 1.1.4.1 malfunction (2026-03-23)","originalText":"Finished a print on the K2 Pro and an update popped up. Downloaded the 1.1.4.1 and rebooted. Printer sends the table to the bottom and stops. Nothing but a weird low speed fan noise.\n\n I did a factory reset and let it do a function check. Everything turned out good and now seems to be functioning normally.\n\nDid you root the printer and run the script to install options? If yes, you should have reset to factory before updating firmware!\n\n If the problem is stil there, try with updating from USB-stick instead of letting the printer download the firmware!","url":"https://forum.creality.com/t/k-pro-update-1-1-4-1-malfunction-2026-03-23/49799","productLine":"firmware","version":"","problemType":"","model":"K2 Pro","grade":"泛讨论","replyCount":2,"views":131,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"6ab01acb20733201","topicId":49774,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-22","lastActive":"2026-03-22","title":"3D Printer Files | 3MF File | 🍋 Zesty Stack – Lemon Slice Coaster Set |","originalText":"3D Printer Files | 3MF File | 🍋 Zesty Stack – Lemon Slice Coaster Set | Creality... \n \n\n \n \n\n 3D Printer Files | 3MF File | 🍋 Zesty Stack – Lemon Slice Coaster Set |... \n\n Brighten up your space with a splash of citrus charm! The Zesty Stack is a vibrant 8-piece coaster set inspired by fresh lemon slices, neatly stacked in a sleek holder for easy access. Each coaster delivers a juicy pop of color while protecting your...\n\n \n\n \n \n \n \n\n \n \n\n Brighten up your space with a splash of citrus charm! The Zesty Stack is a vibrant 8-piece coaster set inspired by fresh lemon slices, neatly stacked in a sleek holder for easy access. Each coaster delivers a juicy pop of color while protecting your surfaces from spills and heat.\n\n IMG_20260322_151016 1920×2560 250 KB \n\n Finished with a glossy UV resin coating, these coasters have a smooth, glass-like shine that enhances the vibrant lemon design while adding extra durability and easy cleaning.\n\n IMG_20260322_150711 1920×2560 235 KB \n\n Perfect for entertaining or everyday use, this set is where functionality meets fun—because even your drinks deserve a little zest! \n\n {\"src\":\"https://forum.creality.com/uploads/default/original/3X/c/5/c50d1142a9fcecb7cd68ce652bdebebb5077b121.3mf\",\"poster\":\"https://forum.creality.com/uploads/default/original/3X/b/6/b6bb107d65fbdf371f774b95a3be97b6f2680f83.jpeg\"}","url":"https://forum.creality.com/t/3d-printer-files-3mf-file-zesty-stack-lemon-slice-coaster-set/49774","productLine":"print","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":1,"views":32,"likeCount":0,"tags":["crealityprint","k2plus","ender-3-v3-ke","showcase"],"relReason":"tag","sourceType":"用户"},{"uid":"c8ae35466e3437fe","topicId":49749,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-21","lastActive":"2026-03-26","title":"Home (G28) without heating up","originalText":"Printer Creality CR-6 SE, Motherboard: CR-ERA v1.1.0.3.\n\nMotherboard and screen running code from CF6.1.1-Final-cr6-se-v4.5.3+v1.1.0.3ERA-mb-2024-12-16.zip.\n\n For testing purposes I need to send commands to the printer. To set home I issue G28 or G28 X0 Y0.\n\nWith both commands the printer starts to heat up bed and hotend totally unnecessary.\n\nHow can I home the printer without the heating?\n\nHow do you send the command to the printer? A simple G28 shouldn’t result in heating up hotend or bed!\n\nYes and no. G28 X0 Y0 switches to a heating-up window for some seconds then revert back to normal.\n\nThe community firmware seems a bit sloppy. Rough-and-ready / quick and dirty programming.","url":"https://forum.creality.com/t/home-g28-without-heating-up/49749","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":3,"views":55,"likeCount":0,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"2d7f73148fd01280","topicId":49736,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-20","lastActive":"2026-03-20","title":"What software is in these pictures","originalText":"What software is in this picture…. Be gentle I’m new to the 3D printing world\n\n image 786×948 146 KB\n\nThat is the klipper interface that most printers now use. Certainly Creality and Elegoo. You can get there from the slicer in Elegoo and for Creality printers go to IP address of printer e.g., https://192.168.2.122:4408\n\nWhat model printer do you have? From the photo provided this could be the down graded version of Fludd from creality print. If your printer is one of the K2 series then you can access the full version of fluidd as Nasha has indicated - your printers IP address +:4408. IF you printer is a k1 then this is not available unless you root the printer and install other software (except the new K1c 2025 which creality has not provided root access).\n\n Bill","url":"https://forum.creality.com/t/what-software-is-in-these-pictures/49736","productLine":"firmware","version":"","problemType":"ui","model":"K1C","grade":"有效","replyCount":3,"views":83,"likeCount":2,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"08c7d67d628e9640","topicId":49709,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-19","lastActive":"2026-03-19","title":"OctoPrint.org - Descarga e instalación de OctoPrint","originalText":"OctoPrint.org - Descarga e installing de OctoPri\n\n nt OctoPrint.org - Download & Setup OctoPrint","url":"https://forum.creality.com/t/octoprint-org-descarga-e-instalacion-de-octoprint/49709","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":28,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"5a76ae450b86347e","topicId":49708,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-19","lastActive":"2026-03-19","title":"OctoPrint.org - Descarga e instalación de OctoPrint","originalText":"OctoPrint.org - Descarga e installing de OctoPri\n\n nt OctoPrint.org - Download & Setup OctoPrint","url":"https://forum.creality.com/t/octoprint-org-descarga-e-instalacion-de-octoprint/49708","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":22,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"fd1ec30bbf365332","topicId":49639,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-17","lastActive":"2026-03-17","title":"Gear Bracelet","originalText":"3D Printer Files | 3MF File | Mechanical Motion Gear Bracelet | Creality Cloud \n \n\n \n \n\n 3D Printer Files | 3MF File | Mechanical Motion Gear Bracelet | Creality Cloud \n\n The ConceptTake your love for engineering everywhere you go. This Gear Bracelet is a fusion of industrial style and functional mechanics. Designed with a modular approach, the center gears are printed separately to ensure high-precision teeth and a...\n\n \n\n \n \n \n \n\n \n \n\n 20260315_140259 (1) 1920×2560 151 KB","url":"https://forum.creality.com/t/gear-bracelet/49639","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":23,"likeCount":0,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"a2802a2160f00a22","topicId":49643,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-17","lastActive":"2026-04-28","title":"Creality Hi \"Motion Advance\" setting added by mistake?","originalText":"Hello,\n\n I was wondering if anyone knew why the latest update (V1.1.0.65) added “Motion Advance” to the Creality Hi. AFAIK the Hi doesn’t have the necessary hardware in the tool head to be able to perform it, along with Creality Print not adding the needed Gcode to files for the printer to even attempt it, resulting in an error( AC0504) from the printer at start of print.\n\nThey listed it as a feature in the firmware release notes so don’t think it was a mistake. I think it uses the input shaping sensors for additional compensation for VFAs\n\nweird that they added the feature without proper support from the slicer, hopefully it’ll be addressed in the next update for the slicer","url":"https://forum.creality.com/t/creality-hi-motion-advance-setting-added-by-mistake/49643","productLine":"firmware","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":17,"views":974,"likeCount":8,"tags":["firmware"],"relReason":"tag","sourceType":"用户"},{"uid":"2ba3af162581b4f6","topicId":49611,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-15","lastActive":"2026-03-15","title":"Creality Print does not support CR-6 MAX printers","originalText":"The only supported printer is the CR-6 SE, which means I either cannot take advantage of the larger bed area, or I have to configure an entirely custom printer; I should not have to create a standard Creality printer inside Creality’s own software. This also means I cannot add my CR-6 MAX from the Sonic Pad attached to it, because Creality Print doesn’t recognize it.\n\n Please add support for the CR-6 MAX to Creality Print.","url":"https://forum.creality.com/t/creality-print-does-not-support-cr-6-max-printers/49611","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":54,"likeCount":1,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"1d7cb3410aa6115a","topicId":49573,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-13","lastActive":"2026-04-06","title":"BUG_CrealityPrint_V_7.0_Duplicated_Send_Window","originalText":"Hello,\n\n I found a bug in Creality Print 7.0 .\n\n Issue: \n\nWhen I click “Send Print” , two separate windows open for sending the print job instead of just one.\n\n System information: \n\n \n \n OS: Windows 11 \n\n \n \n Software: Creality Print 7.0 \n\n \n \n Version: Latest updated version \n\n \n \n Expected behavior: \n\nClicking “Send Print” should open only one send-print window.\n\n Actual behavior: \n\nClicking “Send Print” opens two windows. See attached image.\n\n Steps to reproduce: \n\n \n \n Open Creality Print 7.0\n\n \n \n Prepare a model for printing\n\n \n \n Click “Send Print” \n\n \n \n Two send-print windows appear\n\n \n \n Notes: \n\nThis started happening after the latest update.\n\n Thank you.\n\n image 1571×881 213 KB\n\nHi! I am using same OS and Creality Print version but did not get this problem. You can contact Creality Support to send info about this issue. I hope it will be repaired soon! Here’s the link to find contact to the Creality support - you can use chat for example - Creality Aftersales\n\nhaha, so it is not a feature, i was wondering why there is a secondary window, that allows me to turn off/on calibration, despite the printer already printing stuff.","url":"https://forum.creality.com/t/bug-crealityprint-v-7-0-duplicated-send-window/49573","productLine":"print","version":"7.0","problemType":"compat","model":"未标注","grade":"有效","replyCount":4,"views":86,"likeCount":1,"tags":["bug-report","slicingsoftware","crealityprint-7"],"relReason":"tag","sourceType":"用户"},{"uid":"8c81bf825006ebce","topicId":49563,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-13","lastActive":"2026-03-15","title":"Modifiers effect on infill and walls","originalText":"I have been experiencing issues using modifiers to locally alter infill. Wall thickness seems to behave exactly as expected, however infill on the modifier appears to affect the entire object, even outside the modifier.\n\n step_01 1261×634 77.7 KB \n\n I create an object and set it to 5% infill, 2 walls globally\n\n step_02 1224×795 68.3 KB \n\n model is set to 5% infill and 2 walls at the object level\n\n step_03 1175×819 64.5 KB \n\n Modifier at the object level is set to 50% infill and 10 walls\n\n step_04 1163×699 64 KB \n\n after slicing, the entire model is %50 infill, however the wall loops setting is respected. I would have expected within the modifier to be 50% infill and 5% outside the modifier?\n\n Did I use the modifier/settings incorrectly, or is this the expected behavior (if so, what is the infill setting on the modifier useful for?\n\nWhat have you selected on the left side where the different objects show while you changed the per object settings? Was the main object accidentally selected?\n\nI don’t think I selected the wrong objects. The white guides indicate what is selected on the plate I thought?","url":"https://forum.creality.com/t/modifiers-effect-on-infill-and-walls/49563","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":6,"views":114,"likeCount":1,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"fbe447ca2bd3f6e0","topicId":49501,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-12","lastActive":"2026-03-16","title":"Slicer is not working properly HELP!","originalText":"My slicer is all of a sudden not doing as well as it has. I have tried uninstalling and reinstalling, light mode, I have downgraded to V5 and still does not cut correctly. As you can see from the pics The marker protruding is not there. it has the cup and the letters but cuts off part of the marker. Has anyone seen this before and do you know the fix.\n\n Creality2 1920×888 135 KB \n\n creality 1 2725×1386 201 KB\n\n@3Doober welcome to the forum Can you download and try to slice this exact model in Orca Slicer?\n\n \n \n \n\n Orca Slicer \n \n\n \n \n\n Orca Slicer » 3D Printing Slicer [Download Now] \n\n Download the latest version of Orca Slicer for free to prepare 3D models for printing. Get fine-tuned prints with Ocra's calibration tools and AI algorithm.\n\n \n\n \n \n \n \n\n \n \n\n Let me know if it slices correctly or if the issue still persists. This will allow us to narrow down on whether the issue is related to a software bug in Creality Print or if it’s caused by the model itself having some issue.\n\n Warmest Regards\n\n Alawhie\n\n3Doober: \n \n owngraded to V5 and still does not cut correctly. As you can see from the pics The marker protruding is not there. it has the cup and the letters but cuts off part of the marker. Has anyone seen this before and do you know the fix.\n\n \n \n Hello !\n\nHave you tried to use the “repair” function ?\n\nWhen the slicer doesn’t see a surface/volume, it generally is because there is a modeling issue","url":"https://forum.creality.com/t/slicer-is-not-working-properly-help/49501","productLine":"thirdparty","version":"","problemType":"other","model":"未标注","grade":"有效","replyCount":9,"views":196,"likeCount":2,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"d84f8144a2e12dcb","topicId":49521,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-12","lastActive":"2026-03-12","title":"Filament temperature - silly question","originalText":"Ok, this may be … no it is a noob question, but first time I’ve come across it after nearly 12 months: I have a PLA filament (Galaxy black) that needs a higher temperature when printing from the CFS - just slides right off the bed using Generic PLA - but for the life of me can’t get the workflow right,\n\n So how /where do I force a higher temperature? Do I create a new custom filament with a higher temperature range and load that into the CFS (how?) or is there a way of bumping up the temperature within the SLicer settings?\n\nHi at @GSV_NFA There’s no such thing as a noob or silly question here so feel free to ask anything and we will assist to the best of our ability. We all started somewhere and then learnt along the way. Soon enough you will be giving other users advice on how to solve problems.\n\n Kindly have a look at this post where I responded to another user. His issue was different, but the same calibration principles still apply. You can start with a generic profile and then get everything dialled in perfectly in this way:\n\n \n \n \n \n \n Complete Newbie Welcome & Introduce Yourself \n \n \n \n @SASSpud looks like you’re having some layer shift issues here. In the case of the V3 SE, you’d want to look at belt tension if the issue is isolated. But let’s not go there yet. I think instead, let’s get this baby calibrated from scratch (Considering that CP recognised it incorrectly in the first place). \nA. Let’s start by removing and re-adding the printer in Creality Print. Check that it’s being detected correctly this time around. Then ensure that Z-Offset is correct: \n\n \n [Perfect Z-Ax… \n \n \n\n If you run into any issues, get in touch here then we will deal with it accordingly \n\n Warmest Regards\n\n Alawhie","url":"https://forum.creality.com/t/filament-temperature-silly-question/49521","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":64,"likeCount":3,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"c3e19b6b968a4998","topicId":49449,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-11","lastActive":"2026-03-11","title":"Pink Parade Zoo Biscuit Clicker","originalText":"A proudly South African classic with a cute twist! The Pink Parade Zoo Biscuit Clicker is inspired by the iconic Zoo Biscuits we all grew up loving. Featuring two golden “biscuit” layers hugging a sweet marshmallow, topped with a playful pink icing with playful white animal silhouettes, this little treat brings pure nostalgia with a modern, yet playful vibe.\n\n \n IMG_20260301_183322 1920×2560 300 KB \n\n \n With its cheeky eyes and tiny mouth detail, it’s not just a biscuit—it’s a bite-sized celebration of SA snack culture. Perfect for collectors, gift boxes, or anyone who knows that Zoo Biscuits are more than a snack… they’re a memory!\n\n \n \n\n Link to Model on Creative Cloud\n\nLooks cute ! Giving you a boost \n\nAlso, please try to add the .stl or .3mf file please\n\nI tried to add, but the file is too big. I see you boosted my model on Creality, thank you so much! Please post a print.","url":"https://forum.creality.com/t/pink-parade-zoo-biscuit-clicker/49449","productLine":"print","version":"","problemType":"","model":"Ender-3 V3 KE","grade":"泛讨论","replyCount":3,"views":35,"likeCount":1,"tags":["crealityprint","k2plus","ender-3-v3-ke"],"relReason":"tag","sourceType":"用户"},{"uid":"7ac06f3526b832b0","topicId":49395,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-10","lastActive":"2026-03-10","title":"New PythonSCAD functionality: use of colormaps for laser cutting (Creality Falcon-2)","originalText":"I reciently added the ability to design parts using PythonSCAD and directly generate GCode for my Creality Falcon-2, and inported into LaserGRBL without having to manipulate the GCode generation popup, or modify LaserGRBL’s color’s power/feed settings. This additionional functionalty has been accepted into PythonSCAD and was part of the recient v0.17 release. There are three different ways to drive this functionality:\n\n \n setting a color’s power/feed settings via a colormap and constant power. This works the same as both LightBurn and LaserGRBL’s interface where a user can set the power and feed of a given color. \n using the dynamic power/feed settings, the color and power are encoded in the RGBA values of the part directly. \n the thrid programmable interface was requested by a user that did not want to play with the color maps, but wanted to force it explicitly when exporting the model. This can be called directly by calling export() for a give part - ex. part.export(filename,power,feed) \n lastly, there there is a pop-up where you can set the power and feed directly, but that sets a single value for all parts in that file. If you want to both engrave and cut in a single gcode program file, you need to write each operation to seperate files. The colormaps allows you to arbitrarily set as many speeds and feeds within a single gcode file. By combining these techniques, I have been able to design a part, made of multiple different materials, and output the colormapts for both engraving and cutting to each maerials gcode file. \n \n A couple of simple examples are given in PythonSCAD’s example/GCode directory. Please report any bugs to the GitHub page < https://github.com/pythonscad/pythonscad >.\n\n As a note, others are looking into extending this work to 3D printing. Since I do not own a working 3D printer at this time I do not expect to be involved with this, but do stay tuned to PythonSCAD’s announcements, or join the discussion list https://groups.google.com/g/pythonscad \n\n Happy Making!\n\n EBo –","url":"https://forum.creality.com/t/new-pythonscad-functionality-use-of-colormaps-for-laser-cutting-creality-falcon-2/49395","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":34,"likeCount":0,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"647f8ba6946356da","topicId":49343,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"ZH","date":"2026-03-10","lastActive":"2026-06-01","title":"Creality Print Windows Webview Installation Failure Guide","originalText":"WebView installation failure may result in the following scenarios. Take corresponding steps based on the symptoms encountered:\n\n The added printer page shows as blank \n If WebView is not installed or has failed, the Add Printer page in Creality Print may appear blank.\n\n \n\n Uninstall existing Edge \n Download the uninstaller: Releases · ShadowWhisperer/Remove-MS-Edge · GitHub \n\n (Program source: https://github.com/ShadowWhisperer/Remove-MS-Edge ) \n\n Download and unzip the file and run it with administrator permission\n\n \n\n Reinstall Microsoft Edge \n Redownload and install Edge browser from Microsoft’s official website: Download Microsoft Edge: Windows, macOS, iOS & Android \n\n \n\n \n\n Download and install Microsoft WebView2 \n /microsoftedgewebview2runtimeinstallerx64.exe \n\n Restart Creality Print \n After the Edge installation is complete, restart CrealityPrint，select Yes in the pop-up window, CrealityPrint will be launched automatically after the installation is complete.\n\n \n\n \n\n \n\n Compatibility issue error \n \n\n Download the registry file and double-click to import it. Then restart CrealityPrint.\n\n /crealityprint/webview中文/fix_webview.reg\n\nThis does not seem to work. I have followed the steps. I still get the error that it could not create the data directory. Creality seems to want to write to this directory but does not have permission. It should write to C:\\Temp\n\n image 412×188 5.18 KB","url":"https://forum.creality.com/t/creality-print-windows-webview-installation-failure-guide/49343","productLine":"print","version":"","problemType":"crash","model":"未标注","grade":"有效","replyCount":2,"views":160,"likeCount":0,"tags":["crealityprint"],"relReason":"tag","sourceType":"用户"},{"uid":"1ecda7c1c5cb8ee9","topicId":49329,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-09","lastActive":"2026-03-11","title":"New Model Dropped","originalText":"Meet Wiggle Trunk Ellie, the funky little elephant that loves to wiggle! Designed in Nomad Sculpt and brought to life with 3D printing and a touch of paint, this adorable articulated elephant features bendy legs, a flexible trunk, and a playful personality. With its chunky body, cute tusks, and floppy ears, Wiggle Trunk Ellie is perfect for fidgeting, posing, or adding a splash of charm to your desk.\n\n \n \n Whether it’s wiggling its way into your collection or stomping into someone’s heart, this little elephant proves that big personality can come in small, wobbly packages.\n\n \n {\"src\":\"https://www.crealitycloud.com/model-detail/wiggle-trunk-ellie-the-elephant?source=26\",\"poster\":\"https://forum.creality.com/uploads/default/original/3X/5/e/5ed13a2ba1ca6de7ee37466b64db351f1f0fa8d6.jpeg\"}\n\nVery nice @Pamela_Woest I’m sure lots of kids will have fun with this articulated elephant and the process of painting it Keep up the awesome work\n\nThank you.","url":"https://forum.creality.com/t/new-model-dropped/49329","productLine":"cloud","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":56,"likeCount":4,"tags":["general-discussions"],"relReason":"category","sourceType":"用户"},{"uid":"de8d852b64423044","topicId":49318,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-08","lastActive":"2026-03-09","title":"NEED Help Top Surface Layer","originalText":"SP 712×688 132 KB \n\n Hi Everyone, I am trying to print a flat design with name but on the top surface of base it print the text on. How can I smoothen the top surface? because it really give bad surface.\n\nI’d start with flow rate calibration. Personally, I find the auto calibration as good or than the test pattern and my judgement, and way faster.","url":"https://forum.creality.com/t/need-help-top-surface-layer/49318","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":2,"views":46,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"8b4e035a60511a02","topicId":49320,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-08","lastActive":"2026-03-08","title":"Infill anchor settings greyed out in 7.0.1","originalText":"Hi, I’m trying to reinforce the front section of the wing using long infill anchors. The settings for sparse infill anchors are greyed out no matter what I select or do. Any idea what is causing this?\n\n This works perfectly in Prusa Slicer, but I still would like to try printing the wing from Crealty Slicer.\n\n grafik 1901×976 186 KB","url":"https://forum.creality.com/t/infill-anchor-settings-greyed-out-in-7-0-1/49320","productLine":"thirdparty","version":"","problemType":"ui","model":"未标注","grade":"有效","replyCount":1,"views":32,"likeCount":0,"tags":["crealityprint","trouble-shooting"],"relReason":"tag","sourceType":"用户"},{"uid":"11a241a8b556362d","topicId":49263,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-04","lastActive":"2026-03-05","title":"I need firmware that creality no longer support","originalText":"I am looking for the firmware for a LD 003 where in the world can I get the download file\n\nWAYBACK MACHINE\n\nI know but would really like to get it up and running","url":"https://forum.creality.com/t/i-need-firmware-that-creality-no-longer-support/49263","productLine":"firmware","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":4,"views":58,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"c43f509acbcd982c","topicId":49233,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-03-03","lastActive":"2026-03-04","title":"Creality Hi - manual filament change","originalText":"My brother has a Creality Hi without CFS (I have one with CFS).\n\n The question is whether it is possible to do multicolor prints with manual filament change ?\n\nOn my Creality Ender3v3 I can do it with a custom klipper maco, that parks the hotend and automatically makes retract of filament - so one only would have to insert the new color, extrude until the new color is “pure”, and then continue…\n\n Can a similar approach be used on the Hi ? I cannot see any “park” macro in printer.cfg - that is why I am a bit unsure….\n\nHi @bipsen Trust you are well. I do not personally have a Creality Hi to test this on, so take this more as an assumption rather than hands on experience.\n\nSince the Hi runs a modified version of Klipper under Creality OS, in theory there is no reason why manual multicolour prints would not be possible. At its core it is still a single extruder machine unless the CFS is attached, so colour changes should be achievable the same way we do it on other Klipper based printers.\n\nFrom what I understand, Creality does not include a built in park or M600 macro in the default printer.cfg because they expect colour changes to be handled by the CFS. That is likely why you are not seeing anything obvious in the config.\n\nThe simplest approach should be inserting a pause at layer height in the slicer. When the print pauses, you manually swap filament, purge until the new colour runs clean, and resume the print. That method generally works on most Klipper based machines without any firmware edits.\n\nIf Creality OS allows macro editing on the Hi, then in theory you could also define your own M600 style macro to retract, lift Z, park the toolhead, and pause, similar to what you are doing on the Ender 3 V3. I just cannot confirm firsthand how locked down the Hi firmware is in this regard.\n\nMaybe someone who actually owns the Hi without CFS and has tried this can chip in and confirm how open the config is and whether custom macros work as expected. I would also be interested to hear real world feedback.\n\n Cheers\n\n Alawhie\n\nJust doing swaps at layer heights might not be the right solution, if multiple colors exist at the same height.\n\n I think it is possible to mark the printer for manual filament change (property), but I guess the M600 command then needs to be added somewhere in the gcode configuration for color swap (which probably is empty by default).","url":"https://forum.creality.com/t/creality-hi-manual-filament-change/49233","productLine":"firmware","version":"","problemType":"","model":"Creality Hi","grade":"泛讨论","replyCount":5,"views":291,"likeCount":4,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"898b24da2a348df2","topicId":49163,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"FR","date":"2026-02-28","lastActive":"2026-02-28","title":"!!!  best connect SpacePi X4 and VFS on creality K2 Plus !!!","originalText":"Comment, quel personne a une idée.\n\n How, which person has an idea?","url":"https://forum.creality.com/t/best-connect-spacepi-x4-and-vfs-on-creality-k2-plus/49163","productLine":"print","version":"","problemType":"","model":"K2 Plus","grade":"泛讨论","replyCount":1,"views":25,"likeCount":0,"tags":["spacepix"],"relReason":"category","sourceType":"用户"},{"uid":"69b6158600f41523","topicId":48936,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-18","lastActive":"2026-02-18","title":"Creality Print 6.2.2 for K2 Plus: Invalid Custom G-Code","originalText":"Creality Print has been working well for me for months. Now, all of a sudden, I get the following error message whenever slicing. I am using the default settings – there is no custom G-code.\n\n image 565×205 7.2 KB \n\n What can I do to get past this message?\n\nTry with removing you printer and then adding your printer again in Creality Print.\n\n@Mr_MBR . Thanks for the suggestion. I tried removing the printer. It forced me to select another printer. That one sliced properly. I reselected the K2 Plus and got the same error message. Same message with any nozzle selection.\n\n Then I tried doing that with other randomly selected printers, which sliced properly. Closed the software, reopened the software, added the K2 Plus and got the slicing error again. I did this with multiple randomly selected printers.\n\n I did this testing through the Printer Settings with the nozzle selections. Is there another way to add/remove printers?","url":"https://forum.creality.com/t/creality-print-6-2-2-for-k2-plus-invalid-custom-g-code/48936","productLine":"print","version":"6.2.2","problemType":"other","model":"K2 Plus","grade":"有效","replyCount":3,"views":245,"likeCount":0,"tags":[],"relReason":"category","sourceType":"用户"},{"uid":"2315ced8415c230f","topicId":48939,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-18","lastActive":"2026-02-18","title":"How is this a Tree Support?","originalText":"CP version 7.0.1.4212\n\n I enable Support, select Type = Tree(Auto), Style = Default, and get this:\n\n image 1920×1173 209 KB \n\n Normal(Auto) looks a little more like the normal boxy style supports, but both Tree(Auto) looks like the above. It seems strange to me.\n\n Style = Tree(Slim) looks better:\n\n image 1920×1244 241 KB \n\n Style = Tree(Hybrid) looks very similar to Normal(Auto).\n\n Is this a bug in CP?","url":"https://forum.creality.com/t/how-is-this-a-tree-support/48939","productLine":"print","version":"","problemType":"","model":"未标注","grade":"泛讨论","replyCount":1,"views":62,"likeCount":0,"tags":["trouble-shooting"],"relReason":"category","sourceType":"用户"},{"uid":"e885d573ccf34d07","topicId":48935,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-18","lastActive":"2026-03-21","title":"Camera Dirty error before launch print since last firmware update 1.1.3.6 on K2 Pro","originalText":"Hi,\n\n Since the last firmware update on my K2 Pro (1.1.3.6) i have an issue with the new feature “smart light”.\n\nif my room is in the dark and the light of the printer is turned off (waiting going on by the smart system) and i try to launch a print i have an error “dirty camera”.\n\nif i turn on manually the light of the printer and aknoledge the error on the printer screen and restart the print, it’s ok.\n\non my point of view the light don’t turn on automaticaly before the self test of the camera and the system think there is a default because the image on the camera is too dark.\n\n can you solve this issue ?\n\ni’m the only one to have this issue ?\n\ni know it’s a minor issue but in fact for me it’s completly impossible to use this new cool feature \n\n Thank you for your help\n\nThank you for the post! I have recently have had the same issue - I turn the light off and then later go to turn it back on and boom there is a problem and this same dirty camera or blocked message comes up. I thought I f’d my device and then I would have to hide from the wife since she bought for me for Christmas!","url":"https://forum.creality.com/t/camera-dirty-error-before-launch-print-since-last-firmware-update-1-1-3-6-on-k2-pro/48935","productLine":"firmware","version":"","problemType":"other","model":"K2 Pro","grade":"有效","replyCount":2,"views":74,"likeCount":1,"tags":["bug-report"],"relReason":"strong","sourceType":"用户"},{"uid":"c205c2719f802456","topicId":48928,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-17","lastActive":"2026-05-15","title":"How do you defined the \"excluded bed area\" w/in Creality Print","originalText":"So w/in Creality Print when viewing the Printer Settings, in the Basic Information section, there’s a “excluded bed area“ field that I cannot find any examples online, or in the Online Help pages that describes how this should be set.\n\n The description just says: Unprintable area in XY plane. The area is expressed as polygon by points in the following format: ‘XxY, XxY, ….”\n\n Can someone give an example of what this should be? If I have the glass bed, and I have those metal bag clips holding the glass bed in all 4 corners I want to exclude the 10mm from around the entire bed from the printer head running into those clips. How do I say that in this field?\n\n I want to exclude the outer border of the 300x300 bed in a width of 10mm around the border.\n\n GlassBedWithBinderClipsExcludeRegion 1024×576 123 KB\n\nOk there is something really wrong with the software.\n\nI did the following points:\n\n This draws the outside border of the square/polygon:\n\n 0x0 is front left of the bed if you are looking at it from top down. So drawing a square from bottom left (0x0), to bottom right (300,0), to upper right (300,300) to upper left (0,300) back to bottom left (0x0)\n\n 0x0, 300x0, 300x300, 0x300, 0x0,\n\n Then same thing but inner square now which is 10mm in diameter:\n\n 10x10, 290x10, 290x290, 10x290, 10x10\n\n ExcludedAreaDefinitionCrealityPrintv7 1286×643 106 KB \n\n Which when defined w/in Creality Print v7.0 in the “Excluded Bed Area” I can see the excluded gray area, BUT the stupid program thinks my object is touching that area and I can’t slice/print. \n\n CrealityPrintEBA_Error_ModelNotTouching 1464×995 193 KB \n\n Did anyone at Creality test this?\n\nHello @CREALITY anyone here can address this? How do you defined the exclude area properly? There’s no documentation regarding this to get it working.","url":"https://forum.creality.com/t/how-do-you-defined-the-excluded-bed-area-w-in-creality-print/48928","productLine":"print","version":"","problemType":"compat","model":"未标注","grade":"有效","replyCount":7,"views":211,"likeCount":0,"tags":["trouble-shooting","crealityprint-v6"],"relReason":"tag","sourceType":"用户"},{"uid":"70f980a6253e3c86","topicId":48915,"platform":"Creality 官方论坛","site":"Creality 官方论坛","channel":"官方论坛","country":"US","language":"EN","date":"2026-02-17","lastActive":"2026-02-21","title":"Creality print improvement or suggestion","originalText":"Hi,\n\nI’m Antonio and i have a wish about creality print or need a suggestion.\n\nI give an example what i want.\n\nI’ve a stupid pipe 300 layer high designed with an inner (90 mm) and an outer diameter (120mm)\n\nI use only 1 spool no CFS.\n\nI need to print it from layer 1 to 99 with 6 wall loops, from layer 100 to 199 with 4 wall loops and from 200 to end with 2 wall loops.\n\nAs sample look at simplify3D it has processes so you can decide this changes using the layers as interval of actions.\n\nHow can I do what i want?\n\nit similar like a CFS system where there are 3 spools same colour and i change rules of printing when I change the spool.\n\nAny suggestion or kind reply is really appreciated.\n\n Thank you\n\nAntonio\n\nFor questions like this I use AI (X’s Grok). This is what it suggests:\n\n \n The easiest and cleanest way to do exactly what you want (different wall loops in specific layer ranges on one model, one spool) is to use OrcaSlicer instead of Creality Print. Creality Print has geometric modifiers (right-click → Add modifier), but they are not true height-range overrides like Simplify3D “processes” and are clunky for this — you’d have to stack multiple cylinder/box modifiers at exact Z positions and hope the wall count overrides cleanly without extra perimeters at the boundaries. It works for infill sometimes, but not reliably for wall loops on a tall pipe.OrcaSlicer (free, open-source, excellent Creality support) has Height Range Modifiers — the direct equivalent of Simplify3D processes. Almost every Creality user on the forum who needs this kind of per-layer control switches to Orca and never goes back.Quick setup in OrcaSlicer (5 minutes)\n\n \n \n \n \n Download the latest OrcaSlicer from the official GitHub:\n\n https://github.com/SoftFever/OrcaSlicer/releases (pick the newest .exe for Windows or .AppImage for Linux, etc.)\n\n \n \n Open it → it already has profiles for almost every Creality printer (K1, Ender-3, CR series, etc.). Select yours or import your Creality Print profile if you want.\n\n \n \n Import your pipe STL.\n\n \n \n Set your normal settings first (layer height, speed, filament, etc.). Slice once so you can see the total height and layer count in the preview.\n\n \n \n Now add the height-range modifiers (this is the magic part):\n\n \n \n In the right panel (Objects list), right-click your pipe → Add Height Range Modifier.\n\n \n \n A new “Height range modifier” appears under your model.\n\n \n \n You can add as many as you need by clicking the + button at the bottom of the Objects list while the first modifier is selected.\n\n \n \n \n \n Set the three ranges (use mm, not layer numbers):\n\n \n \n First modifier: Bottom = 0 mm, Top = height of layer 99\n\n(if you use 0.2 mm layers → 99 × 0.2 = 19.8 mm)\n\n \n \n Second: Bottom = height of layer 100, Top = height of layer 199\n\n(e.g. 20 mm – 39.8 mm)\n\n \n \n Third: Bottom = height of layer 200, Top = full model height\n\n(e.g. 40 mm – 60 mm for a 300-layer/0.2 mm print)\n\n \n \n Tip: After slicing once, look at the right-side layer slider — it shows exact Z heights and layer numbers. Use those values so the transitions are perfect.\n\n \n \n For each modifier:\n\n \n \n Click the modifier in the Objects list.\n\n \n \n In the settings panel on the right, search for “Wall loops” (or go to the Walls/Strength tab).\n\n \n \n Set it to 6 on the first modifier, 4 on the second, 2 on the third.\n\n \n \n The base process can stay at 2 loops — the modifiers will override only in their Z range.\n\n \n \n \n \n Slice → check the preview. You will see the wall count change exactly at the layer ranges you set (outer + inner walls of the pipe will both respect it). Print normally.\n\n \n \n Why this is better than anything else\n\n \n \n Exactly like Simplify3D processes, but free and actively developed.\n\n \n \n Works perfectly on pipes/tubes because the modifier is height-only (applies to the whole XY slice in that Z band).\n\n \n \n No G-code editing, no merging files, no risk of seams or failed transitions.\n\n \n \n You can still use all your Creality printer profiles, Klipper macros, etc.\n\n \n \n If you really want to stay 100 % inside Creality Print, the geometric-modifier workaround is possible but messy (add three short cylinder modifiers that exactly cover the pipe wall thickness in each Z band and override Wall loops in each). Most people who try it end up switching to Orca anyway.Try Orca — you’ll thank yourself. It’s what 90 % of the advanced Creality users on the forum actually slice with when they need per-layer control like this.\n\nOh thank you a lot for your kind and quick answer.\n\nI used AI (ChatGPT) before my post but sincerely I prefer answer from users for sharing experience.\n\n Regards\n\nAntonio","url":"https://f
