  if(!majors.length) return '<div class="empty">无可归类的版本数据</div>';

  majors.forEach(function(mv){
    keys.forEach(function(k){
      var n = valid.filter(function(x){return majorOf(x.version)===mv && x.problemType===k;}).length;
      if(n>mx) mx=n;

    var tds = keys.map(function(k){
      var n = sub.filter(function(x){return x.problemType===k;}).length;

      '<div class="sno">'+k+'</div>'+
      '<div class="snm">'+esc(s[1])+'</div>'+
      '<div class="scnt" style="color:'+STAGE_COLOR[k]+'">'+n+'<span class="sunit">条</span></div>'+
      '<div class="sval">有效 '+v+' · 泛 '+(n-v)+'</div>'+
      '<div class="sbar"><i style="width:'+(n/mx*100)+'%;background:'+STAGE_COLOR[k]+'"></i></div>'+
    '</div>';
  }).join("");
  return '<div class="stgrid">'+grid+'</div>'+
    '<div class="stgap'+(S.stage==="跨环节"?" on":"")+'" data-pick="stage" data-val="跨环节">'+
      '<span>跨环节 · 软件自身 UI / 安装 / 升级 / 文件管理（不对应路径某一环，不硬塞进段里）</span>'+
      '<span class="gv">'+gap+' 条</span></div>'+
    '<div class="stnote">路径覆盖 '+((base.length-gap)/total*100).toFixed(1)+'% · '+
      '六段 = 用户从「找模型」到「分享变现」的实际顺序，不是产品线 · 点任一格即筛下方明细</div>';
}

/** 段 × 信源覆盖矩阵：哪一段在哪个信源有内容、哪一段是缺口 —— 这是「要不要补信源」的判断依据 */
function covMatrix(){
  var base = apply();
  var isGh = function(x){ return x.sourceType === "GitHub"; };
  var rows = STAGE_META.map(function(s){ return [s[0], s[1]]; }).concat([["跨环节","跨环节（软件自身）"]]);
  var body = rows.map(function(r){
    var k = r[0];
    var sub = base.filter(function(x){ return (x.stage||"跨环节")===k; });
    var f = sub.filter(function(x){ return !isGh(x); }).length;
    var g = sub.filter(isGh).length;
    var both = (f>0?1:0)+(g>0?1:0);
    var flag = both===2? '<span style="color:#3fb950">双源</span>'
             : both===1? '<span style="color:#8b949e">单源</span>'
             : '<span style="color:#d29922">缺口</span>';
    return '<tr><td>'+esc(r[1])+'</td>'+
      '<td class="'+(f?"":"cov0")+'">'+(f||"—")+'</td>'+
      '<td class="'+(g?"":"cov0")+'">'+(g||"—")+'</td>'+
      '<td class="gap">'+flag+'</td></tr>';
  }).join("");
  return '<table class="mx"><thead><tr><th>环节</th><th>官方论坛</th><th>GitHub</th><th>覆盖</th></tr></thead>'+
    '<tbody>'+body+'</tbody></table>'+
    '<div class="pnote">「单源」不等于缺口 —— 只说明该环节目前只有一个渠道有内容。'+
    '双源都没有的行才是真缺口（当前 S2 AI 生成）。</div>';
}

function renderPanels(){
  var A=document.getElementById("panelsA"), B=document.getElementById("panelsB");
  if(KIND==="sw"){
    // ① 实现路径六段（全宽）
    A.innerHTML = panel("用户实现路径", "六段 · 全量口径 · 点击可筛选", stagePanel(), true);

    // ② 工具结构：按「功能类型」分（用户 2026-10-20）。一级行 = 类型（可点筛选），
    //    二级行 = 具体工具名 + 归属色点。toolType 由 _col_toolname_fix.py 落库，
    //    每条只归一个类型（按主工具），故各类型之和恒等于总数、点击行数 ≡ 明细条数。
    var pT = apply("toolType");
    var tc = countBy(pT, function(x){ return x.toolType || "__none__"; });
    var arrT = Object.keys(tc).map(function(k){ return [k, tc[k]]; })
      .sort(function(a,b){
        // 「未提具体工具」不是一种类型，永远沉底
        if(a[0]==="__none__") return 1;
        if(b[0]==="__none__") return -1;
        return b[1]-a[1];
      });
    // 建模软件本轮为 0 条，但它正是用户点名要看的维度 —— 0 也要占一行并标缺口，否则会被读成「没这个分类」
    if(!tc["model"] && S.toolType!=="model") arrT.splice(arrT.length-1, 0, ["model", 0]);
    var mxT = Math.max.apply(null, arrT.map(function(z){ return z[1]; })) || 1;
    A.innerHTML += panel("工具结构","按功能类型 · 点击行可筛选",
      arrT.length? arrT.map(function(r){
        var key = r[0]==="__none__"? "" : r[0];
        var val = r[0]==="__none__"? "__none__" : r[0];
        var zero = r[1]===0;
        var on = S.toolType===val? " on":"";
        return '<div class="brow'+on+(zero?" zero":"")+'" data-pick="toolType" data-val="'+esc(val)+'">'+
          '<span class="nm">'+esc(TOOLTYPE_NAME[key]||key)+(zero?' <em class="gapm">缺口</em>':'')+'</span>'+
          '<span class="track"><i class="fill" style="width:'+(r[1]/mxT*100).toFixed(1)+'%;background:'+(TOOLTYPE_COLOR[key]||"#8b949e")+'"></i></span>'+
          '<span class="vl">'+r[1]+' · '+(r[1]/pT.length*100).toFixed(1)+'%</span></div>'+
          toolSubHTML(key, pT);
      }).join("")+
      '<div class="pnote"><i class="dot self"></i>自家 <i class="dot comp" style="margin-left:10px"></i>竞品'+
      ' —— 归属只做色点标识。每条只归一个类型（按主工具），所以点击任一行的条数与明细完全一致。<br>'+
      '建模软件 0 条：论坛里 7 条提到 CAD 工具的帖子，主体都在说切片器（「CAD 里好好的，切片后出问题」），'+
      '建模工具本身没人在这讨论。</div>'
      : '<div class="empty">暂无数据</div>');

    // ③ 问题类型构成：只算有效档（泛讨论 0 条带问题点，本就不参与）
    var p1 = applyValid("problem");
    var arr1 = Object.keys(countBy(p1,function(x){return x.problemType||"未分类";}))
      .map(function(k){return [k,countBy(p1,function(x){return x.problemType||"未分类";})[k]];})
      .sort(function(a,b){return b[1]-a[1];});
    A.innerHTML += panel("问题类型构成","分析口径 · 有效 "+p1.length+" 条",
      arr1.length? arr1.map(function(r){
        var lab = PROBLEM_NAME[r[0]]||r[0];
        var mx = Math.max.apply(null,arr1.map(function(z){return z[1];}));
        var on = S.problem===r[0]?" on":"";
        return '<div class="brow'+on+'" data-pick="problem" data-val="'+esc(r[0])+'">'+
          '<span class="nm" title="'+esc(lab)+'">'+esc(lab)+'</span>'+
          '<span class="track"><i class="fill" style="width:'+(r[1]/mx*100)+'%;background:'+(PROBLEM_COLOR[r[0]]||"#8b949e")+'"></i></span>'+
          '<span class="vl">'+r[1]+' · '+(r[1]/p1.length*100).toFixed(1)+'%</span></div>';
      }).join("") : '<div class="empty">当前筛选下无有效档条目</div>');

    // ④ 段 × 信源覆盖（替代原「版本 × 问题类型」矩阵）
    B.innerHTML = panel("段 × 信源覆盖", "全量口径 · 纯展示", covMatrix());

    // ⑤ 主版本热度
    var p3 = apply("major");
    var arr3 = Object.keys(countBy(p3,function(x){return majorOf(x.version);}))
      .map(function(k){return [k,countBy(p3,function(x){return majorOf(x.version);})[k]];})
      .sort(function(a,b){return parseFloat(b[0])-parseFloat(a[0]);});
    B.innerHTML += panel("主版本热度","条数 · 点击可筛选",
      arr3.length? arr3.map(function(r){
        var mx = Math.max.apply(null,arr3.map(function(z){return z[1];}));
        var on = S.major===r[0]?" on":"";
        return '<div class="brow'+on+'" data-pick="major" data-val="'+esc(r[0])+'">'+
          '<span class="nm">'+esc(r[0])+'</span><span class="track"><i class="fill" style="width:'+(r[1]/mx*100)+'%;background:'+(VER_COLOR[r[0].replace(".x","")]||"#8b949e")+'"></i></span>'+
          '<span class="vl">'+r[1]+' 条</span></div>';
      }).join("")+
      '<div class="pnote">原「版本 × 问题类型」矩阵已删除：35 格里多数只有 1–2 条，且 237 条泛讨论进不去，读不出规律。'+
      '版本间差异请看这里 + 明细里的版本标签。</div>' : '<div class="empty">当前筛选下无版本数据</div>');
  }else{
    var pA = apply("channel");
    var arrA = Object.keys(countBy(pA,function(x){return x.channel;})).map(function(k){return [k,countBy(pA,function(x){return x.channel;})[k]];});
    A.innerHTML = panel("信源结构","按条数 · 点击可筛选",
      arrA.length? barRows(arrA,pA.length,"channel",null) : '<div class="empty">暂无数据</div>');
    var pB = apply("source");
    var arrB = Object.keys(countBy(pB,function(x){return x.sourceType;})).map(function(k){return [k,countBy(pB,function(x){return x.sourceType;})[k]];});
    A.innerHTML += panel("载体结构","图文 / 视频 · 点击可筛选",
      arrB.length? barRows(arrB,pB.length,"source",function(){return "#bc8cff";}) : '<div class="empty">暂无数据</div>');
    var noProblem = ITEMS.filter(function(x){return x.problemType;}).length;
    B.innerHTML = panel("问题点 Top","—",
      noProblem? '<div class="empty">已有 '+noProblem+' 条可归类的问题点</div>'
      : '<div class="empty">当前 '+ITEMS.length+' 条均为媒体报道与官方物料，尚无可归类到具体问题点的用户反馈。<br>该面板在有第一条用户反馈后自动填充，不需要改页面。</div>', true);
  }
}

/* ---------------- 筛选栏 ---------------- */
function selHTML(key,label,opts){
  var o = '<div class="fg"><label>'+label+'</label><select data-k="'+key+'">'+
    '<option value="">全部</option>';
  opts.forEach(function(v){
    o += '<option value="'+esc(v[0])+'"'+(S[key]===v[0]?" selected":"")+'>'+esc(v[1])+'</option>';
  });
  return o+'</select></div>';
}
function renderFilters(){
  var el = document.getElementById("filters"), h = "";
  function opts(fn,labelFn,skip){
    var base = ITEMS.filter(function(x){ return match(x,skip); });
    var m = countBy(base,fn);
    return Object.keys(m).sort(function(a,b){return m[b]-m[a];})
      .map(function(k){return [k, (labelFn?labelFn(k):k)+" ("+m[k]+")"];});
  }
  if(KIND==="sw"){
    h += selHTML("toolType","工具类型", opts(function(x){return x.toolType||"__none__";},
      function(k){return TOOLTYPE_NAME[k==="__none__"?"":k]||k;},"toolType"));
    h += selHTML("stage","环节", opts(function(x){return x.stage||"跨环节";},function(k){return STAGE_NAME[k]||k;},"stage"));
    h += selHTML("major","主版本", opts(function(x){return majorOf(x.version);},null,"major"));
    h += selHTML("problem","问题类型", opts(function(x){return x.problemType||"未分类";},function(k){return PROBLEM_NAME[k]||k;},"problem"));
    h += selHTML("model","机型", opts(function(x){return x.model||"未标注";},null,"model"));
    h += selHTML("source","信源", opts(function(x){return x.sourceType||"未知";},null,"source"));
    h += selHTML("grade","审核", opts(function(x){return x.grade||"未审核";},null,"grade"));
  }else{
    h += selHTML("channel","渠道", opts(function(x){return x.channel;},null,"channel"));
    h += selHTML("source","来源类型", opts(function(x){return x.sourceType;},null,"source"));
    h += selHTML("lang","语种", opts(function(x){return langOf(x);},null,"lang"));
  }
  h += '<div class="fg"><label>时间</label><select data-k="range">'+
    '<option value="all"'+(S.range==="all"?" selected":"")+'>全部</option>'+
    '<option value="90"'+(S.range==="90"?" selected":"")+'>近 90 天</option>'+
    '<option value="30"'+(S.range==="30"?" selected":"")+'>近 30 天</option>'+
    '<option value="7"'+(S.range==="7"?" selected":"")+'>近 7 天</option></select></div>';
  h += '<div class="fg"><input id="qBox" placeholder="搜索标题 / 正文 / 译文" value="'+esc(S.q)+'"></div>';
  el.innerHTML = h;
}

/* ---------------- 已选条件摘要（唯一一处） ---------------- */
var LABELS = {product:"产品线",major:"主版本",version:"版本",problem:"问题类型",model:"机型",
              grade:"审核",channel:"渠道",source:"信源",lang:"语种",range:"时间",
              stage:"环节",toolType:"工具类型"};
var CHIP_VALUE = function(k, v){
  if(k==="range") return ({"7":"近 7 天","30":"近 30 天","90":"近 90 天"})[v]||v;
  if(k==="product") return PRODUCT_NAME[v]||v;
  if(k==="problem") return PROBLEM_NAME[v]||v;
  if(k==="stage") return STAGE_NAME[v]||v;
  if(k==="toolType") return TOOLTYPE_NAME[v==="__none__"?"":v]||v;
  return v;
};
function renderSummary(hits){
  var el = document.getElementById("filterSummary"), chips = [];
  Object.keys(LABELS).forEach(function(k){
    if(S[k] && !(k==="range"&&S.range==="all")){
      chips.push('<span class="chip">'+LABELS[k]+'：'+esc(CHIP_VALUE(k,S[k]))+' <i data-clr="'+k+'">✕</i></span>');
    }
  });
  if(S.q) chips.push('<span class="chip">关键词：'+esc(S.q)+' <i data-clr="q">✕</i></span>');
  if(!chips.length){ el.innerHTML=""; return; }
  el.innerHTML = '<span>已选条件：</span>'+chips.join("")+
    '<span style="margin-left:6px">命中 <b style="color:#e6edf3">'+hits+'</b> 条</span>'+
    '<button class="clr" id="clearAllBtn">清空全部</button>';
}

/* ---------------- 明细卡片 ---------------- */
function tagsOf(it){
  var t = [];
  if(it.sourceType==="GitHub") t.push('<span class="tag t-gh">GitHub 缺陷单</span>');
  if(it.stage) t.push('<span class="tag t-stage">'+esc(STAGE_NAME[it.stage]||it.stage)+'</span>');
  if(it.problemType) t.push('<span class="tag t-'+it.problemType+'">'+esc(PROBLEM_NAME[it.problemType]||it.problemType)+'</span>');
  if(it.tool==="competitor") t.push('<span class="tag t-tool">竞品对比</span>');
  if(it.grade) t.push('<span class="tag '+(it.grade==="有效"?"t-ok":"t-gen")+'">'+esc(it.grade)+'</span>');
  if(KIND==="sw" && it.productLine) t.push('<span class="tag">'+esc(PRODUCT_NAME[it.productLine]||it.productLine)+'</span>');
  if(it.versionRaw) t.push('<span class="tag t-ver">v'+esc(it.versionRaw)+'</span>');
  if(it.model && it.model!=="未标注") t.push('<span class="tag t-model">'+esc(it.model)+'</span>');
  if(KIND==="mbox" && it.sourceType) t.push('<span class="tag '+(it.sourceType==="官方"?"t-ok":"")+'">'+esc(it.sourceType)+'</span>');
  if(it.mirrorOf) t.push('<span class="tag t-gen">同稿 · '+esc(it.mirrorOf.replace("3druck-",""))+'</span>');
  return t.join("");
}
function cardHTML(it){
  var cnT = it.titleCn || "", cnB = it.textCn || "";
  var showCn = !!(cnT || cnB);
  return '<div class="card'+(it.countInVolume===false?" ghcard":"")+(it.grade==="泛讨论"?" gencard":"")+'" data-uid="'+esc(it.uid)+'">'+
    '<div class="c-top">'+tagsOf(it)+
      '<span class="c-date">'+esc(it.date)+'</span>'+
      '<span class="c-src">'+esc(it.platform)+'</span>'+
      (it.url? '<a class="c-link" href="'+esc(it.url)+'" target="_blank" rel="noopener">原文 ↗</a>':'')+
    '</div>'+
    (cnT? '<div class="c-title">'+esc(cnT)+'</div><div class="c-title-en">'+esc(it.title)+'</div>'
        : '<div class="c-title">'+esc(it.title)+'</div>')+
    '<div class="c-seg"><span class="seg-lb">原文 · '+esc(langOf(it))+'</span>'+
      '<span class="seg-tx">'+esc(it.originalText)+'</span></div>'+
    (showCn? '<div class="c-seg"><span class="seg-lb">译文<span class="mt">机翻</span></span>'+
      '<span class="seg-tx cn">'+esc(cnB || cnT)+'</span></div>' : '')+
    (it.truncated? '<div class="cut">原文过长已截断（保留前 1,200 字），完整内容见原帖。</div>':'')+
  '</div>';
}
function renderCards(){
  var list = apply();
  var pages = Math.max(1, Math.ceil(list.length / PAGE_SZ));
  if(S.page > pages) S.page = pages;
  var start = (S.page-1)*PAGE_SZ;
  var slice = list.slice(start, start+PAGE_SZ);
  document.getElementById("cardGrid").innerHTML = slice.length
    ? slice.map(cardHTML).join("")
    : '<div class="panel"><div class="empty">当前筛选条件下没有条目。<br>试着清空条件，或把时间范围放宽。</div></div>';

  var ghN = list.filter(function(x){ return x.countInVolume===false; }).length;
  document.getElementById("countLine").textContent =
    "共 "+list.length+" 条"+(ghN? "（含 GitHub 缺陷单 "+ghN+" 条）":"")+
    " · 第 "+S.page+" / "+pages+" 页 · 每页 "+PAGE_SZ+" 条";
  document.getElementById("flowHint").textContent =
    "原文 + 译文双段 · 上下面板与这里下拉同源，选一个立即定位";

  var p = document.getElementById("pager"), h = "";
  h += '<button data-pg="'+(S.page-1)+'"'+(S.page<=1?" disabled":"")+'>上一页</button>';
  h += '<span class="pg">'+S.page+' / '+pages+'</span>';
  h += '<button data-pg="'+(S.page+1)+'"'+(S.page>=pages?" disabled":"")+'>下一页</button>';
  p.innerHTML = h;
  return list;
}

/* ---------------- 页脚 ---------------- */
function renderFoot(){
  document.getElementById("foot").innerHTML =
    (M.foot||"") + '<div style="margin-top:8px">'+ (M.sources||"") +'</div>';
}

/* ---------------- 交互 ---------------- */
function renderAll(){
  renderUpdateBar(); renderKPI(); renderPanels(); renderFilters();
  var list = renderCards(); renderSummary(list.length); renderFoot();
  console.log("[col] renderAll done, cards =", list.length);
}
function flash(){
  var cs = document.querySelectorAll(".card.flash");
  for(var i=0;i<cs.length;i++) cs[i].classList.remove("flash");
  var n = document.querySelectorAll(".card");
  for(var j=0;j<Math.min(3,n.length);j++) n[j].classList.add("flash");
}
function setFilter(k,v){
  if(k==="range"){ S.range = v; }
  else if(S[k]===v){ S[k]=""; }
  else { S[k]=v; }
  S.page=1; renderAll(); flash();
}
function pick(k,v){
  if(k!=="range" && v==="") S[k]="";
  else S[k]= (S[k]===v? "" : v);
  S.page=1; renderAll(); flash();
}
function clearAll(){
  ["product","major","version","problem","model","grade","channel","source","lang",
   "stage","toolType"].forEach(function(k){S[k]="";});
  S.range="all"; S.q=""; S.page=1; renderAll();
}

document.addEventListener("click",function(e){
  var b = e.target.closest("[data-pick]");
  if(b){ pick(b.getAttribute("data-pick"), b.getAttribute("data-val")); return; }
  var c = e.target.closest("[data-clr]");
  if(c){
    var k = c.getAttribute("data-clr");
    if(k==="q"){ S.q=""; } else if(k==="range"){ S.range="all"; } else { S[k]=""; }
    S.page=1; renderAll(); return;
  }
  var pg = e.target.closest("[data-pg]");
  if(pg){ S.page = parseInt(pg.getAttribute("data-pg"),10)||1; renderAll(); window.scrollTo({top:document.getElementById("filters").offsetTop-20,behavior:"smooth"}); return; }
  if(e.target.id==="clearAllBtn"){ clearAll(); }
});

document.addEventListener("change",function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if(k){ pick(k, e.target.value); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="qBox"){
    S.q = e.target.value.trim(); S.page=1;
    var keep = document.activeElement===e.target;
    renderAll();
    if(keep){ var box=document.getElementById("qBox"); if(box){ box.focus(); box.setSelectionRange(S.q.length,S.q.length);} }
  }
});

function boot(){
  console.log("[col] boot start", KIND, "records =", ITEMS.length);
  renderAll();
}
try{ boot(); }
catch(err){
  console.error("[col] boot failed", err);
  document.getElementById("cardGrid").innerHTML =
    '<div class="panel"><div class="empty">渲染失败：'+esc(err && err.message || err)+'</div></div>';
}
})();
</script>
